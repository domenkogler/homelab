# WireGuard client config — LAPTOP
# Split tunnel: only home LAN subnets go through VPN
# Internet traffic uses the laptop's local connection
#
# BEFORE USING:
#   Replace <laptop-private-key> with the laptop's private key
#   Replace <router-public-key>  with the router's public key
#   Replace <your-ddns-hostname> with your MikroTik DDNS hostname
#     Find it with: /ip cloud print   on the router
#
# Import: copy to /etc/wireguard/wg0.conf (Linux) or import in the WireGuard app (Windows/macOS)

[Interface]
PrivateKey = <laptop-private-key>
Address = 10.10.99.2/24
DNS = 10.10.1.1

[Peer]
PublicKey = <router-public-key>
Endpoint = <your-ddns-hostname>:13231
AllowedIPs = 10.10.1.0/24, 10.10.10.0/24, 10.10.99.0/24
PersistentKeepalive = 25