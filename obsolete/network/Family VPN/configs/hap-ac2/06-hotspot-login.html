<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Travel – Hotel Wi‑Fi Setup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .icon { font-size: 48px; margin-bottom: 8px; }
  h1  { font-size: 22px; margin-bottom: 6px; color: #222; }
  .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
  label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin-bottom: 4px;
    margin-top: 16px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #667eea; }
  button {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  .hint {
    font-size: 12px;
    color: #aaa;
    margin-top: 20px;
    line-height: 1.5;
  }
  .error {
    display: none;
    background: #fff0f0;
    color: #c0392b;
    padding: 10px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 13px;
    border: 1px solid #f5c6cb;
  }
  $(if error)<div class="error" style="display:block">$(error)</div>$(endif)
</style>
</head>
<body>

<div class="card">
  <div class="icon">🏨</div>
  <h1>Hotel Wi‑Fi Setup</h1>
  <p class="sub">Enter the hotel’s Wi‑Fi details below to get online.</p>

  <form method="post" action="$(link-login-only)" autocomplete="off">
    <label for="username">Hotel Wi‑Fi name (SSID)</label>
    <input type="text" id="username" name="username"
           placeholder="e.g. HotelFreeWiFi"
           autocomplete="off" autocorrect="off" autocapitalize="none" required>

    <label for="password">Hotel Wi‑Fi password</label>
    <input type="password" id="password" name="password"
           placeholder="e.g. hotel2024"
           autocomplete="off" required>

    <button type="submit">🔗  Connect</button>
  </form>

  <p class="hint">
    💡 <strong>Tip:</strong> The hotel Wi‑Fi name and password are usually
    written on a card at reception or on the room key card.
  </p>
</div>

</body>
</html>
