# WireGuard client config — PHONE / TABLET
# Full tunnel: ALL traffic goes through home router
# DNS also resolves through home router (10.10.1.1)
#
# BEFORE USING:
#   Replace <phone-private-key>  with the phone's private key
#   Replace <router-public-key>  with the router's public key
#   Replace <your-ddns-hostname> with your MikroTik DDNS hostname
#     Find it with: /ip cloud print   on the router
#
# Import: scan QR code or import .conf in the WireGuard mobile app

[Interface]
PrivateKey = <phone-private-key>
Address = 10.10.99.3/24
DNS = 10.10.1.1

[Peer]
PublicKey = <router-public-key>
Endpoint = <your-ddns-hostname>:13231
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25