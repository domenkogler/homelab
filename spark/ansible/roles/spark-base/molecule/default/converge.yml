- name: Converge
  hosts: all
  become: true
  vars:
    spark_nvme_device: "/dev/loop0"
    spark_nvme_partition: "/dev/loop0p1"
    spark_xfs_mount: "/mnt/spark_nvme"
    spark_models_dir: "/home/test/models"
    spark_project_dir: "/home/test/qwen-spark-stack"
    ansible_user: "test"
    xfs:
      device: "/dev/loop0p1"
      mount_point: "/mnt/spark_nvme"
      fstype: "xfs"
      mkfs_options: "-f -d agcount=4"
      mount_options: "noatime,nodiratime,logbufs=8,logbsize=256k,nobarrier"
      directories:
        - kv_cache
        - ples_int4
      permissions: "0777"
    kernel_params:
      kernel.yama.ptrace_scope: 0
      vm.max_map_count: 262144
      fs.file-max: 1000000
    systemd:
      service_name: "spark-ai"
      description: "Test Service"
      restart: "on-failure"
      start_limit_burst: 3
      start_limit_interval_sec: 60
    compose_project_name: "qwen-spark"
  roles:
    - spark-base