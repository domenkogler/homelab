---
# One-shot spark bootstrap (run BY HAND over SSH as root/privileged, ONCE per fresh host).
# Primarily a convenience wrapper around roles/spark-bootstrap + the TOFU key-pin step.
#
#   ansible-playbook -i inventory.yml spark-bootstrap-playbook.yml \
#       -e spark_bootstrap_pubkey_source=~/.ssh/id_ed25519.pub
#
# Post-run on the control machine:  ssh ansible@<spark-ip> whoami && ssh ansible@<spark-ip> sudo -n true
#
# Retry-safe: role is fail-loud (already-bootstrapped guard). NOT part of site.yml — spark-base/ai
# expect an already-bootstrapped ansible user.

- name: Spark bootstrap (one-shot) — automation user + key + sshd hardening
  hosts: spark_nodes
  gather_facts: true
  vars_files:
    - group_vars/spark_nodes.yml
    - group_vars/vault.yml  # optional; ignored if absent
  roles:
    - { role: spark-bootstrap, tags: [boot, bootstrap] }

  post_tasks:
    - name: Verify — sshd hardened (password auth off, root login off)
      become: true
      command: "sshd -T"
      register: sshd_effective
      changed_when: false
      tags: [verify]

    - name: Assert hardening
      become: true
      assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout"
          - "'permitrootlogin no' in sshd_effective.stdout"
          - "'maxauthtries 3' in sshd_effective.stdout"
        fail_msg: "sshd hardening not effective — check the 50-homelab-hardening drop-in"
      tags: [verify]

    - name: Verify — authorized_keys exactly contains the operator key
      become: true
      slurp:
        src: "/home/{{ ansible_user }}/.ssh/authorized_keys"
      register: ak
      tags: [verify]

    - name: Debug the key count
      debug:
        msg: "authorized_keys line count = {{ (ak.content | b64decode).strip().splitlines() | length }}"
      tags: [verify]

# Optional strict gate (run manually): ssh ansible@<host> whoami && ssh ansible@<host> sudo -n true