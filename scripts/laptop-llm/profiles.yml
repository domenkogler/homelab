# =====================================================================
# Laptop LLM serving profiles — THE CATALOGUE + THE DIAL  (HD-474)
#
# Runtime: LM Studio only (owner decision 2026-09-28). It is already installed, it already
# reads D:\llm\models, and it is the only runtime on this box that loads these mmproj vision
# files today. On Win11 the wrapper is not a speed variable for this APU: LM Studio's ROCm
# engines do not support gfx1150 (lmstudio-bug-tracker #883/#1903) and Ollama's Windows AMD
# list is discrete cards only, so both wrappers end up on the SAME Vulkan engine.
#
# Shape mirrors spark's dial (IaC/ansible/group_vars/spark.yml §spark_llm_profiles + the
# spark_llm_profile var in host_vars): ONE var picks the engine config, a gate refuses anything
# that cannot fit or cannot boot, and the CLIENT window is part of the profile so the harness
# cannot 400 mid-session unless someone edits this file wrongly. The laptop is not
# Ansible-managed (§5 targets the Docker fleet), so this file is the SSOT and the appliers are
# scripts/laptop-llm.py + scripts/win/lmstudio-llm.ps1.
#
# NOTHING IS HARDCODED IN THE SCRIPTS — no profile name, no path, no model identifier.
#   python3 scripts/laptop-llm.py matrix    # every profile, offline, no token
#   python3 scripts/laptop-llm.py gate      # the invariants + their canaries, offline
# =====================================================================
version: 1

# ── THE DIAL ────────────────────────────────────────────────────────────────────────────
# Valid names are exactly the keys of `profiles`. Uncertified ones need allow_uncertified: true.
# Changed 2026-09-29 (HD-474, owner): the certified agent leg is Gemma 4 26B A4B. It was
# already on disk (no 21 GB fetch), its KV is the same 20 KiB/token as the Qwen3.6 row, and
# it leaves ~11 GiB of carve margin where Qwen3.6 left ~8.75.
active: agent-gemma-26b
allow_uncertified: false

# ── HOST FACTS (the gate's ceiling reads these; §10 numbers are owner-set/measured) ──────
host:
  # BIOS "UMA video memory / GPU DRAM" carve, changed by the owner 2026-09-28. This is the whole
  # VRAM budget: on these APUs the ROCm path sees ONLY this aperture (no GTT fallback, measured
  # 60 % slower when exceeded) and the Vulkan path allocates from it too. A model that does not
  # fit here does not run slowly — it runs on the CPU or fails to load.
  gpu_carve_bytes: 34359738368            # 32 GiB
  # Held back for the desktop compositor, the WSL2 guest and activation/compute buffers.
  # MEASURED, twice, with the PDH counter
  #   \GPU Adapter Memory(luid_0x00000000_0x0001a051_phys_0)\Dedicated Usage
  # in bytes: idle desktop UNDER a load reads 2.15-2.21 GiB (2026-09-30, raw/80 phases 1-3) and
  # 3.12 GiB on 2026-09-29. The CONSTANT STAYS 3.00 GiB: the desktop figure is the floor, but
  # activation/compute buffers land on top of it during generation, and this number is only ever
  # moved by a measured reading (CONVENTIONS: never move a budget constant to make a check pass).
  # Lowering it to the 2.15 reading would buy 0.85 GiB of window and hide a real allocation.
  held_floor_bytes: 3221225472            # 3 GiB
  model_library: 'D:\llm\models'          # LM Studio's own downloadsFolder — one library, no copies
  lmstudio_home: '%USERPROFILE%\.lmstudio'
  evidence: 'docs/hardware-workstation.md §Platform (measured on-device 2026-09-27) + owner-set carve 2026-09-28'

# ── RUNTIME (CONVENTIONS §7: a version belongs in git, never in an app's auto-update) ────
runtime:
  engine: lmstudio
  # PINNED 2026-09-29 (HD-474 certification run), read three ways and all three agree:
  #   * C:\Program Files\LM Studio\resources\app\package.json  -> "version": "0.4.25+1"   (this is
  #     the string the in-app About dialog prints)
  #   * LM Studio.exe VersionInfo FileVersion/ProductVersion    -> 0.4.25+1 / 0.4.25.0
  #   * HKLM/HKCU Uninstall DisplayVersion                      -> 0.4.25+1
  # It is NOT knowable from the CLI: `lms version` prints an ANSI banner + "CLI commit: 69d945a"
  # and never the app version, which is why this pin was open before this run. LM Studio still
  # auto-updates (no Renovate datasource here — group_vars/all/versions.yml is the docker-image
  # ledger), so a version bump must come HERE first, in the same change, or the gate refuses.
  # The thing that LOOKED like a pending update is this same build: %LOCALAPPDATA%\lm-studio-updater\
  # pending\LM-Studio-0.4.25-1-win32-x64.exe, sha512 in update-info.json — 0.4.25-1 == 0.4.25+1.
  # Nothing was updated; the number below is the number that ran the probes.
  version: "0.4.25+1"
  lms_cli_commit: "69d945a"                        # what `lms version` does print (separate artifact)
  lms: '%USERPROFILE%\.lmstudio\bin\lms.exe'      # present, measured 2026-09-28
  settings: '%USERPROFILE%\.lmstudio\settings.json'
  presets: '%USERPROFILE%\.lmstudio\config-presets'   # the Modelfile equivalent (JSON per model)
  api_port: 1234                          # REST + OpenAI-compatible endpoint, one port
  # Keys the applier owns inside settings.json. It is NOT git-tracked as-is: it carries
  # hfDownloadToken/useHFProxy, so copying it into git would be a secret leak (§6).
  settings_keys:
    downloadsFolder: '{host.model_library}'
    defaultContextLength: null            # per-preset only; a global default hides a bad preset
  # MTP = multi-token-prediction speculative decoding (LM Studio 0.4.14+). Two measured
  # upstream limits decide whether it is ever on:
  #   * unsloth's own README: "--mmproj is not yet supported with MTP" → MTP and vision are
  #     MUTUALLY EXCLUSIVE in one load. One model can do both jobs, but not in the same load.
  #   * lmstudio-bug-tracker #1951: MTP "failing to initialize" / zero gain on the 35B MoE in
  #     0.4.14 beta, while the dense 9B gets 40-60 %. So on THIS architecture MTP is a maybe.
  mtp:
    default: false
    conflict: vision
  amd_notes: >-
    gfx1150 (Radeon 890M, Strix Point), Win11 + WSL2. Engine choice here is Vulkan, not ROCm.
    Measured backend split for gfx1150 (gfx1150-bench, CPU=iGPU in one SoC): Vulkan wins token
    generation (+24-48 % on quantized models), ROCm wins prefill (+4-37 %) — and ROCm is not
    available for this APU on Windows. The two levers that DO exist are the model family (MoE
    with ~3B active, not dense) and the Linux-only `power_dpm_force_performance_level=high`
    finding (~2× decode, llama.cpp discussion #27051), which needs bare metal or vfio.

# ── KV factor table (declared approximation of the engine's quantized-KV options) ────────
# Multiplier on bf16 bytes/token. The gate re-derives every profile's KV from the model row ×
# num_ctx × this factor, so a profile that claims q8_0 but is loaded as f16 is a budget lie.
#
# WHY f16 IS THE DEFAULT HERE, AND WHY THAT IS NOT AN OVERSPEND
# This architecture is cheap per token: only the 10 full-attention layers of 40 hold a KV cache
# (layout 10 × (3 × Gated DeltaNet → 1 × Gated Attention)), at 2 KV heads × head_dim 256 →
# 20 480 B/token, i.e. 20 KiB — NOT the 96 KiB/token the docs quote for the older
# Qwen3-30B-A3B family (48 layers, 4 KV heads × 128). So at 32k:
#     f16 0.63 GiB   |   q8_0 0.31 GiB   |   q4_0 0.19 GiB      (of an 18.6 GiB weight load)
# Quantizing saves ~0.3 GiB — 1.6 % of a 20 GiB budget whose scarce half is the weights. What it
# costs: llama.cpp only honours a quantized KV cache when flash attention is on, Vulkan FA on a
# hybrid-GDN arch is UNPROVEN here, and long-context recall under a quantized cache is an
# accuracy question nobody has answered on this box. Cheaper to keep the honest default and
# spend q8_0 only where it actually buys window (the 64k arm and up).
# The same logic says the FIM leg gains nothing from q8_0 (0.29 → 0.15 GiB) while putting an FA
# dependency on the latency-critical tab path — kept as the owner chose, flagged in its row.
kv_factor:
  f16: {factor: 1.00, requires: null}
  q8_0: {factor: 0.50, requires: flash_attention}
  q4_0: {factor: 0.30, requires: flash_attention}

# ── THE MODELS (structure from the published configs; LM Studio's load log confirms) ─────
models:

  # Text + vision in ONE model, per the owner's 2026-09-28 choice. Vision is real at the FILE
  # level here: the repo ships mmproj-BF16.gguf and mmproj-F32.gguf beside the weights.
  qwen36-35b-a3b-mtp:
    upstream: 'unsloth/Qwen3.6-35B-A3B-MTP-GGUF'
    quant: Q4_K_M
    # 4-bit lands at ~20 GB for this family (unsloth's own hardware table: 3-bit 16 GB /
    # 4-bit 20 GB / 6-bit 25 GB / 8-bit 31 GB / BF16 56 GB).
    weights_bytes: 20000000000
    mmproj_bytes: 1000000000              # mmproj-BF16.gguf
    # HYBRID architecture — this is where a copy-paste of the Qwen3-30B number goes wrong.
    # Published config: 40 layers, layout 10 × (3 × Gated DeltaNet → 1 × Gated Attention), so
    # only the 10 full-attention layers hold a KV cache; those are 16 Q / **2 KV** heads with
    # head_dim **256**. 2 × 10 × 2 × 256 × 2 B = 20 480 B/token = 20 KiB/token. The 30 linear
    # layers hold a constant recurrent state per sequence instead (order ~tens of MiB, not per
    # token), which is why this family tolerates long windows on a ~90 GB/s bus.
    kv_bytes_per_token: 20480
    state_bytes_per_sequence: 67108864    # 64 MiB, ⏳ derived-order estimate — confirm from the load log
    native_context_window: 262144
    active_params: '~3B of 35B (256 experts, 8 routed + 1 shared)'
    vision: mmproj
    # The fetch target layout scripts/win/lmstudio-llm.ps1 creates under the library. Before the
    # file exists the preset is incomplete, and `presets` warns instead of emitting a blind model.
    mmproj_path: 'D:\llm\models\unsloth\Qwen3.6-35B-A3B-MTP-GGUF\mmproj-BF16.gguf'
    vision_evidence: 'unsloth/Qwen3.6-35B-A3B-MTP-GGUF ships mmproj-BF16.gguf + mmproj-F32.gguf (repo file list, 2026-09-28)'
    kv_basis: 'published Qwen/Qwen3.6-35B-A3B config (40L, 10 full-attn, 2 KV heads, head_dim 256) — confirm against the engine load log'
    on_disk: false                         # NOT in D:\llm\models as of 2026-09-28: ~21 GB to fetch once

  # The FIM leg. Already on disk (1.80 GiB, lmstudio-community).
  qwen25-coder-3b-fim:
    upstream: 'lmstudio-community/Qwen2.5-Coder-3B-Instruct-GGUF'
    quant: Q4_K_M
    weights_bytes: 1929903072             # measured size of the on-disk file
    mmproj_bytes: 0
    # Qwen2 arch: 36 layers, 2 KV heads, head_dim 128 → 2 × 36 × 2 × 128 × 2 = 36 864 B/token.
    kv_bytes_per_token: 36864
    state_bytes_per_sequence: 0
    native_context_window: 32768
    active_params: 'dense 3B'
    vision: none
    identifier: 'qwen2.5-coder-3b-instruct'      # what `lms ls` reports (1.93 GB, indexed)
    vision_evidence: null
    kv_basis: 'Qwen2.5-3B config (36L / 2 KV heads / head_dim 128); docs/hardware-workstation.md independently quotes ≈36 KiB/token and "3B ≈ 1.8 GB + 0.3 GB KV @8k" — the same arithmetic'
    on_disk: true
    path: 'D:\llm\models\lmstudio-community\Qwen2.5-Coder-3B-Instruct-GGUF\Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf'
    # ⚠ docs/hardware-workstation.md:64 (decision #28 follow-up) says the FIM leg needs a
    # FIM-trained model and that "Instruct and VL variants do not do it". Qwen2.5-Coder's own
    # model card documents FIM through the chat template on the Instruct model. Unresolved on
    # paper → the fim_probe in scripts/laptop-llm.py settles it with a real cursor-shaped
    # completion. If the probe says the model echoes the cursor, go get the
    # -Python-FIM variant (docs:64) and update this row; do not ship a filler tab.
    # RESOLVED 2026-09-29 (HD-474) - the two papers were describing DIFFERENT SURFACES.
    # Measured on these D: weights, same cursor gap, three shapes:
    #   1 raw /v1/completions gap, no template ......... continues and IGNORES the suffix
    #   2 literal <|fim_prefix|>/<|fim_suffix|>/<|fim_middle|> markers in the string  echoes
    #     them back verbatim - LM Studio does not template a raw completions prompt and these
    #     GGUF weights do not carry the FIM tokens as control tokens, so the model is handed
    #     the markers as ordinary text and repeats them
    #   3 instruction + PREFIX/SUFFIX code fences (what Continue's tab provider actually
    #     sends) ..... correct infill, 3/3, e.g. 'x = a + b'
    # => docs/hardware-workstation.md 64 ('Instruct variants do not do it') is TRUE for the
    #    raw/marker surface; Qwen's card is TRUE for the templated surface. Both were right
    #    about different things, which is why the argument never closed.
    fim_surface: instruction-fenced
    fim_probe: passed
    fim_evidence: 'reports/hd474-laptop-leg/raw/40-coder-probes.txt'

  # The 23.03 GiB file that started this: text-only, whatever the model page says.
  qwen36-35b-a3b-opus-distilled:
    upstream: 'hesamation/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF'
    quant: Q5_K_M
    weights_bytes: 24729132224
    mmproj_bytes: 0
    kv_bytes_per_token: 20480             # same hybrid arch as the row above
    state_bytes_per_sequence: 67108864
    native_context_window: 262144
    active_params: '~3B active (qwen35moe)'
    vision: none
    vision_evidence: >-
      MEASURED 2026-09-28: the header carries architecture qwen35moe and NO *.vision.* keys,
      and the directory holds no sibling mmproj-*.gguf. Owner confirmed the same conclusion.
      Kept as a text-only alternative arm, not as a vision model.
    kv_basis: 'same published hybrid config as qwen36-35b-a3b-mtp'
    on_disk: true
    path: 'D:\llm\models\hesamation--Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF\Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q5_K_M.gguf'

  # Vision + long context with NOTHING to download: weights and the projector are already in the
  # library (owner's 2026-05 pulls). Numbers below are read from the GGUF header of the file on
  # D:, measured 2026-09-29, NOT from the model card.
  gemma4-26b-a4b:
    upstream: 'lmstudio-community/gemma-4-26B-A4B-it-GGUF'
    quant: Q4_K_M
    weights_bytes: 16796015040            # the file as it sits on D: (15.64 GiB)
    mmproj_bytes: 1194827744              # mmproj-gemma-4-26B-A4B-it-BF16.gguf (1.11 GiB)
    # HYBRID SLIDING-WINDOW ARCH, and the header is the only honest source for it.
    # 30 layers; gemma4.attention.sliding_window_pattern = [1,1,1,1,1,0, ...] so 5 layers are
    # GLOBAL (5, 11, 17, 23, 29) and 25 are bounded by sliding_window = 1024. Only the 5 global
    # layers carry per-token KV, and THEY use head_count_kv = 2 with key_length 512 (the windowed
    # layers use 8 heads x 256 and are window-bounded). So:
    #     2 * 5 global * 2 kv-heads * 512 * 2 B = 20 480 B/token = 20 KiB
    # which is the SAME 20 KiB/token the Qwen3.6 row derives by a different route (Gated DeltaNet).
    # Do not copy the 240 KiB figure you get by multiplying 30 layers x 8 heads x 256 - that
    # assumes every layer holds full-sequence KV at the wider head count, and it is 12x wrong.
    kv_bytes_per_token: 20480
    # The windowed layers are not free, they are just BOUNDED: 25 layers x 2 x 8 heads x 256 x 2 B
    # x 1024-token window = 200 MiB per sequence, constant with context length. Counted as state.
    state_bytes_per_sequence: 209715200
    native_context_window: 262144
    active_params: '~3.8B of 25.2B (128 experts, 8 routed + shared)'
    vision: mmproj
    identifier: 'google/gemma-4-26b-a4b'          # what `lms ls` reports; the agent leg does NOT use
                                          # this row - it loads the no-mmproj twin above
    mmproj_path: 'D:\llm\models\lmstudio-community\gemma-4-26B-A4B-it-GGUF\mmproj-gemma-4-26B-A4B-it-BF16.gguf'
    vision_evidence: 'mmproj-gemma-4-26B-A4B-it-BF16.gguf sits beside the weights in the library (verified on disk 2026-09-29)'
    kv_basis: 'gemma4 GGUF header on D: (sliding_window_pattern, head_count_kv, key_length 512 / key_length_swa 256, sliding_window 1024) - read from the file 2026-09-29'
    on_disk: true
    path: 'D:\llm\models\lmstudio-community\gemma-4-26B-A4B-it-GGUF\gemma-4-26B-A4B-it-Q4_K_M.gguf'
    # Sampling comes from the file too: general.sampling.temp 1.0 / top_p 0.95 / top_k 64.
    fim_surface: null
    fim_probe: not-applicable

  # The SAME WEIGHT BYTES, loaded without the projector. `lms load` has no vision flag in 0.4.25
  # (--gpu --identifier -c -y --parallel --ttl --estimate-only --speculative-* are all of them) and
  # the adapter attaches simply because a sibling mmproj-*.gguf sits in the folder - so the only way
  # to take the vision tower off the agent leg is a folder WITHOUT the file. Made with
  # `lms import --hard-link`: zero extra disk (verified - same inode as the row above,
  # 5764607523036758544, both 16 796 015 040 B), and `lms ls` indexes it as
  # `gemma-4-26b-a4b-textonly`. WHY: images belong to the Qwen leg (owner ruling 2026-09-29), and
  # this Gemma build KILLS THE ENGINE on any image whose long side exceeds ~1120 px, so advertising
  # eyes here is a crash button, not a feature. Projector cost measured at 32k idle: 1.11 GiB.
  gemma4-26b-a4b-textonly:
    upstream: 'domen/gemma-4-26b-a4b-textonly'          # hard-linked copy of the row above
    quant: Q4_K_M
    weights_bytes: 16796015040            # same bytes, same inode as gemma4-26b-a4b (15.64 GiB)
    mmproj_bytes: 0                       # THE POINT OF THE ROW: no adapter, no ViT, no crash path
    kv_bytes_per_token: 20480             # identical architecture, so identical KV arithmetic
    state_bytes_per_sequence: 209715200
    native_context_window: 262144
    active_params: '~3.8B of 25.2B (128 experts, 8 routed + shared)'
    vision: none
    mmproj_path: null
    identifier: 'gemma-4-26b-a4b-textonly'   # what `lms ls` reports and `lms load` accepts
    vision_evidence: >-
      NONE by construction, not by omission. The folder holds no mmproj-*.gguf. Measured ceiling of
      the sibling vision row: images with a long side above ~1120 px kill the engine
      (STATUS_STACK_BUFFER_OVERRUN 3221226505, server answers {"error":"terminated"}) on TWO weight
      files, so this leg is text-only by evidence as well as by budget
      (reports/hd474-laptop-leg/raw/62,64,66 + the must-fail probe in raw/88-certify.txt).
    kv_basis: 'same gemma4 GGUF header as gemma4-26b-a4b (5 global layers x 2 KV heads x 512) - the
      weights are the same file'
    on_disk: true
    path: 'D:\llm\models\domen\gemma-4-26b-a4b-textonly\gemma-4-26B-A4B-it-Q4_K_M.gguf'
    fim_surface: null
    fim_probe: not-applicable

  # THE VISION LEG (HD-476, owner ruling 2026-09-29: two legs, one GPU - Gemma thinks, this one
  # looks). Numbers are read from the GGUF header of the file on D: with
  # reports/hd474-laptop-leg/raw/gguf_hdr.py (qwen3vlmoe, 48 blocks, 4 KV heads, key_length 128,
  # context_length 262144, NO sliding window, NO vision keys in the main file - the tower lives in
  # the sibling mmproj) and measured on this engine, not from the model page.
  qwen3vl-30b-a3b:
    upstream: 'unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF'
    quant: UD-Q4_K_XL
    weights_bytes: 17715664608            # 16.50 GiB, measured on D: (17.72 GB decimal)
    mmproj_bytes: 1087039168              # mmproj-BF16.gguf, 1.01 GiB (NOT mmproj-F32, 2.29 GB)
    # 48 layers x 4 KV heads x head_dim 128, no sliding window:
    #     2 (K+V) * 48 * 4 * 128 * 2 B = 98 304 B/token = 96 KiB
    # which is 5x Gemma's 20 KiB/token and the reason this leg is the one that cannot share the
    # carve: 96 KiB x 32 768 = 3.0 GiB of KV, and nothing else fits next to it.
    kv_bytes_per_token: 98304
    state_bytes_per_sequence: 0           # dense-attention MoE: every layer's cost is per token
    native_context_window: 262144
    active_params: '~3B of 30B (128 experts, 8 routed; header: expert_used_count 8)'
    vision: mmproj
    mmproj_path: 'D:\llm\models\unsloth\Qwen3-VL-30B-A3B-Instruct-GGUF\mmproj-BF16.gguf'
    vision_evidence: >-
      MEASURED 2026-09-30 on this engine: the untouched 8160x6120 / 10.6 MB rack photo was accepted
      (prompt_tokens 4060, engine still IDLE afterwards) and OCR'd 'CRS328-24P-4S+RM', 'CAT6' and
      'PATCH CABLE 4PAIR ISO/IEC11801 TIA/EIA568B' - corroborated against
      docs/network-rack.md, which lists that exact model string. That is ground truth, not a
      caption. Every size that kills the Gemma leg (1280x960, 2000x160, 8160x6120) this one takes.
      reports/hd474-laptop-leg/raw/72,73 + the re-run in raw/88-certify.txt.
    kv_basis: 'qwen3vlmoe GGUF header on D: (block_count 48, attention.head_count_kv 4,
      attention.key_length 128, no sliding-window key) - read from the file 2026-09-30'
    on_disk: true
    identifier: 'qwen3-vl-30b-a3b-instruct'
    path: 'D:\llm\models\unsloth\Qwen3-VL-30B-A3B-Instruct-GGUF\Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf'
    fim_surface: null
    fim_probe: not-applicable

# ── PROFILES ────────────────────────────────────────────────────────────────────────────
# Each profile resolves a model + an engine config + a CLIENT contract. The client_* fields are
# what scripts/pi-config/models-spec.yml and Continue's config must carry: a client window above
# num_ctx is exactly the defect prompt-llm.md §6 warns about (pi 400s mid-session).
profiles:

  # Default. Text + vision from one resident model, which is what removes the
  # docs/hardware-workstation.md:137 "unload the agent, load the VL model" dance.
  # Budget (binary GiB, what the script prints): 18.63 weights + 0.93 projector + 0.63 KV(f16,
  # 32k) + 0.06 GDN state + 3.00 held floor = 23.25 of 32 GiB ⇒ 8.75 GiB margin. f16 KV is the
  # default for the reason in the kv_factor header: 0.31 GiB of savings is not worth an
  # unproven flash-attention dependency on a Vulkan/hybrid-GDN combination.
  agent-unified:
    label: 'Qwen3.6-35B-A3B Q4_K_M + mmproj, f16 KV, 32k — text AND vision in one load'
    model: qwen36-35b-a3b-mtp
    num_ctx: 32768
    kv_cache_type: f16
    flash_attention: false
    mtp: false                            # MUST stay false here: --mmproj and MTP conflict
    offload_layers: max                   # LM Studio's GPU-offload slider
    env_extra: {}
    reasoning_surface: binary
    client_context_window: 32768
    client_max_tokens: 8192
    input: [text, image]
    sampling_params: {temperature: 0.6, top_p: 0.95, top_k: 20}
    capabilities: [tool]
    tool_probe: pending
    vision_probe: pending                 # one real image; the ONLY thing that makes input:[image] true
    certified: false
    uncertified_reason: >-
      Never booted on this box. Open: tool-call reliability of this build, image prefill cost on
      16 CU (HD-401 gate 4 — "mmproj offloaded to iGPU" is assumed nowhere), and the fact that
      the weights are not on disk yet (~21 GB one-time fetch into the library).
    certified_evidence: null

  # Faster text arm, MTP speculative decoding on, vision unavailable in this load.
  # The two profiles are the same model: switching is an engine config change, not a download,
  # and never a second resident model (OLLAMA_MAX_LOADED_MODELS does not exist here — LM Studio
  # caps loaded models in its own settings; the applier asserts one loaded model at a time).
  agent-unified-mtp:
    label: 'Qwen3.6-35B-A3B Q4_K_M, MTP speculative decoding ON — text only (--mmproj unsupported with MTP)'
    model: qwen36-35b-a3b-mtp
    num_ctx: 32768
    kv_cache_type: f16
    flash_attention: false
    mtp: true
    mtp_draft_tokens: 2                   # unsloth's own example uses --spec-draft-n-max 2
    offload_layers: max
    env_extra: {}
    reasoning_surface: binary
    client_context_window: 32768
    client_max_tokens: 8192
    input: [text]
    sampling_params: {temperature: 0.6, top_p: 0.95, top_k: 20}
    capabilities: [tool]
    tool_probe: pending
    certified: false
    uncertified_reason: >-
      lmstudio-bug-tracker #1951: MTP "failing to initialize" with ZERO speedup on the 35B MoE
      in 0.4.14 beta (the dense 9B got 40-60 %). Enable it only after a measured A/B on this
      model — a speculative decoder that never accepts a draft costs you the verify pass.
    certified_evidence: null

  # MEASURED 2026-09-30 (raw/90-speed.txt, `probe-speed --ttft` against real repo prose, thinking
  # ON because this server cannot switch it off, max_tokens 256):
  #   prompt_tokens   cold TTFT   prefill    decode    warm TTFT (prefix-cache hit)
  #   2 462           9.63 s      256 t/s    21.1 t/s  0.30 s
  #  10 610          69.42 s      153 t/s    18.3 t/s  0.38 s
  #  31 137        1806.83 s       17 t/s     8.3 t/s  (not run)
  # Two things that are not in any model card: decode FALLS with context (21 -> 18 -> 8 t/s), and
  # cold prefill of the SAME 10 610-token prompt measured 259 s once and 69 s another time - 3.7x,
  # corroborating raw/80's 277-899 s spread. Plan around the prefill, not the page.
  # The owner's chosen agent leg (2026-09-29), CERTIFIED BY MEASUREMENT 2026-09-30 (HD-474/477).
  # TEXT-ONLY, and that is an evidence decision, not a simplification: this Gemma build dies
  # (engine exit 3221226505 = STATUS_STACK_BUFFER_OVERRUN, server {"error":"terminated"}) on any
  # image whose long side exceeds ~1120 px, reproduced on two weight files and on a 2000x160 strip
  # that has a QUARTER of the pixels of a passing 1280x960 - so the trigger is max side length, and
  # the failure mode is a dead runtime, not a refused request. Images go to `vision-qwen3vl-30b`.
  # Loading the hard-linked no-mmproj copy is what makes the budget honest: the projector would
  # otherwise cost 1.11 GiB resident for a capability the profile does not advertise.
  # Budget (binary GiB): 15.64 weights + 0 projector + 0.62 KV(f16, 32k) + 0.20 window state
  # + 3.00 held floor = 19.46 of 32 GiB => +12.54 margin. MEASURED against that: 18.87 GiB of PDH
  # dedicated GPU memory with a 2.21 GiB idle desktop under it (raw/80 phase 3), i.e. 16.66 GiB of
  # model - the arithmetic was 0.2 GiB pessimistic, which is the right direction to be wrong.
  agent-gemma-26b:
    label: 'Gemma 4 26B A4B Q4_K_M, TEXT-ONLY (no projector), f16 KV, 32k - the agent leg'
    model: gemma4-26b-a4b-textonly
    num_ctx: 32768
    kv_cache_type: f16
    flash_attention: false
    mtp: false                            # no MTP story for this family; that is the trade vs Qwen3.6
    offload_layers: max
    parallel: 1                           # measured load shape (`--parallel 1`); one sequence
    env_extra: {}
    reasoning_surface: binary
    client_context_window: 32768
    client_max_tokens: 8192
    input: [text]                         # see the 1120 px ruling above; do not add image here
    sampling_params: {temperature: 1.0, top_p: 0.95, top_k: 64}   # from general.sampling.* in the file
    capabilities: [tool]
    tool_probe: passed                    # 2026-09-30 on THIS load: well-formed tool_calls, no
                                          # tool_choice sent (0.4.25 400s on it) - raw/88-certify
    vision_probe: not-applicable          # input is [text]. Not a shrug: the SERVER enforces it.
                                          # probe-vision against this load returns HTTP 400
                                          # "agent-gemma-26b does not support image inputs" in 0 s
                                          # because no projector is attached - the loud failure.
    certified: true                       # HD-474, 2026-09-30: tools, three real prompt shapes,
                                          # recall at 28 984 tokens, and the image ceiling measured
    uncertified_reason: null
    certified_evidence: 'reports/hd474-laptop-leg (raw/62-80, raw/88-certify.txt, raw/90-speed.txt)'

  # THE VISION LEG (HD-476). Same GPU, same carve, NEVER resident at the same time as the agent leg:
  # 96 KiB/token means 32k alone is 3.0 GiB of KV on top of 16.50 GiB of weights and 1.01 GiB of
  # projector, and the adapter only attaches to a load that has room for it.
  # Budget: 16.50 + 1.01 + 3.00 KV(f16, 32k) + 0 + 3.00 floor = 23.51 of 32 GiB => +8.49 margin.
  # Measured PDH dedicated memory at this load: 23.92 GiB of a ~24 GiB adapter (raw/ctx32k.out),
  # which is why the rule is one resident model, not "two fit".
  # COST OF AN IMAGE, from the same capture: the untouched 8160x6120 rack photo = 4060 prompt_tokens
  # and 66 s, i.e. image prefill at 61.2 t/s. A full-resolution photo does not belong in a long
  # conversation: 8 of them are a third of the window and ~9 minutes of prefill.
  # COST OF AN IMAGE, measured again 2026-09-30 (raw/88, raw/91, raw/92): 4042-4060 prompt_tokens
  # and 61-72 s for the untouched 8160x6120 photo, 937 tokens / 13.6 s for the 1120 px variant.
  # AND THE CACHE RULE that came out of raw/92: asking the SAME question twice on the same image
  # costs 2.0 s the second time, while any NEW question re-pays the full ~60 s - because the text
  # part sits BEFORE the image in the message, so changing it invalidates the cached image tokens.
  # A cascade that asks several questions of one photo must put the image first, or freeze the
  # question; otherwise it pays prefill per question. docs/hardware-workstation.md §Leg 2 seam 1.
  vision-qwen3vl-30b:
    label: 'Qwen3-VL-30B-A3B-Instruct UD-Q4_K_XL + mmproj-BF16, f16 KV, 32k - the vision leg'
    model: qwen3vl-30b-a3b
    num_ctx: 32768
    kv_cache_type: f16                    # owner declined q8_0 here (2026-09-30), and q8_0 would
                                          # need flash_attention, unproven for this arch on Vulkan
    flash_attention: false
    mtp: false                            # MTP and --mmproj do not coexist (unsloth README)
    offload_layers: max
    parallel: 1
    env_extra: {}
    reasoning_surface: none               # Instruct build: no thinking channel
    client_context_window: 32768
    client_max_tokens: 8192
    input: [text, image]
    sampling_params: {temperature: 0.7, top_p: 0.8, top_k: 20}   # general.sampling.* in the GGUF
    capabilities: [tool]
    tool_probe: passed                    # 2026-09-30, raw/88-certify.txt
    vision_probe: passed                  # 2026-09-30: it SEES the rack (CAT6 x3, the 1..24 port
                                          # numbering, 'Cloud Router Switch', a CRS3xx model) on the
                                          # untouched 8160x6120 photo, 4042-4060 prompt_tokens in
                                          # 61-72 s. SEE ALSO THE TRANSCRIPTION CAVEAT BELOW - it
                                          # does not read a part number reliably.
    vision_caveat: >-
      NOT a transcription instrument at the SKU level, measured not assumed: asked the same
      targeted question five times (three at the file's sampling, twice greedy at temperature 0)
      it answered 'CRS326-24G-2S+RM' five times and 'CRS326-24P-2S+RM' once, while
      docs/network-rack.md U15 records 'CRS328-24P-4S+' with a label photo behind it
      (docs/assets/images/CRS328.png). Greedy agreement rules out sampling noise, so this is
      perception, not luck. The 2026-09-29 note that it OCR'd CRS328 verbatim is therefore NOT
      reproducible and the doc's label photo, not the model, stays the authority. Use this leg for
      judgment and structure; verify any transcribed identifier against the inventory.
    certified: true                       # HD-476, 2026-09-30
    uncertified_reason: null
    certified_evidence: 'reports/hd474-laptop-leg (raw/68,72,73, ctx32k.out, raw/88-certify.txt, raw/91,92)'

  # The 64k arm — the ONLY place a quantized KV cache earns its keep: q8_0 saves 0.63 GiB here
  # (1.25 → 0.63), which is what makes 64k fit with margin. Same weights, same projector.
  # Budget: 18.63 + 0.93 + 0.63 KV + 0.06 + 3.00 = 23.25 of 32 ⇒ 8.75 GiB margin.
  agent-unified-64k:
    label: 'Qwen3.6-35B-A3B Q4_K_M + mmproj, q8_0 KV, 64k — UNCERTIFIED (KV quant unproven here)'
    model: qwen36-35b-a3b-mtp
    num_ctx: 65536
    kv_cache_type: q8_0
    flash_attention: true                 # q8_0 KV is honoured only with FA on; UNPROVEN on Vulkan+GDN
    mtp: false
    offload_layers: max
    env_extra: {}
    reasoning_surface: binary
    client_context_window: 65536
    client_max_tokens: 8192
    input: [text, image]
    sampling_params: {temperature: 0.6, top_p: 0.95, top_k: 20}
    capabilities: [tool]
    tool_probe: pending
    vision_probe: pending
    certified: false
    uncertified_reason: 'q8_0 KV accuracy never measured on this model, and it requires flash attention, which is unproven for this arch on Vulkan; 64k prefill latency never measured on 16 CU.'
    certified_evidence: null

  # FIM stays SEPARATE by design (decision #28: the laptop's legs are FIM + visual judgment;
  # generation is spark's or external). It is also the only profile that may be resident
  # *alongside* a text profile: 1.8 GiB + 0.15 GiB KV is nothing, but the docs warn three
  # resident models leak slots, and LM Studio unloads on switch anyway.
  fim-coder-3b:
    label: 'Qwen2.5-Coder-3B-Instruct Q4_K_M, q8_0 KV, 8k — Continue tab completion'
    model: qwen25-coder-3b-fim
    num_ctx: 8192
    kv_cache_type: q8_0                   # owner's choice 2026-09-28; saves 0.15 GiB (0.29 → 0.15)
    flash_attention: true                 # required by the KV quant — and it puts an FA dependency
                                          # on the tab-completion path for 0.15 GiB. f16 is the
                                          # safer default here; flip this back if tab latency moves.
    mtp: false
    offload_layers: max
    env_extra: {}
    reasoning_surface: none
    client_context_window: 8192           # Continue's contextMessageLimit must stay under this
    client_max_tokens: 1024
    input: [text]
    sampling_params: {temperature: 0.2, top_p: 0.9, top_k: 40}
    capabilities: [insert]                # Continue vendor, NOT a pi chat model
    tool_probe: not-applicable
    fim_probe: passed                     # 2026-09-29 surface-dependent; see fim_surface +
                                        # fim_evidence. ONLY on the instruction-fenced shape.
    certified: false
    uncertified_reason: >-
      docs/hardware-workstation.md:64 requires a FIM-trained model and claims Instruct variants
      "do not do it"; Qwen2.5-Coder's card documents chat-template FIM on Instruct. Unresolved
      on paper — run scripts/laptop-llm.py probe-fim against a real Continue-shaped cursor.
      Trigger latency must also be measured (HD-401 gate 5: sub-second is an assumption). And the
      q8_0 KV the owner asked for needs flash attention for a 0.15 GiB saving on the latency-
      critical path — measure both, then pick.
    certified_evidence: null

# ── vision_policy (measured 2026-09-28 — why "it has vision files" is not proof) ─────────
# * A GGUF carries vision EITHER fused in the one file OR as a sibling mmproj-*.gguf. Read the
#   keys, never the model page: the local 35B-A3B Q5_K_M has NEITHER, so there was nothing to
#   "split" and nothing to load.
# * LM Studio loads the projector (llama.cpp --mmproj) and it works for these arches today.
# * Ollama does not have a projector instruction at all — the documented Modelfile set is FROM,
#   PARAMETER, TEMPLATE, SYSTEM, ADAPTER, LICENSE, MESSAGE. `ADAPTER mmproj` 500s (#15346), two
#   FROM lines hang (#17491), and the qwen35moe arch was unknown to its vendored llama.cpp
#   (#14730/#15898) until PR #15899 + #16031 (llama-server as the sole GGUF engine). So the
#   split-file route is plausible at a recent Ollama and unproven here — another reason the
#   runtime is LM Studio.
# * MTP and --mmproj do not coexist yet (unsloth README), so vision costs the MTP speedup.
vision_policy:
  allow_probeless_image_claim: false
  # MEASURED CEILING (2026-09-30, raw/62,64,66 + this session's re-run): the gemma4 vision tower on
  # this Vulkan build dies above ~1120 px on the LONG SIDE - 320/640/896/1120 answer, 1280 and even
  # a 2000x160 strip kill the engine. It is not the quant, not the file, not the pixel count. The
  # qwen3vl tower takes 8160x6120 untouched. So a client that can pick either leg must be told the
  # rule in the contract: images at a Gemma leg need a resize first, and this box does not have a
  # Gemma leg any more - `agent-gemma-26b` is input: [text] precisely so that the crash is not
  # reachable from the picker.

# ── client contract pointers (what probe-client drift-checks against) ────────────────────
# The pi provider row and the Continue rows live in scripts/pi-config/models-spec.yml — ONE spec
# for every client (HD-388). This block only names WHERE the laptop's rows are so the drift check
# can find them without hardcoding identifiers in the script.
client:
  pi_provider: laptop-lmstudio
  # Must name the row for the ACTIVE profile: probe-client drift-checks the active profile against
  # THIS row, and pi 400s mid-session when the two disagree. Switching the dial means switching this
  # pointer in the same commit. The row id is the profile name because that is what `--identifier`
  # makes the server serve; the vision leg's row is `vision-qwen3vl-30b` (one GPU, one resident leg).
  pi_model: agent-gemma-26b

# ── reuse_contract: why nothing downloads twice ─────────────────────────────────────────
# 1. ONE library, one home. settings.json.downloadsFolder points at D:\llm\models, which is
#    where the 152 GB GGUF library already lives. LM Studio dedupes by content within a session
#    and never re-derives what is already on disk; LM Studio and any future runtime read the
#    same files, so "install" is an idempotent file move, not a download.
# 2. HOME IS C:\Users\domen\.lmstudio but the *weight bytes* live on D:. A Windows reinstall or
#    a profile reset can therefore never orphan 150 GB of models — the pointer file
#    .lmstudio-home-pointer is the only thing that has to come back.
# 3. The applier verifies-by-size against the library manifest before fetching anything, so a
#    partial download is reported instead of silently re-fetched, and a finished download is
#    reported as already-there.
