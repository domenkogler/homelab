# scripts/lib/seat-planes.yml — the seat × plane set, declared ONCE (HD-1118 Stage 2)
#
# WHY ONE FILE: the plane set used to exist three times — `planes_for_seat()` in
# pi-seat-sync.sh, the config stage of install-pi-debian.sh, and the config stage of
# install-pi-wsl.sh — and the three had silently diverged. Two of the divergences were
# live defects, both found by reading them against each other (prompt-scripts.md Stage 2):
#
#   1. install-pi-debian.sh's `check()` ran three planes as `--check 2>&1 | tail -2` —
#      NO `--strict`, and the pipe's exit status thrown away, so `bad` was never set.
#      A from-zero seat could therefore be reported GREEN with three planes never checked,
#      while the same installer's `--push` DID run them.
#   2. Its `check()` never ran `install-tmux-conf.sh --check` at all, although `--push`
#      does — the HD-1085 gap in the *check* half, after the push half was closed.
#
# A seat can now be reported green only by the same registry that converges it, because
# both halves read this file. The axis that makes that true is `install_check:` — the
# strict form the installer's `--check` uses (a plane with no `install_check:` is checked
# with `check:`).
#
# FORMAT: `---`-separated records, one flat `key: value` per line, no nesting. It is valid
# YAML for any tool AND parsed by lib/pi-seat.sh without a YAML library — deliberate: the
# readers are bash on a bare Debian seat, where PyYAML exists only inside ~/ansible-venv
# and a seat must not need the control-node venv to learn its own plane list. lib/pi-seat.sh
# --self-test refuses a record that is malformed, unknown-keyed, or names an owner that
# does not exist, so the subset cannot drift into something a real YAML parser would read
# differently.
#
# FIELDS
#   plane          the name the driver prints in its verdict column
#   harness        which harness the plane belongs to: `pi` (the pi.dev harness) or `all`.
#                  Declared NOW because the models spec already renders a second harness
#                  (`vendors: continue:` in pi/models-spec.yml): the next harness should be
#                  a row here, not a restructure of three files.
#   owner          the script that OWNS the plane, by file name (resolved under scripts/**,
#                  so Stage 3's folder moves need no edit here — this file must not become a
#                  second copy of the tree)
#   runner         how to invoke it: bash | python3 | powershell
#   check/push     arguments for the fan-out driver
#   install_check  arguments the seat installer's `--check` uses (defaults to `check`)
#   seats          which seats the plane applies to (win11 | wsl | oldsrv)
#   installer      which from-zero installers converge it (debian | wsl)
#
# `seats` and `installer` are separate axes on purpose: the cockpit carries a seat-local
# package that the fleet settings SSOT must not start owning, and a from-zero Debian box is
# not the `oldsrv` seat until it is one.
#
# Readers: scripts/harness/pi-seat-sync.sh (the fan-out), scripts/harness/install-pi-debian.sh and
# scripts/harness/install-pi-wsl.sh (the config stage), scripts/lib/pi-seat.sh (the reader itself).
# Owning doc: docs/harness-pi-seats.md §1 (the plane set) / docs/harness-pi-seats.md §5 (what the harness is).

---
plane: pi-self
harness: pi
owner: pi-self-update.sh
runner: bash
check: --check --strict
push: --push
seats: win11 wsl oldsrv
installer: debian cockpit wsl

---
plane: skills
harness: pi
owner: sync-skills.sh
runner: bash
check: --check
install_check: --check --strict
push: --push
seats: win11 wsl oldsrv
installer: debian cockpit wsl

---
plane: extensions
harness: pi
owner: sync-extensions.sh
runner: bash
check: --check --strict
push: --push
seats: win11 wsl oldsrv
installer: debian cockpit wsl

---
plane: settings
harness: pi
owner: pi-settings-config.sh
runner: bash
check: --check --strict
push: --push
seats: win11 wsl
installer: debian wsl

---
# The cockpit placement, not a fleet settings key (docs/services-ai.md §9b-1): pi-web is
# installed there by roles/seat, so the driver declares it HERE rather than teaching the
# settings SSOT about one seat.
plane: settings
harness: pi
owner: pi-settings-config.sh
runner: bash
check: --check --strict --with-package npm:@ygncode/pi-web
push: --push --with-package npm:@ygncode/pi-web
seats: oldsrv
installer: cockpit

---
plane: models
harness: all
owner: render-pi-config.py
runner: python3
check: --vendor all --check
push: --vendor all
seats: win11 wsl oldsrv
installer: debian cockpit wsl

---
plane: tui
harness: pi
owner: pi-tui-config.sh
runner: bash
check: --check --strict
push: --push
seats: win11 wsl oldsrv
installer: debian cockpit wsl

---
plane: tmux
harness: all
owner: install-tmux-conf.sh
runner: bash
check: --check --strict
push: --push
seats: wsl oldsrv
installer: debian cockpit wsl

---
plane: font
harness: all
owner: install-nerd-font.sh
runner: bash
check: --check --strict
push: --push
seats: wsl oldsrv
installer: debian cockpit wsl

---
plane: subagent
harness: pi
owner: pi-subagent-config.sh
runner: bash
check: --check --strict
push: --push
seats: win11 wsl oldsrv
installer: debian cockpit wsl

---
# The Windows leg of the SAME plane: a font changes what a TERMINAL rasterises, and on
# Windows `~/.local/share/fonts` rasterises nothing, so the placement is the per-user font
# API (docs/harness-pi-seat-identity.md §5a). One plane, two placements.
plane: font
harness: all
owner: install-nerd-font.ps1
runner: powershell
check: -Check
push: -Push
seats: win11
installer: none

---
# The seat's MODEL-LANE PATH plane (docs/network-dns.md §Host-side resolver). The inference name is
# pinned to the inference host's Home IPv4 in the seat's hosts file while a TCP connect to that
# address on the https port answers, and the pin is REMOVED when it stops answering — so the seat takes
# the LAN path when the LAN path works and the ordinary answer plane when it does not. One name on one
# seat: the zone rows, the netmap and the policy are outside this plane, which is what keeps every other
# name answering exactly as it does today. `wsl` only, and `installer: none` because the push half
# writes a root-owned file — a from-zero bootstrap converging a HOME cannot converge `/etc/hosts`, and
# failing a bootstrap on a file it must not touch would be the wrong lesson.
#
# The plane's RE-ASSERT ARM is not a row here and gets no key of its own: `seat-llm-path-timer.sh`
# renders and installs the unit pair that re-runs this record's `push:` after the distro regenerates
# `/etc/hosts`. The fields above describe what the fan-out runs per seat; a timer runs on ONE seat on
# systemd's clock, not the driver's, so a key for it would be a second source about a plane this reader
# never fans out — and the reader's own rule is that one that guesses is worse than one that stops.
plane: llm-path
harness: all
owner: seat-llm-path.sh
runner: bash
check: --check --strict
push: --push
seats: wsl
installer: none

---
# The seat's RESOLVER-ROUTE plane (docs/network-dns.md §Host-side resolver): the `resolved.conf.d` uplink
# drop-in, the `homelab-dns-route` unit pair, and the per-link claim that keeps a public `NXDOMAIN` for an
# internal `*.kogler.si` name from being cached against the NAME for the zone's SOA minimum (1800 s). The
# four artifacts were live state on one box with no repo owner, which is why a reimaged seat came back
# leaking; this row is the owner they never had.
#
# `wsl` only, and that is MEASURED rather than inferred: the oldsrv cockpit seat runs `systemd-resolved`
# INACTIVE with no `resolvectl` at all, and its `/etc/resolv.conf` is NetworkManager-generated and points
# at the home resolvers. The per-link claim is an act ON `resolved`, and that seat has no `resolved` to act
# on — a row for it there could only ever report MISSING, which is the mute-a-gate class this repo keeps
# meeting, so the plane is declared where the mechanism exists.
#
# `installer: none`, for the same reason the `llm-path` row says it: this arm's act is root-owned unit files
# plus a resolver act, and a from-zero bootstrap converging a HOME must not enable a systemd timer or
# reconfigure a resolver. A bootstrap that failed on files it has no business writing would teach the wrong
# lesson; the arm is landed on the seat by one root command, and the fan-out's push leg runs `--push`, which
# is the same act the timer's ExecStart runs and the only thing that PROVES the claim (read-back, because
# `resolvectl` exits 0 even when resolved refuses).
plane: dns-route
harness: all
owner: seat-dns-route.sh
runner: bash
check: --check --strict
push: --push
seats: wsl
installer: none
