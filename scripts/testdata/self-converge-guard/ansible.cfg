# Fixture-local Ansible config — deliberately NOT the repo IaC/ansible/ansible.cfg.
# The repo cfg pins `inventory = inventory.ini` and `roles_path = roles` relative to the
# cwd; inheriting it here would let the REAL roles resolve for these fake role names, which
# is precisely the failure a safety fixture must not have.
[defaults]
host_key_checking = False
retry_files_enabled = False
gathering = explicit
nocows = 1
interpreter_python = auto_silent
deprecation_warnings = False
localhost_warning = False
stdout_callback = default
