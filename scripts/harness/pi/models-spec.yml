# =====================================================================
# Client model contract — ONE spec, rendered per vendor. This file is the SSOT; the reasoning
# behind every value is docs/harness-pi-models.md (§4 the pi vendor, §4b the Continue vendor,
# §4c the hosted rows).
#
# Render with:
#     python3 scripts/harness/render-pi-config.py --check   # drift gate, writes nothing
#     python3 scripts/harness/render-pi-config.py           # write vendor files, mode 0600
# A rendered client file is never hand-edited: a hand-copied JSON shared by several clients is a
# drift generator with no gate, and the render is what turns that drift into a non-zero exit.
#
# NO CREDENTIAL LIVES HERE. `credential:` names a 1Password item/field and the renderer resolves
# it at render time (`op`), so the value never enters git, the spec, or a log (CONVENTIONS §6).
# The rendered file DOES carry the key, so it is 0600 and never committed.
#
# WHY A CLIENT NEEDS THIS FILE AT ALL (do not "solve" it by pointing clients at the gateway): a
# client cannot read its own model contract out of LiteLLM — pi has no `model_info` consumer, and a
# generation harness reaches the engine directly (docs/services-ai.md §9 decision #26).
# Distribution is the lever, not the proxy.
#
# ORDER IS PART OF THE CONTRACT: spec order == render order. Reordering is a deliberate,
# diff-visible act, not tidying.
# =====================================================================
version: 1

vendors:
  pi:
    out: ~/.pi/agent/models.json
  pi_auth:
    # pi's OTHER credential file: auth for the built-in providers (openrouter, opencode-go).
    # No trailing newline in the render — that is what pi writes, and byte-identity is what proves
    # taking over a hand-kept credential file does not disturb a working client.
    out: ~/.pi/agent/auth.json
  continue:
    # A SEPARATE generated file, never merged into a workstation's own config: a generated block
    # written over user-authored keys is a data-loss bug. Wiring it in (@-import or merge) is a
    # per-machine step and is NOT verified by the renderer — docs/harness-pi-models.md §4b.
    # It lives under ~/.continue/, not ~/.pi/agent/: this is not a pi artifact, and a stray
    # generated file in the agent directory gets read by the agent.
    out: ~/.continue/homelab-models.generated.yaml

providers:
  # `entrim_api` (Homelab-ansible) is this provider's credential source, so the render is managed:
  # no `unmanaged:` flag, no `--keep-legacy-credentials`. The vault `credential` and a hand-kept
  # client's `providers.entrim.apiKey` hash identically (25 bytes, sha256 prefix bb9d9eb1f6 — the
  # item's row is docs/deployment-secrets.md), which is what makes adopting the render a no-op.
  - id: entrim
    description: hosted Entrim API (external, cost-bearing)
    # ⚠ SELECTABLE IS NOT AUTHORIZED. These rows exist so an EXTERNAL leg is possible at all; nothing
    # here authorizes using one. An external model runs only on the owner's explicit word in the
    # session — never as a fallback when spark is busy, slow, or down, and never to "justify" a bench
    # number (there is no entrim bench and none is wanted: the external lane is not a spare GPU).
    # Rule: root README.md §3; rationale: docs/harness-pi-models.md §4c.
    baseUrl: https://api.entrim.ai/v1
    api: openai-completions
    credential:
      vault: Homelab-ansible
      item: entrim_api
      field: credential
    models:
      # WHAT DECIDES THESE ROWS: the endpoint's own `GET /v1/models`, not a doc page and not memory.
      # It is the only source that cannot lag the provider, and it answers with `max_input_tokens` /
      # `max_output_tokens` per row — the two numbers this file has to get right. Read it with the
      # rendered key (the value never reaches the transcript):
      #     curl -s -H "Authorization: Bearer $(op read op://Homelab-ansible/entrim_api/credential </dev/null)" \
      #          https://api.entrim.ai/v1/models
      # A row whose id is NOT in that list is a dead pick: it stays selectable and answers
      # `400 Invalid model name`. Retire on the catalog, in the same change that lands the
      # successor, and never leave a row that cannot be served. A row can also be served but
      # unlisted — that is a heads-up, not a removal trigger.
      # `input:`/`reasoning:`/`thinkingLevelMap:` come from probes against the live endpoint, never
      # from a vendor claim; the probe shapes and their pass criteria are the table in
      # docs/harness-pi-models.md §4c. Usage arrives in the final stream chunk, so pi's ctx % and
      # compaction trigger work on the default `supportsUsageInStreaming` — no `compat:` block is
      # needed or claimed.
      - id: deepseek-ai/DeepSeek-V4.1-Flash-1017
        name: Entrim DeepSeek V4.1 Flash
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 393216
        # Owner-supplied published rates, USD per million tokens — the unit pi's `cost` wants. A row
        # WITHOUT `cost:` prices a paid external call at zero in `/usage` and in the footer, which is
        # worse than an honest unknown because it looks measured. `cacheWrite: 0` is a stated fact, not
        # a guess: this lane caches implicitly and publishes a read price and no write tier.
        cost: {input: 0.20, output: 0.60, cacheRead: 0.005, cacheWrite: 0}
        # `off` is the ONE level worth mapping: `reasoning_effort: "none"` produced zero reasoning
        # tokens and a direct answer, so the switch is real. The graded levels are accepted verbatim
        # (all 200), so they need no entry — a map that restates pass-through only invites someone to
        # "fix" the numbers later.
        # ⚠ The key is QUOTED, and it is load-bearing: YAML 1.1 resolves bare `off`/`on`/`yes`/`no` to
        # booleans, so an unquoted `off:` reaches the render as the JSON key `"false"` — pi then finds
        # no `off` entry, sends no `reasoning_effort`, and thinking stays on while the map looks
        # perfectly correct in the spec — and `--check` stays green, because spec and target then
        # carry the same wrong key. Quote the key.
        thinkingLevelMap:
          "off": "none"
        continue: {capabilities: [tool, reasoning]}
      - id: zai-org/GLM-5.3-Flash
        name: Entrim GLM-5.3-Flash
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 131072
        cost: {input: 0.10, output: 0.35, cacheRead: 0.0175, cacheWrite: 0}
        # NO `off:` key, deliberately: this endpoint accepts `reasoning_effort: "none"` with a 200
        # and then thinks anyway — the reasoning phase eats the whole response budget and answers
        # with empty `content`. A map entry would advertise a thinking-off state the endpoint cannot
        # produce, and a user who selects it gets silence (docs/harness-pi-models.md §4c). Levels
        # minimal…max are all accepted; `off` is not a state here.
        continue: {capabilities: [tool, reasoning]}
      # The catalog's 27B row. Replacing a row that still answers is an owner call, probed like any
      # other row (docs/harness-pi-models.md §4c).
      - id: Qwen/Qwen3.8-27B
        name: Entrim Qwen3.8-27B
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        maxTokens: 65536
        # Probed like the rows above (docs/harness-pi-models.md §4c): `tool`, `image` and streaming
        # usage all pass, and `reasoning_effort: "none"` answers with zero reasoning tokens, so the
        # `off` mapping is real on this row too. Reasoning is ON by default.
        thinkingLevelMap:
          "off": "none"
        cost: {input: 0.10, output: 0.40, cacheRead: 0.04, cacheWrite: 0}
        continue: {capabilities: [tool, reasoning]}

  - id: spark
    description: self-hosted vLLM on the GB10 workstation, reached through the `llm` router
    baseUrl: https://llm.kogler.si/v1
    api: openai-completions
    credential:
      vault: Homelab-ansible
      item: spark-llm_api
      field: credential
    compat:
      supportsUsageInStreaming: true
      supportsFinishReason: true
      maxTokensField: max_tokens
      supportsDeveloperRole: true
      supportsReasoningEffort: false
      supportsStrictMode: false
      thinkingFormat: qwen-chat-template
      thinkingTokenBudgetField: thinking_token_budget
    models:
      - id: spark/qwen3.8-flash-next
        name: Qwen 3.8 Flash Next (spark GB10, 262k)
        reasoning: true
        input: [text]
        # ⚠ contextWindow here is the ENGINE ceiling and is deliberately NOT the LiteLLM row's
        # number. 262144 = the servable per-request `max_model_len` of the running engine
        # (docs/harness-pi-engines.md §3). The gateway row is `max_input_tokens: 245760` = that same
        # window MINUS a 16 384 reserve, because the proxy adds the reply to the request. A template
        # that "harmonises" the two breaks one of the two callers.
        contextWindow: 262144
        maxTokens: 16384
        # Binary on purpose: this Qwen template reasons on EVERY turn unless told otherwise
        # (docs/harness-pi-engines.md §2) and `reasoning_effort` is accepted-but-ignored by this
        # engine build, so the graded levels collapse to on/off — null = off, a value = the budget.
        thinkingLevelMap:
          minimal: null
          low: null
          medium: null
          xhigh: null
          max: null
        samplingParams:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        # Recorded so the two windows cannot be silently merged by a future editor, and so the
        # gateway row has a named twin. NOT rendered into any vendor file.
        gateway_row:
          max_input_tokens: 245760
          max_output_tokens: 16384
          note: 245760 + 16384 = 262144, engine window minus reserve
        continue:
          # What the Continue.dev vendor gets. Keep its knobs in step with `compat` above, or
          # write down why they differ.
          capabilities: [tool, reasoning]

  # The laptop's own LM Studio leg. `hosts:` scopes it: the renderer drops any provider whose host
  # list does not match the machine rendering, because this same spec also renders the oldsrv
  # cockpit — where http://127.0.0.1:1234 is THAT machine's own loopback. A dead provider in the
  # picker is worse than no provider.
  #
  # baseUrl is loopback ON PURPOSE. WSL2 runs networkingMode=Nat and that is deliberate:
  # 127.0.0.1 inside the Linux guest is the GUEST, so this provider is `native_only` and serves
  # pi.dev running ON Win11. The alternative — the NAT gateway address — is an IP literal that moves
  # when the NAT range moves. `scripts/bench/laptop-llm.py probe-health` fails loudly if the server
  # is not on loopback; it never guesses an address, and nothing here reconfigures /etc/wsl.conf to
  # make a WSL probe pass.
  #
  # The engine ceiling, the KV budget and the thinking surface live in
  # scripts/bench/laptop/profiles.yml, and `scripts/bench/laptop-llm.py probe-client` FAILS if this
  # block drifts from the active profile. What this provider offers is the laptop's TWO legs — vision
  # and FIM — each row carrying the window its leg actually boots; the measurements behind them are
  # docs/hardware-workstation.md §Served leg. No agent model lives here: a generation harness reaches
  # spark directly (docs/services-ai.md §9 decisions #26 and #28), so this provider neither proxies
  # that leg nor falls back to it.
  - id: laptop-lmstudio
    description: local LM Studio server on the admin laptop (iGPU, 32 GiB carve) — loopback, no cost
    # `socket.gethostname()` on this seat answers `Domen_P14s`. It is written `domenp14s` here
    # because host_norm() (render-pi-config.py) ignores case and `_`/`-`/`.` — one spelling has to
    # satisfy both the renderer and `probe-client`.
    hosts: [domenp14s]
    # Native Windows only, and this is the load-bearing line of the whole client contract: WSL2 on
    # this box stays networkingMode=Nat because it is configured that way deliberately, so
    # 127.0.0.1 inside the Linux guest is the GUEST. Local models are therefore served to pi.dev
    # running ON Win11, and this provider must not render into the WSL picker, where it would be a
    # dead endpoint. Hostname alone cannot tell the two seats apart — both report `Domen_P14s` —
    # hence a flag, not a name.
    native_only: true
    baseUrl: http://127.0.0.1:1234/v1
    api: openai-completions
    # The server ignores this; pi still requires a non-empty value before it will call a model.
    # 14 chars, under check_secrets.py's ignorable() floor (<16), and it is a placeholder rather
    # than a credential: there is no vault item because a loopback listener has nothing to keep
    # secret. If the server is ever exposed beyond loopback, it gets a real token and a `credential:`.
    apiKey: lmstudio-local
    compat:
      supportsUsageInStreaming: true
      supportsFinishReason: true
      maxTokensField: max_tokens
      supportsDeveloperRole: true
      supportsReasoningEffort: false
      supportsStrictMode: false
    models:
      # ONE GPU, ONE RESIDENT LEG, TWO ROWS. The served id is the PROFILE NAME in
      # scripts/bench/laptop/profiles.yml (`lms load ... --identifier <profile>`), because /v1/models
      # must list exactly what pi sends and a hand-kept identifier is a second copy that drifts. JIT
      # loading is OFF on this install, so only the RESIDENT leg answers: the picker shows the vision
      # row and it is dead until `lmstudio-llm.ps1 switch -Profile vision-qwen3vl-30b` moves the GPU.
      # That trade is deliberate — a dead row is loud (400 "model not loaded"), a silently-wrong one
      # is not, and `probe-client` checks residency because this endpoint does not police the `model`
      # field. The rules are written where the picker is described: docs/hardware-workstation.md
      # §Served leg.
      - id: vision-qwen3vl-30b
        name: Local Qwen3-VL-30B-A3B-Instruct (laptop iGPU, vision, 32k)
        reasoning: false
        input: [text, image]
        contextWindow: 32768
        maxTokens: 8192
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        # COST OF AN IMAGE, measured on this engine: the untouched 8160x6120 rack photo = 4060
        # prompt_tokens and 66 s of prefill (61.2 t/s). This is the box's only vision surface, and
        # eight full-resolution photos are a third of this window and ~9 minutes of
        # prefill — describe once, freeze the text (docs/hardware-workstation.md §Leg 2, seam rule 1).
        continue: {capabilities: [tool]}
      - id: qwen/qwen2.5-coder-3b-instruct
        name: Local Qwen2.5-Coder-3B (laptop iGPU, FIM, 8k)
        reasoning: false
        input: [text]
        contextWindow: 8192
        maxTokens: 1024
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        # Continue's tab-completion model, NOT a pi chat model: `insert`, and it must never be
        # picked as a harness brain. This is the laptop's half of decision #28
        # (docs/hardware-workstation.md §Leg 1); the other half, generation, stays spark's.
        continue: {capabilities: [insert]}

# pi's provider auth file (vendor `pi-auth`). Same rule as everywhere else in this repo: the spec
# NAMES the item, the renderer resolves the value at render time, no key material in git.
# The render is a no-op on a working machine only while the vault holds the value the file already
# carries — the values published 2026-10-27 are openrouter 2466ffdfc7 / 73 B and opencode-go_api
# 767310bb25 / 51 B, so a provider rotation makes the next render an event on every seat rather than
# a takeover of a hand-kept file.
auth:
  - provider: openrouter
    type: api_key
    credential: {vault: Homelab-ansible, item: openrouter_api, field: credential}
  - provider: opencode-go
    type: api_key
    credential: {vault: Homelab-ansible, item: opencode-go_api, field: credential}

# Workstation-local keys are NOT here and must not be added: harness-pi-seats.md §5 keeps theme,
# packages, lastChangelogVersion and the rest of settings.json on the machine. This spec renders
# the *model contract* only — that boundary is what lets a laptop and a cockpit share a render
# without carrying someone's editor taste, or a token, from one to the other.
