# =====================================================================
# Client model contract — ONE spec, rendered per vendor (HD-388).
#
# Why this file exists: the harness contract used to be a hand-maintained
# ~/.pi/agent/models.json on one laptop, which `scripts/install-pi-wsl.sh` refuses to sync
# ("Provider/auth config ... is NOT auto-synced") and which docs/pi-harness.md §1 had to call
# its own "reference copy" because it carries a bearer key. The moment a second client exists
# (a second workstation, the cockpit on oldsrv under HD-409, a `spark-lane` profile, a
# Continue.dev in VS Code) a hand-copied JSON is a drift generator with no gate.
#
# This is the SSOT. Render with:
#     python3 scripts/render-pi-config.py --check       # drift gate, writes nothing
#     python3 scripts/render-pi-config.py                # write vendor files, mode 0600
#
# NO CREDENTIAL LIVES HERE. `credential:` names a 1Password item/field and the renderer
# resolves it at render time (`op`), so the value never enters git, the spec, or a log
# (CONVENTIONS §6). The rendered file DOES carry the key, so it is 0600 and never committed.
#
# WHY A CLIENT NEEDS THIS AT ALL (do not "solve" it by pointing clients at the gateway): a client
# cannot read its own model contract out of LiteLLM — pi has no `model_info` consumer, and
# decision #26 routes generation harnesses direct to the engine (services-ai.md §9d).
# Distribution is the lever, not the proxy.
#
# ORDER IS PART OF THE CONTRACT: spec order == render order, and the order below reproduces the
# live hand-kept file byte-for-byte, so the first render is provably a no-op. Reordering is a
# deliberate, diff-visible act, not tidying.
# =====================================================================
version: 1

vendors:
  pi:
    out: ~/.pi/agent/models.json
  pi_auth:
    # pi's OTHER credential file: auth for the built-in providers (openrouter, opencode-go), which
    # was pure hand-kept drift with nothing in git describing it. No trailing newline in the render —
    # that is what pi writes, and byte-identity is what proves taking over a hand-kept credential
    # file does not disturb a working client.
    out: ~/.pi/agent/auth.json
  continue:
    # A SEPARATE generated file, never merged into a workstation's own config: a generated block
    # written over user-authored keys is a data-loss bug. Wiring it in (@-import or merge) is a
    # per-machine step and is NOT verified by the renderer — docs/pi-harness.md §4b.
    # It lives under ~/.continue/, not ~/.pi/agent/: this is not a pi artifact, and a stray
    # generated file in the agent directory gets read by the agent (learned on the first run).
    out: ~/.continue/homelab-models.generated.yaml

providers:
  # Credential source exists as of 2026-09-23 (owner minted `entrim_api` in Homelab-ansible) and the
  # render was proven against the hand-kept file: the vault `credential` and the laptop's live
  # `providers.entrim.apiKey` hash identically (25 bytes, sha256 prefix bb9d9eb1f6 — see the row in
  # docs/deployment-secrets.md). So this provider is managed: no `unmanaged:` flag, no
  # --keep-legacy-credentials needed.
  - id: entrim
    description: hosted Entrim API (external, cost-bearing)
    baseUrl: https://api.entrim.ai/v1
    api: openai-completions
    credential:
      vault: Homelab-ansible
      item: entrim_api
      field: credential
    models:
      - id: deepseek-ai/DeepSeek-V4-Flash
        name: Entrim DeepSeek v4 Flash
        contextWindow: 1000000
        maxTokens: 384000
        input: [text]
        continue: {capabilities: [tool]}
      - id: Qwen/Qwen3.6-27B
        name: Entrim Qwen3.6-27B
        contextWindow: 262000
        maxTokens: 131072
        input: [text]
        continue: {capabilities: [tool]}

  - id: spark
    description: self-hosted vLLM on the GB10 workstation, reached through the `llm` router
    baseUrl: https://llm.kogler.si/v1
    api: openai-completions
    credential:
      vault: Homelab-ansible
      item: spark-llm_api
      field: credential
    compat:
      supportsUsageInStreaming: true
      supportsFinishReason: true
      maxTokensField: max_tokens
      supportsDeveloperRole: true
      supportsReasoningEffort: false
      supportsStrictMode: false
      thinkingFormat: qwen-chat-template
      thinkingTokenBudgetField: thinking_token_budget
    models:
      - id: spark/qwen3.8-flash-next
        name: Qwen 3.8 Flash Next (spark GB10, 262k)
        reasoning: true
        input: [text]
        # ⚠ contextWindow here is the ENGINE ceiling and is deliberately NOT the LiteLLM row's
        # number. 262144 = the servable per-request `max_model_len` measured off the running
        # engine (HD-376). The gateway row is `max_input_tokens: 245760` = that same window MINUS
        # a 16 384 reserve, because the proxy adds the reply to the request. A template that
        # "harmonises" the two breaks one of the two callers. Measured, not tidied: HD-376.
        contextWindow: 262144
        maxTokens: 16384
        # Binary on purpose: this Qwen template reasons on EVERY turn unless told otherwise
        # (23–121 hidden reasoning_tokens/turn measured in HD-376) and `reasoning_effort` is
        # accepted-but-ignored by this engine build, so the graded levels collapse to on/off —
        # null = off, a value = the budget.
        thinkingLevelMap:
          minimal: null
          low: null
          medium: null
          xhigh: null
          max: null
        samplingParams:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        # Recorded so the two windows cannot be silently merged by a future editor, and so the
        # gateway row has a named twin. NOT rendered into any vendor file.
        gateway_row:
          max_input_tokens: 245760
          max_output_tokens: 16384
          note: 245760 + 16384 = 262144, engine window minus reserve (HD-382 / HD-376)
        continue:
          # What the Continue.dev vendor gets. Keep its knobs in step with `compat` above, or
          # write down why they differ.
          capabilities: [tool, reasoning]

  # The laptop's own LM Studio leg (HD-474). `hosts:` scopes it: the renderer drops any provider
  # whose host list does not match the machine rendering, because this same spec also renders the
  # cockpit on oldsrv (HD-409) — where http://127.0.0.1:1234 is THAT machine's own loopback. A dead
  # provider in the picker is worse than no provider, and a provider rendered onto the wrong box is
  # exactly the silent-drift class HD-388 exists to kill.
  #
  # baseUrl is loopback ON PURPOSE. WSL2 runs networkingMode=Nat and that is deliberate (owner
  # 2026-09-29): 127.0.0.1 inside the Linux guest is the GUEST, so this provider is `native_only`
  # and serves pi.dev running ON Win11. The alternative — the NAT gateway address — is an IP literal
  # that moves when the NAT range moves, and a spec holding a moving IP is how a laptop breaks on a
  # Tuesday. `laptop-llm.py probe-health` fails loudly if the server is not on loopback; it never
  # guesses an address, and nothing here reconfigures /etc/wsl.conf to make a WSL probe pass.
  #
  # The engine ceiling, the KV budget and the thinking surface all live in
  # scripts/laptop-llm/profiles.yml; `laptop-llm.py probe-client` FAILS if this block drifts from
  # the active profile. The two laptop rows below are MEASURED legs as of 2026-09-30
  # (HD-474/HD-476) — the windows each one actually booted, with the tok/s, TTFT and GiB behind them
  # in reports/hd474-laptop-leg/README.md. The FIM row stays declared-but-unmeasured for now.
  - id: laptop-lmstudio
    description: local LM Studio server on the admin laptop (iGPU, 32 GiB carve) — loopback, no cost
    # MEASURED on the seat 2026-09-30: `socket.gethostname()` returns `Domen_P14s`. It is written
    # `domenp14s` here because host_norm() (render-pi-config.py) ignores case and `_`/`-`/`.` — and
    # because before that matcher existed, this row's spelling did not match the machine and BOTH
    # the renderer (provider dropped) and probe-client (SKIP instead of a check) failed silently.
    hosts: [domenp14s]
    # Native Windows only, and this is the load-bearing line of the whole client contract (owner
    # decision 2026-09-29, after the first draft assumed WSL): WSL2 on this box stays
    # networkingMode=Nat because it is configured that way deliberately, so 127.0.0.1 inside the
    # Linux guest is the GUEST. Local models are therefore served to pi.dev running ON Win11, and
    # this provider must not render into the WSL picker, where it would be a dead endpoint. Hostname
    # alone cannot tell the two seats apart — both report `Domen_P14s` (measured 2026-09-30; this
    # line used to say `DomenP14s`, and that one underscore is why host_norm() exists) — hence a
    # flag, not a name.
    native_only: true
    baseUrl: http://127.0.0.1:1234/v1
    api: openai-completions
    # The server ignores this; pi still requires a non-empty value before it will call a model.
    # 14 chars, under check_secrets.py's ignorable() floor (<16), and it is a placeholder rather
    # than a credential: there is no vault item because a loopback listener has nothing to keep
    # secret. If the server is ever exposed beyond loopback, it gets a real token and a `credential:`.
    apiKey: lmstudio-local
    compat:
      supportsUsageInStreaming: true
      supportsFinishReason: true
      maxTokensField: max_tokens
      supportsDeveloperRole: true
      supportsReasoningEffort: false
      supportsStrictMode: false
    models:
      # TWO ROWS, ONE GPU. The served id is the PROFILE NAME in scripts/laptop-llm/profiles.yml
      # (`lms load ... --identifier <profile>`), because /v1/models must list exactly what pi sends
      # and a hand-kept identifier is a second copy that drifts. JIT loading is OFF on this install,
      # so only the RESIDENT leg answers: the picker shows both rows and exactly one of them is dead
      # until `lmstudio-llm.ps1 switch -Profile <name>` moves the GPU. That trade is deliberate — a
      # dead row is loud (400 "model not loaded"), a silently-wrong one is not. The expensive mistake
      # is sending an image to the text row, so the rule is written where the picker is described:
      # docs/hardware-workstation.md §Served leg.
      - id: agent-gemma-26b
        name: Local Gemma 4 26B A4B (laptop iGPU, text-only, 32k)
        # reasoning true: gemma4 thinks into reasoning_content and this server cannot switch thinking
        # off (chat_template_kwargs / enable_thinking are IGNORED by LM Studio 0.4.25 — all four
        # spellings measured 2026-09-30). A client that budgets 80 tokens gets an EMPTY `content`
        # back and concludes the model is broken. It is not: budget >= 1024.
        # input [text] ONLY — not because the weights are blind, but because this build dies
        # (STATUS_STACK_BUFFER_OVERRUN, engine exit 3221226505) on any image whose long side exceeds
        # ~1120 px. Image input here would be a crash button, so the client is not given one.
        reasoning: true
        input: [text]
        contextWindow: 32768
        maxTokens: 8192
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        continue: {capabilities: [tool]}
      - id: vision-qwen3vl-30b
        name: Local Qwen3-VL-30B-A3B-Instruct (laptop iGPU, vision, 32k)
        reasoning: false
        input: [text, image]
        contextWindow: 32768
        maxTokens: 8192
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        # COST OF AN IMAGE, measured on this engine: the untouched 8160x6120 rack photo = 4060
        # prompt_tokens and 66 s of prefill (61.2 t/s). This leg takes everything the Gemma leg
        # cannot, but eight full-resolution photos are a third of this window and ~9 minutes of
        # prefill — describe once, freeze the text (docs/hardware-workstation.md §Leg 2, seam rule 1).
        continue: {capabilities: [tool]}
      - id: qwen/qwen2.5-coder-3b-instruct
        name: Local Qwen2.5-Coder-3B (laptop iGPU, FIM, 8k)
        reasoning: false
        input: [text]
        contextWindow: 8192
        maxTokens: 1024
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        # Continue's tab-completion model, NOT a pi chat model: `insert`, and it must never be
        # picked as a harness brain. This is the laptop's half of decision #28
        # (docs/hardware-workstation.md §Leg 1); the other half, generation, stays spark's.
        continue: {capabilities: [insert]}

# pi's provider auth file (vendor `pi-auth`). Same rule as everywhere else in this repo: the spec
# NAMES the item, the renderer resolves the value at render time, no key material in git.
# Proven 2026-09-23: both vault `credential` values hash-match what the laptop's live auth.json
# already holds (openrouter 5ceea2ce6c / 73 B, opencode-go 9f31a67976 / 67 B) — so adopting the
# render is a no-op on a working machine, which is the only safe way to take over a hand-kept file.
auth:
  - provider: openrouter
    type: api_key
    credential: {vault: Homelab-ansible, item: openrouter_api, field: credential}
  - provider: opencode-go
    type: api_key
    credential: {vault: Homelab-ansible, item: opencode-go, field: credential}

# Workstation-local keys are NOT here and must not be added: pi-harness.md §5 keeps theme,
# packages, lastChangelogVersion and the rest of settings.json on the machine. This spec renders
# the *model contract* only — that boundary is what lets a laptop and a cockpit share a render
# without carrying someone's editor taste, or a token, from one to the other.
