{
  "default_account": "default",
  "default_user": "probe",
  "default_agent": "pi-probe",
  "storage": {
    "workspace": "/home/domen/ovprobe/data"
  },
  "embedding": {
    "dense": {
      "provider": "litellm",
      "model": "openai/bge-m3-vk",
      "api_base": "http://10.10.1.30:4000/v1",
      "api_key": "${LITELLM_KEY}",
      "dimension": 1024,
      "input": "text",
      "encoding_format": "float",
      "batch_size": 4
    },
    "max_concurrent": 4,
    "max_input_tokens": 1200,
    "text_source": "content_only"
  },
  "vlm": {
    "provider": "litellm",
    "model": "openai/spark/qwen3.8-flash-next",
    "api_base": "http://10.10.1.30:4000/v1",
    "api_key": "${LITELLM_KEY}",
    "timeout": 300,
    "max_concurrent": 3,
    "extra_request_body": {
      "chat_template_kwargs": {
        "enable_thinking": true
      }
    },
    "media": {
      "enabled": false
    }
  },
  "rerank": {
    "provider": "litellm",
    "model": "jina_ai/local-rerank",
    "api_base": "http://10.10.1.30:4000/v1",
    "api_key": "${LITELLM_KEY}",
    "threshold": 0,
    "max_input_tokens": 1200,
    "timeout": 60
  }
}
