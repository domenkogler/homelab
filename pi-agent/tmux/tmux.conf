# managed-by: scripts/install-tmux-conf.sh  (repo SSOT: pi-agent/tmux/tmux.conf)
# Do NOT edit ~/.tmux.conf by hand — edit this file, then re-run that script with
# --push. A hand edit here is caught by --check (drift) and by validate-all.sh.
#
# tmux seat config — mouse + system clipboard (OSC 52). Plugin-free (no TPM).
# Proven on oldsrv (Debian 13, headless, tmux 3.5a) attached over SSH from a laptop
# terminal, where pi.dev runs inside tmux; written for any Debian seat.
#
# IMPORTANT: a tmux config that errors mid-load leaves the DEFAULTS standing and
# still returns exit 0 (measured: one bad command anywhere in the file -> mouse off,
# history-limit 2000; the nested wrapped `if-shell { } { }` form below is one such
# shape, a plain wrapped block is not). Never trust a reload's exit code — read the
# options back with: bash scripts/install-tmux-conf.sh --verify. Keep every command
# on ONE physical line; that shape is measured good.

# ─── General ────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -s escape-time 10                  # low Esc latency for TUIs (pi, vim)
set -g focus-events on                 # TUIs notice focus/attach changes
set -g history-limit 100000            # something for the wheel to scroll
setw -g mode-keys vi                   # vi keys in copy-mode

# ─── Mouse ──────────────────────────────────────────────────────────────────
# set -g mouse on gives, out of the box:
#   left-click pane      -> focus pane            drag pane border -> resize
#   left-click status    -> switch window         wheel on status  -> prev/next window
#   drag in pane         -> select + copy         double/triple-click -> copy word/line
#   right-click          -> pane/window menu      middle-click     -> paste tmux buffer
#   wheel in normal pane -> enter copy-mode and scroll history
#   wheel over a TUI that grabs the mouse (pi, vim, htop) -> passed through raw
set -g mouse on

# Wheel step in copy-mode: 5 lines per notch (explicit; matches tmux default).
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# Toggle mouse off/on without editing this file (mouse capture can get in the
# way of some apps). Also: hold SHIFT while dragging to use the terminal's own
# native selection instead of tmux's.
bind m set -g mouse \; display -p 'mouse: #{?mouse,ON,OFF}'

# The OPTIONAL bindings below are COMMENTED OUT partly for that reason: as live
# nested wrapped blocks they were the defect that made this whole file inert.

# OPTIONAL: full-screen apps that use the alternate screen but do NOT enable
# mouse reporting (some TUIs) — wheel events get passed through and translated
# to arrow keys instead of entering copy-mode. Uncomment if that suits pi.dev
# better than scrolling tmux history.
# bind -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if-shell -F "#{alternate_on}" { send-keys -M } { select-pane -t = \; copy-mode -e \; send-keys -M } }
# bind -T root WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if-shell -F "#{alternate_on}" { send-keys -M } { send-keys -M } }

# ─── Clipboard (OSC 52, the only option on a headless box) ──────────────────
# oldsrv has no xclip/xsel/wl-clipboard and the clipboard lives on the laptop,
# so copy/paste must travel as OSC 52 escape sequences through SSH.
#
# tmux refuses to emit OSC 52 unless the terminal it talks to advertises the
# "Ms" terminfo capability. The distro's tmux-256color entry has none, so
# clipboard sync is silently dead. Declare Ms by hand:
set -g terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'

# "on" = write the outer clipboard whenever a buffer changes, and also let
# programs inside tmux (pi.dev, vim, yank helpers) set it via their own OSC 52.
set -s set-clipboard on

# Drag-select ends the selection and leaves copy-mode, pushing to tmux buffer
# AND the laptop clipboard.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Paste:
#   prefix ]   -> tmux buffer          middle-click -> tmux buffer
#   Shift+Insert / laptop paste -> outer terminal sends text in as keystrokes
bind C-v choose-buffer                 # browse previous selections

# ─── Reload / verify ────────────────────────────────────────────────────────
# Do not hand-reload this file: run  bash scripts/install-tmux-conf.sh --reload
# (it sources the file AND reads the options back — a config that errors mid-load
# still returns exit 0 and leaves the defaults standing). Ad-hoc checks:
#   tmux show -g mouse            -> mouse on
#   tmux show -s set-clipboard    -> set-clipboard on
#   tmux show -g terminal-overrides | grep Ms
# Clipboard end-to-end test:  prefix : set-buffer "clip-test"  -> should appear
# in the laptop clipboard. If not, the OUTER terminal blocks OSC 52:
#   xterm        -> xterm*allowWindowOps: true
#   GNOME/VTE    -> VTE >= 0.60
#   kitty/wezterm/foot/alacritty/moba/xshell -> usually on by default, check docs
