      the INT4 path so the arm changes one thing); the mmap path is measured in tier 2.
    certified_evidence: ""

  u2-blk:
    <<: *u_x
    label: "t1 — u1-patch + block rejection sampling (spec method, one delta)"
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_overlay: true
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    spec_config:
      method: mtp
