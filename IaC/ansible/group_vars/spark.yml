    cudagraph_piecewise: true
    prompt_tokens_details: true
    artifact_sets: [b1-awq, ple-int4]
    fixed_cost_bytes: 86900000000
    fixed_cost_basis: "MEASURED, inherited from `reasoning` (identical weights); ⚠ 8 seqs + capture-8 is exactly the term measured as STRANDED graph memory — this arm must record `nvidia-smi --query-compute-apps` per-pid MiB at REST or the delta is uninterpretable"
    uncertified_reason: >-
      Upstream runs --max-num-seqs 8; our house value is 4 because capture sizes above the
      decode batch are unreachable and strand memory in the single pool (docs/spark-incidents.md).
      Here capture is raised WITH the batch, so the invariant still holds —
