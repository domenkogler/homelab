    certified_evidence: ""

  u3-s8:
    <<: *u_x
    label: "t1 — u2-blk + 8 concurrent seqs + piecewise CUDA graphs (batch/shape, one delta)"
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_overlay: true
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    max_num_seqs: 8
    max_cudagraph_capture_size: 8
