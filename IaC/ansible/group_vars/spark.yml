    never_evict_prompt: *nev            # "" — the ONE value; pin-capable lineage only
    never_evict_max_fraction: "0.03"  # this arm keeps its own recorded 0.03 cap
    artifact_sets: [b1-awq, ple-int4]
    fixed_cost_bytes: 86900000000
    fixed_cost_basis: "MEASURED, inherited from `reasoning` (identical weights); the pin cap (0.03) is charged INSIDE the declared pool, so it cannot raise the host hold"
    uncertified_reason: >-
      The never-evict patch lets a prompt substring PIN its KV blocks (≤ 25 % of the pool by
      default), which is the direct answer to the 0 %-prefix-hit re-prefill we measure on
      every long session (docs/hardware-spark.md §Unified-memory budget: 162 k-token session,
      0 % hit, 17,008 tok/s re-prefill). ⚠ AUTHORED WITH A PLACEHOLDER ON PURPOSE: the gate
      refuses any args_extra containing CHANGEME, because a pinned substring that matches
      nothing is an invisible no-op and one that matches everything is a pool leak. Fill it
      with a literal substring of the harness system prompt (scripts/harness/pi), not a guess.
