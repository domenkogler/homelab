    max_model_len: 262144
    artifact_sets: [ar-hybrid, ple-fp8]
    fixed_cost_bytes: 76300000000
    fixed_cost_basis: "VENDOR-PUBLISHED, NOT measured here: upstream v16b reports ~71 GiB model residency with 16 GB KV and a 16.5 GiB low-water. Replace with OUR engine's 'Available KV cache memory' line on first boot — do not inherit `reasoning`'s 86.9 GB, these are different weights"
    uncertified_reason: >-
      Baseline of the tier-2 ladder with speculative decode OFF (the drafter-free checkpoint
      has no T80 drafter directory, and inventing an MTP config for it would silently change
      two things at once). Everything downstream of this arm adds exactly one thing.
    certified_evidence: ""

  fast:
    <<: *u_x
    label: "CERTIFIED — AR AutoRound-hybrid + FP8 mmap + MTP3-block (winner; ex ar-blk)"
    models_root: os
    model_subdir: Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid
    ple_offload: false
    ple_overlay: false
    ple_host_base: models
    ple_host_root: os
    ple_host_subdir: ple-table-fp8
    ple_container_dir: /ple-table
    ple_staged_marker: ".hf-staged"
    ple_mmap: true
    ple_dispatch: true
    # Per-profile allowance (roles/spark-llm-profile compares THIS, not the global, when a
    # profile declares it). The CERTIFIED global `spark_llm_pool_ceiling_bytes` stays 16 GiB —
    # hardware-spark.md §Chosen governor "do not raise it further" — so every other profile is still gated at
    # 16 GiB and this arm's bigger pool is visible as a deliberate, named exception.
    # 20 GB is the LARGEST 1-GB-rounded pool that still leaves the watchdog's WARN band
    # (12 GiB) of host reserve at rest: pool_max = device_hold_ceiling_bytes − fixed_cost_bytes.
    # A larger pool rests usable inside CRIT, and the enforcer then restarts the engine for a
    # steady state rather than an excursion. · docs/hardware-spark.md §Unified-memory budget
    pool_ceiling_bytes: 20000000000
    max_num_seqs: 8                   # 8 concurrent streams — the pool must supply tokens/stream for all of them
    kv_cache_memory: "20000000000"    # = 644,600 slots = 2.46 × the 262,144 window (20e9 / 31,027 B/token);
                                      # 80,575 tokens/stream at the seqs-8 ceiling
    # Host-floor EXCEPTION for this arm: the global (113.000e9, the measured rest floor) is priced from terms that do
    # not hold for this checkpoint, so this override is priced from the arm's own non-engine reserve
    # plus the watchdog's WARN reserve. Never restate the global per profile — a copy wins silently
    # and makes a re-derive do nothing.
    # → docs/hardware-spark.md §The GLOBAL ceiling: spark_llm_device_hold_ceiling_bytes
    device_hold_ceiling_bytes: 112700000000
    # ple_dispatch above is LOAD-BEARING on this checkpoint: without the kernel-dispatch env the
    # AR arm does not boot at all.

    enforce_eager: true               # mmap × CUDA-graph pinning: eager is required on this path
    spec_config:
      method: mtp
      num_speculative_tokens: 3
      rejection_sample_method: block
      draft_sample_method: probabilistic
    health_start_period: 2400s
    artifact_sets: [ar-hybrid, ple-fp8]
    certified: true
    # Keep exactly ONE `certified_evidence` key here: a duplicated YAML key resolves to the LAST
    # definition with only a warning, so a second empty one silently wins — and `certified: true`
    # with no evidence is the exact shape the gate is supposed to refuse.
    certified_evidence: "spark/reports/hd489-ar-blk/README.md · spark/reports/hd489-tail-b2/README.md · spark/reports/hd489-tail-b3/README.md · spark/reports/hd489-legs-20261006-1228/RESULTS.md · spark/reports/hd489-tail-gate6-20261006-2349/RESULTS.md · spark/reports/hd489-tail-gate7-20261007/RESULTS.md · spark/llm-profiles/README.md — shape history: 16 GB / seqs 4 (KV 515,786 = 1.97×, gates 3/4 PASS), then 25 GB + seqs 8 (gate 4 at conc 8 PASS, spark/reports/hd489-overnight-20261004-0804/raw/g4-c8.log), then POOL 25 → 20 GB (25 GB left the host no reserve) and that is the live shape. Re-taken ON 20 GB: gate 4 at conc 8 and gate 5 (needle at depth, 3/3) — both PASS in hd489-legs-20261006-1228, which also closed the two legs. Gate 6 (accuracy) PASS with one named exception in hd489-tail-gate6-20261006-2349: code-fib returned empty on finish_reason=length because 1024 completion tokens all went to reasoning, i.e. the battery's budget, not the engine's ability. Gate 7: 19.79 h bounded fill — one +5,626 MiB step at hour +2 then 17 h flat at 99,649 MiB, tail slope 0.0 MiB/h, 0 restarts. Gate 7 was read twice and PASSED both times — 19.79 h and then, once the working day filled, 21.49 h: 22 hourly maxima with 19 of them at exactly 99,649 MiB, least-squares +127.1 MiB/h against the 2048 MiB/h gate, 0 restarts; the fill it hands is +5,626 MiB of fixed cost with the peak +6,558 MiB over the watchdog baseline. OWED on this shape, one item, and it is not an engine question: the gate-6 battery at max_tokens 16384 (16 × 2^10) RE-RUN TOGETHER WITH the B1 baseline in the same change — raising one side only moves the comparison basis, and this key is evidence, so it must not be re-graded against a battery that changed underneath it"
    fixed_cost_bytes: 92130000000
    fixed_cost_basis: "MEASURED by the MemAvailable-jump method that docs/spark-incidents.md §Incidents #4/#5/#6 names the TRUE footprint: MemAvailable 7.94 → 117.03 GiB across the 09:22:45Z restart ⇒ engine held 117.13e9 B; minus the live 25e9 KV pool ⇒ 92.13e9 B non-KV. Supersedes the two BOOT-LOG derivations below, which under-count this checkpoint by 15.83e9 B (14.75 GiB) — the gap is the whole reason a 25 GB pool passed the host-floor gate and then ate the host reserve."
    # fixed_cost must be what the engine HOLDS, not what a loader touched: a boot-log
    # "Model loading took N GiB" and an nvidia-smi per-pid reading both under-count the pinned
    # footprint (CUDA graphs, activations, mmap resident pages, host anon, swap share). Only a
    # MemAvailable-jump reading predicts the usable the box actually shows.
    # → docs/spark-incidents.md §Incidents #4/#5/#6 — the projected reserve never existed
    generation_config_override: '{"temperature":1,"top_p":0.95,"top_k":20}'   # client-owned temp NOT possible: AR loader needs temperature present

  # ── fast8: the AR-hybrid arm on fp8 KV — the pool arm, gate-blocked ──────────
  # WHY AN fp8 ARM EXISTS AT ALL: four concurrent full windows do not exist on this box in bf16 —
