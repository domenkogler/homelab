---
# Spark (DGX GB10) group vars — Qwen3.8-Flash-Next inference (HD-359/HD-337)
# Loaded for the `spark` inventory group (playbooks/spark.yml). The docker_services
# registry here is the spark NODE's own stack (NOT oldsrv's home_servers.yml — a homelab
# converge on oldsrv must never deploy spark-ai). Stays deploy-gated until the box is up
# + bench certifies the winner engine.

# Reachability (HD-397, 2026-09-19): same behind-NAT jump as the other LAN hosts, carried
# as a GROUP VAR so plays WITHOUT the spark.yml `vars:` block (all.yml, monitoring,
# dns-seed.yml) also converge spark off-LAN. playbooks/spark.yml keeps its identical
# play-level copy (play vars win, same value — no conflict) for the historical reason
# stated there: "keep it here so ANY runner converges spark". Matrix + alias contract:
# docs/network-vpn.md §Reaching LAN nodes when away (the per-IP ssh block is for
# scp/rsync/humans; the var itself is what carries a converge — measured 2026-09-19).
ansible_ssh_common_args: "-o ProxyJump=vps"

docker_services:
  # The "most proven" Qwen3.8-Flash-Next config — AWQ W4A16 + PLE INT4 + MTP3 + llm-d router
  # (B1 baseline, spark/BENCHMARK-PLAN.md). Deploy-gated: flip `enabled: true` once the
  # node is provisioned + partition done + weights downloaded.
  - { name: spark-ai, template_dir: spark-ai, public: false, enabled: true }  # B1 engine (vLLM AWQ+PLE+MTP3) — ENABLED 2026-09-14 by session/spark-s1-converge (Track 1: boot + health :8000 + sanity bench); flip back to false if the bench regresses
  # DCGM exporter — GPU util/temp/power/energy/SM-clock/XID for the LLM dashboard (HD-379).
  # Loopback-only :9400 (no Traefik route, no LAN, no auth) scraped by spark's Alloy
  # `prometheus.scrape "dcgm"`. The GB10 has NO other GPU telemetry source (no nvidia hwmon
  # chip; nvidia-smi has no metric endpoint and reports memory as "Not Supported" = unified
  # memory). Image digest-pinned in group_vars/all/versions.yml.
  - { name: spark-dcgm, template_dir: spark-dcgm, public: false, enabled: true }
  # TOMBSTONE (HD-379) — the ORIGINAL HD-364 alpine/socat LAN bridge. Retired 2026-09-14 by the
  # `spark-dashboard` Traefik edge, but its rendered project dir + ENABLED boot unit survived on
  # the box, so `docker-compose@dgx-dashboard` kept resurrecting a container that could not bind
  # :11000 (Traefik owns it) → permanent crash-loop. This entry exists ONLY so the role's
  # "Tear down DISABLED services" + "Disable boot auto-start" tasks (main.yml, tube-archivist
  # precedent) keep it gone on every converge AND after a reboot; nothing renders from it
  # (template_dir is never read while disabled, and the vault pre-pass skips disabled services).
  # It can be deleted once the teardown has run green on spark at least twice.
  - { name: dgx-dashboard, template_dir: spark-dashboard, public: false, enabled: false }
  # NVIDIA DGX Dashboard LAN bridge — Traefik file-provider edge on spark (HD-364
  # rework, socat→Traefik): host-net, entrypoints spark_home_ip:11000/11002 →
  # 127.0.0.1:11000/11002 (dashboard + admin JupyterLab). No secrets; public =
  # internal-only (never a public edge record); enabled = bridge up.
  - { name: spark-dashboard, template_dir: spark-dashboard, public: false, enabled: true }
  # Dozzle remote agent — exposes spark's containers (vLLM engine + edge) to the oldsrv
  # LAN log hub (llogs.kogler.si) over the Home VLAN (:7007, LAN-only bind). HD-343
  # ride-along 2026-09-15.
  - { name: dozzle-agent, template_dir: dozzle-agent, enabled: true,
      dozzle_agent_listen: "{{ spark_home_ip }}", dozzle_agent_hostname: "spark" }

# ==== Shared spark render-scope vars (used by the spark-ai compose template) ====
# These MUST live here (group_vars/spark.yml) — the docker_services render scope is
# group_vars + host_vars, NOT role defaults. The spark role (roles/spark) mirrors the
# partition/XFS config but the template reads THESE.
spark_xfs_mount: /mnt/spark_nvme
spark_models_dir: "{{ spark_xfs_mount }}/models"     # weights on XFS, never EXT4 (1TB layout, HD-359)
spark_overlays_dir: "{{ spark_xfs_mount }}/overlays" # PLE overlay patches
# ---- Second artifact root (HD-489) ----
# The upstream (v16b) stack wants ~130 GB of NEW checkpoint+table bytes and the XFS store
# carries 184.7 G free (measured 2026-10-02: `df` 504 G total / 319 G used). The alternative
# was deleting the 135 GB RadixArk NVFP4 set that only the gate-blocked `fast-sglang` profile
# uses — i.e. paying a permanent re-download for temporary headroom. Measured instead:
# spark's root partition (`/`, ext4, nvme0n1p2) has 345 G free, so tier-2 artifacts land
# there and NOTHING is deleted. The XFS-only note on `spark_models_dir` above is a CAPACITY
# statement from the 1 TB carve (HD-359/HD-363), not a filesystem ruling — docs/hardware-spark.md
# §Partition layout records p2 as the live root. A profile names which root it lives on via
# `models_root`, and the gate free-space floor is checked on THAT root, not on XFS.
spark_models_dir_os: /opt/homelab/models
# Floor the profile gate asserts on that partition before an `os`-rooted arm boots: the
# upstream checkpoint (~130 GB) plus its table plus room for the drafter conversion to
# write. Measured free space 2026-10-02: 345 GB. A breach means the store filled up — the
# remedy is to free space, never to lower the floor (roles/spark-llm-profile).
spark_llm_os_min_free_bytes: 150000000000
# The upstream build inputs/outputs (roles/spark-ultrafast-build). The drafter directory is
# CONVERTED out of the base checkpoint (nine dense MTP modules at group size 32), never
# downloaded — which is why the profile names it as a `built` artifact set and the gate
# checks the builder's own report file instead of a download marker.
spark_ultrafast_base_subdir: Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid
spark_ultrafast_drafter_subdir: Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid-mtpdense-g32
spark_ultrafast_drafter_marker: dense-mtp-build-report.json
# Opt-in switch for the build role. false = the role is skipped on a normal converge: it
# clones a third-party repository and builds an image on this box, so it runs when NAMED
# (`--tags spark-ultrafast-build` with this flipped, or -e spark_ultrafast_build=true),
# not because a converge happened to touch spark.
spark_ultrafast_build: false
spark_models_roots:
  xfs: "{{ spark_models_dir }}"
  os: "{{ spark_models_dir_os }}"
# Upstream clone + built-image build tree (roles/spark-ultrafast-build). Kept off the data
# store on purpose: it is build input, not serving data, and it must survive artifact pruning.
spark_ultrafast_src_dir: /opt/homelab/ultrafast-src
spark_draft_vocab_dir: "{{ spark_xfs_mount }}/draft_vocab"
spark_draft_vocab_host_file: "{{ spark_draft_vocab_dir }}/draft-vocab-ids-K65536.txt"
spark_draft_vocab_container: /draft-vocab/ids.txt
# PLE overlay bind-mounts (HD-469: ONE list, read by BOTH the spark-ai template and
# the roles/spark-llm-profile staged-artifacts gate — three mounts duplicated in two
# places is how a gate starts approving a render that cannot boot). Source file
# names = the `files:` manifest entry in spark_artifact_sets.ple-int4.
spark_llm_overlays:
  - host: worker_image_quant.py
    container: /usr/local/lib/python3.12/dist-packages/vllm/v1/ple_offload/worker.py
  - host: ple_layer_quant.py
    container: /usr/local/lib/python3.12/dist-packages/vllm/models/qwen3_8_flash_next/nvidia/ple_layer.py
  - host: connector_mrv2.py
    container: /usr/local/lib/python3.12/dist-packages/vllm/v1/ple_offload/connector.py
spark_router_publish: false        # flip to publish :8000 on the Home-VLAN IP post-bench (LAN clients)
spark_metrics_publish: true         # loopback-only :8000 publish (127.0.0.1) so the spark Alloy can scrape
                                  # vLLM /metrics → VPS VM (HD-368). LAN exposure stays gated on
                                  # spark_router_publish; this only opens the host loopback.
# DCGM exporter publish port (HD-379) — same loopback-only discipline as spark_metrics_publish:
# `spark-dcgm` binds 127.0.0.1:<port> and spark's Alloy `prometheus.scrape "dcgm"` reads it.
# Declared here (NOT `| default()` in the template): CONVENTIONS §1 fail-loud — a missing var
# must abort the render, and validate-docker-services.py's mock `default` filter would otherwise
# silently render an empty port.
spark_dcgm_exporter_port: 9400
# Hard memory cap for the DCGM sidecar (HD-379) — measured anon ≈ 139–143 MiB, capped at 256 MiB
# (~1.8x). The cap exists to bound blast radius, not to save RAM: a leaked sidecar must not be
# able to eat into the 105 GiB engine cage (HD-374) on a host with an OOM history (HD-375).
# Set above the observed peak so the cap can never OOM the exporter in normal operation.
spark_dcgm_exporter_memory_limit: "256M"   # compose `limits.memory` — MUST be a string (docker compose schema)

# ==== Artifact SETS + the explicit download opt-in (HD-469) =================
# The manifest stays generic (roles/spark-artifacts maps repo → XFS dir), but it
# is now assembled from named SETS, and only what `spark_artifacts_fetch` lists
# is downloaded. Default = the two sets already staged live on the box (B1 AWQ
# weights + INT4 tables) — a profile flip NEVER starts an 84 GB download.
# To stage the NVFP4 lane deliberately:
#   ansible-playbook -i inventory.ini playbooks/spark.yml --limit spark \
#     --tags spark-artifacts \
#     -e spark_artifacts_fetch='["b1-awq","ple-int4","nvfp4-mixed","ple-nvfp4"]'
# Disk: 296 GB free after the B1 staging (HD-359 live run); nvfp4-mixed core
# ≈88.6 GB + ples_nvfp4 28.8 GB ≈ 117 GB → fits, ~180 GB left.
spark_artifacts_fetch: [b1-awq, ple-int4]

spark_artifact_sets:
  b1-awq:
    - repo_id: "wtdcode/Qwen3.8-Flash-Next-AWQ-W4A16"
      kind: weights
      local_dir: "{{ spark_models_dir }}"
      subdir: "Qwen3.8-Flash-Next-AWQ"
  ple-int4:
    - repo_id: "primitive-ai/Qwen3.8-Flash-Next-PLE-quant"
      kind: files
      files: [worker_image_quant.py, ple_layer_quant.py, connector_mrv2.py]
      # Child dir (0777, ansible-admin-owned) — NOT the mount root: hf writes a
      # `.cache` metadata dir under --local-dir, and /mnt/spark_nvme root is
      # root-owned → Permission denied. overlays/ is the exact PLE mount path.
      local_dir: "{{ spark_overlays_dir }}"
    - repo_id: "primitive-ai/Qwen3.8-Flash-Next-PLE-quant"
      kind: tables
      subdir: "ples_int4"
      # Values kept BYTE-FOR-BYTE as the live-staged original (HD-359 2026-09-14):
      # local_dir = the writable CHILD ples_int4/ (not the root-owned mount root),
      # `hf download --include ples_int4/*` nests the repo-relative path and the
      # role's flatten task moves the contents up. Do not "tidy" this to the
      # mount root — the nesting + flatten pair is what made the 30 GB land.
      local_dir: "{{ spark_xfs_mount }}/ples_int4"
  nvfp4-mixed:
    # primitive-ai/Qwen3.8-Flash-Next-mixed-NVFP4-FP8 — 191.0 GB repo, of which
    # 102.4 GB is its OWN BF16 PLE table (ple-bf16-*), which the overlay stubs.
    # Skip the table at download AND trim the index, or vLLM asks for shards that
    # are not on disk (the `kind: weights-trim` task in roles/spark-artifacts).
    - repo_id: "primitive-ai/Qwen3.8-Flash-Next-mixed-NVFP4-FP8"
      kind: weights-trim
      local_dir: "{{ spark_models_dir }}"
      subdir: "Qwen3.8-Flash-Next-mixed-NVFP4-FP8"
      exclude: ["ple-bf16-*"]
      trim_pattern: "ngram"
  nvfp4-radixark:
    # RadixArk: 135.3 GB repo, 51.2 GB of it is the FP8 table the checkpoint
    # ships (SGLang pins it). Kept for the SGLang lane only — see the
    # fast-sglang profile's ⚠.
    - repo_id: "RadixArk/Qwen3.8-Flash-Next-NVFP4"
      kind: weights-trim
      local_dir: "{{ spark_models_dir }}"
      subdir: "Qwen3.8-Flash-Next-NVFP4-RadixArk"
      exclude: ["model-plefp8-*"]
      trim_pattern: "ngram"
  ple-nvfp4:
    - repo_id: "primitive-ai/Qwen3.8-Flash-Next-PLE-quant"
      kind: tables
      subdir: "ples_nvfp4"
      # Same nesting shape as ple-int4 above (child dir + role-side flatten).
      local_dir: "{{ spark_xfs_mount }}/ples_nvfp4"

  # ---- HD-489 tier-2 artifacts (upstream v16b stack) — the / partition, NOT XFS ----
  ar-hybrid:
    # Saren/Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid: the int4/int8/fp8 HYBRID target the
    # upstream recipe measures. NOT a fourth quantization of "our" weights — it is the
    # upstream lane's target, and it pairs with the FP8 table + the FP8-hybrid dispatch
    # patch, which is why it arrives as one artifact set with ple-fp8.
    - repo_id: "Saren/Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid"
      kind: weights
      revision: "{{ spark_ar_hybrid_revision }}"
      local_dir: "{{ spark_models_dir_os }}"
      subdir: "Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid"
  ple-fp8:
    # The FP8 n-gram table the mmap path reads from disk (VLLM_PLE_MMAP_DIR). Ships at the
    # repo ROOT, not under a subdir — hence kind: repo-root (the `tables` kind's --include +
    # flatten shape is an artifact of the primitive-ai repos' layout, not a universal).
    - repo_id: "Saren/Qwen3.8-Flash-Next-ple-table-fp8"
      kind: repo-root
      revision: "{{ spark_ple_fp8_revision }}"
      local_dir: "{{ spark_models_dir_os }}"
      subdir: "ple-table-fp8"
  draft-vocab:
    # Repo-owned runtime input (65,536 ids, gz 143 KB), sha256-pinned in versions.yml.
    # It is on the SERVING path (bind-mounted :ro into every v16b-class boot), so it is
    # vendored in-tree and never fetched at deploy time.
    - kind: asset
      src: ultrafast/draft-vocab-ids-K65536.txt.gz
      sha256: "{{ spark_draft_vocab_sha256 }}"
      local_dir: "{{ spark_draft_vocab_dir }}"
      dest: "draft-vocab-ids-K65536.txt.gz"
      decompress: true
      expect_lines: 65536

  mtpdense-t80:
    # NOT a download — roles/spark-ultrafast-build CONVERTS nine drafter modules out of
    # ar-hybrid at group size 32 (+4.8 GiB). It is declared as an artifact set anyway so the
    # profile gate's staged-artifact check covers it exactly like a download: the marker is
    # the builder's own report file, so a profile that names this set cannot boot on a box
    # where the conversion never ran.
    - kind: built
      local_dir: "{{ spark_models_dir_os }}"
      subdir: "{{ spark_ultrafast_drafter_subdir }}"
      marker: "{{ spark_ultrafast_drafter_marker }}"

# The manifest the role iterates (flat list, same item shape as before).
spark_artifacts: "{{ spark_artifact_sets | dict2items | selectattr('key', 'in', spark_artifacts_fetch) | map(attribute='value') | flatten }}"

# ==== Spark GPU-inference artifact store (HD-359) ====
# GENERIC, config-agnostic manifest: repo_id → XFS local_dir. The B1 AWQ+PLE
# weights, PLE overlay .py files and INT4 tables all live here and are MOUNTED
# read-only by every engine profile (vLLM B1 today; NVFP4/SGLang later = their
# own repos = separate downloads by design). One download per quant-artifact,
# reused by every config. Filled by roles/spark-artifacts (download) — the
# spark-ai compose template binds these exact paths.
# (The manifest itself moved ABOVE: spark_artifact_sets + spark_artifacts_fetch
#  → spark_artifacts. Item keys and the role's `kind` values are unchanged.)
# Kept here as the record of the live-staged default set: b1-awq + ple-int4,
# i.e. weights 169 G + overlays 3×.py + INT4 tables 30 G/129 files, STAGED LIVE
# 2026-09-14 (HD-359) — the two dirs the `reasoning` profile mounts.

# Spark headless mode (HD-364) — TRUE = enforce the headless operating contract:
#   * mask sleep/suspend/hibernate/hybrid-sleep (DGX Spark idles into suspend, which
#     kills the NIC — live L2 blackout 2026-09-14, deployment-manual.md §5.2; the old
#     runbook step is now IO via the spark role)
#   * set default.target = multi-user (no graphical login — GDM/desktop are pulled in
#     only when this is false); the `spark-dashboard` Traefik edge keeps the loopback
#     dashboard reachable on the LAN without a desktop
# FALSE = plain workstation (leave DGX OS graphical default + sleep targets as shipped).
spark_headless: true

# ============================================================================
# LLM SERVING PROFILES (HD-469) — the one-var config switch
# ----------------------------------------------------------------------------
# `spark_llm_profile` (host_vars/spark.kogler.si.yml) + one converge = a
# different engine config on the SAME endpoint (llm.kogler.si), the SAME served
# model id and the SAME bearer key. Profiles are the SSOT for every engine
# render key; the flat `spark_vllm_*` names below stay as PASS-THROUGHS of the
# ACTIVE profile because two non-template consumers read them
# (roles/spark/files/spark-oom-watchdog.sh + spark-oom-watchdog.service.j2) and
# because docs/hardware-spark.md §LLM serving profiles + docs/pi-harness.md
# cite them as the live-value pointer. Do not re-hardcode a value in either
# place — edit the profile entry.
#
# Flipping a profile is NOT free and the render does not pretend otherwise:
#   * ~20 min engine boot (first PLE-table load) — converge DETACHED (README §4.6)
#   * the CLIENT contract does not follow the flip automatically: pi reads its
#     window from ~/.pi/agent/models.json (scripts/pi-config/models-spec.yml),
#     so `client_context_window` below is the value that file must carry.
#   * artifacts of a non-default profile are NOT auto-downloaded (84 GB + 1 G
#     link). `spark_artifacts_fetch` is the explicit opt-in (see the artifact
#     store section) and roles/spark-llm-profile refuses the flip until they land.
# Gate: profiles marked `certified: false` refuse to converge unless
# `spark_llm_allow_uncertified: true` is set explicitly. Gate role:
# roles/spark-llm-profile (runs before spark-artifacts + docker_services).
# ============================================================================
spark_llm_profile: reasoning
spark_llm_allow_uncertified: false

# Measured on THIS box — the KV-pool boot-gate arithmetic (docs/hardware-spark.md
# §Unified-memory budget: "KV pool = 19.04 GiB → 658,902 tokens (30.3 KiB/token)").
# ⚠ THE OLD `fp8 = 15514` (a flat 2×) WAS WRONG and is corrected here (HD-469 run #2,
# 2026-09-28): fp8 halves the MAIN K/V only. The QSA indexer side-caches (raw-key ring,
# compressed keys) and the GDN state stay bf16, so the pool gain is ~1.7–1.9×, NOT 2×.
# Upstream measurements on this model: 1.77× (SM120, spec off) · 1.89× · 1.70× (2× Spark
# GB10) · 1.85× (1× Spark GB10). Shape check: main KV ≈ 24,576 B of ≈ 29,294 B/token =
# 84 % → 1/(1 − 0.84/2) ≈ 1.72×. We plan with the WORST of the measured ratios (1.70) so
# a projection can only be beaten, never missed.
spark_llm_kv_bytes_per_token:
  auto: 31027        # 30.3 KiB/token, bf16 — the measured constant
  bf16: 31027
  fp8: 18251         # 31,027 / 1.70 — 17.8 KiB/token, the conservative measured ratio
# bf16 pool ceiling: "16 GiB is the practical bf16 ceiling — do not raise it
# further" (docs/hardware-spark.md:301). Expressed in the same decimal bytes the
# governor takes, so the gate compares like with like.
spark_llm_pool_ceiling_bytes: 17179869184     # 16 GiB — the CERTIFIED ceiling. Per-profile overrides (e.g. ar-blk's pool_ceiling_bytes) extend it for a PROFILE ONLY; this global stays 16 GiB (hardware-spark.md:301 do-not-raise).

# ---- The host floor, as an arithmetic gate (HD-469 run #2) -----------------
# The pool ceiling alone is NOT the OOM guard: a profile that changes the WEIGHTS changes
# the fixed cost, and on GB10 the fixed cost and the KV pool are paid out of the SAME
# 121.62 GiB the OS lives in (docs/hardware-spark.md §Unified-memory budget — three
# global OOMs paid for that sentence). Every profile declares its engine-side fixed cost;
# roles/spark-llm-profile refuses a profile whose (fixed + pool) exceeds what is left for
# the host. Every term is a documented constant, not a tuning knob:
#   MemTotal 127,532,360 kB = 130,593,136,640 B   (measured, docs/hardware-spark.md)
#   − 6.9 GiB already held by OS/driver/dashboard at engine start  (same source)
#   − 17.78 GiB the CERTIFIED worst usable reading (spark/stability-test.md §2 row
#     "worst moment under 2×240k", docs/hardware-spark.md:272 — kill point was 1.62 GiB)
#   = 104,113,000,000 B the engine (fixed cost + KV pool) may hold at once.
# A profile that cannot fit is a profile that needs SMALLER POOL, a measured fixed cost,
# or a re-cert — never a bigger number in this file. The gate's fail message says which.
spark_llm_device_hold_ceiling_bytes: 104113000000

spark_llm_profiles:
  # ── 1. REASONING = today's live config, verbatim ───────────────────────────
  # S1 `serving_reasoning` (BENCHMARK-PLAN §2): AWQ W4A16 + PLE INT4 + MTP3 on the
  # digest-pinned vLLM fork. Owner's daily driver (planning/reasoning sessions).
  # CERTIFIED: 2026-09-18 3-rung load chain to 2×240k ≈ 94.6 % of pool, 0 kernel
  # OOM / 0 restarts / usable worst 17.78 GiB (spark/reports/stability/README.md).
  # KV: 16,000,000,000 B / 30,3 KiB = 515,786 slots = 1.97 × full 262k window.
  reasoning:
    label: "S1 reasoning — AWQ W4A16 + PLE INT4 + MTP3, vLLM (live, certified)"
    engine: vllm
    container: vllm-qwen-spark
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    ple_overlay: true
    served_name: spark/qwen3.8-flash-next
    max_model_len: 262144
    max_num_seqs: 4
    max_num_batched_tokens: 4096
    kv_cache_dtype: auto
    kv_cache_memory: "16000000000"
    max_cudagraph_capture_size: 4
    enforce_eager: false
    distributed_executor_backend: mp
    spec_method: mtp
    spec_tokens: 3
    memory_limit: 105G
    health_start_period: 1200s
    env_extra: []
    args_extra: []
    # What the CLIENT may vary on this engine: BINARY. `reasoning_effort` is
    # accepted-but-ignored by this build; the graded surface is
    # `thinking_token_budget` per pi level (docs/pi-harness.md §2, HD-376).
    reasoning_surface: binary
    client_context_window: 262144
    client_max_tokens: 16384
    # MEASURED, not derived: the vLLM boot log's own accounting for this exact engine +
    # weights (docs/hardware-spark.md §The measured allocation arithmetic: 77.69 GiB
    # weights+non-torch + 2.99 activation + ~7 GiB stranded graphs ≈ 81 GiB = 86.9 GB).
    # The certified lane's (fixed + pool) = 86.9 + 16.0 = 102.9 GB, inside the host-floor
    # ceiling above — that arithmetic IS the certification, and it is why changing the
    # weights changes the POOL, not just the label.
    fixed_cost_bytes: 86900000000

    pool_ceiling_bytes: 17179869184   # CERTIFIED 16 GiB (spark_llm_pool_ceiling_bytes default)
    device_hold_ceiling_bytes: 104113000000  # CERTIFIED host-floor (spark_llm_device_hold_ceiling_bytes default)
    fixed_cost_basis: "MEASURED from the engine boot log (docs/hardware-spark.md §Unified-memory budget)"
    # HD-489: the keys the profile-composed template now REQUIRES (fail-loud, no
    # default() fallbacks — CONVENTIONS §7 discipline). Values are exactly what the
    # template hardcoded before the funnel arms needed them per-profile, so the render
    # is unchanged and the HD-469 parity guard still holds for this lane.
    image: base
    models_root: xfs
    tool_call_parser: qwen3_coder
    generation_config_override: '{"temperature":1,"top_p":0.95,"top_k":20}'
    ple_offload: true
    ple_host_base: mount
    ple_host_root: xfs
    ple_staged_marker: META.json
    cudagraph_piecewise: false
    prompt_tokens_details: false
    never_evict_prompt: ""
    ple_mmap: false
    draft_vocab: false
    artifact_sets: [b1-awq, ple-int4]
    certified: true
    certified_evidence: "spark/reports/hd469-reasoning/README.md · spark/reports/stability/README.md · docs/hardware-spark.md §Unified-memory budget"

  # ── 2. GRADED = same weights/engine, fp8 KV so graded thinking + full windows coexist ─
  # The grading itself is CLIENT-side (pi `thinkingLevelMap` + `thinking_token_budget`,
  # docs/pi-harness.md §2/§4); what this profile changes on the server is the KV
  # shape: fp8 shrinks bytes/token by ~1.7-1.9x (NOT 2x — see the constant above), so
  # the SAME 16 GB pool would hold ~877k-913k slots ≈ 3.3-3.5 full windows, and thinking
  # chains stop evicting each other at 4 sessions.
  # ⛔ IT CANNOT BOOT ON THE PINNED IMAGE (measured 2026-09-28, run #1) — but the reason
  # is the IMAGE, not the model. Read this before writing it off:
  #   * fp8 main KV on the QSA path merged upstream 2026-09-16 as vllm#55557, and was
  #     reproduced on GB10/sm_121 (TP2 across two Sparks, MTP active) by a third party;
  #   * the build we pin (`fc120ece`, self-reporting `vllm-0.1.dev20073+g8e685d198`) is a
  #     day-0 build that PREDATES that merge — its qsa.py is a dtype guard, not a law;
  #   * vLLM v0.30.0 does NOT carry it either (v0.30 = indexer-side fp8 #54890).
  # So `graded` = an engine-pin change + a full re-cert = todo.md HD-473, not a config
  # flip. Do not vendor the AGPL overlay patch and do not hand-edit a container's
  # site-packages to make this boot (prompt-llm.md §2).
  graded:
    label: "Graded thinking — AWQ W4A16 + PLE INT4, fp8 KV (~1.7x slots) — BLOCKED ON IMAGE PIN (HD-473)"
    engine: vllm
    container: vllm-qwen-spark
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    ple_overlay: true
    served_name: spark/qwen3.8-flash-next
    max_model_len: 262144
    max_num_seqs: 4
    max_num_batched_tokens: 4096
    kv_cache_dtype: fp8
    kv_cache_memory: "16000000000"
    max_cudagraph_capture_size: 4
    enforce_eager: false
    distributed_executor_backend: mp
    spec_method: mtp
    spec_tokens: 3
    memory_limit: 105G
    health_start_period: 1200s
    env_extra: []
    args_extra: []
    # Graded surface = pi levels off/low/medium/high → enable_thinking +
    # thinking_token_budget (1k/2k/4k/8k in ~/.pi/agent/settings.json).
    # xhigh/max stay null: pi folds them to `high` before the budget lookup, so
    # they would be cosmetically distinct and byte-identical on the wire.
    reasoning_surface: graded-budget
    client_context_window: 262144
    client_max_tokens: 16384
    fixed_cost_bytes: 86900000000      # = the `reasoning` lane: same weights, same engine

    pool_ceiling_bytes: 17179869184   # CERTIFIED 16 GiB (spark_llm_pool_ceiling_bytes default)
    device_hold_ceiling_bytes: 104113000000  # CERTIFIED host-floor (spark_llm_device_hold_ceiling_bytes default)
    fixed_cost_basis: "DERIVED: inherited from reasoning \u2014 the weights are unchanged, so
      the measured 87.8 GB stands; the fp8 saving is upstream-published and deliberately NOT
      claimed here (docs/hardware-spark.md \u00a7fp8 KV cache: still unmeasured on this box)"
    # HD-489: the keys the profile-composed template now REQUIRES (fail-loud, no
    # default() fallbacks — CONVENTIONS §7 discipline). Values are exactly what the
    # template hardcoded before the funnel arms needed them per-profile, so the render
    # is unchanged and the HD-469 parity guard still holds for this lane.
    image: base
    models_root: xfs
    tool_call_parser: qwen3_coder
    generation_config_override: '{"temperature":1,"top_p":0.95,"top_k":20}'
    ple_offload: true
    ple_host_base: mount
    ple_host_root: xfs
    ple_staged_marker: META.json
    cudagraph_piecewise: false
    prompt_tokens_details: false
    never_evict_prompt: ""
    ple_mmap: false
    draft_vocab: false
    artifact_sets: [b1-awq, ple-int4]
    certified: false
    uncertified_reason: >-
      BLOCKED ON THE PINNED IMAGE, not on the model. fp8 main KV on the QSA path merged
      upstream 2026-09-16 as vllm#55557; it is absent from the day-0 build this box pins
      (fc120ece, self-reporting vllm-0.1.dev20073+g8e685d198), where it dies at
      EngineCore init with NotImplementedError at qsa.py:187 (measured 2026-09-28,
      spark/reports/hd469-graded/README.md). vLLM v0.30.0 does not carry it either.
      Reaching it = an engine-pin change + full re-cert (todo.md HD-473), NOT a config
      flip; do not re-attempt it against this pin, and do not patch the container.
      When it does land, size it at 1.70-1.89x the slots, not 2x, and read the count from
      the engine's own 'GPU KV cache size' log line — see spark/llm-profiles/README.md
      gates 8-9 for the MTP-acceptance and noise-floor quality bars it must clear.

  # ── 3. FAST = NVFP4 weights, bf16 KV: the decode-speed + accuracy lane ─────
  # The "implementator" lane: S2/S3 (NVFP4 decode 40–46 tok/s expected on GB10,
  # RESEARCH-VERDICTS §2). Sizes verified against the HF API 2026-09-28:
  # primitive-ai mixed-NVFP4/FP8 = 191.0 GB repo, 102.4 GB of it is its own
  # BF16 PLE table (skippable) → core ≈ 88.6 GB; ples_nvfp4 sidecar = 28.8 GB
  # (accuracy cost ≈ nothing: 92.2 knowledge / 78.7 tool-call vs 92.2/79.2 BF16,
  # primitive-ai card, spark/resources/R1-ple-quant-card-evidence.md).
  # WHY bf16 KV HERE (changed 2026-09-28, run #2 prep): the fp8 half of this profile is
  # HD-473's problem (image pin), so `fast` measures ONE variable — the weights. Carrying
  # fp8 here would have it fail for a reason that is not NVFP4's.
  # ⚠ THE OLD COMMENT HERE ("fp8 16.5 GB = 1.063M slots = 4.06 × window ≥ the 4 × 262,144
  # no-preemption bound") WAS WRONG TWICE: it used the ×2 constant (real ratio 1.70–1.89,
  # so ≈ 905k = 3.45 ×, failing its own bound) AND it ignored that these weights are
  # HEAVIER than AWQ's. NVFP4 core 88.6 GB vs the AWQ lane's whole measured fixed cost
  # 81 GiB (77.69 GiB weights+non-torch, +2.99 activation, +~7 stranded graphs) ⇒ fixed
  # cost +≈ 5.2 GB. On a 121.62 GiB unified pool that is paid for OUT OF THE KV POOL,
  # which is why this profile's pool went DOWN to 11 GB, not up to 16.5 GB (gate:
  # spark_llm_device_hold_ceiling_bytes). KV: 11,000,000,000 / 31,027 = ~354,000 slots
  # = 1.35 × one full window — enough to boot, measure speed and run the accuracy battery;
  # 4 concurrent full windows need fp8 KV, i.e. HD-473, on top.
  # UNCERTIFIED: never benched on this box; NVFP4-vs-AWQ accuracy is unresolved
  # (91/100 vs 98/100 in one capture, 99/100 in another — engine+template+effort
  # confound it: spark/resources/R2-nvfp4.md §B).
  fast-sglang:
    label: "EXPERIMENTAL — SGLang + RadixArk NVFP4 (pool cannot hold our window, image pin empty)"
    engine: sglang
    container: sglang-qwen-spark
    model_subdir: Qwen3.8-Flash-Next-NVFP4-RadixArk
    ple_host_subdir: ""                   # table comes from the checkpoint; SGLang pins it
    ple_container_dir: ""
    ple_overlay: false
    served_name: spark/qwen3.8-flash-next
    max_model_len: 262144                 # context-length (per-request)
    max_num_seqs: 4                       # --max-running-requests
    max_num_batched_tokens: 4096          # --chunked-prefill-size
    kv_cache_dtype: auto
    kv_cache_memory: "0"                  # unused by SGLang (pool is --mem-fraction-static driven)
    max_cudagraph_capture_size: 0
    enforce_eager: false
    distributed_executor_backend: mp
    spec_method: nextn
    spec_tokens: 3
    memory_limit: 105G
    # 4800 s = the file-backed-PLE worst case (≈55 min table re-write on an existing file,
    # see the ⚠ block above) + slack. The vLLM profiles' 1200 s is a ~20 min PLE load.
    health_start_period: 4800s
    env_extra:
      # Vendor default, declared explicitly so the RSS cap is visible in the render: the
      # file-backed table's page-cache resident set. Raising it trades host RAM for hit rate.
      - SGLANG_QWEN4_PLE_FILE_RSS_BUDGET_GB=8
    args_extra:
      - --quantization
      - modelopt_fp4
      - --fp4-gemm-backend
      - flashinfer_cutlass
      # SM121: the 27B page says flashinfer; MTP + FlashInfer needs a build whose prefill
      # `plan` accepts `uniform_q_len` (newer than 0.6.15.post1), and the flash-next page
      # resolves the GDN kernels to triton on SM120 anyway. triton + MTP is the combination
      # that is documented to run here — re-check once an image is pinned, and pin
      # --moe-runner-backend flashinfer_cutlass explicitly IF the NVIDIA export is used
      # (its auto-default picks flashinfer_trtllm on GB10 and the NVFP4 MoE method rejects
      # it at autotune; for that export do NOT pass --quantization at all — it resolves to
      # modelopt_mixed).
      - --attention-backend
      - triton
      - --linear-attn-prefill-backend
      - triton
      - --linear-attn-decode-backend
      - flashinfer
      - --mamba-ssm-dtype
      - bfloat16
      - --page-size
      - "64"
      - --ple-offload-embedding
      # THE flag that makes one Spark able to hold this checkpoint at all (#37068). Without
      # `file` the offload pins the table in host RAM = the same 121.62 GiB pool = the
      # failure this lane was blocked on. `--ple-offload-dir` must point at a bind of the
      # XFS NVMe store (spark_xfs_mount/ple_offload → /ple_offload): that bind is NOT wired
      # in the spark-ai template yet, and the sparse 47.7 GiB file must not land on EXT4 or
      # in the container's own storage. Wire it in the same change that pins the image.
      - --ple-offload-backend
      - file
      - --ple-offload-dir
      - /ple_offload
      - --tp
      - "1"
      - --speculative-algorithm
      - NEXTN
      - --speculative-num-steps
      - "3"
      - --speculative-eagle-topk
      - "1"
      - --speculative-num-draft-tokens
      - "4"
      - --speculative-draft-model-quantization
      - unquant
      - --max-mamba-cache-size
      - "24"
      - --mamba-radix-cache-strategy
      - extra_buffer
      # --mamba-track-interval 64 REMOVED (2026-09-28): the vendor's DGX Spark cells run
      # WITHOUT it. The default (256 tokens) still satisfies the constraints (a multiple of
      # the 64-token page, ≥ the 4 draft tokens) and leaves a ~40 % LARGER KV pool — on a
      # lane whose whole problem is that the pool does not hold 262,144, that is not a
      # knob to leave at the community recipe's value.
      - --watchdog-timeout
      - "1800"
      # Was 1048576 — a community number from a box that is not this one (the same flag
      # value is the TP=2 / other-card figure), and asking sglang for a pool the box cannot
      # give is a unified-memory event, not a refusal. Pinned to the CLIENT CONTRACT instead:
      # 262,144 is the smallest value that does not lie to pi, and the vendor's measured
      # single-Spark pools (93k / 174k, both at bf16) say this boot must FAIL. Do not lower
      # it to make it boot — a server that serves 174k while models.json promises 262,144
      # 400s mid-session (docs/spark-llm-profiles.md §Client contract). Doubling the pool is
      # fp8 KV's job (sglang #36644, unmerged) — 2 × 174k clears 262k, 2 × 93k does not.
      - --max-total-tokens
      - "262144"
      # 0.80, NOT the flash-next cells' 0.85: 0.85 × 128 GB leaves ~8 GB for the OS, which
      # is DGX OS's own earlyoom SIGTERM threshold — measured on the 27B page's GB10 grid,
      # 15 of 48 cells died that way (`exit code -15`, no traceback, `journalctl -u earlyoom`),
      # every cell served at 0.80. Our box has the same failure mode in its own incident
      # history, so this is a floor, not a preference (docs/hardware-spark.md
      # §DGX Spark host limits). roles/spark-llm-profile refuses a higher value.
      - --mem-fraction-static
      - "0.80"
    # SGLang cannot turn thinking OFF on this model (vendor: "always reasons"), and depth is
    # requested via `reasoning_effort` — the opposite of the vLLM build we measured
    # (binary enable_thinking, reasoning_effort accepted-and-ignored, docs/pi-harness.md §2).
    # That measurement is ENGINE-specific: a sglang profile must not inherit the pi harness
    # flags without re-measuring them, and `spark-llm-probe.py reasoning` legs are expected
    # to FAIL on this engine by design until someone re-measures.
    reasoning_surface: always-on-effort-unmeasured
    client_context_window: 262144
    client_max_tokens: 16384
    # HD-489: the keys the profile-composed template now REQUIRES (fail-loud, no
    # default() fallbacks — CONVENTIONS §7 discipline). Values are exactly what the
    # template hardcoded before the funnel arms needed them per-profile, so the render
    # is unchanged and the HD-469 parity guard still holds for this lane.
    image: sglang
    models_root: xfs
    tool_call_parser: qwen3_coder
    generation_config_override: '{"temperature":1,"top_p":0.95,"top_k":20}'
    ple_offload: true
    ple_host_base: mount
    ple_host_root: xfs
    ple_staged_marker: META.json
    cudagraph_piecewise: false
    prompt_tokens_details: false
    never_evict_prompt: ""
    ple_mmap: false
    draft_vocab: false
    artifact_sets: [nvfp4-radixark]
    certified: false
    uncertified_reason: >-
      Three independent blockers, in cost order: (1) spark_sglang_image carries no
      digest — CONVENTIONS §7 forbids the floating dev tags that are the only builds
      carrying support ≥ v0.5.20 plus the #38121 export loader; (2) the single-Spark KV
      pool sglang measures for this checkpoint (~93k RadixArk / ~174k NVIDIA export, MTP
      on) cannot hold the 262,144 window the client contract promises, and closing that
      gap needs sglang fp8 KV (#36644, still open); (3) PLE + SGLang on GB10 has never
      been booted here (BENCHMARK-PLAN: "PLE is vLLM-only today"), and a failed boot
      competes with the certified engine for the same 121.62 GiB pool. The file-backed
      table (#37068) is the vendor's own fix for (1 Spark, weights) and is already
      authored below.

  # ══════════════════════════════════════════════════════════════════════════════
  # HD-489 · THE ULTRA-FAST MATRIX (screening funnel, upstream v16b lineage)
  # ══════════════════════════════════════════════════════════════════════════════
  # WHY SO MANY: the upstream recipe (github.com/dime-online/qwen3.8-Flash-DGX-UltraFast,
  # Apache-2.0) publishes 74.1 tok/s single-stream and 2,213–4,016 tok/s cold prefill on one
  # GB10 by changing SIX things at once (patch lineage, target weights, PLE strategy, spec
  # method, draft vocabulary, batch/cudagraph shape). Adopting it wholesale would teach us
  # nothing about WHICH of the six earns the speed, and this catalogue exists to make weight
  # changes pay for themselves in pool arithmetic — so the arms below change ONE thing each,
  # in tiers priced by what they cost to stage:
  #   tier 1  u*/nv-*      0 new GB (AWQ + INT4 + NVFP4 are already on disk)   ~1 boot each
  #   tier 2  ar-*         ~130 GB onto `/` (spark_models_dir_os), nothing deleted
  #   tier 3  v16b-*       + the T80 drafter directory (+4.8 GiB, built not downloaded)
  # Keep-few rule (docs/spark-llm-profiles.md §The funnel): arms are SCORED, not kept — a
  # loser is deleted from this catalogue and recorded in docs/services-ai-rejected.md. Only
  # an arm that clears gates 0–7 (spark/llm-profiles/README.md) becomes `certified: true`.
  #
  # EVERY arm here is UNCERTIFIED behind spark_llm_allow_uncertified, and every one of them
  # names `image: ultrafast`, whose pin is EMPTY in versions.yml ⇒ the gate refuses ALL of
  # them until the patched lineage has been built and its image ID recorded. Authored ≠
  # bootable, and that is the design (the fast-sglang precedent).
  #
  # `_x` is a YAML MERGE ANCHOR, not a profile (the `_` prefix is the skip convention in
  # scripts/spark-llm-probe.py + scripts/check_spark_llm_gate.py; the gate's valid-name list
  # filters it too). It carries the values every arm shares, so an arm below reads as its
  # DELTA. The four arms above it are deliberately untouched — `reasoning` must keep
  # rendering byte-identically (HD-469 parity guard), and an anchor rewrite of it would put
  # that guard at risk for no information.
  _x: &u_x
    engine: vllm
    container: vllm-qwen-spark        # SAME container name as the certified lane on purpose:
    image: ultrafast                  # a flip RECREATES the service, it never orphans one.
    served_name: spark/qwen3.8-flash-next   # HD-370 anchors are non-negotiable: served id,
    models_root: xfs                  # port, bearer, service name. Upstream serves `qwen`
    max_model_len: 262144             # on :8000 with NO --api-key and `-p 8000:8000` on all
    max_num_batched_tokens: 4096      # interfaces; we keep the contract and take only the
    max_num_seqs: 4                   # engine work. (docs/spark-llm-profiles.md §Client
    max_cudagraph_capture_size: 4     # contract.)
    kv_cache_dtype: auto              # arms never try fp8 KV: the parent build's qsa.py
    kv_cache_memory: "16000000000"
    pool_ceiling_bytes: 17179869184   # CERTIFIED 16 GiB default (spark_llm_pool_ceiling_bytes); a profile overrides for its own test
    device_hold_ceiling_bytes: 104113000000  # CERTIFIED host-floor default (spark_llm_device_hold_ceiling_bytes)    # declares [auto, bfloat16] (HD-473), and the upstream
    enforce_eager: false              # recipe itself passes --kv-cache-dtype auto.
    distributed_executor_backend: mp
    spec_method: mtp
    spec_tokens: 3
    tool_call_parser: qwen3_coder     # ours, not upstream's qwen3_xml — the pi tool-calling
    generation_config_override: '{"temperature":1,"top_p":0.95,"top_k":20}'   # client-owned temp NOT possible: AR loader needs temperature present
    reasoning_surface: binary         # certified against THIS (docs/pi-harness.md §2).
    client_context_window: 262144
    client_max_tokens: 16384
    ple_offload: true                 # render the primitive-ai CPU-offload env trio
    ple_overlay: false
    ple_host_base: mount              # PLE host path = (mount|models) root
    ple_host_root: xfs                  #   + "/" + ple_host_subdir; two plain flags on
    ple_host_subdir: ""                 #   purpose: a Jinja value INSIDE this dict is
    ple_container_dir: ""               #   stringified by validate-docker-services.py, so
    ple_staged_marker: ""               #   the template composes paths, profiles declare
    cudagraph_piecewise: false          #   coordinates. (The HD-469 note at the foot of
    prompt_tokens_details: false        #   this file is the reason.)
    never_evict_prompt: ""
    never_evict_max_fraction: "0.25"
    ple_mmap: false                   # the upstream disk-mmap PLE path (mutually exclusive
    ple_dispatch: false               # with ple_overlay: both own `ple_layer.py`); A4 split:
                                      # kernel-dispatch env (spark_llm_ple_dispatch_env) renders
                                      # only when an arm opts in
    draft_vocab: false                # (ple_overlay XOR ple_mmap; draft slice for v16b*)
    env_extra: []
    args_extra: []
    memory_limit: "105G"
    health_start_period: 1200s
    certified: false

  # ── tier 1 · the patch lineage, on weights we already own (0 new GB) ──────────
  u1-patch:
    <<: *u_x
    label: "HD-489 t1 — patched vLLM lineage + certified AWQ/INT4 stack (isolates the patch stack)"
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_overlay: true
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    artifact_sets: [b1-awq, ple-int4]
    # Same weights as the certified lane ⇒ the measured fixed cost carries over. What this
    # arm is for: read the engine's OWN 'Available KV cache memory' line on the first boot
    # and replace this number if the patched build's non-KV allocation moved.
    fixed_cost_bytes: 86900000000
    fixed_cost_basis: "MEASURED, inherited from `reasoning` (identical weights); re-read from this profile's own boot log"
    uncertified_reason: >-
      Isolation arm: identical weights/argv to `reasoning` on the PATCHED build, so its only
      claim is "the patch stack, alone, changes X". ⚠ Interaction the gate enforces: the
      primitive-ai INT4 overlay bind-mounts over .../qwen3_8_flash_next/nvidia/ple_layer.py,
      which is the SAME file the PLE-mmap patch appends its hook to — with ple_overlay: true
      the mmap hook is shadowed and VLLM_PLE_MMAP is inert. That is intended here (PLE stays
      the INT4 path so the arm changes one thing); the mmap path is measured in tier 2.
    certified_evidence: ""

  u2-blk:
    <<: *u_x
    label: "HD-489 t1 — u1-patch + block rejection sampling (spec method, one delta)"
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_overlay: true
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    spec_config:
      method: mtp
      num_speculative_tokens: 3
      rejection_sample_method: block
      draft_sample_method: probabilistic
    artifact_sets: [b1-awq, ple-int4]
    fixed_cost_bytes: 86900000000
    fixed_cost_basis: "MEASURED, inherited from `reasoning` (identical weights)"
    uncertified_reason: >-
      Delta vs u1-patch = the speculative-config rejection method only. Block rejection is
      what lets upstream claim the drafter cannot bias output, so it is also the arm that
      keeps the Slovenian draft-vocab question answerable later.
    certified_evidence: ""

  u3-s8:
    <<: *u_x
    label: "HD-489 t1 — u2-blk + 8 concurrent seqs + piecewise CUDA graphs (batch/shape, one delta)"
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_overlay: true
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    max_num_seqs: 8
    max_cudagraph_capture_size: 8
    spec_config:
      method: mtp
      num_speculative_tokens: 3
      rejection_sample_method: block
      draft_sample_method: probabilistic
    cudagraph_piecewise: true
    prompt_tokens_details: true
    artifact_sets: [b1-awq, ple-int4]
    fixed_cost_bytes: 86900000000
    fixed_cost_basis: "MEASURED, inherited from `reasoning` (identical weights); ⚠ 8 seqs + capture-8 is exactly the term HD-380 measured as STRANDED graph memory — this arm must record `nvidia-smi --query-compute-apps` per-pid MiB at REST or the delta is uninterpretable"
    uncertified_reason: >-
      Upstream runs --max-num-seqs 8; our house value is 4 because capture sizes above the
      decode batch are unreachable and strand memory in the single pool (docs/spark-incidents.md,
      HD-380). Here capture is raised WITH the batch, so the HD-380 invariant still holds —
      but the aggregate-vs-per-stream trade-off on OUR workload (agent-shaped, 2–4 sessions)
      is unmeasured, and the pool is shared with the host.
    certified_evidence: ""

  u4-pin:
    <<: *u_x
    label: "HD-489 t1 — u2-blk + prompt-KV pinning (our 0 %-prefix-hit lever, on the AWQ lane)"
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_overlay: true
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    spec_config:
      method: mtp
      num_speculative_tokens: 3
      rejection_sample_method: block
      draft_sample_method: probabilistic
    never_evict_prompt: "# Global instructions (loaded at every session start by pi)"
    never_evict_max_fraction: "0.03"
    artifact_sets: [b1-awq, ple-int4]
    fixed_cost_bytes: 86900000000
    fixed_cost_basis: "MEASURED, inherited from `reasoning` (identical weights); the pin cap (0.03) is charged INSIDE the declared pool, so it cannot raise the host hold"
    uncertified_reason: >-
      The never-evict patch lets a prompt substring PIN its KV blocks (≤ 25 % of the pool by
      default), which is the direct answer to the 0 %-prefix-hit re-prefill we measure on
      every long session (docs/hardware-spark.md §Unified-memory budget: 162 k-token session,
      0 % hit, 17,008 tok/s re-prefill). ⚠ AUTHORED WITH A PLACEHOLDER ON PURPOSE: the gate
      refuses any args_extra containing CHANGEME, because a pinned substring that matches
      nothing is an invisible no-op and one that matches everything is a pool leak. Fill it
      with a literal substring of the harness system prompt (scripts/pi-config), not a guess.
    certified_evidence: ""

