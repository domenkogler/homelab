    kv_cache_dtype: fp8           # THE one variable this arm turns. 1.70–1.89×, never 2× (main K/V
                                  # only — the QSA side-caches + GDN state stay bf16), and the
                                  # constant is spark_llm_kv_bytes_per_token.fp8 = 18,251 B/token.
    kv_cache_memory: "20000000000"  # = 1,095,830 slots = 4.18 × the 262,144 window = 136,978
                                    # tokens/stream at the seqs-8 ceiling, projected at 18,251
                                    # B/token. Same 20 GB `fast` occupies, different bytes/token.
    pool_ceiling_bytes: 20000000000 # per-profile, like `fast`. The CERTIFIED 16 GiB global stays the
                                    # ceiling for every other profile (hardware-spark.md §Chosen governor).
    max_num_seqs: 8               # max_cudagraph_capture_size deliberately NOT restated: it inherits
                                  # `_x`'s 4, which keeps the ≤ max_num_seqs assert honest. A copy of
                                  # an anchor value is how a shared default stops being shared.
    enforce_eager: true           # mmap × CUDA-graph pinning — the same path `fast` runs
    spec_config:
      method: mtp
      num_speculative_tokens: 3
      rejection_sample_method: block
      draft_sample_method: probabilistic
    health_start_period: 2400s    # PREWARM reads the whole FP8 table at boot, as in `fast`
    reasoning_surface: binary     # certified against THIS engine surface (harness-pi-engines.md §2)
    artifact_sets: [ar-hybrid, ple-fp8]   # both already staged for `fast` — this arm downloads nothing
    # Host-floor EXCEPTION: the same named one `fast` carries, because this arm changes the KV DTYPE
    # and not the weights, so the AR-hybrid checkpoint's measured non-KV hold is what binds. The
    # global (113.000e9, the measured rest floor) is priced from terms that do not hold for this
    # checkpoint. → docs/hardware-spark.md §The GLOBAL ceiling
    device_hold_ceiling_bytes: 112700000000
    fixed_cost_bytes: 92130000000
    fixed_cost_basis: "DERIVED — inherited from `fast` and NOT re-measured on this arm: `fast`'s
      MemAvailable-jump figure (docs/spark-incidents.md §Incidents #4/#5/#6, the only method that
      reports what the engine HOLDS). The KV dtype does not move the non-KV hold, so the figure
      carries over; gate 7 is what falsifies a DERIVED fixed_cost_bytes
      (spark/llm-profiles/README.md), and this arm's own watchdog curve replaces it on the boot
      that has a pinned image underneath it."
    certified: false
    uncertified_reason: >-
      (a) THE LINEAGE IT WAITS ON: the upstream patch stack rebuilt on a registry-verified v0.32.0
      arm64 build, its built image ID then recorded as spark_vllm_ultrafast_v32_image in
      group_vars/all/versions.yml — the empty pin IS the refusal, on the fast-sglang and ultrafast
      precedent (CONVENTIONS §7). Nothing about this arm can be measured before that commit exists.
      (b) fp8 IS GATED BY GATES 8–9, not by 0–7 alone: MTP acceptance read old-dtype-vs-new from
      /metrics on the same prompt class (every published fp8 measurement ran with speculative decode
      OFF, and our arms run spec_method: mtp), and quality against the model's own noise floor — the
      reference fp8 implementation went 6/6 to 2/6 on the long-reasoning battery while the needles
      still passed, because quantised keys perturb what the indexer selects.
      (c) THE ARITHMETIC IT PROMISES: 20,000,000,000 B / 18,251 B/token = 1,095,830 token slots =
