  u4-pin:
    <<: *u_x
    label: "t1 — u2-blk + prompt-KV pinning (our 0 %-prefix-hit lever, on the AWQ lane)"
    model_subdir: Qwen3.8-Flash-Next-AWQ
    ple_overlay: true
    ple_host_subdir: ples_int4
    ple_container_dir: /ples_int4
    spec_config:
      method: mtp
