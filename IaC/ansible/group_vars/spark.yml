  #     drafter-expert dispatch it drives, plus the `VLLM_PLE_MMAP` table path, are installed only
  #     by the patched lineage, and the AR-hybrid checkpoint WITHOUT that env dies at the first
  #     safetensors shard (`ar-blk-lean`: docs/spark-llm-profiles.md §7 +
  #     spark/reports/hd489-legs-20261006-1228/raw/b9-crash.txt). So fp8 KV and the patch stack are
  #     BOTH load-bearing here: `fast8` names one lineage — the patch stack rebuilt ON a v0.32 base
  #     (`spark_vllm_v32_base_image`) — and no stock-release AR-hybrid arm is authored.
  fast8:
    <<: *u_x
    label: "UNCERTIFIED — AR AutoRound-hybrid + FP8 PLE mmap + MTP3-block on fp8 KV (4.18 × the window; gated on the unpinned v0.32 lineage)"
    image: ultrafast-v32          # the patch stack rebuilt ON spark_vllm_v32_base_image, pin EMPTY
