# The shared argv/env fragments live in the "Shared argv/env fragments" section below — that
# section is the only definition. A duplicated copy of it here is DEAD TEXT: Ansible keeps the
# LAST mapping key and only warns, so editing the earlier copy changes nothing.
# The upstream mmap knobs (recipe/config/v16b/env + serve.sh pins), one SSOT list. Each is a
# plain non-secret string ⇒ quoted, not `>-` (CONVENTIONS §3 applies that rule to 1P values).
spark_llm_ple_mmap_env:
  - "VLLM_PLE_MMAP=1"
  - "VLLM_PLE_MMAP_DIR=/ple-table"
  - "VLLM_PLE_MMAP_WORKERS=32"
  - "VLLM_PLE_MMAP_PREWARM=1"
  - "VLLM_PLE_MMAP_PREFETCH=0"
  - "VLLM_PLE_MMAP_MADV_RANDOM=1"
  - "VLLM_PLE_MMAP_FAST_ROWS=16"
  - "VLLM_PLE_MMAP_CHUNK=8"
  - "VLLM_PLE_MMAP_FAST_PATH=1"
  - "VLLM_PLE_MMAP_FAST_MAX_ROWS=262144"
  - "VLLM_DRAFTER_EXPERTS_FP8=1"
# KERNEL-DISPATCH knobs are split OUT of the table set: they live in
# spark_llm_ple_dispatch_env and render only when a profile sets `ple_dispatch: true`, so a
# comparison varies one thing at a time. VLLM_FP8_HYBRID is inert on the base image.

# ---- Shared argv/env fragments the arms reference (never re-typed per arm) ----
# Plain LISTS at top level, on purpose: a Jinja expression inside `spark_llm_profiles` is
# stringified by scripts/gate/validate-docker-services.py (see the note at the foot of this file),
# so profiles reference these by a FLAG and the template composes them. One definition each:
# a re-typed 12-element splitting-op list is exactly the copy that silently drifts from the
# kernel names in a future image (CONVENTIONS §2 pointers/lists).
# Piecewise CUDA graphs + the splitting-op list, as upstream ships it. Compact JSON (no
# spaces) so ONE list item == ONE argv word in the compose `command:` block.
spark_llm_ultrafast_cudagraph_args:
  - "-cc.cudagraph_mode=PIECEWISE"
  - '-cc.splitting_ops=["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]'
# Prompt-token detail accounting: the ONLY in-band source of per-request prefill token counts
# (prefill_tok_s = prompt_tokens / TTFT), which every cold-prefill number in this lane needs.
spark_llm_ultrafast_diag_args:
  - "--enable-prompt-tokens-details"
# The upstream mmap knobs (recipe/config/v16b/env + the flags serve.sh pins), one SSOT list.
# Plain non-secret strings ⇒ quoted scalars, not `>-` (that rule is for 1P values).
# ⚠ VLLM_FP8_HYBRID + the drafter-expert flag only MEAN anything on the patched build (they
# dispatch through vllm_fp8_hybrid.py, which the lineage installs); on the base image they
# are inert. Rendered only when the profile declares ple_mmap: true.
spark_llm_ple_dispatch_env:
  - "QWEN38NEXT_LOW_LATENCY_GEMM=1"
  - "QWEN38NEXT_LLG_PDL=0"
  - "VLLM_VERIFY_TOPK_TRITON=1"
  - "VLLM_KEEP_DRAFT_BLOCKS=1"
  - "VLLM_MARLIN_USE_ATOMIC_ADD=1"
  - "VLLM_USE_DEEP_GEMM=0"
  - "VLLM_FP8_HYBRID=1"

# Resolve the active profile. Unknown profile name = undefined key = the render
# aborts (fail-loud); roles/spark-llm-profile names the valid list up front.
# Engine entrypoints per engine family. A DICT, not a Jinja-templated alias, on purpose:
# scripts/gate/validate-docker-services.py loads group_vars natively but stringifies any value
# containing `{{ }}`, so an alias is unusable in the offline render. Templates therefore index
# `spark_llm_profiles[spark_llm_profile]` DIRECTLY; only the scalar pass-throughs below are flat.
spark_llm_engine_entrypoints:
  vllm: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
  sglang: ["python3", "-m", "sglang.launch_server"]

# Engine → image pin. For the GATE only (roles/spark-llm-profile asserts it is not
# empty); the compose template branches on `profile.engine` and names the pin
# directly, because a Jinja value living INSIDE a dict does not survive the offline
# validator's one-level resolution.
spark_llm_image_pins:
  vllm: "{{ spark_vllm_image }}"
  sglang: "{{ spark_sglang_image }}"

# Profile-referenced image pins. A profile names a LOGICAL image, never a pin: every pin lives in
# group_vars/all/versions.yml (CONVENTIONS §7) and this map is the only place a name becomes a
# reference. An EMPTY pin IS the gate — roles/spark-llm-profile refuses the profile before render.
spark_llm_profile_images:
  base: "{{ spark_vllm_image }}"
  ultrafast: "{{ spark_vllm_ultrafast_image }}"
  # The fp8-KV lineage: the patch stack rebuilt on `spark_vllm_v32_base_image`. Its pin is EMPTY by
  # design, which is what gates `fast8` (CONVENTIONS §7 — an empty pin IS the refusal).
  ultrafast-v32: "{{ spark_vllm_ultrafast_v32_image }}"
  sglang: "{{ spark_sglang_image }}"

# Resolve the active profile for roles (roles/spark-llm-profile reads this as a real
# dict at play time). Templates must NOT use it — see the note above.
spark_llm: "{{ spark_llm_profiles[spark_llm_profile] }}"

# vLLM (B1 proven — spark/BENCHMARK-PLAN.md §1)
spark_vllm_container: "{{ spark_llm_profiles[spark_llm_profile].container }}"
# Engine-port indirection for the llm.kogler.si route: an engine swap changes this value only —
# the spark edge route and the LiteLLM base_urls never change. It MUST match the engine's own
# listen port, healthcheck included.
spark_engine_port: 8000
# OpenAI served-model id (llm.kogler.si /v1/models): vLLM serves it via --served-model-name,
# SGLang via served-model-name. Both LiteLLMs and pi see this id.
spark_vllm_served_name: "{{ spark_llm_profiles[spark_llm_profile].served_name }}"
spark_vllm_log_level: INFO
spark_vllm_cpu_offload: 1
spark_vllm_ple_offload_ready_timeout: 3600
spark_vllm_omp_num_threads: "1"
# Peak-bound term 1: the allocator form matters on a UNIFIED pool. `max_split_size_mb:512` forbids
# splitting any block ≥ 512 MB, so each new request shape forces a fresh slab that is never
# returned — cumulative growth, not an idle leak. `expandable_segments:True` lets segments grow in
# place instead of stranding per-shape slabs. Evidence: docs/spark-incidents.md #7/#8.
spark_vllm_pytorch_cuda_alloc_conf: "max_split_size_mb:512,expandable_segments:True"
# Peak-bound term 2: the chunked-prefill slab ceiling. A prefill chunk is the largest transient
# allocation the engine produces, so a smaller chunk shrinks both the slab and the number of
# distinct shapes the allocator sees. Cost = prefill TTFT on long prompts: this box trades
# throughput for uptime, because a global OOM wedges the whole box, not just the container.
spark_vllm_max_num_batched_tokens: "{{ spark_llm_profiles[spark_llm_profile].max_num_batched_tokens }}"
spark_vllm_shm_size: 32g
spark_vllm_memlock: -1
spark_vllm_stack: 67108864
# Memory cage: the container must NEVER be able to claim the whole unified pool. A limit above the
# coherent-pool size lets the kernel's global OOM fire under load and take the GPU stack with the
# engine; the cage must sit below the pool so a relapse kills ONLY this container.
# ⚠ Read OUTSIDE the template by roles/spark/files/spark-oom-watchdog.sh — it follows the active
# profile, so the watchdog's cage travels with the flip.
spark_vllm_memory_limit: "{{ spark_llm_profiles[spark_llm_profile].memory_limit }}"
# Removed key: the staged weights pack compressed-tensors (config.json quant_method), so forcing
# --quantization awq mismatches and the engine dies at ModelConfig validation. vLLM reads the
# packed format from the model config when the flag is omitted.
spark_vllm_max_num_seqs: "{{ spark_llm_profiles[spark_llm_profile].max_num_seqs }}"
# Sizing: `usable = MemAvailable − CmaFree`. max_model_len must fit the shrunken KV pool inside the
# coherent pool together with weights + PLE mirror + pinned buffers — an over-subscribed context
# size guarantees a global OOM at load. Native ceiling and the bench matrix:
# docs/hardware-spark.md §Bench + engine selection
spark_vllm_max_model_len: "{{ spark_llm_profiles[spark_llm_profile].max_model_len }}"
# This key does not exist: this vLLM build has no swap_space in EngineArgs — `--swap-space` is
# unrecognized and crashes the engine at argv-parse. Offload is managed inside the engine config.
# See docs/hardware-spark.md for the bench note.
spark_vllm_kv_cache_dtype: "{{ spark_llm_profiles[spark_llm_profile].kv_cache_dtype }}"
# ===== GPU×host unified-memory governance =====
# GB10 has ONE 121.62 GiB pool for GPU and host: every GiB of KV pool is a GiB the
# OS/docker/Alloy/dashboard do not get, and the stopping force is the kernel's global OOM killer,
# NOT the cgroup cage (GPU pages are not cgroup-charged).
# Model + sizing table: docs/hardware-spark.md §Unified-memory budget & OOM governance
#
# Governor: the explicit KV pool (--kv-cache-memory-bytes) is the ONLY dial — this build ignores
# gpu_memory_utilization once kv_cache_memory_bytes is set (its CacheConfig/gpu_worker source).
# Certified sizing: docs/hardware-spark.md §Chosen governor
#
# DO NOT raise the KV pool further in bf16 — BOOT-side headroom is the binding side, and the next
# KV byte is --kv-cache-dtype fp8's job. Bench-guard floors are on `usable` (MemAvailable −
# CmaFree), not raw MemAvailable: do not move them without re-measuring (spark/stability-test.md §2).
spark_vllm_kv_cache_memory: "{{ spark_llm_profiles[spark_llm_profile].kv_cache_memory }}"
# Do not reintroduce a gpu_memory_utilization key: with kv_cache_memory_bytes set this build's
# determine_available_memory() skips memory profiling and ignores the parameter entirely, so it
# would be dead config and a false ceiling. The explicit KV pool IS the budget decision on GB10;
# the container memory cage above is a host-RSS backstop only (GPU pages aren't cgroup-charged).
spark_vllm_distributed_executor_backend: "{{ spark_llm_profiles[spark_llm_profile].distributed_executor_backend }}"
# ---- cudagraph capture-size cap ----
# Cap CUDA-graph capture at the decode batch (max_num_seqs): this build captures
# [1,2,4,8,16,24,32] and every size above the batch is captured but can NEVER be used — stranded
# memory in the ONE pool the host and the engine share. Cap it here rather than with
# --enforce-eager, which also drops graphs and costs decode throughput.
# Gauge: nvidia-smi --query-compute-apps (GB10 reports memory.total/used as N/A) ·
# docs/spark-incidents.md
spark_vllm_max_cudagraph_capture_size: "{{ spark_llm_profiles[spark_llm_profile].max_cudagraph_capture_size }}"
spark_vllm_enforce_eager: false          # per-profile: template reads spark_llm.enforce_eager
spark_vllm_spec_method: "{{ spark_llm_profiles[spark_llm_profile].spec_method }}"
spark_vllm_spec_tokens: "{{ spark_llm_profiles[spark_llm_profile].spec_tokens }}"
# Do not reintroduce `disable_by_batch_size`: this build has no such SpeculativeConfig field, so
# the key fails at parse time. num_speculative_tokens_per_batch_size (a list of inclusive
# (start,end,K) ranges) is the key a dynamic spec schedule needs.

# No local router container: llm-d is a Kubernetes inference-pool stack (endpoint-picker /
# disagg-sidecar route Envoy+K8s pools), not a single-node :8080 gateway, so LiteLLM fronts the
# engine endpoint directly.

# logging
spark_logging_driver: json-file
spark_logging_max_size: 50m
spark_logging_max_file: "5"