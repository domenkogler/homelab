    label: "t1 — patched lineage on the NVFP4 weights (JIT question, 0 new GB)"
    model_subdir: Qwen3.8-Flash-Next-mixed-NVFP4-FP8
    ple_host_subdir: ples_nvfp4
    ple_container_dir: /ples_nvfp4
    kv_cache_memory: "11000000000"      # = the `fast` lane's pool: NVFP4 weights pay out of
    artifact_sets: [nvfp4-mixed, ple-nvfp4]   # the SAME pool (R2-nvfp4.md §B)
    # ⚠ NOT a copy of `fast`: `fast` carries VLLM_GDN_DECODE_KERNEL=triton, which is what
    # made it 502 at 262k. This arm boots the patched build WITHOUT that env — if
    # the fla shmem/warps patches are what that fix needed, THIS is where it shows.
    fixed_cost_bytes: 92100000000
    fixed_cost_basis: "DERIVED (`fast`'s basis: reasoning's 86.9 GB + the 5.2 GB NVFP4 core-weight delta) — verified within boot-log resolution by run #3 (pool printed 354,248 tokens ≈ 11 GB)"
    uncertified_reason: >-
      The fix is authored as a code change on `fast`; this arm is the independent read
      of the same question (do the upstream GDN/FLA patches remove the at-inference kernel
      JIT that cost run #3 its gate 3?) on weights + tables already staged. Two arms, one
      question — whichever lands first is the answer, the other becomes the control.
    certified_evidence: ""

  # ── tier 2 · the upstream target + FP8 PLE mmap (~130 GB onto `/`) ────────────
  ar-mmap:
    <<: *u_x
    label: "t2 — AutoRound-hybrid target + FP8 PLE table from disk, spec OFF"
    models_root: os
    model_subdir: Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid
    ple_offload: false                  # the primitive-ai CPU-offload env is the INT4 path;
    ple_overlay: false                  # this is the OTHER PLE strategy (mmap the FP8 table
