    models_root: os
    model_subdir: Qwen3.8-Flash-Next-W4A16-AutoRound-hybrid
    ple_offload: false
    ple_overlay: false
    ple_host_base: models
    ple_host_root: os
    ple_host_subdir: ple-table-fp8
    ple_container_dir: /ple-table
    ple_staged_marker: ".hf-staged"
    ple_mmap: true
    ple_dispatch: true            # constitutive on this checkpoint, exactly as in `fast`: without the
