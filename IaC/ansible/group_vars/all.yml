---
# Global variables for all managed nodes

timezone: Europe/Ljubljana
locale: sl_SI.UTF-8
# Home location (Maribor, SI) — used by HA weather integrations (meteoblue) and others.
# Keep in sync with HA location settings (docs/home-assistant-current.md).
home_latitude: 46.5596
home_longitude: 15.6355
ntp_servers:
  - 0.si.pool.ntp.org
  - 1.si.pool.ntp.org
op_vault: Homelab
domain_public: kogler.si
domain_local: kogler.si    # reserved for future split-horizon scenarios — currently unused

# GPU group IDs — standard Debian 12/13 (bookworm/trixie).
# video:44 (static since Debian 1.x), render:104 (since Debian 11 bullseye).
# Used by ollama, immich-ml, jellyfin, sunshine for /dev/dri access.
# Verify with: getent group render video
gpu_render_gid: 104
gpu_video_gid: 44

# ==== Shared service knobs (used across host templates) ====
# traefik image version — shared by oldsrv `traefik` (edge) and Pi `traefik-ha`.
# Pinned semver (KOPS-005 / HD-61) — Renovate keeps it current via docker datasource.
traefik_version: v3.5.2
# Let's Encrypt account contact — REQUIRED to register the ACME account when the
# first cert is issued (wildcard *.kogler.si via DNS-01 on oldsrv's `traefik`).
letsencrypt_email: domen@kogler.si
# traefik-certs-dumper (certs-dumper sidecar on oldsrv `traefik`) — extracts the
# wildcard PEM pair out of acme.json into /opt/traefik/certs with the exact
# wildcard_cert_file / wildcard_cert_key_file names (the Pi edge syncs from these).
certs_dumper_version: v2.8.3
# Tuwunel (Matrix homeserver, jevolk/tuwunel) image tag — MUST be pinned to a verified
# semver at first deploy (KOPS-030 / HD-121): it is an obscure single-maintainer image facing
# public federation, so `latest` is a supply-chain risk. Set the exact tag you verified against
# the registry here; Renovate docker datasource will then keep it current.
tuwunel_version: latest
# CrowdSec Traefik bouncer plugin version — explicit (KOPS-029 / HD-87): previously the
# hardcoded default in the traefik compose; now a group_var so Renovate can track it and it
# stays in sync with the CrowdSec LAPI (drift would silently break blocking).
crowdsec_bouncer_plugin_version: v0.4.0
# CrowdSec collections to install (HD-85 / KOPS-041): which app logs CrowdSec
# parses for WAF/brute-force. Included: traefik + linux (baseline) + the exposed
# auth-surfaces home-assistant, matrix (Synapse/Tuwunel), grafana. Extend here as
# services are exposed (qBittorrent, jellyfin, n8n …) — a collection only does
# something if its logs are ALSO sent to CrowdSec (docker.sock container-log parsing).
crowdsec_collections: "crowdsecurity/traefik crowdsecurity/linux crowdsecurity/home-assistant crowdsecurity/matrix crowdsecurity/grafana"
# MinIO (S3 object store, HD-131 D1) image tag — pin to a verified semver at deploy (KOPS-005
# class / HD-61 convention). MinIO publishes immutable RELEASE.<date> tags; set the exact tag you
# verified here (default `latest` placeholder — Renovate docker datasource tracks it once pinned).
minio_version: latest
# osixia/keepalived image tag — shared by Pi primary + oldsrv standby (HD-124/KOPS-053).
# Pinned to the verified semver (no `v` prefix on this image's tags); Renovate docker
# datasource keeps it current once the tag is resolvable at render.
keepalived_version: "2.3.4"
# PairDrop (linuxserver.io) image tag — internal P2P file share (HD-113). Pinned semver
# (linuxserver tags use plain `X.Y.Z`, no `v`); Renovate docker datasource tracks it.
pairdrop_version: "1.11.2"
# Stirling PDF (frooodle/s-pdf) image tag — internal PDF toolkit (HD-58). Pinned semver
# with `-fat` variant (bundles all Tesseract langs incl. Slovenian `slv` for OCR);
# Renovate docker datasource tracks it.
stirling_pdf_version: "2.14.3-fat"
# pgvector (postgres + vector extension) image tag — AI-stack RAG vector store (HD-102).
# Pinned to pg16 on Debian 13 (trixie) to match host base; Renovate docker datasource tracks it.
pgvector_version: "0.8.6-pg16-trixie"
# Wildcard *.kogler.si cert pair file names — shared by BOTH Traefik edges so the
# oldsrv ACME issuer and the Pi cert-sync can never drift. Paths:
#   oldsrv traefik: ACME storage/checkout must emit exactly these names.
#   Pi traefik-ha:  synced to /opt/traefik-ha/certs/ with these names.
wildcard_cert_file: kogler.si.pem
wildcard_cert_key_file: kogler.si-key.pem
# The wildcard SAN root — the certs-dumper matches acme.json by this domain and
# the Pi/oldSrv edges serve all *.kogler.si hosts from the dumped pair.
wildcard_cert_domain: "kogler.si"
# Doco-CD metrics listen port — host-network container (needs docker.sock); /metrics
# answered on the host at this port. Prometheus scrapes via host.docker.internal
# (host-gateway extra_hosts in the prometheus template). Verified at HD-02 activation.
doco_cd_metrics_port: 9120
# Technitium DNS secondary (Pi) — the dns-pi.kogler.si web-UI backend (== pi_home_ip, SSOT-derived).
technitium_secondary_ip: "{{ pi_home_ip }}"

# ==== UPS / NUT (docs/hardware-ups.md) ====
# Single SSOT `nut_exporter` runs as a HOST binary on the NUT master (nas, no Docker)
# and is scraped by Prometheus (on oldsrv) over the Home VLAN. Host derived from the
# address SSOT below (nas @ VLAN 10); port matches the nut role's `nut_exporter_listen`.
nut_exporter_host: "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# nut_exporter_listen in roles/nut/defaults/main.yml (:9199); keep in sync.
nut_exporter_port: 9199

# ==== ZFS exporter (nas, host binary — storage role) ====
# Single SSOT ZFS pool exporter on nas (no Docker) — mirrors nut_exporter.
# Host derived from the address SSOT below (nas @ VLAN 10); port matches the
# storage role's `zfs_exporter_listen` (:9198). Metrics: zfs_pool_allocated/
# size/health per pool. Feeds the pool-usage/degraded alert rules.
zfs_exporter_host: "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# zfs_exporter_listen in roles/storage/defaults/main.yml (:9198); keep in sync.
zfs_exporter_port: 9198

# ==== Kopia S3 backup target (iDrive e2) ====
# Default bucket and endpoint for the kopia-server repository.
# Override in host_vars or via extra vars if different targets are needed.
kopia_s3_bucket: kogler-homelab
kopia_s3_endpoint: https://e2.idy.io

# ==== IPv4 address plan — SSOT (auto-rendered to docs/network-addresses.md) ====
# Hand-edit here ONLY; regenerate docs/network-addresses.md after changes.
#
# HA virtual IP (keepalived/VRRP) on Home VLAN 10 — ha.kogler.si. Canonical name `ha-vip`.
# D2: single /32, no reserved block. Home DHCP pool (10.10.1.100-.199) must stay <= .199
# and must never be extended into the VIP; 10.10.1.200 is reserved — not a normal static lease.
ha_vip: 10.10.1.200                # keepalived VIP — ha.kogler.si
ha_vip_cidr: 24                    # VIP prefix — shared by primary + standby keepalived
ha_keepalived_vrid: 51            # VRRP virtual_router_id — MUST match on both HA nodes
# HA reverse-proxy trust (KOPS-039 / HD-81): only specific Traefik edge container IPs are
# trusted for X-Forwarded-For, NOT the whole traefik-public /16. Each host runs its OWN
# traefik-public Docker bridge; fill the exact container IPs (default/`172.20.0.2/32` on the
# oldsrv edge, adjust the Pi traefik-ha edge) at deploy. Both edges must be listed since the
# SAME configuration.yaml is rendered on primary + standby.
ha_trusted_proxies:
  - 172.20.0.2/32            # oldsrv traefik (traefik-public bridge default .2) — verify at deploy
  # - <pi-traefik-ha-ip>/32  # Pi traefik-ha edge container IP — uncomment/verify per host
# RaspberryMatic standby CCU (macvlan on Home VLAN) — XML-RPC 2001/2010 target for
# ha-failover.sh (derived from the address SSOT).
homematic_ccu_oldsrv_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'homematic-ccu-oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# HA sync (Pi-initiated cert/config sync — failover primary side): oldsrv and Pi
# Home-VLAN IPs, used by ha-cert-sync/ha-config-sync timers + authorized_keys
# source restriction. Derived from the address SSOT.
oldsrv_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"
pi_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}"
network_vlans:
  - { id: 10, name: Home,         subnet: "10.10.1.0/24",  pool: "10.10.1.100-10.10.1.199",  ssid: "Kogler" }
  - { id: 20, name: IoT,          subnet: "10.10.20.0/24", pool: "10.10.20.100-10.10.20.199", ssid: "Kogler IOT" }
  - { id: 21, name: IoT-Internet, subnet: "10.10.21.0/24", pool: "10.10.21.100-10.10.21.199", ssid: "Kogler IOT WAN" }
  - { id: 30, name: Guest,        subnet: "10.10.30.0/24", pool: "10.10.30.100-10.10.30.199", ssid: "Kogler guest" }
  - { id: 40, name: Kids,         subnet: "10.10.40.0/24", pool: "10.10.40.100-10.10.40.199", ssid: "Kogler Kids" }
  - { id: 50, name: Media,        subnet: "10.10.50.0/24", pool: "10.10.50.100-10.10.50.199", ssid: "" }
  - { id: 99, name: Management,   subnet: "10.10.99.0/24", pool: "10.10.99.50-10.10.99.99",  ssid: "" }
network_static_hosts:
  # Management VLAN 99
  - { name: router,   vlan: 99, ip: "10.10.99.1",  role: "RB4011 gateway" }
  - { name: switch,   vlan: 99, ip: "10.10.99.2",  role: "CRS328 mgmt" }
  - { name: ap-garage,  vlan: 99, ip: "10.10.99.3", mac: "6C:3B:6B:7D:B9:C5", role: "wAP ac (garaža)" }
  - { name: ap-spalnica, vlan: 99, ip: "10.10.99.4", mac: "C4:AD:34:42:F1:7D", role: "hAP ac² (spalnica)" }
  - { name: ap-dnevna, vlan: 99, ip: "10.10.99.5", mac: "64:D1:54:AA:24:D1", role: "hAP ac (dnevna)" }
  - { name: ap-spare,  vlan: 99, ip: "10.10.99.6", role: "hAP ac² spare" }
  - { name: ups,      vlan: 99, ip: "10.10.99.9",  role: "PowerWalker VFI 3000 IoT" }
  - { name: nas,      vlan: 99, ip: "10.10.99.10", role: "HP MicroServer Gen8" }
  - { name: ilo,      vlan: 99, ip: "10.10.99.11", role: "nas iLO4 BMC" }
  - { name: pi,       vlan: 99, ip: "10.10.99.20", role: "RPi4 node + DNS secondary" }
  - { name: oldsrv,   vlan: 99, ip: "10.10.99.30", role: "i7-7700K node + DNS primary" }
  # Home VLAN 10
  - { name: router,   vlan: 10, ip: "10.10.1.1",   role: "Home gateway" }
  - { name: nas,      vlan: 10, ip: "10.10.1.10",  role: "Cockpit/NFS/NUT master" }
  - { name: pi,       vlan: 10, ip: "10.10.1.20",  role: "node + DNS secondary (VRRP anchor)" }
  - { name: oldsrv,   vlan: 10, ip: "10.10.1.30",  role: "node + DNS primary (VRRP anchor)" }
  - { name: homematic-ccu-pi, vlan: 10, ip: "10.10.1.50", role: "RaspberryMatic CCU — Pi primary (macvlan)" }
  - { name: homematic-ccu-oldsrv, vlan: 10, ip: "10.10.1.51", role: "RaspberryMatic CCU — oldsrv standby (macvlan)" }
  - { name: ha-vip,   vlan: 10, ip: "10.10.1.200", role: "keepalived VIP — ha.kogler.si" }

  # Router gateways on the remaining VLANs — RB4011 is the .1 inter-VLAN gateway on each.
  - { name: router, vlan: 20, ip: "10.10.20.1",  role: "IoT gateway" }
  - { name: router, vlan: 21, ip: "10.10.21.1",  role: "IoT-Internet gateway" }
  - { name: router, vlan: 30, ip: "10.10.30.1",  role: "Guest gateway" }
  - { name: router, vlan: 40, ip: "10.10.40.1",  role: "Kids gateway" }
  - { name: router, vlan: 50, ip: "10.10.50.1",  role: "Media gateway" }

# Infrastructure / non-VLAN ranges (tunnels, overlays, Docker bridges) — rendered to
# docs/network-addresses.md §Infrastructure networks. Names are stable tokens used in
# docs/runbooks (e.g. `wg-s2s`, `ha-vip`); values are hand-edited here only.
network_ranges:
  - { name: wireguard,         cidr: "10.255.0.0/16", purpose: "WireGuard / tunnel family (S2S links, VPS networks)" }
  - { name: wg-s2s,            cidr: "10.255.40.0/30", purpose: "WireGuard S2S link — home RB4011 (.1) ↔ VPS (.2)" }
  - { name: wg-vps-services,   cidr: "10.255.20.0/24", purpose: "WireGuard — VPS services network" }
  - { name: wg-vps-dmz,        cidr: "10.255.10.0/24", purpose: "WireGuard — VPS DMZ" }
  - { name: wg-vps-lab,        cidr: "10.255.30.0/24", purpose: "WireGuard — VPS lab" }
  - { name: headscale,         cidr: "100.64.0.0/10",  purpose: "Headscale overlay (CGNAT, Tailscale-compatible)" }
  - { name: traefik-public,    cidr: "172.20.0.0/16",  purpose: "Docker bridge — Traefik edge ↔ exposed services" }
  - { name: services-internal, cidr: "172.21.0.0/16",  purpose: "Docker bridge — app ↔ app communication" }
  - { name: db-internal,       cidr: "172.22.0.0/16",  purpose: "Docker bridge — databases (fully isolated)" }
  - { name: llm-backend,       cidr: "172.23.0.0/16",  purpose: "Docker bridge — LLM backend (Ollama) ↔ LiteLLM only, fully isolated (HD-59)" }
  - { name: site,              cidr: "10.10.0.0/16",   purpose: "Whole homelab site — all VLANs (10.10.x.0/24)" }
  - { name: nfs-clients,       cidr: "10.10.1.30/32",  purpose: "NFS export clients — nas tank/data + bulk/media → oldsrv (Home VLAN IP)" }

# Single-namespace DNS: everything (hosts + services) is under kogler.si.
# Internal-only hosts/services are NOT published in public DNS (split-horizon).

# Allowed Ansible management users (the only users that may receive sudo).
# ai-debug (AI access) must NEVER be added here — see roles/common/tasks/system.yml.
ansible_admin_users:
  - ansible-admin   # created by preseed post_install.sh on all preseed hosts (nas/oldsrv/VPS/Pi)