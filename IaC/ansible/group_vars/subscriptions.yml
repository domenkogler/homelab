---
# subscriptions.yml — SSOT for paid/free subscriptions & renewal dates.
# ---------------------------------------------------------------------
# This is the SINGLE source of truth for renewal/schedule data driving:
#   - Homepage "Subscriptions" tile group (homepage_services.yaml.j2)
#   - Homepage calendar widget (homepage_widgets.yaml.j2)   [infra, post-deploy]
#   - n8n renewal-notification workflow                      [infra, post-deploy]
#   - docs/subscription.md table (derived; prose stays hand-authored)
#
# Conventions:
#   - `valid_until`  = YYYY-MM-DD; Homepage/n8n flag within `reminder_days`.
#   - `cost_eur`     = monthly EUR, 0 for free tiers (kept 0,00 in render).
#   - `since`        = when the subscription started / was bought.
#   - `secret`       = 1Password ref (vault Homelab) if one exists, else null.
#   - `calendar_url` = iCal/CalDAV feed URL for the Homepage calendar widget.
#                     Populate post-deploy (Infomaniak kSuite CalDAV, HD-30);
#                     null = not yet wired.
#   - `notify`       = channels to remind on (signal / email); drives the n8n
#                     workflow. Empty = no push reminder (feed-only/tiles only).
#   - `status`       = active | planned | dropped | deferred (drives grouping).

op_vault: Homelab

subscriptions:
