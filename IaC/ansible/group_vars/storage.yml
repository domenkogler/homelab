---
# Storage server configuration — NAS (HP MicroServer Gen8, ZFS, NO Docker)
#
# Host facts live in host_vars/nas.kogler.si.yml and their owning docs
# (docs/hardware-nas.md, docs/storage.md). This file exists so the connection
# doctrine below is a group var (CONVENTIONS §3: service/arch values →
# group_vars/).

# Reachability: nas sits behind the home NAT, so a runner that is not LAN-attached
# reaches it ONLY via the VPS jump. The jump therefore travels IN THE INVENTORY so
# every play sees it (storage.yml, nut-deploy.yml, dns-seed.yml, all.yml,
# monitoring) rather than living in a per-command flag or one laptop's ssh alias —
# same doctrine as playbooks/spark.yml. From a LAN-attached runner it is a no-op.
# Off-LAN matrix + the laptop alias contract: docs/network-vpn.md
# §Reaching LAN nodes when away.
ansible_ssh_common_args: "-o ProxyJump=vps"

# ==== SSH access (roles/access) ====
# nas runs roles/ai_diag → the restricted ai-debug account is converged here too.
access_accounts_extra: "{{ [access_account_ai_debug] }}"
