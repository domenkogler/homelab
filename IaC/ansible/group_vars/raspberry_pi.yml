---
# Raspberry Pi 4 — Home Assistant (PRIMARY node)
# Failover design: docs/smart-home-failover.md

# Reachability: the Pi sits behind the home NAT, so a runner that is not
# LAN-attached reaches it ONLY via the VPS jump. Carried as a GROUP VAR so every
# play that touches this host applies it (raspberry_pi.yml, nut-deploy.yml,
# dns-seed.yml, all.yml, monitoring): an ssh ALIAS does not carry a converge,
# because Ansible types the ansible_host IP and OpenSSH matches the name ACTUALLY
# TYPED. A no-op from a LAN-attached runner. Leg = Home (VLAN 10). Matrix + alias
# contract: docs/network-vpn.md §Reaching LAN nodes when away.
ansible_ssh_common_args: "-o ProxyJump=vps"

# HA container pin: a semver, never the `stable` mutable alias — primary and standby
# MUST run the same version for a clean manual failover. The pin itself lives in
# `group_vars/all/versions.yml` (§7 one-place rule); tag scheme is calver.
home_assistant_install_method: docker   # 'docker' or 'supervised' — use docker for keepalived/VIP
# The Pi also runs a minimal VIP-bound edge (`traefik-ha`) that keeps ha.kogler.si
# reachable when oldsrv is down — see docs/smart-home-failover.md.
# (traefik_version is defined in group_vars/all/versions.yml — shared with the oldsrv edge.)
ha_edge_enabled: true
# VIP / VRRP: Pi is MASTER (owns the VIP — {{ ha_vip }} — in normal mode); standby on oldsrv is BACKUP.
# ha_vip / ha_vip_cidr are defined once in group_vars/all/ (SSOT).
ha_primary_state: MASTER
ha_primary_priority: 110      # higher than standby (100) so Pi keeps the VIP
ha_primary_peer_priority: 90  # failback peer mode — below standby (100/120), never steals the VIP

# Pi also runs a small docker_services set (needs the docker + docker_services roles):
#   - home-assistant-primary: PRIMARY HA + keepalived MASTER (configs rendered by the
#     home_assistant role BEFORE docker_services runs)
#   - technitium-secondary: the Pi's Technitium instance. ⚠ The NAME is historical:
#     the live tier is VPS primary + oldsrv secondary + Pi TERTIARY, so do not read
#     "secondary" here as the role — docs/network-dns.md §the DNS tier owns it.
#   - traefik-ha: HA + DNS-secondary web-UI edge (VIP-bound; oldsrv-down gap)
#
#   - raspberrymatic is OUT of the Pi loop (parked): the HmIP-HAP stays in cloud
#     mode until an HmIP-RFUSB is bought. Re-add when local RF is purchased and fill
#     the USB by-id into host_vars/pi.kogler.si.yml.
docker_services:
  - { name: home-assistant-primary, template_dir: home-assistant-primary }
  # The Pi is the resolver VLAN 10 asks FIRST, so it is the instance that carries the
  # public upstream. Forwarding is opt-in per instance: an instance without the flag is
  # seeded with `forwarders=` empty and chases the roots instead.
  # Value + the full rationale (why two, why never the router/oldsrv): dns_resolver_upstreams
  # in group_vars/all/main.yml; behaviour: docs/network-dns.md §Resolver upstream.
  #
  # `technitium_settings` is this instance's override of the fleet dict
  # `technitium_resolver_settings` — the same opt-in shape as technitium_forwarders, and the ONLY
  # place a per-instance resolver value may differ. It differs here for one key pair:
  # this is the instance the router's :53 dst-nat aims traffic at, so it is the instance that
  # carries the per-device query record, and a query record without a stated retention is a
  # surveillance surface. Retention is therefore rendered with the flag, never left at the
  # product default and never hand-set in the UI. Rationale + readers: docs/network-dns.md
  # §Per-Subnet DNS Policy (query-log ruling).
  - { name: technitium-secondary,  template_dir: technitium, instance: secondary-pi,
      technitium_forwarders: "{{ dns_resolver_upstreams }}",
      technitium_settings: { logQueries: true, maxLogFileDays: 14 } }
  - { name: traefik-ha,            template_dir: traefik-ha, enabled: "{{ ha_edge_enabled }}" }   # HA edge, VIP-bound (oldsrv-down gap)
  # Dozzle remote agent — exposes pi's containers to the oldsrv LAN log hub (llogs.kogler.si)
  # over the Home VLAN (:7007, LAN-only bind — never WAN).
  - { name: dozzle-agent,          template_dir: dozzle-agent, enabled: true,
      dozzle_agent_listen: "{{ pi_home_ip }}", dozzle_agent_hostname: "pi" }
