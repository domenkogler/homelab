---
# Versions — Docker image version pins (SSOT, single file)
# -------------------------------------------------------------
# Every `*_version` image pin for ALL hosts lives here, in ONE file,
# so Renovate docker datasource updates + the version review are a
# single sheet. Loaded for the implicit `all` Ansible group (every
# managed host) alongside group_vars/all/.
# Keep infrastructure/network/identity vars in all.yml, NOT here.
#
# A fleet refresh sets every pin to the newest STABLE release published at least
# 3 days ago (the `renovate.json` `stabilityDays: 3` rule), which Renovate cannot
# do while it is pointed at `domen/test`. Derive + re-verify with
# `scripts/ansible/image-pin-probe.py --verify`. Pins whose value carries a `sha256`
# digest are NOT touched by a refresh — the digest is the load-bearing pin and a
# tag bump there needs its own re-certification.

# ==== Edge / identity ====
# traefik image version — shared by oldsrv `traefik` (edge) and Pi `traefik-ha`.
# Pinned semver — Renovate keeps it current via the docker datasource.
traefik_version: v3.7.13   # v3.5's docker client defaults to API 1.24 and is rejected by Engine 29 (min 1.40); v3.7 negotiates. v3.7.14 sits inside the 3-day hold.
# traefik-certs-dumper (certs-dumper sidecar on oldsrv `traefik`) — extracts the
# wildcard PEM pair out of acme.json into /opt/traefik/certs (the Pi edge syncs from these).
certs_dumper_version: v2.11.4  # ldez/traefik-certs-dumper on Docker Hub — verify the image path exists
# CrowdSec Traefik bouncer plugin version — an explicit group_var so Renovate can track
# it and it stays in sync with the CrowdSec LAPI (drift silently breaks blocking).
crowdsec_bouncer_plugin_version: v1.7.1   # repo + tag must both exist: a path that 404s fails at every container start
crowdsec_version: "v1.8.1"        # crowdsecurity/crowdsec (the Docker Hub tag carries a `v`)
crowdsec_web_ui_version: "2026.10.1"   # ghcr.io/theduffman85/crowdsec-web-ui — 2026.10.2 exists
                                      # but sits inside the 3-day hold.

# ==== Identity / access ====
# Authentik minors are CHAINED: upgrade to the newest patch of each minor on the way
# (2026.5 → 2026.6 → 2026.7 → 2026.8) — a two-minor jump in one converge is the case
# where a migration never runs. Read the release notes of every skipped minor first.
authentik_version: "2026.8.3"     # ghcr.io/goauthentik/server + ldap (GoAuthentik)
# The two authentik sidecars were HARDCODED in the template (`postgres:16-alpine`,
# `redis:7-alpine`) — no var, no Renovate trail, invisible to a fleet version review (§7).
authentik_db_version: "18.6-alpine"   # the fleet SSO database — the highest-blast-radius
                                  #   cluster here, so it moves with the proven shape: PGDATA pinned
                                  #   to the flat data path, single bind, dumps over STDIN (read_only
                                  #   rootfs), initdb args carrying the libc locale. Rollback = this
                                  #   line at 16.15-alpine AND the datadir moved back, both together;
                                  #   the old 16 datadir is kept aside on the VPS for that step.
authentik_redis_version: "8.10.2-alpine"  # redis — cache/queue only (auth sessions live in Postgres)

