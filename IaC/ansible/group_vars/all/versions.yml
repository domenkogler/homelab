---
# Versions — Docker image version pins (SSOT, single file)
# -------------------------------------------------------------
# Every `*_version` image pin for ALL hosts lives here, in ONE file,
# so Renovate docker datasource updates + the version review are a
# single sheet (HD-156, HD-134/KOPS-030). Loaded for the implicit
# `all` Ansible group (every managed host) alongside group_vars/all.yml.
# Keep infrastructure/network/identity vars in all.yml, NOT here.

# ==== Edge / identity ====
# traefik image version — shared by oldsrv `traefik` (edge) and Pi `traefik-ha`.
# Pinned semver (KOPS-005 / HD-61) — Renovate keeps it current via docker datasource.
traefik_version: v3.5.2
# traefik-certs-dumper (certs-dumper sidecar on oldsrv `traefik`) — extracts the
# wildcard PEM pair out of acme.json into /opt/traefik/certs (the Pi edge syncs from these).
certs_dumper_version: v2.8.3
# CrowdSec Traefik bouncer plugin version — explicit (KOPS-029 / HD-87): previously the
# hardcoded default in the traefik compose; now a group_var so Renovate can track it and it
# stays in sync with the CrowdSec LAPI (drift would silently break blocking).
crowdsec_bouncer_plugin_version: v0.4.0
crowdsec_version: "v1.7.8"          # crowdsecurity/crowdsec (Docker Hub tag has a `v`)

# ==== Identity / access ====
authentik_version: "2026.5.6"      # ghcr.io/goauthentik/server + ldap (GoAuthentik)

# ==== Tunnels / DNS ====
headscale_version: "0.29.3"         # headscale/headscale (docker tag strips `v`)

# ==== HA failover (keepalived) ====
# osixia/keepalived image tag — shared by Pi primary + oldsrv standby (HD-124/KOPS-053).
# Pinned to the verified semver (no `v` prefix on this image's tags); Renovate docker
# datasource keeps it current once the tag is resolvable at render.
keepalived_version: "2.3.4"

# ==== Tuwunel (Matrix homeserver) — MUST-pin, fluid/obscure ====
# jevolk/tuwunel image tag — obscure single-maintainer image facing public federation,
# so `latest` is a supply-chain risk (KOPS-030 / HD-121). Set the exact registry-verified
# tag here; Renovate docker datasource then keeps it current.
tuwunel_version: latest

# ==== File / PDF / P2P ====
# PairDrop (linuxserver.io) image tag — internal P2P file share (HD-113). Pinned semver
# (linuxserver tags use plain `X.Y.Z`, no `v`); Renovate docker datasource tracks it.
pairdrop_version: "1.11.2"
# Stirling PDF (frooodle/s-pdf) image tag — internal PDF toolkit (HD-58). Pinned semver
# with `-fat` variant (bundles all Tesseract langs incl. Slovenian `slv` for OCR);
# Renovate docker datasource tracks it.
stirling_pdf_version: "2.14.3-fat"

# ==== AI stack ====
# pgvector (postgres + vector extension) image tag — AI-stack RAG vector store (HD-102).
# Pinned to pg16 on Debian 13 (trixie) to match host base; Renovate docker datasource tracks it.
pgvector_version: "0.8.6-pg16-trixie"
# Docling Serve (quay.io/docling-project/docling-serve) CPU image tag — AI-stack OCR (HD-103).
# CPU-only torch build; pinned to a verified release; Renovate docker datasource tracks it.
docling_version: "v1.30.0"
# LiteLLM (LLM gateway spine) image tag — AI-stack (HD-100). LiteLLM publishes fluid
# build tags; `main-stable` is the documented stable tag used by their official compose.
# MUST pin to a verified semver (main-vX.Y.Z) at first deploy — see HD-121 precedent
# for the fluid-tag policy; Renovate tracks it once a resolvable tag is chosen.
litellm_version: main-stable
# Open WebUI (AI-stack chat + RAG UI) image tag — HD-101. Pinned to a verified semver;
# Renovate docker datasource tracks it. Base image connects to LiteLLM as an external
# OpenAI-compatible backend (no bundled CUDA variant needed).
openwebui_version: "0.11.0"
# OpenClaw (AI agent/orchestration, ex-Clawd) image tag — HD-104. Pinned to the latest
# stable release (date-based versioning); young project, MUST re-verify at deploy.
# GHCR is the primary registry for release automation/provenance.
openclaw_version: "2026.7.1"

# ==== Platform / records / tasks ====
# HD-134 / KOPS-030: pinned semvers for core services that previously fell back to
# `latest` via an undefined *_version var. Renovate docker datasource keeps each current.
# (Versions verified against upstream registries 2026-08-18.)
db_backup_version: "4.1.100"        # tiredofit/db-backup
forgejo_version: "16.0.2"           # codeberg.org/forgejo/forgejo (docker tag strips `v`)
grafana_version: "13.2.0"           # grafana/grafana OSS
kopia_version: "0.23.1"             # kopia/kopia
n8n_version: "2.35.3"               # n8nio/n8n
immich_version: "v3.1.0"            # ghcr.io/immich-app/immich-server (tag has `v`)
opencloud_version: "7.4.0"          # ghcr.io/opencloud-eu/opencloud (docker tag strips `v`)
# ONLYOFFICE Docs Server — WOPI helper for OpenCloud browser editing (HD-166). Registry-verified
# 2026-08-19: Docker Hub `onlyoffice/documentserver` latest stable 9.3.x is 9.3.0.1 (patch of 9.3.0).
# Renovate docker datasource tracks it; MUST re-verify at first deploy (HD-134/§7).
onlyoffice_version: "9.3.0.1"

# ==== Observability infra ====
prometheus_version: "v3.14.0"        # prom/prometheus (Docker Hub tag has a `v`)
loki_version: "3.7.6"                # grafana/loki (Docker Hub tag strips `v`)
blackbox_exporter_version: "v0.28.0"  # prom/blackbox-exporter (Docker Hub tag has a `v`)