# Versions — Docker image version pins (SSOT, single file)
# -------------------------------------------------------------
# Every `*_version` image pin for ALL hosts lives here, in ONE file,
# so Renovate docker datasource updates + the version review are a
# single sheet (HD-156, HD-134/KOPS-030). Loaded for the implicit
# `all` Ansible group (every managed host) alongside group_vars/all/.
# Keep infrastructure/network/identity vars in all.yml, NOT here.
#
# Last fleet-wide refresh: 2026-10-08 — every pin set to the newest STABLE release published
# at least 3 days ago (the `renovate.json` `stabilityDays: 3` rule), because Renovate is still
# pointed at `domen/test` (HD-264) and cannot do it. Derive + re-verify with
# `scripts/image-pin-probe.py --verify`; the migration caveats a bump costs are in the row that
# minted this sweep (todo.md). Pins whose value carries a `sha256` digest are NOT touched by a
# refresh — the digest is the load-bearing pin and a tag bump there needs its own re-certification.

# ==== Edge / identity ====
