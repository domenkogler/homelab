# sha256:dc099359c4a30611c59f8826bf6eb9780f38d4901470a3901d9eeb21854e0605).
# The semver tag IS multi-arch (unlike the stale `1.4.5-amd64`-style arch-only tags still on the
# repo, which have NO plain counterpart and do NOT correspond to a release — `1.4.5` 404s on the
# registry; do not pin one of those). Renovate docker datasource tracks rustdesk/rustdesk-server-s6.
# ⚠ 1.1.16 has no `-b/--bind` (1.1.17+); that flag is the future lever for binding ONE address
# instead of all interfaces — see services-admin.md §Exposure.
rustdesk_server_version: "1.1.16"

# ==== pi HOST seats (bare-Debian installs: scripts/harness/install-pi-debian.sh) ====
# The CONTAINER pins above (pi_dev_*) are not these: a host seat installs the pinned
# official Node TARBALL under ~/.local/share/pi-node/, because Debian 13's apt candidate
# is Node 20.19.2 while pi declares engines node>=22.19.0 — an apt-based seat is a
# harness that cannot start. Both seats (laptop +
# oldsrv) run exactly this shape, so one pin pair covers both: they must not
# drift, and a seat that is behind is a drift finding, not a version to guess.
pi_host_node_version: "22.23.3"              # an exact nodejs.org tarball patch release, never the `v22.x.x` alias —
                                             # that tag exists but is not a release.
pi_host_npm_package: "@earendil-works/pi-coding-agent"
pi_host_npm_version: "1.1.0"                 # npm dist-tag `latest`. A seat can run AHEAD of a pin when an installer uses
                                             # an unpinned `volta install @latest` — the pin then records what the seat
                                             # actually runs, it does not move the seat.
                                             # MUST equal `pi_dev_npm_version`. The DEBIAN seats do NOT move by reading
                                             # this line: `scripts/harness/pi-self-update.sh --push` is what moves a seat, and it
                                             # re-probes the binary to prove it.
pi_host_web_npm_package: "@ygncode/pi-web"
pi_host_web_npm_version: "0.0.1-beta.38"       # the observed version behind the mutable `beta` tag (§7 MUST-pin
                                               # exception: the cockpit self-updates inside @beta from the phone —
                                               # a pinned string in the seat's settings packages would stop
                                               # that path working)
# The seat's TUI skin (pi-open-tui, the pi package behind the footer that names the machine —
# docs/harness-pi-seat-identity.md §5a). Fleet-wide: every pi.dev node installs this pair through the two
# install-pi-* scripts, so it is a pin and not a seat-local `pi install npm:pi-open-tui`.
pi_host_tui_npm_package: "pi-open-tui"
pi_host_tui_npm_version: "0.3.11"              # npm dist-tag `latest` (`npm view pi-open-tui version`), which
                                               # is also the value the Win11 seat already runs

# The two agent-work pi packages every pi.dev seat carries. A package that exists only as a
# NAME-only `pi install npm:<name>` line in one script installs whatever npm answers, is
# classified as seat-local by the settings plane, and reaches the other seats only if a
# session hand-runs it — so nothing converges and no version is recorded anywhere. Naming
# them here is what makes them fleet state.
pi_host_subagents_npm_package: "pi-subagents"      # the subagent/orchestrator extension this repo's own lane workflow runs on
pi_host_subagents_npm_version: "0.76.1"            # npm dist-tag `latest` — re-probe it before pinning; the pin records
                                               # the observed value, it moves no seat by itself
pi_host_deepseek_npm_package: "pi-deepseek-optimized"   # DeepSeek-aware provider/harness tuning for the seats
pi_host_deepseek_npm_version: "1.0.4"              # npm dist-tag `latest` — re-probe it before pinning

# ==== Seat TUI font ====
# pi-open-tui draws its footer icons from a Nerd Font private-use glyph block, and `icons.mode:
# auto` picks Nerd glyphs by the TERMINAL ENVIRONMENT, not by the installed font file. So the font
# is a harness dependency of the TUI pin above, not a cosmetic extra — and where it belongs is the
# machine whose terminal DRAWS pi: for the Win11 seat and for every SSH leg that is the Windows
# workstation, which is why scripts/harness/win/install-nerd-font.ps1 sits next to scripts/harness/install-nerd-font.sh.
# The release TAG is the integrity boundary — nerd-fonts ships no per-asset checksum file, so
# the installers stamp the sha256 of what landed and a
# later --check re-hashes it: a swapped font directory reads as drift, not as success.
nerd_fonts_version: "v3.5.1"                   # github.com/ryanoasis/nerd-fonts release (releases/latest)
nerd_fonts_family: "JetBrainsMono"             # the release asset name AND the family the owner selected

# ==== pi.dev PACKAGE inventory ====
# NAME + VERSION + SCOPE for every pi package a seat carries, in the ONE version SSOT. Read by
# scripts/harness/pi-settings-config.sh, which composes settings.json's `packages` array from the
# scope:fleet rows — DISCOVERY, not a copy: adding a fleet package is one row here and every seat
# gets it on the next settings-plane run.
#
# The four `fleet` rows are fleet infrastructure, not seat-local extras: a version written HERE
# is what lets the from-zero path and every seat converge the same package, instead of a name in
# one installer's `pi install` list — which is how a package reached a seat only when a session
# happened to hand-install it. pi-subagents is the clearest case: it is the thing that runs sessions.
#
# version_pin names an EXISTING pin instead of duplicating a version string; version is the literal
# for rows that own their version. mutable: true means "place the name with no version" — the
# documented §7 exception for a package that self-updates inside a dist-tag from the phone.
pi_pkg_web_access_name: "pi-web-access"
pi_pkg_web_access_version_pin: pi_web_access_version
pi_pkg_web_access_scope: "fleet"

pi_pkg_tui_name: "pi-open-tui"
pi_pkg_tui_version_pin: pi_host_tui_npm_version
pi_pkg_tui_scope: "fleet"

pi_pkg_subagents_name: "pi-subagents"
# `fleet` = every seat carries it; a version_pin names an existing pin instead of a second copy.
pi_pkg_subagents_version_pin: pi_host_subagents_npm_version
pi_pkg_subagents_scope: "fleet"

pi_pkg_worktree_name: "@season179/pi-worktree"
pi_pkg_worktree_version: "26.7.1"              # npm dist-tag `latest` (registry-verified, `npm view @season179/pi-worktree version`) — the extension behind the /worktree-* commands
pi_pkg_worktree_scope: "fleet"

pi_pkg_ssh_tools_name: "@ogulcancelik/pi-ssh-tools"
pi_pkg_ssh_tools_version: "0.1.6"              # npm dist-tag `latest` (registry-verified, `npm view @ogulcancelik/pi-ssh-tools version`)
pi_pkg_ssh_tools_scope: "fleet"

pi_pkg_deepseek_name: "pi-deepseek-optimized"
pi_pkg_deepseek_version_pin: pi_host_deepseek_npm_version
pi_pkg_deepseek_scope: "fleet"

# The cockpit's own package: scope:seat, because it is roles/seat's placement on the cockpit
# seat, not a fleet key (docs/services-ai.md §9b-1). mutable: the cockpit self-updates inside
# `@beta` from the phone, so pinning the string here would break a path that must stay live.
# pi_host_web_npm_version still records the observed version for the docs and for roles/seat.
pi_pkg_web_name: "@ygncode/pi-web"
pi_pkg_web_version_pin: pi_host_web_npm_version
pi_pkg_web_scope: "seat"
pi_pkg_web_mutable: "true"
