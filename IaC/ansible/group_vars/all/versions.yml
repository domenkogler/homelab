# LiteLLM (LLM gateway spine) image tag — AI-stack. Check tag existence on
# ghcr.io/berriai/litellm AND through the docker.litellm.ai pull path the compose
# uses. ⚠ Upstream's scheme is plain `vX.Y.Z`: the `-stable` suffix does not exist upstream, so a
