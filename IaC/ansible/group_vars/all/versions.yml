# ONLYOFFICE Docs sidecars: the documentserver image defaults to LOCALHOST
# postgres/redis/rabbitmq, which cannot start under cap_drop:ALL -> eternal
# "Waiting for connection to the localhost host on port 5432" -> WopiDiscovery 502.
# Renovate tracks each tag.
# ⚠ Redis may move in place (Redis 8 reads a 7.x RDB, so it is a restart). Postgres and the
#   broker are HELD at their live majors:
#   * `onlyoffice_pg_version` — the Postgres data-format rule, see litellm_db_version;
#   * `onlyoffice_rabbitmq_version` — a claim that RabbitMQ 4 cannot read a 3.13 mnesia store
#     is NOT sourced (the vendor upgrade pages 404, the GitHub UPGRADE.md path moved), and an
#     unsourced claim does not license an in-place store bump on a live broker. ONLYOFFICE
#     keeps only transient job queues here — which makes a migration cheap, not safe to guess.
onlyoffice_pg_version: "16.15-alpine"
onlyoffice_redis_version: "8.10.2-alpine"
# Tube Archivist — redis for TA's queue/cache (archivist-redis).
# An exact patch tag, not the floating `7-alpine` alias (mutable under §7).
tube_archivist_redis_version: "7.4.11-alpine"
onlyoffice_rabbitmq_version: "3.13.7-alpine"

# ==== Host APT: the pinned package suite ====
# HOST-APT pins, not container images: Renovate's docker datasource cannot see them, there is no
# automated upgrade phase anywhere, and a bump is a hand change to these lines + a deliberate
# converge. Moving the docker-ce family RESTARTS THE DAEMON, so every container on that host moves
# with it — a maintenance action, one host at a time, never an incidental side effect of a run.
#
# Each value is the dpkg UPSTREAM version, epoch included — NOT a full deb version string.
# download.docker.com stamps the SAME upstream release with a different dpkg revision per suite:
# `-1~debian.13~trixie` on Debian 13 and `-1~ubuntu.24.04~noble` on spark's Ubuntu 24.04/arm64 base.
# That is why the one literal that can be fleet-wide is the upstream version: the revision is the
# target's own distro stamp and belongs to no file in this repo. roles/docker installs
# `<pkg>=<pin>-*`, an apt version wildcard that resolves on both suites (solver-checked on trixie
# amd64, trixie arm64 and noble arm64) and names no distro string anywhere. A per-host override of
# a value below is drift, not a second shape.
#
# Every value is the HIGHEST release already running somewhere in the fleet, NOT the newest release
# upstream: pinning a release no box has run makes the converge a first contact, and pinning below
# the highest box would be a DOWNGRADE there — which needs `--allow-downgrades`, forbidden. Where a
# component's release is not published for every suite in the fleet, this line goes DOWN to one that
# is, because the fleet does not split into per-host values.
docker_ce_version: "5:29.8.2"             # docker-ce + docker-ce-cli + docker-ce-rootless-extras:
                                          # ONE source package, so the engine, its CLI and the
                                          # rootless extras always carry the same version and this
                                          # one line is the pin for all three.
containerd_io_version: "2.3.6"            # containerd.io — its own upstream train, not the engine's.
docker_buildx_plugin_version: "0.37.1"    # docker-buildx-plugin — `docker buildx`.
docker_compose_plugin_version: "5.5.1"    # docker-compose-plugin — `docker compose`.
# `python3-docker` is named by roles/docker WITHOUT a pin on purpose: it comes from the distro
# archive, not from download.docker.com, so no suite version applies to it. It is a library, not the
# engine, and it is not part of the held set.

# The HELD set and the PINNED set are the same set, so ONE map owns both and neither can drift.
# roles/common holds every package in it with `apt-mark hold`; roles/monitoring reports each
# package's running version against the var NAMED here, resolved at render — never a copied version.
# A held package with no pin is exactly the defect this map closes: the hold then freezes whatever
# the box happened to reach instead of freezing repo state. A host that does not carry a package
# drops it in the per-host `dpkg-query` read, so one map serves the fleet: nas runs no Docker, so
# the whole family is simply absent there and no leg of the converge changes anything on nas.
# `docker-ce-rootless-extras` is the engine's own rootless support: the same source package, so the
# same pin, and it is in `docker_ce_suite_packages` because a pinned-and-held package that nothing
# installs is the half of this defect the map alone cannot close — the hold then freezes the box at an
# accident forever. Every entry here must be named by a role that INSTALLS it at its pin; roles/docker
# asserts that for the download.docker.com family, and a host that runs no Docker is kept out of that
# role by its playbook (`playbooks/storage.yml` carries no docker role), not by a condition here.
host_apt_pin_vars:
  alloy: alloy_version
  tailscale: tailscale_host_version
  docker-ce: docker_ce_version
  docker-ce-cli: docker_ce_version
  docker-ce-rootless-extras: docker_ce_version
  containerd.io: containerd_io_version
  docker-buildx-plugin: docker_buildx_plugin_version
  docker-compose-plugin: docker_compose_plugin_version

# ==== Observability infra ====
# Alloy is the DELIBERATE exception (host-APT, not Docker).
alloy_version: "1.20.1-1"    # grafana/agent → alloy (APT, apt.grafana.com stable; amd64) — the ONE
                             # fleet pin (no host_vars override may shadow it, or the hosts drift).
                             # Raising it costs four Alloy restarts (spark/vps/nas/pi), each dropping
                             # one scrape cycle.
# Prometheus + Loki are REPLACED by the Victoria stack (VictoriaMetrics +
# VictoriaLogs) on the VPS: there are no prometheus_version / loki_version vars and no
# prometheus/ + loki/ compose templates — `latest` would have been the default.
victoria_metrics_version: "v1.153.0"  # victoriametrics/victoria-metrics (single-node; Docker Hub tag has a `v`) — replaces prometheus
victoria_logs_version: "v1.53.0"      # victoriametrics/victoria-logs (Docker Hub tag has a `v`) — replaces loki
blackbox_exporter_version: "v0.28.0"  # prom/blackbox-exporter (Docker Hub tag has a `v`) — the next minor is in the hold
# RouterOS-API PyPI library for the network-clients exporter (oldsrv host
# venv at /opt/network-clients-exporter/venv). Debian trixie has no
# `python3-routeros-api` package; the exporter script imports `routeros_api` from
# the PyPI `routeros-api` package.
routeros_api_version: "0.21.0"   # the newest release on PyPI
tailscale_version: "v1.102.5"     # tailscale/tailscale — confirm the Docker Hub tag resolves before pinning:
# a phantom tag 404s at deploy time, not at review time.
# The HOST client (roles/tailscale-node, oldsrv) is pinned to the SAME
# version as the container client above so a sidecar and a host node never speak different
# wire versions. Installed as one exact checksum-verified deb from pkgs.tailscale.com —
# deliberately NOT the upstream apt repo: adding a third-party source to the box that holds
# the vault token buys auto-update we do not want (the pin is the point). Renovate does NOT
# track this (docker datasource only) → bump = change BOTH lines, then re-converge.
# Fetch both the deb and its .sha256 from pkgs.tailscale.com/stable for the pinned version.
# ⚠ These two digests are NOT independent pins: they are the integrity record OF the pinned
# version, so a `tailscale_host_version` bump that leaves them alone fails the get_url checksum
# gate by design (fail-loud, not a bug to route around).
# ⚠ A digest copied from a neighbouring release passes review and fails the FIRST converge:
#   the version bump and the digest fetch must happen in the same breath.
tailscale_host_version: "1.102.5"
# Per-architecture SHA256 of the pinned host .deb. ⚠ ONE VALUE PER ARCH, and the reason
# is a live failure: the role once hard-coded `_amd64` because oldsrv was
# the only host it had ever run on, and the Pi (arm64) failed install with dpkg's
# "Wrong architecture 'amd64'". A checksum map is what makes the pin honest — a single
# sha for a URL that varies by arch would let a wrong-arch .deb through as "verified".
# Source (authoritative — fetch it, never transcribe from memory):
#   https://pkgs.tailscale.com/stable/tailscale_<ver>_<arch>.deb.sha256
# ⚠ Fetch the digest in the same breath as the version bump — a typed digest that shares its
# first hex chars with upstream and diverges after looks right in review and fails `get_url`'s
# checksum gate on the first converge (which also skips every role after it in the play). If
# the digests cannot be fetched, the version does not get bumped. These values are an
# integrity record, not a field to edit alongside a version. `scripts/ansible/image-pin-probe.py
# --debs` checks every deb digest against the vendor's own .sha256 file, because the offline
# validators cannot see this class at all. Verify before you assert.
tailscale_host_deb_sha256_by_arch:
  amd64: "48958ea723c3172dfc69eb7d63a490e5388bdf1f2058e715558f698d2af2d52d"
  arm64: "85315e74a3d04e32419ca31ec11e5eab8743404c94a57558b7effcc92ad110ad"
# VictoriaMetrics MCP servers — oldsrv AI-debugging front-ends to the VPS
# Victoria backends. Images: ghcr.io/victoriametrics-community/*. Tags: the `latest`/`1.x`
# unv-prefixed tags are mutable aliases — NEVER use them (§7). Renovate
# docker datasource tracks each; re-verify at the first oldsrv deploy (deploy-gated).
mcp_victoriametrics_version: "v1.18.0"   # the newest release line
mcp_victorialogs_version: "v1.8.0"        # the newest release line
# Homelable (Pouzor/homelable) — self-hosted network/rack topology visualizer + live
# healthchecks. OLDSRV, deploy-gated (enabled:false).
# Images: ghcr.io/pouzor/homelable-{backend,frontend,mcp}. Tags: `X.Y.Z` (no `v`) —
# take them from the GitHub release feed; a newer release may exist inside the hold.
# Renovate docker datasource tracks each; re-verify at the first oldsrv deploy. MCP service
# is OPTIONAL (enabled via homelable_mcp_enabled — the MCP container is only for AI-tool
# read/write of the topology; leave off until the topology is curated).
homelable_version: "3.5.1"

# ==== Spark (DGX GB10) — AI inference image pins ====
# Multi-arch arm64+amd64 manifest — confirm the manifest for the arch before pinning.
# Renovate docker datasource would track the tag; the digest is the load-bearing pin.
spark_vllm_image: "vllm/vllm-openai:qwen38-flash-next@sha256:fc120ece0a388cc0aa1caad4a9f1cd92113484ab7ec2fd0efadd62585be05bf8"

# SGLang (`fast-sglang` profile) — INTENTIONALLY EMPTY, and that is the gate.
# CONVENTIONS §7 forbids a bare `latest`/mutable alias, and no SGLang image has been
# verified for the GB10 arm64-cu130 manifest yet. roles/spark-llm-profile refuses any
# profile whose image resolves empty, so flipping spark_llm_profile to `fast-sglang` fails
# loud instead of pulling a floating tag. To unblock: verify the arm64 manifest + take the
# digest, pin it HERE, record the verification in docs/hardware-spark.md §Bench + engine
# selection in the same change (fluid-tag first-pin rule, §7) — then the gate opens by itself.
spark_sglang_image: ""

# ==== Spark ultra-fast profile matrix — the upstream patch-lineage pins ====
# Source: github.com/dime-online/qwen3.8-Flash-DGX-UltraFast (Apache-2.0), the recipe for
# Qwen3.8-Flash-Next on GB10. Its promoted config (v16b) is a vLLM PATCH LINEAGE built on
# the SAME parent digest we already pin above (`…@sha256:fc120ece…be05bf8`, verified
# by reading recipe/build/image/build.sh + Dockerfile.iter6c): the parent line
# in build.sh is byte-identical to spark_vllm_image. That identity is why this lane is
# cheap — no new base layers, no new engine family, ~20 text-only patch steps on an image
# that is already on the box.
#
# WHY AN EMPTY PIN (CONVENTIONS §7): the patched build has no registry digest, because it
# is built here. `spark_sglang_image` is the precedent — an empty pin IS the gate: it makes
# every `image: ultrafast` profile refuse to converge until a human has built the lineage
# and recorded the image ID it produced. The served reference is always the ID (immutable),
# NEVER the tag: the tag `qwen38-flash-dgx:iter6d-20260910` exists only so `docker build`
# has somewhere to put the result, and a mutable alias on the serving path is a bare
# `latest` under §7. A rebuild that yields a different ID is a RE-PIN (its own commit), not
# something to paper over — the pin change is the review surface.
spark_vllm_ultrafast_image: "sha256:4900c13edab97dd8deb5f429456ae72e3c093cbacb3381f98feb10788f379d92"   # the built image ID (the role's deliberate fail prints it); built FROM iter6c sha256:54759ef1b961..., which sits on the pinned base sha256:fc120ece..., see §7
spark_vllm_ultrafast_tag: "qwen38-flash-dgx:iter6d-20260910"   # build output tag, never served

# The immutable provenance of what gets built. `build.sh --run` re-verifies eleven md5s +
# two sha256s of its own patch sources and refuses the build on a mismatch, so pinning the
# commit is what makes "we built what they measured" a checkable claim rather than a hope.
spark_ultrafast_upstream_repo: "https://github.com/dime-online/qwen3.8-Flash-DGX-UltraFast.git"
spark_ultrafast_upstream_commit: "0c391a3e74b6a775cfe248691ca7fd855b1876a5"   # registry-checked in the clone

# Upstream artifact revisions (their Quick start pins — a revision, not a moving branch).
spark_ar_hybrid_revision: "8b82f0b7abe3d1150a7827d298c75e86267636ae"      # AutoRound W4A16 int4/int8/fp8-hybrid target
spark_ple_fp8_revision: "50511b0a41aa1d34b8beb7e5d4bb06a0b650dc14"        # FP8 PLE n-gram table (the mmap path)

# Two hashes this lane depends on beyond the revision pin:
#  * the draft-vocabulary slice is a RUNTIME input on the serving path (bind-mounted into
#    every v16b-class boot), so it is vendored in-tree and hashed rather than fetched;
#    65,536 ids, English/code-selected — see docs/spark-llm-profiles.md §Draft-vocab risk.
#  * the drafter build reads the base checkpoint's two index tensors; upstream sha256-checks
#    them before converting, and so do we (roles/spark-artifacts), or we would silently
#    build a T80 drafter on top of an artifact that is not the one they measured.
spark_draft_vocab_sha256: "07696bf7eb9c1fdcc1d5ac7724192e523853d4a211ae973a370c7d8f3100927c"
spark_ar_hybrid_index_sha256: "4da5d411d90f4b2d89d4e13fdf201516f6f877cb70a06aec3c1d4fd61509571f"
spark_ar_hybrid_extra_tensors_sha256: "e9e4786a8ef584c9cb112b0a2ce7063cb72db8e002694888d2a36d440edad83d"

# DCGM exporter — the ONLY source of GPU util/temp/power/energy/SM-clock/XID on the
# GB10 (no nvidia hwmon chip; nvidia-smi has no metric endpoint). Multi-arch manifest; take the
# ARM64 digest from spark's own image store, where the same digest was run
# live and scraped (13 series; profiling/DCP + FB_* refused — see observability.md §LLM Dashboard).
# Digest is the load-bearing pin; the tag is documentation.
spark_dcgm_exporter_image: "nvidia/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04@sha256:ec962b59c8440427ddc2901fdb2616070d91a29da089a6d68c03ab1abdcf8870"

# DGX Dashboard LAN bridge — the dashboard + admin
# JupyterLab are exposed by the `spark-dashboard` Traefik file-provider edge
# (host-net, entrypoints spark_home_ip:11000/11002 → 127.0.0.1:11000/11002), which
# uses the already-pinned `traefik_version`. There is no socat image and no socat_version
# var: socat takes exactly ONE address pair per invocation, so a 4-argv compose command
