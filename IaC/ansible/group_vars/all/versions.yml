# ==== RustDesk server (VPS) — hbbs + hbbr in the s6 supervisor image ====
# rustdesk/rustdesk-server-s6 = busybox:stable + s6-overlay 3.2.0.0, hbbs AND hbbr supervised in
# ONE container sharing /data (that shared dir is what lets both binaries load the same
# id_ed25519 keypair — see the compose header). The non-s6 image `rustdesk/rustdesk-server` is
# two un-supervised containers with none of the env knobs (RELAY/ENCRYPTED_ONLY/KEY_PUB/…);
# NOT used.
