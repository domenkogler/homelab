litellm_version: "v1.104.0"
# Bundled LiteLLM Postgres sidecar image tag (STORE_MODEL_IN_DB). Renovate-tracked.
# ⚠ An existing PGDATA does NOT start on the next Postgres MAJOR (the container exits
#   "database files are incompatible with server"), so a 16 → 18 bump is a MIGRATION,
#   not a restart: dump/restore or pg_upgrade first, and roll back by moving this line
#   AND the datadir back together.
#   Placement (read `PG_VERSION`, do not assume): the 16-line sidecars live on the VPS —
#   authentik-postgres + forgejo-db (`postgres:16-alpine`, the alias the templates
#   hardcoded), litellm-db / onlyoffice-postgres / zipline-db (`16.15-alpine`),
#   immich-postgres on its own composite `14-vectorchord…` tag. OLDSRV's only Postgres is
#   `lan-litellm-db` (this var).
litellm_db_version: "18.6-alpine"   # the shape is PROVEN in a scratch container with this
                                  #   service's own caps + tmpfs + single data bind + PGDATA pinned ->
                                  #   "ready to accept connections". The two failed shapes are recorded in
                                  #   docs/backup.md: (1) the upstream parent mount cannot work under
                                  #   cap_drop: ALL (no CAP_DAC_OVERRIDE -> EACCES on the uid-70 0700 dir),
                                  #   and (2) a dir that is non-empty at first boot (a nested `data`
                                  #   mountpoint from a previous shape) makes initdb abort. oldsrv keeps
                                  #   lan_litellm_db_version at 16.
lan_litellm_db_version: "16.15-alpine"
# (The authentik-db and forgejo-db sidecars carry their own vars next to their service —
#  search `authentik_db_version` / `forgejo_db_version`. The Postgres MAJOR data-format
#  rule above applies to every one of them.)
