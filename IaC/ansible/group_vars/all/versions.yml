# ==== Spark ultra-fast profile matrix (HD-489) — the upstream patch-lineage pins ====
# Source: github.com/dime-online/qwen3.8-Flash-DGX-UltraFast (Apache-2.0), the recipe for
# Qwen3.8-Flash-Next on GB10. Its promoted config (v16b) is a vLLM PATCH LINEAGE built on
# the SAME parent digest we already pin above (`…@sha256:fc120ece…be05bf8`, verified
# 2026-10-02 by reading recipe/build/image/build.sh + Dockerfile.iter6c): the parent line
# in build.sh is byte-identical to spark_vllm_image. That identity is why this lane is
# cheap — no new base layers, no new engine family, ~20 text-only patch steps on an image
# that is already on the box.
#
# WHY AN EMPTY PIN (CONVENTIONS §7): the patched build has no registry digest, because it
# is built here. `spark_sglang_image` is the precedent — an empty pin IS the gate: it makes
# every `image: ultrafast` profile refuse to converge until a human has built the lineage
# and recorded the image ID it produced. The served reference is always the ID (immutable),
# NEVER the tag: the tag `qwen38-flash-dgx:iter6d-20260910` exists only so `docker build`
# has somewhere to put the result, and a mutable alias on the serving path is a bare
# `latest` under §7. A rebuild that yields a different ID is a RE-PIN (its own commit), not
# something to paper over — the pin change is the review surface.
spark_vllm_ultrafast_image: "sha256:4900c13edab97dd8deb5f429456ae72e3c093cbacb3381f98feb10788f379d92"   # built 2026-10-02 (role's deliberate fail printed it); built FROM iter6c sha256:54759ef1b961..., which sits on the pinned base sha256:fc120ece..., see §7
spark_vllm_ultrafast_tag: "qwen38-flash-dgx:iter6d-20260910"   # build output tag, never served

# The immutable provenance of what gets built. `build.sh --run` re-verifies eleven md5s +
# two sha256s of its own patch sources and refuses the build on a mismatch, so pinning the
# commit is what makes "we built what they measured" a checkable claim rather than a hope.
spark_ultrafast_upstream_repo: "https://github.com/dime-online/qwen3.8-Flash-DGX-UltraFast.git"
spark_ultrafast_upstream_commit: "0c391a3e74b6a775cfe248691ca7fd855b1876a5"   # 2026-09-28, registry-checked in the clone

