# ==== Platform / records / tasks ====
# Pinned semvers for core services that would otherwise fall back to
# `latest` via an undefined *_version var. Renovate docker datasource keeps each current.
# Re-derive against the upstream registries with `scripts/ansible/image-pin-probe.py --verify`.
# ⚠ A PHANTOM PIN is a pin whose tag does not exist: `tiredofit/db-backup` carries exactly
# ONE tag on Docker Hub (`latest`) even though the upstream repo releases 5.0.x, and
# ghcr.io/tiredofit/… answers no token at all — so a `X.Y.Z` tag here can never pull. Where
# the only published channel is a fluid tag, the DIGEST is the load-bearing pin (§7);
# re-derive with `scripts/ansible/image-pin-probe.py` + the registry's own Docker-Content-Digest.
db_backup_version: "latest@sha256:f70a79aa8dc1ea6cf08762ce478923a814578741f1f374fa9168902eda1312ee"   # tiredofit/db-backup
forgejo_version: "16.0.5"  # codeberg.org/forgejo/forgejo (the docker tag strips `v`) — probe that the
                          # manifest resolves before pinning: a released version can ship a broken publish
forgejo_db_version: "16.15-alpine"  # HELD at 16. A sidecar hardcoded `postgres:16-alpine` in the
                                  # template is a mutable alias with no var — invisible to a fleet review (§7).
                                  # ⚠ 16 → 18 is a data-format major: dump/restore the forgejo-db volume first.
grafana_version: "13.2.3"           # grafana/grafana OSS
kopia_version: "0.23.1"             # kopia/kopia (server on the VPS + the oldsrv agent)
n8n_version: "2.42.3"             # n8nio/n8n
immich_version: "v3.2.4"          # ghcr.io/immich-app/immich-server (the tag carries a `v`);
                                    # the next minor sits inside the 3-day hold.
                                    # ⚠ ONE var, TWO images: this also pins immich-machine-learning on
                                    #   OLDSRV (templates/docker_services/immich-ml). Immich wants the
                                    #   server and the ML service on the same version, so converging ONLY
                                    #   the VPS while oldsrv is unreachable leaves the pair split (new
                                    #   server / older ML) — ML jobs are the symptom to expect in that
                                    #   window, not a new bug.
                                    # Its two sidecars stay as upstream's compose ships them:
                                    #   postgres `14-vectorchord…` is an immich-owned composite tag whose
                                    #   format is bound to the server release — bumping it is immich's call,
                                    #   not ours; valkey is a cache and is pinned exactly below (it was the
                                    #   moving `9` alias, a §7 mutable alias).
