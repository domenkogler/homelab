---
# Global variables for all managed nodes

timezone: Europe/Ljubljana
locale: sl_SI.UTF-8
# Home location (Maribor, SI) — used by HA weather integrations (meteoblue) and others.
# Keep in sync with HA location settings (docs/home-assistant-current.md).
home_latitude: 46.5596
home_longitude: 15.6355
ntp_servers:
  - 0.si.pool.ntp.org
  - 1.si.pool.ntp.org
op_vault: Homelab-ansible
domain_public: kogler.si
domain_local: kogler.si    # the LAN search suffix: rendered as `Domains=` / `dns-search=` on host
                           # NICs (roles/network) and handed to DHCP clients as option 15 by the
                           # router. NOT a split-horizon switch — the zone is one name-
                           # space; `domain_public` is the public half of the same string.

# Bootstrap DHCP DNS for freshly-reset MikroTik gear: used by the
# rb4011_initial template BEFORE Technitium exists (it lands on oldsrv).
# Upstream public resolver until then.
bootstrap_dns_servers: "1.1.1.1"

# GPU group IDs — read them on the box, not from the Debian defaults table.
# video:44 is Debian-static (correct). `render` is NOT 104 on oldsrv: `getent group 104`
# there answers ssl-cert, while the live `render` group is 992. Guessing the gid means every
# GPU leg group_adds the SSL-CERT group instead of render, and that is only harmless while
# the render nodes happen to be world-rw (`getfacl /dev/dri/renderD129` shows other::rw- +
# a lightdm ACL) — a masked bug, not a safe design.
# Used by ollama, immich-ml, jellyfin, sunshine + the Vulkan AI legs for /dev/dri.
# Verify with: getent group render video
gpu_render_gid: 992                         # oldsrv live `render`; 104 is ssl-cert
gpu_video_gid: 44

# The dGPU's DRM render node for the Vulkan legs. Mount ONLY this
# node: renderD128 is the HD 630 iGPU, which is the family desktop's Xorg device AND the
# Jellyfin QSV transcoder — and using it for AI is slower than CPU
# (docs/services-ai-bench.md §4). renderD129 = AMD RX 7600 gfx1102.
gpu_vulkan_render_node: /dev/dri/renderD129

# ==== Shared service knobs ====
# Docker image version pins live in ONE file: `group_vars/all/versions.yml`
# so Renovate docker datasource updates + version review are a single sheet.
# All hosts load it via the `all` group. Keep INFRASTRUCTURE vars here (network, IP,
# identity, WG, livebox, NUT/ZFS exporters); only VERSION PINS go in versions.yml.
#
# Let's Encrypt account contact — REQUIRED to register the ACME account when the
# first cert is issued. Issuer = the **VPS Traefik** (single issuer enforced by
# `traefik_acme_issuer`; oldsrv/Pi edges consume synced certs).
letsencrypt_email: domen@kogler.si
# CrowdSec collections to install: which app logs CrowdSec
# parses for WAF/brute-force. Included: traefik + linux (baseline) + home-assistant
# + a1ad/mikrotik (parser + mikrotik-bf + mikrotik-scan-multi_ports scenarios) for the
# RB4011/switch/AP remote RFC5424 syslog stream (host rsyslog receiver ->
# /var/log/remote-syslog/routeros.log).
# Extend here as services are exposed
# (qBittorrent, jellyfin, n8n …) — a collection only does something if its logs are
# ALSO sent to CrowdSec (docker.sock container-log parsing).
# NOTE: crowdsecurity/matrix AND crowdsecurity/grafana do
# NOT exist upstream — their failed installs abort container startup every boot. Matrix
# and Grafana logs are not parsed until such collections exist upstream or are authored.
crowdsec_collections: "crowdsecurity/traefik crowdsecurity/linux crowdsecurity/home-assistant a1ad/mikrotik"
# Wildcard *.kogler.si cert pair file names — shared by the issuer and ALL consumer
# edges so the VPS ACME issuer, the consumer pull timers and the Traefik configs can
# never drift. Paths:
#   VPS traefik (issuer): certs-dumper emits exactly these names → /opt/traefik/certs/.
#   oldsrv traefik + Pi traefik-ha (consumers): pulled to their certs dirs with these names.
wildcard_cert_file: kogler.si.pem
wildcard_cert_key_file: kogler.si-key.pem
# The SECOND issued wildcard (`*.ts.kogler.si`): the tailnet namespace. The VPS
# issuer requests both SANs and the consumers' cert-pull already carries this pair — it is
# served only where a tailnet listener exists to serve it on.
wildcard_ts_cert_file: ts.kogler.si.pem
wildcard_ts_cert_key_file: ts.kogler.si-key.pem
# The wildcard SAN root — the certs-dumper matches acme.json by this domain and
# the Pi/oldSrv edges serve all *.kogler.si hosts from the dumped pair.
wildcard_cert_domain: "kogler.si"
# (No Doco-CD metrics port — Doco-CD is not part of the fleet.)
# Technitium DNS topology (VPS-primary):
#   PRIMARY    = VPS  (technitium on the dedicated dns-servers overlay; resolver address = VPS PUBLIC IP)
#   SECONDARY  = oldsrv (Home VLAN node IP)
#   TERTIARY   = Pi    (Home VLAN node IP)
# All three are separate physical hosts (failure-domain split preserved) and all three
# publish on host :53/udp+tcp. `dns_primary_ip` (below) is the single SSOT for "the
# primary resolver address" consumed by router rules / DHCP / tailnet headscale
# nameservers. (There is no pihole — its old conditional-forwarding used
# this address; Technitium Advanced Blocking owns that filter.) DHCP (router role + converge rsc) hands
# out the FULL chain primary->secondary->tertiary->router/IP, and the router /ip dns
# upstream mirrors the same chain first + Cloudflare last (documented final fallback).
# The primary resolver address is the VPS PUBLIC IP
# (159.195.111.66) — LAN clients hairpin through the existing Home/Media/Guest/Mgmt→WAN
# egress, tailnet resolves it too, and it survives a WG-tunnel drop (unlike a
# tunnel bind). Abuse surface (public UDP 53) is mitigated by the VPS nftables
# source-allow (tailnet CGNAT 100.64.0.0/10 + home WAN DDNS s.kogler.si, refreshed by an
# Ansible-managed systemd timer) — see vps-hardening. The dns-servers OVERLAY pin below
# (technitium_dns_overlay_ip) is the CONTAINER address inside the VPS bridge (joinable by
# the VPS Traefik edge + local containers only), NOT the client-facing resolver.
dns_primary_ip: "159.195.111.66"        # Technitium PRIMARY resolver — VPS PUBLIC IP
tchnitium_dns_overlay_ip: "172.25.0.2"  # Technitium container pin inside the dns-servers overlay (VPS-local)
dns_secondary_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"   # Technitium SECONDARY (oldsrv)
dns_tertiary_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}"  # Technitium TERTIARY (Pi)
# Technitium DNS secondary (Pi) — the dns-pi.kogler.si web-UI backend (== Pi Home VLAN IP, SSOT-derived).
technitium_secondary_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}"

# Resolver upstreams for the Technitium tier.
# Without forwarders, every instance runs `forwarders = null`, i.e. each cold public name is
# chased from the ROOT SERVERS by whichever instance answers, with dnssecValidation=true +
# qnameMinimization=true and resolverTimeout 1500 x resolverRetries 2 as the per-name ceiling.
# Root-chasing measures far slower than forwarding (a browser-style fan-out from the Pi, the
# instance VLAN 10 asks first, vs 1.1.1.1). Forwarding removes the chase.
# WHY TWO UPSTREAMS: with forwarders set, Technitium queries ALL of them in parallel (fastest
# wins) but does NOT fall back to root recursion when they fail (open vendor request
# TechnitiumSoftware/DnsServer#481 = "forward-first" is not implemented), so one upstream
# would make public resolution depend on that one operator. Two = independent networks,
# operators and blocking policies.
# ⛔ NEVER point these at the router's `/ip dns` (its own upstream is this same resolver chain
# -> forwarding loop AND oldsrv/the VPS back in the answer path) or at oldsrv itself: the Pi is
# the HA-primary DNS on purpose and must not depend on the HA standby.
# HA IS UNAFFECTED EITHER WAY: `ha.kogler.si` and the rest of `kogler.si` are answered
# AUTHORITATIVELY (aa flag proven live) from each instance's own primary zone, so an
# upstream is never consulted for them — dead upstreams cannot break HA/DNS-name resolution.
# Placement is opt-in per instance via `technitium_forwarders` on the docker_services entry
# (unset == forwarders cleared == root-chase). ALL THREE carry the flag:
# an instance still chasing pays the root-chase tail on every cold name, so there is no
# per-site reason to leave one off — the point of two upstreams is independence, not
# per-site tuning (concurrentForwarding already takes the fastest).
dns_resolver_upstreams:
  - "1.1.1.1"   # Cloudflare — anycast, DNSSEC-validating
  - "9.9.9.9"   # Quad9 — different network + operator + blocking policy

# ==== Spark (DGX GB10) — reserved node IPs, SSOT-derived ====
# spark.kogler.si shares the nas/oldsrv pattern: Home (VLAN 10) = SSH + inference endpoint,
# Mgmt (VLAN 99) = management plane. No literals — the network_static_hosts rows are the source.
spark_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'spark') | selectattr('vlan', 'equalto', 10) | first).ip }}"
spark_mgmt_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'spark') | selectattr('vlan', 'equalto', 99) | first).ip }}"

# ==== UPS / NUT (docs/hardware-ups.md) ====
# Single SSOT `nut_exporter` runs as a HOST binary on the NUT master (nas, no Docker)
# and is scraped over the WG S2S tunnel: Alloy is the collector tier and ships to the VPS
# Victoria backend (it replaced the Prometheus/Loki pair). Host derived
# from the address SSOT below (nas @ VLAN 10); port matches the nut role's `nut_exporter_listen`.
nut_exporter_host: "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# nut_exporter_listen in roles/nut/defaults/main.yml (:9199); keep in sync.
# UPS name served by upsd on nas (ups.conf) — the exporter's /ups_metrics?ups=<name>
# path; must match the nut role's ups.conf `UPS <name>` (default powerwalker).
nut_ups_name: powerwalker
nut_exporter_port: 9199

# ==== SMTP2Go relay — single connection SSOT (Option B) ====
# Dedicated transactional relay used by BOTH Grafana (grafana_smtp_host) and NUT
# (nut_smtp_server). Credentials are in 1Password (`smtp_login` /
# `nut_smtp_login`, Login items); only the connection config lives here.
# Account region/host + ports as provided by SMTP2Go (EU datacenter):
#   SMTP server: mail-eu.smtp2go.com; SMTP port 2525 (default); alternative
#   ports 8025, 587, 80, 25 — TLS available on the same ports (STARTTLS).
#   SSL only on 465, 8465, 443.
# The connection is mail-eu.smtp2go.com:2525 + STARTTLS (the SMTP2Go default; 587 is blocked from
# the VPS egress — only 2525/8025 are open there — so 2525 is the port every consumer uses).
smtp2go_host: mail-eu.smtp2go.com
smtp2go_port: 2525                  # STARTTLS port (default; alternates 8025/587/80/25). 587 is BLOCKED from the VPS egress
                                     # (only 2525/8025 are open there); LAN egress reaches both. Use 2525 everywhere.
smtp2go_ssl_ports: [465, 8465, 443]  # SSL-only ports (not used)
smtp2go_smtp_ports: [2525, 8025, 587, 80, 25]  # SMTP ports with TLS available

# ==== ZFS exporter (nas, host binary — storage role) ====
# Single SSOT ZFS pool exporter on nas (no Docker) — mirrors nut_exporter.
# Host derived from the address SSOT below (nas @ VLAN 10); port matches the
# storage role's `zfs_exporter_listen` (:9198). Metrics: zfs_pool_allocated/
# size/health per pool. Feeds the pool-usage/degraded alert rules.
zfs_exporter_host: "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# zfs_exporter_listen in roles/storage/defaults/main.yml (:9198); keep in sync.
zfs_exporter_port: 9198

# ==== Coding cockpit on oldsrv — reserved ports ====
# Two surfaces run SIMULTANEOUSLY for the one comparison window the owner asked for, so each gets its
# own number and neither is ever written as a literal. Both bind oldsrv's TAILNET address, never
# 0.0.0.0 — the pi-web binary refuses a non-loopback bind without PI_WEB_TOKEN, and the headscale
# ACL is the outer gate.
cockpit_pi_web_port: 31415           # upstream's own default (its README names it); keep the number so
                                     # `/web` links and the QR from `/remote` stay correct without config
paseo_port: 6767                       # Upstream's own default (its Docker run maps 6767, CLI pairs to host:6767),
                                     # kept like cockpit_pi_web_port so pairing needs no extra config.
                                     # Any other number this file once reserved is freed — do not reuse
                                     # it, or the two files disagree about what was allocated.

# ==== Kopia off-site target: Hetzner Storage Box backup (SSH/SFTP) ====
# The backup Box (u653424) supports SSH/SFTP only (no S3/object storage).
# These drive the kopia-server repo create sftp backend.
kopia_sftp_host: u653424.your-storagebox.de
kopia_sftp_port: 23          # non-standard Hetzner SSH/SFTP port
kopia_sftp_user: u653424     # SSH key auth (no password) — key in 1Password Hertzner-SB-Backup
kopia_sftp_path: kopia           # RELATIVE to box home: Hetzner SFTP returns SSH_FX_FAILURE for the "/" component of absolute paths, which breaks kopia create-path even when the dir pre-exists)

# The per-client user@host identity the oldsrv backup agent presents
# (`--override-username=oldsrv-agent --override-hostname=oldsrv.kogler.si`). It must
# exist in the kopia-server htpasswd as `user@host` (kopia's allowed-entries model),
# otherwise the agent session is denied. Same credential as kopia-server-internal_api.
kopia_agent_user: oldsrv-agent@oldsrv.kogler.si

# kopia-server TLS trust anchor — the SHA-256 (DER) fingerprint of the persisted
# self-signed cert under /srv/docker/kopia-server/config/tls.crt, lowercase hex, recomputed on
# first start and stored in 1Password `kopia-server_fingerprint` (catalog-generated, NOT auto-
# rotatable). The oldsrv agent pins it (`kopia repository connect server --server-cert-fingerprint`)
# because kopia 0.23.x rejects plain-http:// and an in-memory generated cert would change the
# fingerprint on every restart. See docs/backup.md and deployment-compose.md.
kopia_server_fingerprint_item: kopia-server_fingerprint   # 1P item (Password) holding the trust anchor

# ==== IPv4 address plan — SSOT (auto-rendered to docs/network-addresses-generated.md) ====
# Hand-edit here ONLY; regenerate docs/network-addresses-generated.md after changes.
#
# HA virtual IP (keepalived/VRRP) on Home VLAN 10 — ha.kogler.si. Canonical name `ha-vip`.
# D2: single /32, no reserved block. Home DHCP pool (10.10.1.100-.199) must stay <= .199
# and must never be extended into the VIP; 10.10.1.200 is reserved — not a normal static lease.
# ==== Tailnet (headscale) plane ================================================
# The control URL is DERIVED from the domain SSOT (never re-typed): the `vpn` record is
# seeded by Technitium to the VPS, so headscale is reached at vpn.<domain> from anywhere.
# NOTE: templates/docker_services/traefik-tailnet still hard-codes the same literal in
# TS_EXTRA_ARGS — pre-existing duplication, fold it onto this var in a dedicated change.
tailnet_control_url: "https://vpn.{{ wildcard_cert_domain }}"
# headscale base_domain (config.yaml.j2) — node names resolve as <node>.<this> for free.
tailnet_base_domain: "ts.{{ wildcard_cert_domain }}"
# oldsrv's node name (tailscale-node role hostname + the traefik-internal route rule).
tailnet_oldsrv_node_name: oldsrv
# Assigned by headscale AT JOIN (sequential) — the repo cannot know it in advance. Contract
# Assigned by headscale AT JOIN (sequential) — the repo cannot know it in advance. Contract
# is identical to tailnet_sidecar_ip: leave EMPTY → the traefik-internal `websecure-ts`
# listener + the ts-only MagicDNS records simply do not render; set it from
# `headscale nodes list` after the node joins, then re-converge. roles/tailscale-node
# asserts the live IP equals this value, so a silent drift is impossible.
# Current: headscale node id 11, name `oldsrv`, tag:dev.
tailnet_oldsrv_ip: "100.64.0.3"
# The Pi joins as the SECOND permitted home node (tag:home-edge, tcp/443
# only — see policy.hujson.j2) so HA keeps a tailnet answer when the node-carrying box dies.
# Same contract as above: empty until the node has joined, then read `headscale nodes list`,
# set it, re-converge; roles/tailscale-node asserts the live address equals it.
# WHY the Pi can do this at all: it runs `traefik-ha`, the HA standby edge, so it has a
# listener to point a tailnet answer at — and host networking on that edge means the tailnet
# address is bindable (ip_nonlocal_bind is already required there for the VIP).
tailnet_pi_node_name: pi
# Current: headscale node id 13, name `pi`, tag `tag:home-edge`,
# IPv4 100.64.0.6 — read it back from `headscale nodes list -o json`, never assume it. A
# tagged node can land under the `tagged-devices` user even when the key was minted for
# another user; that is headscale's own rule for tagged nodes, not a mis-mint.
tailnet_pi_ip: "100.64.0.6"

# ============================================================================
# zone_kogler_si — the kogler.si answer plane as ONE list
# ============================================================================
# Every name in the zone and every address it answers with, in one entry per name.
#
# WIRED TODAY (measured, not what an older draft of this
# comment claimed):
#   * the Technitium seed (`docker_services/tasks/technitium-seed.yml`) loops
#     `zone_kogler_si_seed_records` and gates on `zone_kogler_si_lan_only`.
# NOT WIRED YET — these planes are still DOUBLED (this list + a hand-authored source),
# and `check_zone_kogler_si_parity.py` is what keeps the two halves answering the same:
#   * MagicDNS / the tailnet routers read `tailnet_subdomains` and
#     `tailnet_ts_only_subdomains` in `group_vars/vps.yml` — consumed by
#     `templates/docker_services/headscale/config.yaml.j2` and the traefik-internal,
#     traefik-tailnet, traefik-ha and spark-dashboard `dynamic/routes.yml.j2`.
#   * the public Cloudflare set reads `cloudflare_dns_records` in
#     `roles/cloudflare_dns/vars/main.yml`.
# ⛔ Editing this list therefore changes LIVE DNS only for Technitium. For the other two
# planes it changes nothing on the wire — the gate proves the derived view still matches
# them, it does NOT publish anything. Switching a consumer is its own step, done behind
# this gate, never asserted in a comment.
#
# This var lives in group_vars/all because the seed runs on VPS + oldsrv + the Pi and
# `playbooks/dns.yml` runs against localhost; `all` is the only group in scope for all
# of them.
#
# Fields (⛔ all three exposure fields are required on EVERY entry — an omitted field
# is a decision nobody made, which is the drift class this list exists to kill):
#   name:      the FQDN inside the zone. The apex is `kogler.si` itself.
#   internal:  seed into the LAN-facing Technitium zone.
#   ip:        what the LAN-facing zone answers (required when internal is true).
#              Write the SSOT expression, never the resolved address: the split-horizon
#              targets differ per instance and `check_dns_seed_drift.py` resolves these
#              against `network_static_hosts` to prove the per-instance contract.
#   lan_only:  true = never seed on the VPS PRIMARY (the answer is a Home-VLAN or
#              modem-subnet address — a black hole for a peer that is not at home).
#   tailnet:   none | edge | node | dual — what MagicDNS answers (docs/network-vpn.md
#              §Tailnet boundary). `edge` publishes BOTH `name.kogler.si` and the
#              `.ts` twin; `node` and `dual` publish the `.ts` twin ONLY, because a
#              tailnet address answering a plain name client-side is the
#              resolver-ambiguity trap (a phone standing at home stops seeing the LAN
#              answer). `dual` = the same name answered by two home nodes;
#              no entry uses it yet and nothing renders differently for it today.
#   tailnet_ip: literal tailnet IPv4. OMIT it to take the class default
#              (`tailnet_sidecar_ip` for edge, `tailnet_oldsrv_ip` for node/dual).
#              A literal is deliberate: group_vars gets no second Jinja pass, so
#              `{{ tailnet_sidecar_ip }}` here would render as that literal TEXT.
#   ts_router: the name's router is attached to the tailnet listener. Meaningless
#              (always false) when tailnet is none — `check_zone_kogler_si_parity.py`
#              fails the build on the mismatch. The renderer for it (the
#              traefik-tailnet router list) is a later derivation step; today the field
#              is the declared intent, and it is validated, not wired.
#   public:    true = the name is published publicly (canonical Cloudflare CNAME →
#              vps.kogler.si). DECLARED INTENT, NOT WIRED: the publisher still reads
#              `cloudflare_dns_records`; the parity gate fails if the two disagree.
#   public_records: explicit Cloudflare records for a name whose public answer is not
#              that CNAME (the VPS host A/AAAA pair, the SMTP2Go delegations).
#              `proxied: false` (DNS-only) is the consumer's default, not per record.
#              Also declared, not wired.
#
# ⛔ A change here changes live Technitium DNS on the next seed converge, and nothing
# else. The parity gate (`scripts/gate/check_zone_kogler_si_parity.py`, in validate-all)
# compares the derived views against `scripts/testdata/zone_kogler_si_golden.json`, a
# snapshot of what the hand-authored sources answered BEFORE the derivation. So an edit
# that silently drops a name, re-points an address, or moves a `.ts`-only name into the
# plain namespace goes RED at the gate instead of at 3am. Deliberate change to an
# ANSWER: edit the list, run the gate, READ the diff it prints, and put in the commit
# message which answer you meant to change and why. ⛔ The fixture is NOT regenerated
# from this tree — `capture_zone_kogler_si_golden.py` refuses once the zone is derived,
# because comparing the derived list against itself would make the gate vacuous. It moves
# only with a re-capture from a pre-derivation checkout, which is the point: the gate
# protects the answers, not the author's convenience.
zone_kogler_si:
  # --- control plane + the HA pair (the VIP answers; the edge follows HA either way) ---
  - { name: ha.kogler.si,            internal: true, ip: "{{ ha_vip }}", tailnet: node, ts_router: false }
  - { name: dns-pi.kogler.si,        internal: true, ip: "{{ ha_vip }}", tailnet: none, ts_router: false }
  # --- home-hosted media stack: oldsrv's internal edge at home, the VPS edge elsewhere ---
  # media is PUBLISHED: the VPS edge routes it to the
  # home edge over WG S2S, so the public answer is served, not just pointed at. seerr/seerrng are
  # routed there too but stay UNPUBLISHED — reachable by name only where a resolver is told.
  - { name: media.kogler.si,         internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true, public: true }
  - { name: seerr.kogler.si,         internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: seerrng.kogler.si,       internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: sonarr.kogler.si,        internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: radarr.kogler.si,        internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: lidarr.kogler.si,        internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: prowlarr.kogler.si,      internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: bazarr.kogler.si,        internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: profilarr.kogler.si,     internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: sab.kogler.si,           internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: torrent.kogler.si,       internal: true, ip: "{{ home_edge_ip }}", tailnet: node, ts_router: true }
  - { name: aurral.kogler.si,        internal: true, ip: "{{ oldsrv_home_ip }}", lan_only: true, tailnet: node, ts_router: true }
  - { name: slskd.kogler.si,        internal: true, ip: "{{ oldsrv_home_ip }}", lan_only: true, tailnet: node, ts_router: true }
  - { name: lidarr-ydl.kogler.si,        internal: true, ip: "{{ oldsrv_home_ip }}", lan_only: true, tailnet: node, ts_router: true }
  # --- LAN-only: answers a Home/modem address, so the VPS primary must never carry them ---
  - { name: llogs.kogler.si,         internal: true, ip: "{{ oldsrv_home_ip }}", lan_only: true, tailnet: none, ts_router: false }
  - { name: modem.kogler.si,         internal: true, ip: "192.168.1.1", lan_only: true, tailnet: none, ts_router: false }   # Comtrend UI; mirrors group_vars/router.yml modem_mgmt_ip
  - { name: spark.kogler.si,         internal: true, ip: "{{ spark_home_ip }}", lan_only: true, tailnet: node, tailnet_ip: "100.64.0.1", ts_router: true }
  - { name: db-spark.kogler.si,      internal: true, ip: "{{ spark_home_ip }}", lan_only: true, tailnet: edge, ts_router: true }
  - { name: llm.kogler.si,           internal: true, ip: "{{ spark_home_ip }}", lan_only: true, tailnet: edge, ts_router: true }
  - { name: llitellm.kogler.si,      internal: true, ip: "{{ oldsrv_home_ip }}", lan_only: true, tailnet: none, ts_router: false }
  # Cockpit break-glass surfaces: Home addresses, so LAN-only (never the VPS primary).
  - { name: cockpit-oldsrv.kogler.si, internal: true, ip: "{{ oldsrv_home_ip }}", lan_only: true, tailnet: none, ts_router: false }
  - { name: cockpit-nas.kogler.si,   internal: true, ip: "{{ nas_home_ip }}", lan_only: true, tailnet: node, ts_router: false }
  # Host A records: the LAN zone used to answer SERVICE names only, so a
  # bare `\\nas\media` SMB path had NO DNS answer at all (NXDOMAIN with the aa flag on
  # both home resolvers) and fell back to LLMNR/NetBIOS broadcast — which a wired switch port
  # supplies and a Wi-Fi client does not. Mounting by IP from Wi-Fi worked while mounting by
  # name did not; that is what these rows fix. `switch`/`ilo` are deliberately ABSENT: they
  # carry only a Mgmt-99 address, which a Home client cannot route to (the answer-must-be-
  # routable rule, docs/network-dns.md §The answer-plane model), so publishing them would ship
  # a black hole.
  # `tailnet: none` everywhere here: a tailnet device away from home cannot route to 10.10.1.x
  # either, so the netmap gains nothing and the tailnet plane stays answer-neutral.
  - { name: nas.kogler.si,           internal: true, ip: "{{ nas_home_ip }}", lan_only: true, tailnet: none, ts_router: false }
  - { name: oldsrv.kogler.si,        internal: true, ip: "{{ oldsrv_home_ip }}", lan_only: true, tailnet: none, ts_router: false }
  - { name: pi.kogler.si,            internal: true, ip: "{{ pi_home_ip }}", lan_only: true, tailnet: none, ts_router: false }
  - { name: router.kogler.si,        internal: true, ip: "{{ router_home_ip }}", lan_only: true, tailnet: none, ts_router: false }
  # --- tailnet-edge dashboards: internal-only, tailnet-only (never public) ---
  - { name: stats.kogler.si,         internal: true, ip: "{{ tailnet_edge_ip }}", tailnet: edge, ts_router: true }
  - { name: logs.kogler.si,          internal: true, ip: "{{ tailnet_edge_ip }}", tailnet: edge, ts_router: true }
  - { name: csui.kogler.si,          internal: true, ip: "{{ tailnet_edge_ip }}", tailnet: edge, ts_router: true }
  - { name: traefik.kogler.si,       internal: true, ip: "{{ tailnet_edge_ip }}", tailnet: edge, ts_router: true }
  - { name: auto.kogler.si,          internal: true, ip: "{{ tailnet_edge_ip }}", tailnet: edge, ts_router: true }
  # --- VPS-served: the same answer on every instance (split-horizon parity) ---
  - { name: litellm.kogler.si,       internal: true, ip: "{{ dns_primary_ip }}", tailnet: edge, ts_router: true }   # tailnet-only admin edge; never public
  - { name: vps.kogler.si,           internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false,
     public_records: [ { type: A, value: "{{ dns_primary_ip }}" }, { type: AAAA, value: "{{ dns_primary_ipv6 }}" } ] }
  - { name: kogler.si,               internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }   # apex (Cloudflare flattens it)
  - { name: home.kogler.si,          internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: vpn.kogler.si,           internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }   # headscale coordination URL
  - { name: dns.kogler.si,           internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }   # Technitium web UI
  - { name: sso.kogler.si,           internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: file.kogler.si,          internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: foto.kogler.si,          internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: git.kogler.si,           internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: bin.kogler.si,           internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: ai.kogler.si,            internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: office.kogler.si,        internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: pdf.kogler.si,           internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: chat.kogler.si,          internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: matrix.kogler.si,        internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  - { name: drop.kogler.si,          internal: true, ip: "{{ dns_primary_ip }}", tailnet: none, ts_router: false, public: true }
  # --- tailnet-only names: no LAN answer by design (a LAN client must get NXDOMAIN) ---
  - { name: pi-oldsrv.kogler.si,     internal: false, tailnet: node, ts_router: false }
  # --- names with NO Technitium record: published publicly, resolved by Cloudflare alone ---
  # `pairdrop` rides alongside `drop`. Neither has a docker_services entry, so
  # nothing here invents them: they are declared, which is the point of the list.
  - { name: pairdrop.kogler.si,      internal: false, tailnet: none, ts_router: false, public: true }
  # SMTP2Go sender verification / DKIM / tracking — consumed by SMTP2Go, not by our edge.
  - { name: em918249.kogler.si,      internal: false, tailnet: none, ts_router: false,
     public_records: [ { type: CNAME, value: return.smtp2go.net } ] }
  - { name: s918249._domainkey.kogler.si, internal: false, tailnet: none, ts_router: false,
     public_records: [ { type: CNAME, value: dkim.smtp2go.net } ] }
  - { name: link.kogler.si,          internal: false, tailnet: none, ts_router: false,
     public_records: [ { type: CNAME, value: track.smtp2go.net } ] }
  # PARKED: the dsh / pi-dev backends no longer exist, so the edge
  # answers 502 BY DESIGN — this is not an outage to chase. Dropping these two would delete
  # live MagicDNS records, which is its own decision, not a tidy-up.
  - { name: dsh.kogler.si,           internal: false, tailnet: edge, ts_router: true }
  - { name: pi-dev.kogler.si,        internal: false, tailnet: edge, ts_router: true }

# Split-horizon target of the home-hosted apps: oldsrv's internal edge at home (no VPS
# round-trip, so WAN-out survival keeps working), the VPS public edge everywhere else.
# ONE expression, evaluated per instance by the seed — the same value the seed's inline
# rows carried before they were folded into `zone_kogler_si`.
home_edge_ip: "{{ oldsrv_home_ip if (svc.instance | default('primary')) in ['secondary', 'secondary-pi'] else dns_primary_ip }}"
# The tailnet Traefik edge (`vps-obs`). `tailnet_sidecar_ip` is a vps.yml value and the
# seed also runs on oldsrv + the Pi, so the cluster constant is the fallback here too.
tailnet_edge_ip: "{{ tailnet_sidecar_ip | default('100.64.0.1', true) }}"
# The VPS public IPv6 (netcup-delegated). Cloudflare's AAAA for the host record is the
# only consumer today: the seed's record loop is IPv4 and answers this name with the v4.
dns_primary_ipv6: "2a0a:4cc0:60:fcc:d820:9dff:fe4f:95f5"
# The nas has no `nas_*_ip` entry in the address SSOT's naming pattern; read it the way
# the seed's inline row did, from `network_static_hosts` itself.
nas_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# The router's own Home-leg address (its gateway), read from the same address SSOT — used by
# the `router.kogler.si` host record.
router_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 10) | first).ip }}"

# --- the derived views each consumer loops over ------------------------------------
# These are VIEWS, not sources: edit `zone_kogler_si`, never these.
zone_kogler_si_seed_records: "{{ zone_kogler_si | selectattr('internal') | list }}"
# The prune guard's KEEP list: EVERY name the catalog lists, internal or not, LAN-only or not.
# Deliberately WIDER than `zone_kogler_si_seed_records`: the seed's delete leg must refuse a name
# the SSOT lists even on an instance that intentionally never seeds it (the LAN-only class on the
# VPS primary), so a retirement is the only thing this leg can ever act on. Nothing may widen this
# list to make a delete succeed: the narrower the refusal set, the weaker the guard.
zone_kogler_si_all_names: "{{ zone_kogler_si | map(attribute='name') | map('lower') | list }}"
zone_kogler_si_lan_only: "{{ zone_kogler_si | selectattr('lan_only', 'defined') | selectattr('lan_only') | map(attribute='name') | list }}"
# The retirement ledger: names this zone must NOT answer, because the service that owned them is
# gone from the catalog while the seeded record survived the retirement. State, not history: an
# entry stays until a read proves NXDOMAIN on every instance, and the seed's prune leg removes it
# again if it ever reappears. A name that is ALSO in `zone_kogler_si` is a contradiction, and
# scripts/gate/check_dns_seed_prune_guard.py refuses the tree for it.
zone_kogler_si_retired:
  # Metabase is retired and runs on no host; the name still had a seeded A record pointing at the
  # tailnet edge. Ledger entry stays so the record cannot survive a future re-seed of an old commit.
  - sec.kogler.si
zone_kogler_si_tailnet_plain: "{{ zone_kogler_si | selectattr('tailnet', 'defined') | selectattr('tailnet', 'equalto', 'edge') | list }}"
zone_kogler_si_tailnet_ts: "{{ zone_kogler_si | selectattr('tailnet', 'defined') | selectattr('tailnet', 'in', ['node', 'dual']) | list }}"
# Public face: the canonical CNAME set, then the names that answer something else.
# `subelements` pairs each name with each of its declared records, so one entry per
# name can still publish an A and an AAAA (item.0 = the entry, item.1 = the record).
zone_kogler_si_public_cnames: "{{ zone_kogler_si | selectattr('public', 'defined') | selectattr('public') | map(attribute='name') | list }}"
zone_kogler_si_public_records: "{{ q('ansible.builtin.subelements', zone_kogler_si | selectattr('public_records', 'defined') | list, 'public_records') }}"

ha_vip: 10.10.1.200                # keepalived VIP — ha.kogler.si
ha_vip_cidr: 24                    # VIP prefix — shared by primary + standby keepalived
ha_keepalived_vrid: 51            # VRRP virtual_router_id — MUST match on both HA nodes
# KNX bus router (SSOT static host `knx-ip` on VLAN 20): the GIRA IP router the HA KNX
# integration tunnels to. Connection is configured in the KNX config-flow UI (current HA
# has no YAML connection key), so this var documents + renders the IP used there.
knx_router_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'knx-ip') | first).ip }}"
# HA reverse-proxy trust: only specific Traefik edge container IPs are
# trusted for X-Forwarded-For, NOT the whole traefik-public /16. Each host runs its OWN
# traefik-public Docker bridge; fill the exact container IPs (default/`172.20.0.2/32` on the
# oldsrv edge, adjust the Pi traefik-ha edge) at deploy. Both edges must be listed since the
# SAME configuration.yaml is rendered on primary + standby.
ha_trusted_proxies:
  - 172.20.0.2/32            # oldsrv traefik (traefik-public bridge default .2) — verify at deploy
  - 10.10.1.30/32            # traefik-internal home-LAN edge on oldsrv — host networking
                             # (network_mode: host), so its source IP is the oldsrv Home-VLAN IP
                             # itself; keep in sync with oldsrv_home_ip (address SSOT)
  - 10.10.1.20/32            # Pi traefik-ha edge — host networking (network_mode: host), so its
                             # source IP is the Pi host IP itself; no container IP exists to trust
# Overlay-wide header trust: SAME contract as ha_trusted_proxies
# — services that consume forwarded headers must trust ONLY the exact
# Traefik edge container IPs, never the whole traefik-public /16 (any compromised
# container on that overlay could otherwise spoof X-Forwarded-For / X-authentik-*).
# The edge IP is no longer left to Docker's dynamic assignment: the traefik compose
# template pins it via ipv4_address = traefik_edge_ip_pin — a drifted bridge
# address silently un-trusts the edge, and the symptom is an auth loop
# (401 -> bare /login). Keep this list and the pin in sync per host.
# Consumers today are VPS-resident (authentik AUTHENTIK_TRUSTED_PROXIES, grafana
# GF_AUTH_PROXY_WHITELIST); extend the list only if another host's edge ever fronts a
# header-consuming service.
traefik_edge_ips:
  - 172.20.0.2/32            # vps traefik — pinned via traefik_edge_ip_pin
  - 172.20.0.250/32          # vps traefik-tailnet — pinned in the traefik-tailnet compose
# Static edge-container IP pinned by the traefik compose template (ipv4_address on each
# host's local traefik-public bridge). Same value on every host BY CONVENTION
# (bridge default `.2`); every host whose edge fronts a header-consuming service must
# have exactly this /32 in traefik_edge_ips above.
traefik_edge_ip_pin: 172.20.0.2
# RaspberryMatic standby CCU (macvlan on Home VLAN) — XML-RPC 2001/2010 target for
# ha-failover.full.sh.j2 (local-Homematic variant, parked). Only used when the
# HmIP-RFUSB is bought and raspberrymatic-standby is re-added; the active ha-failover.sh
# (no local Homematic) does not consume this. It resolves from the two parked ledger rows in
# network_static_hosts below, so it raises on an empty list until they are uncommented with
# the variant — an unused variable, never an unused failure.
homematic_ccu_oldsrv_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'homematic-ccu-oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# HA sync (Pi-initiated cert/config sync — failover primary side): oldsrv and Pi
# Home-VLAN IPs, used by ha-cert-sync/ha-config-sync timers + authorized_keys
# source restriction. Derived from the address SSOT.
oldsrv_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"
pi_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}"
# Signal alert recipients — the "Homelab alerts" Signal group, the WHOLE group,
# not the personal number. JSON-array body WITHOUT the
# brackets — the n8n workflow renders `recipients = [{{ $env.SIGNAL_RECIPIENTS }}]`, so
# each entry carries its own JSON quotes (add more entries as `"a", "b"`).
# The value is the V2 group id (`group.` + base64) that the linked signal-cli daemon
# reports, read read-only on oldsrv:
#   docker exec signal-cli-rest-api-signal-cli-rest-api-1 \
#     curl -s http://127.0.0.1:8080/v1/groups/$SIGNAL_CLI_PHONE_NUMBER   -> .id
# (that raw upstream API has NO auth and NO host port — hence `docker exec`, and the
# secured-signal-api gateway does not proxy it: /v1/groups is outside its allow-list.)
# ⛔ NOT the `invite_link` the same call returns — that is an encrypted join blob, not a
# recipient — and ⛔ NOT the group NAME, which is what the old render fallback produced:
# signal-cli-rest-api rejects a name and the workflow node swallows the rejection
# (`onError: continueRegularOutput`), so a wrong-shaped recipient fails silently forever.
# Non-secret SSOT (like grafana_alert_email): an id names a recipient, it authorises
# nothing — the send token stays in 1Password `signal-internal_api`.
signal_alert_recipients: '"group.NVZ6Y212bC9iZnIyNjNyQ0pnaVN6NllMOWRUbSszb0R5K0swbElQdjRrRT0="'
# ── IPv6 (scoped dual-stack) ─────────────────────────────────────────
# Measured on the live ISP: the PPPoE session DOES delegate a prefix —
#
# so the earlier "no /56 has ever been seen" blocker is CLOSED, and what takes
# IPv4 NAT's place as the inbound protection is our own filter — see
# docs/network-vlans.md §IPv6 allocation. NOTHING here hardcodes the prefix: the
# router's Home address and the advertised /64 are built FROM THE POOL at runtime
# (`from-pool` + `advertise=yes`), so a re-delegation is self-healing. `prefix_hint`
# only asks the ISP to hand the observed /56 back; it is a hint, not a dependency.
network_ipv6:
  pool: pd-wan6                              # /ipv6 pool the DHCPv6-PD client fills (auto-created on bind)
  router_address_suffix: "::1/64"            # the Home GWA keeps the IPv4 gateway habit (::1); the /64 comes from the pool
  prefix_hint: "2a00:ee2:2700:8f00::/56"     # what the ISP delegated today
  slaac_vlan_ids: [10]                       # RA/SLAAC on the Home VLAN ONLY; 20/30/40/50/99 stay v4-routed.
                                             # In 7.24 "no RA here" is expressed by "no advertised address here"
                                             # (one `advertise=yes` row device-wide) PLUS the v6 forward-chain
                                             # drops — NOT by a `disabled=yes` /ipv6 nd row, which falls back to
                                             # the `interface=all` default row and advertises anyway (measured).

# `lan_first_dns: true` = this VLAN's DHCP resolver chain starts with a HOME instance
# (Pi tertiary) instead of the VPS primary. It is the switch that decides which split-horizon
# ANSWER a device on that VLAN gets for the home-hosted app names (`media`/`seerr`/`seerrng`/
# the *arr set): a home instance answers `oldsrv_home_ip` (the home edge, works), the VPS
# primary answers `dns_primary_ip`. A VLAN that is VPS-first took the VPS answer, so it needs
# the VPS edge to actually route those names (a VPS-first VLAN measured media.kogler.si →
# VPS IP → 404 while the same URL on the home edge is 302 → /web/); with the VPS-edge routes in
# place the switch is resilience rather than the mechanism. Do not add a VLAN to this list without
# reading docs/network-dns.md §Per-Instance Split-Horizon first: it hands that VLAN the LAN
# answer for EVERY internal name, not just the one you are fixing. The permanent fix is the
# VPS-edge route, which makes the VPS answer correct everywhere — so
# the Media entry here is a WAN-out resilience choice, not a requirement.
network_vlans:
  - { id: 10, name: Home,         subnet: "10.10.1.0/24",  pool: "10.10.1.100-10.10.1.199",  ssid: "Kogler",     lan_first_dns: true }   # HA-independence: the Home VLAN must not depend on the VPS for DNS
  - { id: 20, name: IoT,          subnet: "10.10.20.0/24", pool: "10.10.20.100-10.10.20.199", ssid: "Kogler IOT" }
  - { id: 30, name: Guest,        subnet: "10.10.30.0/24", pool: "10.10.30.100-10.10.30.199", ssid: "Kogler guest" }
  - { id: 40, name: Kids,         subnet: "10.10.40.0/24", pool: "10.10.40.100-10.10.40.199", ssid: "Kogler Kids" }
  - { id: 50, name: Media,        subnet: "10.10.50.0/24", pool: "10.10.50.100-10.10.50.199", ssid: "",           lan_first_dns: true }   # TV/Shield must resolve the home-hosted media names locally
  - { id: 99, name: Management,   subnet: "10.10.99.0/24", pool: "10.10.99.50-10.10.99.99",  ssid: "" }
network_static_hosts:
  # Management VLAN 99
  - { name: router,   vlan: 99, ip: "10.10.99.1",  role: "RB4011 gateway" }
  - { name: switch,   vlan: 99, ip: "10.10.99.2",  role: "CRS328 mgmt" }
   # ap-garage is GONE: a hardware fault, removed from the canvas — ether1 on CRS328 is
   # EMPTY. No reserved slot; any future replacement gets a fresh entry here +
   # switch_port_map.
  - { name: ap-spalnica, vlan: 99, ip: "10.10.99.4", mac: "C4:AD:34:42:F1:7D", role: "hAP ac² (spalnica)" }
  - { name: ap-dnevna, vlan: 99, ip: "10.10.99.5", mac: "C4:AD:34:42:F0:B9", role: "hAP ac² (dnevna)" }
  - { name: ap-spare,  vlan: 99, ip: "10.10.99.6", role: "hAP ac² spare" }
  - { name: ups,      vlan: 20, ip: "10.10.20.9", mac: "00:20:85:C0:92:FA", role: "PowerWalker VFI 3000 IoT (USB NUT monitoring; NIC on IoT 20 no-WAN)" }
  - { name: nas,      vlan: 99, ip: "10.10.99.10", mac: "1C:98:EC:0E:0D:38", dhcp_client: mac, role: "HP MicroServer Gen8" }
  - { name: ilo,      vlan: 99, ip: "10.10.99.11", mac: "1C:98:EC:0E:0D:3A", role: "nas iLO4 BMC" }
  - { name: pi,       vlan: 99, ip: "10.10.99.20", mac: "E4:5F:01:26:EF:AA", role: "RPi4 node + DNS tertiary" }
  - { name: oldsrv,   vlan: 99, ip: "10.10.99.30", mac: "70:85:C2:2D:6F:04", dhcp_client: mac, role: "i7-7700K node + DNS secondary" }
  - { name: spark,    vlan: 99, ip: "10.10.99.40", mac: "38:A7:46:78:13:97", role: "DGX Spark GB10 — mgmt-plane (tagged VLAN-99 on the same enP7s7 NIC as Home); static reservation" }
  - { name: laptop-domen, vlan: 99, ip: "10.10.99.80", mac: "48:2A:E3:9D:31:85", role: "Domen's laptop Windows — Mgmt 99 static (vEthernet Mgmt99; no default gw); WSL Debian reaches 99 via Windows route-through (10.10.99.0/24 → 10.10.1.80), opt-in -EnableMgmt99 extra" }
  - { name: laptop-wsl,  vlan: 10, ip: "10.10.1.81",  role: "Domen's WSL Debian — durable runner state = NAT + auto-resolv (no static; eth0 = NAT DHCP; resolv follows Windows), scripts/hardware/wsl-nat-resolv.ps1; 10.10.1.81 was the old bridged static (systemd-networkd), kept as reservation for fallback" }
  # Home VLAN 10
  - { name: router,   vlan: 10, ip: "10.10.1.1",   role: "Home gateway" }
  # DHCP client-id = MAC (dhcp_client: mac) for the two DHCP-only Debian hosts (nas/oldsrv):
  # their dhcpcd/NetworkManager send an RFC4361 DUID client-id by default, which does NOT
  # match the MAC-keyed RouterOS DHCP reservations (network_static_hosts mac: field) — they
  # land on the dynamic pool (.100/.101) instead of their reserved statics (.10/.30). The
  # host-side `network` role (dhcp_client == 'mac') flips the client-id to the interface MAC
  # so the existing RouterOS reservations bind (verified working pattern: knx/bosch/ups/ilo).
  # SSOT for the marker; converge template + network role both derive from it.
  - { name: nas,      vlan: 10, ip: "10.10.1.10",  mac: "1C:98:EC:0E:0D:38", dhcp_client: mac, role: "Cockpit/NFS/NUT master" }
  - { name: pi,       vlan: 10, ip: "10.10.1.20",  mac: "E4:5F:01:26:EF:AA", role: "node + DNS tertiary (VRRP anchor)" }
  - { name: oldsrv,   vlan: 10, ip: "10.10.1.30",  mac: "70:85:C2:2D:6F:04", dhcp_client: mac, role: "node + DNS secondary (VRRP anchor)" }
  # spark MAC comes from the live DHCP lease at first boot (vlan10-home).
