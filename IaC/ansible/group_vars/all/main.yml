  # VPS Technitium + whatever joins deliberately); host :53/udp+tcp publishes to
  # LAN/tailnet clients. oldsrv (secondary) + Pi (tertiary) are the home-LAN
  # failure-domain split; the VPS overlay IP is the primary resolver address SSOT.
  - { name: dns-servers,       cidr: "172.25.0.0/24",  purpose: "Docker bridge — Technitium DNS primary (VPS) ↔ its Traefik edge; the container pin is tchnitium_dns_overlay_ip (client resolver = VPS public IP, dns_primary_ip) " }
  - { name: site,              cidr: "10.10.0.0/16",   purpose: "Whole homelab site — all VLANs (10.10.x.0/24)" }
