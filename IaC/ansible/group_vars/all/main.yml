# ==== WireGuard S2S: VPS ↔ router (wg-s2s, 10.255.40.0/30) — HD-03 / network-vpn.md ====
# Single site-to-site tunnel: home RB4011 (peer .1) ↔ VPS (peer .2). The home router
# routes `wg-vps-services` via the VPS S2S peer; the VPS routes `site` (10.10.0.0/16)
# via the home S2S peer. Router-side addressing/port is in group_vars/router.yml
# (`wireguard_s2s_vps`); this is the VPS-side peer var (the tunnel config lives in the
# wireguard role). Keys: `wg_password` (router) + `wg_password_vps` (VPS) — DISTINCT per side (HD-285 fix).
wg_s2s_vps:
  # Peer addresses on the `wg-s2s` /30 (10.255.40.0/30): VPS is .2, router is .1.
  # This is the single SSOT for the VPS peer; templates reference these, never literals.
  local_ip: "10.255.40.2/30"        # VPS side of the /30 (router is .1)
  ip: "10.255.40.2"                  # bare VPS peer IP (Alloy/compose bind target)
  router_ip: "10.255.40.1"
  listen_port: 51820
  endpoint: "s.kogler.si"           # home WAN DDNS token (Cloudflare-tracked; VPS initiates here, resolves each boot — idempotent + VPS-redo-safe). SSOT: cloudflare_dns/vars/main.yml.
  peer_public_key: "{{ lookup('vars', 'wg_s2s_router_public_key', default='') }}"  # router(PubKey), provisioned at deploy  (HD-271: lookup default — no `in vars` membership; the internal vars dict is deprecated at 2.24)
  # AllowedIPs — LEAST-ACCESS (HD-155): the VPS may reach ONLY the scoped home
  # targets below (exporter/VIP/probe + oldsrv backends when wired), NOT the whole
  # `site` /16. Derived from network_static_hosts by name (never literal IPs). The
  # wg-vps-services range stays (VPS-resident services on the other side of the peer).
  # A compromised VPS can thus only reach nut/zfs/HA + ICMP + the named app backends.
  # SSOT for BOTH tunnel sides: the router-side peer list (`wireguard_s2s_vps.allowed_ips`,
  # group_vars/router.yml) derives from this list (HD-200) — edit here only.
  allowed_ips:
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'ha-vip') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 99) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'switch') | selectattr('vlan', 'equalto', 99) | first).ip }}/32"
    - "{{ (network_ranges | selectattr('name', 'equalto', 'wg-vps-services') | first).cidr }}"

# ---- WireGuard S2S public keys (DISTINCT per side — HD-285 fix, 2026-09-02) ----
# WireGuard requires EACH side to have its OWN keypair: a router cannot peer with a
# key equal to its own. The old "shared wg_password on both ends" design made both
# sides' pubkeys identical (`gwXAk+…`) → the router tried to handshake with itself →
# no handshake ever. Now: router uses `wg_password` (`wg_s2s_router_public_key`), the
# VPS uses its OWN keypair stored as `wg_password_vps` (`wg_s2s_vps_public_key`); each
# side's peer = the OTHER side's pubkey (never its own).
wg_s2s_router_public_key: "gwXAk+550CDfybOg64+v+QUFv1sW0wnGrIiI+EWFhUk="   # RB4011 side = wg_password (router's own private key)
wg_s2s_vps_public_key: "NeEeWiEdcPfA4N8R0biRffkY4hQPNOtq8z87mr6I/0I="   # VPS side = wg_password_vps (VPS's own private key, NEW item)

# ==== Observability backend target for Alloy (HD-135) ====
# Forward target derived from `wg_s2s_vps.ip` (SSOT) — no literal IP embedded here.
alloy_backend_host: "{% if inventory_hostname == 'oldsrv.kogler.si' %}{{ wg_s2s_vps.ip }}{% else %}127.0.0.1{% endif %}"

# ==== Immich ML cross-host endpoint (HD-184) ====
# immich-app runs on the VPS; immich-ml (GPU) stays on oldsrv. Docker DNS cannot
# resolve across hosts, so the app targets oldsrv's Home-VLAN address over the WG
# S2S tunnel (HD-135/155) — derived from the address SSOT, never a literal IP.
immich_ml_bind: "{{ oldsrv_home_ip }}"   # immich-ml publishes :3003 bound to this on oldsrv
immich_ml_url: "http://{{ immich_ml_bind }}:3003"   # IMMICH_MACHINE_LEARNING_URL on the VPS

# ==== Hetzner Storage Box — live (CIFS mount on the VPS, HD-135) ====
# Immich originals+encoded-video and OpenCloud files live on the live Box (CIFS), mounted
# on the VPS at /mnt/storagebox. Connection facts (host/user/password) are the live-box
# entry in subscriptions.yml (`secret: Hertzner-SB-Data`); only the mount-specific knobs
# live here. SMB username/password resolved at render from the 1Password item.
# Exposed to containers as the neutral storage owner (storage_uid/storage_gid).
# Defined here ONCE (HD-51 neutral owner): identical across hosts so file ownership
# survives data moves; CIFS mount + container user: both derive from these.
storage_uid: "1005"
storage_gid: "1005"
livebox_cifs:
  mount_point: /mnt/storagebox
  cifs_share: "//u653411.your-storagebox.de/backup"   # live box share (subscriptions.yml host)
  uid: "{{ storage_uid }}"
  gid: "{{ storage_gid }}"
  creds_file: /etc/cifs/livebox.creds

# Single-namespace DNS: everything (hosts + services) is under kogler.si.
# Internal-only hosts/services are NOT published in public DNS (split-horizon).

# Allowed Ansible management users (the only users that may receive sudo).
# ai-debug (AI access) must NEVER be added here — see roles/common/tasks/system.yml.
ansible_admin_users:
  - ansible-admin   # created by preseed post_install.sh on all preseed hosts (nas/oldsrv/VPS/Pi)