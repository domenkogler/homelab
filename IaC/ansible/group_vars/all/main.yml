# ==== WireGuard S2S: VPS ↔ router (wg-s2s, 10.255.40.0/30) — network-vpn.md ====
# Single site-to-site tunnel: home RB4011 (peer .1) ↔ VPS (peer .2). The home router
# routes `wg-vps-services` via the VPS S2S peer; the VPS routes `site` (10.10.0.0/16)
# via the home S2S peer. Router-side addressing/port is in group_vars/router.yml
# (`wireguard_s2s_vps`); this is the VPS-side peer var (the tunnel config lives in the
# wireguard role). Keys: `wg_password` (router) + `wg_password_vps` (VPS) — DISTINCT per side.
wg_s2s_vps:
  # Peer addresses on the `wg-s2s` /30 (10.255.40.0/30): VPS is .2, router is .1.
  # This is the single SSOT for the VPS peer; templates reference these, never literals.
  local_ip: "10.255.40.2/30"        # VPS side of the /30 (router is .1)
  ip: "10.255.40.2"                  # bare VPS peer IP (Alloy/compose bind target)
  router_ip: "10.255.40.1"
  listen_port: 51820
  endpoint: "s.kogler.si"           # home WAN DDNS token (Cloudflare-tracked; VPS initiates here, resolves each boot — idempotent + VPS-redo-safe). SSOT: cloudflare_dns/vars/main.yml.
  peer_public_key: "{{ lookup('vars', 'wg_s2s_router_public_key', default='') }}"  # router(PubKey), provisioned at deploy (lookup default — no `in vars` membership test)
  # AllowedIPs — LEAST-ACCESS: the VPS may reach ONLY the scoped home
  # targets below (exporter/VIP/probe + oldsrv backends when wired), NOT the whole
  # `site` /16. Derived from network_static_hosts by name (never literal IPs). The
  # wg-vps-services range stays (VPS-resident services on the other side of the peer).
  # A compromised VPS can thus only reach nut/zfs/HA + ICMP + the named app backends.
  #
   # The router's OWN wg-s2s tunnel address
  # (`10.255.40.1`, `router_ip` above) MUST also be in this list. RouterOS remote
  # syslog sends with src-address=10.255.40.1 (the action's src-address); WireGuard
  # silently drops any inner packet whose source IP is not in the peer's AllowedIPs.
   # That drop is what the "zero UDP/514 egress" symptom really was — the
  # fixsyslog toggle could never help. Keep both the tunnel addr (here) and the
  # mgmt-99 addr (row below) so ALL router-sourced traffic is permitted.
  # SSOT for BOTH tunnel sides: the router-side peer list (`wireguard_s2s_vps.allowed_ips`,
   # group_vars/router.yml) derives from this list — edit here only.
  allowed_ips:
    - "{{ wg_s2s_vps.router_ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'ha-vip') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'spark') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"   # spark (llm.kogler.si + db-spark) over S2S
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 99) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'switch') | selectattr('vlan', 'equalto', 99) | first).ip }}/32"
    - "{{ (network_ranges | selectattr('name', 'equalto', 'wg-vps-services') | first).cidr }}"

# ---- WireGuard S2S public keys (DISTINCT per side) ----
# WireGuard requires EACH side to have its OWN keypair: a router cannot peer with a
# key equal to its own. The old "shared wg_password on both ends" design made both
# sides' pubkeys identical (`gwXAk+…`) → the router tried to handshake with itself →
# no handshake ever. Now: router uses `wg_password` (`wg_s2s_router_public_key`), the
# VPS uses its OWN keypair stored as `wg_password_vps` (`wg_s2s_vps_public_key`); each
# side's peer = the OTHER side's pubkey (never its own).
wg_s2s_router_public_key: "gwXAk+550CDfybOg64+v+QUFv1sW0wnGrIiI+EWFhUk="   # RB4011 side = wg_password (router's own private key)
wg_s2s_vps_public_key: "NeEeWiEdcPfA4N8R0biRffkY4hQPNOtq8z87mr6I/0I="   # VPS side = wg_password_vps (VPS's own private key, NEW item)
# WG-S2S internal-edge publish port: the home `traefik-internal` edge (oldsrv)
# and the VPS `traefik-tailnet` edge reach VPS-hosted backends over the wg-s2s bridge on
# this port. SSOT here (consumed by the shared traefik-internal templates on oldsrv and
# the VPS-side compose/nftables) so the edges stay in lockstep (derived-values ban).
wg_internal_edge_port: 4443

# ==== Observability backend target for Alloy ====
# Forward target derived from `wg_s2s_vps.ip` (SSOT) — no literal IP embedded here.
# Per-node model: every non-backend Alloy (oldsrv, nas, pi) remote_writes
# to the VPS Victoria backend over the wg-s2s tunnel; only the VPS (the backend host with
# VM/VL running locally) uses loopback.
alloy_backend_host: "{% if inventory_hostname == 'vps.kogler.si' %}127.0.0.1{% else %}{{ wg_s2s_vps.ip }}{% endif %}"

# ==== Victoria* observability backend (replaces Prometheus+Loki on the VPS) ====
# Single Victoria stack on the VPS: VictoriaMetrics (metrics, :8428, pure storage/query —
# Alloy does ALL scraping, topology (B)) + VictoriaLogs (logs, :9428). Alloy (host/SNMP/
# exporter remote_write + log push) and Grafana stay; Prometheus and Loki are not deployed.
# Retention 365d / 90d — more than Prometheus 30d / Loki 14d, because Victoria compresses
# far better; the volumes are
# Kopia-backed (docs/observability.md) rather than a regenerable TSDB.
# The MCP AI-debugging servers live on oldsrv and reach these VPS endpoints over
# the tailnet (an s2s-wg → tailnet redo is planned; the MCP leg already uses tailnet).
# 1Password basic-auth items (HYPHENATED <service>_<type>, CONVENTIONS §1):
#   victoria-metrics_api  — username + password (plaintext Victoria -httpAuth, NOT bcrypt)
#   victoria-logs_api     — username + password (plaintext Victoria -httpAuth)
# NOTE: Alloy/exporters still reach the VPS over wg-s2s; the MCP leg is
# the first tailnet consumer. If the VPS Victoria endpoints must also listen on a VPS
# tailnet address for MCP, that is a publish-address addition owned by the impl leg.
victoria_metrics_port: 8428              # VictoriaMetrics HTTP endpoint / api/v1/* (query+write+admin)
victoria_logs_port: 9428                # VictoriaLogs HTTP endpoint /insert/... + /select/...
victoria_metrics_retention_days: 365    # -retentionPeriod; Kopia-backed (docs/observability.md)
victoria_logs_retention_days: 90        # -retentionPeriod; Kopia-backed (docs/observability.md)
victoria_metrics_item: victoria-metrics_api  # 1Password basic-auth item (username + password)
victoria_logs_item: victoria-logs_api         # 1Password basic-auth item (username + password)

# ==== Victoria backend reach target for the oldsrv MCP AI servers ====
# The MCP servers (mcp-victoriametrics / mcp-victorialogs on oldsrv) point at the
# VPS Victoria backend over wg-s2s TODAY — the same guaranteed-reachable tunnel the
# Alloy collector uses (`wg_s2s_vps.ip`). A full s2s-wg → tailnet redo is planned:
# that redo re-plumbs this ONE var to the VPS tailnet address and the
# MCP compose templates need no other change. No VPS tailnet IP exists in the SSOT
# yet — do NOT invent one here (check docs/network-vpn.md before the redo).
victoria_backend_host: "{{ wg_s2s_vps.ip }}"   # MCP → Victoria backend host (wg-s2s now, tailnet later)

# MCP server listen ports on OLDSRV. The upstream images bind `MCP_LISTEN_ADDR`
# (default localhost:8080 metrics / :8081 logs); inside Docker the container binds
# :8080/:8081, published loopback-only for the local AI clients (pi/OWUI/OpenClaw on the LAN +
# tailnet). Distinct per server; never expose on the WAN/public edge.
mcp_metrics_port: 8083  # MCP→VM Streamable HTTP (oldsrv) — 8080 belongs to pi-dev, hence 8083
mcp_logs_port: 8084    # MCP→VL Streamable HTTP (oldsrv) — kept sequential with the metrics pair

# ==== Immich ML cross-host endpoint ====
# immich-app runs on the VPS; immich-ml (GPU) stays on oldsrv. Docker DNS cannot
# resolve across hosts, so the app targets oldsrv's Home-VLAN address over the WG
# S2S tunnel — derived from the address SSOT, never a literal IP.
immich_ml_bind: "{{ oldsrv_home_ip }}"   # immich-ml publishes :3003 bound to this on oldsrv
immich_ml_url: "http://{{ immich_ml_bind }}:3003"   # IMMICH_MACHINE_LEARNING_URL on the VPS

# ==== Jellyfin on the home edge ====
# The PUBLIC edge reaches Jellyfin inside the `traefik-public` overlay (its compose
# labels), but traefik-internal runs `network_mode: host` and cannot see a container-only
# port — that is the 502 class on media.kogler.si from the LAN (no
# listener on :8096 at all, while actual-budget :5006 and immich-ml :3003 are published
# on `oldsrv_home_ip`). Same precedent, tighter bind: the edge and the host are the same
# box, so LOOPBACK is enough and it does not hand Jellyfin's own login (and its bypass of
# the edge's CrowdSec/HSTS posture) to every Home device.
# Loopback IS the posture for the whole routed group, so this
# binds loopback like the rest. A LAN client that insists on dialling :8096 directly is a NEW
# decision, not a one-line flip — `JELLYFIN_PublishedServerUrl` (compose) already hands every client
# the edge name, so direct-:8096 access is a regression of the edge, not a client fix.
jellyfin_bind: "127.0.0.1"
jellyfin_host_port: 8096                     # host port; the container side stays 8096
jellyfin_url: "http://{{ jellyfin_bind }}:{{ jellyfin_host_port }}"   # traefik-internal's media-backend

# ==== *arr/downloaders on the home edge (the Jellyfin pattern, applied per service) ====
# traefik-internal runs `network_mode: host` and can only reach a backend that PUBLISHES a
# host socket on the address the route names — container-only exposure is invisible to it,
# and the failure is a silent 502. These publishes give each of the old 502s a loopback
# socket (same bind logic as Jellyfin: the edge is on this box, and a loopback bind keeps
# each app's OWN login — *arr Forms auth, Seerr/SeerrNG local login — off the Home VLAN;
# the VPS/public leg is served by the overlay labels, not these). Each `*-backend` URL in
# routes.yml.j2 points at the matching `*_url`, never a literal `oldsrv_home_ip:<port>`.
# Distinct host ports where two containers share an internal port: seerrng 5056 (both
# listen :5055 inside), torrent 8085 (qBittorrent :8080 inside shares with SABnzbd — 8081
# is dozzle/llogs, and 8082 is ALREADY TAKEN, see the collision note at qbittorrent_host_port).
# recyclarr has NO publish: it is a scheduled worker with no UI and talks to
# sonarr/radarr over the overlay network, not through the edge.
# The routed group binds LOOPBACK. The edge reads the same
# `*_url` vars these publishes do, so a bind and its `*-backend` URL move together in ONE render —
# that is what keeps a subset flip (which 502s the group) unreachable by construction.
# What loopback does NOT cover, and stays on the Home IP on purpose (check with `ss -ltn`):
#   immich-ml :3003 + actual-budget :5006 — dialed CROSS-HOST (the VPS over the WG S2S); loopback
#     would take Immich ML and the n8n→Actual leg down;
#   lan-litellm :4000 + dozzle :8081 — the edge dials these as LITERALS in routes.yml.j2, not as
#     `*_url` vars, so they cannot move in this change without introducing those vars; lan-litellm is
#     the LLM plane and wants its own window. Tracked as the lan-litellm tail.
#   slskd :5030 / aurral :3001 / lidarr-ydl :5005 — publish a host socket with NO router in any edge
#     file and no record in technitium-seed.yml: loopback here would take away the only way
#     anything reaches them today without adding the door that is actually owed.
# ⛔ Half-applying is still the bug: bind AND route must move together, in one converge.

# to sonarr/radarr over the overlay network, not through the edge.
# Every `*_bind` below is loopback by the ruling above. Flipping ONE of them back to
# `{{ oldsrv_home_ip }}` re-exposes that one app's own login to the Home VLAN while the edge still
# works — the change reads as harmless and is exactly the posture the ruling closed.
sonarr_bind: "127.0.0.1"
sonarr_host_port: 8989
sonarr_url: "http://{{ sonarr_bind }}:{{ sonarr_host_port }}"
radarr_bind: "127.0.0.1"
radarr_host_port: 7878
radarr_url: "http://{{ radarr_bind }}:{{ radarr_host_port }}"
lidarr_bind: "127.0.0.1"
lidarr_host_port: 8686
lidarr_url: "http://{{ lidarr_bind }}:{{ lidarr_host_port }}"

# The LAN URL of the LAN-only LiteLLM proxy (container `lan-litellm`, host-net publish
# on the oldsrv Home address:4000). The edge template used to carry
# `http://{{ oldsrv_home_ip }}:4000` inline, which is why the name `lan_litellm_url` did not
# exist to reference. Minted here so the SSOT rule (docs/services-traefik.md §Service URL Map)
# holds for this service too. ⚠ NOT the VPS `litellm` service and NOT the spark `litellm-*`
# profiles — and NOT `litellm_scoped_keys`, which is a different name that already means two
# different things on home_servers and vps (that collision is the reason this one is named after
# the container, not the software).
lan_litellm_host_port: 4000
lan_litellm_bind: "{{ oldsrv_home_ip }}"
lan_litellm_url: "http://{{ lan_litellm_bind }}:{{ lan_litellm_host_port }}"
prowlarr_bind: "127.0.0.1"
prowlarr_host_port: 9696
prowlarr_url: "http://{{ prowlarr_bind }}:{{ prowlarr_host_port }}"
bazarr_bind: "127.0.0.1"
bazarr_host_port: 6767
bazarr_url: "http://{{ bazarr_bind }}:{{ bazarr_host_port }}"
seerr_bind: "127.0.0.1"
seerr_host_port: 5055
seerr_url: "http://{{ seerr_bind }}:{{ seerr_host_port }}"
seerrng_bind: "127.0.0.1"
seerrng_host_port: 5056                     # split from seerr — both containers listen :5055 inside
seerrng_url: "http://{{ seerrng_bind }}:{{ seerrng_host_port }}"
profilarr_bind: "127.0.0.1"
profilarr_host_port: 6868
profilarr_url: "http://{{ profilarr_bind }}:{{ profilarr_host_port }}"
sabnzbd_bind: "127.0.0.1"
sabnzbd_host_port: 8080
sabnzbd_url: "http://{{ sabnzbd_bind }}:{{ sabnzbd_host_port }}"
# qBittorrent's publish lives on the GLUETUN sidecar (the netns owner); loopback there is the same
# ruling applied. ⚠ The arrs do NOT dial this socket — qbit rejects a Host header whose
qbittorrent_bind: "127.0.0.1"
# qBittorrent WebUI listens :8080 inside the gluetun netns; host port split from sabnzbd's 8080.
# ⚠ 8082 is NOT free on this host: signal-cli-rest-api publishes {{ oldsrv_home_ip }}:8082:8880
# (templates/docker_services/signal-cli-rest-api/), so the torrent port must not take it —
# binding 8082 here fails the Signal gateway's container, which is an alerting outage dressed up
# as a media fix. 8085 is free (8083/8084 are the
# Victoria* MCP publishes). Any NEW publish here must be checked against EVERY existing
# `oldsrv_home_ip:` publish in the template tree, not against the neighbouring media ports alone.
# ⚠ `8085` is also `rmat_ui_port` in templates/docker_services/raspberrymatic/ — harmless ONLY because
# raspberrymatic is not in the Pi loop (parked, raspberry_pi.yml). If it is ever re-parked
# on oldsrv these two collide; check `ss -ltnp | grep 8085` before enabling either.
qbittorrent_host_port: 8085
qbittorrent_url: "http://{{ qbittorrent_bind }}:{{ qbittorrent_host_port }}"

# ==== The music trio on the home edge ====
# Same shape as the *arr set above: traefik-internal is `network_mode: host`, so a
# route can only reach a backend that PUBLISHES a host socket on the address the route names.
# All three already publish on the oldsrv Home IP (aurral :3001,
# slskd :5030 via its gluetun sidecar's publish, lidarr-ydl :5005), so NO compose change is
# needed — only the vars, the routers and the records. Ports are re-checked against every
# other `oldsrv_home_ip:` publish per the qbittorrent note above (3001/5005/5030 measured
# free of collisions on this host).
aurral_bind: "{{ oldsrv_home_ip }}"
aurral_host_port: 3001
aurral_url: "http://{{ aurral_bind }}:{{ aurral_host_port }}"
# slskd shares the gluetun-slskd network namespace; the publish lives on the sidecar.
slskd_bind: "{{ oldsrv_home_ip }}"
slskd_host_port: 5030
slskd_url: "http://{{ slskd_bind }}:{{ slskd_host_port }}"
# The name is `lidarr-ydl.`: the tool is Lidarr-only and audio-only, which is why the name is
# not the neutral `ydl.` and never the older `url-dl.` — do not rename it.
lidarr_ydl_bind: "{{ oldsrv_home_ip }}"
lidarr_ydl_host_port: 5005
lidarr_ydl_url: "http://{{ lidarr_ydl_bind }}:{{ lidarr_ydl_host_port }}"

# ==== Tailscale listen port ====
# 41641 is tailscaled's DEFAULT, so this is not a change — it is the PIN that keeps it
# true: on a port conflict tailscaled silently falls back to a random port, which would
# leave any "exactly one UDP exception" rule pointing at nothing. The role writes it to
# /etc/default/tailscaled (PORT=), which the unit already passes as `--port=${PORT}`.
tailscale_listen_port: 41641

# ==== Hetzner Storage Box — live (CIFS mount on the VPS) ====
# Immich originals+encoded-video and OpenCloud files live on the live Box (CIFS), mounted
# on the VPS at /mnt/storagebox. Connection facts (host/user/password) are the live-box
# entry in subscriptions.yml (`secret: Hertzner-SB-Data`); only the mount-specific knobs
# live here. SMB username/password resolved at render from the 1Password item.
# Exposed to containers as the neutral storage owner (storage_uid/storage_gid).
# Defined here ONCE (the neutral storage owner): identical across hosts so file ownership
# survives data moves; CIFS mount + container user: both derive from these.
storage_uid: "1005"
storage_gid: "1005"
livebox_cifs:
  mount_point: /mnt/storagebox
  cifs_share: "//u653411.your-storagebox.de/backup"   # live box share (subscriptions.yml host)
  uid: "{{ storage_uid }}"
  gid: "{{ storage_gid }}"
  creds_file: /etc/cifs/livebox.creds

# Single-namespace DNS: everything (hosts + services) is under kogler.si.
# Internal-only hosts/services are NOT published in public DNS (split-horizon).

# Allowed Ansible management users (the only users that may receive sudo).
# ai-debug (AI access) must NEVER be added here — see roles/common/tasks/system.yml.
ansible_admin_users:
  - ansible-admin   # created by preseed post_install.sh on all preseed hosts (nas/oldsrv/VPS/Pi)