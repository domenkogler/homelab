---
# VPS host configuration — netcup RS 2000 G12
# Plain Debian root server with
# Docker CE — the VPS is NOT a Proxmox node (no proxmox_bridges here, see home
# `proxmox` role / homelab_mode). Host identity facts live here; billing lives in
# `subscriptions.yml` (cost, renewal, status).

vps_host:
  provider: netcup
  model: RS 2000 G12
  purchased: 263.52           # EUR, 12 months prepaid
  monthly: 21.96              # EUR/mo effective
  valid_until: "2027-08-18"
  specs:
    cpu: "AMD EPYC 9645"
    cores: 8                 # dedicated
    ram_gb: 16               # DDR5 ECC
    disk_gb: 512             # NVMe SSD root
    max_local_block_storage_tb: 8   # expandable Local Block Storage add-on
    iface_gbit: 2.5          # flatrate traffic; throttled to 300 MBit/s if >3 TB rolling / 24 h
  # SSH connection facts (ansible_user, ansible_host) live in host_vars/vps.kogler.si.yml.

# Grafana SMTP relay: the VPS is its own group (not home_servers),
# so a `grafana_smtp_host` set only in home_servers.yml never applies here and VPS Grafana
# falls back to `localhost:25` (dead). Derive from the smtp2go SSOT (2525).
grafana_smtp_host: "{{ smtp2go_host }}:{{ smtp2go_port }}"

docker_services:
  # ORDERING CONSTRAINT: `authentik` MUST appear before every native-OIDC consumer
  # (opencloud, immich-app, forgejo, open-webui, matrix, headscale…). The docker_services
  # role runs the secret-egress glue in an explicit pre-pass
  # (tasks/prepass-authentik.yml) BEFORE the deploy loop, seeding 1Password
  # client creds that the consumers' compose `lookup()` reads at render time — so a consumer
  # rendered BEFORE authentik would get empty/placeholder OIDC creds (fail-loud).
  # The pre-pass is gated on `authentik`'s presence, so `authentik` must stay in this list
  # (not removed or reorder-after an OIDC consumer).
  # Do not remove/reorder authentik after a native-OIDC service.
  # === Edge tier (self-contained public edge) ===
  - { name: traefik,        template_dir: traefik,   enabled: true }
  - { name: crowdsec,       template_dir: crowdsec,  enabled: true }
  # Technitium DNS PRIMARY on the VPS: always-on resolver for LAN
  # + tailnet; dedicated dns-servers overlay pinned to dns_primary_ip (172.25.0.2),
  # host :53 published. Web UI at dns.kogler.si (Forward-Auth) via the subdomain label.
  # oldsrv (secondary) + Pi (tertiary) keep the home-LAN failure-domain split.
  # Forwards to the SSOT upstreams instead of chasing every cold
  # public name from the root — this instance is FIRST for guest/mgmt/iot/media + the tailnet chain,
  # so its chase tail (root→TLD→auth, serialised) is the fleet's. Egress-only: no client-facing
  # address changes, and `*.kogler.si` stays authoritative so HA name resolution cannot ride it.
  - { name: technitium,     template_dir: technitium, subdomain: dns, public: true, enabled: true,
      technitium_forwarders: "{{ dns_resolver_upstreams }}" }
  # db_role_sync: postgres images apply POSTGRES_PASSWORD ONLY at
  # first cluster init — a rotated 1Password db item re-renders compose envs but the persisted
  # cluster keeps the OLD role password (a crash-loop precedent). Opt-in per
  # service: deploy-service.yml re-syncs the ROLE password from the same vault item post-up.
  - { name: authentik,      template_dir: authentik, subdomain: sso, public: true, enabled: true,
      db_role_sync: true, db_item: authentik_db, db_pg_container: authentik-postgres }  # + bundled pg/redis
  # Family launchpad at the public edge: kogler.si root + home alias via
  # the compose's Docker-provider labels; Forward-Auth consumer (not native OIDC), so it
  # may sit anywhere after authentik.
  - { name: homepage,       template_dir: homepage, subdomain: home, public: true, enabled: true }
  # === Public live-data apps + co-located DBs (NVMe) ===
  - { name: opencloud,      template_dir: opencloud, subdomain: file, public: true, enabled: true, bind_owner_uid: "{{ storage_uid }}", bind_dirs: ['config', 'data'] }  # + bundled db
  - { name: onlyoffice-docs, template_dir: onlyoffice-docs, subdomain: office, public: true, enabled: true,  # WOPI helper for opencloud; NO auth surface
      db_role_sync: true, db_item: onlyoffice_db, db_pg_container: onlyoffice-postgres }       # rotation-drift guard. The pg+redis moved to NAMED volumes — the old nested host binds under /srv/docker/onlyoffice-docs got chown-corrupted by DS init (uid 105 walk); no bind_owner_uid needed anymore.
  - { name: immich-app,     template_dir: immich-app, subdomain: foto, public: true, enabled: true,  # + pg/valkey; ML->oldsrv
      db_role_sync: true, db_item: immich_db, db_pg_container: immich-postgres }
  - { name: forgejo,        template_dir: forgejo,   subdomain: git, public: true, enabled: true,   # + bundled db
      db_role_sync: true, db_item: forgejo_db, db_pg_container: forgejo-db }
  # PUBLIC bin/shortener/QR: crowdsec-only tier, native-OIDC dashboard,
  # guestbin dropzone seeded post-deploy (compose header = deploy-gate runbook).
  - { name: zipline,        template_dir: zipline,   subdomain: bin, public: true, enabled: true,
      db_role_sync: true, db_item: zipline_db, db_pg_container: zipline-db }
  # === AI stack (public/gateway tier) ===
  - { name: litellm,        template_dir: litellm,   public: false, enabled: true,    # llm-backend -> oldsrv ollama over WG
      bootstrap_keys: true,
      db_role_sync: true, db_item: litellm_db, db_pg_container: litellm-db }
  - { name: qdrant, template_dir: qdrant, public: false, enabled: true }  # AI RAG hybrid vector store on db-internal — not postgres, so NO db_role_sync/db_item
  - { name: docling,        template_dir: docling,   public: false, enabled: true,   # OCR (services-internal)
      # the `cache` bind carries torch-inductor's compiled kernels, which must be dlopen-able.
      # The image runs as uid 1001 → Docker would auto-create the host dir root-owned and the layout
      # stage would fail with a PermissionError instead of the noexec one.
      bind_owner_uid: "1001", bind_dirs: ['models', 'cache'] }
  - { name: open-webui,     template_dir: open-webui, subdomain: ai, public: true, enabled: true }
  # === AI coding harness: dsh + pi-dev live on OLDSRV, not here ===
  # The dev-AI tier is oldsrv's (group_vars/home_servers.yml);
  # there are no VPS tailscale sidecars for them. The names stay served on the VPS tailnet
  # edge (traefik-tailnet -> WG -> oldsrv_home_ip) — see the DSH/pi-dev subdomain
  # entries + route re-point under `tailnet_subdomains` / traefik-tailnet routes.
  # === AI MCP stubs — placeholders; do not yet deploy a runnable unit ===
  - { name: rag-mcp,        template_dir: rag-mcp,   enabled: false }  # TODO(impl) kapa-style hybrid reader (Qdrant→rerank→top5)
  - { name: forgejo-mcp,    template_dir: forgejo-mcp, enabled: false }  # TODO(impl) Forgejo OKF-wiki read/write bridge
  # bind_owner_uid/bind_dirs: Docker auto-creates these host
  # bind dirs root-owned; the images run non-root (grafana=472, n8n/openclaw=1000 node)
  # and crash with EACCES. deploy-service.yml pre-creates/chowns them (Class-A fix).
  - { name: openclaw,       template_dir: openclaw,  public: false, enabled: true, bind_owner_uid: "1000", bind_dirs: ['.', 'workspace', 'auth'] }
  # === Observability backend (VPS = reliable tier; VPS self-observes loopback) ===
  # The Victoria* stack replaces Prometheus/Loki: VM = metrics (pure storage, Alloy scrapes),
  # VL = logs. Grafana + Dozzle + blackbox-exporter stay.
  - { name: victoria-metrics, template_dir: victoria-metrics, public: false, enabled: true }
  - { name: victoria-logs,    template_dir: victoria-logs,    public: false, enabled: true }
  - { name: grafana,        template_dir: grafana,    subdomain: stats, public: false, enabled: true, bind_owner_uid: "472", bind_dirs: ['data', 'provisioning'] }
  - { name: blackbox-exporter, template_dir: blackbox-exporter, public: false, enabled: true }
  - { name: dozzle,         template_dir: dozzle,        subdomain: logs, public: false, enabled: true }   # live per-container log viewer (logs.kogler.si)
  # Admin dashboards are TAILNET-ONLY. traefik-tailnet = the
  # tailnet Traefik edge + its tailscale sidecar (vps-obs, tag:sidecar) in ONE project
  # (compose v2 requires network_mode: service:X to be same-file). It serves
  # stats/traefik/logs/csui/auto (and *.ts.kogler.si twins) over headscale with
  # clean subdomain URLs — NO public records, NO port-number `tailscale serve`.
  # The auth key (tailscale-sidecar_api) is owner-seeded; the edge IP is pinned
  # to 172.20.0.250 (traefik_edge_ips in group_vars/all/main.yml) for header-trust.
  - { name: traefik-tailnet, template_dir: traefik-tailnet, public: false, enabled: true }
  # === Alert brain (WG-down -> net mail/Signal; independent of tunnel) ===
  # n8n INTERNAL-ONLY: the public auto.kogler.si route is not on the main edge
  # labels; it is served only by traefik-tailnet over the tailnet.
  # alert_homeserver_url / alert_room_id are the Matrix delivery recipient state
  # (docs/services-matrix.md §Alert room) — the opt-in `svc.*` shape `model_url` already uses, so the
  # n8n compose reads them with NO fallback: a missing key fails the render instead of quietly
  # pointing an alert at a room nobody reads. Non-secret: an id names a recipient and authorises
  # nothing; the SEND TOKEN is the vault item `matrix-alerts_api`, never a value here.
  - { name: n8n,            template_dir: n8n,       public: false, enabled: true, bind_owner_uid: "1000", bind_dirs: ['data'],
      alert_homeserver_url: "http://matrix:8008", alert_room_id: "!L3l9DNtfkCMvQHhYRSEa3st1DE5xJcb4wX78EmpKayo" }
  # === Backup agents (Kopia -> backup Box; db-backup dumps) ===
  - { name: kopia-server,   template_dir: kopia-server, public: false, enabled: true }
  - { name: db-backup,      template_dir: db-backup,    public: false, enabled: true }
  # === Matrix — public + federated (homeserver next to the public edge) ===
  - { name: matrix,         template_dir: matrix,    public: true, enabled: true }
  - { name: chat,           template_dir: element-web, subdomain: chat, public: true, enabled: true }
  # === Edge accessories (VPS residency) ===
  - { name: headscale,      template_dir: headscale, subdomain: vpn, public: true, enabled: true }  # public coordination (rev. network-vpn.md)
  # Metabase does not run here: the VPS is the RAM-constrained box and its revival target is
  # OLDSRV, so this list carries NO metabase entry — a registry entry is the switch that deploys,
  # and an absent one is what keeps a host from re-rendering a service it does not own. The two
  # Authentik artifacts that used to hang off such an entry (a `metabase` OIDC provider and the
  # `edge-sec` / `edge-metabase*` proxy providers + apps) are gone from the blueprints and from the
  # secret-egress table, so a blueprint apply asserts nothing for Metabase. The intentionally inert
  # vault item `metabase-forgejo_ro` stays untouched (docs/services-admin.md §Metabase).
  # CrowdSec Web UI (csui.kogler.si) — the ops analytics surface on this box.
  # INTERNAL-ONLY (NO public CNAME); Forward-Auth; LAPI watcher auth (crowdsec-webui_lapi_api).
  - { name: crowdsec-web-ui, template_dir: crowdsec-web-ui, subdomain: csui, public: false, enabled: true }
  - { name: pairdrop,       template_dir: pairdrop,  subdomain: drop, public: true, enabled: true }   # PUBLIC P2P share — dual-host pairdrop+drop, crowdsec-only tier, NO forward-auth
  - { name: stirling-pdf,   template_dir: stirling-pdf, subdomain: pdf, public: true, enabled: true }
  - { name: renovate,       template_dir: renovate,  public: false, enabled: true }  # co-located with Forgejo/GitOps; the platform comes from the compose env, not renovate.json; see docs/deployment-renovate.md
  # Navidrome (music.kogler.si) — music server on the VPS; library
  # on the Hetzner Storage Box (CIFS /mnt/storagebox/music, no host-port publish); music
  # lives OFF nas (hardlink→copy-import for music); INTERNAL-ONLY (no public record).
  - { name: navidrome,      template_dir: navidrome,  subdomain: music, public: false, enabled: true }
  # === RustDesk — family-support rendezvous (hbbs) + relay (hbbr) on the VPS ===
  # Placement: the VPS, never oldsrv (services-rejected.md). No subdomain and
  # `public: false` because it has NO Traefik route: it is `network_mode: host`, so no docker
  # network reaches it — its reach is the nftables allow of 21115/21116(tcp+udp)/21117 in
  # roles/vps-hardening (21118/21119 stay dropped: web client unused + X-Real-IP spoof risk).
  # `enabled` is gated on the keypair existing: the compose is FAIL-CLOSED on the `rustdesk_login`
  # vault item, so enabling before that item is seeded aborts EVERY VPS docker_services converge
  # (a missing 1P item takes the whole run with it), so the
  # `rustdesk_login` item must be seeded before this flips on. The manual-value write rules
  # (including the op-CLI field-shape trap that renders empty keys) are in
  # docs/deployment-secrets.md §Creation & Rotation Workflow item 7.
  # The five relay_* values are the bandwidth policy (the compose reads them as svc.* — the one
  # channel by which a group_vars value reaches a compose render without a validator mock).
  # Derivation + the quota they are bounded against: services-admin.md §Relay bandwidth cap.
  # Owner-confirmed caps (short sessions by design ⇒ quota pressure negligible):
  # TOTAL 48 / SINGLE 24 / LIMIT 8 Mb/s, no nftables shaping.
  - { name: rustdesk-server, template_dir: rustdesk-server, public: false, enabled: true,
      relay_single_mbps: 24, relay_total_mbps: 48, relay_limit_mbps: 8,
      relay_downgrade_threshold: "0.66", relay_downgrade_start_check_s: 1800 }

# docling-serve memory ceiling. String, not int — compose's schema.
# Measured basis in docs/services-ai.md §Operational facts measured on the way: rapidocr path peak
# 3.263 GiB sampled; a bench container capped at 7 GiB was OOM-killed twice while adding an EasyOCR
# converter. 6 GiB = ~1.8× the measured peak on a 16 GB VPS with NO swap, so a runaway converter is
# OOM-killed by its own cgroup instead of taking the host down.
docling_memory_limit: "6g"

# Tailnet sidecar opt-ins: render the `*-tailscale` Pattern-A sidecar only
# when these flags are true. dsh + pi-dev moved to oldsrv and
# their tailscale sidecars are REMOVED — the flags are permanently false on the
# VPS (the names are still served by the tailnet edge over WG). They stay so a
# re-enable has to be a deliberate edit and cannot happen by accident.
dsh_tailnet_sidecar_enabled: false
pi_dev_tailnet_sidecar_enabled: false

# Single cert issuer: THIS host is the only ACME (DNS-01) issuer for
# *.kogler.si — traefik runs the letsencrypt resolver + certs-dumper; every other host
# consumes the synced pair (role default false, see roles/docker_services/defaults).
traefik_acme_issuer: true

# Scoped virtual keys — SSOT consumed by BOTH the bootstrap-keys glue
# (roles/docker_services/templates/litellm-bootstrap-keys.sh.j2 mints each key into its
# vault item at converge) AND scripts/gate/check-vault-items.sh (the entry-record `*_item:`
# rule parses `vault_item:` from these records; items are glue-seeded => excluded from
# MISSING). One PHYSICAL line per record (closing brace ends the record).
# models: comma-separated LiteLLM model names (wildcards allowed); empty = all models.
# max_budget/budget_duration: LiteLLM budget semantics (USD per period); blank = uncapped.
# rpm: optional, LAST field — requests/minute, blank = uncapped.
#   A record carrying rpm without a code path for the field mints an UNCAPPED key and
#   looks green. Records without the field still render (default('', true)) — do not
#   "clean up" the six-field format back to five.
litellm_scoped_keys:
  - { alias: owui-public-chat, vault_item: owui-public-chat_api, models: "ollama/*,openrouter/*", max_budget: "20", budget_duration: "30d" }
  - { alias: owui-public-rag, vault_item: owui-public-rag_api, models: "ollama/bge-m3,ollama/bge-reranker-v2-m3", max_budget: "5", budget_duration: "30d" }  # rag key for Open WebUI; see the stale-model note below
    # ⚠ STALE NAMES: embed moves to the Vulkan `embed`
    # leg and rerank to the Vulkan `reranker` leg routed as LiteLLM `jina_ai/…`, so
    # `ollama/bge-reranker-v2-m3` names a model that no longer exists anywhere (it was never
    # the pulled name either — that was ollama/qllama/bge-reranker-v2-m3:q8_0). The allow-list
    # is NOT re-pointed here: model rows live in the LiteLLM DB (never git-rendered), these two
    # keys have no live consumer until rag-mcp is implemented, and the VPS instance does not
    # host the pinned-AI legs — lan-litellm does.
    # Re-point both records in the SAME change as the rag-mcp consumer wiring.
  - { alias: owui-int-wife, vault_item: owui-int-wife_api, models: "ollama/*,openrouter/*", max_budget: "40", budget_duration: "30d" }
  - { alias: owui-int-owner, vault_item: owui-int-owner_api, models: "", max_budget: "", budget_duration: "" }  # full access (models unset = all)
  # dsh + pi-harness live on the LAN instance:
  # dsh/pi-dev are served by lan-litellm (oldsrv), so their scoped keys live in the
  # LAN DB — the records render from group_vars/home_servers.yml (its own
  # `litellm_scoped_keys`). ⚠ "deleted server-side" must be re-listed, not asserted:
  # `/key/list` + `/key/info` on the VPS instance is the only evidence, and an alias
  # can be reported gone while still present with `last_used=None`. `pi-harness` is
  # deliberately left: its vault item still holds a value, so it is a parked key of a
  # parked consumer, not an orphan. The rc-4 ABORT
  # guard is real, and it is exactly why a cleared/DELETED vault item must never
  # share the spec list with a live alias: the glue would mint, LiteLLM would refuse the
  # duplicate alias, and the converge would go red for a key nobody consumes.
  # ⚠ Endpoint shape on the pin (v1.83.10): `POST /key/delete` wants `{"keys":[…]}` or
  # `{"key_aliases":[…]}` — the singular `key` is a 422, and `/key/info` 404s without `?key=`.
  - { alias: openclaw-litellm, vault_item: openclaw-litellm_api, models: "ollama/*,openrouter/*", max_budget: "30", budget_duration: "30d" }  # NOT openclaw_api — that name is TAKEN by the OpenClaw OIDC client (secret-egress glue PROVIDERS)
  - { alias: rag-int-svc, vault_item: rag-int-svc_api, models: "ollama/bge-m3,ollama/bge-reranker-v2-m3", max_budget: "5", budget_duration: "30d" }  # rag key for the internal RAG service; see the stale-model note on the record above

# Homepage HA-failover buttons: render the HA Forward Takeover /
# Reverse Failback cards in templates/homepage_services.yaml.j2 ONLY when true, so a tile is
# never dead. True asserts the trigger behind them exists: `ha-failover-api` active on oldsrv
# and the `ha-failover_api` vault item seeded (the card's lookup fails loud without the item).
# The cards are the same trigger as root's `/usr/local/sbin/ha-failover.sh`, reachable from the
# home network only — docs/smart-home-failover.md.
homepage_failover_button: true

# Pin homepage's IP on the traefik-public overlay (HOME launchpad). Must NEVER equal
# the VPS edge pin (traefik_edge_ip_pin: 172.20.0.2) — the bridge's sequential DHCP
# once handed homepage .2 and wedged the public edge's bind ("Address already in use"
# on traefik up). .5 is far above the sequential .3+ allocation and
# below the tailnet edge's .250 reserve (crowdsec_web_ui already took .5).
homepage_ip_net: "172.20.0.24"

# Homepage family-vs-technical split:
#   - homepage_show_technical (default true): render the "Domen · technical"
#     group (tailnet-only admin dashboards: stats/logs/csui/traefik/auto/
#     dsh/pi-dev/vpn). Grafana (stats) is Domen's dashboard — never a family tile.
#   - homepage_show_soon (default true): render the "Soon" roadmap group
#     (deploy-gated apps as non-clickable description tiles).
# Family groups (Photos/Files/Docs/Chat/Git/AI/Tools/Accounts) are always shown.
homepage_show_technical: true
homepage_show_soon: true

# Homepage tile/widget inputs — the endpoints the launchpad points at.
# Every value is the name the EDGE actually routes that service on today, so the
# dashboard cannot drift from the route tables (home `traefik-internal` on oldsrv +
# the VPS edge; docs/services.md §Service Accessibility). An empty value is the
# "no endpoint declared" state: the template then renders a non-clickable
# unconfigured tile, never a probe and never a roadmap tile.
#   media   → Jellyfin, home-edge `media-backend`
#   seerrng → SeerrNG (the deployed requests UI), home-edge `seerrng-backend`
#   foto    → Immich, VPS `immich-server`
# The legacy `seerr` router is routed but tiled nowhere: SeerrNG is the requests UI.
homepage_media_url: "https://media.{{ domain_local }}"
homepage_seerrng_url: "https://seerrng.{{ domain_local }}"
homepage_immich_url: "https://foto.{{ domain_local }}"

# Which of those the homepage container may PROBE (siteMonitor). It runs on the VPS
# in `traefik-public` and is NOT a tailnet node, so a name it cannot resolve renders a
# permanent dead dot. `media` is published in the public zone and answers here; the
# requests UI has no public record (LAN + tailnet name only), so it is linked, not probed.
homepage_media_probe: true
homepage_seerrng_probe: false
homepage_immich_probe: true

# The reachability widget list: public FQDNs only, same rule as above.
homepage_probe_hosts:
  - kogler.si
  - sso
  - foto
  - file
  - git
  - chat
  - bin
  - drop
  - office
  - pdf
  - vpn
  - media

# HA-exporter scrape job (Alloy `ha_exporter` block, topology B): OFF until the HA cutover.
# Nothing populates the bearer-token file yet (no vault item, no monitoring render)
# and ha_vip serves no HA - a live job would just fail. Flip true at the cutover with the HA
# long-lived-token item seeded, the Alloy compose mount added, and the token path matching that
# mount: Alloy has NO mount for the path this block reads, so enabling the gate alone yields a
# scrape that cannot see its own token (see the same-change rule in roles/monitoring/tasks).
# The gate is named for what it gates (Alloy's ha_exporter job), not for its backend; HA's
# endpoint is /api/prometheus.
alloy_ha_exporter: false

# Tailnet-only dashboards: the tailnet Traefik edge (traefik-tailnet)
# is served on the headscale sidecar node `vps-obs` (tag:sidecar). headscale
# `dns.extra_records` maps the clean subdomain names (stats/logs/csui/traefik/auto
# AND their *.ts.kogler.si twins) to this node's tailnet IPv4.
# Tailnet IPv4s are assigned SEQUENTIALLY by headscale at node join. This value is
# filled at deploy time from `headscale nodes list` after the sidecar joins (empty →
# headscale renders no extra_records).
# ⚠ Do NOT re-type a node map here (derived-values ban): a remembered
# `IP -> node` pair will eventually contradict live state, and the check is `ss` on the
# host plus `headscale nodes list`. Read the command output; never trust a remembered pair.
tailnet_sidecar_ip: "100.64.0.1"
# Pattern-A tailnet sidecar IPs (vps-dsh / vps-pi-dev): those sidecars are retired,
# dsh/pi-dev run on OLDSRV.
# These values are inert: the clean-URL DNS still
# resolves to the edge (tailnet_sidecar_ip), and the edge reaches the backends
# over WG to {{ oldsrv_home_ip }}:3080/:8080 (NOT via these sidecar IPs). They
# stay only so any dangling config that references them resolves; do NOT rely on
# them for routing.
tailnet_dsh_ip: "100.64.0.2"
tailnet_pi_dev_ip: "100.64.0.5"

# Subdomains served by the tailnet edge — the two lists headscale's `config.yaml.j2` renders into
# `dns.extra_records`. Both are ALIASES of the tailnet views of `zone_kogler_si`
# (group_vars/all/main.yml): a name joins or leaves one of them by editing that entry's `tailnet:`
# field, never here, because the same entry also decides the Technitium seed and the public set.
#   * `tailnet_subdomains` — the `edge` class, rendered as `name.kogler.si` AND its `.ts` twin.
#   * `tailnet_ts_only_subdomains` — the `node`/`dual` class, rendered as the `.ts` twin ONLY: a
#     tailnet address answering a PLAIN name client-side is the resolver-ambiguity trap, so a
#     tailnet-enabled phone standing at home keeps the LAN answer for `ha`, for the media family and
#     for the host name `spark` itself (docs/network-vpn.md §Tailnet boundary).
# An entry's tailnet answer is its `tailnet_ip:`, never its `ip:` — `ip:` is the LAN (Technitium)
# answer, a different address class. OMIT `tailnet_ip:` to take the class default:
# `tailnet_sidecar_ip` for `edge`, `tailnet_oldsrv_ip` for `node`/`dual`, which is why a `.ts` name is
# only as live as the node it points at. A written `tailnet_ip:` is a literal address and must equal
# the class default it stands in for; the parity fixture pins both spellings.
tailnet_subdomains: "{{ zone_kogler_si_tailnet_plain }}"
tailnet_ts_only_subdomains: "{{ zone_kogler_si_tailnet_ts }}"

# WG-S2S reach for the internal all-app edge.
# The internal edge (`traefik-tailnet`, container) listens on :443 in its bridge
# netns; host :443 belongs to the PUBLIC edge. The WG path therefore publishes the
# internal edge on a DEDICATED port bound to the wg-s2s VPS address only, via
# docker's compose `ports:` (host `{{ wg_s2s_vps.ip }}:{{ wg_internal_edge_port }}` ->
# container 172.20.0.250:443). Docker's own PREROUTING DNAT translates host->container,
# so NO manual nftables DNAT is required (the kopia-server :51515 precedent). An nftables
# input allow from the router peer is added
# for defense-in-depth + spec compliance. `wg_internal_edge_port` is SSOT'd in
# group_vars/all/main.yml (shared with the home `traefik-internal` edge templates on
# oldsrv): the traefik-tailnet compose, vps-hardening nftables and the
# network-vpn.md spec stay in lockstep (derived-values ban: never re-type).
# The internal-edge container IP on traefik-public (172.20.0.250, pinned).
wg_internal_edge_port: 4443
# The internal-edge container IP on traefik-public (172.20.0.250, pinned).
# Kept as a named SSOT var so the compose publish + nftables allow share one source
# of truth; the /32 is stripped for the compose/docker host-facing bind.
wg_internal_edge_target_ip: "{{ traefik_edge_ips | select('search', '172.20.0.250') | list | first | regex_replace('/32', '') }}"
