---
# VPS host configuration — netcup RS 2000 G12 (bought 2026-08-18, HD-93/HD-40B)
# Replaces the earlier planned Contabo Storage VPS 30. Plain Debian root server with
# Docker CE — the VPS is NOT a Proxmox node (no proxmox_bridges here, see home
# `proxmox` role / homelab_mode). Host identity facts live here; billing lives in
# `subscriptions.yml` (cost, renewal, status).

vps_host:
  provider: netcup
  model: RS 2000 G12
  purchased: 263.52           # EUR, 12 months prepaid (2026-08-18)
  monthly: 21.96              # EUR/mo effective
  valid_until: "2027-08-18"
  specs:
    cpu: "AMD EPYC 9645"
    cores: 8                 # dedicated
    ram_gb: 16               # DDR5 ECC
    disk_gb: 512             # NVMe SSD root
    max_local_block_storage_tb: 8   # expandable Local Block Storage add-on
    iface_gbit: 2.5          # flatrate traffic; throttled to 300 MBit/s if >3 TB rolling / 24 h
  # SSH connection facts (ansible_user, ansible_host) live in host_vars/vps.kogler.si.yml.

docker_services:
  # ORDERING CONSTRAINT (HD-146): `authentik` MUST appear before every native-OIDC consumer
  # (opencloud, immich-app, forgejo, open-webui, matrix, headscale…). The docker_services
  # role runs the secret-egress glue (HD-143) in an explicit pre-pass
  # (tasks/prepass-authentik.yml, HD-162) BEFORE the deploy loop, seeding 1Password
  # client creds that the consumers' compose `lookup()` reads at render time — so a consumer
  # rendered BEFORE authentik would get empty/placeholder OIDC creds (fail-loud, HD-65).
  # The pre-pass is gated on `authentik`'s presence, so `authentik` must stay in this list
  # (not removed or reorder-after an OIDC consumer).
  # Do not remove/reorder authentik after a native-OIDC service.
  # === Edge tier (self-contained public edge — HD-40A / HD-135) ===
  - { name: traefik,        template_dir: traefik,   enabled: true }
  - { name: crowdsec,       template_dir: crowdsec,  enabled: true }
  # Technitium DNS PRIMARY on the VPS (HD-299, 2026-09-03): always-on resolver for LAN
  # + tailnet; dedicated dns-servers overlay pinned to dns_primary_ip (172.25.0.2),
  # host :53 published. Web UI at dns.kogler.si (Forward-Auth) via the subdomain label.
  # oldsrv (secondary) + Pi (tertiary) keep the home-LAN failure-domain split.
  - { name: technitium,     template_dir: technitium, subdomain: dns, enabled: true }
  # db_role_sync (2026-08-23 incident): postgres images apply POSTGRES_PASSWORD ONLY at
  # first cluster init — a rotated 1Password db item re-renders compose envs but the persisted
  # cluster keeps the OLD role password (forgejo/renovate crash-loop precedent). Opt-in per
  # service: deploy-service.yml re-syncs the ROLE password from the same vault item post-up.
  - { name: authentik,      template_dir: authentik, subdomain: sso, enabled: true,
      db_role_sync: true, db_item: authentik_db, db_pg_container: authentik-postgres }  # + bundled pg/redis
  # Family launchpad at the public edge (HD-180/HD-183): kogler.si root + home alias via
  # the compose's Docker-provider labels; Forward-Auth consumer (not native OIDC), so it
  # may sit anywhere after authentik.
  - { name: homepage,       template_dir: homepage, subdomain: home, enabled: true }
  # === Public live-data apps + co-located DBs (NVMe) ===
  - { name: opencloud,      template_dir: opencloud, subdomain: file, enabled: true, bind_owner_uid: "{{ storage_uid }}", bind_dirs: ['config', 'data'] }  # + bundled db
  - { name: onlyoffice-docs, template_dir: onlyoffice-docs, subdomain: office, enabled: true,  # WOPI helper for opencloud (HD-166); NO auth surface
      db_role_sync: true, db_item: onlyoffice_db, db_pg_container: onlyoffice-postgres }       # rotation-drift guard. NOTE (HD-230): pg+redis moved to NAMED volumes — the old nested host binds under /srv/docker/onlyoffice-docs got chown-corrupted by DS init (uid 105 walk); no bind_owner_uid needed anymore.
  - { name: immich-app,     template_dir: immich-app, subdomain: foto, enabled: true,  # + pg/valkey; ML->oldsrv
      db_role_sync: true, db_item: immich_db, db_pg_container: immich-postgres }
  - { name: forgejo,        template_dir: forgejo,   subdomain: git, enabled: true,   # + bundled db
      db_role_sync: true, db_item: forgejo_db, db_pg_container: forgejo-db }
  # PUBLIC bin/shortener/QR (HD-112): crowdsec-only tier, native-OIDC dashboard,
  # guestbin dropzone seeded post-deploy (compose header = deploy-gate runbook).
  - { name: zipline,        template_dir: zipline,   subdomain: bin, enabled: true,
      db_role_sync: true, db_item: zipline_db, db_pg_container: zipline-db }
  # === AI stack (public/gateway tier — HD-100..104) ===
  - { name: litellm,        template_dir: litellm,   enabled: true,    # llm-backend -> oldsrv ollama over WG
      bootstrap_keys: true,
      db_role_sync: true, db_item: litellm_db, db_pg_container: litellm-db }
  - { name: qdrant, template_dir: qdrant, enabled: true }  # AI RAG hybrid vector store on db-internal (HD-267/268; replaces PGVector — not postgres, so NO db_role_sync/db_item/db_pg_container)
  - { name: docling,        template_dir: docling,   enabled: true }  # OCR (services-internal)
  - { name: open-webui,     template_dir: open-webui, subdomain: ai, enabled: true }
  # === AI dual coding harness (HD-268c): pi + DSH sharing services-internal, each
  # consuming a scoped LiteLLM key + a PR-only Forgejo key; propose via Forgejo PRs only. ===
  - { name: pi-dev,         template_dir: pi-dev,    enabled: true }  # pi coding-agent container (npm @earendil-works/pi-coding-agent)
  - { name: dsh,            template_dir: dsh,       enabled: true }  # DeepSeek Harness (runzhliu/image) — WebUI = Pattern-A tailnet (:3080)
  # === AI MCP stubs (HD-268b) — placeholders; do not yet deploy a runnable unit ===
  - { name: rag-mcp,        template_dir: rag-mcp,   enabled: false }  # TODO(impl) kapa-style hybrid reader (Qdrant→rerank→top5)
  - { name: forgejo-mcp,    template_dir: forgejo-mcp, enabled: false }  # TODO(impl) Forgejo OKF-wiki read/write bridge
  # bind_owner_uid/bind_dirs (Wave-2 triage 2026-08-22): Docker auto-created these host
  # bind dirs root-owned; the images run non-root (grafana=472, n8n/openclaw=1000 node)
  # and crashed with EACCES. deploy-service.yml pre-creates/chowns them (Class-A fix).
  - { name: openclaw,       template_dir: openclaw,  enabled: true, bind_owner_uid: "1000", bind_dirs: ['.', 'workspace', 'auth'] }
  # === Observability backend (VPS = reliable tier; VPS self-observes loopback, HD-135b) ===
  - { name: prometheus,     template_dir: prometheus, enabled: true }
  - { name: loki,           template_dir: loki,       enabled: true }
  - { name: grafana,        template_dir: grafana,    subdomain: stats, enabled: true, bind_owner_uid: "472", bind_dirs: ['data', 'provisioning'] }
  - { name: blackbox-exporter, template_dir: blackbox-exporter, enabled: true }
  - { name: dozzle,         template_dir: dozzle,        subdomain: logs, enabled: true }   # HD-135b: live per-container log viewer moved from oldsrv (logs.kogler.si)
  # HD-135b follow-up: admin dashboards are TAILNET-ONLY. traefik-tailnet = the
  # tailnet Traefik edge + its tailscale sidecar (vps-obs, tag:sidecar) in ONE project
  # (compose v2 requires network_mode: service:X to be same-file). It serves
  # stats/sec/traefik/logs/csui/auto (and *.ts.kogler.si twins) over headscale with
  # clean subdomain URLs — NO public records, NO port-number `tailscale serve`.
  # The auth key (tailscale-sidecar_api) is owner-seeded (2026-08-28); edge IP pinned
  # to 172.20.0.250 (traefik_edge_ips in group_vars/all/main.yml) for header-trust.
  - { name: traefik-tailnet, template_dir: traefik-tailnet, enabled: true }
  # === Alert brain (WG-down -> net mail/Signal; independent of tunnel) ===
  # n8n INTERNAL-ONLY (HD-135b follow-up): public auto.kogler.si route removed from
  # the main edge labels; served only by traefik-tailnet over the tailnet.
  - { name: n8n,            template_dir: n8n,       enabled: true, bind_owner_uid: "1000", bind_dirs: ['data'] }
  # === Backup agents (Kopia -> backup Box; db-backup dumps) ===
  - { name: kopia-server,   template_dir: kopia-server, enabled: true }
  - { name: db-backup,      template_dir: db-backup,    enabled: true }
  # === Matrix — public + federated (HD-46/47; homeserver next to the public edge) ===
  - { name: matrix,         template_dir: matrix,    enabled: true }
  - { name: chat,           template_dir: element-web, subdomain: chat, enabled: true }
  # === Edge accessories (moved from oldsrv — VPS residency, HD-135 deliberations) ===
  - { name: headscale,      template_dir: headscale, subdomain: vpn, enabled: true }  # public coordination (rev. network-vpn.md)
  - { name: metabase,       template_dir: metabase,  subdomain: sec, enabled: true,    # CrowdSec dashboard (sec.kogler.si); HD-242 read-only analytics role
      db_ro_sync: true, db_ro_item: metabase-forgejo_ro, db_pg_container: forgejo-db }
  # HD-272: CrowdSec Web UI (csui.kogler.si) — richer ops surface alongside Metabase.
  # INTERNAL-ONLY (NO public CNAME); Forward-Auth; LAPI watcher auth (crowdsec-webui_lapi_api).
  - { name: crowdsec-web-ui, template_dir: crowdsec-web-ui, subdomain: csui, enabled: true }
  - { name: pairdrop,       template_dir: pairdrop,  subdomain: drop, enabled: true }   # PUBLIC P2P share — dual-host pairdrop+drop, crowdsec-only tier, NO forward-auth (HD-230)
  - { name: stirling-pdf,   template_dir: stirling-pdf, subdomain: pdf, enabled: true }
  - { name: renovate,       template_dir: renovate,  enabled: true }  # co-located with Forgejo/GitOps. RE-ENABLED 2026-08-24 (task 5): domen/homelab not migrated yet, so RENOVATE_REPOSITORIES currently points at domen/test temporarily (template) — switch back to domen/homelab when that repo lands. Playbook run is OWNED by the other session; do NOT converge here.

# HD-268 tailnet sidecar opt-ins: render the `*-tailscale` Pattern-A sidecar only
# when these flags are true. Default false keeps the live compose byte-identical
# (the sidecars were authored + commented out 2026-08-27; HD-268 closes them now).
# DEPLOY-GATED (owner action) — to enable EITHER sidecar the owner must first:
#   1. Mint a headscale preauth key with the matching ACL tag (dsh / pi-dev) and
#      `reusable: true` — via the headscale container (or headplane UI).
#   2. Seed the 1Password vault item:
#        - `tailscale_dsh_api`   (API Credential; credential = the preauth key)
#        - `tailscale_pi_dev_api` (API Credential; credential = the preauth key)
#      These are NOT in provision-secrets.py CATALOG (preauth keys are minted by
#      headscale, not generated). They live in NOT_AUTO_ROTATABLE so `--rotate-all`
#      cannot clobber them. Re-mint + vault-edit + redeploy on rotation (rare).
#   3. Flip the matching flag below to `true`, commit, run the scoped converge:
#        bash scripts/ansible-run.sh vps.yml \
#          --tags docker_services -e docker_services_scope=dsh     # or pi-dev
#   4. Verify: `docker exec dsh-tailscale tailscale status` online; from a tailnet
#      client `curl https://vps-dsh:3080` (and `vps-pi-dev:8080`) lands on the UI.
# The ACL (policy.hujson) gates `tag:dsh` / `tag:pi-dev` to the family users only —
# the sidecars never expose the Web UIs to other tailnet nodes.
dsh_tailnet_sidecar_enabled: true
pi_dev_tailnet_sidecar_enabled: true

# Single cert issuer (HD-178/HD-181): THIS host is the only ACME (DNS-01) issuer for
# *.kogler.si — traefik runs the letsencrypt resolver + certs-dumper; every other host
# consumes the synced pair (role default false, see roles/docker_services/defaults).
traefik_acme_issuer: true

# Scoped virtual keys (HD-247) — SSOT consumed by BOTH the bootstrap-keys glue
# (roles/docker_services/templates/litellm-bootstrap-keys.sh.j2 mints each key into its
# vault item at converge) AND scripts/check-vault-items.sh (the entry-record `*_item:`
# rule parses `vault_item:` from these records; items are glue-seeded => excluded from
# MISSING). One PHYSICAL line per record (closing brace ends the record).
# models: comma-separated LiteLLM model names (wildcards allowed); empty = all models.
# max_budget/budget_duration: LiteLLM budget semantics (USD per period); blank = uncapped.
litellm_scoped_keys:
  - { alias: owui-public-chat, vault_item: owui-public-chat_api, models: "ollama/*,openrouter/*", max_budget: "20", budget_duration: "30d" }
  - { alias: owui-public-rag, vault_item: owui-public-rag_api, models: "cohere/embed-v4.0,cohere/rerank-v4.0-pro", max_budget: "5", budget_duration: "30d" }  # rerank included DEVIATION: HD-246 routes /rerank through this same key — embed-only would hard-break the decided RAG pipeline
  - { alias: owui-int-wife, vault_item: owui-int-wife_api, models: "ollama/*,openrouter/*", max_budget: "40", budget_duration: "30d" }
  - { alias: owui-int-owner, vault_item: owui-int-owner_api, models: "", max_budget: "", budget_duration: "" }  # full access (models unset = all)
  - { alias: dsh, vault_item: dsh_api, models: "ollama/*,openrouter/*", max_budget: "30", budget_duration: "30d" }
  - { alias: pi-harness, vault_item: pi-harness_openai_api, models: "ollama/*,openrouter/*", max_budget: "30", budget_duration: "30d" }  # HD-268 pi scoped LiteLLM key (dual harness): minted by the same HD-247 bootstrap glue
  - { alias: openclaw-litellm, vault_item: openclaw-litellm_api, models: "ollama/*,openrouter/*", max_budget: "30", budget_duration: "30d" }  # NOT openclaw_api — that name is TAKEN by the OpenClaw OIDC client (secret-egress glue PROVIDERS)
  - { alias: rag-int-svc, vault_item: rag-int-svc_api, models: "cohere/embed-v4.0,cohere/rerank-v4.0-pro", max_budget: "5", budget_duration: "30d" }

# Homepage HA-failover buttons (HD-17/HD-217): render the HA Forward Takeover /
# Reverse Failback cards in templates/homepage_services.yaml.j2 ONLY when true.
# Stays false until HD-17 goes live (Phase 4: ha-failover_api vault item seeded +
# HmIP-RFUSB stick moved at runbook time), then flips true.
homepage_failover_button: false

# Prometheus HA-exporter scrape job (prometheus.yml.j2): OFF until the Phase-4 HA cutover
# (HD-04). Today nothing can populate /etc/prometheus/ha_token (no vault item, no monitoring
# render) and ha_vip serves no HA yet - a live job would just fail. Flip true at HD-04 with
# the HA long-lived-token item seeded.
prometheus_ha_exporter: false

# HD-135b follow-up (tailnet-only dashboards): the tailnet Traefik edge (traefik-tailnet)
# is served on the headscale sidecar node `vps-obs` (tag:sidecar). headscale
# `dns.extra_records` maps the clean subdomain names (stats/logs/csui/sec/traefik/auto
# AND their *.ts.kogler.si twins) to this node's tailnet IPv4.
# Tailnet IPv4s are assigned SEQUENTIALLY by headscale at node join — current known
# nodes: 100.64.0.3 laptop, 100.64.0.4 phone. This value is filled at deploy time from
# `headscale nodes list` after the sidecar joins (empty → headscale renders no
# extra_records).
tailnet_sidecar_ip: "100.64.0.1"
# HD-268c (2026-08-29): Pattern-A tailnet sidecar IPs (vps-dsh / vps-pi-dev).
# These IPs are assigned SEQUENTIALLY by headscale at node join; the values
# below are the LIVE-observed tailnet IPv4s after the dsh + pi-dev sidecars
# joined the mesh. The deploy flow (per the existing `tailnet_sidecar_ip`
# comment above) is: read `headscale nodes list` after each sidecar joins,
# set the corresponding group_var, re-converge + restart headscale. Leave
# empty -> headscale renders no extra_records for that sidecar (fail-loud
# render guard in config.yaml.j2).
# HD-297 (2026-08-31): these sidecar IPs are NOT the DNS target for the clean
# URLs — the UI FQDNs must resolve to the traefik-tailnet EDGE (vps-obs,
# tailnet_sidecar_ip, 100.64.0.1) which terminates TLS (wildcard cert) +
# routes to the dsh/pi backends. The sidecar IPs serve plain HTTP (dsh:3080 /
# pi-dev:8080) ONLY — no TLS, no Host routing. Deploy-delta fixed 2026-08-31:
# tailnet_subdomains dsh/pi entries no longer pin `ip:` (defaults to the edge).
tailnet_dsh_ip: "100.64.0.2"
tailnet_pi_dev_ip: "100.64.0.5"

# Subdomains served by the tailnet edge (watched by headscale config.yaml.j2
# extra_records render). Each entry is `{name: <sub>, ip: <tailnet IPv4>}`.
# `ip` defaults to `tailnet_sidecar_ip` (the traefik-tailnet observability
# edge on `vps-obs`, 100.64.0.1) when omitted. HD-297 (2026-08-31): EVERY
# clean-URL FQDN (incl. dsh/pi) must resolve to this edge — it terminates TLS
# (wildcard cert) + Host-routes to the backends. Do NOT pin the Pattern-A
# sidecar IPs here: the sidecars only serve plain HTTP (:3080/:8080) with no
# TLS/Host-routing, so pointing the FQDN at them breaks the clean URLs.
#
# NOTE: the `ip` value is a LITERAL tailnet IPv4 (NOT a Jinja var reference).
# Ansible's group_vars loader treats YAML scalars as-is (no second Jinja pass);
# if `ip` were `{{ tailnet_sidecar_ip }}` it would render as the literal string
# `{{ tailnet_sidecar_ip }}` in the headscale config, NOT the variable's value.
# The deploy step MUST keep each per-sub IP in sync with the corresponding
# `tailnet_<svc>_ip` group_var; today every entry omits `ip` -> all resolve to
# tailnet_sidecar_ip = 100.64.0.1 (vps-obs edge).
# Keep in sync with traefik-tailnet dynamic/routes.yml (obs edge) +
# the sidecar compose templates (Pattern-A: dsh + pi-dev).
tailnet_subdomains:
  # --- traefik-tailnet observability edge (vps-obs, tailnet_sidecar_ip) ---
  - { name: stats }
  - { name: logs }
  - { name: csui }
  - { name: sec }
  - { name: traefik }
  - { name: auto }
  # --- Pattern-A UIs (HD-297): resolve to the edge (100.64.0.1), NOT the sidecars
  # (pi-dev named so it never collides with the Raspberry Pi device host pi.kogler.si) ---
  - { name: dsh }     # -> edge -> dsh-backend    http://dsh:3080
  - { name: pi-dev }  # -> edge -> pi-backend     http://pi-dev:8080
