---
# Switch (CRS328-24P-4S+) specific variables
# Port mapping derived from docs/assets/Rack.canvas and docs/network-vlans.md Port Type Reference
# 
# Physical port positions on the CRS328 is confirmed (hand edited) to match the Rack.canvas diagram.

# Trunk port to router (uplink)
switch_trunk_port: sfp-sfpplus1  # Port 1 on switch, carries all VLANs tagged

# Switch management VLAN (must match router mgmt VLAN)
# Management IP is derived from SSOT network_static_hosts in role defaults.
switch_mgmt_vlan: 99

# RouterOS device identity asserted before any api_modify (HD-161).
# Must match what crs328_initial.rsc.j2 sets at bootstrap: `/system identity set name=switch.kogler.si`.
# Set by group_vars so the assert is per-gear (HD-165); role defaults keep only a fail-loud '' guard.
routeros_expected_identity: "switch.kogler.si"

# Access ports per-device VLAN mapping
#
# Port Type Reference from docs/network-vlans.md:
# - APs → Access, VLAN 99, PoE
# - UPS → Access, VLAN 99 (management interface)
# - Family PC/laptop → Access, VLAN 10
# - NAS iLO → Access, VLAN 99
# - Raspberry Pi → Access, VLAN 10
# - Nintendo Switch/Shield → Access, VLAN 50 (Media)
# - Printer → Access, VLAN 10
# - SFP+ uplinks → Trunk, all VLANs tagged

switch_port_map:
  # AP ports (VLAN 99, Management) - PoE enabled
  # MAC addresses from network_static_hosts in group_vars/all.yml
  ap-spalnica:
    port: ether12
    vlan: 99
    poe: true
    mac: "C4:AD:34:42:F1:7D"
  ap-dnevna:
    port: ether11
    vlan: 99
    poe: true
    mac: "C4:AD:34:42:F0:B9"

  # UPS Management (VLAN 99) - no PoE
  ups:
    port: ether4
    vlan: 99
    poe: false
    mac: "00:20:85:C0:92:FA"

  # NAS eno1 (Home VLAN 10 per R-1 reconciliation)
  nas-eno1:
    port: ether10
    vlan: 10
    poe: false
    mac: "1C:98:EC:0E:0D:38"
  # NAS eno2
  nas-eno2:
    port: ether9 
    vlan: 10
    poe: false
    mac: "1C:98:EC:0E:0D:39"

  # Relolink camera (IoT VLAN 20) - PoE enabled
  reolink-camera:
    port: ether2
    vlan: 20
    poe: true
    mac: "EC:71:DB:5F:BC:C1"

  # Printer
  printer:
    port: ether6 
    vlan: 10
    poe: false
    mac: "74:BF:C0:CD:33:0B"

  # Nintendo Switch 2 (Media VLAN 50, D3) - no PoE
  nintendo-switch:
    port: ether14 
    vlan: 50
    poe: false
    mac: "E0:EF:BF:74:CE:07"

  # NVIDIA Shield (Media VLAN 50) - no PoE
  nvidia-shield:
    port: ether20 
    vlan: 50
    poe: false
    mac: "48:B0:2D:09:6F:90"

  # KNX IP (IoT VLAN 20) - no PoE
  knx-ip:
    port: ether21
    vlan: 20
    poe: false
    mac: "00:0A:B3:29:2C:9E"

  # KNX X1 (IoT VLAN 20) - no PoE
  knx-x1:
    port: ether22
    vlan: 20
    poe: false
    mac: "00:0A:B3:27:5F:8B"

# VLAN list — DERIVED VIEW of the SSOT `network_vlans` (group_vars/all.yml), HD-200:
# switch consumers use id + name only, so the full SSOT dicts pass through
# unchanged; no literal duplicate to drift (audit H2 / iac-changes §2).
switch_vlans: "{{ network_vlans }}"