---
# Network devices (router + switch) — shared connectivity/auth vars.
# Parent group of [router] and [switch] via inventory [network:children].

# Connectivity (VLAN 99) management IP — derived from SSOT.
# Single source of truth: group_vars/all/ -> network_static_hosts.
# No IP literals here; renumber by editing all.yml only.
ansible_host: "{{ (network_static_hosts
                  | selectattr('name', '==', inventory_hostname_short)
                  | selectattr('vlan', '==', 99)
                  | map(attribute='ip') | list | first) }}"

# The module runs on the CONTROLLER (both network playbooks are
# `connection: local`), so this interpreter is the one that must import
# `librouteros`: the playbook python — the venv scripts/ansible/bootstrap-runner.sh
# installs into — not the `/usr/bin/python3` the inventory's `[all:vars]` pins.
ansible_python_interpreter: "{{ ansible_playbook_python }}"
