---
# Home server configuration — Phase 1 (desktop) or Phase 2 (proxmox)
#
# === Phase 1: all services run on oldsrv ===
# Phase 2: public-facing services (traefik, crowdsec, authentik, opencloud,
# immich-app, forgejo, grafana, n8n, kopia-server, db-backup) move to VPS.
# Templates stay here; deployment target is controlled by group_vars.

homelab_mode: desktop          # 'desktop' for Phase 1, 'proxmox' for Phase 2
gpu_vendor: amd
ollama_keep_alive: 5m
# Home Assistant failover (docs/smart-home-failover.md)
ha_vip: 10.10.1.122            # shared VIP on Home VLAN; ha.kogler.si → VIP
ha_vip_cidr: 24
ha_standby_state: BACKUP       # standby node (oldsrv); primary (Pi) uses MASTER + higher priority
ha_standby_priority: 100
ha_sync_interval: 15           # minutes; Pi → standby config sync (LAN only)
ha_standby_path: /opt/home-assistant-standby
# subdomain (optional): overrides the auto-generated URL hostname.
# When omitted, the service name is used (e.g. traefik → traefik.kogler.si).
# Required for services whose subdomain ≠ name (e.g. grafana → stats.kogler.si).

docker_services:
  # Edge
  - { name: traefik,        template_dir: traefik }
  - { name: crowdsec,       template_dir: crowdsec }
  # Identity
  - { name: authentik,      template_dir: authentik }
  # Platform
  - { name: opencloud,      template_dir: opencloud }
  - { name: immich-app,     template_dir: immich-app }
  - { name: forgejo,        template_dir: forgejo }
  # AI
  - { name: ollama,          template_dir: ollama }
  - { name: immich-ml,       template_dir: immich-ml }
  # DNS (technitium primary on oldsrv; secondary on nas is separate group var)
  - { name: technitium,      template_dir: technitium, subdomain: dns, enabled: "{{ inventory_hostname == 'oldsrv.kogler.si' }}" }
  - { name: pihole,          template_dir: pihole,     subdomain: ad }
  # DNS secondary on nas — different failure domain (see network-dns.md)
  - { name: technitium-secondary, template_dir: technitium, instance: secondary, enabled: "{{ inventory_hostname == 'nas.kogler.si' }}" }
  # Smart home failover: standby HA + keepalived VIP on oldsrv (docs/smart-home-failover.md)
  - { name: home-assistant-standby, template_dir: home-assistant-standby, enabled: "{{ inventory_hostname == 'oldsrv.kogler.si' }}" }
  # VPN
  - { name: headscale,       template_dir: headscale }
  # Backup
  - { name: kopia-server,    template_dir: kopia-server }
  - { name: db-backup,       template_dir: db-backup }
  - { name: kopia-agent,     template_dir: kopia-agent }
  # Dashboard & Automation
  - { name: grafana,         template_dir: grafana,    subdomain: stats }
  - { name: n8n,             template_dir: n8n,         subdomain: auto }
  # Stream
  - { name: sunshine,        template_dir: sunshine,     enabled: "{{ homelab_mode == 'desktop' }}" }
  # TODO (create templates): homepage, renovate, doco-cd, prometheus, loki, blackbox-exporter, signal-cli-rest-api