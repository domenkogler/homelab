---
# Home server configuration — Phase 1 (desktop) or Phase 2 (proxmox)
#
# === Phase 1: all services run on oldsrv ===
# Phase 2: public-facing services (traefik, crowdsec, authentik, opencloud,
# immich-app, forgejo, grafana, n8n, kopia-server, db-backup) move to VPS.
# Templates stay here; deployment target is controlled by group_vars.

homelab_mode: desktop          # 'desktop' for Phase 1, 'proxmox' for Phase 2
gpu_vendor: amd
ollama_keep_alive: 5m

# AMD ROCm host userspace (roles/amd_rocm, docs/hardware-gpu.md)
# Official AMD repo, "latest" track — AMD publishes Ubuntu suites only (jammy/noble),
# so the noble suite is installed on Debian (decision: track latest). In-tree amdgpu
# driver + firmware-amd-graphics; no amdgpu-dkms. Flip to Debian-native ROCm blocks
# (rocm-opencl-icd/hipcc) by pointing amd_rocm_repo/amd_rocm_suite elsewhere.
amd_rocm_repo: https://repo.radeon.com/rocm/apt/latest
amd_rocm_suite: noble
amd_rocm_packages:
  - rocm-hip-sdk
  - rocm-opencl-sdk
  - rocminfo
# Home Assistant failover (docs/smart-home-failover.md)
# ha_vip / ha_vip_cidr are defined once in group_vars/all.yml (SSOT).
ha_standby_state: BACKUP       # standby node (oldsrv); primary (Pi) uses MASTER + higher priority
ha_standby_priority: 100
ha_failover_priority: 120       # failover keepalived (MASTER) must beat Pi primary (110)
# n8n webhook for ha-failover.sh notifications (event/status payload). Empty = skip
# notify (always journald-logged). Set once the n8n workflow exists (observability.md).
failover_notify_webhook: ""
# Failover trigger API (HD-17) — Homepage buttons call this endpoint on oldsrv.
# Shared trigger token comes from 1Password `ha-failover_api` (api → credential),
# looked up at render time in api.env + homepage services.yaml (fail-closed assert).
failover_api_port: 8266
failover_api_url: "http://{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}:{{ failover_api_port }}"
ha_sync_interval: 15           # minutes; Pi → standby config sync (LAN only)
ha_standby_path: /opt/home-assistant-standby
# Observability alerting (docs/observability.md) — Grafana alert email recipient.
# SMTP fail-safe contact point in the monitoring role (grafana-contactpoints.yml.j2).
# Decision HD-54 (Option B): dedicated transactional relay — SMTP2Go (mail.smtp2go.com:587).
# Credentials: grafana-smtp_login (Login) in 1Password — the address (domen@kogler.si)
# is the Grafana recipient; SMTP2Go authenticates with a separate SMTP username+password.
grafana_smtp_host: mail.smtp2go.com:587
grafana_alert_email: domen@kogler.si
# n8n alert webhook — Grafana contact point posts here (monitoring role).
# The n8n workflow 'homelab-alerts' on this route must exist before the first
# alert (created at n8n setup; URL is internal, traefik-public network).
grafana_alert_webhook_url: "http://n8n:5678/webhook/homelab-alerts"
# subdomain (optional): overrides the auto-generated URL hostname.
# When omitted, the service name is used (e.g. traefik → traefik.kogler.si).
# Required for services whose subdomain ≠ name (e.g. grafana → stats.kogler.si).

docker_services:
  # Edge
  - { name: traefik,        template_dir: traefik }
  - { name: crowdsec,       template_dir: crowdsec }
  # Identity
  - { name: authentik,      template_dir: authentik,      subdomain: sso }
  # Platform
  - { name: minio,          template_dir: minio }       # S3 for Immich originals (HD-131 D1)
  - { name: opencloud,      template_dir: opencloud,      subdomain: file }
  - { name: immich-app,     template_dir: immich-app,     subdomain: foto }
  - { name: forgejo,        template_dir: forgejo,        subdomain: git }
  # AI
  - { name: ollama,          template_dir: ollama }
  - { name: immich-ml,       template_dir: immich-ml }
  - { name: pgvector,        template_dir: pgvector }   # AI-stack RAG vector store (db-internal, HD-102)
  - { name: docling,         template_dir: docling }    # AI-stack OCR (CPU, services-internal, HD-103)
  - { name: litellm,         template_dir: litellm }    # AI-stack LLM spine (services-internal + llm-backend, HD-100)
  - { name: open-webui,      template_dir: open-webui,      subdomain: ai }   # AI-stack chat + RAG UI (public, HD-101)
  - { name: openclaw,        template_dir: openclaw }    # AI-stack agent/orchestration (internal, services-internal, HD-104)
  # DNS (technitium primary on oldsrv; secondary moved to the Pi — see group_vars/raspberry_pi.yml)
  - { name: technitium,      template_dir: technitium, subdomain: dns, enabled: "{{ inventory_hostname == 'oldsrv.kogler.si' }}" }
  - { name: pihole,          template_dir: pihole,     subdomain: ad }
  # Smart home failover: standby HA + RaspberryMatic + keepalived VIP on oldsrv (docs/smart-home-failover.md)
  # COLD by design — docker_services must NOT start them (exactly one active HA). The
  # home_assistant role renders their compose files + configs; ha-failover.sh starts
  # them on manual forward takeover (RMat → wait CCU → VIP → HA standby).
  - { name: raspberrymatic-standby, template_dir: raspberrymatic, instance: standby, enabled: false }
  - { name: home-assistant-standby, template_dir: home-assistant-standby, enabled: false }
  # VPN
  - { name: headscale,       template_dir: headscale,       subdomain: vpn }
  # Backup
  - { name: kopia-server,    template_dir: kopia-server }
  - { name: db-backup,       template_dir: db-backup }
  # Dashboard & Automation
  - { name: grafana,         template_dir: grafana,    subdomain: stats }
  - { name: n8n,             template_dir: n8n,         subdomain: auto }
  # Dashboard
  - { name: homepage,        template_dir: homepage,        subdomain: home }
  - { name: metabase,        template_dir: metabase, subdomain: sec }
  # Observability
  - { name: blackbox-exporter, template_dir: blackbox-exporter }
  - { name: loki,            template_dir: loki }
  - { name: prometheus,      template_dir: prometheus }
  - { name: signal-cli-rest-api, template_dir: signal-cli-rest-api }
  - { name: dozzle,       template_dir: dozzle,       subdomain: logs }
  # Stream
  - { name: sunshine,        template_dir: sunshine,     enabled: "{{ homelab_mode == 'desktop' }}" }
  # Messaging (Matrix) — native-only, public+federated, SSO -> Authentik (docs/services-matrix.md)
  - { name: matrix,         template_dir: matrix }
  - { name: chat,           template_dir: element-web, subdomain: chat }
  # Media / *arr stack — internal-only, docs/services.md (subdomains: media, seerr, sab, torrent)
  - { name: jellyfin,     template_dir: jellyfin,     subdomain: media }
  - { name: seerr,        template_dir: seerr }
  - { name: sonarr,       template_dir: sonarr }
  - { name: radarr,       template_dir: radarr }
  - { name: lidarr,       template_dir: lidarr }
  - { name: prowlarr,     template_dir: prowlarr }
  - { name: bazarr,       template_dir: bazarr }
  - { name: sabnzbd,      template_dir: sabnzbd,      subdomain: sab }
  - { name: qbittorrent,  template_dir: qbittorrent,  subdomain: torrent }   # + gluetun sidecar in template
  - { name: profilarr,    template_dir: profilarr }
  - { name: recyclarr,    template_dir: recyclarr }                          # scheduled worker, no UI
  # File share (P2P, internal-only) — PairDrop (docs/services.md, HD-113)
  - { name: pairdrop,     template_dir: pairdrop,     subdomain: pairdrop }
  # PDF toolkit (internal-only) — Stirling PDF (docs/services.md, HD-58)
  - { name: stirling-pdf, template_dir: stirling-pdf, subdomain: pdf }
  # Update
  - { name: renovate,        template_dir: renovate }
  # CD
  - { name: doco-cd,         template_dir: doco-cd }
