---
# Home server configuration — OLDSRV (bare-metal Debian + Docker, RX 7600, 48 GB RAM)
#
# === Service placement (HD-135 split, 2026-08-18) ===
# Old-srv keeps the GPU / LAN / storage-bound core (immich-ml, jellyfin,
# sunshine, media/*arr, DNS, ha-standby) + the thin Alloy collector (dozzle moved to VPS, HD-135b).
# The public edge + live-data apps + AI stack + observability backend + alert brain
# (n8n) + backup agents moved to the VPS (group_vars/vps.yml). See docs/services.md.

homelab_mode: desktop          # 'desktop' for Phase 1, 'proxmox' for Phase 2
gpu_vendor: amd
ollama_keep_alive: 5m

# HA container pin (HD-192/HD-39): the PRIMARY (Pi, raspberry_pi.yml) and the
# STANDBY (this host) MUST run the same version for clean manual failover. The
# standby compose renders ghcr.io/home-assistant/home-assistant:{{ home_assistant_version }}
# (standby.yml / home-assistant-standby template) — undefined here caused the
# standby render to fail on oldsrv (2026-09-08). Keep in sync with raspberry_pi.yml.
home_assistant_version: "2026.8.1"

# AMD ROCm host userspace (roles/amd_rocm, docs/hardware-gpu.md)
# HD-318 (2026-09-07): Ubuntu-noble AMD repo INCOMPATIBLE with Debian trixie
# (rocm-cmake/hipcc dep conflicts). External AMD repo REMOVED — Debian trixie ships
# rocm-opencl-icd/hipcc/rocminfo in main. Host userland = tooling/inspection only;
# GPU containers bundle their own ROCm (immich-ml; ollama disabled 2026-09-07).
amd_rocm_packages:
  - rocm-opencl-icd
  - rocminfo
# Home Assistant failover (docs/smart-home-failover.md)
# ha_vip / ha_vip_cidr are defined once in group_vars/all.yml (SSOT).
ha_standby_state: BACKUP       # standby node (oldsrv); primary (Pi) uses MASTER + higher priority
ha_standby_priority: 100
ha_failover_priority: 120       # failover keepalived (MASTER) must beat Pi primary (110)
# n8n webhook for ha-failover.sh notifications (event/status payload). Empty = skip
# notify (always journald-logged). Set once the n8n workflow exists (observability.md).
failover_notify_webhook: ""
# Failover trigger API (HD-17) — Homepage buttons call this endpoint on oldsrv.
# Shared trigger token comes from 1Password `ha-failover_api` (api → credential),
# looked up at render time in api.env + homepage services.yaml (fail-closed assert).
failover_api_port: 8266
failover_api_url: "http://{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}:{{ failover_api_port }}"
ha_sync_interval: 15           # minutes; Pi → standby config sync (LAN only)
ha_standby_path: /opt/home-assistant-standby
# Observability alerting (docs/observability.md) — Grafana alert email recipient.
# SMTP fail-safe contact point in the monitoring role (grafana-contactpoints.yml.j2).
# Decision HD-54 (Option B): dedicated transactional relay — SMTP2Go (mail-eu.smtp2go.com:2525).
# Credentials: smtp_login (Login) in 1Password — the address (domen@kogler.si)
# is the Grafana recipient; SMTP2Go authenticates with a separate SMTP username+password.
# Host/port derive from the SMTP2Go connection SSOT in group_vars/all.yml (smtp2go_*).
grafana_smtp_host: "{{ smtp2go_host }}:{{ smtp2go_port }}"
grafana_alert_email: domen@kogler.si
# n8n alert webhook — Grafana contact point posts here (monitoring role).
# The n8n workflow 'homelab-alerts' on this route must exist before the first
# alert (created at n8n setup; URL is internal, traefik-public network).
grafana_alert_webhook_url: "http://n8n:5678/webhook/homelab-alerts"
# PrivadoVPN WireGuard egress for the qbittorrent gluetun sidecar (HD-318c).
# SSOT for the NON-secret endpoint config of the VPN tunnel; gluetun runs the
# provider in `custom` WireGuard mode (gluetun dropped the native `privado`
# provider — HD-318c) so these values are supplied explicitly instead of via
# a `SERVER_COUNTRIES`/`privado` server pick. The client private key is the
# ONLY secret — it lives in 1Password `privado-vpn_api` (field `credential`)
# and is looked up at render time by the docker_services role (never a literal).
# Source of the values: the PrivadoVPN WireGuard config handed over by the owner.
# Spec: docs/services-downloads.md §VPN & Ingress.
privado_vpn_endpoint_ip: 91.148.247.8      # [Peer] Endpoint host (gluetun custom requires an IP, no DNS)
privado_vpn_endpoint_port: 51820            # [Peer] Endpoint :port
privado_vpn_public_key: "KgTUh3KLijVluDvNpzDCJJfrJ7EyLzYLmdHCksG4sRg="   # [Peer] server public key
privado_vpn_address: 100.64.18.145          # [Interface] client tunnel address
privado_vpn_cidr: 32                         # [Interface] Address prefix (WG /32)
# [Interface] DNS Privado hands out (198.18.0.1/2). NOTE: gluetun runs its own
# internal DNS resolver by default and does NOT consume provider-assigned DNS;
# recorded here for the docs/owner reference, not rendered into gluetun.
# [Peer] AllowedIPs is 0.0.0.0/0 (full tunnel) — gluetun custom defaults to full
# egress through the tunnel; not rendered as a separate env.

# subdomain (optional): overrides the auto-generated URL hostname.
# When omitted, the service name is used (e.g. traefik → traefik.kogler.si).
# Required for services whose subdomain ≠ name (e.g. grafana → stats.kogler.si).

# --- Homelable (HD-45, re-scoped 2026-09-09): network/rack topology visualizer ---
# Internal-only dashboard on OLDSRV (Home VLAN 10). Scanner target ranges + knobs;
# the compose template (docker_services/homelable/) renders these into the backend env.
# `homelable_scanner_ranges_json` = the VLAN subnets the nmap discovery sweeps (site
# SSOT, network_ranges above), as a JSON-array STRING (Homelable reads SCANNER_RANGES as
# a JSON env var — the compose env value is a string; keep it JSON-quoted). Keep scans
# scoped to the LAN the owner curates; do NOT scan the modem-LAN / WAN. The owner approves
# discovered devices into the canvas (Homelable Pending-Devices queue) — never auto-adds.
homelable_scanner_ranges_json: '["10.10.1.0/24","10.10.20.0/24","10.10.30.0/24","10.10.40.0/24","10.10.50.0/24","10.10.99.0/24"]'
# Live healthcheck poll interval (seconds) Homelable uses for every node's check method.
homelable_status_checker_interval: 60
# Optional deep-scan JSON port list (SCANNER_HTTP_RANGES, service-ID probes). Empty = off.
# Only enable when a custom-port device is missed (e.g. '["9000-9100"]').
homelable_deep_scan_ranges_json: ''
# MCP sub-container (AI-tool topology read/write). OFF by default — the canvas is
# curated first; turn on after the topology is populated + the owner approves AI write
# (needs the homelable_mcp 1P item + a tailnet Pattern-A route for remote AI clients).
homelable_mcp_enabled: false

docker_services:
  # === This is OLDSRV — GPU / LAN / storage-bound services only (HD-135 split). ===
  # Public edge + live-data apps + observability backend + alert brain + backup agents
  # moved to the VPS (group_vars/vps.yml). old-srv keeps the hardware-bound core + the
  # thin Alloy collector (monitoring role) that forwards home telemetry to the VPS
  # Prometheus/Loki over the wg-vps-services tunnel.

  # --- Compute / GPU backend (cannot leave the GPU box) ---
  # ollama: DISABLED (owner 2026-09-07) — inference consolidated on spark/Triton
  # (docs/services-ai.md row 23). Role + template kept; only the deploy entry is off.
  - { name: ollama,          template_dir: ollama, enabled: false }
  - { name: immich-ml,       template_dir: immich-ml }   # ML offload for immich-app on VPS (over WG)

  # --- DNS (HD-299, VPS-primary 2026-09-03): oldsrv is now the SECONDARY resolver ---
  #   PRIMARY = VPS (group_vars/vps.yml), SECONDARY = oldsrv (this entry, instance:
  #   secondary, no web-UI labels — the dns.kogler.si UI lives on the VPS primary),
  #   TERTIARY = Pi (raspberry_pi.yml). LAN DHCP chain + router rules + tailnet
  #   headscale nameservers all list VPS-primary first (see docs/network-dns.md).
  - { name: technitium,      template_dir: technitium, instance: secondary, enabled: "{{ inventory_hostname == 'oldsrv.kogler.si' }}" }
  - { name: pihole,          template_dir: pihole,     subdomain: ad }

  # --- Smart home failover: standby HA + keepalived VIP on oldsrv ---
  # COLD by design — docker_services must NOT start them (exactly one active HA). The
  # home_assistant role renders their compose files + configs; ha-failover.sh starts
  # home-assistant-standby on manual forward takeover.
  - { name: home-assistant-standby, template_dir: home-assistant-standby, enabled: false }

  # --- Observability: per-host log viewer (docker.sock = oldsrv containers) ---
  # NOTE: the central backend (prometheus/loki/grafana) is on the VPS; Alloy (host,
  # monitoring role) forwards oldsrv metrics/logs over the wg-vps-services tunnel.
  # HD-135b (2026-08-28): dozzle MOVED to the VPS (group_vars/vps.yml) so log viewing
  # is independent of the home hosts; this entry stays as a disabled tombstone (the
  # docker_services teardown loop removes any leftover oldsrv dozzle stack).
  - { name: dozzle,          template_dir: dozzle, subdomain: logs, enabled: false }
  - { name: signal-cli-rest-api, template_dir: signal-cli-rest-api }   # Signal gateway (n8n on VPS reaches here over WG)

  # --- Stream ---
  - { name: sunshine,        template_dir: sunshine, enabled: "{{ homelab_mode == 'desktop' }}" }

  # --- Media / *arr stack — internal-only, documents/services.md ---
  - { name: jellyfin,     template_dir: jellyfin,     subdomain: media }
  - { name: seerr,        template_dir: seerr, bind_owner_uid: 1000, bind_dirs: ['config'] }   # HD-318: Docker auto-creates /srv/docker/seerr/config as root; container runs uid 1000 → crash-loop without bind-owner + bind_dirs (the dir must be pre-created 1000-owned)
  - { name: sonarr,       template_dir: sonarr }
  - { name: radarr,       template_dir: radarr }
  - { name: lidarr,       template_dir: lidarr }
  - { name: prowlarr,     template_dir: prowlarr }
  - { name: bazarr,       template_dir: bazarr }
  - { name: sabnzbd,      template_dir: sabnzbd,      subdomain: sab }
  - { name: qbittorrent,  template_dir: qbittorrent,  subdomain: torrent }   # + gluetun sidecar in template
  - { name: profilarr,    template_dir: profilarr }
  - { name: recyclarr,    template_dir: recyclarr }                          # scheduled worker, no UI

  # --- Finance: Actual Budget (HD-57, decision 2026-08-24) — internal-only P+I;
  #     stable pin + n8n EB bridge (docs/services-finance.md). API leg :5006 published
  #     on oldsrv_home_ip for n8n over WG (immich-ml precedent).
  - { name: actual-budget,   template_dir: actual-budget, bind_owner_uid: 1001, bind_dirs: ['data'] }   # HD-318: the image's data dir is /data owned by `actual` (uid 1001); bind_owner_uid + bind_dirs pre-create /srv/docker/actual-budget/data 1001-owned so the migration's uid-1001 mkdir succeeds

  # --- Backup: off-site agent (HD-191) — client of kopia-server on the VPS ---
  # Snapshots oldsrv-LOCAL state (configs, dumps scratch, thumbs, signal state) to
  # the Hetzner backup Box via kopia-server over the WG S2S tunnel. Never reads NAS
  # mounts (backup.md invariant). Scheduled worker, no UI.
  - { name: kopia-agent,    template_dir: kopia-agent }

  # --- Observability AI-debugging MCP servers (HD-344) — oldsrv (≈600–700 MB RAM each) ---
  # Front-ends to the VPS Victoria backends (VM :8428 / VL :9428) over wg-s2s
  # (victoria_backend_host). Tailnet/LAN-only, never public. ⏳ deploy-gated: oldsrv
  # is Phase-3/HD-318 + needs the VPS Victoria backend live (HD-342). See docs/observability.md.
  - { name: mcp-victoriametrics, template_dir: mcp-victoriametrics, public: false, enabled: false }
  - { name: mcp-victorialogs,    template_dir: mcp-victorialogs,    public: false, enabled: false }

  # --- Homelable (HD-45, re-scoped 2026-09-09): network/topology visualizer on oldsrv ---
  # Self-hosted network + rack topology canvas, nmap discovery, live healthchecks + MCP
  # (Pouzor/homelable, MIT). Internal-only dashboard — NEVER public/WAN. Access via the
  # Home-VLAN (direct IP or a future local edge) and the tailnet; there is NO home-host
  # Traefik edge (HD-331), and the VPS traefik-tailnet edge cannot reach back into the
  # home LAN. ⏳ deploy-gated: owner sign-off + secrets seeded (docs/services-admin.md
  # §Homelable). MCP sub-container is optional (homelable_mcp_enabled) — off by default.
  - { name: homelable, template_dir: homelable, public: false, enabled: false }

  # --- Services MOVED to the VPS (group_vars/vps.yml) — not deployed on oldsrv ---
  # opencloud/immich-app/forgejo/litellm/qdrant/docling/open-webui/openclaw,
  # prometheus/loki/grafana/blackbox-exporter (backend on VPS), n8n, kopia-server,
  # db-backup, matrix, chat, headscale, metabase, pairdrop, stirling-pdf, renovate,
  # homepage (HD-180/HD-183 — family launchpad at the public edge).
  # MinIO REMOVED (2026-08-18, HD-135): Immich originals = live Hetzner Box (CIFS), not S3.
