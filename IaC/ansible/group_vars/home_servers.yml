---
# Home server configuration — OLDSRV (bare-metal Debian + Docker, RX 7600, 48 GB RAM)
#
# === Service placement (HD-135 split, 2026-08-18) ===
# Old-srv keeps the GPU / LAN / storage-bound core (immich-ml, jellyfin,
# sunshine, media/*arr, DNS, ha-standby) + the thin Alloy collector (dozzle moved to VPS, HD-135b).
# The public edge + live-data apps + AI stack + the observability backend
# (VictoriaMetrics + VictoriaLogs + Grafana — HD-342 replaced the Prometheus/Loki pair) +
# the alert brain (n8n) + backup agents moved to the VPS (group_vars/vps.yml). See docs/services.md.

# Reachability (HD-397, decided 2026-09-19): oldsrv sits behind the home NAT, so a runner
# that is not LAN-attached reaches it ONLY via the VPS jump. The jump therefore travels IN
# THE INVENTORY (group var = every play sees it: home_servers.yml, all.yml, dns-seed.yml,
# nut-deploy.yml, monitoring) instead of a per-command flag or one laptop's ssh alias —
# same doctrine as playbooks/spark.yml ("keep it here so ANY runner converges spark").
# From a LAN-attached runner it is a harmless no-op. The leg is the HOME leg (VLAN 10,
# host_vars ansible_host): the Mgmt plane is sealed from the tunnel on purpose (HD-398 →
# decision A). Matrix + the laptop alias contract: docs/network-vpn.md §Reaching LAN nodes
# when away. (Measured 2026-09-19: because this var is passed on the ssh command line, no
# `Host <ip>` block is needed for a converge — the per-IP blocks in the contract are for
# scp/rsync/git and for humans who type an address.)
ansible_ssh_common_args: "-o ProxyJump=vps"

homelab_mode: desktop          # 'desktop' for Phase 1, 'proxmox' for Phase 2
# HD-442 (2026-09-23): oldsrv runs `op`-calling glue (bootstrap_keys pre-pass,
# key provisioning) and must therefore hold the CURRENT write-scoped 1Password token.
# The Authentik pre-pass that deploys it never runs here (no `authentik` entry), so
# without this flag the box keeps whatever copy it happened to get — and the copy it had
# was a retired service account (403 Service Account Deleted) while the VPS copy of the
# SAME item probed green. See roles/docker_services/tasks/op-provision-token.yml.
docker_services_op_provision_token: true
gpu_vendor: amd
ollama_keep_alive: 5m

# HA container pin (HD-192/HD-39): the PRIMARY (Pi, raspberry_pi.yml) and the
# STANDBY (this host) MUST run the same version for clean manual failover. The
# standby compose renders ghcr.io/home-assistant/home-assistant:{{ home_assistant_version }}
# (standby.yml / home-assistant-standby template) — undefined here caused the
# standby render to fail on oldsrv (2026-09-08). Keep in sync with raspberry_pi.yml.
home_assistant_version: "2026.8.1"

# AMD ROCm host userspace (roles/amd_rocm, docs/hardware-gpu.md)
# HD-318 (2026-09-07): Ubuntu-noble AMD repo INCOMPATIBLE with Debian trixie
# (rocm-cmake/hipcc dep conflicts). External AMD repo REMOVED — Debian trixie ships
# rocm-opencl-icd/hipcc/rocminfo in main. Host userland = tooling/inspection only;
# GPU containers bundle their own ROCm (immich-ml; ollama disabled 2026-09-07).
amd_rocm_packages:
  - rocm-opencl-icd
  - rocminfo
# Home Assistant failover (docs/smart-home-failover.md)
# ha_vip / ha_vip_cidr are defined once in group_vars/all.yml (SSOT).
ha_standby_state: BACKUP       # standby node (oldsrv); primary (Pi) uses MASTER + higher priority
ha_standby_priority: 100
ha_failover_priority: 120       # failover keepalived (MASTER) must beat Pi primary (110)
# n8n webhook for ha-failover.sh notifications (event/status payload). Empty = skip
# notify (always journald-logged). Set once the n8n workflow exists (observability.md).
failover_notify_webhook: ""
# Failover trigger API (HD-17) — Homepage buttons call this endpoint on oldsrv.
# Shared trigger token comes from 1Password `ha-failover_api` (api → credential),
# looked up at render time in api.env + homepage services.yaml (fail-closed assert).
failover_api_port: 8266
failover_api_url: "http://{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}:{{ failover_api_port }}"
ha_sync_interval: 15           # minutes; Pi → standby config sync (LAN only)
ha_standby_path: /opt/home-assistant-standby
# Observability alerting (docs/observability.md) — Grafana alert email recipient.
# SMTP fail-safe contact point in the monitoring role (grafana-contactpoints.yml.j2).
# Decision HD-54 (Option B): dedicated transactional relay — SMTP2Go (mail-eu.smtp2go.com:2525).
# Credentials: smtp_login (Login) in 1Password — the address (domen@kogler.si)
# is the Grafana recipient; SMTP2Go authenticates with a separate SMTP username+password.
# Host/port derive from the SMTP2Go connection SSOT in group_vars/all.yml (smtp2go_*).
grafana_smtp_host: "{{ smtp2go_host }}:{{ smtp2go_port }}"
grafana_alert_email: domen@kogler.si
# n8n alert webhook — Grafana contact point posts here (monitoring role).
# The n8n workflow 'homelab-alerts' on this route must exist before the first
# alert (created at n8n setup; URL is internal, traefik-public network).
grafana_alert_webhook_url: "http://n8n:5678/webhook/homelab-alerts"
# PrivadoVPN WireGuard egress for the qbittorrent gluetun sidecar (HD-318c).
# SSOT for the NON-secret endpoint config of the VPN tunnel; gluetun runs the
# provider in `custom` WireGuard mode (gluetun dropped the native `privado`
# provider — HD-318c) so these values are supplied explicitly instead of via
# a `SERVER_COUNTRIES`/`privado` server pick. The client private key is the
# ONLY secret — it lives in 1Password `privado-vpn_api` (field `credential`)
# and is looked up at render time by the docker_services role (never a literal).
# Source of the values: the PrivadoVPN WireGuard config handed over by the owner.
# Spec: docs/services-downloads.md §VPN & Ingress.
privado_vpn_endpoint_ip: 91.148.247.8      # [Peer] Endpoint host (gluetun custom requires an IP, no DNS)
privado_vpn_endpoint_port: 51820            # [Peer] Endpoint :port
privado_vpn_public_key: "KgTUh3KLijVluDvNpzDCJJfrJ7EyLzYLmdHCksG4sRg="   # [Peer] server public key
privado_vpn_address: 100.64.18.145          # [Interface] client tunnel address
privado_vpn_cidr: 32                         # [Interface] Address prefix (WG /32)
# [Interface] DNS Privado hands out (198.18.0.1/2). NOTE: gluetun runs its own
# internal DNS resolver by default and does NOT consume provider-assigned DNS;
# recorded here for the docs/owner reference, not rendered into gluetun.
# [Peer] AllowedIPs is 0.0.0.0/0 (full tunnel) — gluetun custom defaults to full
# egress through the tunnel; not rendered as a separate env.

# subdomain (optional): overrides the auto-generated URL hostname.
# When omitted, the service name is used (e.g. traefik → traefik.kogler.si).
# Required for services whose subdomain ≠ name (e.g. grafana → stats.kogler.si).

# --- Homelable (HD-45, re-scoped 2026-09-09): network/rack topology visualizer ---
# Internal-only dashboard on OLDSRV (Home VLAN 10). Scanner target ranges + knobs;
# the compose template (docker_services/homelable/) renders these into the backend env.
# `homelable_scanner_ranges_json` = the VLAN subnets the nmap discovery sweeps (site
# SSOT, network_ranges above), as a JSON-array STRING (Homelable reads SCANNER_RANGES as
# a JSON env var — the compose env value is a string; keep it JSON-quoted). Keep scans
# scoped to the LAN the owner curates; do NOT scan the modem-LAN / WAN. The owner approves
# discovered devices into the canvas (Homelable Pending-Devices queue) — never auto-adds.
homelable_scanner_ranges_json: '["10.10.1.0/24","10.10.20.0/24","10.10.30.0/24","10.10.40.0/24","10.10.50.0/24","10.10.99.0/24"]'
# Live healthcheck poll interval (seconds) Homelable uses for every node's check method.
homelable_status_checker_interval: 60
# Optional deep-scan JSON port list (SCANNER_HTTP_RANGES, service-ID probes). Empty = off.
# Only enable when a custom-port device is missed (e.g. '["9000-9100"]').
homelable_deep_scan_ranges_json: ''
# MCP sub-container (AI-tool topology read/write). OFF by default — the canvas is
# curated first; turn on after the topology is populated + the owner approves AI write
# (needs the homelable_mcp 1P item + a tailnet Pattern-A route for remote AI clients).
homelable_mcp_enabled: false

# --- Pinned-AI tier on the RX 7600 (HD-391, decision #27: ggml/Vulkan) ---
# Ports are INTERNAL to the `llm-backend` bridge — none of these legs is published on the
# host (HD-59: the APIs have no auth, so the network is the boundary). They exist so a
# consumer URL is stable and greppable.
# Memory caps are HARD CAPS in the spark-dcgm doctrine (HD-379): measured peak, then
# headroom, so a leak in one leg can never eat the card the whole tier shares with
# immich-ML (3-5 GB during a job) and Jellyfin/Sunshine.
# Plan of record + every measured number: docs/services-ai.md §3a.
ai_tier_whisper_port: 9000
ai_tier_whisper_memory_limit: "4g"      # fp16 GGML = 1.51 GiB + Vulkan buffers; the binary's
                                        # native CPU-fallback path (RSS 1.59 GiB measured) must
                                        # still fit under its own cap
ai_tier_reranker_port: 9001
ai_tier_reranker_memory_limit: "1g"     # measured host RSS 157 MiB + 606 MiB Q8_0 weights
ai_tier_embed_port: 9002
ai_tier_embed_memory_limit: "1g"        # same shape as the reranker leg
# Context window for BOTH GGUF legs. llama.cpp truncates SILENTLY beyond it and
# llama-server's own default is 512 - which would slice a real ingest chunk in half. The RAG
# ingest spec is token-based 512/64 (docs/services-ai.md §5b), so 2048 = that spec with 4x
# headroom (bge-m3 supports 8192; paying KV memory for chunks that do not exist yet buys
# nothing). Re-derive when rag-mcp (HD-268b) goes live and a real chunk size is measurable.
ai_tier_gguf_ctx_size: 2048
# Physical batch/ubatch size (HD-391, measured live 2026-09-19): ctx-size alone is NOT enough.
# The embedding endpoint rejects an input larger than the **ubatch**, and llama-server's error
# message calls it "batch size" - which is why the first fix attempt (batch 2048, ubatch 512)
# still answered HTTP 500 "input (842 tokens) is too large to process (current batch size: 512)",
# because 512 was the Ubatch. So ubatch = batch = ctx: a 512-token ingest chunk plus its special
# tokens must fit in one ubatch pass. VRAM consequence measured below (compute buffers scale with
# ubatch, not with ctx) - see docs/services-ai.md §3a-1 for the before/after numbers.
ai_tier_gguf_batch_size: 2048
ai_tier_gguf_ubatch_size: 2048

docker_services:
  # === This is OLDSRV — GPU / LAN / storage-bound services only (HD-135 split). ===
  # Public edge + live-data apps + observability backend + alert brain + backup agents
  # moved to the VPS (group_vars/vps.yml). old-srv keeps the hardware-bound core + the
  # thin Alloy collector (monitoring role) that forwards home telemetry to the VPS
  # Victoria backend (VictoriaMetrics + VictoriaLogs, HD-342) over the wg-vps-services tunnel.

  # --- Compute / GPU backend (cannot leave the GPU box) ---
  # ollama: RE-ARMED 2026-09-15 (decision #24) as the RX 7600 pinned-services tier, and
  # DEMOTED by decision #27 (2026-09-18) to the EMBED FALLBACK RUNG: STT + rerank left
  # Ollama entirely (no ROCm whisper.cpp artifact; no /api/rerank at ANY released version),
  # and embed moves to the Vulkan `embed` leg below. It stays `enabled: true` until the
  # Vulkan embed leg is LIVE-VERIFIED, then it is demoted further (not deleted) — its
  # LiteLLM row stays in the catalog as the documented fallback for the same 1024-dim space.
  # The `:rocm` image remains the proven RDNA3 ROCm path (verified 2026-08-21).
  # docs/services-ai.md §3a + §9 #24/#25/#27 · docs/hardware-gpu.md.
  # ⚠ DO NOT flip this back to `enabled: false` while the voice pipeline or the LiteLLM
  # embed row still depends on it: the retire-ollama step is gated on the Vulkan embed leg
  # being LIVE-VERIFIED (docs/services-ai.md §3a), which is HD-391's last checkbox, not its
  # first.
  - { name: ollama,          template_dir: ollama, enabled: true }

  # --- Pinned-AI tier: ggml/Vulkan on the RX 7600 (HD-391, decision #27 ACCEPTED 2026-09-18) ---
  # Three legs, two images, ONE engine family. Digest-pinned in group_vars/all/versions.yml
  # (`main-vulkan` / `server-vulkan` are mutable aliases - CONVENTIONS §7). All three mount
  # ONLY the dGPU render node (no /dev/kfd: no ROCm userspace in this tier at all) and sit on
  # `llm-backend` with no publish. Measured tier cost: ~2.4 GiB of 8 GiB VRAM, ~0.5 GiB host
  # RSS. Model artifacts are sha256-verified by the generic model-fetch task in
  # roles/docker_services/tasks/deploy-service.yml (svc.model_* opt-in, HD-391) and land on
  # the nvme/models dataset (regenerable, never backed up).
  # STT: whisper.cpp whisper-server, `--inference-path /v1/audio/transcriptions` (OpenAI-shaped
  # natively, no wrapper). fp16 large-v3-turbo; q5_0 is the pre-approved -1.0 GiB relief rung
  # (whisper_cpp_model_q5_sha256).
  - { name: whisper,         template_dir: whisper, enabled: true,
      model_url: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin",
      model_dir: /srv/models/whisper, model_file: ggml-large-v3-turbo.bin,
      model_sha256: "{{ whisper_cpp_model_sha256 }}" }
  # Rerank: llama.cpp cross-encoder (`--pooling rank --rerank`), routed as LiteLLM `jina_ai/`.
  # ⚠ SHIPPED DORMANT - its consumer rag-mcp is still the HD-268b stub; verified by a LiteLLM
  # probe + a synthetic consumer, not by live RAG traffic (docs/services-ai.md §3a).
  - { name: reranker,        template_dir: reranker, enabled: true,
      model_url: "https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf",
      model_dir: /srv/models/reranker, model_file: bge-reranker-v2-m3-Q8_0.gguf,
      model_sha256: "{{ reranker_model_sha256 }}" }
  # Embed: llama.cpp bge-m3 Q8_0, 1024-dim unchanged (cosine 0.9996 vs the live Ollama vectors
  # => routing, NOT a corpus migration; HD-268's re-index is not triggered).
  - { name: embed,           template_dir: embed, enabled: true,
      model_url: "https://huggingface.co/ggml-org/bge-m3-Q8_0-GGUF/resolve/main/bge-m3-q8_0.gguf",
      model_dir: /srv/models/embed, model_file: bge-m3-q8_0.gguf,
      model_sha256: "{{ embed_model_sha256 }}" }
  - { name: immich-ml,       template_dir: immich-ml }   # ML offload for immich-app on VPS (over WG)

  # --- DNS (HD-299, VPS-primary 2026-09-03): oldsrv is now the SECONDARY resolver ---
  #   PRIMARY = VPS (group_vars/vps.yml), SECONDARY = oldsrv (this entry, instance:
  #   secondary, no web-UI labels — the dns.kogler.si UI lives on the VPS primary),
  #   TERTIARY = Pi (raspberry_pi.yml). LAN DHCP chain + router rules + tailnet
  #   headscale nameservers all list VPS-primary first (see docs/network-dns.md).
  - { name: technitium,      template_dir: technitium, instance: secondary, enabled: "{{ inventory_hostname == 'oldsrv.kogler.si' }}" }
  # RETIRED 2026-09-10 (network-dns.md): Main-Group ad-blocking moved to Technitium
  # Advanced Blocking (kept the filter on the reliable VPS/Pi DNS tier instead of
  # oldsrv). Entry kept `enabled: false` so the deploy loop tears the container down
  # (2026-09-14 converge was mid-flight when the row was retired — the stale live
  # pihole container kept crash-looping from the read_only+cap_drop hardening).
  # Vault item pihole_password intentionally left in place (owner: leave as-is).
  - { name: pihole,          template_dir: pihole,     subdomain: ad, public: false, enabled: false }

  # --- Home-LAN internal all-app edge (HD-350): traefik-internal on OLDSRV ---
  # Host-net, VIP + LAN-IP bound :80/:443, file-provider routes (dynamic/routes.yml.j2),
  # NO Forward-Auth/CrowdSec (VPS-dependent — must survive WAN-out). All internal
  # app names (*arr/media/seerr/…/ha/dns-pi + VPS-hosted via wg-s2s :4443) are served
  # here so LAN clients stay on the home LAN regardless of WAN/VPS state.
  - { name: traefik-internal, template_dir: traefik-internal }

  # --- Smart home failover: standby HA + keepalived VIP on oldsrv ---
  # COLD by design — docker_services must NOT start them (exactly one active HA). The
  # home_assistant role renders their compose files + configs; ha-failover.sh starts
  # home-assistant-standby on manual forward takeover.
  - { name: home-assistant-standby, template_dir: home-assistant-standby, enabled: false }

  # --- Observability: LAN log hub (Dozzle) ---
  # HD-343 ride-along (2026-09-15): the VPS keeps the VPS-only viewer (logs.kogler.si,
  # group_vars/vps.yml). OLDSRV now runs the LAN log HUB: a full Dozzle (llogs.kogler.si,
  # :8081, served by the traefik-internal home edge — WAN-out survival) that shows oldsrv
  # containers + pi + spark via remote agents (DOZZLE_REMOTE_AGENT over the Home VLAN).
  # LAN logs stay LAN-only by design — never reach the VPS / public / tailnet. The old
  # HD-135b tombstone (dozzle MOVED to the VPS) is superseded: the home hub is a NEW role.
  - { name: dozzle,          template_dir: dozzle, subdomain: llogs, public: false, enabled: true,
      dozzle_listen_ip: "{{ oldsrv_home_ip }}", dozzle_http_port: 8081,
      dozzle_agent_connect: ["{{ pi_home_ip }}:7007|pi", "{{ spark_home_ip }}:7007|spark"] }
  - { name: dozzle-agent,    template_dir: dozzle-agent, enabled: true,
      dozzle_agent_listen: "{{ oldsrv_home_ip }}", dozzle_agent_hostname: "oldsrv" }
  - { name: signal-cli-rest-api, template_dir: signal-cli-rest-api }   # Signal gateway (n8n on VPS reaches here over WG)

  # --- Stream ---
  - { name: sunshine,        template_dir: sunshine, enabled: "{{ homelab_mode == 'desktop' }}" }

  # --- Media / *arr stack — internal-only, documents/services.md ---
  - { name: jellyfin,     template_dir: jellyfin,     subdomain: media }
  - { name: seerr,        template_dir: seerr, bind_owner_uid: 1000, bind_dirs: ['config'] }   # HD-318: Docker auto-creates /srv/docker/seerr/config as root; container runs uid 1000 → crash-loop without bind-owner + bind_dirs (the dir must be pre-created 1000-owned)
  - { name: seerrng,       template_dir: seerrng, subdomain: seerrng, public: false, enabled: true, bind_owner_uid: 1000, bind_dirs: ['config'] }   # HD-353 (2026-09-10): alongside seerr (same Sonarr/Radarr backends); own Jellyfin login; internal-only; HD-318 ownership — image runs uid 1000, config dir must be pre-created 1000-owned
  - { name: sonarr,       template_dir: sonarr, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A: image runs PUID=1005; config dir must be pre-created 1005-owned (2026-09-15 live: root-owned config → crash-loop after converge recreated the container)
  - { name: radarr,       template_dir: radarr, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A (2026-09-15 live: root-owned config → crash-loop)
  - { name: lidarr,       template_dir: lidarr, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A (2026-09-15 live: root-owned config → crash-loop)
  # HD-362 (2026-09-14, revised 2026-09-14): Music acquisition tier — agreed ladder:
  #   1) usenet (SABnzbd, existing)  2) Soulseek (slskd)  3) Lidarr-YouTube-Downloader
  #   (youtube → Lidarr). orpheusdl + Murglar = MANUAL device tools (laptop/phone, no
  #   IaC). Aurral (lastfm/metabrainz history, free) = discovery → Lidarr. All P2P egress
  #   (slskd only; qBittorrent stays for VIDEO via Sonarr/Radarr) through the shared
  #   gluetun WireGuard → PrivadoVPN (owner V4); SABnzbd stays plain LAN. Deploy-gated:
  #   owner seeds 1P items then converge oldsrv (see deployment-manual §Phase 3).
  - { name: aurral,        template_dir: aurral,         public: false, enabled: true, bind_owner_uid: 1005, bind_dirs: ['config', 'downloads'] }  # music discovery (Last.fm/ListenBrainz → Lidarr API), GHCR, v1.53.0 — app su-execs to AURRAL_UID (storage_uid 1005) and writes SQLite into /data; /srv/docker/aurral/config must be pre-created 1005-owned (HD-362 live, SQLITE_CANTOPEN otherwise); `downloads` bound at /app/downloads (weekly playlist manager EACCES otherwise)
  - { name: slskd,         template_dir: slskd,          public: false, enabled: true }  # Soulseek P2P #2 — gluetun sidecar (official slskd VPN integration), VPN-locked, fetch-only
  - { name: lidarr-ydl,    template_dir: lidarr-ydl,     public: false, enabled: true, bind_owner_uid: 1005, bind_dirs: ['config', 'home'] }  # Lidarr-YouTube-Downloader (Angrido) — youtube → Lidarr, #3 priority, Newznab+SABnzbd emulation; s6 setprivs to PUID (1005) and chmods /config — host dir must be 1005-owned (HD-362 live, "chmod /home/appuser: Operation not permitted" otherwise); `home` bound at /home/appuser (the image has NO appuser home on its RO layer — s6's `> /home/appuser/.profile` EACCES crash-loop otherwise)
  - { name: tube-archivist, template_dir: tube-archivist, public: false, enabled: false, bind_owner_uid: 1000, bind_dirs: ['es'] } # Personal YouTube (headless yt-dlp) — internal only; ES image runs uid 1000 → /srv/docker/tube-archivist/es must be pre-created 1000-owned (HD-362 live, crash-loop "failed to obtain node locks" otherwise) — DISABLED 2026-09-15 (owner: "I don't need it right now"; oldsrv constant CPU / alternating RAM = TA loop on `path.repo` ES snapshot env-check; re-enable once the fix lands in ES elasticsearch.yml directly, HD-362 tail)
  - { name: prowlarr,     template_dir: prowlarr, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A (2026-09-15 live: root-owned config → crash-loop)
  - { name: bazarr,       template_dir: bazarr, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A (2026-09-15 live: root-owned config → crash-loop)
  - { name: sabnzbd,      template_dir: sabnzbd,      subdomain: sab, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A: image runs PUID=1005; /srv/docker/sabnzbd/config must be pre-created 1005-owned (2026-09-15 live: root-owned empty config → "Cannot create INI file /config/sabnzbd.ini" crash-loop after a converge recreated the container)
  - { name: qbittorrent,  template_dir: qbittorrent,  subdomain: torrent, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A (2026-09-15 live: root-owned config → crash-loop); + gluetun sidecar in template (now also carries slskd egress — HD-362; edge routes: torrent.)
  - { name: profilarr,    template_dir: profilarr, bind_owner_uid: 1000, bind_dirs: ['config'] }   # HD-318 Class-A: image su-execs to uid 1000 (docker top: /app/profilarr runs as domen=1000); config dir must be pre-created 1000-owned (2026-09-15: initially mis-set to 1005, corrected — the app runs as 1000)
  - { name: recyclarr,    template_dir: recyclarr, bind_owner_uid: 1005, bind_dirs: ['config'] }   # HD-318 Class-A (2026-09-15 live: root-owned config → crash-loop); scheduled worker, no UI

  # --- Dev AI (HD-355/356) — dsh + pi-dev PARKED (DISABLED) 2026-09-17, HD-386 ---
  # History: MOVED here from the VPS 2026-09-10 (tailscale sidecars removed; UIs were
  # to publish on oldsrv_home_ip :3080/:8080, media-bridge pattern, reached by the VPS
  # tailnet edge over WG S2S). The owner has since REMOVED both harnesses — no dsh and
  # no pi-dev container exists on the VPS (torn down 2026-09-14) or on oldsrv — and per
  # decision #26 (services-ai.md §9) the coding harnesses are DEDICATED deployments from
  # now on, not docker_services entries. This registry is therefore their NON-host:
  # both entries stay DISABLED (kept, not deleted, so template_dir + the port contract
  # survive a future re-onboarding).
  # WHY disabled and not merely absent — the fail-closed class that made every oldsrv
  # docker_services converge red: both compose templates render a 1P-sourced scoped key
  # (dsh → vault['dsh_api'], pi-dev → vault['pi-harness_openai_api']) and BOTH items are
  # DELIBERATELY EMPTY in the vault (the LAN glue owns their value), so enabling either
  # dies at render ('dict object' has no attribute 'dsh_api') and takes the whole
  # converge down with it. Live-found 2026-09-15 (the ordering lesson below), re-found
  # 2026-09-17 while tracing the HD-383 abort — the abort was never the only red thing.
  #
  # The LAN LiteLLM itself STAYS ENABLED: per decision #26 it is the gateway for the
  # SIMPLE QUERIER tier (HomeAssistant, Docling, Open WebUI) + the pinned-AI legs
  # (embed/STT per decision #25) — that role is independent of the harnesses.
  # Its bootstrap-keys glue is now OFF: with the harness records gone from
  # `litellm_scoped_keys` (below) the instance has no scoped consumers, and the glue
  # fail-louds on an empty spec list ("FATAL: no scoped-key specs rendered", rc1) — the
  # FATAL is kept on purpose (a silently-empty list would mean consumers getting 401s at
  # runtime), so the switch is at the registry instead. Flip `bootstrap_keys: true` back
  # IN THE SAME CHANGE as the first real consumer's record (ha / docling / owui = HD-384)
  # — one change, per the same-change rule in hardware-spark.md §Model-catalog sync.
  # (Historical ordering contract, inert while no consumer exists: a bootstrap_keys
  # service MUST precede its consumers in this list, because the glue runs during ITS
  # deploy pass and refreshes the vault dict the consumers render from.)
  - { name: lan-litellm,    template_dir: lan-litellm, public: false, enabled: true,   # simple-querier gateway (decision #26); own Postgres; Kopia-backed
      bootstrap_keys: false }   # HD-386: no scoped consumers while the harness records are parked — see the block above (flip together with HD-384)
  - { name: dsh,            template_dir: dsh,       public: false, enabled: false }   # PARKED 2026-09-17 (HD-386, decision #26) — dedicated deployment, not an IaC service; UI would be oldsrv_home_ip:3080
  - { name: pi-dev,         template_dir: pi-dev,    public: false, enabled: false }   # PARKED 2026-09-17 (HD-386, decision #26) — dedicated deployment, not an IaC service; UI would be oldsrv_home_ip:8080

  # ⏳ Spark AI (Qwen3.8-Flash-Next on GB10) — DEPLOY-GATED ON SPARK (HD-359/HD-337):
  #     the engine lives on the spark NODE (host_vars/spark.kogler.si.yml), NOT oldsrv.
  #     This registry entry is the spark node's inference stack (template_dir spark-ai,
  #     vLLM B1 + llm-d router) and is kept DISABLED here so a homelab converge on
  #     OLDSRV never deploys it; it flips via the spark node's own group_vars once
  #     the box is up + bench certifies the winner engine (then moved to a spark.yml).

  # --- Finance: Actual Budget (HD-57, decision 2026-08-24) — internal-only P+I;
  #     stable pin + n8n EB bridge (docs/services-finance.md). API leg :5006 published
  #     on oldsrv_home_ip for n8n over WG (immich-ml precedent).
  - { name: actual-budget,   template_dir: actual-budget, bind_owner_uid: 1001, bind_dirs: ['data'] }   # HD-318: the image's data dir is /data owned by `actual` (uid 1001); bind_owner_uid + bind_dirs pre-create /srv/docker/actual-budget/data 1001-owned so the migration's uid-1001 mkdir succeeds

  # --- Backup: off-site agent (HD-191) — client of kopia-server on the VPS ---
  # Snapshots oldsrv-LOCAL state (configs, dumps scratch, thumbs, signal state) to
  # the Hetzner backup Box via kopia-server over the WG S2S tunnel. Never reads NAS
  # mounts (backup.md invariant). Scheduled worker, no UI.
  - { name: kopia-agent,    template_dir: kopia-agent }

  # --- Observability AI-debugging MCP servers (HD-344) — oldsrv (≈600–700 MB RAM each) ---
  # Front-ends to the VPS Victoria backends (VM :8428 / VL :9428) over wg-s2s
  # (victoria_backend_host). Tailnet/LAN-only, never public. ⏳ deploy-gated: oldsrv
  # is Phase-3/HD-318 + needs the VPS Victoria backend live (HD-342). See docs/observability.md.
  - { name: mcp-victoriametrics, template_dir: mcp-victoriametrics, public: false, enabled: true }
  - { name: mcp-victorialogs,    template_dir: mcp-victorialogs,    public: false, enabled: true }

  # --- Homelable (HD-45, re-scoped 2026-09-09): network/topology visualizer on oldsrv ---
  # Self-hosted network + rack topology canvas, nmap discovery, live healthchecks + MCP
  # (Pouzor/homelable, MIT). Internal-only dashboard — NEVER public/WAN. Access via the
  # Home-VLAN (direct IP or a future local edge) and the tailnet; there is NO home-host
  # Traefik edge (HD-331), and the VPS traefik-tailnet edge cannot reach back into the
  # home LAN. ⏳ deploy-gated: owner sign-off + secrets seeded (docs/services-admin.md
  # §Homelable). MCP sub-container is optional (homelable_mcp_enabled) — off by default.
  - { name: homelable, template_dir: homelable, public: false, enabled: false }

  # --- Services MOVED to the VPS (group_vars/vps.yml) — not deployed on oldsrv ---
  # opencloud/immich-app/forgejo/litellm/qdrant/docling/open-webui/openclaw,
  # grafana/blackbox-exporter + the Victoria backend (victoria-metrics + victoria-logs —
  # they replaced prometheus + loki, HD-342), n8n, kopia-server,
  # db-backup, matrix, chat, headscale, pairdrop, stirling-pdf, renovate,
  # homepage (HD-180/HD-183 — family launchpad at the public edge).
  # metabase: RETIRED from the VPS 2026-09-14 (was here); future home = oldsrv.
  # MinIO REMOVED (2026-08-18, HD-135): Immich originals = live Hetzner Box (CIFS), not S3.
#
# EXPLICITLY an empty LIST, not a key-with-only-comments: YAML would parse that as None
# and `litellm_scoped_keys | default([])` does NOT rescue None (the default filter fires on
# UNDEFINED only) — `roles/docker_services/tasks/main.yml` op_derive_glue and
# `tasks/deploy-service.yml` both pipe it through `map(attribute='vault_item')` and would
# die on a full oldsrv converge. `[]` keeps those pipes clean.
litellm_scoped_keys: []
  # LAN LiteLLM scoped keys (HD-356/HD-370) — per-instance SSOT consumed by the
  # bootstrap-keys glue + scripts/check-vault-items.sh (same record shape as the
  # VPS list in group_vars/vps.yml `litellm_scoped_keys`; same vault ITEMS, but the
  # keys minted here live in the LAN lan-litellm-db — 2026-09-15: the stale
  # VPS-DB-minted dsh_api/pi-harness values were CLEARED in 1Password so this glue
  # mints fresh LAN keys vault-first; the orphaned VPS-DB alias keys were deleted
  # server-side and the records dropped from vps.yml).
  #
  # PARKED 2026-09-17 (HD-386, decision #26): the two harness records are commented out
  # because their consumers no longer exist (dsh/pi-dev removed by the owner; coding
  # harnesses are dedicated deployments now, reached DIRECTLY per decision #26 — they
  # are not LiteLLM consumers any more). Leaving them in minted keys for nobody and kept
  # every converge red: the glue probes the stored `dsh_api` credential, gets 401 (it is
  # a VPS-DB-era value), and correctly refuses to auto-overwrite a secret → ABORT rc2
  # (that is HD-383). Commenting the records removes both the mint and the probe.
  # The 1P ITEMS stay in the vault untouched (a parked consumer must not imply a
  # deleted secret); `dsh_api` still holds the stale value and would still trip rc2 if
  # this record is ever restored — that remediation is written in HD-383.
  # The list being EMPTY is what forces `bootstrap_keys: false` on lan-litellm above.
  # - { alias: dsh, vault_item: dsh_api, models: "ollama/*,openrouter/*", max_budget: "30", budget_duration: "30d" }
  # - { alias: pi-harness, vault_item: pi-harness_openai_api, models: "ollama/*,openrouter/*", max_budget: "30", budget_duration: "30d" }   # HD-268 pi scoped LiteLLM key (dual harness) — PARKED HD-386
  # First records to land here again are the SIMPLE QUERIER tier (decision #26), not the
  # harnesses: spark/* + ollama/* allowlists for ha / docling / owui = HD-384.
