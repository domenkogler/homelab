---
# MikroTik Router (RB4011) configuration — host router.kogler.si

routeros_api_port: 8728
# routeros_api_tls: true   # enable after Let's Encrypt on router

# VLAN map — must match docs/network-vlans.md
vlans:
  - { id: 1,  name: Blackhole,    subnet: "0.0.0.0/0",  unused: true }
  - { id: 10, name: Home,         subnet: "10.10.1.0/24" }
  - { id: 20, name: IoT,          subnet: "10.10.20.0/24" }
  - { id: 21, name: IoT-Internet, subnet: "10.10.21.0/24" }
  - { id: 30, name: Guest,        subnet: "10.10.30.0/24" }
  - { id: 40, name: Kids,         subnet: "10.10.40.0/24" }
  - { id: 50, name: Media,        subnet: "10.10.50.0/24" }
  - { id: 99, name: Management,   subnet: "10.10.99.0/24" }

wireguard_s2s_vps:
  local_ip: 10.255.40.1/30
  remote_ip: 10.255.40.2/30
  remote_endpoint: "{{ hostvars['vps.kogler.si'].ansible_host }}"
  port: 51820
  # VPS public key (derived from the VPS wireguard private key), needed for the router
  # peer. Fail-closed when unset at deploy; the shared `wg_password` here is the router's
  # private key. Single-private-key-per-S2S-family means each side derives its own pubkey.
  vps_public_key: "{{ lookup('vars', 'wg_s2s_vps_public_key') if 'wg_s2s_vps_public_key' in vars else '' }}"
  # LEAST-ACCESS (HD-155): the router accepts from the VPS peer only the scoped home
  # targets (exporter/VIP/probe + oldsrv backends) + wg-vps-services — NOT the whole
  # `site` /16. Same SSOT-derived list as group_vars/all.yml `wg_s2s_vps.allowed_ips`
  # (kept here so the RouterOS peer `allowed-address` matches the VPS side).
  allowed_ips:
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'ha-vip') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 99) | first).ip }}/32"
    - "{{ (network_static_hosts | selectattr('name', 'equalto', 'switch') | selectattr('vlan', 'equalto', 99) | first).ip }}/32"
    - "{{ (network_ranges | selectattr('name', 'equalto', 'wg-vps-services') | first).cidr }}"

# Headscale overlay for user devices (Tailscale-compatible CGNAT range).
# WireGuard is site-to-site ONLY — user devices use Headscale, not road-warrior.
headscale_subnet: "100.64.0.0/10"

# Technitium (Traefik cannot proxy DNS — these are the resolver addresses)
dns_primary_ip: "{{ hostvars['oldsrv.kogler.si'].dns_primary_ip }}"    # 10.10.1.30
# secondary on Pi
# (populated on the Pi; keep it defined here so the router references both)
dns_secondary_ip: "{{ hostvars['pi.kogler.si'].dns_secondary_ip | default('10.10.1.20') }}"    # 10.10.1.20