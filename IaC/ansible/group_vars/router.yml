---
# MikroTik Router (RB4011) configuration — host router.kogler.si

routeros_api_port: 8728
# routeros_api_tls: true   # enable after Let's Encrypt on router

# VLAN map — must match docs/network-vlans.md
vlans:
  - { id: 1,  name: Blackhole,    subnet: "0.0.0.0/0",  unused: true }
  - { id: 10, name: Home,         subnet: "10.10.1.0/24" }
  - { id: 20, name: IoT,          subnet: "10.10.20.0/24" }
  - { id: 21, name: IoT-Internet, subnet: "10.10.21.0/24" }
  - { id: 30, name: Guest,        subnet: "10.10.30.0/24" }
  - { id: 40, name: Kids,         subnet: "10.10.40.0/24" }
  - { id: 50, name: Media,        subnet: "10.10.50.0/24" }
  - { id: 99, name: Management,   subnet: "10.10.99.0/24" }

wireguard_s2s_vps:
  local_ip: 10.255.40.1/30
  remote_ip: 10.255.40.2/30
  remote_endpoint: "{{ hostvars['vps.kogler.si'].ansible_host }}"
  port: 51820

# Headscale overlay for user devices (Tailscale-compatible CGNAT range).
# WireGuard is site-to-site ONLY — user devices use Headscale, not road-warrior.
headscale_subnet: "100.64.0.0/10"

# Technitium (Traefik cannot proxy DNS — these are the resolver addresses)
dns_primary_ip: "{{ hostvars['oldsrv.kogler.si'].dns_primary_ip }}"    # 10.10.1.30
# secondary on Pi
# (populated on the Pi; keep it defined here so the router references both)
dns_secondary_ip: "{{ hostvars['pi.kogler.si'].dns_secondary_ip | default('10.10.1.20') }}"    # 10.10.1.20