---
# MikroTik Router (RB4011) configuration — host router.kogler.si

routeros_api_port: 8728

# RouterOS device identity asserted before any api_modify (HD-161).
# Must match what rb4011_initial.rsc.j2 sets at bootstrap: `/system identity set name=router.kogler.si`.
# Set by group_vars so the assert is per-gear (HD-165); role defaults keep only a fail-loud '' guard.
routeros_expected_identity: "router.kogler.si"

# TLS for the RouterOS API — self-signed device cert on api-ssl (8729). Kept false until the
# router is reset with the initial .rsc and api-ssl is live; then flip to true (validate_certs
# stays false — self-signed, private mgmt VLAN). HD-161 Part B.
# routeros_tls: true

# VLAN map — DERIVED VIEW of the SSOT `network_vlans` (group_vars/all.yml), HD-200:
# the only literal VLAN list lives in all.yml; the router adds just the unused
# VLAN 1 Blackhole stub (every consumer loop filters it via
# selectattr('unused', 'undefined')). A VLAN edit touches all.yml only — the old
# triple map (all.yml/router.yml/switch.yml kept equal by "must match" comments)
# cannot drift (audit H2 / iac-changes §2).
vlans: "{{ [ {'id': 1, 'name': 'Blackhole', 'subnet': '0.0.0.0/0', 'unused': True} ] + network_vlans }}"

# Port model (decided 2026-09-01): untagged = primary/access VLAN (Home 10 for admin/PC/Pi),
# tagged = secondary/admin backplane (Management 99). A single untagged port can carry only
# ONE VLAN (untagged frames map to pvid) — so dual-homed hosts ride Home untagged + Mgmt tagged.
# This is the fixed port model (network-vlans.md Port Type Reference); it supersedes the old
# "Mgmt-access + single-VLAN" model that left the Pi's Home leg dead (HD-307 / HD-308 class).

# Management-service reach — STRICT: bind router mgmt services to the Management VLAN only.
# The admin laptop/Pi reach the control plane via the TAGGED Mgmt sub-interface (eth0.99 on the
# Pi; laptop hops through the Pi or uses its tagged leg) — NOT from untagged Home (HD-310 design:
# untagged Home = user plane; tagged 99 = admin plane). Home->Mgmt forward is DROPPED (reverted
# 2026-09-02 — defense-in-depth: Home must never reach core infra by default).
router_services_available_from: >-
  {{ network_vlans | selectattr('id', '==', 99) | map(attribute='subnet') | first }}
router_port_map:
  wan:
    port: ether1
    vlan: 
    mac: "1C:64:99:51:BF:92"
  old-srv:
    port: ether2
    pvid: 10
    tagged: [99]
    vlan: 10
    mac: "00:1B:21:13:12:15"
  laptop-domen:
    port: ether3
    pvid: 10
    tagged: []
    vlan: 10
    mac: "48:2A:E3:9D:31:85"
  nas-ilo:
    port: ether7 
    pvid: 99
    tagged: []
    vlan: 99
    mac: "1C:98:EC:0E:0D:3A"
  homematic-ap:
    port: ether9
    pvid: 99
    tagged: []
    vlan: 99
    mac: "00:1A:22:1E:F7:FD"  
  rpi:
    port: ether10
    pvid: 10
    tagged: [99]
    vlan: 10
    mac: "E4:5F:01:26:EF:AA"

# ---- Comtrend GRG-4260us GPON modem (WAN-side, single-LAN mgmt access) ----
# The Comtrend stays in PPPoE-bridge mode and the RB4011 dials via pppoe-telekom on
# ether1. We give the RB4011 a /24 management address on 192.168.1.0/24 (the modem's
# own LAN) so the Comtrend's web UI stays reachable from the homelab for the
# twice-yearly PPPoE-redial dance — no physical cable swap needed.
#
# Access scope (HD-302): ONLY trusted-admin hosts (the laptop) can reach 192.168.1.1.
# The Comtrend has a default-password web UI (consumer device) — restrict to mgmt
# admins per the HD-78 binding floor. The FORWARD chain gets an explicit allow rule
# (trusted-admin -> 192.168.1.1) and an explicit drop rule (everything else -> 192.168.1.0/24).
#
# The Comtrend (consumer ONT) only answers its web UI to its directly-connected LAN
# peer on the modem's own link (the RB4011 at 192.168.1.2). Forwarded HTTP/HTTPS from
# deeper LAN subnets (10.10.x) is silently ignored (connection tracker shows syn-sent
# with 0 repl packets). So a srcnat masquerade out ether1 is REQUIRED: the router
# presents trusted-admin traffic to the modem as its own 192.168.1.2 address.
# Live-verified 2026-09-02: laptop -> modem UI returns 401 (auth page) via this SNAT.
#
# DNS: modem.kogler.si is a private split-horizon record. Live publication depends on
# the first Technitium instance (Phase 2/3); tracked separately, NOT in cloudflare_dns
# (the modem is on a private RFC1918 subnet and must never go to public DNS).
comtrend_modem:
  enabled: true
  iface: ether1
  modem_subnet: 192.168.1.0/24
  modem_mgmt_ip: 192.168.1.1        # the Comtrend's own web UI
  router_on_modem: 192.168.1.2/24   # the RB4011's /24 on the modem's LAN (connected route to the modem subnet)

wireguard_s2s_vps:
  local_ip: 10.255.40.1/30
  remote_ip: 10.255.40.2/30
  remote_endpoint: "vps.kogler.si"   # SSOT-stable VPS endpoint (public A record in cloudflare_dns/vars/main.yml) — resolves at boot, survives VPS IP changes without a re-render; mirrors the VPS side's `s.kogler.si` DDNS token pattern.
  port: 51820
  # VPS public key (VPS's OWN distinct key `wg_password_vps`, NOT shared — HD-285 fix),
  # needed for the router peer. Fail-closed when unset at deploy; router and VPS each
  # hold their own private key (`wg_password` / `wg_password_vps`) and derive their own
  # pubkey — pinned in group_vars/all.yml (`wg_s2s_router_public_key` / `wg_s2s_vps_public_key`).
  vps_public_key: "{{ lookup('vars', 'wg_s2s_vps_public_key', default='') }}"  # HD-271: lookup default — no `in vars` membership (internal vars dict deprecated at 2.24)
  # LEAST-ACCESS (HD-155): the router accepts from the VPS peer only the scoped home
  # targets (exporter/VIP/probe + oldsrv backends) + wg-vps-services — NOT the whole
  # `site` /16. DERIVED from the SSOT list `wg_s2s_vps.allowed_ips` (group_vars/all.yml,
  # HD-200): one list, two consumers (VPS-side wg interface + RouterOS peer
  # allowed-address), so the two sides can no longer drift (iac-changes §8).
  # Edit the list in all.yml only.
  allowed_ips: "{{ wg_s2s_vps.allowed_ips }}"

# Headscale overlay for user devices (Tailscale-compatible CGNAT range).
# WireGuard is site-to-site ONLY — user devices use Headscale, not road-warrior.
headscale_subnet: "100.64.0.0/10"

# Technitium (Traefik cannot proxy DNS — these are the resolver addresses)
dns_primary_ip: "{{ hostvars['oldsrv.kogler.si'].dns_primary_ip }}"    # 10.10.1.30
# secondary on Pi
# (populated on the Pi; keep it defined here so the router references both)
dns_secondary_ip: "{{ hostvars['pi.kogler.si'].dns_secondary_ip | default('10.10.1.20') }}"    # 10.10.1.20
# ==== CAPsMAN WiFi map (HD-228 / network-vlans.md SSID mapping) ====
# SSOT for cfg names/SSIDs/VLANs/passphrase items. Items must exist in
# 1Password BEFORE rendering capsman_steady-state.rsc (render lookups fail loud).
# DELIVERY (owner decision 2026-08-24 / task 8): steady-state WiFi = rendered rsc
# (IaC/router/templates/capsman_steady-state.rsc.j2), NOT ansible api_modify. MODERN
# wifi-qcom-ac (HD-232); datapath VLAN tagging in the config objects. This flag stays
# false — the rsc replaces the api_modify path entirely.
# IoT configs must stay 2.4 GHz-friendly (QCA4002 + Gen1 Shelly chips, HD-228);
# passphrases alphanumeric only (HD-228 constraint).
routeros_capsman_enabled: false
routeros_capsman_implemented: false   # flips true when capsman.yml tasks are written against the live manager
routeros_capsman_ssids:
  - { cfg: cfg-kogler,        ssid: Kogler,         vlan: 10, item: wifi-kogler_password }
  - { cfg: cfg-kogler-iot,    ssid: Kogler IOT,     vlan: 20, item: wifi-kogler-iot_password }
  - { cfg: cfg-kogler-iot-wan, ssid: "Kogler IOT WAN", vlan: 21, item: wifi-kogler-iot-wan_password }
  - { cfg: cfg-kogler-guest,  ssid: Kogler guest,   vlan: 30, item: wifi-kogler-guest_password }
  - { cfg: cfg-kogler-kids,   ssid: Kogler Kids,    vlan: 40, item: wifi-kogler-kids_password }
