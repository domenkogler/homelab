[defaults]
host_key_checking = False
inventory = inventory.ini
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# HD-257: per-run top-task timing — validates the deploy-speed audit's assumptions
# (op-lookup time vs template I/O vs docker CLI vs ssh transport) and makes every
# later speedup change arbitrageable. Keep permanently; prints top-N slowest tasks.
callbacks_enabled = ansible.builtin.profile_tasks
gathering = smart
# HD-231 pt.4 (2026-08-24, deploy-speed pass): keep gathered facts between runs in
# a local jsonfile cache — with gathering=smart Ansible only re-collects facts for
# hosts missing from the cache instead of every run (biggest single win on the
# /mnt/d WSL runner). Plugin is ansible.builtin.jsonfile (verified present).
fact_caching = ansible.builtin.jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 86400
forks = 20
# Explicit role path — required under WSL when the repo lives on a world-writable
# /mnt/ drive (Ansible ignores cwd-relative ./roles there). Use the env var
# ANSIBLE_ROLES_PATH=roles as a fallback in that case until the config is trusted.
roles_path = roles

[ssh_connection]
pipelining = True
# HD-231 pt.4: reuse one master connection per run instead of re-authenticating for
# every module. ControlPersist keeps the socket alive 60s after the play ends so
# back-to-back playbook invocations (vps.yml then dns.yml) share it too.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s