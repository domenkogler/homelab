[defaults]
host_key_checking = False
inventory = inventory.ini
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# Per-run top-task timing prints the top-N slowest tasks, so any speedup change stays
# measurable. Keep permanently.
callbacks_enabled = ansible.builtin.profile_tasks
gathering = smart
# ansible-core 2.24 removes the default `True` of INJECT_FACTS_AS_VARS (top-level
# `ansible_*` vars). With this off, magic + injected vars stay namespaced and tasks must
# reference facts via `ansible_facts['…']`.
inject_facts_as_vars = False
# Keep gathered facts between runs in a local jsonfile cache: with gathering=smart,
# Ansible re-collects facts only for hosts missing from the cache, not every run.
fact_caching = ansible.builtin.jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 86400
forks = 20
# Explicit role path — required under WSL when the repo lives on a world-writable
# /mnt/ drive (Ansible ignores cwd-relative ./roles there). Use the env var
# ANSIBLE_ROLES_PATH=roles as a fallback in that case until the config is trusted.
roles_path = roles

[ssh_connection]
pipelining = True
# Reuse one master connection per run instead of re-authenticating for
# every module. ControlPersist keeps the socket alive 60s after the play ends so
# back-to-back playbook invocations (vps.yml then dns.yml) share it too.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s