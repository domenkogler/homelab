[defaults]
host_key_checking = False
inventory = inventory.ini
retry_files_enabled = False
stdout_callback = default
result_format = yaml
gathering = smart
# Explicit role path — required under WSL when the repo lives on a world-writable
# /mnt/ drive (Ansible ignores cwd-relative ./roles there). Use the env var
# ANSIBLE_ROLES_PATH=roles as a fallback in that case until the config is trusted.
roles_path = roles

[ssh_connection]
pipelining = True