---
# dns.yml — maintain public Cloudflare DNS records (control plane)
# ---------------------------------------------------------------
# Creates/updates the public `*.kogler.si` records (DNS-only) that point at the
# internet-facing services (VPS public edge + moving services).
#
# Runs on localhost (control plane) — NOT on a managed node.
#
# Run standalone — MUST be from inside IaC/ansible/ (so ansible.cfg + ./roles resolve):
#   cd IaC/ansible
#   ansible-playbook playbooks/dns.yml -i inventory.ini
# If on WSL with the repo on a world-writable /mnt/d drive (ansible ignores
# ansible.cfg + ./roles there), add the explicit role path:
#   ANSIBLE_ROLES_PATH=roles ansible-playbook playbooks/dns.yml -i inventory.ini
#
# Requirements:
#   * community.general collection (requirements.yml) — provides cloudflare_dns
#   * `cloudflare_api` in 1Password Homelab (credential field)
#   * Egress IP must be 193.77.156.222 (token IP filter) — home control plane only.
#
# The record list is the SSOT in roles/cloudflare_dns/vars/main.yml.
- name: Ensure public Cloudflare DNS records (control plane)
  hosts: localhost
  connection: local
  gather_facts: false
  run_once: true
  roles:
    - cloudflare_dns
