---
# self-converge-guard.yml — refuse the lockout-capable roles of the box the controller is
# standing on. Applying network / wireguard / tailscale / cockpit (or cockpit-agent on a
# client) to that host can sever the SSH session driving the play; per-role rationale:
# docs/deployment-ansible.md §Self-converge guardrail.
#
# Role names live in common/vars/main.yml — one list, three uses: the playbook gates, the
# role exemptions, and this guard. Adding a role to the lockout set is a decision, not a
# config value: append the role dir name here AND a matching guard task below, in one change.
#
# Fail-loud by construction: no default(), no | ternary fallback, no failed_when. If the
# controller cannot be identified the guard FIRES — it cannot tell "safe" from "about to
# cut its own cable". scripts/gate/check_self_converge_guard.py keeps that property true.
#
# The rule, exactly: REFUSE when (a) the target's short hostname == the controller's short
# hostname, AND (b) this play carries one of those roles, AND (c) the run's tag filter would
# actually select that role, AND (d) it is not a provably non-mutating --check of a
# check-safe role.
#
# Sanctioned exits: off-box (run the leg from a controller that is not the target) or in-band
# (the local console, where a second sudo-capable identity survives) — see
# docs/deployment-ansible.md §Self-converge guardrail. A Cockpit session login is NOT proven
# on any box: never rely on it, and never copy a claim about it from one host to another.
#
# TAG SYMMETRY (load-bearing): homelab_guard_tags is the role's complete selectable-tag
# vocabulary — every task tag plus the playbooks' role-level tags — and a guard task's tags
# must be exactly ['always'] + that list. Diverge the two and a --tags filter can select the
# role while selecting neither the guard nor the expression: the silent version of the hole.
#
# Roles whose tasks are mostly UNTAGGED (storage, vps-hardening) are covered by `always`,
# never by a tag literally named `untagged` — Ansible reserves that name and warns on every
# converge that touches it. check_self_converge_guard.py recomputes the vocabulary and
# enforces `task_tags == homelab_guard_tags + ['always']` plus the no-reserved-name rule.
#
# Deliberately over-refusive, not a bug: `--skip-tags <role>`, a `--tags <role>` whose tagged
# tasks would not have run, and `--tags <one harmless task>` all refuse the leg; `--tags
# untagged` refuses too (`always`, plus the expression's own tagnames term). Run off-box.
#
# Not guarded on purpose: common (users/sudoers/hosts cannot sever a session by itself) and
# docker / docker_services (the point of a self-hosted runner). monitoring, nut, ai_diag,
# cifs, home_assistant and spark carry written exemptions in their own defaults.

- name: Identify the control plane this playbook runs from
  # `lookup('pipe', ...)` executes on the CONTROLLER, never on the target — which is the
  # whole point: we need to know who is driving, not who is being driven.
  ansible.builtin.set_fact:
    homelab_controller_host: >-
      {{ (lookup('pipe', 'uname -n') | trim).split('.')[0] | lower }}
  run_once: true
  changed_when: false
  tags: [always]

- name: Refuse to guess when the control plane cannot be identified
  # An empty result means `uname` was unavailable — we are now blind to the one fact the
  # guard needs. Refuse the lockout legs rather than assume the runner is remote.
  ansible.builtin.assert:
    that:
      - homelab_controller_host | length > 0
    fail_msg: >-
      self-converge guard cannot identify the control plane: `uname -n` returned
      nothing on the controller. The lockout-capable roles (network / storage / wireguard /
      vps-hardening / tailscale-node) are refused rather than assumed safe. Run this leg from a controller
      that is not the target (deployment-ansible.md §Self-converge guardrail).
    quiet: true
  run_once: true
  changed_when: false
  tags: [always]

- name: Refuse the network role against the control node it is run from
  ansible.builtin.assert:
    that:
      - not (homelab_guard_block | bool)
    fail_msg: >-
      SELF-CONVERGE GUARD — refusing to run the 'network' role against
      '{{ inventory_hostname }}' because that IS the machine running this playbook
      (control plane '{{ homelab_controller_host }}'). roles/network rewrites this host's
      own systemd-networkd / NetworkManager units (VLAN-99 tagged sub-interface, static
      address, default route) — applying them over the session that is driving them is how
      the converge loses the box mid-flight.
      Off-box: run this leg from the VPS runner. Check mode of this role IS allowed
      (read-only proof). Tags requested: {{ ansible_run_tags | join(',') }}.
      Details: deployment-ansible.md §Self-converge guardrail.
  vars:
    homelab_guard_role: network
    homelab_guard_tags: [network, netd, nm-pi, nm-pi-mgmt, nm-resolver, dhcp-client, hosts, base]
    homelab_guard_check_safe: true
    homelab_guard_self: >-
      {{ homelab_controller_host == (inventory_hostname | lower).split('.')[0] }}
    homelab_guard_selected: >-
      {{ homelab_guard_role in ansible_play_role_names
         and (('all' in ansible_run_tags)
              or ('untagged' in ansible_run_tags)
              or ((homelab_guard_tags | intersect(ansible_run_tags)) | length > 0)) }}
    homelab_guard_block: >-
      {{ (homelab_guard_self | bool)
         and (homelab_guard_selected | bool)
         and not ((ansible_check_mode | bool) and (homelab_guard_check_safe | bool)) }}
  tags: [always, network, netd, nm-pi, nm-pi-mgmt, nm-resolver, dhcp-client, hosts, base]

- name: Refuse the storage role against the control node it is run from
  ansible.builtin.assert:
    that:
      - not (homelab_guard_block | bool)
    fail_msg: >-
      SELF-CONVERGE GUARD — refusing to run the 'storage' role against
      '{{ inventory_hostname }}', which is the machine running this playbook
      (control plane '{{ homelab_controller_host }}'). roles/storage re-renders fstab and
      the NFS mounts and drives ZFS mount operations — under a converge it can pull the
      filesystem out from the workspace and the container data dirs it is running in.
      Off-box: run this leg from the VPS runner. Check mode of this role IS allowed.
      Tags requested: {{ ansible_run_tags | join(',') }}.
      Details: deployment-ansible.md §Self-converge guardrail.
  vars:
    homelab_guard_role: storage
    homelab_guard_tags: [storage, nas, samba, auth-glue, zfs_exporter]
    homelab_guard_check_safe: true
    homelab_guard_self: >-
      {{ homelab_controller_host == (inventory_hostname | lower).split('.')[0] }}
    homelab_guard_selected: >-
      {{ homelab_guard_role in ansible_play_role_names
         and (('all' in ansible_run_tags)
              or ('untagged' in ansible_run_tags)
              or ((homelab_guard_tags | intersect(ansible_run_tags)) | length > 0)) }}
    homelab_guard_block: >-
      {{ (homelab_guard_self | bool)
         and (homelab_guard_selected | bool)
         and not ((ansible_check_mode | bool) and (homelab_guard_check_safe | bool)) }}
  tags: [always, storage, nas, samba, auth-glue, zfs_exporter]

- name: Refuse the wireguard role against the control node it is run from
  ansible.builtin.assert:
    that:
      - not (homelab_guard_block | bool)
    fail_msg: >-
      SELF-CONVERGE GUARD — refusing to run the 'wireguard' role against
      '{{ inventory_hostname }}', which is the machine running this playbook
      (control plane '{{ homelab_controller_host }}'). roles/wireguard restarts the WG
      interface — on the VPS that is the wg-s2s tunnel the home infra hosts are reached
      through, so a self-converge can drop the very route the runner is using.
      Off-box: run this leg from a controller that is not the target. Check mode IS allowed.
      Tags requested: {{ ansible_run_tags | join(',') }}.
      Details: deployment-ansible.md §Self-converge guardrail.
  vars:
    homelab_guard_role: wireguard
    homelab_guard_tags: [wireguard, base]
    homelab_guard_check_safe: true
    homelab_guard_self: >-
      {{ homelab_controller_host == (inventory_hostname | lower).split('.')[0] }}
    homelab_guard_selected: >-
      {{ homelab_guard_role in ansible_play_role_names
         and (('all' in ansible_run_tags)
              or ('untagged' in ansible_run_tags)
              or ((homelab_guard_tags | intersect(ansible_run_tags)) | length > 0)) }}
    homelab_guard_block: >-
      {{ (homelab_guard_self | bool)
         and (homelab_guard_selected | bool)
         and not ((ansible_check_mode | bool) and (homelab_guard_check_safe | bool)) }}
  tags: [always, wireguard, base]

- name: Refuse the tailscale-node role against the control node it is run from
  ansible.builtin.assert:
    that:
      - not (homelab_guard_block | bool)
    fail_msg: >-
      SELF-CONVERGE GUARD — refusing to run the 'tailscale-node' role against
      '{{ inventory_hostname }}', which is the machine running this playbook
      (control plane '{{ homelab_controller_host }}'). roles/tailscale-node restarts
      tailscaled and re-runs `tailscale up`. An admin session can arrive OVER
      that interface — node-direct remote dev is the point of the row — so a self-converge
      can drop the session it is running in AND the leg the remote rescue would come in on.
      Off-box: run this leg from a controller that is not the target, over the Home/LAN leg.
      Check mode of this role IS allowed (no `check_mode: false` in it).
      Tags requested: {{ ansible_run_tags | join(',') }}.
      Details: deployment-ansible.md §Self-converge guardrail.
  vars:
    homelab_guard_role: tailscale-node
    homelab_guard_tags: [tailscale-node]
    homelab_guard_check_safe: true
    homelab_guard_self: >-
      {{ homelab_controller_host == (inventory_hostname | lower).split('.')[0] }}
    homelab_guard_selected: >-
      {{ homelab_guard_role in ansible_play_role_names
         and (('all' in ansible_run_tags)
              or ('untagged' in ansible_run_tags)
              or ((homelab_guard_tags | intersect(ansible_run_tags)) | length > 0)) }}
    homelab_guard_block: >-
      {{ (homelab_guard_self | bool)
         and (homelab_guard_selected | bool)
         and not ((ansible_check_mode | bool) and (homelab_guard_check_safe | bool)) }}
  tags: [always, tailscale-node]

- name: Refuse the cockpit role against the control node it is run from
  ansible.builtin.assert:
    that:
      - not (homelab_guard_block | bool)
    fail_msg: >-
      SELF-CONVERGE GUARD — refusing to run the 'cockpit' role against
      '{{ inventory_hostname }}', which is the machine running this playbook
      (control plane '{{ homelab_controller_host }}'). roles/cockpit writes
      /etc/pam.d/cockpit (the group gate that makes a console login mean anything),
      and that file decides who can authenticate to the web console at all — a converge can
      remove the console it is being run from, and both failure modes of a bad PAM line
      (deny-everyone, or an auth rule sitting after the session rules and enforcing nothing)
      look like success to the caller. Off-box: run this leg from a controller that is not
      the target. Check mode of this role IS allowed (nothing in it carries
      `check_mode: false`).
      Tags requested: {{ ansible_run_tags | join(',') }}.
      Details: deployment-ansible.md §Self-converge guardrail.
  vars:
    homelab_guard_role: cockpit
    homelab_guard_tags: [cockpit]
    homelab_guard_check_safe: true
    homelab_guard_self: >-
      {{ homelab_controller_host == (inventory_hostname | lower).split('.')[0] }}
    homelab_guard_selected: >-
      {{ homelab_guard_role in ansible_play_role_names
         and (('all' in ansible_run_tags)
              or ('untagged' in ansible_run_tags)
              or ((homelab_guard_tags | intersect(ansible_run_tags)) | length > 0)) }}
    homelab_guard_block: >-
      {{ (homelab_guard_self | bool)
         and (homelab_guard_selected | bool)
         and not ((ansible_check_mode | bool) and (homelab_guard_check_safe | bool)) }}
  tags: [always, cockpit]

- name: Refuse the access role against the control node it is run from
  ansible.builtin.assert:
    that:
      - not (homelab_guard_block | bool)
    fail_msg: >-
      SELF-CONVERGE GUARD — refusing to run the 'access' role against
      '{{ inventory_hostname }}', which is the machine running this playbook
      (control plane '{{ homelab_controller_host }}'). roles/access re-renders the
      AllowUsers admission gate and rewrites authorized_keys: a name missing from that
      one line cannot log in even with a valid key, so a converge CAN remove the SSH
      account it is being run from. The role also asserts that the converge identity stays
      inside the gate (tasks/main.yml, BEFORE the template task) — but an assert protects a
      mistake, not a deliberate removal, so this guard stays the outer layer. The names that
      must survive are `ansible_admin_users` in roles/access/defaults/main.yml. Off-box: run this leg from a controller
      that is not the target. Check mode of this role IS allowed: nothing in it carries
      `check_mode: false`.
      Tags requested: {{ ansible_run_tags | join(',') }}.
      Details: deployment-ansible.md §Self-converge guardrail + docs/deployment-secrets.md
      §Who is authorized where (the reversible-sequence steps).
  vars:
    homelab_guard_role: access
    homelab_guard_tags: [access, base]
    homelab_guard_check_safe: true
    homelab_guard_self: >-
      {{ homelab_controller_host == (inventory_hostname | lower).split('.')[0] }}
    homelab_guard_selected: >-
      {{ homelab_guard_role in ansible_play_role_names
         and (('all' in ansible_run_tags)
              or ('untagged' in ansible_run_tags)
              or ((homelab_guard_tags | intersect(ansible_run_tags)) | length > 0)) }}
    homelab_guard_block: >-
      {{ (homelab_guard_self | bool)
         and (homelab_guard_selected | bool)
         and not ((ansible_check_mode | bool) and (homelab_guard_check_safe | bool)) }}
  tags: [always, access, base]

- name: Refuse vps-hardening (nftables + sshd) against the control node it is run from
  ansible.builtin.assert:
    that:
      - not (homelab_guard_block | bool)
    fail_msg: >-
      SELF-CONVERGE GUARD — refusing to run 'vps-hardening' against
      '{{ inventory_hostname }}', which is the machine running this playbook
      (control plane '{{ homelab_controller_host }}'). That role installs nftables
      default-deny and rewrites sshd_config — the canonical way to lock yourself out of
      the box you are SSH'd into.
      NOT check-mode-escapable: roles/vps-hardening carries a `check_mode: false` task, so
      a `--check` of it still writes /etc/ssh/sshd_config for real. Run the leg from a
      controller that is not the target, and read the runbook first
      (deployment-ansible.md §Self-converge guardrail).
  vars:
    homelab_guard_role: vps-hardening
    homelab_guard_tags: [hardening, base]
    homelab_guard_check_safe: false
    homelab_guard_self: >-
      {{ homelab_controller_host == (inventory_hostname | lower).split('.')[0] }}
    homelab_guard_selected: >-
      {{ homelab_guard_role in ansible_play_role_names
         and (('all' in ansible_run_tags)
              or ('untagged' in ansible_run_tags)
              or ((homelab_guard_tags | intersect(ansible_run_tags)) | length > 0)) }}
    homelab_guard_block: >-
      {{ (homelab_guard_self | bool)
         and (homelab_guard_selected | bool)
         and not ((ansible_check_mode | bool) and (homelab_guard_check_safe | bool)) }}
  tags: [always, hardening, base]
