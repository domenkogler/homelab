---
# render-docs.yml — control-plane SSOT render
# ------------------------------------------------
# Regenerates docs/network-addresses-generated.md + docs/services-inventory-generated.md + docs/subscriptions-table-generated.md
# from IaC/ansible group_vars/host_vars. This is the "IaC → docs" half of the
# IaC-as-source model. The Ansible post-deploy hook invokes the same render
#
# Run standalone:   ansible-playbook playbooks/render-docs.yml -i inventory.ini
# (also invoked as the final step of site.yml)
- name: Render SSOT docs from IaC (control plane)
  hosts: localhost:docker_hosts:raspberry_pi
  connection: local
  gather_facts: true
  tasks:
    # Record each Docker host's `docker_services` as a hostvar so the render task can read
    # every host's list (docker_hosts + raspberry_pi are in this play, but only hosts that
    # define `docker_services` — i.e. the Docker hosts, not pure-control localhost — carry it).
    - name: Record docker_services for this host
      ansible.builtin.set_fact:
        _docker_services: "{{ docker_services }}"
      when: docker_services is defined

    # services-inventory-generated.md — full multi-host service inventory (VPS + home_servers + raspberry_pi),
    # rendered once on localhost from each host's recorded `_docker_services`.
    - name: Render docs/services-inventory-generated.md (service inventory — all Docker hosts)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/inventory.md.j2"
        dest: "{{ playbook_dir }}/../../../docs/services-inventory-generated.md"
      vars:
        all_hostvars: "{{ hostvars | dict2items | selectattr('value._docker_services', 'defined') | list }}"
      delegate_to: localhost
      run_once: true

    - name: Render docs/network-addresses-generated.md from group_vars/all.yml SSOT
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/network-addresses.md.j2"
        dest: "{{ playbook_dir }}/../../../docs/network-addresses-generated.md"
      delegate_to: localhost
      run_once: true

    - name: Render docs/subscriptions-table-generated.md (subscription SSOT)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/subscription-table.md.j2"
        dest: "{{ playbook_dir }}/../../../docs/subscriptions-table-generated.md"
      delegate_to: localhost
      run_once: true