---
# Spark playbook — DGX Spark (GB10) node.
# The first-contact bootstrap (spin up ansible user + key) is a HANDS-ON one-shot via the
# standalone spark/ansible/spark-bootstrap playbook (kept as template), OR via the IaC
# common role's first-touch path on the box. This playbook covers the STACK: base prep +
# disk/XFS layout + (later) vLLM/SGLang via docker_services.
#
# Run:  ansible-playbook -i inventory.ini playbooks/spark.yml --limit spark.kogler.si

- hosts: spark
  become: true
  pre_tasks:
    # Refuse the lockout-capable roles (network / storage / wireguard /
    # vps-hardening) when this play's target IS the machine running the playbook.
    # Off-box path + in-band rescue: docs/deployment-ansible.md §Self-converge guardrail.
    - name: Self-converge guardrail
      ansible.builtin.import_tasks: tasks/self-converge-guard.yml
  vars:
    # Reachability (WSL runner / off-LAN): spark (10.10.1.40) is behind the home NAT.
    # From the WSL runner the Laptop reaches it ONLY via the VPS jump (ProxyJump vps,
    # the same ssh alias both the runner and the operator use). From a LAN-attached
    # runner this is a harmless no-op (the jump target is still reachable). SSOT:
    # ansible_ssh_common_args is the convention for hosts behind NAT (prompt.md §1,
    # apply-converge.yml precedent) — keep it here so ANY runner converges spark.
    ansible_ssh_common_args: "-o ProxyJump=vps"
  roles:
    - common          # ansible-admin user guard + sudoers + trixie sources + hardening (canonical)
    - role: access    # accounts + authorized_keys + the AllowUsers gate
      tags: [access]
    - network         # DHCP client-id=mac + netd units (dual-homed mgmt/home) — same as nas/oldsrv/pi
    - docker
    - spark           # NVMe p2 → XFS for PLE/KV + headroom assert (gated by spark_partition_enable)
    - spark-llm-profile  # read-only gate: which LLM config is about to boot (profile exists, KV math closes, artifacts staged, uncertified override)
    - spark-artifacts # GENERAL artifact store on XFS: weights + PLE overlays + INT4 tables (manifest spark_artifacts)
    # builds the patched vLLM lineage (image ID pinned by hand in versions.yml) + T80 drafter
    # conversion. Opt-in (`spark_ultrafast_build` in group_vars/spark.yml), run deliberately with
    # `--tags spark-ultrafast-build`. Ordered BEFORE docker_services: the render needs the pin.
    - role: spark-ultrafast-build
      when: spark_ultrafast_build | bool
      tags: [spark-ultrafast-build]
    # builds the v0.32 lineage: the SAME patch stack re-anchored on spark_vllm_v32_base_image, with
    # its own (pin, tag, commit) and its own build directory. Its own switch because it pulls a ~10 GB
    # base image; its own tags because a rebuild of one lineage must never be a rebuild of the other.
    - role: spark-profile-fast8
      when: spark_profile_fast8_build | bool
      tags: [spark-ultrafast-build, spark-profile-fast8]
    - monitoring      # Alloy node exporter → VPS Victoria backend (per-node model)
    - docker_services # spark-ai (vLLM B1 + llm-d router) via the spark group_vars; deploy-gated by `enabled`
