---
# Spark playbook — DGX Spark (GB10) node.
# The first-contact bootstrap (spin up ansible user + key) is a HANDS-ON one-shot via the
# standalone spark/ansible/spark-bootstrap playbook (kept as template), OR via the IaC
# common role's first-touch path on the box. This playbook covers the STACK: base prep +
# disk/XFS layout + (later) vLLM/SGLang via docker_services.
#
# Run:  ansible-playbook -i inventory.ini playbooks/spark.yml --limit spark.kogler.si

- hosts: spark
  become: true
  vars:
    # Reachability (WSL runner / off-LAN): spark (10.10.1.40) is behind the home NAT.
    # From the WSL runner the Laptop reaches it ONLY via the VPS jump (ProxyJump vps,
    # the same ssh alias both the runner and the operator use). From a LAN-attached
    # runner this is a harmless no-op (the jump target is still reachable). SSOT:
    # ansible_ssh_common_args is the convention for hosts behind NAT (prompt.md §1,
    # apply-converge.yml precedent) — keep it here so ANY runner converges spark.
    ansible_ssh_common_args: "-o ProxyJump=vps"
  roles:
    - common          # ansible-admin user guard + sudoers + trixie sources + hardening (canonical)
    - network         # DHCP client-id=mac + netd units (dual-homed mgmt/home) — same as nas/oldsrv/pi
    - docker
    - spark           # NVMe p2 → XFS for PLE/KV + headroom assert (gated by spark_partition_enable)
    - spark-artifacts # GENERAL artifact store on XFS: weights + PLE overlays + INT4 tables (manifest spark_artifacts, HD-359)
    - monitoring      # Alloy node exporter → VPS Victoria backend (per-node model)
    - docker_services # spark-ai (vLLM B1 + llm-d router) via the spark group_vars; deploy-gated by `enabled`
