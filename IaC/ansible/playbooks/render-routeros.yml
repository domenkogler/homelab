---
# render-routeros.yml — render RouterOS bootstrap .rsc from .j2 templates
# ------------------------------------------------------------------------
# Renders the initial / bootstrap RouterOS scripts into IaC/router/rendered/
# (GITIGNORED — never committed).
#
#   * Static IPs / VLANs come from IaC/ansible/group_vars/all.yml (SSOT).
#   * Secrets (PPPoE login, MikroTik admin password) are resolved from the
#     `Homelab` 1Password vault at render time and NEVER stored in the repo.
#
# Run standalone (on the management laptop, with `op` signed in):
#   ansible-playbook playbooks/render-routeros.yml -i inventory.ini
#
# Output (bootstrap device → rendered file):
#   RB4011 router  -> IaC/router/rendered/rb4011_initial.rsc
#   CRS328 switch  -> IaC/router/rendered/crs328_initial.rsc
#   hAP APs        -> (added in a follow-up task)
#
# Then upload each rendered .rsc (+ admin.pub / ansible.pub) to the device's
# Files and set:
#   /system reset-configuration no-defaults=yes run-after-reset=<file>
- name: Render RouterOS bootstrap .rsc (secrets-injected, never committed)
  hosts: localhost
  connection: local
  gather_facts: false
  run_once: true
  vars:
    # --- Secrets — resolved from 1Password at render time only ---
    pppoe_login_user: "{{ lookup('community.general.onepassword', 'pppoe_login', field='username', vault=op_vault) }}"
    pppoe_login_password: "{{ lookup('community.general.onepassword', 'pppoe_login', field='password', vault=op_vault) }}"
    mikrotik_admin_password: "{{ lookup('community.general.onepassword', 'mikrotik-admin_login', field='password', vault=op_vault) }}"
  tasks:
    - name: Ensure rendered output directory exists
      file:
        path: "{{ playbook_dir }}/../../router/rendered"
        state: directory

    - name: Render rb4011_initial.rsc
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_initial.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_initial.rsc"

    - name: Render crs328_initial.rsc
      template:
        src: "{{ playbook_dir }}/../../router/templates/crs328_initial.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/crs328_initial.rsc"

    - name: Report rendered files (upload, never commit)
      debug:
        msg:
          - "Upload IaC/router/rendered/rb4011_initial.rsc + admin.pub + ansible.pub to the RB4011"
          - "Upload IaC/router/rendered/crs328_initial.rsc + admin.pub + ansible.pub to the CRS328"
          - "Then per device: /system reset-configuration no-defaults=yes run-after-reset=<file>"
