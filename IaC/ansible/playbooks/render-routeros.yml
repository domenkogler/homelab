---
# render-routeros.yml — render RouterOS bootstrap .rsc from .j2 templates
# ------------------------------------------------------------------------
# Renders the initial / bootstrap RouterOS scripts into IaC/router/rendered/
# (GITIGNORED — never committed).
#
# !!! SECRET-EXPOSURE WARNING (CONVENTIONS §2, HD-233/234 lesson) !!!
#   The rendered .rsc files contain LIVE secrets (mikrotik admin password,
#   PPPoE login). NEVER:
#     - commit / push them (gitignored, but guard-session won't save you if you `git add -f`),
#     - cat / grep / echo their lines to a terminal, chat, or transcript
#       (probes show LENGTHS / PREFIXES / HASHES only),
#     - leave stale renders around after a rotation — re-render or delete them.
#   After ANY rotation of mikrotik-admin_login / pppoe_login: re-run this playbook (or
#   `rm -rf IaC/router/rendered`) so no artifact carries an old secret. Rendered files are
#   regenerable on demand — deleting is always safe.
#
#   * Static IPs / VLANs come from IaC/ansible/group_vars/all.yml (SSOT).
#   * Secrets (PPPoE login, MikroTik admin password) are resolved from the
#     `Homelab-ansible` 1Password vault at render time and NEVER stored in the repo.
#
# Run standalone (on the management laptop, with `op` signed in):
#   ansible-playbook playbooks/render-routeros.yml -i inventory.ini
#
# Output (bootstrap device → rendered file):
#   RB4011 router  -> IaC/router/rendered/rb4011_initial.rsc
#   CRS328 switch  -> IaC/router/rendered/crs328_initial.rsc
#   hAP/wAP APs    -> IaC/router/rendered/ap_initial.rsc (UNIVERSAL — one for all)
#   CAPsMAN WiFi   -> IaC/router/rendered/capsman_steady-state.rsc (MODERN wifi-qcom-ac, task 8)
#
# Then upload each rendered .rsc (+ admin.pub / ansible.pub) to the device's
# Files and set:
#   - bootstrap scripts: /system reset-configuration no-defaults=yes run-after-reset=<file>
#   - capsman_steady-state: /import capsman_steady-state.rsc (AFTER bootstrap + router role,
#     NOT a reset; passphrases injected from the wifi-kogler* 1Password items at render)
- name: Render RouterOS bootstrap .rsc (secrets-injected, never committed)
  hosts: localhost
  connection: local
  gather_facts: false
  run_once: true
  vars:
    # --- SSOT-derived context the templates reference (must be defined or render empties silently) ---
    # Management VLAN dict = the VLAN 99 entry from network_vlans (all.yml).
    mgmt: "{{ network_vlans | selectattr('id', '==', 99) | list | first }}"
    # Router / switch Management-plane IPs (from network_static_hosts, all.yml).
    router99: "{{ network_static_hosts | selectattr('vlan', '==', 99) | selectattr('name', '==', 'router') | list | first }}"
    switch99: "{{ network_static_hosts | selectattr('vlan', '==', 99) | selectattr('name', '==', 'switch') | list | first }}"
    # NOTE: timezone + bootstrap_dns_servers come from group_vars/all.yml (inventory-visible
    # for localhost) — do NOT re-declare here or you get a recursion loop.
    # CAPsMAN SSID list lives in group_vars/router.yml (router-host var, NOT loaded for localhost) —
    # pulled explicitly so capsman_steady-state.rsc renders.
    routeros_capsman_ssids: "{{ hostvars['router.kogler.si'].routeros_capsman_ssids }}"
    # Same for the mgmt-service reach var: rb4011_initial.rsc.j2 binds /ip service
    # available-from to it. Without this, the bootstrap renders services UNBOUND
    # (empty available-from) — the telnet brute-force exposure class this phase
    # fixed (HD-301/303). Mirror hostvars as an SSOT-derived bootstrap context.
    router_services_available_from: >-
      {{ hostvars['router.kogler.si'].router_services_available_from }}
    # --- Secrets — resolved from 1Password at render time only ---
    pppoe_login_user: "{{ lookup('community.general.onepassword', 'pppoe_login', field='username', vault=op_vault) }}"
    pppoe_login_password: "{{ lookup('community.general.onepassword', 'pppoe_login', field='password', vault=op_vault) }}"
    mikrotik_admin_password: "{{ lookup('community.general.onepassword', 'mikrotik-admin_login', field='password', vault=op_vault) }}"
    # --- Universal AP script knob ---
    # Rendered per-AP so each bootstrap sets a descriptive identity (ap-spalnica /
    # ap-dnevna / ap-spare) instead of the generic 'ap' (owner request 2026-09-02).
    # AP list from SSOT network_static_hosts (vlan==99, name~ap-*).
    ap_hosts: "{{ network_static_hosts | selectattr('vlan', '==', 99) | selectattr('name', 'match', '^ap-') | list }}"
    # AP MAC -> IP reservations are read from group_vars/all.yml (SSOT) inside the
    # ap_initial template loop — no per-AP literals here.
  tasks:
    - name: Ensure rendered output directory exists
      file:
        path: "{{ playbook_dir }}/../../router/rendered"
        state: directory

    - name: Render rb4011_initial.rsc
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_initial.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_initial.rsc"

    - name: Render crs328_initial.rsc
      template:
        src: "{{ playbook_dir }}/../../router/templates/crs328_initial.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/crs328_initial.rsc"

    - name: Render ap_initial.rsc (per-AP — universal template, descriptive identity)
      template:
        src: "{{ playbook_dir }}/../../router/templates/ap_initial.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/ap_initial-{{ item.name }}.rsc"
      loop: "{{ ap_hosts }}"
      vars:
        ap_name: "{{ item.name }}"

    - name: Render capsman_steady-state.rsc (MODERN wifi-qcom-ac, task 8)
      template:
        src: "{{ playbook_dir }}/../../router/templates/capsman_steady-state.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/capsman_steady-state.rsc"

    - name: Report rendered files (upload, never commit)
      debug:
        msg:
          - "Upload IaC/router/rendered/rb4011_initial.rsc + admin.pub + ansible.pub to the RB4011 (root Files — router boots off flash, root files survive)"
          - "Upload IaC/router/rendered/crs328_initial.rsc to the CRS328 root Files + admin.pub + ansible.pub into the CRS328 flash/ folder (root files are WIPED on reboot — flash/ survives)"
          - "Upload each rendered ap_initial-<name>.rsc to ITS AP root Files + admin.pub + ansible.pub into each AP flash/ folder (root wiped on reboot — flash/ survives)"
          - "Upload IaC/router/rendered/capsman_steady-state.rsc to the RB4011, then /import capsman_steady-state.rsc (AFTER bootstrap + router role — NOT a reset)"
          - "Then per bootstrap device: /system reset-configuration no-defaults=yes run-after-reset=<file>"
