---
- hosts: raspberry_pi
  become: true
  roles:
    - common
    - ai_diag        # restricted diagnostic dispatcher for ai-debug (as other hosts)
    - network
    - nut             # UPS client (Pi) — after network
    - docker
    # Order (KOPS-063 / HD-117): deploy containers (docker_services) BEFORE the
    # home_assistant role so HA containers are up before config keepalived/VIP renders —
    # mirrors the Implementation Order table (deployment-ansible.md §Implementation Order, step 7).
    # (raspberrymatic was dropped from the Pi loop 2026-08-18 / HD-13 parked.)
    - docker_services        # home-assistant-primary + technitium-secondary on the Pi
    - home_assistant
    - monitoring