---
- hosts: raspberry_pi
  become: true
  pre_tasks:
    # HD-413: refuse the lockout-capable roles (network / storage / wireguard /
    # vps-hardening) when this play's target IS the machine running the playbook.
    # Off-box path + in-band rescue: docs/deployment-ansible.md §Self-converge guardrail.
    - name: HD-413 | Self-converge guardrail
      ansible.builtin.import_tasks: tasks/self-converge-guard.yml
  roles:
    - common
    - ai_diag        # restricted diagnostic dispatcher for ai-debug (as other hosts)
    - network
    - nut             # UPS client (Pi) — after network
    - docker
    # Order (SUPERSEDED on this host — HD-204 decision 2026-08-21, option A "render-first",
    # replacing KOPS-063/HD-117): run home_assistant BEFORE docker_services so
    # config/configuration.yaml, keepalived.conf (+ secrets.yaml once its renderer lands)
    # exist as REGULAR FILES before the first `docker compose up`. The old KOPS-063 order
    # (containers up before config renders) made Docker auto-create each bind-mount source
    # as an empty DIRECTORY at first up — the HA role's copy→keepalived.conf then failed and
    # HA ran default config silently (audit J2/D2). deploy-service.yml carries a
    # belt-and-braces regular-file guard in front of every `compose up`.
    # (raspberrymatic was dropped from the Pi loop 2026-08-18 / HD-13 parked.)
    - home_assistant         # render-first (HD-204): configs exist before compose up
    - docker_services        # home-assistant-primary + technitium-secondary on the Pi
    - monitoring
    # HD-435 (2026-09-25): the Pi enrols as the SECOND permitted home node (tag:home-edge,
    # tcp/443 only). It has to be wired HERE as well as in home_servers.yml: `tailscale-node`
    # lived only in playbooks/home_servers.yml, whose `hosts:` is the `home_servers` group =
    # oldsrv ALONE (this host is in its own `raspberry_pi` group, inventory.ini), so
    # `tailscale_node_enabled: true` in host_vars/pi.kogler.si.yml would have been a silent
    # no-op — the same "bare role name is not a tag, and a role in a play that never runs"
    # class the comment above docker_services warns about.
    # Explicit `tags:` because a bare role gets none: `--tags tailscale-node` is the join run.
    - role: tailscale-node
      tags: [tailscale-node]
      when: tailscale_node_enabled | default(false)