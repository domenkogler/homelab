---
- hosts: raspberry_pi
  become: true
  pre_tasks:
    # Refuse the lockout-capable roles (network / storage / wireguard /
    # vps-hardening) when this play's target IS the machine running the playbook.
    # Off-box path + in-band rescue: docs/deployment-ansible.md §Self-converge guardrail.
    - name: Self-converge guardrail
      ansible.builtin.import_tasks: tasks/self-converge-guard.yml
  roles:
    - common
    - role: access     # ansible-admin + domen grants; Pi keeps `admin` admitted
      tags: [access]   # while it is still used (host_vars/pi.kogler.si.yml)
    - ai_diag        # restricted diagnostic dispatcher for ai-debug (as other hosts)
    - network
    - nut             # UPS client (Pi) — after network
    - docker
    # Order: run home_assistant BEFORE docker_services so config/configuration.yaml and
    # keepalived.conf exist as REGULAR FILES before the first `docker compose up` — else
    # Docker auto-creates each bind-mount source as an empty DIRECTORY and HA runs defaults.
    - home_assistant         # render-first: configs exist before compose up
    - docker_services        # home-assistant-primary + technitium-secondary on the Pi
    - monitoring
    # The Pi enrols as the SECOND permitted home node (tag:home-edge, tcp/443 only).
    # Wire it HERE as well as in home_servers.yml: that play's `hosts:` is the
    # `home_servers` group = oldsrv ALONE (this host is in its own `raspberry_pi` group,
    # inventory.ini), so `tailscale_node_enabled: true` in host_vars/pi.kogler.si.yml
    # would otherwise be a silent no-op.
    # Explicit `tags:` because a bare role gets none: `--tags tailscale-node` is the join run.
    - role: tailscale-node
      tags: [tailscale-node]
      when: tailscale_node_enabled | default(false)