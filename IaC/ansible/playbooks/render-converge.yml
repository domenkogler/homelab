# =============================================================================
# Render the two converge .rsc scripts (SECRETS-INJECTED — never commit)
# =============================================================================
#
# !!! SECRET-EXPOSURE WARNING (CONVENTIONS §2, HD-233/234 lesson) !!!
#   Outputs (rb4011_converge.rsc / crs328_converge.rsc) contain LIVE secrets
#   (mikrotik admin password, PPPoE login). NEVER commit/push, cat/grep/echo
#   their contents to stdout/chat/transcripts, or keep stale renders around
#   after a rotation. After ANY rotation of mikrotik-admin_login / pppoe_login,
#   re-run this playbook or `rm -rf IaC/router/rendered`.
---
- name: Render the two converge .rsc scripts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load all group_vars (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/main.yml"
    - name: Load router group_vars (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../group_vars/router.yml"
    - name: Load switch group_vars (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../group_vars/switch.yml"
    - name: Derive mgmt + router/switch 99 IPs
      set_fact:
        mgmt: "{{ network_vlans | selectattr('id', '==', 99) | list | first }}"
        router99: "{{ network_static_hosts | selectattr('vlan', '==', 99) | selectattr('name', '==', 'router') | list | first }}"
        switch99: "{{ network_static_hosts | selectattr('vlan', '==', 99) | selectattr('name', '==', 'switch') | list | first }}"
    - name: Resolve admin password from 1Password
      set_fact:
        mikrotik_admin_password: "{{ lookup('community.general.onepassword', 'mikrotik-admin_login', field='password', vault=op_vault) }}"
        pppoe_login_user: "{{ lookup('community.general.onepassword', 'pppoe_login', field='username', vault=op_vault) }}"
        pppoe_login_password: "{{ lookup('community.general.onepassword', 'pppoe_login', field='password', vault=op_vault) }}"
        # SNMP RO community (HD-53): read-only, Mgmt-scoped — resolved at render so the
        # converge templates can reference it without a secret in the repo.
        snmp_ro_community: "{{ lookup('community.general.onepassword', 'network-snmp_api', field='credential', vault=op_vault) }}"
      no_log: true

    - name: Detect n8n router API item (HD-312/4) — absence must not fail the render
      # The vault lacks mikrotik-n8n_api (owner-side gap, docs claimed done): a bare
      # lookup would abort the whole converge render. Wrap in onepassword presence
      # detection so rb4011_converge emits a loud DEFERRED comment instead of a blank
      # password (fail-loud, no default('')). Owner creates the item per HD-105 then
      # re-render provisions the n8n user.
      command: op item get 'mikrotik-n8n_api' --vault {{ op_vault }} --format json
      register: mikrotik_n8n_item
      changed_when: false
      ignore_errors: true
      no_log: true

    - name: Set n8n item presence fact
      set_fact:
        mikrotik_n8n_present: "{{ mikrotik_n8n_item.rc is defined and mikrotik_n8n_item.rc == 0 and mikrotik_n8n_item.stdout | length > 0 }}"
      no_log: true

    - name: Resolve n8n password when the item exists
      # Now that mikrotik-n8n_api exists (create-it rule: provision-secrets-style manual
      # item, HD-105 pattern, matching mikrotik-logpipe_api), read its password ONLY in
      # the present branch so the converge can actually create the n8n user. When absent
      # the var stays undefined -> template falls to the DEFERRED comment (fail-loud).
      set_fact:
        mikrotik_n8n_password: "{{ lookup('community.general.onepassword', 'mikrotik-n8n_api', field='password', vault=op_vault) }}"
      when: mikrotik_n8n_present | default(false)
      no_log: true
    - name: Ensure rendered dir
      file:
        path: "{{ playbook_dir }}/../../router/rendered"
        state: directory
    - name: Render rb4011_converge.rsc
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_converge.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_converge.rsc"
    - name: Render crs328_converge.rsc
      template:
        src: "{{ playbook_dir }}/../../router/templates/crs328_converge.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/crs328_converge.rsc"
    - name: Render crs328_snmp_delta.rsc — switch SNMP RO delta
      template:
        src: "{{ playbook_dir }}/../../router/templates/crs328_snmp_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/crs328_snmp_delta.rsc"
    - name: Render crs328_fixboot_delta.rsc — switch fixboot consolidation
      template:
        src: "{{ playbook_dir }}/../../router/templates/crs328_fixboot_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/crs328_fixboot_delta.rsc"
    - name: "Render rb4011_hd307_delta.rsc (HD-307: laptop/Pi static + Mgmt->Home)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_hd307_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_hd307_delta.rsc"
    - name: "Render rb4011_dns_resolver_delta.rsc (HD-317: router DNS-primary DHCP + /ip dns)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_dns_resolver_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_dns_resolver_delta.rsc"
    - name: "Render rb4011_guest_delta.rsc (HD-312: guest turn-up + IOT-WAN/Kids removal)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_guest_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_guest_delta.rsc"
    # HD-338: IoT devices off Mgmt + laptop tagged-99 (router live delta).
    # The FULL converge template (rb4011_converge.rsc.j2) carries the same
    # changes; this delta is the TRANSIENT apply (network-ops.md 3-tier) —
    # deleted once folded (it already is: converge template updated HD-338).
    - name: "Render rb4011_iot_off_mgmt_delta.rsc (HD-338: HAP/UPS off Mgmt + laptop tagged-99)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_iot_off_mgmt_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_iot_off_mgmt_delta.rsc"
    - name: "Render rb4011_ha_iot_delta.rsc (HD-319/HD-320: HA node -> KNX udp/3671 + Shelly tcp/80)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_ha_iot_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_ha_iot_delta.rsc"
    - name: "Render crs328_guest_delta.rsc (HD-312: switch AP-port VLAN 30)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/crs328_guest_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/crs328_guest_delta.rsc"
    - name: "Render rb4011_hd326_fix_delta.rsc (HD-326/HD-312: per-MAC kids + cloud-IoT WAN live-apply)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_hd326_fix_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_hd326_fix_delta.rsc"
    - name: "Render ap_guest_delta.rsc (HD-312: CAP bridge VLAN 30, per-AP)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/ap_guest_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/ap_guest_delta.rsc"
    - name: "Render rb4011_fixsyslog_delta.rsc (HD-313: remote-syslog egress refresh-on-boot workaround)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_fixsyslog_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_fixsyslog_delta.rsc"
    - name: "Render mikrotik_admin_rotate_delta.rsc (HD-321: shared admin password rotation)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/mikrotik_admin_rotate_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/mikrotik_admin_rotate_delta.rsc"
    - name: "Render rb4011_egress_probe_delta.rsc (HD-313: syslog egress test probe)"
      template:
        src: "{{ playbook_dir }}/../../router/templates/rb4011_egress_probe_delta.rsc.j2"
        dest: "{{ playbook_dir }}/../../router/rendered/rb4011_egress_probe_delta.rsc"
