---
- hosts: home_servers
  become: true
  roles:
    - common
    - ai_diag        # restricted diagnostic dispatcher for ai-debug
    - docker
    - network
    - nut             # UPS client (oldsrv) — after network, before monitoring
    - cockpit         # management UI (oldsrv) — own login, NOT behind Authentik
    - amd_rocm
    - role: desktop
      when: homelab_mode == 'desktop'
    - role: office
      when: homelab_mode == 'desktop'
    - role: proxmox
      when: homelab_mode == 'proxmox'
    - docker_services
    - home_assistant     # cold-standby template only
    - monitoring