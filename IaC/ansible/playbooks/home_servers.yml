---
- hosts: home_servers
  become: true
  pre_tasks:
    # Refuse the lockout-capable roles (network / storage / wireguard /
    # vps-hardening) when this play's target IS the machine running the playbook.
    # oldsrv is a control node — this play carries two of those roles.
    # Off-box path + in-band rescue: docs/deployment-ansible.md §Self-converge guardrail.
    - name: HD-413 | Self-converge guardrail
      ansible.builtin.import_tasks: tasks/self-converge-guard.yml
  roles:
    - common
    - role: access            # accounts + authorized_keys + the AllowUsers gate
      tags: [access]          # (bare role names are not tags — scripts/README.md)
    - ai_diag        # restricted diagnostic dispatcher for ai-debug
    - docker
    # Order: network MUST precede storage (NFS mounts depend on the VLAN/static-IP being up)
    # and docker_services MUST follow storage (needs NFS ready) — mirrors the
    # Implementation Order table (deployment-ansible.md §Implementation Order).
    - network
    - storage        # oldsrv: import/create nvme, datasets+props, NFS mounts, push timers (docs/storage.md)
    - nut             # UPS client (oldsrv) — after network, before monitoring
    - role: cockpit       # management UI (oldsrv) — own login, NOT behind Authentik
      tags: [cockpit]
    # The pi coding seat is its own role so it can be converged without the
    # maint-console leg — whose vault-vs-box credential divergence must stay a hard
    # failure (rotating a console credential is an owner act, never a side effect).
    - role: seat
      tags: [seat]
      when: seat_enable | default(false)     # bare role names are not tags — see playbooks/storage.yml for
                          # why this line exists (a `--tags cockpit` run was a silent no-op).
    # oldsrv as a headscale node. BEFORE docker_services so the interface exists
    # when traefik-internal binds its tailnet listener on the same run.
    # NOTE the explicit `tags:` — roles here carry NO implicit role tag, so
    # `--tags tailscale-node` would otherwise silently filter the whole
    # role out and report a clean, changed=0 run (scripts/README.md §"scoped deploys need
    # BOTH tags", same trap).
    - role: tailscale-node
      tags: [tailscale-node]
      when: tailscale_node_enabled | default(false)
    - role: amd_rocm
      when: gpu_vendor | default('') == 'amd'   # GPU host userland (docs/hardware-gpu.md)
    - role: desktop
      when: homelab_mode == 'desktop'
    - role: office
      when: homelab_mode == 'desktop'
    - role: proxmox
      when: homelab_mode == 'proxmox'
    - docker_services
    - home_assistant     # cold-standby template only
    - monitoring