---
# storage.yml — ZFS storage hosts (nas).
# nas runs NO Docker and NO service stack. Ansible is
# bootstrap-only: system hardening, /etc/hosts, host networking, and the NUT UPS master.
# The observability backend (VictoriaMetrics + VictoriaLogs + Grafana + n8n) lives on the VPS,
# reached by Alloy shipping nas's node_*/nut_* series over the WG S2S tunnel (see observability.md).
# nas runs its OWN Alloy host-exporter (monitoring installs Alloy via APT, no Docker requirement);
# oldsrv scrapes nas's nut/zfs exporters.
- hosts: storage
  become: true
  pre_tasks:
    # Refuse the lockout-capable roles (network / storage / wireguard /
    # vps-hardening) when this play's target IS the machine running the playbook.
    # Off-box path + in-band rescue: docs/deployment-ansible.md §Self-converge guardrail.
    - name: HD-413 | Self-converge guardrail
      ansible.builtin.import_tasks: tasks/self-converge-guard.yml
  roles:
    - common
    - role: access     # accounts + authorized_keys + AllowUsers gate (nas)
      tags: [access]
    - ai_diag
    - network
    - storage        # ZFS: import tank/bulk, datasets+props, sanoid/syncoid, NFS exports (docs/storage.md)
    - nut             # UPS master (usbhid-ups + upsd + nut_exporter on the host)
    - role: cockpit       # management UI (nas) + cockpit-zfs — own login, NOT behind Authentik
      tags: [cockpit]     # A bare role name is NOT a tag: without this, `--tags cockpit` selects
                          # nothing but the role's `always` guard and reports a green, changed=0
                          # run — a silent no-op. Tag the role to make single-role scoping real.
    - monitoring      # per-node Alloy host-exporter (apt-installed, no Docker) — ships nas node_* to VM on VPS
