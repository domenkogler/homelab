# ks-oidc.yml — Authentik OIDC providers + applications for homelab services
#
# Blueprint (config-as-code, idempotent). Applied by Authentik at startup / on demand
# from the mounted `./blueprints:/blueprints` volume (authentik compose).
#
# Model: each OIDC consumer is a provider (oauth2provider) + an application bound to it.
#
# A+mini-glue design (services-authentik.md, deployment-compose.md):
#   - This blueprint declares the SHAPE only: providers, applications, flows, outposts.
#   - Client credentials are NOT declared here. Authentik AUTO-GENERATES a client_id +
#     client_secret for each confidential oauth2provider on creation.
#   - The secret-egress glue runs after blueprint apply: GET each provider via
#     the Authentik API (/api/v3/providers/oauth2/ — NOT /api/v3/core/providers/…, which
#     404s) and writes the generated
#     client_id / client_secret into the 1Password items the compose templates lookup()
#     (openwebui_api, headscale_api, matrix_api, openclaw_api, opencloud_oidc).
#   Do NOT add client_id / client_secret lookup() fields to this file — that would try to
#   read credentials before Authentik has generated them (chicken-and-egg) and is the
#   exact error the A+mini-glue design removes.
#
# Verified against goauthentik/authentik main:
#   - authentication_flow slug = default-authentication-flow
#   - authorization_flow slug = default-provider-authorization-implicit-consent (default- required)
#   - signing_key = 'authentik Self-signed Certificate' (default bootstrap cert)
#   - sub_mode = hashed_user_id (model default)
#   - application binds provider via `provider: !KeyOf <id>` INSIDE the authentik_core.application
#     entry; there is NO authentik_providers_oauth2.application link model.
# Blueprint v1 spec (docs.goauthentik.io/customize/blueprints/v1/structure): `identifiers` is
# REQUIRED on every entry — providers identified by `name`, applications by `slug` (moved out of
# attrs; identifiers merge with attrs on create, updates only apply attrs). An entry without
# `identifiers` is rejected with "No or invalid identifiers".
# The provider serializer requires `invalidation_flow`
# (default-provider-invalidation-flow) and `redirect_uris` must be a LIST of OBJECTS
# {url, matching_mode: strict|regex} — both the legacy newline string AND plain-string list
# forms fail validation (authoritative shape: /blueprints/schema.json inside the image).
# Local validation: scripts/gate/validate_blueprints.py (custom-tag YAML loader + these checks), wired
# into scripts/validate-all.sh. Authoring notes: docs/services-authentik.md "Blueprint authoring notes".
# Deploy-verify: apply on the pinned authentik_version, confirm import + the
# secret-egress glue seeds client creds + each redirect_uri matches its consumer.
#
# Scope: OpenWebUI, Headscale, Matrix(Tuwunel), OpenClaw,
#   OpenCloud, Immich, Forgejo.
---
version: 1
entries:
  # ==================================================================================
  # Open WebUI (ai.kogler.si)  ->  1Password `openwebui_api` (seeded by glue)
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_openwebui
    identifiers:
      name: openwebui
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      redirect_uris:
        # Two-sided invariant: this is the SAME string as `OPENID_REDIRECT_URI` in
        # templates/docker_services/open-webui/docker-compose.yml.j2. The callback this build serves is
        # `/oauth/oidc/callback` (`@app.get('/oauth/{provider}/callback')` in open_webui/main.py,
        # provider = 'oidc'); moving one side only reads as an IdP outage.
        # Mechanism: docs/deployment-oidc.md §Open WebUI native-OIDC note.
        - {url: "https://ai.kogler.si/oauth/oidc/callback", matching_mode: strict}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app_openwebui
    identifiers:
      slug: openwebui
    attrs:
      name: Open WebUI
      meta_launch_url: https://ai.kogler.si
      provider: !KeyOf provider_openwebui


  # ==================================================================================
  # Headscale (vpn.kogler.si)  ->  1Password `headscale_api` (seeded by glue)
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_headscale
    identifiers:
      name: headscale
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      redirect_uris:
        - {url: "https://vpn.kogler.si/oidc/callback", matching_mode: strict}
        # Headplane admin UI callback — SAME OAuth client as headscale
        # (upstream SSO requirement: identical client_id). Pin BOTH entries:
        # a blueprint upsert wipes array attrs that are absent.
        - {url: "https://vpn.kogler.si/admin/oidc/callback", matching_mode: strict}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app_headscale
    identifiers:
      slug: headscale
    attrs:
      name: Headscale
      meta_launch_url: https://vpn.kogler.si
      provider: !KeyOf provider_headscale


  # ==================================================================================
  # Matrix / Tuwunel (matrix.kogler.si)  ->  1Password `matrix_api` (seeded by glue)
  #   native homeserver SSO. Matrix's callback is client_id-scoped
  #   (https://matrix.kogler.si/_matrix/client/unstable/login/sso/callback/<client_id>),
  #   so register the prefix form and verify the resolved callback at deploy.
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_matrix
    identifiers:
      name: matrix
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      redirect_uris:
        - {url: "https://matrix.kogler.si/_matrix/client/unstable/login/sso/callback/.*", matching_mode: regex}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app_matrix
    identifiers:
      slug: matrix
    attrs:
      name: Matrix
      meta_launch_url: https://matrix.kogler.si
      provider: !KeyOf provider_matrix


  # ==================================================================================
  # OpenClaw (internal gateway, services-internal — NO public subdomain)
  #   ->  1Password `openclaw_api` (seeded by glue)
  #   OpenClaw is an internal AI-agent backend with no public edge. Its Control-UI OIDC
  #   redirect is deploy-time, generated by `openclaw onboard` (deployment-ai-stack-secrets.md
  #   §2b). The provider is declared here; append the real redirect_uri(s) from the
  #   `openclaw onboard` output at deploy (headscale/internal callback — NOT a public
  #   openclaw.kogler.si redirect).
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_openclaw
    identifiers:
      name: openclaw
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # The serializer requires ≥1 redirect_uri even before onboard. PLACEHOLDER until the
      # real openclaw-onboard callback(s) are known — internal-only client,
      # no public redirect (deployment-ai-stack-secrets.md §2b).
      redirect_uris:
        - {url: "http://localhost:.*", matching_mode: regex}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app_openclaw
    identifiers:
      slug: openclaw
    attrs:
      name: OpenClaw
      provider: !KeyOf provider_openclaw


  # ==================================================================================
  # OpenCloud (file.kogler.si)  ->  1Password `opencloud_oidc` (seeded by glue)
  #   native OIDC, multi-redirect web + desktop + mobile. Unified provider with
  #   multiple redirect URIs. Web UI callback is canonical; desktop/mobile
  #   callback suffixes are OpenCloud-client-defined — add any exact URIs on separate
  #   lines here after verifying against the deployed OpenCloud client.
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_opencloud
    identifiers:
      name: opencloud
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # OpenCloud web is a PUBLIC PKCE client with the
      # PREDEFINED id `web` (docs.opencloud.eu external-idp; WebFinger default
      # WEBFINGER_WEB_OIDC_CLIENT_ID=web). Redirects are the web app's callback pair.
      # client_id itself is set to 'web' via ORM (serializer treats it read-only);
      # upsert preserves unlisted attrs, so it survives applies.
      # The SAME client also serves the native clients, because Authentik
      # derives the issuer from the provider and OpenCloud validates tokens against one issuer
      # (opencloud ADR 0003) — the compose makes WebFinger advertise `web` to android/ios/desktop.
      # `oc://android.opencloud.eu` is the Android app's custom-scheme callback, hardcoded in its
      # setup.xml (oauth2_redirect_uri_scheme=oc / _host=android.opencloud.eu / _path empty) and
      # intent-filtered in its AndroidManifest. STRICT comparison is BYTE-EXACT
      # (authentik providers/oauth2/views/authorize.py: `self.redirect_uri == allowed.url`), so
      # this entry must stay identical to what the client sends — add the trailing-slash variant
      # rather than editing this one if a client ever sends one. Desktop/iOS share the client_id but
      # carry their OWN callbacks, read off each client's own source, never guessed:
      #   iOS   `oc://ios.opencloud.eu` — the SDK's own default redirect
      #         (opencloud-eu/ios-sdk, OCAuthenticationMethodOAuth2.m `OCAuthenticationMethodOAuth2RedirectURI`),
      #         and the Info.plist registers the `oc` scheme, so strict matching applies.
      #   Desktop is NOT a scheme callback: it is an RFC 8252 loopback redirect on an OS-assigned
      #         port — `redirectUrlC()` = `http://127.0.0.1` and `Theme::oauthPorts()` = `{0}`
      #         ("zero means a random port"), both in opencloud-eu/desktop `src/libsync/creds/oauth.cpp`
      #         + `src/libsync/theme.cpp`. A strict entry can therefore never match (the port changes every
      #         run), so this needs a REGEX entry — Authentik `fullmatch`es regex entries and does NOT
      #         implement the port-agnostic loopback matching Keycloak does, which is why upstream's own
      #         Keycloak client file can get away with a bare `http://127.0.0.1` and we cannot.
      client_type: public
      redirect_uris:
        - {url: "https://file.kogler.si/oidc-callback.html", matching_mode: strict}
        - {url: "https://file.kogler.si/oidc-silent-redirect.html", matching_mode: strict}
        - {url: "oc://android.opencloud.eu", matching_mode: strict}
        - {url: 'oc://ios.opencloud.eu', matching_mode: strict}
        - {url: 'http://127\.0\.0\.1:[0-9]+', matching_mode: regex}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        # offline_access MUST be listed here or the native clients
        # cannot work. check_scope intersects the REQUESTED scopes with this provider's scope mappings
        # and silently drops the rest, and create_code_response mints a refresh token ONLY when
        # `offline_access` is still in the code's scope. WebFinger asks for it on android/ios/desktop
        # (`WEBFINGER_<PLATFORM>_OIDC_CLIENT_SCOPES` default `openid profile email offline_access`),
        # so without this line the app logs in, gets an access token ONLY, and reports an invalid
        # refresh token (live proof before the fix: RefreshToken count for this provider = 0, while
        # access_token_validity is 1h / refresh 30d). The web client is unaffected: its advertised
        # scope list is `openid profile email`.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
  - model: authentik_core.application
    id: app_opencloud
    identifiers:
      slug: opencloud
    attrs:
      name: OpenCloud
      meta_launch_url: https://file.kogler.si
      provider: !KeyOf provider_opencloud


  # ==================================================================================
  # Immich (foto.kogler.si)  ->  1Password `immich_oidc` (seeded by glue)
  #   native OIDC. Immich v3 mobile supports OAuth via the custom scheme
  #   app.immich:///oauth-callback (Confidential client, Authorization Code only).
  #   If Authentik rejects the custom scheme, use the http(s)-forwarder + Mobile Redirect
  #   Override workaround.
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_immich
    identifiers:
      name: immich
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      redirect_uris:
        - {url: "app.immich:///oauth-callback", matching_mode: strict}
        - {url: "https://foto.kogler.si/auth/login", matching_mode: strict}
        - {url: "https://foto.kogler.si/user-settings", matching_mode: strict}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app_immich
    identifiers:
      slug: immich
    attrs:
      name: Immich
      meta_launch_url: https://foto.kogler.si
      provider: !KeyOf provider_immich


  # ==================================================================================
  # Forgejo (git.kogler.si)  ->  1Password `forgejo_oidc` (seeded by glue)
  #   native OIDC. Forgejo's OAuth2 callback is Authentication-Name-scoped:
  #   https://git.kogler.si/user/oauth2/<Authentication Name>/callback. Register the source in
  #   the Forgejo admin UI (NOT env-injected) and set the NAME; it must match this redirect
  #   path exactly. Registered here as a wildcard prefix (Authentik regex matcher); verify the
  #   resolved callback at deploy. ROOT_URL must be https.
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_forgejo
    identifiers:
      name: forgejo
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      redirect_uris:
        - {url: "https://git.kogler.si/user/oauth2/.*", matching_mode: regex}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app_forgejo
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      meta_launch_url: https://git.kogler.si
      provider: !KeyOf provider_forgejo


  # ==================================================================================
  # No Metabase provider/app entries: Metabase owns its OWN login, and Metabase OSS has no
  # OIDC/SSO at all (paid Enterprise only) — so there is nothing to declare here for it on any
  # host. An OIDC provider for a client that cannot speak OIDC would still be asserted on every
  # blueprint apply, and its secret-egress item would be minted for a service that can never read
  # it (docs/services-admin.md §Metabase).
  # ==================================================================================

  # ==================================================================================
  # Zipline (bin.kogler.si)  ->  1Password `zipline_oidc` (seeded by glue)
  #   native OIDC. Public bin: the DASHBOARD is gated by this provider;
  #   viewer routes + folder-guest upload API stay anonymous by design (crowdsec-only
  #   tier). Callback verified from v4 source: `${origin}/api/auth/oauth/oidc`.
  # ==================================================================================
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_zipline
    identifiers:
      name: zipline
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      redirect_uris:
        - {url: "https://bin.kogler.si/api/auth/oauth/oidc", matching_mode: strict}
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Pin grant_types explicitly: a blueprint upsert writes an absent attr as an empty
      # list, which breaks the authorization_code grant on EVERY apply.
      grant_types:
        - authorization_code
        - refresh_token
      # Pin the three default property_mappings: the same upsert empties an absent attr,
      # and an empty list gives UserInfo 403 insufficient_scope.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app_zipline
    identifiers:
      slug: zipline
    attrs:
      name: Zipline
      meta_launch_url: https://bin.kogler.si
      provider: !KeyOf provider_zipline
