---
# ks-forward-auth.yml — edge forward-auth wiring for Traefik-fronted apps.
# ==================================================================================
# Declares the AUTHENTIK side of the `authentik-forward-auth@file` chain:
#   - one PROXY provider (mode: forward_single) per protected hostname
#   - one application per provider (slugs namespaced `edge-*`; the OIDC-side apps
#     live in ks-oidc.yml and must never collide)
#   - all providers bound to the EMBEDDED outpost ("authentik Embedded Outpost",
#     auto-created by authentik; blueprint updates it in place)
#
# Scope = the interfaces.md edge tier: every app whose router carries
# `authentik-forward-auth@file`. Excluded BY DESIGN (see labels/comments):
#   native-OIDC apps (ai/foto/file),
#   Matrix-native SSO (matrix/chat), WOPI-only office, the IdP itself (sso),
#   internal-tier services without public routes,
#   pairdrop — PUBLIC: crowdsec-only tier, no forward-auth.
#   metabase — owns its OWN native login (Metabase OSS has no SSO): no forward-auth object, on any host.
#   forgejo/git — NATIVE OIDC: SSO via ks-oidc.yml provider_forgejo, no forward-auth object.
# The route count is derived, not stated: count the forward_single providers and the
# tailnet .ts twins below. Re-derive any count from the outpost list
# rather than trusting a sentence (derived-values ban, CONVENTIONS §6).
# forward_single ONLY — forward_domain would swallow sibling subdomains.
# Deleting an entry here does NOT delete the server-side object: a blueprint apply is an
# UPSERT, so the same change must carry the ak-shell ORM one-shot and the ORDER matters
# (see services-authentik.md §Blueprint authoring notes).
# ==================================================================================
version: 1
metadata:
  name: ks-forward-auth
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_stats
    identifiers:
      name: forward-stats
    attrs:
      mode: forward_single
      external_host: https://stats.kogler.si
      internal_host: http://grafana:3000
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  # No `provider_edge_sec`: Metabase owns its own native login, so no edge proxy provider points at
  # it — a proxy provider with no route behind it is still asserted on every apply.
  # ⚠ A blueprint apply is an UPSERT: removing an entry here does NOT delete the server-side
  # object. The same change must carry the ak-shell ORM one-shot, and the ORDER matters —
  # deleting the object while `outpost_embedded` still references it is what makes the next
  # import fail (see the file header and services-authentik.md §Blueprint authoring notes).
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_auto
    identifiers:
      name: forward-auto
    attrs:
      mode: forward_single
      external_host: https://auto.kogler.si
      internal_host: http://n8n:5678
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_pdf
    identifiers:
      name: forward-pdf
    attrs:
      mode: forward_single
      external_host: https://pdf.kogler.si
      internal_host: http://stirling-pdf:8080
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_home
    identifiers:
      name: forward-homepage-apex
    attrs:
      mode: forward_single
      external_host: https://kogler.si
      internal_host: http://homepage:3000
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_home_home
    identifiers:
      name: forward-homepage-home
    attrs:
      mode: forward_single
      external_host: https://home.kogler.si
      internal_host: http://homepage:3000
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_traefik_dash
    identifiers:
      name: forward-traefik-dash
    attrs:
      mode: forward_single
      external_host: https://traefik.kogler.si
      internal_host: https://traefik.kogler.si
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # --- The VPS Technitium primary web UI. The technitium
  # compose's Docker-label route (Host(dns.kogler.si), authentik-forward-auth@file) needs an
  # Authentik forward provider here: without it forward-auth returns 404 for
  # Host: dns.kogler.si and https://dns.kogler.si/ is unreachable. internal_host resolves
  # the container on traefik-public (service name, docker DNS).
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_dns
    identifiers:
      name: forward-dns
    attrs:
      mode: forward_single
      external_host: https://dns.kogler.si
      internal_host: http://technitium:5380
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # --- Dozzle live-log viewer — plain + .ts providers (see .ts section below) ---
  # The tailnet edge's logs-kogler route sends Host: logs.kogler.si through forward-auth, so a
  # plain provider is required here as well as the .ts one: with only the .ts provider,
  # forward_single matched nothing and 404'd (same class of bug as dns above). Mirror the
  # stats pattern: a plain
  # forward-logs provider bound to the embedded outpost.
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_logs
    identifiers:
      name: forward-logs
    attrs:
      mode: forward_single
      external_host: https://logs.kogler.si
      internal_host: http://dozzle:8080
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # --- *.ts.kogler.si twins (tailnet-only traefik-
  # tailnet edge). Authentik forward_single matches EXACTLY one external_host, so the
  # tailnet .ts names need their OWN forward-auth providers (same internal backend) —
  # otherwise a request with Host: stats.ts.kogler.si matches nothing and 404s.
  # These providers are ONLY reachable over the tailnet (the traefik-tailnet edge).
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_stats_ts
    identifiers:
      name: forward-stats-ts
    attrs:
      mode: forward_single
      external_host: https://stats.ts.kogler.si
      internal_host: http://grafana:3000
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  # No `provider_edge_sec_ts` — Metabase has no forward-auth provider, plain or `.ts` twin; the
  # home edge serves both of its names and Authentik is not in that path.
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_auto_ts
    identifiers:
      name: forward-auto-ts
    attrs:
      mode: forward_single
      external_host: https://auto.ts.kogler.si
      internal_host: http://n8n:5678
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_traefik_dash_ts
    identifiers:
      name: forward-traefik-dash-ts
    attrs:
      mode: forward_single
      external_host: https://traefik.ts.kogler.si
      internal_host: https://traefik.kogler.si
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_logs_ts
    identifiers:
      name: forward-logs-ts
    attrs:
      mode: forward_single
      external_host: https://logs.ts.kogler.si
      internal_host: http://dozzle:8080
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_csui_ts
    identifiers:
      name: forward-csui-ts
    attrs:
      mode: forward_single
      external_host: https://csui.ts.kogler.si
      internal_host: http://crowdsec-web-ui:3000
      internal_host_ssl_validation: false
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: app_edge_stats
    identifiers:
      slug: edge-grafana
    attrs:
      name: Grafana (edge)
      meta_launch_url: https://stats.kogler.si
      provider: !KeyOf provider_edge_stats
  # No Metabase application entry (neither here nor in the `.ts` group): an entry in the launcher
  # for a service that does not use Authentik is a tile that cannot log anyone in.
  - model: authentik_core.application
    id: app_edge_auto
    identifiers:
      slug: edge-n8n
    attrs:
      name: n8n (edge)
      meta_launch_url: https://auto.kogler.si
      provider: !KeyOf provider_edge_auto
  - model: authentik_core.application
    id: app_edge_pdf
    identifiers:
      slug: edge-stirling-pdf
    attrs:
      name: Stirling PDF (edge)
      meta_launch_url: https://pdf.kogler.si
      provider: !KeyOf provider_edge_pdf
  - model: authentik_core.application
    id: app_edge_home
    identifiers:
      slug: edge-homepage
    attrs:
      name: Homepage (edge)
      meta_launch_url: https://kogler.si
      provider: !KeyOf provider_edge_home
  - model: authentik_core.application
    id: app_edge_home_home
    identifiers:
      slug: edge-homepage-home
    attrs:
      name: Homepage home (edge)
      meta_launch_url: https://home.kogler.si
      provider: !KeyOf provider_edge_home_home
  - model: authentik_core.application
    id: app_edge_traefik_dash
    identifiers:
      slug: edge-traefik-dash
    attrs:
      name: Traefik Dashboard (edge)
      meta_launch_url: https://traefik.kogler.si
      provider: !KeyOf provider_edge_traefik_dash

  # The VPS Technitium primary web UI application.
  - model: authentik_core.application
    id: app_edge_dns
    identifiers:
      slug: edge-technitium
    attrs:
      name: Technitium DNS (edge)
      meta_launch_url: https://dns.kogler.si
      provider: !KeyOf provider_edge_dns
  - model: authentik_core.application
    id: app_edge_logs
    identifiers:
      slug: edge-dozzle
    attrs:
      name: Dozzle (edge)
      meta_launch_url: https://logs.kogler.si
      provider: !KeyOf provider_edge_logs

  # --- applications for the *.ts.kogler.si twins (tailnet edge) ---
  - model: authentik_core.application
    id: app_edge_stats_ts
    identifiers:
      slug: edge-grafana-ts
    attrs:
      name: Grafana (tailnet ts)
      meta_launch_url: https://stats.ts.kogler.si
      provider: !KeyOf provider_edge_stats_ts
  # No Metabase `.ts` application entry — see the note on the plain group above.
  - model: authentik_core.application
    id: app_edge_auto_ts
    identifiers:
      slug: edge-n8n-ts
    attrs:
      name: n8n (tailnet ts)
      meta_launch_url: https://auto.ts.kogler.si
      provider: !KeyOf provider_edge_auto_ts
  - model: authentik_core.application
    id: app_edge_traefik_dash_ts
    identifiers:
      slug: edge-traefik-dash-ts
    attrs:
      name: Traefik Dashboard (tailnet ts)
      meta_launch_url: https://traefik.ts.kogler.si
      provider: !KeyOf provider_edge_traefik_dash_ts
  - model: authentik_core.application
    id: app_edge_logs_ts
    identifiers:
      slug: edge-dozzle-ts
    attrs:
      name: Dozzle (tailnet ts)
      meta_launch_url: https://logs.ts.kogler.si
      provider: !KeyOf provider_edge_logs_ts
  - model: authentik_core.application
    id: app_edge_csui_ts
    identifiers:
      slug: edge-crowdsec-ui-ts
    attrs:
      name: CrowdSec UI (tailnet ts)
      meta_launch_url: https://csui.ts.kogler.si
      provider: !KeyOf provider_edge_csui_ts

  - model: authentik_outposts.outpost
    id: outpost_embedded
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      type: proxy
      deployment_type: local
      providers:
        - !KeyOf provider_edge_stats
        - !KeyOf provider_edge_auto
        - !KeyOf provider_edge_pdf
        - !KeyOf provider_edge_home
        - !KeyOf provider_edge_home_home
        - !KeyOf provider_edge_traefik_dash
        - !KeyOf provider_edge_dns
        - !KeyOf provider_edge_logs
        - !KeyOf provider_edge_stats_ts
        - !KeyOf provider_edge_auto_ts
        - !KeyOf provider_edge_traefik_dash_ts
        - !KeyOf provider_edge_logs_ts
        - !KeyOf provider_edge_csui_ts
