      meta_launch_url: https://csui.ts.kogler.si
      provider: !KeyOf provider_edge_csui_ts

  - model: authentik_outposts.outpost
    id: outpost_embedded
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      type: proxy
      deployment_type: local
      providers:
        - !KeyOf provider_edge_stats
        - !KeyOf provider_edge_sec
        - !KeyOf provider_edge_auto
        - !KeyOf provider_edge_pdf
        - !KeyOf provider_edge_home
        - !KeyOf provider_edge_home_home
        - !KeyOf provider_edge_traefik_dash
        - !KeyOf provider_edge_dsh
        - !KeyOf provider_edge_pi_dev
        - !KeyOf provider_edge_stats_ts
        - !KeyOf provider_edge_sec_ts
        - !KeyOf provider_edge_auto_ts
        - !KeyOf provider_edge_traefik_dash_ts
        - !KeyOf provider_edge_logs_ts
        - !KeyOf provider_edge_csui_ts
