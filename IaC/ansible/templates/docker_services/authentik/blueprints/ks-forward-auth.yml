      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # --- HD-297 (2026-08-31): Pattern-A sidecar UIs on the tailnet edge — plain names
  # carry forward-auth (SSO) like the observability apps; the *.ts twins are
  # ACL-gated only (no provider needed — dsh-ts/pi-ts routes skip the middleware).
  - model: authentik_providers_proxy.proxyprovider
    id: provider_edge_dsh
    identifiers:
