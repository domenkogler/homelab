      provider: !KeyOf provider_edge_pi_dev

  # --- HD-135b follow-up: applications for the *.ts.kogler.si twins (tailnet edge) ---
  - model: authentik_core.application
    id: app_edge_stats_ts
    identifiers:
      slug: edge-grafana-ts
    attrs:
      name: Grafana (tailnet ts)
      meta_launch_url: https://stats.ts.kogler.si
      provider: !KeyOf provider_edge_stats_ts
  - model: authentik_core.application
    id: app_edge_sec_ts
    identifiers:
      slug: edge-metabase-ts
    attrs:
      name: Metabase (tailnet ts)
      meta_launch_url: https://sec.ts.kogler.si
      provider: !KeyOf provider_edge_sec_ts
  - model: authentik_core.application
    id: app_edge_auto_ts
    identifiers:
      slug: edge-n8n-ts
    attrs:
      name: n8n (tailnet ts)
      meta_launch_url: https://auto.ts.kogler.si
      provider: !KeyOf provider_edge_auto_ts
  - model: authentik_core.application
    id: app_edge_traefik_dash_ts
