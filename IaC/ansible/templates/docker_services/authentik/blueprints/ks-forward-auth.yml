      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: app_edge_stats
    identifiers:
      slug: edge-grafana
    attrs:
      name: Grafana (edge)
      meta_launch_url: https://stats.kogler.si
      provider: !KeyOf provider_edge_stats
  - model: authentik_core.application
    id: app_edge_sec
    identifiers:
      slug: edge-metabase
