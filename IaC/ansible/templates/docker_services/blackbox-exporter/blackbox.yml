# blackbox-exporter probe modules — prometheus/blackbox-exporter
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 301, 302, 401, 403]
      follow_redirects: true
  icmp:
    prober: icmp
    timeout: 5s
  tcp_connect:
    prober: tcp
    timeout: 5s
  dns_udp:
    prober: dns
    dns:
      query_name: kogler.si
      query_type: A