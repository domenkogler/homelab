[router]
router.kogler.si

[switch]
switch.kogler.si

# Parent group for network devices — group_vars/network.yml supplies
# the VLAN-99 management IP, derived from SSOT network_static_hosts.
[network:children]
router
switch

[vps]
vps.kogler.si

[home_servers]
oldsrv.kogler.si              # Phase 1: bare-metal Debian desktop + Docker host (runs the full service stack)
# <proxmox-host>.kogler.si    # Phase 2: future Proxmox host (name TBD)

[storage]
nas.kogler.si                 # HP MicroServer Gen8 — ZFS storage server (NO Docker)

[raspberry_pi]
pi.kogler.si                 # RPi4 — HA primary node (ha.kogler.si is the VIP); preseed-installed, ansible-admin

[docker_hosts:children]
vps
home_servers

# Hosts that run the Alloy collector + Grafana provisioning (the observability tier).
# Per-node model (HD-135b/HD-341): every node runs its OWN Alloy host-exporter and
# remote_writes to the VPS Victoria backend. oldsrv also scrapes the shared home
# exporters (nut/zfs on nas), MikroTik SNMP + network-clients; nas/pi ship their own
# node_* metrics directly (nas runs NO Docker — Alloy installs via apt, host exporter only).
[monitoring]
oldsrv.kogler.si            # collector — own node_* + scraps nas nut/zfs exporters, MikroTik SNMP, network-clients
vps.kogler.si               # backend host — runs Prometheus/Loki/Grafana + its own Alloy
nas.kogler.si               # per-node Alloy host-exporter (no Docker; apt-installed) — ships nas node_* to VPS
pi.kogler.si                # Phase-4 HA primary + Alloy collector — ships pi node_* to VPS

# Var-carrying group (Wave-3 triage 2026-08-22): loads group_vars/subscriptions.yml (the
# renewal SSOT) on hosts that render its consumers — Homepage tiles/widgets, n8n renewals.
# The file was orphaned until now: no such group existed, so the first post-HD-180 homepage
# render failed 'subscriptions is undefined'. Homepage lives on the VPS (HD-180).
[subscriptions]
vps.kogler.si
[all:vars]
ansible_python_interpreter=/usr/bin/python3

[localhost]
localhost ansible_connection=local