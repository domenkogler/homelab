---
# Ansible collections required by the homelab roles.
collections:
  - name: community.general        # onepassword lookup, zfs/zpool modules + cloudflare_dns (playbooks/dns.yml)
  - name: community.routeros      # MikroTik RouterOS REST API modules (vlan, dhcp, firewall, etc.)
  - name: community.docker        # docker_network, docker_compose_v2 modules (docker_services role)
  - name: community.dns           # DNS utilities — nameserver/hetzner/hosttech modules (net-dns tooling)