---
# maint-user.yml — HD-361: the interactive Cockpit login on nas + oldsrv.
#
# why-for-this-file — THE PART THAT IS NOT OBVIOUS: Debian/Ubuntu ship /etc/pam.d/cockpit
# with **no group restriction at all** (verified on cockpit-ws 337-1+deb13u2: auth is
# pam_sepermit + `substack common-auth`, nothing else). So the group name `cockpit-session`
# is decoration unless something enforces it, and the real posture of :9090 today is "anyone
# with a local password gets a session" — which on oldsrv means `domen`, who holds both a
# password and group `sudo`, i.e. a leaked password = a root-capable web session. Therefore
# provisioning `maint` WITHOUT the pam_succeed_if line below would WIDEN the attack surface
# (one more password holder) while pretending to narrow it. Both halves land together or not
# at all: create the account, then make the group actually admit logins.
#
# Contract being implemented (todo.md HD-361, docs/deployment-secrets.md):
#   * The vault item (`oldsrv-cockpit_login` / `nas-cockpit_login`, owner-minted) is the
#     recovery copy. The host stores only a crypt hash in /etc/shadow, which is root-readable.
#     Never a plaintext on disk, never in /etc/passwd, never a Jinja literal.
#   * `maint`'s membership is an EXACT SET, rebuilt every converge: `cockpit-session` (the
#     console gate) + `sudo` (owner decision 2026-09-21, so the web-tty can reach root behind
#     the interactive password) + its own primary group. `append: false` is what makes that
#     auditable — a `docker` or `lxd` membership hand-added on the box is dropped by the next
#     converge instead of quietly persisting. What is NOT granted: a NOPASSWD sudoers fragment
#     (asserted against below, not assumed), an SSH key, or an `AllowUsers` entry.
#   * No SSH keys, and the existing `AllowUsers` (ansible-admin, ai-debug) keeps it off SSH —
#     verified below rather than assumed.
#   * FAIL-CLOSED (HD-91): no vault value -> the run dies before the box is touched. An empty
#     string is specifically trapped because 1Password's duplicate-field shape bug produces
#     exactly that (docs/deployment-secrets.md §"Verify by length AND shape").
#
# Idempotency, without a controller dependency: the controller venv has no `passlib`, so
# `password_hash` is unavailable, and `chpasswd` was rejected — the hosts' own default is
# yescrypt (login.defs ENCRYPT_METHOD), which nothing off-box can then verify against the
# vault value. Instead the hash is made ON THE TARGET with `openssl passwd -6` using a salt
# derived from the *item name*. A salt's job is uniqueness and rainbow-resistance, not
# secrecy, so deriving it is sound; the payoff is that the same vault value in produces a
# byte-identical hash, so the `user` module reports ok on every converge after the first, and
# the verification step below can prove the installed hash IS the vault value.
# PAM/pam_unix verifies $6$ transparently even where the local default is yescrypt.

- name: HD-361 | Assert this host names its own maint vault item
  ansible.builtin.assert:
    that:
      - cockpit_maint_vault_item is defined
      - cockpit_maint_vault_item is string
      - cockpit_maint_vault_item | length > 0
    fail_msg: >-
      cockpit_maint_vault_item is unset for {{ inventory_hostname }}. Set it in
      host_vars/{{ inventory_hostname }}.yml to this host's own item ('<host>-cockpit_login') —
      sharing one item between oldsrv and nas would give two management consoles the same password,
      which is the opposite of why there are two items.
    success_msg: "provisioning {{ cockpit_maint_user }} from {{ cockpit_maint_vault_item }}"
  changed_when: false

- name: HD-361 | Refuse to provision from an empty or absurdly short vault value
  ansible.builtin.assert:
    that:
      - cockpit_maint_password | default('') | length >= 16
    fail_msg: >-
      '{{ cockpit_maint_vault_item }}' resolved to nothing usable in vault '{{ op_vault }}'.
      Mint it with `bash scripts/provision-vault.sh` (it is in the CATALOG), and if it exists
      but reads empty, suspect the duplicate-field shape bug — `op read
      op://{{ op_vault }}/{{ cockpit_maint_vault_item }}/password | wc -c` must be non-zero.
  no_log: true

- name: HD-361 | Ensure the gate group exists (not packaged by cockpit-ws on Debian)
  ansible.builtin.group:
    name: "{{ cockpit_maint_group }}"
    state: present

- name: HD-361 | Crypt the maint password on the target (salt = item name, so it is stable)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      salt=$(printf '%s' '{{ cockpit_maint_vault_item }}' | sha256sum | cut -c1-16)
      printf '%s' "$MAINT_PW" | openssl passwd -6 -salt "$salt" -stdin
    executable: /bin/bash
  environment:
    MAINT_PW: "{{ cockpit_maint_password }}"
  register: cockpit_maint_hash
  changed_when: false
  no_log: true

- name: HD-361 | Provision {{ cockpit_maint_user }} with its exact group set
  ansible.builtin.user:
    name: "{{ cockpit_maint_user }}"
    comment: "Cockpit management seat (HD-361) - not a human account, no SSH"
    shell: /bin/bash # the web-tty is Cockpit's whole point; a nologin shell would kill it
    home: "/home/{{ cockpit_maint_user }}"
    create_home: true
    groups: "{{ [cockpit_maint_group] + (['sudo'] if cockpit_maint_sudo_group | bool else []) }}"
    append: false # exact set: drops any membership added by hand on the box
    password: "{{ cockpit_maint_hash.stdout | trim }}"

- name: HD-361 | Enforce the seat's home mode (0750, owned by the seat itself)
  # Own task because `home_mode` is NOT a `user` parameter — live: this converge died on nas with
  # "Unsupported parameters for (ansible.builtin.user) module: home_mode", which --syntax-check
  # cannot see (module args are validated at runtime, not at parse time). `create_home` also only
  # applies on first creation, so a home a human chmod'd would otherwise keep that mode forever.
  ansible.builtin.file:
    path: "/home/{{ cockpit_maint_user }}"
    state: directory
    owner: "{{ cockpit_maint_user }}"
    group: "{{ cockpit_maint_user }}"
    mode: '0750'

- name: HD-361 | Add any additional console logins to the gate group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ [cockpit_maint_group] }}"
    append: true
  loop: "{{ cockpit_session_members | difference([cockpit_maint_user]) }}"
  when: cockpit_session_members | difference([cockpit_maint_user]) | length > 0

# --- the control itself ------------------------------------------------------------------------------
- name: HD-361 | Confirm the PAM module exists before referencing it
  ansible.builtin.shell:
    cmd: >-
      ls /usr/lib/x86_64-linux-gnu/security/pam_succeed_if.so
         /lib/x86_64-linux-gnu/security/pam_succeed_if.so 2>/dev/null | head -n1
  register: cockpit_pam_module
  # Fail on the ANSWER, not the exit code: `ls` exits non-zero when either candidate path is
  # absent, and one of these two is always the symlink — so an rc check fails a perfectly healthy
  # host. What must hold is that the module exists somewhere.
  failed_when: cockpit_pam_module.stdout | length == 0
  changed_when: false
  when: cockpit_maint_pam_gate | bool

- name: HD-361 | Refuse to edit the PAM stack if the anchor line is not where we think it is
  # lineinfile with an unmatched insertbefore APPENDS, and an `auth` line parked after the
  # `session` rules would be silently ignored — a gate that looks deployed and is inert.
  # So: fail loudly instead of writing a placebo.
  ansible.builtin.command:
    cmd: grep -qE '^auth[[:space:]]+required[[:space:]]+pam_sepermit\.so' /etc/pam.d/cockpit
  register: cockpit_pam_anchor
  changed_when: false
  failed_when: cockpit_pam_anchor.rc != 0
  when: cockpit_maint_pam_gate | bool

- name: HD-361 | Strip any malformed earlier variant of the gate line
  # Must run BEFORE the lineinfile: that task's regexp is end-anchored (`\s*$`), so it will not
  # recognise the line this leg first wrote on nas — `... cockpit-session quiet_use_uid # HD-361:
  # the group is the gate` — and would have happily inserted a second, correct rule underneath the
  # broken one. Two rules, the first of which is `requisite` and fails to parse, means the fix
  # changes nothing. Anything in this family that carries trailing junk is removed here; the
  # canonical single line is then written by the task below.
  ansible.builtin.replace:
    path: /etc/pam.d/cockpit
    regexp: '(?m)^auth\s+requisite\s+pam_succeed_if\.so\s+user\s+ingroup\s+{{ cockpit_maint_group }}(?!\s*$).*$\n'
    replace: ''
  when: cockpit_maint_pam_gate | bool

- name: HD-361 | Make {{ cockpit_maint_group }} the gate for every Cockpit login
  # NO trailing comment and NO options on this line — learned the hard way on nas. A PAM file has
  # no trailing-comment syntax: every token after the module name is an ARGUMENT, so the
  # provenance comment I first wrote here was parsed as more condition tokens and pam_succeed_if
  # answered `incomplete condition detected`. Under `requisite` that becomes PAM_MODULE_ERROR ->
  # cockpit-ws HTTP 500 {"problem":"internal-error","message":"Error in service module"} for
  # EVERY user — the deny-everyone failure mode the guard header warns about, produced by the very
  # change that was supposed to add a login. So the rule line stays machine-minimal and the
  # provenance goes on its own comment line, in its own task: lineinfile replaces the entire line
  # its regexp matches, so one task writing a 3-line block would duplicate the comment every
  # converge. The regexps are anchored to end-of-line for the same reason — a stale line carrying
  # trailing junk must be replaced, not treated as already-correct.
  ansible.builtin.lineinfile:
    path: /etc/pam.d/cockpit
    regexp: '^auth\s+requisite\s+pam_succeed_if\.so\s+user\s+ingroup\s+{{ cockpit_maint_group }}\s*$'
    line: "auth     requisite  pam_succeed_if.so user ingroup {{ cockpit_maint_group }}"
    insertbefore: '^auth\s+required\s+pam_sepermit\.so'
    firstmatch: true
    mode: '0644'
  when: cockpit_maint_pam_gate | bool

- name: HD-361 | Label the gate line so a future human knows who owns it
  # Directly above the rule. Without it the line reads as an unexplained restriction in a file
  # nobody owns, and the third person to find it deletes it.
  ansible.builtin.lineinfile:
    path: /etc/pam.d/cockpit
    regexp: '^# homelab:HD-361 cockpit gate$'
    line: "# homelab:HD-361 cockpit gate - only {{ cockpit_maint_group }} members may log in; owned by roles/cockpit"
    insertbefore: '^auth\s+requisite\s+pam_succeed_if\.so\s+user\s+ingroup\s+{{ cockpit_maint_group }}\s*$'
    firstmatch: true
    mode: '0644'
  when: cockpit_maint_pam_gate | bool

# --- verification (provable claims only; the browser login stays the owner's acceptance test) --------
- name: HD-361 | Read back group memberships
  ansible.builtin.command:
    cmd: id -nG {{ cockpit_maint_user }}
  register: cockpit_maint_id
  changed_when: false

- name: HD-361 | Read back the installed shadow hash
  ansible.builtin.command:
    cmd: getent shadow {{ cockpit_maint_user }}
  register: cockpit_maint_shadow
  changed_when: false
  no_log: true

- name: HD-361 | Read back how far {{ cockpit_maint_user }} can escalate
  ansible.builtin.command:
    cmd: sudo -l -U {{ cockpit_maint_user }}
  register: cockpit_maint_sudo
  changed_when: false
  become: true
  failed_when: false # `sudo -l` exits non-zero for a user with no sudoers entry; the assert reads the text

- name: HD-361 | Read back who SSH may reach
  # Extracted with grep on the TARGET, not regex_findall in Jinja: the first version used the POSIX
  # class `[[:space:]]`, which ERE accepts and Python's re does not, so the clause raised inside re
  # — and the censored assert hid that fact. `sshd -T` does NOT fold its repeated `allowusers`
  # lines (nas emits one per line), so they are joined into one token list here.
  ansible.builtin.shell:
    cmd: /usr/sbin/sshd -T | grep -i '^allowusers ' | cut -d' ' -f2- | tr '\n' ' '
    executable: /bin/bash
  register: cockpit_sshd_allowusers
  changed_when: false
  become: true

- name: HD-361 | Read back the gate line and the password stack as line numbers
  # Two numbers: <gate line> <common-auth line>. Resolved on the target rather than indexed in
  # Jinja, because `.0` on an empty list ERRORS and `default()` only catches undefined — an absent
  # gate would have blown up the assert instead of failing it with a readable message.
  ansible.builtin.shell:
    cmd: |
      gate=$(grep -nE '^auth\s+requisite\s+pam_succeed_if\.so\s+user\s+ingroup\s+{{ cockpit_maint_group }}\s*$' /etc/pam.d/cockpit | head -n1 | cut -d: -f1)
      pass=$(grep -nE '^auth\s+(substack|include)\s+common-auth\b' /etc/pam.d/cockpit | head -n1 | cut -d: -f1)
      printf '%s %s\n' "${gate:-none}" "${pass:-none}"
    executable: /bin/bash
  register: cockpit_pam_stack
  changed_when: false

# THE ACCEPTANCE TEST, i.e. the only check that answers why this account exists at all:
# does `maint` + the vault password actually get a Cockpit session? Everything above proves the
# account is *shaped* right; none of it proves the console opens, and HD-361's whole premise is
# that nas's console has NEVER opened. So the converge asks cockpit-ws itself, over the local
# socket, on the endpoint its own shell uses. The shape is measured, not assumed (2026-09-23):
#   GET /cockpit/login  +  Basic auth   -> 200 on success
#                                     -> 401 {"problem":"authentication-failed"} on a bad credential
# (POST is 405 here, and `GET /` answers 200 UNAUTHENTICATED — a status probe on `/` would pass
# on a host where login is impossible, which is exactly the fake-green this replaces.)
#
# Only the SUCCESS attempt is scripted. A deliberate wrong-password task would fire a failing
# PAM conversation on every single converge from a fixed source, which is how pam_faillock /
# brute-force defences get tripped by the configuration manager — the negative control was taken
# by hand once (see the 401 `authentication-failed` above) and is not repeated per converge.
- name: HD-361 | Prove the console actually opens for {{ cockpit_maint_user }} (real PAM login)
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/cockpit/login
    # cockpit-ws answers this endpoint on the local socket; no TLS, no SNI, no Host rewrite —
    # cockpit-ws requires the browser Origin to match its Host, which is why the real test from
    # off-box must go through the traefik route, not straight at this port.
    method: GET
    url_username: "{{ cockpit_maint_user }}"
    url_password: "{{ cockpit_maint_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    timeout: 20
    # Tolerate the wrong answers at the module layer so the assert below can name them; `uri`
    # raises on an unexpected status before `failed_when` ever sees it.
    status_code: [200, 401, 403, 500]
  register: cockpit_maint_login
  no_log: true            # the Basic header carries the vault password
  changed_when: false
  failed_when: false      # diagnose in the SAME run, below — see why this matters
  when:
    - not (ansible_check_mode | bool)
    - cockpit_maint_verify_login | default(true) | bool
  retries: 4
  delay: 5
  until: cockpit_maint_login.status | default(0) == 200

# no_log is what the probe needs and what makes its failure unreadable: the first real run of
# this leg failed with `{"attempts": 3, "censored": "the output has been hidden..."}` and left me
# to go reproduce the request through an SSH tunnel to learn it was an HTTP 500. So the failure
# path now prints the two things that actually diagnose it, NEITHER of which is secret: what
# cockpit answered, and the last PAM lines from the journal. That is how the malformed gate line
# was found (`pam_succeed_if: incomplete condition detected`) instead of guessed at.
- name: HD-361 | Show what the console answered and what PAM said about it
  ansible.builtin.shell:
    cmd: |
      echo "cockpit-ws answered: status={{ cockpit_maint_login.status | default('no response') }} problem={{ cockpit_maint_login.json.problem | default('-') }} message={{ cockpit_maint_login.json.message | default('-') }}"
      echo "--- last cockpit/PAM lines on the host ---"
      journalctl --no-pager -n 200 --since "-3 minutes" 2>/dev/null | grep -iE "pam_.*cockpit|cockpit-session|cockpit-ws|pam_succeed_if" | tail -6 || echo "(journal not readable without privilege here)"
    executable: /bin/bash
  register: cockpit_maint_probe_diag
  changed_when: false
  when:
    - not (ansible_check_mode | bool)
    - cockpit_maint_verify_login | default(true) | bool
    - (cockpit_maint_login.status | default(0)) != 200

- name: HD-361 | Fail unless the console actually opened for {{ cockpit_maint_user }}
  ansible.builtin.assert:
    that:
      - (cockpit_maint_login.status | default(0)) == 200
    fail_msg: >-
      Cockpit did NOT open for {{ cockpit_maint_user }} on {{ inventory_hostname }} (status
      {{ cockpit_maint_login.status | default('no response') }} /
      {{ cockpit_maint_login.json.problem | default('-') }}). Read the PAM lines printed by the
      task above — 401 means the credential or the group gate, 500 means the PAM line itself is
      malformed (it is being parsed as module arguments), no response means cockpit is not
      listening on 9090. This is the row's acceptance test; leaving it green without this is how
      HD-361 sat "done but unusable" for days.
  when:
    - not (ansible_check_mode | bool)
    - cockpit_maint_verify_login | default(true) | bool

# Every clause is evaluated into a NAMED verdict first. Two reasons, both earned today:
# (1) the assert below must run WITHOUT no_log, because nothing in it is secret, so a failure has to
# NAME the broken contract — a bare `false` among nine `that:` entries tells you nothing at 23:00;
# (2) when one clause RAISED instead of returning false (see the `[[:space:]]` note above), no_log
# on the assert censored the traceback, which was the only description of the bug. Doing the work
# here also keeps the shadow hash and the `sudo -l` text from ever being echoed.
- name: HD-361 | Evaluate the maint contract clause by clause
  ansible.builtin.set_fact:
    cockpit_maint_problems: >-
      {{ []
         + ([] if (cockpit_maint_id.stdout.split() | sort)
                    == (([cockpit_maint_group, cockpit_maint_user]
                         + (['sudo'] if cockpit_maint_sudo_group | bool else [])) | sort)
            else ['group-set-not-exactly-as-decided'])
         + ([] if not (cockpit_maint_sudo_group | bool)
              or ('NOPASSWD' not in (cockpit_maint_sudo.stdout | default('')))
            else ['sudo-is-passwordless-for-a-console-identity'])
         + ([] if (cockpit_maint_shadow.stdout.split(':')[1] | default('')) == (cockpit_maint_hash.stdout | trim)
            else ['installed-hash-differs-from-vault-value'])
         + ([] if (cockpit_sshd_allowusers.stdout | trim | length) > 0
            else ['sshd-has-no-allowusers-gate'])
         + ([] if cockpit_maint_user not in (cockpit_sshd_allowusers.stdout.split())
            else ['maint-appears-in-allowusers'])
         + ([] if (cockpit_pam_stack.stdout.split() | length) == 2
                         and 'none' not in (cockpit_pam_stack.stdout.split())
                         and ((cockpit_pam_stack.stdout.split() | first) | int)
                             < ((cockpit_pam_stack.stdout.split() | last) | int)
            else ['pam-gate-missing-or-ordered-after-common-auth']) }}
  no_log: true

- name: HD-361 | Verify the account, the group set, the credential and the two gates
  ansible.builtin.assert:
    that:
      - cockpit_maint_problems | length == 0
    fail_msg: >-
      maint contract violated on {{ inventory_hostname }}: {{ cockpit_maint_problems | join(', ') }}.
      Groups now [{{ cockpit_maint_id.stdout }}]. What each name means:
      group-set-not-exactly-as-decided = a membership appeared or vanished (the rebuild uses
      `append: false`, so a hand-edit cannot survive a converge; if this fires DURING a converge the
      role itself changed and must be re-read); sudo-is-passwordless-for-a-console-identity = a
      sudoers fragment grants NOPASSWD to a break-glass account, forbidden by the 2026-09-21
      decision; installed-hash-differs-from-vault-value = vault and host disagree, so rotate
      DELIBERATELY instead of "fixing" one side; sshd-has-no-allowusers-gate /
      maint-appears-in-allowusers = this console account is reachable over SSH, which was not
      decided; pam-gate-missing-or-ordered-after-common-auth = the gate is absent or inert (an
      `auth` rule after the `session` rules parses but enforces nothing).
