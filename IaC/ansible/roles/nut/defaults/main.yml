---
# nut role defaults — UPS NUT master (nas) / clients (oldsrv, ha).
# Mode is driven per-host by `nut_mode` (master | client) set in host_vars.
# Secrets (upsmon passwords, notify SMTP/Signal) resolve from 1Password at
# render time — never hardcoded.

# Master endpoint used by clients.
nut_host: nas.kogler.si

# --- Master (usbhid-ups, USB HID to the PowerWalker VFI ICT/ICR IoT 3000) ---
nut_driver: usbhid-ups
nut_serial: auto
nut_listen_ip: 10.10.1.10        # nas Home-VLAN IP — upsd listens here (intra-VLAN)

# --- Per-host shutdown delay (seconds) — set in host_vars ---
# shutdown_delay_seconds: 0      # nas/ha power down immediately
# shutdown_delay_seconds: 60     # oldsrv — flush Grafana→n8n→Signal before powerdown

# --- Per-host charge threshold for shutdown (percent) ---
# While on battery, halt this host once battery.charge drops to <= this value.
#   oldsrv = 75  (the power hog — halts early to preserve battery for nas/pi)
#   nas/pi  = 0  (default — never halt on charge; rely on the upsmon LOWBATT
#                 SHUTDOWNCMD = critical-only policy, battery <20% / runtime <5min)
# 0 also disables the upssched charge-poll timer for that host.
nut_shutdown_charge_threshold: 0

# --- Wake-after-recharge (WoL) — MASTER ONLY ---
# When mains returns and the battery recharges to >= nut_wake_charge (default 90%),
# the master sends WoL magic packets to every client in nut_wake_macs that halted
# itself at its charge threshold (e.g. oldsrv at 75%). Disabled by default; enable
# on the master host_vars (e.g. nas: nut_wake_enabled: true, nut_wake_macs: {oldsrv: MAC}).
# Requires `wakeonlan` package on the master; clients need WoL from S5 (BIOS + ethtool wol g).
ut_wake_enabled: false
nut_wake_charge: 90
# hostname -> MAC address (lowercase, colons). Empty by default — no WoL sent.
ut_wake_macs: {}

# --- nut_exporter (single SSOT exporter, run as a HOST binary on master;
# nas has no Docker). PINNED to v3.3.0 (HD-315, 2026-09-04): the earlier
# `@latest` drifted onto a `(devel)` build; v3.3.0 is the latest tagged
# release (2026-05-15) and the binary is already deployed on nas. Renovate
# trails this tag (version-review single-sheet, HD-156).
nut_exporter: true
nut_exporter_release: "v3.3.0"
# nut_exporter_arch/listen/vars keep the defaults below (amd64/:9199).
nut_exporter_arch: amd64         # nas is x86_64
nut_exporter_listen: ":9199"
# Exporter `--nut.vars_enable` — must include battery.runtime (+ .low) so the
# "Critical = battery < 20% or runtime < 5 min" alert is possible (docs/hardware-ups.md).
nut_exporter_vars: "battery.charge,battery.charge.low,battery.runtime,battery.runtime.low,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,output.voltage,ups.load,ups.status"

# --- Notify (upssched-cmd) — direct email + optional Signal on ONBATT/LOWBATT,
# independent of Grafana/n8n. Recipient + SMTP creds from 1Password Homelab-ansible.
nut_notify_email: "{{ lookup('community.general.onepassword', 'smtp_login', field='username', vault=op_vault) }}"

# upsmon auth password (shared between upsd.users / upsd + clients) — 1Password at render.
nut_upsmon_password: "{{ lookup('community.general.onepassword', 'nut_password', field='password', vault=op_vault) }}"
# nut_exporter upsd auth user/password — dedicated read-only `upsmon slave` user in
# upsd.users (1Password item `nut-exporter_password`, single `_` per SSOT convention).
nut_exporter_user: nut_exporter
nut_exporter_password: "{{ lookup('community.general.onepassword', 'nut-exporter_password', field='password', vault=op_vault) }}"
nut_smtp_server: ""   # SMTP relay host — config (group_vars), NOT a 1Password secret
# Fail-closed (HD-91): nut_notify_email already hard-requires smtp_login above, so there
# is no reason for these to silently default to empty — a missing item must abort the render,
# not send an unauthenticated SMTP attempt masked by the || true fallback in upssched-cmd.
nut_smtp_user: "{{ lookup('community.general.onepassword', 'smtp_login', field='username', vault=op_vault) }}"
nut_smtp_pass: "{{ lookup('community.general.onepassword', 'smtp_login', field='password', vault=op_vault) }}"
# Optional: absolute path to a helper that sends a Signal message as $1
# (e.g. a wrapper around signal-cli). Leave empty to skip Signal from NUT.
nut_signal_helper: ""
