---
# nut role — UPS monitoring & shutdown (docs/hardware-ups.md, observability.md).
# Mode-driven: master = nas (usbhid-ups + upsd + nut_exporter on the HOST —
# nas has no Docker); client = oldsrv/ha (upsmon slave + per-host shutdown
# delay). Must run BEFORE the `monitoring` role (monitoring scrapes the exporter).
- name: Refuse NUT runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      nut role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Require nut_mode is set per host
  assert:
    that:
      - nut_mode is defined
      - nut_mode in ['master', 'client']
    fail_msg: "nut_mode must be 'master' or 'client' for {{ inventory_hostname }}"
  tags: always

- name: Set NUT packages by mode
  set_fact:
    _nut_packages: "{{ ['nut-server', 'nut', 'nut-client'] if nut_mode == 'master' else ['nut-client'] }}"

- name: Install NUT packages
  apt:
    name: "{{ _nut_packages }}"
    state: present
    update_cache: true

- name: Configure /etc/nut/nut.conf (mode)
  template:
    src: nut.conf.j2
    dest: /etc/nut/nut.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart nut services

- name: Configure /etc/nut/ups.conf (master — USB HID driver)
  template:
    src: ups.conf.j2
    dest: /etc/nut/ups.conf
    owner: root
    group: nut
    mode: '0640'
  when: nut_mode == 'master'
  notify: restart nut services

# HD-467 — the ordering half of the fix. nas gets its Home address from DHCP and the
# distro unit orders only after network.target, which means "configured", not "address
# assigned". upsd binds each LISTEN ONCE at start-up, so a boot that wins the race leaves
# the master serving loopback only forever — live proof: `not listening on <the Home address> port
# 3493` from 2026-09-14 with the unit never restarted since, while `ip addr` shows the
# address present now. network-online.target is provided here by NetworkManager-wait-online
# (both enabled on nas), so this drop-in is what actually waits for the lease.
- name: Create the nut-server drop-in directory (master)
  file:
    path: /etc/systemd/system/nut-server.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: nut_mode == 'master'
  notify: restart nut services

- name: Order nut-server after the network is actually up (master)
  copy:
    content: |
      # managed by Ansible — nut role (HD-467): upsd binds every LISTEN once at start-up,
      # so it must not start before the Home-VLAN address exists.
      [Unit]
      Wants=network-online.target
      After=network-online.target
    dest: /etc/systemd/system/nut-server.service.d/10-network-online.conf
    owner: root
    group: root
    mode: '0644'
  when: nut_mode == 'master'
  notify: restart nut services

- name: Configure /etc/nut/upsd.conf (master)
  template:
    src: upsd.conf.j2
    dest: /etc/nut/upsd.conf
    owner: root
    group: nut
    mode: '0640'
  when: nut_mode == 'master'
  notify: restart nut services

- name: Configure /etc/nut/upsd.users (master — auth for remote slaves)
  template:
    src: upsd.users.j2
    dest: /etc/nut/upsd.users
    owner: root
    group: nut
    mode: '0640'
  when: nut_mode == 'master'
  notify: restart nut services

- name: Configure /etc/nut/upsmon.conf (master)
  template:
    src: upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: nut
    mode: '0640'
  when: nut_mode == 'master'
  notify: restart nut services

- name: Configure /etc/nut/upsmon.conf (client slave)
  template:
    src: upsmon-client.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: root
    mode: '0640'
  when: nut_mode == 'client'
  notify: restart nut services

- name: Configure /etc/nut/upssched.conf (both)
  template:
    src: upssched.conf.j2
    dest: /etc/nut/upssched.conf
    owner: root
    group: nut
    mode: '0640'
  notify: restart upsmon (all modes)

- name: Deploy upssched-cmd (both modes — master notifies, all hosts do deferred shutdown)
  template:
    src: upssched-cmd.j2
    dest: /etc/nut/upssched-cmd
    owner: root
    group: nut
    mode: '0750'        # 0750: not world-readable — master's copy embeds SMTP creds at render time; nut (group) must execute it.

# Remove any stray ACL on upssched-cmd and restore the execute bits. A hand-applied
# ACL (group::r--) strips the group-execute bit even though the mode is 0750, which
# breaks `nut` running the script (exec_cmd 126 — HD-06 live drill 2026-09-09).
# NOTE: `setfacl -b` alone does NOT restore group perms — it only removes ACL entries;
# the group class stays at the last ACL value (r--) until an explicit chmod. So always
# follow with chmod 0750 (verified live 2026-09-09: template mode:'0750' then setfacl -b
# left the file at 0740 and nut still could not exec).
#
# HD-452 (2026-09-25): the repair task used to carry `changed_when: true` under `tags:
# always`, so EVERY converge of EVERY tag on every nut host reported `changed=1` forever.
# That is not a cosmetic wart: `changed` is the one number that means "this converge did
# something you did not ask for", and a permanently-yellow count is how a real surprise
# hides. The verdict is now READ, not asserted — probe first (never changes anything,
# runs under --check too), repair only when the probe says the file is actually wrong.
# ⚠ The probe's three conditions are the defect, not an invention: mode 750 (execute for
# owner+group), no NAMED ACL entries, and a group class that still carries `x` — the last
# one is the 2026-09-09 failure (a hand-applied `group::r--`), which a mode-only check
# would happily pass while nut could not exec the script.
# ⚙ awk note, learned the hard way on the first run of this task: a base `group::r-x` line
# splits with -F: into ("group", "", "r-x"), so the permissions are $3, NOT $2 — reading $2
# yields empty on every compliant file, which made the verdict demand a repair forever and
# reproduced the exact permanent-yellow this rewrite exists to remove.
- name: "Probe upssched-cmd mode + ACL state (drives the changed verdict; never mutates)"
  ansible.builtin.shell:
    cmd: |
      set -u
      f=/etc/nut/upssched-cmd
      mode="$(stat -c '%a' "$f" 2>/dev/null || echo absent)"
      named="$(getfacl -p --no-effective "$f" 2>/dev/null | grep -Ec '^(user|group):[^:]+:' || true)"
      grp="$(getfacl -p --no-effective "$f" 2>/dev/null | awk -F: '/^group::/{print $3; exit}')"
      echo "mode=${mode} named_acl=${named:-0} group_entry=${grp:-none}"
  args:
    executable: /bin/bash
  register: _acl_state
  changed_when: false
  check_mode: false        # a probe, not a mutation — --check must still be able to judge
  when: nut_mode is defined
  tags: always

- name: "Decide whether upssched-cmd actually needs the ACL repair (read, not assumed)"
  ansible.builtin.set_fact:
    nut_acl_needs_repair: >-
      {{ (_acl_state.stdout.split() | select('match', '^mode=') | first | default('mode=absent'))
           .replace('mode=', '') != '750'
         or (_acl_state.stdout.split() | select('match', '^named_acl=') | first | default('named_acl=9'))
           .replace('named_acl=', '') != '0'
         or 'x' not in (_acl_state.stdout.split() | select('match', '^group_entry=') | first | default('group_entry=none'))
                            .replace('group_entry=', '') }}
  when: nut_mode is defined
  tags: always

- name: "Clear stray ACL on upssched-cmd and restore mode 0750 (group nut must execute)"
  ansible.builtin.command:
    cmd: /bin/bash -c 'setfacl -b /etc/nut/upssched-cmd; chmod 0750 /etc/nut/upssched-cmd'
  args:
    executable: /bin/bash
  register: _acl_clear
  changed_when: true       # honest now: this task only runs when the probe found a defect
  when:
    - nut_mode is defined
    - nut_acl_needs_repair | default(true) | bool
  tags: always

# --- Shutdown execution — nut must be able to halt the host ---
# upsmon/upssched run as `nut` (RUN_AS_USER nut). nut has no polkit rights to
# /sbin/shutdown (verified live 2026-09-09: "Call to PowerOff failed: Interactive
# authentication required"). Without this entry the shutdown path can never fire.
- name: Allow nut to halt the host (sudoers)
  copy:
    content: "nut ALL=(root) NOPASSWD: /sbin/poweroff, /sbin/shutdown\n"
    dest: /etc/sudoers.d/nut
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  when: nut_mode is defined
  tags: always

# --- nut_exporter: single SSOT exporter, HOST binary on the master ---
# Resolve the release tag: pinned tag used as-is; '' / '@latest' → latest GitHub release.
# Guards: this is MASTER-ONLY (client hosts — Pi/oldsrv — never run the exporter; resolving
# on a client crashed the Pi provision dry-run 2026-09-03: `_nut_exporter_latest` unregistered
# → `'dict' has no attribute 'json'`). The uri result is parsed from `content` (no `body_format`),
# so `.json` is NOT available — parse explicitly.
- name: Resolve nut_exporter release tag from GitHub (master only, when not pinned)
  uri:
    url: https://api.github.com/repos/DRuggeri/nut_exporter/releases/latest
    return_content: true
  register: _nut_exporter_latest
  when:
    - nut_mode == 'master'
    - nut_exporter_release in ['', '@latest']
  tags: [nut_exporter]

- name: Determine final nut_exporter release tag (master only)
  set_fact:
    _nut_exporter_release: >-
      {{ nut_exporter_release if nut_exporter_release not in ['', '@latest']
         else (_nut_exporter_latest.content | from_json).tag_name }}
  when: nut_mode == 'master'
  tags: [nut_exporter]

- name: Download nut_exporter binary (master, host — nas has no Docker)
  get_url:
    url: "https://github.com/DRuggeri/nut_exporter/releases/download/{{ _nut_exporter_release }}/nut_exporter-{{ _nut_exporter_release }}-linux-{{ nut_exporter_arch }}"
    dest: /usr/local/bin/nut_exporter
    mode: '0755'
  when:
    - nut_mode == 'master'
    - nut_exporter
    - _nut_exporter_release | default('') != ''
  tags: [nut_exporter]

- name: Deploy nut_exporter systemd unit (master)
  template:
    src: nut_exporter.service.j2
    dest: /etc/systemd/system/nut_exporter.service
    owner: root
    group: root
    mode: '0644'
  when: nut_mode == 'master' and nut_exporter
  notify: restart nut_exporter

- name: Enable nut_exporter (master)
  systemd:
    name: nut_exporter
    state: started
    enabled: true
    daemon_reload: true
  when: nut_mode == 'master' and nut_exporter

# --- Wake-after-recharge (persistent systemd timer, master only) ---
# Replaces the transient upssched wake-check: a systemd timer polls the UPS every
# 60 s and sends WoL to halted clients once battery >= nut_wake_charge on mains.
- name: Install wakeonlan (master, wake enabled)
  apt:
    name: wakeonlan
    state: present
  when: nut_mode == 'master' and nut_wake_enabled | default(false)
  tags: always

- name: Deploy nut-wake script (master, wake enabled)
  template:
    src: nut-wake.j2
    dest: /usr/local/sbin/nut-wake
    owner: root
    group: root
    mode: '0755'
  when: nut_mode == 'master' and nut_wake_enabled | default(false)
  tags: always

- name: Deploy nut-wake systemd service (master, wake enabled)
  template:
    src: nut-wake.service.j2
    dest: /etc/systemd/system/nut-wake.service
    owner: root
    group: root
    mode: '0644'
  when: nut_mode == 'master' and nut_wake_enabled | default(false)
  tags: always

- name: Deploy nut-wake timer (master, wake enabled)
  template:
    src: nut-wake.timer.j2
    dest: /etc/systemd/system/nut-wake.timer
    owner: root
    group: root
    mode: '0644'
  when: nut_mode == 'master' and nut_wake_enabled | default(false)
  tags: always

- name: Enable and start nut-wake timer (master, wake enabled)
  systemd:
    name: nut-wake.timer
    state: started
    enabled: true
    daemon_reload: true
  when: nut_mode == 'master' and nut_wake_enabled | default(false)
  tags: always

# --- Enable/start NUT daemons ---
- name: Enable and start NUT services (master)
  systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ ['nut-server', 'nut-monitor'] }}"
  when: nut_mode == 'master'

- name: Enable and start NUT services (client)
  systemd:
    name: nut-monitor
    state: started
    enabled: true
    daemon_reload: true
  when: nut_mode == 'client'

# --- HD-467: prove the listener is actually bound, and repair it in the SAME run ---
# A `systemctl is-active nut-server` result is never evidence here (the unit stays active
# while serving loopback only), and a template task that renders a LISTEN line proves even
# less. Assert and act together: read the socket set, restart ONCE if a declared address is
# missing, read again, then fail loud. `flush_handlers` first so a config change that
# notified a restart is not double-restarted by the repair path.
- name: Apply pending NUT restarts before proving the listener
  meta: flush_handlers

- name: Read the socket set upsd actually bound (master)
  shell: ss -lnt | awk 'NR>1 && $4 ~ /:3493$/ {print $4}'
  args:
    executable: /bin/bash
  register: _nut_bind
  changed_when: false
  check_mode: false
  when: nut_mode == 'master'

- name: Restart nut-server once when a declared LISTEN address is absent (master)
  systemd:
    name: nut-server
    state: restarted
    daemon_reload: true
  register: _nut_rebind
  when:
    - nut_mode == 'master'
    - not ansible_check_mode
    - nut_listen_ip not in _nut_bind.stdout

- name: Re-read the socket set after the one repair restart (master)
  shell: ss -lnt | awk 'NR>1 && $4 ~ /:3493$/ {print $4}'
  args:
    executable: /bin/bash
  register: _nut_bind2
  changed_when: false
  check_mode: false
  when:
    - nut_mode == 'master'
    - _nut_rebind is not skipped

- name: Note that check mode cannot exercise the repair (master)
  debug:
    msg: >-
      check mode: {{ nut_listen_ip }}:3493 is NOT bound right now, so the real run will
      restart nut-server once and re-read. Bound sockets were
      [{{ _nut_bind.stdout.split() | join(' ') }}].
  when:
    - nut_mode == 'master'
    - ansible_check_mode
    - nut_listen_ip not in _nut_bind.stdout

- name: Assert every declared LISTEN address is bound (master)
  assert:
    that:
      - nut_listen_ip in (_nut_bind2.stdout | default(_nut_bind.stdout))
    fail_msg: >-
      upsd is not listening on {{ nut_listen_ip }}:3493 even after one restart — bound
      sockets were [{{ (_nut_bind2.stdout | default(_nut_bind.stdout)).split() | join(' ') }}].
      Every remote NUT consumer is getting Connection refused (HD-467).
  when:
    - nut_mode == 'master'
    - not ansible_check_mode

# Tripwire for the ACL class (HD-467): a row asked for an ACCEPT/REJECT list here, and on
# NUT 2.8 those keywords are accepted by the parser and IGNORED — the only trace is a
# start-up line. Without this check, a well-intentioned re-add would render, converge green,
# and restrict nothing.
- name: Read for upsd's "keyword ignored" start-up lines (master)
  shell: |
    start="$(systemctl show -p ExecMainStartTimestamp --value nut-server 2>/dev/null)"
    # Only THIS start counts: the lines are emitted at upsd start, so an older boot-line
    # would make the tripwire fire on a tree that no longer writes the keyword.
    [ -z "$start" ] || [ "$start" = "n/a" ] && start="-2 min"
    journalctl -u nut-server --since "$start" --no-pager 2>/dev/null | grep -c "no longer supported" || true
  args:
    executable: /bin/bash
  register: _nut_ignored_kw
  changed_when: false
  check_mode: false
  when: nut_mode == 'master'

- name: Assert upsd ignored no config keyword (master)
  assert:
    that:
      - _nut_ignored_kw.stdout | int == 0
    fail_msg: >-
      upsd reported {{ _nut_ignored_kw.stdout }} "no longer supported" line(s) this boot: this
      tree writes a keyword the installed NUT parses but ignores — the restriction it looks like
      is not in force. On 2.8 exposure = LISTEN addresses, privilege = upsd.users (HD-467).
  when: nut_mode == 'master'

# --- HD-467: the client-side read that does not lie ---
# upsmon retries forever and `is-active nut-monitor` stays `active` across a dead master,
# so the only client-side proof is a real query. Fail-loud by default (nut_require_master_leg);
# the escape hatch is a per-run -e, never a committed false.
- name: Query the master from the client (client)
  command: upsc powerwalker@{{ nut_host }} ups.status
  register: _nut_leg
  until: _nut_leg.rc == 0
  retries: 3
  delay: 5
  changed_when: false
  failed_when: false
  check_mode: false        # a pure read — --check must be able to judge the real leg
  when: nut_mode == 'client'

- name: Assert the client reaches the master (client)
  assert:
    that:
      - _nut_leg.rc == 0
      - _nut_leg.stdout | trim | length > 0
    fail_msg: >-
      upsc powerwalker@{{ nut_host }} failed on {{ inventory_hostname }} (rc={{ _nut_leg.rc }},
      stdout='{{ _nut_leg.stdout | trim }}', stderr='{{ _nut_leg.stderr | trim }}') — this host is
      NOT UPS-protected whatever `systemctl is-active nut-monitor` says (HD-467). For a
      deliberately-offline converge pass -e nut_require_master_leg=false.
  when:
    - nut_mode == 'client'
    - nut_require_master_leg | bool

# --- Verify UPS visibility (master; non-destructive) ---
- name: List USB devices (master — confirm the UPS HID is present)
  command: lsusb
  register: _ups_lsusb
  changed_when: false
  when: nut_mode == 'master'

- name: Assert the PowerWalker UPS USB HID device is attached
  assert:
    that:
      - "'Innova' in _ups_lsusb.stdout or 'PHOENIXTEC' in _ups_lsusb.stdout or 'PowerWalker' in _ups_lsusb.stdout"
    fail_msg: >-
      UPS USB HID device not found via lsusb — verify the USB cable to the
      PowerWalker is attached to nas and the HID path for usbhid-ups.
  when: nut_mode == 'master'

- name: Verify upsd reports the UPS (master)
  command: upsc powerwalker@localhost
  register: _ups_sc
  changed_when: false
  failed_when: _ups_sc.rc != 0
  when: nut_mode == 'master'
