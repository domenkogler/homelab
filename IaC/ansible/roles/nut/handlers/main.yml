---
# nut role handlers. tags: always = handlers are tag-filtered like tasks; without it a notified
# restart is silently skipped under filtered runs.

- name: restart nut services
  systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - nut-server
    - nut-monitor
  when: nut_mode == 'master'
  tags: always

# upsmon restart for BOTH modes — upssched.conf/upssched-cmd changes must reload upssched on
# the client too, or the client keeps running a stale delay timer and sheds load on a mains
# loss. The mode-split handler above misses clients, so the upssched tasks notify THIS one.
- name: restart upsmon (all modes)
  systemd:
    name: nut-monitor
    state: restarted
    daemon_reload: true
  tags: always

- name: restart nut-monitor (client)
  systemd:
    name: nut-monitor
    state: restarted
    daemon_reload: true
  when: nut_mode == 'client'
  tags: always

- name: restart nut_exporter
  systemd:
    name: nut_exporter
    state: restarted
    daemon_reload: true
  when: nut_exporter
  tags: always
