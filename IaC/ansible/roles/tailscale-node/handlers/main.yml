---
# tailscale-node handlers

# Fires on ANY change to /etc/default/tailscaled, including a comment-only rewrite of the
# Debian-shipped file. A restart drops in-flight sessions for seconds; the node key and state
# file survive, so it rejoins as the SAME node, SAME tailnet IP — no re-enrolment, no re-tagging.
- name: Restart tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    state: restarted
