---
# tailscale-node — a home host joins headscale as its own node.
#
# Why a HOST node and not another Pattern-A sidecar (the vps-obs shape): remote dev does not
# cross the VPS. A host `tailscaled` gives a real interface (kernel TUN) instead of a userspace
# netstack + `serve` port-forwards, so the interactive paths (edge TLS on the node IP, later
# SSH/RustDesk) ride a DIRECT session end to end. Cost accepted: one more listener on the
# vault-token box, bounded by the `tag:dev` preauth-key tag + the port-scoped ACL in
# headscale/policy.hujson.j2.
#
# Scope of the JOIN (all of these are load-bearing, see defaults/main.yml):
#   no advertised routes · no exit node · no Tailscale SSH · no DNS takeover.
# Secrets: the preauth key is read from 1Password by the HOST_VAR ref (lazy lookup, so it
# costs an `op` call only when this role actually runs) and is never printed (no_log).

# Detection, not assumption: `dpkg --print-architecture` is the only thing on the host that
# answers with the name Tailscale's filenames use. The gathered `architecture` fact is the
# KERNEL name (aarch64 / x86_64) and is wrong here.
- name: Read the host's dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: _dpkg_arch
  changed_when: false
  # `check_mode: false` because this is a READ, not a mutation: under `--check` the task would be
  # skipped, the register would carry no `stdout`, the set_fact below would set the arch to the empty
  # string and the digest assert in front would abort the rehearsal with `architecture ''` — a dry run
  # that cannot reach the leg it exists to rehearse (measured on a pi canary leg).
  check_mode: false
  when: tailscale_host_arch | default('', true) | length == 0

- name: Set the architecture used for the pinned .deb (explicit var wins, else the dpkg read)
  ansible.builtin.set_fact:
    tailscale_host_arch: >-
      {{ (tailscale_host_arch | default('', true) or (_dpkg_arch.stdout | default('') | trim)) | trim }}

# ⚠ Arch comes from the host, it is NOT a literal: the URL, the dest path and the checksum
# all moved onto `tailscale_host_arch` together. Shipping a checksum that does not belong to
# the arch being downloaded is worse than shipping none — it would call a wrong-arch .deb
# "verified" — hence the map in group_vars/all/versions.yml and this assert in front.
- name: Assert the host architecture has a pinned, checksummed tailscale .deb
  ansible.builtin.assert:
    that:
      - tailscale_host_arch in (tailscale_host_deb_sha256_by_arch | default({}, true))
    fail_msg: >-
      No pinned tailscale .deb checksum for architecture '{{ tailscale_host_arch }}'.
      Supported: {{ (tailscale_host_deb_sha256_by_arch | default({}, true)).keys() | list }}.
      Add it from https://pkgs.tailscale.com/stable/tailscale_{{ tailscale_host_version }}_
      {{ tailscale_host_arch }}.deb.sha256 — do NOT relax this assert to reuse another arch's
      checksum.
    quiet: true

- name: Download the pinned tailscale host package (checksum-verified)
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/tailscale_{{ tailscale_host_version }}_{{ tailscale_host_arch }}.deb"
    dest: "/root/tailscale_{{ tailscale_host_version }}_{{ tailscale_host_arch }}.deb"
    checksum: "sha256:{{ tailscale_host_deb_sha256_by_arch[tailscale_host_arch] }}"
    mode: "0600"
  register: _ts_deb

# ── the hold, and the one moment a converge is allowed to lift it ────────────────────────────
# `roles/common` holds every package in `host_apt_pin_vars` — `tailscale` among them — so `apt
# upgrade` cannot move it, and that fence also blocks a PIN BUMP: the `apt` module ALWAYS passes `-y`
# and apt refuses to move a held package under `-y`
# (`E: Held packages were changed and -y was used without --allow-change-held-packages`, rc 100),
# while the same request WITHOUT `-y` resolves the upgrade. A `deb:` install is that same request, so
# the .deb leg above would land on a refusal on every host that is off its pin. The exception is
# therefore explicit and narrow: lift the ONE name this run moves, install the pinned .deb, put the
# hold back in `always`. ⛔ Never `allow_change_held_packages` (the hold is the invariant), never
# `apt-mark unhold $(apt-mark showhold)` (that hands alloy and tailscale to any `apt upgrade` racing
# the converge). A host already at its pin lifts nothing, so a routine converge never opens the
# window. Same block `roles/docker` ships for its suite — one shape per held package, and the
# `showhold` pair is what proves the hold came back. The `.deb` is fetched to /root and never held
# back: it is the file, not the package; the re-hold below is on the package.
# The tag is the role's own: `playbooks/home_servers.yml` and `playbooks/raspberry_pi.yml` attach
# `tags: [tailscale-node]` to the role entry, which cascades to every task here, so a scoped run
# selects the lift exactly when it selects the role. A second, package-named tag would be a NEW
# filter over a lockout role rather than a fix to a silent drop, and it is refused by
# playbooks/tasks/self-converge-guard.yml's tag symmetry (scripts/README.md, "BOTH tags").
- name: Read which packages this host holds
  ansible.builtin.command:
    cmd: apt-mark showhold
  register: _tailscale_holds_before
  changed_when: false
  check_mode: false        # a probe, not a mutation — --check must still be able to judge
  tags: [tailscale-node]

- name: Read the tailscale host version before this run moves anything
  # One read decides which name the hold is standing in the way of, the read-back at the end of the
  # block decides whether the hold came back. A name this host's dpkg database does not know exits 1
  # with empty stdout and lands in the set too: it is held, it has to be installed, apt refuses that
  # under `-y` as well.
  ansible.builtin.command:
    cmd: "dpkg-query -W -f='${package}=${version}\\n' tailscale"
  register: _tailscale_before
  changed_when: false
  failed_when: false       # not-installed is a valid answer here, stdout is the signal
  check_mode: false
  tags: [tailscale-node]

- name: Decide whether held tailscale has to move
  # Held AND off its pin — the exact set apt refuses under `-y`. The pin var is the one
  # `host_apt_pin_vars` maps the package to (`tailscale_host_version`), and the comparison is the
  # fleet's `matches_pin()` rule (roles/monitoring/templates/homelab-hygiene.py.j2, shared with the
  # pin-lag gauge): a pin that carries a dpkg revision compares EXACTLY, one that carries none
  # compares on the dpkg upstream part — so a box reporting a revision-suffixed version sits at pin
  # for the same upstream version pinned without one. Equality, never `>=`, and no version is written
  # here, only the shape.
  ansible.builtin.set_fact:
    # `default('', true)` is load-bearing: a Jinja block that emits NOTHING comes back as Python None,
    # not an empty string, and `None.split()` yields ['None'] — without the cast a host that needs no
    # lift would run `apt-mark unhold None`.
    _tailscale_to_lift: "{{ (_tailscale_lift_candidate | default('', true) | trim).split() }}"
  vars:
    _tailscale_lift_candidate: |-
      {%- set _held = _tailscale_holds_before.stdout_lines | map('trim') | list %}
      {%- set _carried = dict(_tailscale_before.stdout_lines | reject('equalto', '') | map('split', '=')) %}
      {%- set _dpkg = _carried['tailscale'] | default('') %}
      {%- set _upstream = _dpkg.rsplit('-', 1)[0] if '-' in _dpkg else _dpkg %}
      {%- set _at_pin = (_dpkg == tailscale_host_version) if ('-' in tailscale_host_version) else (_upstream == tailscale_host_version) %}
      {%- if 'tailscale' in _held and not _at_pin %}tailscale{% endif %}
  tags: [tailscale-node]

- name: Move the pinned tailscale host package past its hold
  # The re-hold sits in `always`, so a failed install leaves the PRE-state — held, old version — and
  # never a tailscaled nobody on this box is holding.
  block:
    - name: Say what the dry run cannot simulate on a held package
      # Under `--check` nothing is mutated: the unhold below never lands, the .deb is never written,
      # and apt's own `--simulate` refuses a plan the real run will not have. Reporting that as a
      # failure would teach everyone to reach for the forbidden flag, so the dry run says what it
      # cannot see instead. A host already at its pin needs no lift and says nothing here.
      ansible.builtin.debug:
        msg: >-
          --check leaves tailscale held, so the .deb install below is skipped rather than run against
          a hold the real apply lifts first. The plan itself is readable any time with
          `apt-get -s install /root/tailscale_{{ tailscale_host_version }}_{{ tailscale_host_arch }}.deb`
          on {{ inventory_hostname }} — no -y, no hold refusal, nothing executed.
      when: ansible_check_mode and (_tailscale_to_lift | length > 0)

    - name: Lift the hold on tailscale for the pin bump
      ansible.builtin.command:
        cmd: apt-mark unhold tailscale
      when: _tailscale_to_lift | length > 0
      changed_when: true

    - name: Install the tailscale host package at its pinned .deb
      ansible.builtin.apt:
        deb: "/root/tailscale_{{ tailscale_host_version }}_{{ tailscale_host_arch }}.deb"
        state: present
      # ⛔ no `--allow-downgrades` equivalent here either: a pin that lags a box must fail, not
      # downgrade it. Skipped on a held-and-off-pin `--check` run — see the voice above.
      when: not (ansible_check_mode and (_tailscale_to_lift | length > 0))

    - name: Report what this run lifted
      # Never under `--check`, where nothing was lifted: the voice above is what a dry run says.
      ansible.builtin.debug:
        msg: >-
          hold lifted for the pin bump on tailscale — re-held below, whether the install worked or not
      when: _tailscale_to_lift | length > 0 and not ansible_check_mode

  always:
    - name: Put the hold back on tailscale
      ansible.builtin.command:
        cmd: apt-mark hold tailscale
      when: _tailscale_to_lift | length > 0
      changed_when: true

    - name: Read the holds this leg leaves behind
      # `check_mode: false` because this is the re-READ, not the mutation: under `--check` it still
      # reports what the host actually holds, which is what the assert below needs (a skipped register
      # would read as "nothing is held" and accuse a healthy host of losing its holds).
      ansible.builtin.command:
        cmd: apt-mark showhold
      register: _tailscale_holds_after
      changed_when: false
      check_mode: false
      when: _tailscale_to_lift | length > 0

    - name: Assert tailscale is held again
      # `apt-mark hold` exiting 0 is not the state. A tailscale left unheld converges green and moves
      # on the next `apt upgrade`, which is the running-vs-pinned class the hold exists to close — and
      # on this node it would also break the "one wire version across the tailnet" rule that pairs
      # `tailscale_host_version` with the container pin.
      ansible.builtin.assert:
        that:
          - (_tailscale_to_lift | difference(_tailscale_holds_after.stdout_lines | default([], true) | map('trim') | list)) | length == 0
        fail_msg: >-
          tailscale was unheld by this run on {{ inventory_hostname }} and is NOT held again. Every
          converge from here would leave it to `apt upgrade`. Re-hold it with `apt-mark hold tailscale`
          and find out why the leg above did not land — do not drop the package from
          `host_apt_pin_vars`.
        quiet: true
      when: _tailscale_to_lift | length > 0
  tags: [tailscale-node]

- name: Enable + start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
    daemon_reload: true

# Own the listen port. The deb already ships /etc/default/tailscaled with
# PORT="41641" and the unit passes `--port=${PORT}`, so on a box that has never been
# touched this writes an equivalent value — but "the package default happens to be right"
# is not a statement the router's firewall may depend on: an apt reinstall or an operator
# edit can move it, and tailscaled falls back to an ephemeral port WITHOUT telling anyone
# when 41641 is busy. Renders identical bytes on a pinned box → no restart (the handler
# only fires on a real change).
- name: Pin the tailscaled listen port (the firewall may name exactly this UDP port)
  ansible.builtin.template:
    src: etc-default-tailscaled.j2
    dest: /etc/default/tailscaled
    owner: root
    group: root
    mode: "0644"
  notify: Restart tailscaled

- name: Read the current tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: _ts_status
  changed_when: false
  failed_when: false          # a logged-out client exits non-zero — that IS a valid state

- name: Parse the backend state when a netmap exists
  ansible.builtin.set_fact:
    _ts: "{{ _ts_status.stdout | from_json }}"
  when: _ts_status.stdout is match('^\\s*\\{')

# The live vps-obs incident: WITHOUT --login-server the client defaults to
# controlplane.tailscale.com and rejects our headscale key. On a host that is worse than a
# failed join — a state file restored/created against the public plane silently puts this
# box on someone else's tailnet. Fail loud instead.
- name: Assert tailscaled is not enrolled against the public control plane
  vars:
    _ts_control_url: "{{ _ts.Prefs.ControlURL | default('') if _ts is defined else '' }}"
  ansible.builtin.assert:
    that:
      - "'controlplane.tailscale.com' not in (_ts_control_url | string)"
    fail_msg: >-
      {{ inventory_hostname }}: tailscaled reports ControlURL={{ _ts_control_url }} — that is
      the PUBLIC Tailscale control plane, not our headscale ({{ tailnet_control_url }}).
      Run `tailscale logout` on the host and re-converge.
    success_msg: "tailscaled control plane OK"

- name: Join the tailnet when the node is not already enrolled
  when: >-
    _ts is not defined
    or (_ts.BackendState | default('')) in ['', 'NoState', 'LoggedOut', 'NeedsLogin']
  block:
    - name: Materialise the headscale preauth key on tmpfs for exactly one login
      ansible.builtin.copy:
        dest: "{{ tailscale_node_authkey_path }}"
        content: "{{ tailscale_node_authkey }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true              # the key value must never reach the run log

    - name: tailscale up (no routes · no exit node · no SSH · no DNS takeover)
      ansible.builtin.command: >-
        tailscale up
        --login-server={{ tailnet_control_url }}
        --auth-key=file://{{ tailscale_node_authkey_path }}
        --hostname={{ tailscale_node_hostname }}
        --ssh=false
        --accept-routes=false
        --accept-dns=false
      register: _ts_up
      until: _ts_up.rc == 0
      retries: 3
      delay: 10
      no_log: true              # the auth key is on the command line
  always:
    - name: Shred the transient preauth key
      ansible.builtin.command: "shred -u {{ tailscale_node_authkey_path }}"
      changed_when: false
      failed_when: false        # a missing file means the block never created it

- name: Read the tailnet IPv4 this node was assigned
  ansible.builtin.command: tailscale ip -4
  register: _ts_ip
  changed_when: false
  # `check_mode: false` for the same reason as the arch read above: under `--check` this command
  # would be skipped, `_ts_ip.stdout` would be empty and the assert below would fail the rehearsal
  # with an IP mismatch the host does not have — a read, so there is nothing for check mode to skip.
  check_mode: false

# The tailnet IP is assigned by headscale at join time, so the repo cannot know it in
# advance — same contract as `tailnet_sidecar_ip`: leave the per-host expectation EMPTY until
# the node has joined, read `headscale nodes list`, set the group var, re-converge. This
# guard is what stops the two from drifting silently (derived-values ban, CONVENTIONS §1).
# The guard reads the per-node `tailscale_node_expected_ip` (set in host_vars), not a shared
# inline address — an inline address would assert every joining node against one host's IP.
- name: Assert the IaC tailnet IP matches what headscale assigned
  ansible.builtin.assert:
    that:
      - tailscale_node_expected_ip | default('', true) | length == 0 or
        tailscale_node_expected_ip == (_ts_ip.stdout | trim)
    fail_msg: >-
      tailscale_node_expected_ip={{ tailscale_node_expected_ip | default('') }} for this
      host but the node was assigned {{ _ts_ip.stdout | trim }}. Update the matching
      `tailnet_*_ip` in group_vars/all/main.yml and re-converge (the tailnet listeners —
      traefik-internal / traefik-ha `websecure-ts` — bind exactly this address).
    success_msg: "tailnet IP {{ _ts_ip.stdout | trim }} (IaC agrees or is unset)"

- name: Report the node identity for the run log (no secrets)
  ansible.builtin.debug:
    msg: >-
      tailnet node '{{ tailscale_node_hostname }}' = {{ _ts_ip.stdout | trim }}
      on {{ tailnet_control_url }} — no advertised routes, no exit node, tailscale SSH off.
