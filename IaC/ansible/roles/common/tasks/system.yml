---
# Fail-closed guard: only whitelisted admin users may run Ansible.
# If this ever runs as ai-debug it would grant passwordless root below,
# undoing the entire post_install.sh security boundary.
- name: Refuse Ansible runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      ansible_user '{{ ansible_user }}' is not an allowed admin user
      ({{ ansible_admin_users | join(', ') }}). The ai-debug user must never
      run Ansible — it would gain passwordless root via this role.
  tags: always

# Debian trixie apt sources — a minimal/preseed install lands with NO network sources
# (only a commented cdrom line), so `apt` has no package index at all (nas live-found
# 2026-09-03: 'No package matching gpg is available' = empty candidate list). We write the
# deb822 .sources directly (the deb822_repository module no-ops on this ansible-core in the
# runner venv — reported changed, wrote nothing; live-repaired by direct write 2026-09-03).
# Canonical trixie main/contrib/non-free-firmware + security + updates.
#
# HD-317 (2026-09-04, live fix): a stock Debian trixie install already ships
# /etc/apt/sources.list.d/debian.sources (deb822, Signed-By: …debian-archive-keyring.pgp)
# covering trixie + trixie-security. Writing the .gpg-Signed-By duplicates below beside it
# makes apt FAIL with "Conflicting values set for option Signed-By" (live on the Pi
# 2026-09-04 — blocked the whole converge until the dup files were removed). The role only
# writes these fragments on hosts that LACK the stock sources file.
- name: Assert stock Debian deb822 sources are ABSENT (trixie .sources landed by the OS)
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/debian.sources
  register: _stock_deb822
  when: ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 13
  tags: always

- name: Ensure Debian trixie apt sources exist (fresh-install gap — stock debian.sources ABSENT only)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian-trixie.sources
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: trixie trixie-updates
      Components: main contrib non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    mode: '0644'
  register: apt_sources
  when:
    - ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 13
    - not (_stock_deb822.stat.exists if (_stock_deb822 is defined and _stock_deb822.stat is defined) else true)
  tags: always

- name: Ensure Debian trixie-security apt sources exist (stock debian.sources ABSENT only)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian-trixie-security.sources
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian-security
      Suites: trixie-security
      Components: main contrib non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    mode: '0644'
  register: apt_security_sources
  when:
    - ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 13
    - not (_stock_deb822.stat.exists if (_stock_deb822 is defined and _stock_deb822.stat is defined) else true)
  tags: always

- name: Update apt repositories and install prerequisites
  apt:
    name: [apt-transport-https, ca-certificates, curl, gpg, python3-pip, acl, python3-debian, python3-apt, jq]  # jq: authentik secret-egress glue parses API JSON host-side (found missing on the minimal image, Phase 1 2026-08-22)
    state: present
    update_cache: true

- name: Configure passwordless sudo for the Ansible admin user
  copy:
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"
    dest: "/etc/sudoers.d/{{ ansible_user }}"
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'