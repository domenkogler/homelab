---
- name: "Sistemska priprava: Nadgradnja OS in predpogoji"
  include_tasks: system.yml
  # ⚠ The include tag must name the SAME tags its children carry: home_servers.yml, storage.yml,
  # raspberry_pi.yml and spark.yml all pull `common` as a BARE role and a bare role name is not a
  # tag, so an untagged include line here was never expanded by ANY `--tags` run from those plays
  # (rule 3) — not even for the `tags: always` guard below, because `always` can only rescue a task
  # that was parsed. `vps.yml` tags the roles: entry [common, base], which is why the gap was
  # invisible there.
  tags: [common, base]

# The pinned host packages are held here, in the role that owns host base state, so the
# hold exists on every Linux host this repo converges (vps/home_servers/raspberry_pi/
# storage/spark) and before any role installs a pinned version. Ruling + proof: apt-holds.yml.
# The tags sit on the INCLUDE on purpose: an `include_tasks` statement is what the tag
# filter evaluates, so an untagged include drops the whole file under `--tags common`
# (only `always` survives) — and `common` carries role-level tags in vps.yml alone.
- name: "Paketi: apt-mark hold za pripete pakete"
  include_tasks: apt-holds.yml
  tags: [common, base]

# Own include line so the write is selectable on its own: `--tags address-family` expands
# THIS include and no other, which is what keeps a gai.conf change from dragging apt,
# docker and the network legs along with it. The tag has to sit on the include — an
# `include_tasks` statement is what the tag filter evaluates, so a child-only tag would
# read as a clean changed=0 run.
- name: "Mrežje: Naslovna družina adres (gai.conf)"
  include_tasks: address-family.yml
  tags: [common, base, address-family]

# Same reason for its own line: `--tags journald` applies the journal ring and nothing else.
# Restarting systemd-journald is the only unit restart this role performs.
- name: "Sistemska priprava: Velikost trajnega dnevnika (journald ring)"
  include_tasks: journald.yml
  tags: [common, base, journald]
