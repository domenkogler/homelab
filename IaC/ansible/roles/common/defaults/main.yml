---
# common role defaults

# Self-converge guard classification (read by scripts/gate/check_self_converge_guard.py, not by Ansible).
# `common` writes /etc/sudoers.d/<ansible_user> — the grant that lets the runner escalate at
# all, on the box it may itself be running on. It is NOT in the lockout set because it can
# only ever restate that grant, never revoke a session: no unit is restarted, no firewall or
# netdev or sshd file is touched, and the drop-in passes `visudo -cf` before it can land, so
# the one way to break escalation (a malformed file) is stopped at the write. Refusing
# `--tags common` on self-targets would also make the guard's own read-only proof leg
# unrunnable, which is the trade the guard exists to keep available.
homelab_lockout_exempt_reason: >-
  Restates the runner's own NOPASSWD drop-in, validated with visudo -cf before it can land;
  restarts no unit and touches no firewall, netdev, mount or sshd state, so it cannot sever
  the session it is running in.

# Host-APT packages whose version is fleet state, therefore HELD (owner ruling: option A).
# Read by tasks/apt-holds.yml. DERIVED from `host_apt_pin_vars` (group_vars/all/versions.yml) — the
# same map roles/docker installs `package=version` from and roles/monitoring reports pin-lag against.
# One map owns all three views, so a package cannot end up held with no pin: that is the state where
# `apt-mark hold` freezes whatever the box happened to reach instead of freezing repo state. Adding a
# host-APT pin is one line in that map; nothing here changes.
#
# A package moves only when group_vars/all/versions.yml moves, through a reviewed change + a
# deliberate converge — `apt upgrade` cannot touch a held package, and an explicitly requested version
# (`apt install <pkg>=<ver>`, the shape roles/docker uses for the Docker suite) still installs.
# Every entry is a package a pin or a checksum governs; a host that does not carry one is dropped by
# the dpkg-query read, so one list serves the whole fleet — nas runs no Docker at all, so the engine
# family is simply absent there and the converge changes nothing on nas.
#   alloy               — `alloy_version`; apt.grafana.com is an apt source, so a periodic or one-off
#                         upgrade would otherwise move the collector off its pin.
#   docker-ce, docker-ce-cli, docker-ce-rootless-extras, containerd.io, docker-buildx-plugin,
#   docker-compose-plugin
#                       — the download.docker.com suite. `docker_ce_version` pins the engine family
#                         (docker-ce, docker-ce-cli and the rootless extras are ONE source package and
#                         always share a version); containerd and the two plugins ship their own
#                         upstream trains and carry their own pins. roles/docker installs the
#                         installable members AT those versions, so the hold freezes repo state rather
#                         than an accident — held-but-unpinned is not a version policy.
#   tailscale           — roles/tailscale-node installs one checksum-verified .deb and adds NO apt
#                         source, precisely so nothing auto-updates it; the hold keeps a hand-added
#                         repo or an operator `apt upgrade` from replacing that pin
#                         (`tailscale_host_version` + its per-arch .deb digests).
# Kopia is NOT listed: it ships as the pinned `kopia/kopia` container image
# (`kopia_version`, templates/docker_services/kopia-{server,agent}), so there is no apt state
# to hold — its pin is enforced by the compose render, not by dpkg.
common_apt_hold_packages: "{{ host_apt_pin_vars | dict2items | map(attribute='key') | sort | list }}"
