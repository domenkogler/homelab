# network role hosts — netd (systemd-networkd) vars for nas / oldsrv (desktop/VPS class).
# Pi uses NetworkManager (network-rejected.md 2026-09-01) — no netd units there.
# ---- Role-internal knobs (architecture values stay in host_vars/group_vars) ----

# Per-host config-manager: systemd-networkd for nas/oldsrv (desktop/VPS class);
# RPi OS ships NetworkManager (Pi-uses-NM decision). This role only touches netd
# on hosts that explicitly opt in (netd_* below) and never disables a manager.

# systemd-networkd unit dir.
netd_dir: /etc/systemd/network

# Physical uplink NIC — per host! (nas eno1 → switch ether10; oldsrv eno1 → switch ether11)
# Defaults sane for desktop-class; host_vars pin the real interface.
netd_phys_name: eno1

# VLAN sub-interface on the physical NIC (tagged Management 99, HD-310 port model).
netd_vlan_ifname: "{{ netd_phys_name }}.99"

# Description strings (rendered into the units).
netd_phys_description: "{{ inventory_hostname }} physical uplink — untagged Home (10) + tagged Mgmt (99)"
netd_vlan_description: "{{ inventory_hostname }} tagged Management VLAN (99) sub-interface"

# --- SSOT-derived addresses (never literals; CONVENTIONS §2) ---
# habitation IP per host = the host's VLAN-10 (Home) row from network_static_hosts.
# SSOT-derived by hostname so old-srv (whose ansible_host is the Mgmt IP, 10.10.99.30)
# still gets its true Home address on the untagged parent (10.10.1.30); nas's Home row
# (10.10.1.10) happens to equal its ansible_host, so no behavior change there.
# (Phase-2/3 prep: without this, old-srv's netd-phys unit would put the Mgmt IP on the
# untagged parent — the dual-home design's Home plane would silently carry the wrong IP.)
host_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', inventory_hostname_short) | selectattr('vlan', 'equalto', 10) | map(attribute='ip') | list | first) }}"
home_gateway_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 10) | map(attribute='ip') | list | first) }}"

# DHCP client-id strategy per host (HD-314), derived from the SSOT row: dhcp_client: mac on
# nas/oldsrv rows tells the host to present its interface MAC as client-id so the RouterOS
# reservation (mac: field) binds. Undefined -> 'none' on static hosts (Pi/VPS) — no DHCP client.
dhcp_client: "{{ (network_static_hosts | selectattr('name', 'equalto', inventory_hostname_short) | selectattr('vlan', 'equalto', 10) | selectattr('dhcp_client', 'defined') | map(attribute='dhcp_client') | list | first) | default('none') }}"