# network role hosts — role-internal knobs. The config-manager of a host is declared in that host's
# host_vars (network_manager / network_manager_target) and never here: see docs/network.md
# §Config-manager truth for the three states and what each one commits this role to.
# ---- Role-internal knobs (architecture values stay in host_vars/group_vars) ----

# The three states a host's config-manager may be in, and the ONLY vocabulary a host_vars declaration
# may use. scripts/gate/check_net_manager.py reads the list out of THIS file, so the role and the gate
# cannot disagree about what a declaration means.
network_manager_kinds:
  - NetworkManager
  - systemd-networkd
  - ifupdown

# A host is SETTLED when the manager that owns it is also the ruled end-state for it. While the two
# differ the host is FROZEN: no address leg is rendered and none is activated, because a leg written
# under a manager the box does not run is a file nothing reads, and a leg activated under a manager
# that is about to be replaced moves the interface the converge is sitting on. The freeze is the
# mechanical half of "settle the manager first": flipping the declaration is the owner's act, not an
# edit to a render guard. docs/network.md §Config-manager truth.
net_manager_settled: "{{ network_manager == network_manager_target }}"

# This role's namespace inside netd_dir: the unit-file names its dual-home model writes. The cleanup
# leg removes exactly this pattern on a host that declares no netd leg, and never a wider glob —
# /etc/systemd/network also holds units another role owns (the wireguard role's wg-s2s.*) and units
# the OS owns (99-default.link), and deleting one of those is an outage, not a tidy-up. No other role
# may render into this namespace; the gate enforces the split.
netd_unit_namespace:
  - 20-*.network
  - 20-*.netdev
  - 30-*-tunnel.network

# systemd-networkd unit dir.
netd_dir: /etc/systemd/network

# The physical uplink NIC is a FACT OF THE HOST, so host_vars declares it and this file does not:
# a role-level value makes `netd_phys_name is defined` true everywhere, and a guard built on that
# definedness is a tautology — the same silent-failure class as the `dhcp_client` note below. That is
# how this role came to write units naming hardware its target does not have (on the Pi, on spark and
# on the VPS alike) and a NIC name oldsrv never had.

# VLAN sub-interface on the physical NIC (tagged Management 99).
netd_vlan_ifname: "{{ netd_phys_name }}.99"

# Description strings (rendered into the units).
netd_phys_description: "{{ inventory_hostname }} physical uplink — untagged Home (10) + tagged Mgmt (99)"
netd_vlan_description: "{{ inventory_hostname }} tagged Management VLAN (99) sub-interface"

# --- Observability tunnel route ---
# The home-side Alloy collectors remote_write to the VPS Victoria endpoint
# (wg_s2s_vps.ip = 10.255.40.2). Where a host's addresses are rendered by this role, a second NIC
# with a lower-metric DHCP default can shadow the managed Home NIC, so the tunnel endpoint gets a
# host route at metric 50 that always wins. SSOT value, never a literal.
# ⚠ On a host whose manager is not systemd-networkd this route is NOT applied by anything: nas's
# routes come from ifupdown's dhcpcd, so its shadowing default is a live routing fact with no netd
# leg to fix it (docs/hardware-nas.md §Network).
netd_tunnel_route: "{{ wg_s2s_vps.ip }}/32"  # VPS Victoria/wg-s2s endpoint (SSOT)
netd_tunnel_route_metric: 50

# --- SSOT-derived addresses (never literals; CONVENTIONS §2) ---
# habitation IP per host = the host's VLAN-10 (Home) row from network_static_hosts.
# SSOT-derived by hostname so old-srv (whose ansible_host is the Mgmt IP, 10.10.99.30)
# still gets its true Home address on the untagged parent (10.10.1.30); nas's Home row
# (10.10.1.10) happens to equal its ansible_host, so no behavior change there.
# (Phase-2/3 prep: without this, old-srv's netd-phys unit would put the Mgmt IP on the
# untagged parent — the dual-home design's Home plane would silently carry the wrong IP.)
host_home_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', inventory_hostname_short) | selectattr('vlan', 'equalto', 10) | map(attribute='ip') | list | first) }}"
home_gateway_ip: "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 10) | map(attribute='ip') | list | first) }}"

# DHCP client-id strategy per host, derived from the SSOT row: dhcp_client: mac on
# nas/oldsrv rows tells the host to present its interface MAC as client-id so the RouterOS
# reservation (mac: field) binds. Undefined -> 'none' on static hosts (Pi/VPS) — no DHCP client.
# `dhcp_client_optin` gates the MAC client-id block (assert + dhcpcd/NM tasks) to hosts that
# actually opt in via the SSOT marker. This vars file defines `dhcp_client` for every host
# (fallback 'none'), so `when: dhcp_client is defined` is a tautology and the assert fails on
# any static-host converge (e.g. vps.yml) — gate on the value, not on definedness.
dhcp_client: "{{ (network_static_hosts | selectattr('name', 'equalto', inventory_hostname_short) | selectattr('vlan', 'equalto', 10) | selectattr('dhcp_client', 'defined') | map(attribute='dhcp_client') | list | first) | default('none') }}"
dhcp_client_optin: "{{ dhcp_client == 'mac' }}"