# network role handlers — restart systemd-networkd (netd units for nas/oldsrv).
# A render of any netd unit reloads networkd; systemd-networkd is idempotent and
# applies the new units without tearing down the physical link (the .99 VLAN
# sub-interface is additive). The Pi (NetworkManager) uses reload NetworkManager.
- name: reload systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
    daemon_reload: true