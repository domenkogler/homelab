---
# network role — host networking foundation + SSOT doc render.
# Current scope:
#   1. assert we run as an allowed admin user (mirror of common's guard)
#   2. sync /etc/hosts from the shared template (same source as playbooks/all.yml)
#   3. Pi (RPi OS, NetworkManager): static dual-home on eth0 — Home 10.10.1.20 on the
#      untagged parent + Mgmt 10.10.99.20 on the TAGGED eth0.99 sub-interface (HD-311(b));
#      session-safe, default via Home, Mgmt never-default).
#   4. render docs/network-addresses-generated.md from IaC via render-docs.yml (run by site.yml)
#   5. nas/oldsrv (systemd-networkd, desktop/VPS class): static dual-home — physical .network
#      (VLAN-10 Home address + default route), a VLAN-99 tagged sub-interface (.netdev) + its
#      .network (Mgmt address, connected route only). Session-safe: additive addresses.
#      ⚠ On oldsrv these units are INERT in practice (NetworkManager owns the uplink and
#      systemd-networkd is disabled there) — open row HD-487 owns that half-finished decision.
#   6. oldsrv host-side resolver (HD-484): the box's own /etc/resolv.conf -> the DNS tier it hosts,
#      written through the NetworkManager profile that really owns that uplink (nmcli, needs become).
- name: Refuse network runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      network role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Sync /etc/hosts from shared template (bootstrap resolution)
  template:
    src: "{{ playbook_dir }}/../templates/etc_hosts.j2"
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
  tags: [hosts, network]

# Pi static dual-home via NetworkManager (HD-307, Pi-uses-NM decision network-rejected.md 2026-09-01).
# RPi OS ships NetworkManager (no systemd-networkd active) — this is the Pi's manager.
# Guarded to pi.kogler.si only: no other host opts into NM dual-home yet; desktop/VPS stay
# systemd-networkd. Values are SSOT-derived (host_vars ansible_host/mgmt_ip + network_static_hosts).
# HD-311: the untagged parent (pi-eth0) carries HOME only; the MGMT IP rides the TAGGED
# eth0.99 sub-interface (pi-mgmt) — its connected route on the parent hijacked 10.10.99.x
# lookups away from the tagged leg (router99 'No route to host' live 2026-09-02).
- name: Render Pi eth0 NetworkManager keyfile (untagged HOME parent)
  template:
    src: pi-eth0.nmconnection.j2
    dest: "{{ nm_keyfile_dir }}/{{ nm_pi_profile }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  notify: reload NetworkManager
  tags: [network, nm-pi]

# ---- nas/oldsrv netd (systemd-networkd) static dual-home (HD-311) ----
# desktop/VPS-class hosts use systemd-networkd (network-rejected.md: netplan rejected,
# systemd-networkd the config-manager; Pi-uses-NM is the Pi exception). The port model
# (HD-310) is untagged Home (10) + tagged Mgmt (99) on the SAME physical NIC; netd
# units render the physical .network (Home addr + default) + a .99 VLAN sub-interface
# (.netdev) + its .network (mgmt addr, connected route only).
# Session-safe: rendering units is additive; networkd-reload applies them without
# severing the existing session on the Home leg (the mgmt leg is a tagged addition).
- name: Render systemd-networkd .network for the physical uplink (Home 10 + mgmt-99 tagged)
  ansible.builtin.template:
    src: netd-phys.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_phys_name is defined
    - host_home_ip is defined
    - home_gateway_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .netdev for the VLAN-99 tagged sub-interface
  ansible.builtin.template:
    src: netd-vlan.netdev.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.netdev"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_phys_name is defined
    - netd_vlan_ifname is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .network for the VLAN-99 tagged sub-interface (mgmt addr)
  ansible.builtin.template:
    src: netd-vlan.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.99.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_vlan_ifname is defined
    - mgmt_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .network pinning the VPS tunnel route to the Home NIC (HD-346)
  # nas only: its second NIC (eno2) holds a DHCP default (metric 100) that shadows the
  # managed Home NIC (eno1, metric 1002) — Alloy's remote_write to the VPS Victoria
  # endpoint egressed eno2 and was dropped by the router (live 2026-09-08). Pin the
  # wg-s2s endpoint (/32, metric 50) to eno1 so it always wins. oldsrv has no such
  # conflict (its Alloy ships); leave it untouched.
  ansible.builtin.template:
    src: netd-tunnel-route.network.j2
    dest: "{{ netd_dir }}/30-{{ netd_phys_name }}-tunnel.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - inventory_hostname == 'nas.kogler.si'
    - netd_tunnel_route is defined
  notify: reload systemd-networkd
  tags: [network, netd]

# ---- DHCP client-id = MAC (HD-314) ------------------------------------------
# nas/oldsrv are the only DHCP-managed homelab hosts (Pi+VPS are static). Their DHCP
# client (dhcpcd on nas, NetworkManager on oldsrv) presents an RFC4361 DUID client-id by
# default, which does NOT match the MAC-keyed RouterOS reservations in network_static_hosts
# (mac: field) — so they land on the dynamic VLAN-10 pool (.100/.101) instead of their
# reserved statics (.10/.30). RouterOS matches reservations on client-id (DUID ≠ MAC pretty
# much always), so the host must present the interface MAC as client-id.
#
# The marker lives in the SSOT (network_static_hosts dhcp_client: mac on nas/oldsrv rows);
# this block applies it on the host: dhcpcd gets `clientid` (MAC/LL client-id) in its conf,
# NetworkManager gets ipv4.dhcp-client-id=mac. The netd-phys .network unit also carries
# ClientIdentifier=mac so the same invariant survives the eventual systemd-networkd cutover.
- name: Assert dhcp_client marker resolves for any host opting in
  assert:
    that:
      - dhcp_client_optin
    fail_msg: "dhcp_client marker on {{ inventory_hostname }} is not 'mac' (SSOT) HD-314"
  when: dhcp_client_optin
  tags: [network, dhcp-client]

- name: dhcpcd disable the RFC4361 DUID (nas; dhcpcd managed by ifupdown)
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    # neutralize the RFC4361 DUID (the default) so the server sees only our MAC client-id
    regexp: '^((#)?[[:space:]]*)duid([[:space:]]+.*)?$'
    line: '# duid (disabled by HD-314: MAC client-id, see clientid below)'
    create: false
  register: dhcpcd_duid
  when:
    - dhcp_client_optin
    - inventory_hostname == 'nas.kogler.si'
  notify: reload dhcpcd
  tags: [network, dhcp-client]

- name: enable dhcpcd MAC client-id (nas)
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    # replace any existing clientid/duid line with the MAC client-id (idempotent)
    regexp: '^((#)?[[:space:]]*)clientid[[:space:]].*$'
    line: 'clientid mac'
    create: false
  when:
    - dhcp_client_optin
    - inventory_hostname == 'nas.kogler.si'
  notify: reload dhcpcd
  tags: [network, dhcp-client]

- name: NetworkManager client-id -> interface MAC (oldsrv)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nm_oldsrv_profile }}"
      - ipv4.dhcp-client-id
      - mac
  when:
    - dhcp_client_optin
    - inventory_hostname == 'oldsrv.kogler.si'
    - nm_oldsrv_profile is defined
  changed_when: false
  tags: [network, dhcp-client]

# ---- Host-side resolver: the DNS tier, not the public bootstrap (HD-484) -------------------
# oldsrv is NetworkManager-managed (NM active; systemd-networkd disabled + inactive, so the
# netd units rendered above are inert on this box) and the profile that owns the uplink is the
# installer's `Wired connection 1` — the same profile HD-314 modifies just above. Its ipv4.dns was
# `1.1.1.1,1.0.0.1` (= bootstrap_dns_servers), which made every split-horizon name unresolvable ON
# THE BOX: the AI seat's engine endpoint `llm.kogler.si` returned getent-empty / curl rc=6 while the
# Technitium instance running on that very box answered it with `qr aa` (measured 2026-10-01, and
# 2026-09-30 for the bypassed-resolver leg — everything downstream of DNS already worked).
# Target pair + the reason the VPS primary is excluded: host_resolver_dns in
# host_vars/oldsrv.kogler.si.yml; prose: docs/network-dns.md §Host-side resolver.
#
# ⚠ Session-safety, the reason this is `device reapply` and not `connection up`: `modify` only
# rewrites the on-disk profile, and only the re-commit rewrites /etc/resolv.conf. `connection up`
# tears the interface down and re-activates it — that is the leg this converge (and every ssh into
# the box) rides. `device reapply` re-commits the changed profile WITHOUT dropping the link.
# ⚠ Both calls need root: as a plain user NetworkManager refuses them (measured rc=1 "Insufficient
# privileges" / rc=6 "not authorized"), which the hand-test hits but a converge does not, because
# playbooks/home_servers.yml runs the play with become: true.

- name: HD-484 | Gather the one network fact this block needs
  # NOT decoration — the fix for a bug the first --check run caught: `--tags <anything>` SKIPS the
  # implicit "Gathering Facts" task, so on the scoped converge form this block is meant to be applied
  # with (`--tags nm-resolver`, `--tags network`) ansible_default_ipv4 was UNDEFINED and the reapply
  # target was empty. `setup` is a read-only module, so it also runs under --check and the state line
  # below reports the real device there.
  ansible.builtin.setup:
    filter: ansible_default_ipv4
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: HD-484 | Take the uplink interface from the gathered facts
  # ⚠ `ansible_default_ipv4` as a TOP-LEVEL var does not exist in this repo: IaC/ansible/ansible.cfg
  # sets `inject_facts_as_vars = False` (HD-231), so facts are read as `ansible_facts[...]` and the
  # prefix is stripped inside that dict. That, plus the --tags/facts interaction above, is why the
  # first two --check runs of this block came back with an empty interface.
  ansible.builtin.set_fact:
    nm_resolver_iface: "{{ (ansible_facts['default_ipv4']['interface']) | default('') }}"
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]
- name: HD-484 | Assert the host resolver target is real addresses, not an unrendered template
  # Fail-loud guard, not decoration: host_resolver_dns is built by templating two SSOT scalars into
  # one comma-joined string. If either name ever stops resolving in the var chain, the string that
  # would reach the live profile is a literal `{{ … }}` — which nmcli would accept happily and which
  # would cost this box ALL name resolution. The shape test is the thing that cannot pass quietly.
  ansible.builtin.assert:
    that:
      - host_resolver_dns is match('^[0-9]+(\.[0-9]+){3}(,[0-9]+(\.[0-9]+){3})*$')
      - nm_resolver_iface | default('') | length > 0
    fail_msg: >-
      HD-484 cannot proceed on {{ inventory_hostname }}: want a comma-joined IPv4 pair in
      host_resolver_dns (host_vars/oldsrv.kogler.si.yml: dns_secondary_ip + dns_tertiary_ip) and the
      uplink interface from ansible_facts['default_ipv4'], and got resolver='{{ host_resolver_dns }}'
      iface='{{ nm_resolver_iface | default('<undefined>') }}'. Either half would leave this box
      unable to name anything.
    quiet: true
  # ⚠ Gated like EVERY other task in this block, not on host_resolver_dns alone. Found 2026-10-08 by
  # the pi converge (ok=37 changed=0 failed=1 — the play died here, so HA/alloy/tailscale never ran):
  # pi.kogler.si.yml:19 sets host_resolver_dns WITHOUT nm_oldsrv_profile (oldsrv-only, :49), so the
  # gather-facts and set_fact tasks above both skipped, nm_resolver_iface was never set, and the
  # guard's own second clause failed the play on a host that never applies this profile. A fail-loud
  # guard must not be able to break a host it does not describe; the pi's own resolver leg needs its
  # own shape check (HD-1101), not an oldsrv-shaped assertion.
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: HD-484 | Read the NM profile that owns the uplink (on-disk desired state)
  # Read with slurp, not `nmcli -g`: slurp is a check-mode-safe read-only module, so `--check` shows
  # the state that is REALLY on the box without the role needing a `check_mode: false` escape — and
  # scripts/check_self_converge_guard.py refuses a lockout role that writes under --check while
  # claiming check_safe (it said exactly that about the first draft of this block).
  ansible.builtin.slurp:
    path: "{{ nm_oldsrv_profile_path }}"
  register: nm_host_resolver_profile
  changed_when: false
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: HD-484 | Read /etc/resolv.conf (applied state)
  ansible.builtin.slurp:
    path: /etc/resolv.conf
  register: nm_host_resolver_file
  changed_when: false
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: HD-484 | Derive wanted / on-disk / applied resolver state
  # Two DIFFERENT states are in play and the change converges both: the profile on disk (`dns=a;b;`,
  # semicolon-delimited keyfile form) and what NetworkManager has actually committed to
  # /etc/resolv.conf (`nameserver a`). Comparing only the first would leave a half-applied box green
  # forever; comparing only the second would re-run nmcli every converge.
  ansible.builtin.set_fact:
    nm_resolver_wanted: "{{ host_resolver_dns }}"
    nm_resolver_on_disk: >-
      {{ (nm_host_resolver_profile.content | default('') | b64decode).splitlines()
         | select('search', '^dns=') | join('') | regex_replace('^dns=', '')
         | split(';') | reject('equalto', '') | list | join(',') }}
    nm_resolver_applied: >-
      {{ (nm_host_resolver_file.content | default('') | b64decode).splitlines()
         | select('search', '^nameserver') | map('regex_replace', '^nameserver\s+', '')
         | list | join(',') }}
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: HD-484 | Report resolver state (context on every run; under --check this is the whole verdict)
  ansible.builtin.debug:
    msg: >-
      {{ nm_oldsrv_profile }} on {{ nm_resolver_iface | default('no-default-route-fact') }}:
      on-disk '{{ nm_resolver_on_disk | default('?') }}' | applied '{{ nm_resolver_applied | default('?') }}'
      | wanted '{{ nm_resolver_wanted | default('?') }}'{{ ' (--check: nothing written)' if ansible_check_mode else '' }}
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: HD-484 | Point the host resolver at the DNS tier
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nm_oldsrv_profile }}"
      - ipv4.dns
      - "{{ host_resolver_dns }}"
      - ipv4.ignore-auto-dns
      - "yes"
  register: nm_host_resolver_set
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
    - nm_resolver_on_disk != host_resolver_dns
  tags: [network, nm-resolver]

- name: HD-484 | Re-commit the profile so resolv.conf actually changes (device reapply — no link drop)
  # Gated on the APPLIED state, not on "did the modify change": that is what makes a half-applied box
  # (profile written, reapply refused by an earlier run) self-heal instead of sitting RED forever.
  # Runs immediately after the modify, in the same task list: a handler would flush at the END of the
  # play, i.e. AFTER the read-back below, which would then prove nothing (assert and act in one run —
  # the scripts/README.md guarded-converge lesson).
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - "{{ nm_resolver_iface }}"
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
    - nm_resolver_applied != host_resolver_dns
  tags: [network, nm-resolver]

- name: HD-484 | Re-read /etc/resolv.conf after the re-commit
  ansible.builtin.slurp:
    path: /etc/resolv.conf
  register: nm_host_resolver_after
  changed_when: false
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: HD-484 | Assert every resolver address is live in /etc/resolv.conf
  # rc=0 on `modify` only proves the profile on disk was written, and a soft `device reapply` CAN be
  # refused. The file — not the command — is the evidence (CONVENTIONS §6: a test that cannot fail is
  # not evidence; while the OLD pair still sits in this file the loop below is RED for every item).
  # Skipped under --check on purpose: nothing was written, so the file legitimately holds the OLD
  # state and asserting on it would be a lie in either direction — the --check verdict is the debug
  # line above.
  ansible.builtin.assert:
    that:
      - item in resolv_after
    fail_msg: >-
      nameserver {{ item }} is not in /etc/resolv.conf on {{ inventory_hostname }} — the profile was
      written but NetworkManager did not re-commit it. Actual file:
      {{ resolv_after }}
      Manual re-apply: nmcli device reapply {{ nm_resolver_iface | default('<uplink>') }}
      Rollback (back to the bootstrap pair): nmcli connection modify '{{ nm_oldsrv_profile }}' ipv4.dns
      1.1.1.1,1.0.0.1 && nmcli device reapply {{ nm_resolver_iface | default('<uplink>') }}
    quiet: true
  vars:
    resolv_after: "{{ (nm_host_resolver_after.content | default(nm_host_resolver_file.content | default('')) | b64decode) }}"
  loop: "{{ host_resolver_dns.split(',') }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]
# Load the profile into NetworkManager (idempotent: `load` then `up` the connection).
# HD-311 (b): tagged Mgmt sub-interface (eth0.99) — SAME Windows of correctness as pi-eth0:
# render-only on pi.kogler.si; never on another host. The Mgmt plane is ONLY reachable via
# this tagged leg from the Pi (verified live 2026-09-02: ping -I eth0.99 10.10.99.1 works).
- name: Render Pi Mgmt tag-99 sub-interface NetworkManager keyfile (tagged Mgmt)
  template:
    src: pi-mgmt.nmconnection.j2
    dest: "{{ nm_keyfile_dir }}/{{ nm_pi_mgmt_profile }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_pi_mgmt_subnet is string
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  notify: reload NetworkManager
  tags: [network, nm-pi-mgmt]

# Load + activate the Pi eth0 NM connection (idempotent: `load` then `up` the connection).

# A reload alone does not activate a NEW keyfile — NM must load it and bring eth0 up on it.
# HD-311 note: the tagged Mgmt sub-interface (pi-mgmt) must be brought up AFTER the parent
# (eth0) is up — NM brings child VLANs up with their parent, but a fresh keyfile needs one
# explicit `up` to register. For a NEWLY written keyfile (spark first converge), NM must also
# `reload` its connection store before `up` resolves the id (HD-367 live hit 2026-09-14:
# `nmcli connection up spark-eth0` → 'unknown connection'). Parent first, then child below.
- name: Reload NM connection store after keyfile writes (new keyfiles need a reload)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - reload
  changed_when: false
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - ansible_facts['service_mgr'] == 'systemd'
  tags: [network, nm-pi]

- name: Explicitly load NM keyfiles into the store (reload alone can miss fresh files)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - load
      - "{{ nm_keyfile_dir }}/{{ nm_pi_profile }}"
      - "{{ nm_keyfile_dir }}/{{ nm_pi_mgmt_profile }}"
  changed_when: false
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - ansible_facts['service_mgr'] == 'systemd'
  tags: [network, nm-pi]
- name: Load + activate Pi eth0 NM connection (Home parent)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nm_pi_connection_id }}"
  register: nm_pi_up
  changed_when: "'successfully activated' in nm_pi_up.stdout or 'failed' in nm_pi_up.stdout"
  failed_when:
    - nm_pi_up.rc != 0
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  tags: [network, nm-pi]

# Also load + activate the tagged Mgmt sub-interface (pi-mgmt, eth0.99).
# Live 2026-09-02: the tagged leg is the ONLY way the router reaches the Pi's mgmt IP.
# never-default keeps the default route on Home; route-metric 200 keeps 10.10.99.x on
# the tagged leg (the parent no longer carries that /24).
- name: Load + activate Pi Mgmt tag-99 sub-interface NM connection (tagged Mgmt)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nm_pi_mgmt_connection_id }}"
  register: nm_pi_mgmt_up
  changed_when: "'successfully activated' in nm_pi_mgmt_up.stdout or 'failed' in nm_pi_mgmt_up.stdout"
  failed_when:
    - nm_pi_mgmt_up.rc != 0
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  tags: [network, nm-pi-mgmt]
