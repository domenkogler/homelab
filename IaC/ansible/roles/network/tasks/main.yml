---
# network role — host networking foundation + SSOT doc render.
# Current scope:
#   1. assert we run as an allowed admin user (mirror of common's guard)
#   2. sync /etc/hosts from the shared template (same source as playbooks/all.yml)
#   3. Pi (RPi OS, NetworkManager): static dual-home on eth0 — Home 10.10.1.20 on the
#      untagged parent + Mgmt 10.10.99.20 on the TAGGED eth0.99 sub-interface;
#      session-safe, default via Home, Mgmt never-default).
#   4. render docs/network-addresses-generated.md from IaC via render-docs.yml (run by site.yml)
#   5. nas/oldsrv (systemd-networkd, desktop/VPS class): static dual-home — physical .network
#      (VLAN-10 Home address + default route), a VLAN-99 tagged sub-interface (.netdev) + its
#      .network (Mgmt address, connected route only). Session-safe: additive addresses.
#      ⚠ On oldsrv these units are INERT in practice: NetworkManager owns the uplink there and
#      systemd-networkd is disabled, so naming nothing on that box is the current state.
#   6. oldsrv host-side resolver: the box's own /etc/resolv.conf -> the DNS tier it hosts,
#      written through the NetworkManager profile that really owns that uplink (nmcli, needs become).
#   7. config-manager truth, measured on the box before anything is written: the declared manager
#      (host_vars network_manager) must be what the host is running, the units no manager reads are
#      removed, and a host whose owner and target differ writes no address leg here.
- name: Refuse network runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      network role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Sync /etc/hosts from shared template (bootstrap resolution)
  template:
    src: "{{ playbook_dir }}/../templates/etc_hosts.j2"
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
  tags: [hosts, network]

# ---- Which config-manager owns this box: measured, not implied --------------------------------
# One manager per box, and it must be the one the host DECLARES (docs/network.md
# §Config-manager truth). A unit rendered for a manager that does not run here is a file nothing
# reads: the converge prints green, nothing on the wire changes, and the next edit lands in the dead
# file again — the same silent-no-op class as a duplicate YAML key. So the declaration is compared
# with the box before any write below runs, and every write is gated on the declaration instead of on
# whether a role var happens to be defined (a role-level default made those guards true everywhere).
# Tagged net-guard as well as network: `--tags net-guard` is the read-only "what owns this box"
# converge, and it is the tag the self-converge guard's vocabulary must cover.
- name: Refuse a host that does not declare its config-manager
  ansible.builtin.assert:
    that:
      - network_manager is defined and network_manager in network_manager_kinds
      - network_manager_target is defined and network_manager_target in network_manager_kinds
    fail_msg: >-
      {{ inventory_hostname }} must declare both network_manager and network_manager_target in its
      host_vars, each one of: {{ network_manager_kinds | join(' | ') }}. roles/network supplies no
      default for either on purpose — a role-level value makes every `is defined` render guard on this
      fleet a tautology, which is how units came to be written on boxes whose manager never read them.
    quiet: true
  tags: [network, net-guard]

- name: Measure which config-managers are running
  # service_facts is a fact module, so it really executes under --check. That is why this block needs
  # no check_mode: false — roles/network may not carry one, being declared check-safe in the
  # self-converge guard (a read that runs during --check and claims to be a proof is the other way to
  # hand back a lockout).
  ansible.builtin.service_facts:
  tags: [network, net-guard]

- name: Measure the interface this box sends through
  # NOT decoration, and the same reason as the nm-resolver block: `--tags <anything>` skips the
  # implicit fact-gathering task, so the default-route fact must be taken explicitly here.
  ansible.builtin.setup:
    filter: ansible_default_ipv4
  tags: [network, net-guard]

- name: Look for the interface file ifupdown maintains
  # Classic ifupdown keeps /run/network/ifstate, listing one line per interface it brought up. A box
  # with no such file has no ifupdown leg at all — which is what separates `ifupdown` from
  # NetworkManager / systemd-networkd as a declared state.
  ansible.builtin.stat:
    path: /run/network/ifstate
  register: net_guard_ifstate_file
  changed_when: false
  tags: [network, net-guard]

- name: Read the interfaces ifupdown claims
  ansible.builtin.slurp:
    path: /run/network/ifstate
  register: net_guard_ifstate_raw
  when: net_guard_ifstate_file.stat.exists
  tags: [network, net-guard]

- name: Read which devices NetworkManager holds
  # `command` is SKIPPED under --check, so the route-ownership half is labelled SKIPPED there and
  # never counted as a pass: a verdict that depends on the invocation instead of on the box is not a
  # verdict (CONVENTIONS §6, prove the probe not the platform).
  ansible.builtin.command:
    argv: [nmcli, '-t', '-f', 'DEVICE,STATE', 'device']
  register: net_guard_nm_devices
  changed_when: false
  when: not ansible_check_mode
  tags: [network, net-guard]

- name: Take the measurement apart
  ansible.builtin.set_fact:
    net_guard_svc: "{{ ansible_facts['services'] }}"
    net_guard_route_if: "{{ ansible_facts['default_ipv4']['interface'] }}"
    net_guard_ifstate_lines: >-
      {{ (net_guard_ifstate_raw.content | b64decode).splitlines()
         if net_guard_ifstate_file.stat.exists else [] }}
    net_guard_nm_states: >-
      {{ dict(net_guard_nm_devices.stdout_lines | map('split', ':') | list)
         if not ansible_check_mode else {} }}
  tags: [network, net-guard]

- name: Derive the verdict the guards read
  ansible.builtin.set_fact:
    net_guard_nm_running: >-
      {{ 'NetworkManager.service' in net_guard_svc
         and net_guard_svc['NetworkManager.service'].get('state', 'unknown') == 'running' }}
    net_guard_networkd_running: >-
      {{ 'systemd-networkd.service' in net_guard_svc
         and net_guard_svc['systemd-networkd.service'].get('state', 'unknown') == 'running' }}
    net_guard_ifupdown_owns_route: >-
      {{ (net_guard_route_if ~ '=' ~ net_guard_route_if) in net_guard_ifstate_lines }}
    net_guard_nm_owns_route: >-
      {{ net_guard_nm_states.get(net_guard_route_if, 'not-measured').startswith('connected') }}
    # --check proves the manager states and the ifupdown claim; the two nmcli halves below need the
    # box to answer, so under --check the verdict is PARTIAL and the asserts that need it do not run.
    net_guard_measured: "{{ not ansible_check_mode }}"
  tags: [network, net-guard]

- name: Read which interfaces systemd-networkd has taken
  # Only while it runs: a stopped networkd holds nothing by definition. `AdministrativeState` is what
  # answers "did networkd take this interface", which is the question the refusal and the disarm below
  # must both be able to ask about a manager they are about to judge.
  ansible.builtin.command:
    argv: [networkctl, '--json=short', '--no-pager']
  register: net_guard_networkctl
  changed_when: false
  when:
    - not ansible_check_mode
    - net_guard_networkd_running | bool
  tags: [network, net-guard]

- name: List the interfaces the second manager has taken
  # Loopback aside: on a box where NetworkManager owns the uplink this list must be EMPTY for the
  # second manager to be either harmless or removable.
  ansible.builtin.set_fact:
    net_guard_networkd_held: >-
      {{ (net_guard_networkctl.stdout | from_json).Interfaces
         | rejectattr('AdministrativeState', 'equalto', 'unmanaged')
         | rejectattr('Name', 'equalto', 'lo')
         | map(attribute='Name') | list }}
  when:
    - not ansible_check_mode
    - net_guard_networkd_running | bool
  tags: [network, net-guard]

- name: Decide whether a second running manager is provably harmless
  # The ONE definition of the safety decision, read by both the refusal below and the disarm. Three
  # conditions, all measured here rather than trusted from the declaration: (1) a declared, settled
  # owner that is not networkd, (2) the default route provably rides that owner, (3) networkd has
  # taken no interface besides loopback, so stopping it removes no address and no route. Anything
  # unverifiable — a --check run that executed no nmcli, a manager that never answered — leaves this
  # false, and then the refusal names the one-line fix instead of the role acting on an assumption.
  ansible.builtin.set_fact:
    net_guard_disarm_ok: >-
      {{ (network_manager == 'NetworkManager')
         and net_manager_settled
         and (net_guard_nm_owns_route | bool)
         and (net_guard_networkd_running | bool)
         and (net_guard_networkd_held is defined)
         and ((net_guard_networkd_held | length) == 0) }}
  tags: [network, net-guard]

- name: Refuse a box whose running managers contradict the declaration
  # The two-managers half of the rule, and it runs under --check too because service_facts does.
  # Per kind, what the box must look like: NetworkManager -> NM runs and no second manager is left
  # standing; systemd-networkd -> networkd runs and NM does not; ifupdown -> networkd does not run
  # (NM may be installed and idle, as on nas: what matters is that it holds nothing).
  # The one exception is a second manager this same run can provably disarm — refusing a box the
  # converge is about to repair would turn self-curing drift back into a manual act.
  ansible.builtin.assert:
    that:
      - >-
        (network_manager == 'NetworkManager'
         and net_guard_nm_running
         and (not net_guard_networkd_running or net_guard_disarm_ok or not net_guard_measured))
        or (network_manager == 'systemd-networkd' and net_guard_networkd_running and not net_guard_nm_running)
        or (network_manager == 'ifupdown' and not net_guard_networkd_running)
    fail_msg: >-
      {{ inventory_hostname }} declares network_manager={{ network_manager }} but the box runs
      NetworkManager={{ net_guard_nm_running }} and systemd-networkd={{ net_guard_networkd_running }},
      and systemd-networkd has taken {{ net_guard_networkd_held | default(['<not measured>']) | join(', ') }}.
      Two managers on one box is the refused shape: either one can rewrite the interface the other was
      configured through, and the converge that follows cannot say which won. This run will not
      disarm it because a condition above could not be proved here. Either fix the declaration to what
      the box does (scripts/ansible/probe-net-manager.sh {{ inventory_hostname_short }}) or bring the
      box to the declared state — and if the box needs a manager this repo does not know about, that
      is a decision for docs/network.md §Config-manager truth, not a var edit here.
    quiet: true
  tags: [network, net-guard]

- name: Refuse a box where the declared manager does not own the interface the default route rides
  # The second half of the rule, and the one `is-active` cannot answer: a manager can be running and
  # still own nothing, which is how "the repo says networkd, the box says NetworkManager" stayed alive
  # for a year. A systemd-networkd host that declares NO netd address leg claims nothing about its
  # uplink address (the VPS: the provider image's own ifupdown file carries eth0 while networkd only
  # creates wg-s2s), so this task asserts the leg it can see: where a NIC is declared, that NIC must
  # be the one the route rides — a unit aimed at absent hardware is the defect this row exists for.
  ansible.builtin.assert:
    that:
      - >-
        (network_manager == 'NetworkManager' and net_guard_nm_owns_route and not net_guard_ifupdown_owns_route)
        or (network_manager == 'ifupdown' and net_guard_ifupdown_owns_route and not net_guard_nm_owns_route)
        or (network_manager == 'systemd-networkd'
            and (netd_phys_name is not defined or netd_phys_name == net_guard_route_if))
    fail_msg: >-
      {{ inventory_hostname }} declares network_manager={{ network_manager }} but the default route
      rides '{{ net_guard_route_if }}', where NetworkManager reports
      '{{ net_guard_nm_states.get(net_guard_route_if, 'no-device') }}' and ifupdown claims it is
      up={{ net_guard_ifupdown_owns_route }}. Nothing this role writes under the declared manager can
      change that interface, so a converge here would report success and change nothing — which is the
      failure this task exists to make loud. Read the box with
      scripts/ansible/probe-net-manager.sh {{ inventory_hostname_short }} and settle it there.
    quiet: true
  when: net_guard_measured | bool
  tags: [network, net-guard]

- name: Report the measured config-manager verdict
  # One line per host on every run, so the next agent does not have to guess which of the three
  # states this box is in, and so a --check run says SKIPPED where it did not measure.
  ansible.builtin.debug:
    msg: >-
      config-manager: declared {{ network_manager }} (target {{ network_manager_target }}) |
      running networkd={{ net_guard_networkd_running }} NetworkManager={{ net_guard_nm_running }} |
      route-if {{ net_guard_route_if }}: NM={{ net_guard_nm_states.get(net_guard_route_if, 'not-measured') }}
      ifupdown={{ net_guard_ifupdown_owns_route }} |
      {{ 'FROZEN: owner and target differ, no address leg is written here' if not net_manager_settled else 'legs open' }}
      {{ '| PARTIAL: --check runs no nmcli and no networkctl, so the route-ownership half and whether a
         second running manager can be disarmed are NOT measured here — this run neither refuses nor
         disarms on that half' if ansible_check_mode }}
  tags: [network, net-guard]

- name: Remove the netd units no manager reads
  # A host that declares no netd address leg must carry none of this role's units: while the running
  # manager does not read them they are not config, they are files that read as authored truth, and
  # editing them is a green converge that changes nothing. No networkd reload is notified here — on a
  # host whose manager is not networkd a reload could only disturb a manager that is holding
  # something, which is exactly the case the assert above already refused.
  ansible.builtin.find:
    paths: "{{ netd_dir }}"
    patterns: "{{ netd_unit_namespace }}"
  register: netd_stray_units
  when: netd_phys_name is not defined
  changed_when: false
  tags: [network, netd]

- name: Delete each unread netd unit
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ netd_stray_units.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: netd_phys_name is not defined
  tags: [network, netd]

- name: Disarm the second config-manager running beside the declared owner
  # The drift class made self-curing: on a box where NetworkManager is the declared, settled owner and
  # networkd is running while holding nothing, switching it off is the whole repair and belongs in the
  # converge, not in a runbook line somebody has to remember. Every condition lives in
  # net_guard_disarm_ok above, measured on the box. A box where the split is AUTHORED (the VPS:
  # networkd creates wg-s2s and is deliberately told to configure nothing) is excluded by the first
  # term, because its declared manager is networkd itself — stopping it there would end the
  # site-to-site tunnel at the next boot.
  ansible.builtin.systemd:
    name: systemd-networkd
    state: stopped
    enabled: false
  register: net_guard_disarm
  when: net_guard_disarm_ok | bool
  tags: [network, net-guard]

- name: Disarm the socket that re-activates the second config-manager
  # Measured on spark: stopping systemd-networkd alone does NOT settle the box, because the
  # service is TriggeredBy=systemd-networkd.socket (netlink/rtnetlink socket activation). The socket
  # survives the service stop, and the NEXT RTNL event — even the same play's own nmcli reload/up on
  # the NM leg — re-spawns the second manager within seconds. networkd.socket must be stopped AND
  # disabled in the same disarm, so no later event can resurrect the manager this converge disarmed.
  # Same conditions and same settle-proof as the service: every term still measured on the box.
  ansible.builtin.systemd:
    name: systemd-networkd.socket
    state: stopped
    enabled: false
  when: net_guard_disarm_ok | bool
  tags: [network, net-guard]

- name: Re-read the devices after disarming the second manager
  ansible.builtin.command:
    argv: [nmcli, '-t', '-f', 'DEVICE,STATE', 'device']
  register: net_guard_after
  changed_when: false
  when: net_guard_disarm.changed | bool
  tags: [network, net-guard]

- name: Assert the leg still rides the declared manager after the disarm
  # The disarm is allowed only because stopping it cannot move traffic; this is where that claim is
  # either true or a failed play. Asserting it in the SAME run is the point — checked in a later run,
  # the box has already been left without the leg the operator is sitting on.
  ansible.builtin.assert:
    that:
      - nm_after_state is match('^connected')
    fail_msg: >-
      Stopping systemd-networkd on {{ inventory_hostname }} left '{{ net_guard_route_if }}' without a
      manager — NetworkManager now reports it as '{{ nm_after_state }}'. Bring the declared owner back
      over that interface at once (`nmcli connection up <the connection for
      {{ net_guard_route_if }}>`) and re-enable networkd (`systemctl enable --now systemd-networkd`)
      until the box is understood: a second manager carrying the leg is exactly what the condition
      list above was supposed to rule out.
    quiet: true
  vars:
    nm_after_map: "{{ dict(net_guard_after.stdout_lines | map('split', ':') | list) }}"
    nm_after_state: "{{ nm_after_map.get(net_guard_route_if, 'gone') }}"
  when: net_guard_disarm.changed | bool
  tags: [network, net-guard]

# Pi/spark static dual-home via NetworkManager. RPi OS and DGX OS ship NetworkManager and it owns
# their uplink (docs/network-rejected.md), so these keyfiles ARE those hosts' addressing.
# Gated on the host being in the dual-home list AND declaring NetworkManager as a SETTLED owner: a
# host whose migration is still owed gets no keyfile rendered and none activated, because activating
# one moves the interface the converge is sitting on. A settled NetworkManager host is only rendered
# here if the list names it — nas keeps its own keyfile outside this role.
# Values are SSOT-derived (host_vars ansible_host/mgmt_ip + network_static_hosts).
# The untagged parent (pi-eth0) carries HOME only; the MGMT IP rides the TAGGED eth0.99
# sub-interface (pi-mgmt). A connected route for 10.10.99.x on the parent hijacks lookups away
# from the tagged leg, and the router then reports 'No route to host' for the mgmt address.
# ---- host_resolver_dns: the shape guard BOTH apply legs share ------------------------------
# `host_resolver_dns` is the ONE var every host that sets a resolver actually applies: the nmcli
# leg below writes it into the profile named by `nm_oldsrv_profile`, the keyfile leg below renders
# it into the connection named by `nm_pi_profile`. The guard is keyed on THAT var plus the profile
# var of the leg this host really writes — never on one host's profile var. An assertion gated on
# `nm_oldsrv_profile` (an oldsrv-only host var) is SKIPPED on every other host, which is how the Pi
# — a box that declares host_resolver_dns and writes it into a keyfile — had no shape check at all:
# a broken `dns_*` chain there reaches NetworkManager as a literal `{{ … }}` and costs the HA
# primary every name it has. A guard must not be able to break a host it does not describe, and it
# must not be able to silently skip one it does.
- name: Gather the fact the resolver shape guard needs
  # NOT decoration: `--tags <anything>` SKIPS the implicit "Gathering Facts" task, so under
  # `--tags nm-resolver` / `--tags nm-pi` the default-route fact must be taken explicitly here.
  # `setup` is read-only, so it really runs under --check and the guard judges the real box.
  ansible.builtin.setup:
    filter: ansible_default_ipv4
  when: host_resolver_dns is defined
  tags: [network, nm-pi, nm-resolver]

- name: Name the profile and the interface THIS host applies its resolver through
  # Per host, per leg: the nmcli host modifies the installer's profile by NAME, the keyfile hosts
  # render a profile whose `interface-name=` is nm_parent_iface. A host that declares
  # host_resolver_dns while matching NEITHER leg gets an empty profile here and is refused below —
  # a resolver string nothing writes is the same silent-no-op class as a unit rendered for a
  # config-manager that is not running (docs/network.md §Config-manager truth).
  ansible.builtin.set_fact:
    nm_resolver_profile_target: >-
      {{ nm_oldsrv_profile
         if nm_oldsrv_profile is defined
         else (nm_pi_profile
               if (inventory_hostname in network_nm_dualhome_hosts
                   and (network_manager | default('')) == 'NetworkManager'
                   and nm_parent_iface | default('') | length > 0)
               else '') }}
    nm_resolver_iface: >-
      {{ nm_parent_iface
         if (nm_oldsrv_profile is not defined
             and inventory_hostname in network_nm_dualhome_hosts)
         else (ansible_facts['default_ipv4']['interface'] | default('')) }}
  when: host_resolver_dns is defined
  tags: [network, nm-pi, nm-resolver]

- name: Assert this host's resolver target is real addresses on a real interface
  # Fail-loud, not decoration. host_resolver_dns is built by templating two SSOT scalars into one
  # comma-joined string; if either name ever stops resolving in the var chain, what reaches the
  # live profile is a literal `{{ … }}` — nmcli and the keyfile both accept that happily, and it
  # costs the box ALL name resolution. The shape test is the thing that cannot pass quietly.
  ansible.builtin.assert:
    that:
      - host_resolver_dns is match('^[0-9]+(\.[0-9]+){3}(,[0-9]+(\.[0-9]+){3})*$')
      - nm_resolver_profile_target | default('') | length > 0
      - nm_resolver_iface | default('') | length > 0
      # The interface the resolver rides IS the interface that carries the default route. On the
      # nmcli leg this is an identity (both come from the same fact); on a keyfile host it is the
      # real cross-check — a rendered `interface-name=` that is not the uplink would write the
      # resolver into a profile NetworkManager never commits to /etc/resolv.conf.
      - nm_resolver_iface == (ansible_facts['default_ipv4']['interface'] | default(''))
    fail_msg: >-
      Cannot proceed on {{ inventory_hostname }}: host_resolver_dns must be a comma-joined IPv4
      list, applied through a profile this host actually writes, on an interface that is real.
      Got resolver='{{ host_resolver_dns }}' profile='{{ nm_resolver_profile_target | default('<undefined>') }}'
      iface='{{ nm_resolver_iface | default('<undefined>') }}'
      (default-route iface '{{ ansible_facts['default_ipv4']['interface'] | default('<none>') }}').
      The profile var is per host on purpose: nm_oldsrv_profile names the nmcli profile, nm_pi_profile
      the rendered keyfile. A resolver written on the wrong interface is as dead as a resolver
      written to no profile at all. Either half wrong leaves this box unable to name anything.
    quiet: true
  when: host_resolver_dns is defined
  tags: [network, nm-pi, nm-resolver]

- name: Render Pi eth0 NetworkManager keyfile (untagged HOME parent)
  template:
    src: pi-eth0.nmconnection.j2
    dest: "{{ nm_keyfile_dir }}/{{ nm_pi_profile }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - network_manager == 'NetworkManager'
    - net_manager_settled
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  notify: reload NetworkManager
  tags: [network, nm-pi]

# ---- the systemd-networkd dual-home legs (only where networkd IS the declared owner) ----
# Where a host declares systemd-networkd AND declares which NIC it owns, the port model is untagged
# Home (10) + tagged Mgmt (99) on the SAME physical NIC: a physical .network (Home address + default
# route), a .99 VLAN sub-interface (.netdev) and its .network (Mgmt address, connected route only).
# No host in the inventory is in that shape today: the VPS is the only systemd-networkd host and its
# uplink address belongs to the provider image, so it declares no netd_phys_name and renders none of
# these. Session-safe when a host is: rendering units is additive and the networkd-reload handler
# applies them without severing the Home leg the session rides (the Mgmt leg is a tagged addition).
# docs/network-rejected.md: netplan rejected; config-managers are measured per host, not ruled fleet-wide.
- name: Render systemd-networkd .network for the physical uplink (Home 10 + mgmt-99 tagged)
  ansible.builtin.template:
    src: netd-phys.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.network"
    owner: root
    group: root
    mode: '0644'
  when:
    # The guard asks the HOST: the declared manager owns this leg, and the host declares the NIC it
    # owns. A role-level NIC default made the old `netd_phys_name is defined` guard true on every
    # host in the inventory, which is how netd units reached boxes that never read them.
    - network_manager == 'systemd-networkd'
    - net_manager_settled
    - netd_phys_name is defined
    - host_home_ip is defined
    - home_gateway_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .netdev for the VLAN-99 tagged sub-interface
  ansible.builtin.template:
    src: netd-vlan.netdev.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.netdev"
    owner: root
    group: root
    mode: '0644'
  when:
    - network_manager == 'systemd-networkd'
    - net_manager_settled
    - netd_phys_name is defined
    - netd_vlan_ifname is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .network for the VLAN-99 tagged sub-interface (mgmt addr)
  ansible.builtin.template:
    src: netd-vlan.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.99.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - network_manager == 'systemd-networkd'
    - net_manager_settled
    - netd_phys_name is defined
    - netd_vlan_ifname is defined
    - mgmt_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .network pinning the VPS tunnel route to the Home NIC
  # Author-shaped for a netd host with a second NIC whose DHCP default shadows the managed Home
  # NIC. No host is in that shape today: the only systemd-networkd host is the VPS, whose uplink
  # address is the provider's. On a NetworkManager host the routes come from that host's own profile,
  # so a shadowing default there is a live routing fact this netd leg cannot reach.
  ansible.builtin.template:
    src: netd-tunnel-route.network.j2
    dest: "{{ netd_dir }}/30-{{ netd_phys_name }}-tunnel.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - network_manager == 'systemd-networkd'
    - net_manager_settled
    - netd_phys_name is defined
    - netd_tunnel_route is defined
  notify: reload systemd-networkd
  tags: [network, netd]

# ---- DHCP client-id = MAC ------------------------------------------
# nas/oldsrv are the hosts this leg was written for (Pi+VPS are static). It edits the client config
# each box carries — /etc/dhcpcd.conf on nas, the NetworkManager profile on oldsrv — because their
# DHCP client presents an RFC4361 DUID client-id by default, which does NOT match the MAC-keyed
# RouterOS reservations in network_static_hosts (mac: field) — so a lease lands on the dynamic
# VLAN-10 pool (.100/.101) instead of the reserved statics (.10/.30). RouterOS matches reservations
# on client-id (DUID ≠ MAC pretty much always), so the host must present the interface MAC as
# client-id. ⚠ Neither box addresses itself by DHCP any more (nas: NM keyfile, oldsrv: NM profile,
# both `manual`), so what this leg protects is a lease, not either host's address.
#
# The marker lives in the SSOT (network_static_hosts dhcp_client: mac on nas/oldsrv rows);
# this block applies it on the host: dhcpcd gets `clientid` (MAC/LL client-id) in its conf,
# NetworkManager gets ipv4.dhcp-client-id=mac. The netd-phys .network unit also carries
# ClientIdentifier=mac so the same invariant survives the eventual systemd-networkd cutover.
- name: Assert dhcp_client marker resolves for any host opting in
  assert:
    that:
      - dhcp_client_optin
    fail_msg: "dhcp_client marker on {{ inventory_hostname }} is not 'mac' (SSOT)"
  when: dhcp_client_optin
  tags: [network, dhcp-client]

- name: dhcpcd disable the RFC4361 DUID (nas)
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    # neutralize the RFC4361 DUID (the default) so the server sees only our MAC client-id
    regexp: '^((#)?[[:space:]]*)duid([[:space:]]+.*)?$'
    line: '# duid (disabled by HD-314: MAC client-id, see clientid below)'
    create: false
  register: dhcpcd_duid
  when:
    - dhcp_client_optin
    - inventory_hostname == 'nas.kogler.si'
  notify: reload dhcpcd
  tags: [network, dhcp-client]

- name: enable dhcpcd MAC client-id (nas)
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    # replace any existing clientid/duid line with the MAC client-id (idempotent)
    regexp: '^((#)?[[:space:]]*)clientid[[:space:]].*$'
    line: 'clientid mac'
    create: false
  when:
    - dhcp_client_optin
    - inventory_hostname == 'nas.kogler.si'
  notify: reload dhcpcd
  tags: [network, dhcp-client]

- name: NetworkManager client-id -> interface MAC (oldsrv)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nm_oldsrv_profile }}"
      - ipv4.dhcp-client-id
      - mac
  when:
    - dhcp_client_optin
    - inventory_hostname == 'oldsrv.kogler.si'
    - nm_oldsrv_profile is defined
  changed_when: false
  tags: [network, dhcp-client]

# ---- Host-side resolver: the DNS tier, not the public bootstrap -------------------
# oldsrv is NetworkManager-managed (NM active; systemd-networkd disabled + inactive, so the
# netd units rendered above are inert on this box) and the profile that owns the uplink is the
# installer's `Wired connection 1` — the same profile the dhcp-client-id block above modifies. If its
# ipv4.dns is the public bootstrap_dns_servers pair, every split-horizon name is unresolvable ON THE
# BOX while the Technitium instance on that same box answers it authoritatively.
# Target pair + the reason the VPS primary is excluded: host_resolver_dns in
# host_vars/oldsrv.kogler.si.yml; prose: docs/network-dns.md §Host-side resolver.
#
# ⚠ Session-safety, the reason this is `device reapply` and not `connection up`: `modify` only
# rewrites the on-disk profile, and only the re-commit rewrites /etc/resolv.conf. `connection up`
# tears the interface down and re-activates it — that is the leg this converge (and every ssh into
# the box) rides. `device reapply` re-commits the changed profile WITHOUT dropping the link.
# ⚠ Both calls need root: as a plain user NetworkManager refuses them (rc=1 "Insufficient
# privileges" / rc=6 "not authorized"), which a hand-test hits but a converge does not, because
# playbooks/home_servers.yml runs the play with become: true.

# The shape guard for this leg — resolver list, profile var, interface — runs EARLIER, above the
# keyfile render, and is keyed on host_resolver_dns so it fires on every host that applies the var
# (pi and spark through the keyfile, oldsrv through the nmcli tasks below). Under `--tags
# nm-resolver` it is the first thing in this block that runs, so nothing below reads an
# unverified string.
# ⚠ `ansible_default_ipv4` as a TOP-LEVEL var does not exist in this repo: IaC/ansible/ansible.cfg
# sets `inject_facts_as_vars = False`, so facts are read as `ansible_facts[...]`. Reading a
# top-level fact var here yields an empty interface, especially under a --tags run.

- name: Read the NM profile that owns the uplink (on-disk desired state)
  # Read with slurp, not `nmcli -g`: slurp is a check-mode-safe read-only module, so `--check` shows
  # the state that is REALLY on the box without the role needing a `check_mode: false` escape — and
  # scripts/gate/check_self_converge_guard.py refuses a lockout role that writes under --check while
  # claiming check_safe (it said exactly that about the first draft of this block).
  ansible.builtin.slurp:
    path: "{{ nm_oldsrv_profile_path }}"
  register: nm_host_resolver_profile
  changed_when: false
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: Read /etc/resolv.conf (applied state)
  ansible.builtin.slurp:
    path: /etc/resolv.conf
  register: nm_host_resolver_file
  changed_when: false
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: Derive wanted / on-disk / applied resolver state
  # Two DIFFERENT states are in play and the change converges both: the profile on disk (`dns=a;b;`,
  # semicolon-delimited keyfile form) and what NetworkManager has actually committed to
  # /etc/resolv.conf (`nameserver a`). Comparing only the first would leave a half-applied box green
  # forever; comparing only the second would re-run nmcli every converge.
  ansible.builtin.set_fact:
    nm_resolver_wanted: "{{ host_resolver_dns }}"
    nm_resolver_on_disk: >-
      {{ (nm_host_resolver_profile.content | default('') | b64decode).splitlines()
         | select('search', '^dns=') | join('') | regex_replace('^dns=', '')
         | split(';') | reject('equalto', '') | list | join(',') }}
    nm_resolver_applied: >-
      {{ (nm_host_resolver_file.content | default('') | b64decode).splitlines()
         | select('search', '^nameserver') | map('regex_replace', '^nameserver\s+', '')
         | list | join(',') }}
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: Report resolver state (context on every run; under --check this is the whole verdict)
  ansible.builtin.debug:
    msg: >-
      {{ nm_oldsrv_profile }} on {{ nm_resolver_iface | default('no-default-route-fact') }}:
      on-disk '{{ nm_resolver_on_disk | default('?') }}' | applied '{{ nm_resolver_applied | default('?') }}'
      | wanted '{{ nm_resolver_wanted | default('?') }}'{{ ' (--check: nothing written)' if ansible_check_mode else '' }}
  when:
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: Point the host resolver at the DNS tier
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nm_oldsrv_profile }}"
      - ipv4.dns
      - "{{ host_resolver_dns }}"
      - ipv4.ignore-auto-dns
      - "yes"
  register: nm_host_resolver_set
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
    - nm_resolver_on_disk != host_resolver_dns
  tags: [network, nm-resolver]

- name: Re-commit the profile so resolv.conf actually changes (device reapply — no link drop)
  # Gated on the APPLIED state, not on "did the modify change": that is what makes a half-applied box
  # (profile written, reapply refused by an earlier run) self-heal instead of sitting RED forever.
  # Runs immediately after the modify, in the same task list: a handler would flush at the END of the
  # play, i.e. AFTER the read-back below, which would then prove nothing (assert and act in one run —
  # the scripts/README.md guarded-converge lesson).
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - "{{ nm_resolver_iface }}"   # set by the shape guard above, from the gathered default-route fact
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
    - nm_resolver_applied != host_resolver_dns
  tags: [network, nm-resolver]

- name: Re-read /etc/resolv.conf after the re-commit
  ansible.builtin.slurp:
    path: /etc/resolv.conf
  register: nm_host_resolver_after
  changed_when: false
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]

- name: Assert every resolver address is live in /etc/resolv.conf
  # rc=0 on `modify` only proves the profile on disk was written, and a soft `device reapply` CAN be
  # refused. The file — not the command — is the evidence (CONVENTIONS §6: a test that cannot fail is
  # not evidence; while the OLD pair still sits in this file the loop below is RED for every item).
  # Skipped under --check on purpose: nothing was written, so the file legitimately holds the OLD
  # state and asserting on it would be a lie in either direction — the --check verdict is the debug
  # line above.
  ansible.builtin.assert:
    that:
      - item in resolv_after
    fail_msg: >-
      nameserver {{ item }} is not in /etc/resolv.conf on {{ inventory_hostname }} — the profile was
      written but NetworkManager did not re-commit it. Actual file:
      {{ resolv_after }}
      Manual re-apply: nmcli device reapply {{ nm_resolver_iface | default('<uplink>') }}
      Rollback (back to the bootstrap pair): nmcli connection modify '{{ nm_oldsrv_profile }}' ipv4.dns
      1.1.1.1,1.0.0.1 && nmcli device reapply {{ nm_resolver_iface | default('<uplink>') }}
    quiet: true
  vars:
    resolv_after: "{{ (nm_host_resolver_after.content | default(nm_host_resolver_file.content | default('')) | b64decode) }}"
  loop: "{{ host_resolver_dns.split(',') }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - nm_oldsrv_profile is defined
    - host_resolver_dns is defined
  tags: [network, nm-resolver]
# Load the profile into NetworkManager (idempotent: `load` then `up` the connection).
# Tagged Mgmt sub-interface (eth0.99) — SAME windows of correctness as pi-eth0:
# render-only on pi.kogler.si; never on another host. The Mgmt plane is ONLY reachable from the Pi
# through this tagged leg.
- name: Render Pi Mgmt tag-99 sub-interface NetworkManager keyfile (tagged Mgmt)
  template:
    src: pi-mgmt.nmconnection.j2
    dest: "{{ nm_keyfile_dir }}/{{ nm_pi_mgmt_profile }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - network_manager == 'NetworkManager'
    - net_manager_settled
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_pi_mgmt_subnet is string
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  notify: reload NetworkManager
  tags: [network, nm-pi-mgmt]

# Load + activate the Pi eth0 NM connection (idempotent: `load` then `up` the connection).

# A reload alone does not activate a NEW keyfile — NM must load it and bring eth0 up on it.
# The tagged Mgmt sub-interface (pi-mgmt) must be brought up AFTER the parent
# (eth0) is up — NM brings child VLANs up with their parent, but a fresh keyfile needs one
# explicit `up` to register. For a NEWLY written keyfile (first converge), NM must also
# `reload` its connection store before `up` resolves the id, otherwise `nmcli connection up`
# fails with 'unknown connection'. Parent first, then child below.
- name: Reload NM connection store after keyfile writes (new keyfiles need a reload)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - reload
  changed_when: false
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - network_manager == 'NetworkManager'
    - net_manager_settled
    - ansible_facts['service_mgr'] == 'systemd'
  tags: [network, nm-pi]

- name: Explicitly load NM keyfiles into the store (reload alone can miss fresh files)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - load
      - "{{ nm_keyfile_dir }}/{{ nm_pi_profile }}"
      - "{{ nm_keyfile_dir }}/{{ nm_pi_mgmt_profile }}"
  changed_when: false
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - network_manager == 'NetworkManager'
    - net_manager_settled
    - ansible_facts['service_mgr'] == 'systemd'
  tags: [network, nm-pi]
- name: Load + activate Pi eth0 NM connection (Home parent)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nm_pi_connection_id }}"
  register: nm_pi_up
  changed_when: "'successfully activated' in nm_pi_up.stdout or 'failed' in nm_pi_up.stdout"
  failed_when:
    - nm_pi_up.rc != 0
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - network_manager == 'NetworkManager'
    - net_manager_settled
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  tags: [network, nm-pi]

# Also load + activate the tagged Mgmt sub-interface (pi-mgmt, eth0.99).
# The tagged leg is the ONLY way the router reaches the Pi's mgmt IP.
# never-default keeps the default route on Home; route-metric 200 keeps 10.10.99.x on
# the tagged leg (the parent no longer carries that /24).
- name: Load + activate Pi Mgmt tag-99 sub-interface NM connection (tagged Mgmt)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nm_pi_mgmt_connection_id }}"
  register: nm_pi_mgmt_up
  changed_when: "'successfully activated' in nm_pi_mgmt_up.stdout or 'failed' in nm_pi_mgmt_up.stdout"
  failed_when:
    - nm_pi_mgmt_up.rc != 0
  when:
    - inventory_hostname in network_nm_dualhome_hosts
    - network_manager == 'NetworkManager'
    - net_manager_settled
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_parent_iface is defined
    - nm_parent_iface | length > 0
  tags: [network, nm-pi-mgmt]
