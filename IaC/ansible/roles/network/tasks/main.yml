---
# network role — host networking foundation + SSOT doc render.
# Current scope:
#   1. assert we run as an allowed admin user (mirror of common's guard)
#   2. sync /etc/hosts from the shared template (same source as playbooks/all.yml)
#   3. Pi (RPi OS, NetworkManager): static dual-home on eth0 — Home 10.10.1.20 + Mgmt
#      10.10.99.20 from host_vars (ansible_host/mgmt_ip) via an NM keyfile profile
#      (Pi-uses-NetworkManager, network-rejected.md 2026-09-01 / HD-307; RPi OS ships NM,
#      no systemd-networkd active). Session-safe: additive addresses, default via Home,
#      Mgmt never-default.
#   4. render docs/network-addresses-generated.md from IaC via render-docs.yml (run by site.yml)
#   5. nas/oldsrv (systemd-networkd, desktop/VPS class): static dual-home — physical .network
#      (VLAN-10 Home address + default route), a VLAN-99 tagged sub-interface (.netdev) + its
#      .network (Mgmt address, connected route only). Session-safe: additive addresses.
- name: Refuse network runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      network role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Sync /etc/hosts from shared template (bootstrap resolution)
  template:
    src: "{{ playbook_dir }}/../templates/etc_hosts.j2"
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
  tags: [hosts, network]

# Pi static dual-home via NetworkManager (HD-307, Pi-uses-NM decision network-rejected.md 2026-09-01).
# RPi OS ships NetworkManager (no systemd-networkd active) — this is the Pi's manager.
# Guarded to pi.kogler.si only: no other host opts into NM dual-home yet; desktop/VPS stay
# systemd-networkd. Values are SSOT-derived (host_vars ansible_host/mgmt_ip + network_static_hosts).
- name: Render Pi eth0 NetworkManager keyfile (static dual-home)
  template:
    src: pi-eth0.nmconnection.j2
    dest: "{{ nm_keyfile_dir }}/{{ nm_pi_profile }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname == 'pi.kogler.si'
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
  notify: reload NetworkManager
  tags: [network, nm-pi]

# ---- nas/oldsrv netd (systemd-networkd) static dual-home (HD-311) ----
# desktop/VPS-class hosts use systemd-networkd (network-rejected.md: netplan rejected,
# systemd-networkd the config-manager; Pi-uses-NM is the Pi exception). The port model
# (HD-310) is untagged Home (10) + tagged Mgmt (99) on the SAME physical NIC; netd
# units render the physical .network (Home addr + default) + a .99 VLAN sub-interface
# (.netdev) + its .network (mgmt addr, connected route only).
# Session-safe: rendering units is additive; networkd-reload applies them without
# severing the existing session on the Home leg (the mgmt leg is a tagged addition).
- name: Render systemd-networkd .network for the physical uplink (Home 10 + mgmt-99 tagged)
  ansible.builtin.template:
    src: netd-phys.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_phys_name is defined
    - host_home_ip is defined
    - home_gateway_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .netdev for the VLAN-99 tagged sub-interface
  ansible.builtin.template:
    src: netd-vlan.netdev.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.netdev"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_phys_name is defined
    - netd_vlan_ifname is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .network for the VLAN-99 tagged sub-interface (mgmt addr)
  ansible.builtin.template:
    src: netd-vlan.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.99.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_vlan_ifname is defined
    - mgmt_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

# Load the profile into NetworkManager (idempotent: `load` then `up` the connection).
# A reload alone does not activate a NEW keyfile — NM must load it and bring eth0 up on it.
- name: Load + activate Pi eth0 NM connection
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nm_pi_connection_id }}"
  register: nm_pi_up
  changed_when: "'successfully activated' in nm_pi_up.stdout or 'failed' in nm_pi_up.stdout"
  failed_when:
    - nm_pi_up.rc != 0
  when:
    - inventory_hostname == 'pi.kogler.si'
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
  tags: [network, nm-pi]
