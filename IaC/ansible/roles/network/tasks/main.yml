---
# network role — host networking foundation + SSOT doc render.
# Current scope:
#   1. assert we run as an allowed admin user (mirror of common's guard)
#   2. sync /etc/hosts from the shared template (same source as playbooks/all.yml)
#   3. Pi (RPi OS, NetworkManager): static dual-home on eth0 — Home 10.10.1.20 on the
#      untagged parent + Mgmt 10.10.99.20 on the TAGGED eth0.99 sub-interface (HD-311(b));
#      session-safe, default via Home, Mgmt never-default).
#   4. render docs/network-addresses-generated.md from IaC via render-docs.yml (run by site.yml)
#   5. nas/oldsrv (systemd-networkd, desktop/VPS class): static dual-home — physical .network
#      (VLAN-10 Home address + default route), a VLAN-99 tagged sub-interface (.netdev) + its
#      .network (Mgmt address, connected route only). Session-safe: additive addresses.
- name: Refuse network runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      network role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Sync /etc/hosts from shared template (bootstrap resolution)
  template:
    src: "{{ playbook_dir }}/../templates/etc_hosts.j2"
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
  tags: [hosts, network]

# Pi static dual-home via NetworkManager (HD-307, Pi-uses-NM decision network-rejected.md 2026-09-01).
# RPi OS ships NetworkManager (no systemd-networkd active) — this is the Pi's manager.
# Guarded to pi.kogler.si only: no other host opts into NM dual-home yet; desktop/VPS stay
# systemd-networkd. Values are SSOT-derived (host_vars ansible_host/mgmt_ip + network_static_hosts).
# HD-311: the untagged parent (pi-eth0) carries HOME only; the MGMT IP rides the TAGGED
# eth0.99 sub-interface (pi-mgmt) — its connected route on the parent hijacked 10.10.99.x
# lookups away from the tagged leg (router99 'No route to host' live 2026-09-02).
- name: Render Pi eth0 NetworkManager keyfile (untagged HOME parent)
  template:
    src: pi-eth0.nmconnection.j2
    dest: "{{ nm_keyfile_dir }}/{{ nm_pi_profile }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname == 'pi.kogler.si'
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
  notify: reload NetworkManager
  tags: [network, nm-pi]

# ---- nas/oldsrv netd (systemd-networkd) static dual-home (HD-311) ----
# desktop/VPS-class hosts use systemd-networkd (network-rejected.md: netplan rejected,
# systemd-networkd the config-manager; Pi-uses-NM is the Pi exception). The port model
# (HD-310) is untagged Home (10) + tagged Mgmt (99) on the SAME physical NIC; netd
# units render the physical .network (Home addr + default) + a .99 VLAN sub-interface
# (.netdev) + its .network (mgmt addr, connected route only).
# Session-safe: rendering units is additive; networkd-reload applies them without
# severing the existing session on the Home leg (the mgmt leg is a tagged addition).
- name: Render systemd-networkd .network for the physical uplink (Home 10 + mgmt-99 tagged)
  ansible.builtin.template:
    src: netd-phys.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_phys_name is defined
    - host_home_ip is defined
    - home_gateway_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .netdev for the VLAN-99 tagged sub-interface
  ansible.builtin.template:
    src: netd-vlan.netdev.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.netdev"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_phys_name is defined
    - netd_vlan_ifname is defined
  notify: reload systemd-networkd
  tags: [network, netd]

- name: Render systemd-networkd .network for the VLAN-99 tagged sub-interface (mgmt addr)
  ansible.builtin.template:
    src: netd-vlan.network.j2
    dest: "{{ netd_dir }}/20-{{ netd_phys_name }}.99.network"
    owner: root
    group: root
    mode: '0644'
  when:
    - netd_vlan_ifname is defined
    - mgmt_ip is defined
  notify: reload systemd-networkd
  tags: [network, netd]

# ---- DHCP client-id = MAC (HD-314) ------------------------------------------
# nas/oldsrv are the only DHCP-managed homelab hosts (Pi+VPS are static). Their DHCP
# client (dhcpcd on nas, NetworkManager on oldsrv) presents an RFC4361 DUID client-id by
# default, which does NOT match the MAC-keyed RouterOS reservations in network_static_hosts
# (mac: field) — so they land on the dynamic VLAN-10 pool (.100/.101) instead of their
# reserved statics (.10/.30). RouterOS matches reservations on client-id (DUID ≠ MAC pretty
# much always), so the host must present the interface MAC as client-id.
#
# The marker lives in the SSOT (network_static_hosts dhcp_client: mac on nas/oldsrv rows);
# this block applies it on the host: dhcpcd gets `clientid` (MAC/LL client-id) in its conf,
# NetworkManager gets ipv4.dhcp-client-id=mac. The netd-phys .network unit also carries
# ClientIdentifier=mac so the same invariant survives the eventual systemd-networkd cutover.
- name: Assert dhcp_client marker resolves for any host opting in
  assert:
    that:
      - dhcp_client | default('none') == 'mac'
    fail_msg: "dhcp_client marker on {{ inventory_hostname }} is not 'mac' (SSOT) HD-314"
  when: dhcp_client is defined
  tags: [network, dhcp-client]

- name: dhcpcd disable the RFC4361 DUID (nas; dhcpcd managed by ifupdown)
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    # neutralize the RFC4361 DUID (the default) so the server sees only our MAC client-id
    regexp: '^((#)?[[:space:]]*)duid([[:space:]]+.*)?$'
    line: '# duid (disabled by HD-314: MAC client-id, see clientid below)'
    create: false
  register: dhcpcd_duid
  when:
    - dhcp_client | default('none') == 'mac'
    - inventory_hostname == 'nas.kogler.si'
  notify: reload dhcpcd
  tags: [network, dhcp-client]

- name: enable dhcpcd MAC client-id (nas)
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    # replace any existing clientid/duid line with the MAC client-id (idempotent)
    regexp: '^((#)?[[:space:]]*)clientid[[:space:]].*$'
    line: 'clientid mac'
    create: false
  when:
    - dhcp_client | default('none') == 'mac'
    - inventory_hostname == 'nas.kogler.si'
  notify: reload dhcpcd
  tags: [network, dhcp-client]

- name: NetworkManager client-id -> interface MAC (oldsrv)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "Wired connection 1"
      - ipv4.dhcp-client-id
      - mac
  when:
    - dhcp_client | default('none') == 'mac'
    - inventory_hostname == 'oldsrv.kogler.si'
  changed_when: false
  tags: [network, dhcp-client]
# Load the profile into NetworkManager (idempotent: `load` then `up` the connection).
# HD-311 (b): tagged Mgmt sub-interface (eth0.99) — SAME Windows of correctness as pi-eth0:
# render-only on pi.kogler.si; never on another host. The Mgmt plane is ONLY reachable via
# this tagged leg from the Pi (verified live 2026-09-02: ping -I eth0.99 10.10.99.1 works).
- name: Render Pi Mgmt tag-99 sub-interface NetworkManager keyfile (tagged Mgmt)
  template:
    src: pi-mgmt.nmconnection.j2
    dest: "{{ nm_keyfile_dir }}/{{ nm_pi_mgmt_profile }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname == 'pi.kogler.si'
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
    - nm_pi_mgmt_subnet is string
  notify: reload NetworkManager
  tags: [network, nm-pi-mgmt]

# Load + activate the Pi eth0 NM connection (idempotent: `load` then `up` the connection).

# A reload alone does not activate a NEW keyfile — NM must load it and bring eth0 up on it.
# HD-311 note: the tagged Mgmt sub-interface (pi-mgmt) must be brought up AFTER the parent
# (eth0) is up — NM brings child VLANs up with their parent, but a fresh keyfile needs one
# explicit `up` to register. Parent first, then child (ordered below).
- name: Load + activate Pi eth0 NM connection (Home parent)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nm_pi_connection_id }}"
  register: nm_pi_up
  changed_when: "'successfully activated' in nm_pi_up.stdout or 'failed' in nm_pi_up.stdout"
  failed_when:
    - nm_pi_up.rc != 0
  when:
    - inventory_hostname == 'pi.kogler.si'
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
  tags: [network, nm-pi]

# Also load + activate the tagged Mgmt sub-interface (pi-mgmt, eth0.99).
# Live 2026-09-02: the tagged leg is the ONLY way the router reaches the Pi's mgmt IP.
# never-default keeps the default route on Home; route-metric 200 keeps 10.10.99.x on
# the tagged leg (the parent no longer carries that /24).
- name: Load + activate Pi Mgmt tag-99 sub-interface NM connection (tagged Mgmt)
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nm_pi_mgmt_connection_id }}"
  register: nm_pi_mgmt_up
  changed_when: "'successfully activated' in nm_pi_mgmt_up.stdout or 'failed' in nm_pi_mgmt_up.stdout"
  failed_when:
    - nm_pi_mgmt_up.rc != 0
  when:
    - inventory_hostname == 'pi.kogler.si'
    - ansible_facts['service_mgr'] == 'systemd'
    - mgmt_ip is defined
    - ansible_host is defined
  tags: [network, nm-pi-mgmt]
