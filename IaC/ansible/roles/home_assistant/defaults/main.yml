# home_assistant role defaults

# HD-413 classification (read by scripts/check_self_converge_guard.py, not by Ansible).
# It touches /root/.ssh — which is why the detector flags it, and why this row exists rather
# than silence: the role CREATES the directory (mode 0700) and GENERATES a ha-sync keypair
# under `creates:` guard. It never rewrites an `authorized_keys` on the target, which is the
# only action in that directory that could revoke a login. The peer-side grant is a separate,
# deliberate act (the ha-sync@<host> key authorized on the other box's ansible-admin account).
# If this role ever starts managing authorized_keys in place, re-read this row.
homelab_lockout_exempt_reason: >-
  Creates /root/.ssh at 0700 and generates the ha-sync keypair under a `creates:` guard; it
  never rewrites authorized_keys on the target, so it cannot revoke an existing login.
