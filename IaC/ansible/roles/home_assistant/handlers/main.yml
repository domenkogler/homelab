---
# home_assistant role handlers. tags: always = handlers are tag-filtered like tasks; without it a
# notified handler is silently skipped under filtered runs (HD-220 finding, HD-237 sweep).

- name: restart journald
  systemd:
    name: systemd-journald
    state: restarted
    daemon_reload: true
  tags: always

- name: reload systemd
  systemd:
    daemon_reload: true
  tags: always
