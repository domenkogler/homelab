---
# home_assistant role — Task specification + entry point
#
# Targets:
#   - raspberry_pi  → PRIMARY Home Assistant (Debian + HA Container)
#                     + Technitium secondary DNS (deployed by docker_services on the Pi)
#   - home_servers  → STANDBY Home Assistant, cold (oldsrv)
#
# Design & runbooks: docs/smart-home-failover.md, docs/smart-home.md
# Key facts:
#   - Both nodes render the SAME configuration.yaml from this repo.
#   - ha.kogler.si → VIP 10.10.1.200 (keepalived/VRRP); the VIP's :443 edge is served by
#     whichever node owns it: Pi's minimal `traefik-ha` (normal) or oldsrv's `traefik` (after takeover).
#   - The standby is COLD — rendered and created here, never started by a deploy — until a manual
#     forward takeover raises it. Its keepalived lives in the same compose, so while it is cold the
#     VIP has one advertiser (the Pi): failover is an act, never a VRRP event.
#   - Forward + reverse failover are MANUAL; a single `ha-failover.sh` on oldsrv orchestrates
#     VIP promote (swap in the MASTER keepalived config) → HA-standby start. Root on oldsrv runs it
#     directly; the Homepage button is the same trigger behind the `homepage_failover_button` gate.
#   - Homematic IP has NO local RF path: no HmIP-RFUSB radio exists, Homematic rides the cloud
#     HmIP-HAP, so nothing physical moves on takeover. The local-Homematic variant
#     (`ha-failover.full.sh.j2`) is parked together with its two CCU address reservations.
#
# Roles of this role (implement as tasks):
#
# 1. PRIMARY (host: raspberry_pi / pi.kogler.si) — tasks/pi.yml
#    - Install Home Assistant Container (Debian + docker): image ghcr.io/home-assistant/home-assistant:{{ home_assistant_version }}
#    - Render /config/configuration.yaml from repo template (use_x_forwarded_for: true,
#      trusted_proxies: <Pi traefik-ha + oldsrv traefik — both edges must be trusted>)
#    - Render ./secrets.yaml (secrets.yaml.j2 → /opt/home-assistant-primary/secrets.yaml,
#      mode 0600; standby renders the same template to {{ ha_standby_path }}/secrets.yaml) —
#      inline community.general.onepassword lookups (same convention as configuration.yaml.j2),
#      fail-closed, as a block scalar
#    - Render other configs (integrations: knx via GIRA IP Router .118, homematic via the cloud
#      HmIP-HAP, shelly native)
#    - Run "owner" recovery account; local `homeassistant` auth (no Authentik in the ha path);
#      NO Forward-Auth on ha route
#    - keepalived PRIMARY: owns VIP 10.10.1.200 (state MASTER, priority higher than standby)
#    - Deploy `traefik-ha` edge (docker_services, group_vars/raspberry_pi.yml): VIP-bound
#      serve of ha.kogler.si → VIP:8123; keeps ha.kogler.si reachable when oldsrv is down.
#    - sysctl net.ipv4.ip_nonlocal_bind=1 (persist via /etc/sysctl.d) so traefik-ha can
#      bind the VIP even before/without keepalived holding the address.
#    - Cert sync (timer — same cadence as the HA config sync Pi→standby, reversed):
#      rsync the wildcard *.kogler.si cert pair ({{ wildcard_cert_file }} /
#      {{ wildcard_cert_key_file }}) from the VPS `traefik` (the SINGLE ACME issuer, direct
#      pull, no relay) → /opt/traefik-ha/certs/. ACME is
#      intentionally DISABLED on
#      the Pi edge; sync must run before traefik-ha starts and keep the cert offline-safe.
#    - HA exporter: enable /api/prometheus bearer token (monitoring role scrapes — token file in monitoring role)
# 2. STANDBY (host: home_servers / oldsrv) — tasks/standby.yml
#    - Template home-assistant-standby/docker-compose.yml.j2 → /opt/home-assistant-standby/ (cold render)
#    - Render the SAME configuration.yaml into /opt/home-assistant-standby/config/
#    - Create the standby container COLD — `docker compose create --no-recreate`, no systemd unit,
#      nothing in a deploy starts it; ha-failover.sh starts it on takeover (docker compose up -d)
#    - keepalived STANDBY: state BACKUP, priority lower; takes VIP on takeover
#    - ha-failover.sh + trigger API + Homepage buttons
# 3. STATE SYNC (normal direction: Pi → standby)
#    - rsync /config from Pi to /opt/home-assistant-standby/config/ every ~15 min (LAN only, no WAN) — ha-config-sync.timer
#    - Optionally sync HA DB; best-effort only (HA re-polls devices on startup)
# 4. FAILOVER ORCHESTRATOR (host: home_servers / oldsrv) — tasks/standby.yml
# 5. PI SD-CARD WEAR MITIGATION (host: raspberry_pi only) — tasks/pi.yml
#    - Trim HA recorder (purge_keep_days: 2, commit_interval: 5, exclude noisy domains)
#    - Docker log driver `local` (max-size: 10m, max-file: 2) — in docker role
#    - journald Storage=volatile
#    - /var/log mounted as tmpfs
#
# Secrets (1Password vault 'Homelab-ansible'):
#    - ha_api (long-lived), ha-mqtt_login (if MQTT added), ha-vrrp_password, ha-failover_api
#    - Home→IoT trusted-IP rules for MQTT/HA must cover the VIP (10.10.1.200), not per-node IPs
#    - Home→IoT/Home rules must let both HA nodes reach the devices (the standby's path is proven
#      only at a drill)

- name: Refuse runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      home_assistant role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Primary node tasks (Pi)
  ansible.builtin.include_tasks: pi.yml
  when: inventory_hostname == 'pi.kogler.si'
  # ⚠ The include tag must name EVERY tag its children carry (rule 2/3, measured in
  # scripts/testdata/check_tag_coverage/run.sh): a tag the include lacks never opens pi.yml, so with
  # only `home_assistant` here all 21 of its topic-tagged legs — `ha_render`/`ha_failover`/`knx`/
  # `lovelace`/`pi_sd_trim`/`ha_recorder` and the HD ids — were reachable by no filter at all, and
  # the documented `--tags ha_failover` failover run was a green no-op. Both playbooks that pull this
  # role (`home_servers.yml`, `raspberry_pi.yml`) do so BARE, so there is no roles:-entry cascade to
  # lean on; the compound `--tags home_assistant,ha_failover` form keeps working unchanged.
  tags: [home_assistant, ha_render, ha_failover, ha_recorder, pi_sd_trim, lovelace, knx,
         hd17, hd19, hd185, hd204, hd418]

- name: Standby + failover tasks (oldsrv)
  ansible.builtin.include_tasks: standby.yml
  when: inventory_hostname in groups['home_servers']
  # ⚠ Same rule as the Pi include above: standby.yml's 25 legs are tagged `ha_failover` (with
  # `knx`/`lovelace`/`hd17`), so the include has to carry them for `--tags ha_failover` to open the
  # file at all — the documented cold-standby apply command, which silently ran nothing.
  tags: [home_assistant, ha_failover, lovelace, knx, hd17]