---
# home_assistant role — Task specification
#
# Targets:
#   - raspberry_pi  → PRIMARY Home Assistant (Debian + HA Container) + RaspberryMatic/HmIP-RFUSB
#                     + Technitium secondary DNS (deployed by docker_services on the Pi)
#   - home_servers  → STANDBY Home Assistant + RaspberryMatic-standby (oldsrv)
#
# Design & runbooks: docs/smart-home-failover.md, docs/smart-home.md
# Key facts:
#   - Both nodes render the SAME configuration.yaml from this repo.
#   - ha.kogler.si → VIP 10.10.1.200 (keepalived/VRRP); the VIP's :443 edge is served by
#     whichever node owns it: Pi's minimal `traefik-ha` (normal) or oldsrv's `traefik` (after takeover).
#   - Standby + RaspberryMatic-standby are COLD (systemd units disabled) until manual forward takeover.
#   - Forward + reverse failover are MANUAL; a single `ha-failover.sh` on oldsrv orchestrates
#     RMat-start → wait XML-RPC 2001/2010 → VIP promote → HA-standby start (button on Homepage).
#   - Homematic IP RF is bound to the HmIP-RFUSB stick (on the Pi); takeover REQUIRES physically
#     moving the stick to oldsrv (pairing stored on the stick → no re-pair).
#
# Roles of this role (implement as tasks):
#
# 1. PRIMARY (host: raspberry_pi / pi.kogler.si)
#    - Install Home Assistant Container (Debian + docker): image ghcr.io/home-assistant/home-assistant:{{ home_assistant_version }}
#    - Render /config/configuration.yaml from repo template (use_x_forwarded_for: true,
#      trusted_proxies: <Pi traefik-ha + oldsrv traefik — both edges must be trusted>)
#    - Render other configs (integrations: knx via GIRA IP Router .118, homematic [XML-RPC 2001/2010 via local RaspberryMatic], shelly native)
#    - Run "owner" recovery account; Authentik OIDC; NO Forward-Auth on ha route
#    - keepalived PRIMARY: owns VIP 10.10.1.200 (state MASTER, priority higher than standby)
#    - Deploy `traefik-ha` edge (docker_services, group_vars/raspberry_pi.yml): VIP-bound
#      serve of ha.kogler.si → VIP:8123; keeps ha.kogler.si reachable when oldsrv is down.
#      network_mode: host + entrypoints bound to {{ ha_vip }}:80/443.
#    - sysctl net.ipv4.ip_nonlocal_bind=1 (persist via /etc/sysctl.d) so traefik-ha can
#      bind the VIP even before/without keepalived holding the address.
#    - Cert sync (LAN, timer — same cadence as the HA config sync Pi→standby, reversed):
#      rsync the wildcard *.kogler.si cert pair ({{ wildcard_cert_file }} /
#      {{ wildcard_cert_key_file }}) from oldsrv's `traefik` (the SINGLE ACME issuer;
#      Cloudflare DNS-01) → /opt/traefik-ha/certs/. ACME is intentionally DISABLED on
#      the Pi edge; sync must run before traefik-ha starts and keep the cert offline-safe.
#    - HA exporter: enable /api/prometheus bearer token (monitoring role scrapes)
# 2. STANDBY (host: home_servers / oldsrv)
#    - Template home-assistant-standby/docker-compose.yml.j2 → /opt/home-assistant-standby/
#    - Render the SAME configuration.yaml into /opt/home-assistant-standby/config/
#    - Create systemd unit home-assistant-standby (disabled by default)
#    - Template raspberrymatic-standby (RaspberryMatic) → /opt/raspberrymatic-standby/ (disabled by default)
#    - keepalived STANDBY: state BACKUP, priority lower; takes VIP on takeover
# 3. STATE SYNC (normal direction: Pi → standby)
#    - rsync /config from Pi to /opt/home-assistant-standby/config/ every ~15 min (LAN only, no WAN)
#    - rsync RaspberryMatic config Pi → oldsrv the same way (pairing stays on the stick)
#    - Optionally sync HA DB; best-effort only (HA re-polls devices on startup)
# 4. FAILOVER ORCHESTRATOR (host: home_servers / oldsrv)
#    - Deploy /usr/local/sbin/ha-failover.sh + a Homepage button that invokes it
#      (start RMat standby → wait 2001/2010 → promote VIP → start HA standby)
# 5. PI SD-CARD WEAR MITIGATION (HD-19, host: raspberry_pi only)
#    - Trim HA recorder (purge_keep_days: 2, commit_interval: 5, exclude noisy domains)
#    - Docker log driver `local` (max-size: 10m, max-file: 2) — in docker role
#    - journald Storage=volatile
#    - /var/log mounted as tmpfs
#
# Secrets (1Password vault 'Homelab'):
#    - Home→IoT trusted-IP rules for MQTT/HA must cover the VIP (10.10.1.200), not per-node IPs
#    - Home→IoT/Home rules must let the RaspberryMatic XML-RPC ports 2001/2010 (fixed CCU IP) and
#      both HA nodes reach it
#

# ---- Tasks: PI SD-CARD WEAR MITIGATION (HD-19) ----

- name: Render HA configuration.yaml (with recorder trim)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: /opt/homeassistant/config/configuration.yaml
    mode: '0644'
  when: inventory_hostname == 'pi.kogler.si'
  tags: [ha_recorder, hd19]

- name: Set journald to volatile (RAM-only, Pi SD-card wear)
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=volatile'
    create: true
    mode: '0644'
  when: inventory_hostname == 'pi.kogler.si'
  notify: restart journald
  tags: [pi_sd_trim, hd19]

- name: Mount /var/log as tmpfs (Pi SD-card wear)
  ansible.builtin.mount:
    path: /var/log
    src: tmpfs
    fstype: tmpfs
    opts: defaults,noatime,nosuid,nodev,noexec,size=100m
    state: mounted
  when: inventory_hostname == 'pi.kogler.si'
  tags: [pi_sd_trim, hd19]
#   - ha_api (long-lived), ha-mqtt_login (if MQTT added), ha-vrrp_password
#   - {{ lookup('community.general.onepassword', '...', vault=op_vault) }}
