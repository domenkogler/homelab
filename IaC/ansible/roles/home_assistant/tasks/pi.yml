---
# home_assistant role — PRIMARY node tasks (raspberry_pi / pi.kogler.si)
# Included from tasks/main.yml when inventory_hostname == 'pi.kogler.si'.
# Scope: HA Container config + keepalived PRIMARY (VIP) configs, and the Pi SD-card
# wear mitigation. The remaining PRIMARY scope (cert sync, state sync, traefik-ha
# wiring details) is not implemented here — see the role spec in tasks/main.yml.
#
# The HA container itself (home-assistant-primary) is deployed by docker_services
# (group_vars/raspberry_pi.yml), so this file renders its config/keepalived files
# FIRST (playbook order home_assistant → docker_services): bind-mount sources must
# exist as files before `compose up`, else Docker auto-creates them as directories.

- name: Render HA configuration.yaml (with recorder trim)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: /opt/home-assistant-primary/config/configuration.yaml
    mode: '0644'
  tags: [ha_recorder, hd19]

# ---- Lovelace dashboard (Stanovanje, YAML mode) ----
# Root + views are rendered under /config/lovelace/ (relative !include resolution).
- name: Create lovelace directory
  ansible.builtin.file:
    path: /opt/home-assistant-primary/config/lovelace
    state: directory
    mode: '0755'
  tags: [ha_render, lovelace]

- name: Render Stanovanje dashboard root
  ansible.builtin.copy:
    src: lovelace/dashboard_stanovanje.yaml
    dest: /opt/home-assistant-primary/config/lovelace/dashboard_stanovanje.yaml
    mode: '0644'
  tags: [ha_render, lovelace]

- name: Render Stanovanje dashboard views (Pregled/Luci/Žaluzije/Ogrevanje)
  ansible.builtin.copy:
    src: "lovelace/{{ item }}"
    dest: "/opt/home-assistant-primary/config/lovelace/{{ item }}"
    mode: '0644'
  loop:
    - view_pregled.yaml
    - view_luci.yaml
    - view_zaluzije.yaml
    - view_ogrevanje.yaml
  tags: [ha_render, lovelace]



# ---- KNX (docs/smart-home.md): ETS project file SSOT ----
# knx-entities.yaml is generated from the .knxproj (scripts/ansible/knx-hass-gen.py) — the
# configuration.yaml.j2 `knx: !include knx-entities.yaml` needs the file at
# /config/knx-entities.yaml. The .knxproj itself is deployed to /config/knx/ so the
# KNX panel can import it (Group Monitor names + knx.telegram destination_name).
# Both files are static (no Jinja), copied not templated.
- name: Deploy KNX entities file (generated from ETS project)
  ansible.builtin.copy:
    src: knx-entities.yaml
    dest: /opt/home-assistant-primary/config/knx-entities.yaml
    mode: '0644'
  tags: [ha_render, knx]

- name: Create KNX project directory
  ansible.builtin.file:
    path: /opt/home-assistant-primary/config/knx
    state: directory
    mode: '0755'
  tags: [ha_render, knx]

- name: Deploy ETS project file (StanovanjeKogler_v1_0.knxproj — KNX panel import)
  ansible.builtin.copy:
    src: "{{ role_path }}/files/StanovanjeKogler_v1_0.knxproj"
    dest: /opt/home-assistant-primary/config/knx/StanovanjeKogler_v1_0.knxproj
    mode: '0644'
  tags: [ha_render, knx]



# ---- secrets.yaml ----
# Render BEFORE docker_services brings the compose up (render-first order). Values use
# inline community.general.onepassword lookups (as configuration.yaml.j2 does) because
# the docker_services `vault` dict is not populated on the Pi. Fail-closed — no
# default(''): a missing 1Password item aborts the render. Each field is a `>-` block
# scalar so : " # $ in the value cannot break HA's YAML parse.
- name: Render HA secrets.yaml (1Password-backed, block-scalar, fail-closed)
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: /opt/home-assistant-primary/secrets.yaml
    mode: '0600'
  tags: [ha_render, hd185, hd204]

# ---- keepalived PRIMARY (VIP owner in normal mode) ----
# Variants: master.conf (MASTER/{{ ha_primary_priority }}) + peer.conf
# (BACKUP/{{ ha_primary_peer_priority }} for reverse failback). The ACTIVE
# ./keepalived.conf is created once from master (force: no) — the failback runbook
# swaps it manually and re-runs must not clobber a live swap.

- name: Render Pi keepalived config (MASTER — normal)
  ansible.builtin.template:
    src: keepalived.master.conf.j2
    dest: /opt/home-assistant-primary/keepalived.master.conf
    mode: '0644'
  tags: [ha_failover, hd17]

- name: Render Pi keepalived config (PEER — reverse failback)
  ansible.builtin.template:
    src: keepalived.peer.conf.j2
    dest: /opt/home-assistant-primary/keepalived.peer.conf
    mode: '0644'
  tags: [ha_failover, hd17]

- name: Create active keepalived.conf from MASTER (first deploy only)
  ansible.builtin.copy:
    src: /opt/home-assistant-primary/keepalived.master.conf   # rendered above; remote_src needs the ABSOLUTE path (relative src would look under role files/)
    dest: /opt/home-assistant-primary/keepalived.conf
    remote_src: true
    force: false                # never clobber a manual master/peer swap
    mode: '0644'
  tags: [ha_failover, hd17]

# ---- HA sync channel + edge (failover primary side, step 2) ----
# ip_nonlocal_bind lets traefik-ha bind the VIP before/without keepalived holding
# it. The ha-sync keypair (Pi → oldsrv) powers the cert-pull + config-push timers;
# the pubkey is authorized on oldsrv (standby.yml) with an rsync-only wrapper.

- name: Enable net.ipv4.ip_nonlocal_bind (traefik-ha VIP binding)
  ansible.builtin.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    sysctl_file: /etc/sysctl.d/60-ha-edge.conf
    reload: true
  tags: [ha_failover, hd17]

- name: Create root .ssh directory (ha-sync key)
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: '0700'
  tags: [ha_failover, hd17]

- name: Generate ha-sync SSH keypair (Pi → oldsrv cert/config sync)
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N '' -C ha-sync@{{ inventory_hostname }} -f /root/.ssh/ha-sync
    creates: /root/.ssh/ha-sync
  tags: [ha_failover, hd17]

- name: Assert the cert issuer is a remote host (self-pull guard)
  # Same guard as roles/docker_services (oldsrv / spark edges): the Pi pulls the SAME
  # wildcard pair from the VPS issuer, and a SRC that points back at this box would
  # report success while the pair aged out. See docs/services-traefik.md §Edge model.
  ansible.builtin.assert:
    that:
      - cert_issuer_addr | length > 0
      - cert_issuer_addr != (ansible_host | default('', true))
      - cert_issuer_addr not in [home_ip | default(''), mgmt_ip | default('')]
    fail_msg: >-
      ha-cert-sync issuer resolves to {{ cert_issuer_addr }}, which is THIS host
      ({{ inventory_hostname }}). The single ACME issuer is the VPS Traefik.
    quiet: true
  vars:
    cert_issuer_addr: "{{ hostvars['vps.kogler.si'].ansible_host }}"
  tags: [ha_failover, hd17]

- name: Deploy ha-cert-sync script (pull wildcard certs from the VPS traefik issuer)
  ansible.builtin.template:
    src: ha-cert-sync.sh.j2
    dest: /usr/local/sbin/ha-cert-sync.sh
    mode: '0755'
  vars:
    cert_issuer_addr: "{{ hostvars['vps.kogler.si'].ansible_host }}"
  tags: [ha_failover, hd17]

- name: Deploy ha-config-sync script (push HA config to standby)
  ansible.builtin.template:
    src: ha-config-sync.sh.j2
    dest: /usr/local/sbin/ha-config-sync.sh
    mode: '0755'
  tags: [ha_failover, hd17]

- name: Install cert/config sync systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - ha-cert-sync.service
    - ha-cert-sync.timer
    - ha-config-sync.service
    - ha-config-sync.timer
  notify: reload systemd
  tags: [ha_failover, hd17]

- name: Enable + start HA sync timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - ha-cert-sync.timer
    - ha-config-sync.timer
  tags: [ha_failover, hd17]

# ---- Pi SD-card wear mitigation ----

- name: Set journald to volatile (RAM-only, Pi SD-card wear)
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=volatile'
    create: true
    mode: '0644'
  notify: restart journald
  tags: [pi_sd_trim, hd19]

# The mode belongs to the MOUNT. A tmpfs mounted without `mode=` arrives as 1777 root:root, and
# logrotate then skips every system file with "skipping … because of bad file mode" — the journal is
# still kept, so the box looks healthy while nothing rotates. 0755 root:adm is what /var/log measures
# on the Debian hosts that mount it from the root fs (nas, oldsrv), so this is the fleet value, not a
# Pi-only guess. Two legs own it, because they own different things: the fstab option owns every mount
# made from now on, and a chmod owns the mount that is ALREADY up — measured here, a tmpfs applies
# `mode=` at mount time and ignores it on remount, so `mount -o remount,mode=0755` returns 0 and
# leaves the directory 1777. Neither leg is optional: a chmod alone is undone by the next boot (the
# defect this row records), and an fstab option alone leaves logrotate skipping files until someone
# reboots — and a reboot is an owner act, not how this repo fixes a mode.
- name: Name the /var/log tmpfs options this host owns
  # One string, so the mount line and the report cannot drift into two different stories.
  ansible.builtin.set_fact:
    pi_var_log_opts: "defaults,noatime,nosuid,nodev,noexec,size=100m,mode=0755,uid=0,gid=0"
  tags: [pi_sd_trim, hd19]

- name: Mount /var/log as tmpfs carrying the mode logrotate requires
  # Owns /etc/fstab — therefore every mount made after this run, including the next boot's.
  ansible.builtin.mount:
    path: /var/log
    src: tmpfs
    fstype: tmpfs
    opts: "{{ pi_var_log_opts }}"
    state: mounted
  tags: [pi_sd_trim, hd19]

- name: Read how /var/log is mounted RIGHT NOW, not how fstab says it will be
  # `findmnt --target` reads the APPLIED mount, so this catches a running fstab line that does not
  # describe the live state — the gap that let this row read "fixed" while nothing rotated. It also
  # shows what the mount module actually did: it rewrites the fstab line and issues a bare
  # `mount -o remount`, which for a tmpfs re-applies the MOUNT-TIME options it already had. A read,
  # and it really runs under --check.
  ansible.builtin.command:
    cmd: findmnt -no OPTIONS,FSTYPE --target /var/log
  register: pi_var_log_mount
  changed_when: false
  check_mode: false   # a probe, not a mutation — --check must still be able to judge
  tags: [pi_sd_trim, hd19]

- name: Read what /var/log actually measures
  # `stat` is check-safe, so --check judges the mode the mount really produced. This is the reading
  # the reconciliation below is gated on.
  ansible.builtin.stat:
    path: /var/log
  register: pi_var_log_stat
  tags: [pi_sd_trim, hd19]

- name: Bring the mode of the running mount to the one this host owns
  # Gated on the measurement, so on a box that mounts with the option it simply does not run. This
  # is not the durable owner — it is the reconciliation for the mount that is up and cannot be
  # remounted into a new mode (see the block comment).
  ansible.builtin.file:
    path: /var/log
    state: directory
    owner: root
    group: adm
    mode: '0755'
  when: "pi_var_log_stat.stat.mode | default('0000') not in ['0755', '755']"
  tags: [pi_sd_trim, hd19]

- name: Read what /var/log measures after any reconciliation
  ansible.builtin.stat:
    path: /var/log
  register: pi_var_log_stat_after
  tags: [pi_sd_trim, hd19]

- name: Report the /var/log mount the running system has
  ansible.builtin.debug:
    msg: >-
      /var/log on {{ inventory_hostname }}: mode {{ pi_var_log_stat_after.stat.mode | default('?') }} owner
      {{ pi_var_log_stat_after.stat.pw_name | default('?') }}:{{ pi_var_log_stat_after.stat.gr_name | default('?') }}
      under live mount options '{{ pi_var_log_mount.stdout | default('unreadable') }}' (fstab opts
      '{{ pi_var_log_opts }}'). Want 0755 root:adm, the value logrotate's secure-parent check accepts.
      A live mount line with no mode= is expected until the next mount: tmpfs honours mode= at mount
      time only, so the mount line becomes truthful at a boot, never from a converge.
  tags: [pi_sd_trim, hd19]

- name: Refuse to call /var/log configured while logrotate has nowhere to write
  # Asserted, not reported: "the task is green" is not the invariant. It asserts the mode logrotate
  # really sees and NOT the mount line — the mount line cannot be made truthful without unmounting a
  # filesystem that is open, which is a reboot-shaped act this run must not take. Skipped under
  # --check, where the report line IS the verdict (the split the nm-resolver block uses).
  ansible.builtin.assert:
    that:
      - "pi_var_log_stat_after.stat.mode | default('0000') in ['0755', '755']"
      - "pi_var_log_stat_after.stat.pw_name | default('') == 'root'"
    fail_msg: >-
      /var/log on {{ inventory_hostname }} measures mode {{ pi_var_log_stat_after.stat.mode | default('?') }}
      {{ pi_var_log_stat_after.stat.pw_name | default('?') }}:{{ pi_var_log_stat_after.stat.gr_name | default('?') }}
      under mount options '{{ pi_var_log_mount.stdout | default('unreadable') }}'. A tmpfs mounted without
      mode= arrives 1777 root:root and logrotate skips every system file with "skipping … because of bad
      file mode", so the logs live and nothing rotates. The fstab option owns future mounts and the
      task above owns the mount that is up; neither one worked here.
    quiet: true
  when: not ansible_check_mode
  tags: [pi_sd_trim, hd19]