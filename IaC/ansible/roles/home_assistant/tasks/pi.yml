---
# home_assistant role — PRIMARY node tasks (raspberry_pi / pi.kogler.si)
# Included from tasks/main.yml when inventory_hostname == 'pi.kogler.si'.
# Scope: HA Container config + keepalived PRIMARY (VIP) configs, and the Pi SD-card
# wear mitigation. The remaining PRIMARY scope (cert sync, state sync, traefik-ha
# wiring details) is not implemented here — see the role spec in tasks/main.yml.
#
# The HA container itself (home-assistant-primary) is deployed by docker_services
# (group_vars/raspberry_pi.yml), so this file renders its config/keepalived files
# FIRST (playbook order home_assistant → docker_services): bind-mount sources must
# exist as files before `compose up`, else Docker auto-creates them as directories.

- name: Render HA configuration.yaml (with recorder trim)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: /opt/home-assistant-primary/config/configuration.yaml
    mode: '0644'
  tags: [ha_recorder, hd19]

# ---- The proxy trust list HA ENFORCES is the storage object, not the YAML above ----
# `yaml_migration_done: true` in `.storage/http` means the `http:` integration read its YAML once in
# September and has owned the running value ever since: `.storage/http` is the effective config and
# the rendered `configuration.yaml` block is decoration. An address can be in the YAML, survive every
# converge, and still get `400 Bad Request` — HA refuses `X-Forwarded-For` from a peer outside the
# list it loaded, which is the whole symptom (the standby/oldsrv edge — the address named by
# `oldsrv_home_ip` — was in the
# YAML and missing from the object, so every takeover-shaped request died at the edge).
# ⛔ Do not "fix" this by editing the YAML or by stripping the header at the edge: the object is the
# source and the trust list is the fix (docs/smart-home-rejected.md, docs/smart-home-failover.md
# §Caveats). The instrument is the REQUEST: `200`/`401` = the source is trusted, `400 untrusted proxy X`
# names the address that is missing. This block reconciles BOTH `stable` and `pending` — `pending`
# carries `error: not_promoted` and would be promoted over the reconciled `stable` on the next
# migration event, so reconciling only `stable` would leave the fix undone by HA itself.
# The ACTIVE node only: pi.yml is the primary, and the standby half of this work has no subject while
# the standby is UNDEPLOYED (no `home-assistant-standby` container exists on oldsrv to reconcile).
- name: Read HA's http storage object before touching it
  # `get_checksum` makes this the recorded hash of the state being replaced, and `stat` is a read that
  # really runs under --check, so the check-mode report quotes the live hashes too.
  ansible.builtin.stat:
    path: /opt/home-assistant-primary/config/.storage/http
    get_checksum: true
    checksum_algorithm: sha256
  register: ha_http_storage_before
  changed_when: false
  tags: [ha_render, hd418]

- name: Slurp HA's http storage object
  ansible.builtin.slurp:
    path: /opt/home-assistant-primary/config/.storage/http
  register: ha_http_storage_raw
  changed_when: false
  when: ha_http_storage_before.stat.exists
  tags: [ha_render, hd418]

- name: Derive what HA enforces today against what this host renders
  # The comparison is exact, order included, because the write below emits `ha_trusted_proxies` in the
  # order it is declared — so a converged box compares equal on the next run instead of rewriting the
  # object and restarting the controller every converge.
  ansible.builtin.set_fact:
    ha_http_obj: "{{ ha_http_storage_raw.content | default('{}') | b64decode | from_json }}"
  when: ha_http_storage_before.stat.exists
  tags: [ha_render, hd418]

- name: Refuse to rewrite a storage object this task does not understand
  # Fail-loud, not decoration: an object without `data.stable` is a different HA major's shape, and
  # writing a `stable` block HA never had would invent config rather than reconcile it.
  ansible.builtin.assert:
    that:
      - ha_http_obj.key | default('') == 'http'
      - ha_http_obj.data.stable is defined
    fail_msg: >-
      {{ inventory_hostname }}: .storage/http is not the http settings object this task reconciles
      (key '{{ ha_http_obj.key | default('<none>') }}', data.stable
      {{ 'present' if ha_http_obj.data.stable is defined else 'ABSENT' }}). The effective trusted-proxies
      list therefore cannot be derived — reconcile it by hand from the HA UI or a documented object
      edit, and fix this task before converging it. Read the object with
      `python3 -m json.tool /opt/home-assistant-primary/config/.storage/http`.
    quiet: true
  when: ha_http_storage_before.stat.exists
  tags: [ha_render, hd418]

- name: Decide whether the enforced trust list differs from the rendered one
  ansible.builtin.set_fact:
    ha_http_want: "{{ ha_trusted_proxies }}"
    ha_http_stable_now: "{{ ha_http_obj.data.stable.trusted_proxies | default([]) }}"
    ha_http_pending_now: "{{ (ha_http_obj.data.pending.trusted_proxies | default([])) if ha_http_obj.data.pending is defined else [] }}"
    ha_http_drift: >-
      {{ (ha_http_obj.data.stable.trusted_proxies | default([])) != ha_trusted_proxies
         or ((ha_http_obj.data.pending.trusted_proxies | default([])) != ha_trusted_proxies
             if ha_http_obj.data.pending is defined else false) }}
  when: ha_http_storage_before.stat.exists
  tags: [ha_render, hd418]

- name: Report the trust list HA is enforcing on this node
  # Under --check this line IS the verdict: nothing below runs, so the check output has to carry the
  # whole answer (the same split as the nm-resolver and /var/log legs).
  ansible.builtin.debug:
    msg: >-
      .storage/http on {{ inventory_hostname }}: stable {{ ha_http_stable_now | default(['<unreadable>']) }}
      | pending {{ ha_http_pending_now | default(['<none>']) }}
      | rendered {{ ha_trusted_proxies }}
      | {{ 'DRIFT — a proxied request from an address in the second list gets 400 untrusted proxy' if ha_http_drift | default(false) | bool else 'in step' }}
      (sha256 {{ ha_http_storage_before.stat.checksum | default('<no file>') | truncate(12, true) }})
      {{ ' — --check: nothing written, HA not restarted' if ansible_check_mode else '' }}
  when: ha_http_storage_before.stat.exists
  tags: [ha_render, hd418]

- name: Keep a root-only copy of the object this run is about to replace
  # The write touches a file HA owns, so the pre-write state is kept, timestamped, mode 0600, and its
  # hash is printed into the converge log — the rollback needs no memory of what was there.
  ansible.builtin.shell:
    cmd: |
      set -eu
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      D=/var/backups/ha-storage
      S=/opt/home-assistant-primary/config/.storage/http
      install -d -m 0700 "$D"
      F="$D/http.{{ now().strftime('%Y%m%dT%H%M%S') }}.pre-hd418.json"
      install -m 600 "$S" "$F"
      sha256sum "$S" "$F"
  args:
    executable: /bin/bash
  register: ha_http_backup
  when:
    - ha_http_storage_before.stat.exists
    - ha_http_drift | default(false) | bool
    - not ansible_check_mode
  changed_when: true
  tags: [ha_render, hd418]

- name: Reconcile the enforced trusted proxies with the list this host renders
  # Only the blocks the object actually has get rewritten; every other key (server_port, ssl_profile,
  # cors_allowed_origins, created_at, pending.error) is carried through untouched.
  ansible.builtin.copy:
    dest: /opt/home-assistant-primary/config/.storage/http
    owner: root
    group: root
    mode: '0600'
    content: "{{ ha_http_reconciled | to_nice_json }}\n"
  vars:
    ha_http_reconciled: >-
      {{ ha_http_obj | combine({'data': ha_http_obj.data | combine(
        {'stable': ha_http_obj.data.stable | combine({'trusted_proxies': ha_trusted_proxies})},
        {'pending': ha_http_obj.data.pending | combine({'trusted_proxies': ha_trusted_proxies})}
          if ha_http_obj.data.pending is defined else {}
      )}, recursive=False) }}
  when:
    - ha_http_storage_before.stat.exists
    - ha_http_drift | default(false) | bool
  tags: [ha_render, hd418]

- name: Reload HA so it loads the reconciled trust list
  # The accepted cost here: the restart was authorized to run unattended in an overnight window (a short
  # voice outage; read HA's active conversations first). A TASK, not a handler, and that is load-bearing: handlers
  # flush at the END of the play, i.e. after the read-back below, which would then be reading a file HA
  # had not loaded yet — act and assert in one run, the scripts/README.md guarded-converge lesson. Only
  # the HA container restarts: `docker restart` on the one name leaves the co-located keepalived (the
  # VIP advertiser) and every sibling container alone, so the VIP does not move.
  ansible.builtin.command:
    cmd: docker restart home-assistant-primary
  when:
    - ha_http_drift | default(false) | bool
    - not ansible_check_mode
  changed_when: true
  tags: [ha_render, hd418]

- name: Wait for the smart-home controller to answer again
  # No XFF header here, so this cannot be a 400: it asks only "is HA back" after the restart — an
  # unauthenticated /api/ is a 401, a booting HA is retried. `127.0.0.1` because this must not depend
  # on the VIP or on DNS to report its own health.
  ansible.builtin.uri:
    url: http://127.0.0.1:8123/api/
    status_code: [200, 401]
    timeout: 10
  register: ha_http_up
  until: ha_http_up.status | default(0) in [200, 401]
  retries: 30
  delay: 5
  changed_when: false
  when:
    - ha_http_drift | default(false) | bool
    - not ansible_check_mode
  tags: [ha_render, hd418]

- name: Read the object back after HA has reloaded it
  ansible.builtin.slurp:
    path: /opt/home-assistant-primary/config/.storage/http
  register: ha_http_storage_after
  changed_when: false
  when:
    - ha_http_drift | default(false) | bool
    - not ansible_check_mode
  tags: [ha_render, hd418]

- name: Assert HA now enforces the address every HA-fronting edge arrives from
  # rc=0 on the copy proves only that the file was written. The object is the evidence (the same rule
  # as the nm-resolver leg), and it is skipped under --check on purpose: nothing was written, so the
  # file legitimately still holds the old list and the report line above is the check verdict.
  ansible.builtin.assert:
    that:
      - (ha_http_after_obj.data.stable.trusted_proxies | default([])) == ha_trusted_proxies
      - ((ha_http_after_obj.data.pending.trusted_proxies | default([])) == ha_trusted_proxies)
        if ha_http_after_obj.data.pending is defined else true
    fail_msg: >-
      {{ inventory_hostname }}: .storage/http does not carry the rendered trust list after the
      reconcile — HA will keep answering 400 untrusted proxy for the edge that is missing. Actual
      stable: {{ (ha_http_after_obj.data.stable.trusted_proxies | default(['<unreadable>'])) }}
      pending: {{ (ha_http_after_obj.data.pending.trusted_proxies | default(['<none>'])) }}
      want: {{ ha_trusted_proxies }}.
      Rollback: `install -m 600 <backup> /opt/home-assistant-primary/config/.storage/http`
      (backup path and hash are in this run's log), then `docker restart home-assistant-primary`.
      The request that proves it: `curl -sk -H 'Host: ha.kogler.si' -H 'X-Forwarded-For: 203.0.113.1'
      http://<edge-address>:8123/api/` — 400 names the address still missing.
    quiet: true
  vars:
    ha_http_after_obj: "{{ ha_http_storage_after.content | default('{}') | b64decode | from_json }}"
  when:
    - ha_http_drift | default(false) | bool
    - not ansible_check_mode
  tags: [ha_render, hd418]

# ---- Lovelace dashboard (Stanovanje, YAML mode) ----
# Root + views are rendered under /config/lovelace/ (relative !include resolution).
- name: Create lovelace directory
  ansible.builtin.file:
    path: /opt/home-assistant-primary/config/lovelace
    state: directory
    mode: '0755'
  tags: [ha_render, lovelace]

- name: Render Stanovanje dashboard root
  ansible.builtin.copy:
    src: lovelace/dashboard_stanovanje.yaml
    dest: /opt/home-assistant-primary/config/lovelace/dashboard_stanovanje.yaml
    mode: '0644'
  tags: [ha_render, lovelace]

- name: Render Stanovanje dashboard views (Pregled/Luci/Žaluzije/Ogrevanje)
  ansible.builtin.copy:
    src: "lovelace/{{ item }}"
    dest: "/opt/home-assistant-primary/config/lovelace/{{ item }}"
    mode: '0644'
  loop:
    - view_pregled.yaml
    - view_luci.yaml
    - view_zaluzije.yaml
    - view_ogrevanje.yaml
  tags: [ha_render, lovelace]



# ---- KNX (docs/smart-home.md): ETS project file SSOT ----
# knx-entities.yaml is generated from the .knxproj (scripts/ansible/knx-hass-gen.py) — the
# configuration.yaml.j2 `knx: !include knx-entities.yaml` needs the file at
# /config/knx-entities.yaml. The .knxproj itself is deployed to /config/knx/ so the
# KNX panel can import it (Group Monitor names + knx.telegram destination_name).
# Both files are static (no Jinja), copied not templated.
- name: Deploy KNX entities file (generated from ETS project)
  ansible.builtin.copy:
    src: knx-entities.yaml
    dest: /opt/home-assistant-primary/config/knx-entities.yaml
    mode: '0644'
  tags: [ha_render, knx]

- name: Create KNX project directory
  ansible.builtin.file:
    path: /opt/home-assistant-primary/config/knx
    state: directory
    mode: '0755'
  tags: [ha_render, knx]

- name: Deploy ETS project file (StanovanjeKogler_v1_0.knxproj — KNX panel import)
  ansible.builtin.copy:
    src: "{{ role_path }}/files/StanovanjeKogler_v1_0.knxproj"
    dest: /opt/home-assistant-primary/config/knx/StanovanjeKogler_v1_0.knxproj
    mode: '0644'
  tags: [ha_render, knx]



# ---- secrets.yaml ----
# Render BEFORE docker_services brings the compose up (render-first order). Values use
# inline community.general.onepassword lookups (as configuration.yaml.j2 does) because
# the docker_services `vault` dict is not populated on the Pi. Fail-closed — no
# default(''): a missing 1Password item aborts the render. Each field is a `>-` block
# scalar so : " # $ in the value cannot break HA's YAML parse.
- name: Render HA secrets.yaml (1Password-backed, block-scalar, fail-closed)
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: /opt/home-assistant-primary/secrets.yaml
    mode: '0600'
  tags: [ha_render, hd185, hd204]

# ---- keepalived PRIMARY (VIP owner in normal mode) ----
# Variants: master.conf (MASTER/{{ ha_primary_priority }}) + peer.conf
# (BACKUP/{{ ha_primary_peer_priority }} for reverse failback). The ACTIVE
# ./keepalived.conf is created once from master (force: no) — the failback runbook
# swaps it manually and re-runs must not clobber a live swap.

- name: Render Pi keepalived config (MASTER — normal)
  ansible.builtin.template:
    src: keepalived.master.conf.j2
    dest: /opt/home-assistant-primary/keepalived.master.conf
    mode: '0644'
  tags: [ha_failover, hd17]

- name: Render Pi keepalived config (PEER — reverse failback)
  ansible.builtin.template:
    src: keepalived.peer.conf.j2
    dest: /opt/home-assistant-primary/keepalived.peer.conf
    mode: '0644'
  tags: [ha_failover, hd17]

- name: Create active keepalived.conf from MASTER (first deploy only)
  ansible.builtin.copy:
    src: /opt/home-assistant-primary/keepalived.master.conf   # rendered above; remote_src needs the ABSOLUTE path (relative src would look under role files/)
    dest: /opt/home-assistant-primary/keepalived.conf
    remote_src: true
    force: false                # never clobber a manual master/peer swap
    mode: '0644'
  tags: [ha_failover, hd17]

# ---- HA sync channel + edge (failover primary side, step 2) ----
# ip_nonlocal_bind lets traefik-ha bind the VIP before/without keepalived holding
# it. The ha-sync keypair (Pi → oldsrv) powers the cert-pull + config-push timers;
# the pubkey is authorized on oldsrv (standby.yml) with an rsync-only wrapper.

- name: Enable net.ipv4.ip_nonlocal_bind (traefik-ha VIP binding)
  ansible.builtin.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    sysctl_file: /etc/sysctl.d/60-ha-edge.conf
    reload: true
  tags: [ha_failover, hd17]

- name: Create root .ssh directory (ha-sync key)
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: '0700'
  tags: [ha_failover, hd17]

- name: Generate ha-sync SSH keypair (Pi → oldsrv cert/config sync)
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N '' -C ha-sync@{{ inventory_hostname }} -f /root/.ssh/ha-sync
    creates: /root/.ssh/ha-sync
  tags: [ha_failover, hd17]

- name: Assert the cert issuer is a remote host (self-pull guard)
  # Same guard as roles/docker_services (oldsrv / spark edges): the Pi pulls the SAME
  # wildcard pair from the VPS issuer, and a SRC that points back at this box would
  # report success while the pair aged out. See docs/services-traefik.md §Edge model.
  ansible.builtin.assert:
    that:
      - cert_issuer_addr | length > 0
      - cert_issuer_addr != (ansible_host | default('', true))
      - cert_issuer_addr not in [home_ip | default(''), mgmt_ip | default('')]
    fail_msg: >-
      ha-cert-sync issuer resolves to {{ cert_issuer_addr }}, which is THIS host
      ({{ inventory_hostname }}). The single ACME issuer is the VPS Traefik.
    quiet: true
  vars:
    cert_issuer_addr: "{{ hostvars['vps.kogler.si'].ansible_host }}"
  tags: [ha_failover, hd17]

- name: Deploy ha-cert-sync script (pull wildcard certs from the VPS traefik issuer)
  ansible.builtin.template:
    src: ha-cert-sync.sh.j2
    dest: /usr/local/sbin/ha-cert-sync.sh
    mode: '0755'
  vars:
    cert_issuer_addr: "{{ hostvars['vps.kogler.si'].ansible_host }}"
  tags: [ha_failover, hd17]

- name: Deploy ha-config-sync script (push HA config to standby)
  ansible.builtin.template:
    src: ha-config-sync.sh.j2
    dest: /usr/local/sbin/ha-config-sync.sh
    mode: '0755'
  tags: [ha_failover, hd17]

- name: Install cert/config sync systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - ha-cert-sync.service
    - ha-cert-sync.timer
    - ha-config-sync.service
    - ha-config-sync.timer
  notify: reload systemd
  tags: [ha_failover, hd17]

- name: Enable + start HA sync timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - ha-cert-sync.timer
    - ha-config-sync.timer
  tags: [ha_failover, hd17]

# ---- Pi SD-card wear mitigation ----

- name: Set journald to volatile (RAM-only, Pi SD-card wear)
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=volatile'
    create: true
    mode: '0644'
  notify: restart journald
  tags: [pi_sd_trim, hd19]

# The mode belongs to the MOUNT. A tmpfs mounted without `mode=` arrives as 1777 root:root, and
# logrotate then skips every system file with "skipping … because of bad file mode" — the journal is
# still kept, so the box looks healthy while nothing rotates. 0755 root:adm is what /var/log measures
# on the Debian hosts that mount it from the root fs (nas, oldsrv), so this is the fleet value, not a
# Pi-only guess. Two legs own it, because they own different things: the fstab option owns every mount
# made from now on, and a chmod owns the mount that is ALREADY up — measured here, a tmpfs applies
# `mode=` at mount time and ignores it on remount, so `mount -o remount,mode=0755` returns 0 and
# leaves the directory 1777. Neither leg is optional: a chmod alone is undone by the next boot (the
# defect this row records), and an fstab option alone leaves logrotate skipping files until someone
# reboots — and a reboot is an owner act, not how this repo fixes a mode.
- name: Name the /var/log tmpfs options this host owns
  # One string, so the mount line and the report cannot drift into two different stories.
  ansible.builtin.set_fact:
    pi_var_log_opts: "defaults,noatime,nosuid,nodev,noexec,size=100m,mode=0755,uid=0,gid=0"
  tags: [pi_sd_trim, hd19]

- name: Mount /var/log as tmpfs carrying the mode logrotate requires
  # Owns /etc/fstab — therefore every mount made after this run, including the next boot's.
  ansible.builtin.mount:
    path: /var/log
    src: tmpfs
    fstype: tmpfs
    opts: "{{ pi_var_log_opts }}"
    state: mounted
  tags: [pi_sd_trim, hd19]

- name: Read how /var/log is mounted RIGHT NOW, not how fstab says it will be
  # `findmnt --target` reads the APPLIED mount, so this catches a running fstab line that does not
  # describe the live state — the gap that let this row read "fixed" while nothing rotated. It also
  # shows what the mount module actually did: it rewrites the fstab line and issues a bare
  # `mount -o remount`, which for a tmpfs re-applies the MOUNT-TIME options it already had. A read,
  # and it really runs under --check.
  ansible.builtin.command:
    cmd: findmnt -no OPTIONS,FSTYPE --target /var/log
  register: pi_var_log_mount
  changed_when: false
  check_mode: false   # a probe, not a mutation — --check must still be able to judge
  tags: [pi_sd_trim, hd19]

- name: Read what /var/log actually measures
  # `stat` is check-safe, so --check judges the mode the mount really produced. This is the reading
  # the reconciliation below is gated on.
  ansible.builtin.stat:
    path: /var/log
  register: pi_var_log_stat
  tags: [pi_sd_trim, hd19]

- name: Bring the mode of the running mount to the one this host owns
  # Gated on the measurement, so on a box that mounts with the option it simply does not run. This
  # is not the durable owner — it is the reconciliation for the mount that is up and cannot be
  # remounted into a new mode (see the block comment).
  ansible.builtin.file:
    path: /var/log
    state: directory
    owner: root
    group: adm
    mode: '0755'
  when: "pi_var_log_stat.stat.mode | default('0000') not in ['0755', '755']"
  tags: [pi_sd_trim, hd19]

- name: Read what /var/log measures after any reconciliation
  ansible.builtin.stat:
    path: /var/log
  register: pi_var_log_stat_after
  tags: [pi_sd_trim, hd19]

- name: Report the /var/log mount the running system has
  ansible.builtin.debug:
    msg: >-
      /var/log on {{ inventory_hostname }}: mode {{ pi_var_log_stat_after.stat.mode | default('?') }} owner
      {{ pi_var_log_stat_after.stat.pw_name | default('?') }}:{{ pi_var_log_stat_after.stat.gr_name | default('?') }}
      under live mount options '{{ pi_var_log_mount.stdout | default('unreadable') }}' (fstab opts
      '{{ pi_var_log_opts }}'). Want 0755 root:adm, the value logrotate's secure-parent check accepts.
      A live mount line with no mode= is expected until the next mount: tmpfs honours mode= at mount
      time only, so the mount line becomes truthful at a boot, never from a converge.
  tags: [pi_sd_trim, hd19]

# ---- The retention the tmpfs needs ----
# Rotation on a tmpfs moves bytes inside the SAME filesystem, so the calendar is not a bound: a
# `weekly` + `rotate 4` stanza keeps four generations, the newest of them (`delaycompress`) sitting
# UNCOMPRESSED next to a live file of the same size. Measured here, one period's raw syslog is
# 75 MB (`/var/log/syslog.2.gz` inflates to 75,454,651 bytes) against a 100 MB mount, so a chatty
# period at the distro retention is 75 M live + 75 M retained in 100 M of RAM — the full-`/var/log`
# failure the row feared, deferred into RAM rather than avoided. The bound is the size, not the date.
#
# The file is `/etc/logrotate.d/rsyslog`, which the `rsyslog` package owns as a Conffile
# (`dpkg-query -W -f='${Conffiles}' rsyslog` names it). It is rendered HERE rather than added beside
# it because logrotate refuses a path two stanzas name — measured with logrotate 3.22.0, a second
# stanza for `/var/log/syslog` gives `error: … duplicate log entry for /var/log/syslog`,
# `error: found error in file …, skipping` and exit 1, which fails `logrotate.service`. Owning these
# paths therefore means rendering the file that already owns them, and the only lines changed from
# the packaged ones are the retention knobs: `weekly`→`daily`, `rotate 4`→`rotate 1`, plus `maxsize`.
# `postrotate` is kept verbatim, because it is what tells rsyslog to reopen its files.
- name: Name the /var/log retention this host owns
  # maxsize 25M against the size=100m mount above: with rotate 1 the worst case is the live file
  # (≤ maxsize) plus one retained generation (≤ maxsize, uncompressed while delaycompress defers it)
  # = ~50 M of 100 M, and the other five paths in the stanza are two orders of magnitude quieter
  # (auth.log 0.7 M, user.log 96 K, kern.log 5 K, cron.log 16 K over the same period as 5.0 M of
  # syslog). Sized against the mount, not against an SD card.
  ansible.builtin.set_fact:
    pi_var_log_maxsize: "25M"
  tags: [pi_sd_trim, hd1103]

- name: Render the logrotate stanza that owns the rsyslog logs
  # Owns /etc/logrotate.d/rsyslog — the packaged rsyslog Conffile, rendered with only its retention
  # knobs changed. No notify: logrotate is timer-driven (`logrotate.timer`, daily with a 1 h jitter),
  # so there is no daemon to reload and nothing restarts on this change.
  ansible.builtin.template:
    src: logrotate-rsyslog.j2
    dest: /etc/logrotate.d/rsyslog
    owner: root
    group: root
    mode: '0644'
  tags: [pi_sd_trim, hd1103]

- name: Read the retention logrotate is actually applying
  # The read-leg, and it is the ONLY leg that can tell whether this render is still the file in
  # force. logrotate prints the effective policy per stanza; the stanza's paths are printed one per
  # line with the policy text after the last one, so the block is flattened before it is judged.
  # `errors` counts logrotate's own `error:` lines, which is how a package-restored duplicate stanza
  # announces itself. It really runs under --check.
  ansible.builtin.shell:
    cmd: |
      set -eu
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      out="$(logrotate -d /etc/logrotate.conf 2>&1 || true)"
      flat="$(printf '%s ' "$out" | tr '\n' ' ')"
      stanza="$(printf '%s' "$flat" | sed -e 's#.*rotating pattern: /var/log/syslog ##' -e 's# considering log /var/log/syslog.*##')"
      printf 'stanza: %s\n' "$stanza"
      printf 'errors: %s\n' "$(printf '%s\n' "$out" | grep -c 'error:' || true)"
  register: pi_logrotate_policy
  changed_when: false
  check_mode: false   # a probe, not a mutation — --check must still be able to judge
  tags: [pi_sd_trim, hd1103]

- name: Report the retention the running logrotate reports
  ansible.builtin.debug:
    msg: >-
      /var/log retention on {{ inventory_hostname }}: {{ pi_logrotate_policy.stdout_lines | join(' | ') }}.
      Want `after 1 days`, `log files >= {{ (pi_var_log_maxsize | regex_replace('M$', '') | int) * 1048576 }}
      … are rotated earlier` and `(1 rotations)` with `errors: 0` (logrotate 3.22.0 words the maxsize
      clause that way); anything else is a different file in force, whatever this role rendered.
  tags: [pi_sd_trim, hd1103]

- name: Refuse to call the retention ruled while a different policy is in force
  # Asserted on what logrotate REPORTS, never on the rendered file existing: an rsyslog upgrade that
  # reinstalls its Conffile, or any second stanza naming these paths, makes the render a decoration
  # while /var/log stays unbounded. Skipped under --check, where the report line IS the verdict (the
  # split the /var/log and nm-resolver legs use).
  ansible.builtin.assert:
    that:
      - "'stanza:' in pi_logrotate_policy.stdout"
      - "'log files >= ' ~ ((pi_var_log_maxsize | regex_replace('M$', '') | int) * 1048576) in pi_logrotate_policy.stdout"
      - "'(1 rotations)' in pi_logrotate_policy.stdout"
      - "'after 1 days' in pi_logrotate_policy.stdout"
      - "'errors: 0' in pi_logrotate_policy.stdout"
    fail_msg: >-
      {{ inventory_hostname }} does not run the ruled /var/log retention. The read says:
      {{ pi_logrotate_policy.stdout_lines | join(' | ') }} — want daily (`after 1 days`),
      maxsize {{ pi_var_log_maxsize }} and `(1 rotations)` with no logrotate `error:` line. A
      `duplicate log entry` error means a second stanza names these paths and logrotate.service is
      failing; retention text that differs means /etc/logrotate.d/rsyslog was reinstalled by the
      rsyslog package or edited on the host. Either way the tmpfs is bounded by the calendar again,
      which on this mount means by nothing.
    quiet: true
  when: not ansible_check_mode
  tags: [pi_sd_trim, hd1103]

- name: Refuse to call /var/log configured while logrotate has nowhere to write
  # Asserted, not reported: "the task is green" is not the invariant. It asserts the mode logrotate
  # really sees and NOT the mount line — the mount line cannot be made truthful without unmounting a
  # filesystem that is open, which is a reboot-shaped act this run must not take. Skipped under
  # --check, where the report line IS the verdict (the split the nm-resolver block uses).
  ansible.builtin.assert:
    that:
      - "pi_var_log_stat_after.stat.mode | default('0000') in ['0755', '755']"
      - "pi_var_log_stat_after.stat.pw_name | default('') == 'root'"
    fail_msg: >-
      /var/log on {{ inventory_hostname }} measures mode {{ pi_var_log_stat_after.stat.mode | default('?') }}
      {{ pi_var_log_stat_after.stat.pw_name | default('?') }}:{{ pi_var_log_stat_after.stat.gr_name | default('?') }}
      under mount options '{{ pi_var_log_mount.stdout | default('unreadable') }}'. A tmpfs mounted without
      mode= arrives 1777 root:root and logrotate skips every system file with "skipping … because of bad
      file mode", so the logs live and nothing rotates. The fstab option owns future mounts and the
      task above owns the mount that is up; neither one worked here.
    quiet: true
  when: not ansible_check_mode
  tags: [pi_sd_trim, hd19]