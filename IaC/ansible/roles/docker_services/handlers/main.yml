---
# docker_services role handlers.
# Handlers are tag-filtered exactly like tasks: under a filtered run (--tags
# "docker_services,<service>") an UNTAGGED handler is silently skipped even when a task that ran
# notified it. Every handler below carries `tags: always` so a notification can never be dropped.

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  tags: always
