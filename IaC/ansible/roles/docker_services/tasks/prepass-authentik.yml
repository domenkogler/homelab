---
# prepass-authentik.yml — Authentik OIDC pre-pass (HD-162)
# Runs BEFORE the per-service deploy loop in main.yml, on hosts where `authentik`
# is in docker_services (the VPS public edge). Guarantees the OIDC secret-egress
# glue has seeded the 1Password OIDC items BEFORE any consumer compose template
# renders — so no consumer ever renders with empty/placeholder client creds.
#
# Ordering (docs/deployment-oidc.md): deploy
# `authentik` (+ bundled pg/redis, with the /blueprints volume auto-applying the
# ks-oidc.yml Blueprint), then apply the Blueprint if not yet applied, then run the
# secret-egress glue, then deploy the OIDC consumers. Home hosts (home_servers /
# raspberry_pi) never run this pre-pass — `authentik` is not in their docker_services.

- name: Assert safe execution context (pre-pass runs only as an allowed admin)
  ansible.builtin.assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      docker_services pre-pass must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: [authentik, secret-egress]

- name: "Guard: Authentik pre-pass reached without an authentik entry"
  ansible.builtin.assert:
    that:
      - "'authentik' in (docker_services | map(attribute='name') | list)"
    fail_msg: >-
      The Authentik secret-egress pre-pass was included without an `authentik` entry
      in docker_services on {{ inventory_hostname }}. main.yml gates this include
      with when: 'authentik' in (...) — this assert is a safety net and should
      never fire. See HD-162.
  tags: [authentik, secret-egress]

# Render the secret-egress glue script once per host (idempotent; force: no would
# preserve local edits, but the script is managed by Ansible — overwrite is intended).
- name: "Render Authentik secret-egress glue (HD-143)"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/docker_services/templates/authentik-secret-egress.sh.j2"
    dest: "/usr/local/sbin/authentik-secret-egress.sh"
    mode: '0755'
  tags: [authentik, secret-egress]

# Deploy the host-side op SA token FROM THE VAULT (HD-143): this is the 1Password
# WRITE-SCOPED service-account token the VPS's own op CLI uses (glue vault writes).
# It is a DIFFERENT secret from `authentik-provision_api` (the Authentik-ISSUED API
# token the glue sends as Bearer) — the first deploy conflated the two and broke the
# glue (2026-08-22; see services-authentik.md "Authentication tokens").
# Rotation = update the vps-op-write_api item + re-run this playbook.
- name: "Deploy provision token for host-side op (HD-143)"
  ansible.builtin.copy:
    content: "{{ lookup('community.general.onepassword', 'vps-op-write_api', field='credential', vault=op_vault) }}\n"
    dest: /etc/op/provision-token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  tags: [authentik, secret-egress]