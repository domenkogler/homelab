---
# kopia-fingerprint-sync.yml — seed/refresh the 1Password kopia-server TLS trust anchor from the
# LIVE cert on the VPS kopia-server config bind.
#
# kopia 0.23.x clients hard-require https:// plus a pinned --server-cert-fingerprint. The server serves
# a PERSISTED self-signed cert (generated once by its boot script under
# /srv/docker/kopia-server/config/), whose SHA-256 fingerprint is the trust anchor the oldsrv agent
# pins. The anchor lives in 1Password (`kopia-server_fingerprint`) because both compose templates read
# it through the shared `vault` dict; this task keeps the vault in sync with the live cert (no-op
# when they already match).
#
# Runs on the VPS ONLY (kopia-server is VPS-resident) and only after the cert files exist. Host-side
# write uses the SA token deployed to /etc/op/provision-token (never in Git).
#
# One item, one title: the write branch re-reads and verifies instead of treating a non-zero
# `op item edit` rc as "item missing" — see the note on the sync task below for the duplicate-item class
# that shape mints.
- name: "Wait for kopia-server TLS fingerprint file (container boot writes it)"
  # slurp ERRORS (returns no result) when the file is absent, so the retry is driven by a stat that
  # tolerates absence until the container boot script has written tls-sha256.
  block:
    - name: "Stat kopia-server TLS fingerprint file"
      ansible.builtin.stat:
        path: "/srv/docker/kopia-server/config/tls-sha256"
      register: kopia_tls_fp_stat
      until: kopia_tls_fp_stat.stat.exists
      retries: 12
      delay: 5

    - name: "Read kopia-server TLS fingerprint file"
      ansible.builtin.slurp:
        src: "/srv/docker/kopia-server/config/tls-sha256"
      register: kopia_tls_fp_file
      when: kopia_tls_fp_stat.stat.exists
  when:
    - inventory_hostname == 'vps.kogler.si'
    - "'kopia-server' in (docker_services | map(attribute='name') | list)"
    - scope_is_all or 'kopia-server' in scope_list
  tags: [docker_services, kopia_server, kopia_fingerprint]

- name: "Assert kopia-server TLS fingerprint is lowercase hex (128 chars)"
  # ⚠ Same tags as the include line in main.yml and as the wait/stat block above: a dynamic
  # include's own tags do not cascade, so a task here without them is silently skipped by every
  # scoped run that does expand this file.
  ansible.builtin.assert:
    that:
      - kopia_tls_fp_file.content is defined
      - (kopia_tls_fp_file.content | b64decode | trim | lower) is match('^[0-9a-f]{64}$')
    fail_msg: >-
      /srv/docker/kopia-server/config/tls-sha256 is missing or malformed. It is
      written by the kopia-server container boot script after generating tls.crt/tls.key.
      Redeploy kopia-server first (its first start generates the cert), then re-run.
  tags: [docker_services, kopia_server, kopia_fingerprint]
  when:
    - inventory_hostname == 'vps.kogler.si'
    - kopia_tls_fp_file is defined
    - kopia_tls_fp_file.skipped is not defined

- name: "Sync kopia-server_fingerprint 1P item from live cert"
  # ⛔ The write branch must never be `edit failed -> create`. `op item edit` returns a non-zero rc on
  # the documented op-CLI 2.39 spurious post-write 404 WHILE THE WRITE HAS ALREADY LANDED
  # (docs/1password.md §Troubleshooting), and an `elif create` on that rc mints a SECOND item with the
  # same title — a duplicate trust anchor whose title-based reads then resolve arbitrarily, which is
  # worse than the failure it was papering over. So: edit, and on a non-zero rc RE-READ and verify;
  # create only when the title demonstrably does not exist, and fail loudly in every other case.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      TITLE="kopia-server_fingerprint"
      VAULT="Homelab-ansible"
      FP="$(cat /srv/docker/kopia-server/config/tls-sha256 | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
      if [ -r /etc/op/provision-token ]; then
        export OP_SERVICE_ACCOUNT_TOKEN="$(cat /etc/op/provision-token)"
      fi
      read_value() {
        op item get "$TITLE" --vault="$VAULT" --field password --reveal < /dev/null 2>/dev/null \
          | tr -d '[:space:]' || true
      }
      # EXACTLY ONE item must carry the title. Zero = create is legitimate; two or more = the duplicate
      # class itself, and a third write would deepen it, so refuse and name the ids.
      count_title() {
        op item list --vault="$VAULT" --format json < /dev/null 2>/dev/null \
          | python3 -c "import json,sys;print(sum(1 for i in json.load(sys.stdin) if i.get('title')=='$TITLE'))" \
          || echo unknown
      }
      CUR="$(read_value)"
      if [ "$CUR" = "$FP" ]; then
        echo "kopia-server_fingerprint already in sync"
        exit 0
      fi
      N="$(count_title)"
      if [ "$N" != "1" ] && [ "$N" != "0" ]; then
        echo "ERROR: $N items are titled $TITLE — refusing to write; resolve the duplicates first:" >&2
        op item list --vault="$VAULT" --format json < /dev/null 2>/dev/null \
          | python3 -c "import json,sys;[print('  '+i['id']+'  '+i['title']) for i in json.load(sys.stdin) if i.get('title')=='$TITLE']" >&2 || true
        exit 1
      fi
      if [ "$N" = "1" ]; then
        if op item edit "$TITLE" --vault="$VAULT" "password=$FP" < /dev/null >/dev/null 2>&1; then
          echo "updated $TITLE"
          exit 0
        fi
        # Non-zero edit rc proves NOTHING on its own — re-read and judge the value, not the rc.
        NOW="$(read_value)"
        if [ "$NOW" = "$FP" ]; then
          echo "updated $TITLE (op reported an error; the re-read proves the write landed)"
          exit 0
        fi
        echo "ERROR: $TITLE exists but still does not hold the live cert fingerprint — not creating a second item" >&2
        exit 1
      fi
      if op item create --vault="$VAULT" --category="Password" --title="$TITLE" "password=$FP" \
          < /dev/null >/dev/null 2>&1; then
        echo "created $TITLE"
      else
        echo "ERROR: could not write $TITLE to 1Password" >&2
        exit 1
      fi
    executable: /bin/bash
  register: kopia_fp_sync
  changed_when: "'updated' in kopia_fp_sync.stdout or 'created' in kopia_fp_sync.stdout"
  no_log: true   # the shell cmd reads the SA token + writes a secret-adjacent anchor
  tags: [docker_services, kopia_server, kopia_fingerprint]
  when:
    - inventory_hostname == 'vps.kogler.si'
    - kopia_tls_fp_file is defined
    - kopia_tls_fp_file.skipped is not defined