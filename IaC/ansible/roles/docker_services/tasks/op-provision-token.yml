---
# op-provision-token.yml — deploy the write-scoped 1Password service-account token (item
# `op-write_api`) to a host that does NOT run Authentik.
#
# Why this is its own file: the other writer of /etc/op/provision-token, prepass-authentik.yml, is
# gated on `'authentik' in docker_services` — which only exists in group_vars/vps.yml — so a home
# host has no code path that can ever refresh its copy. The item itself stays valid; the host simply
# never receives the re-issued value, and a retired service account then 403s
# "Service Account Deleted" while every converge stays green. The remedy is NOT a new service
# account but a path to the current value: a host running vault-writing glue opts in with
# `docker_services_op_provision_token: true`.
#
# Scope law preserved: this still requires `scope_is_all` (see main.yml) — a surgical
# `--tags docker_services,<svc>` run must not move fleet credentials as a side effect. `cockpit` and
# friends are in the self-converge lockout set, so an oldsrv run of this leg is issued FROM the
# laptop, never from oldsrv itself.

- name: Assert safe execution context (token deploy runs only as an allowed admin)
  ansible.builtin.assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      The op provision-token task must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: [docker_services]

- name: "Deploy provision token for host-side op"
  ansible.builtin.copy:
    content: "{{ lookup('community.general.onepassword', 'op-write_api', field='credential', vault=op_vault) }}\n"
    dest: /etc/op/provision-token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  tags: [docker_services]

# Fail loud on VALIDITY, not existence: every consumer here tests `[ -r /etc/op/provision-token ]` and
# then trusts the read, which is exactly how a dead credential survives green converges. One read-only
# list call turns that class into a failed task instead of a silent no-write.
- name: "Probe the deployed token is actually accepted"
  # Reads the file it just wrote instead of re-looking the secret up: keeps the token out of the task
  # parameters (so this needs no no_log) and leaves the 403 text visible on failure — the diagnostic
  # IS the point. Same incantation as run-authentik-glue.yml; `shell` is skipped under --check.
  ansible.builtin.shell:
    cmd: |
      set -eu
      export OP_SERVICE_ACCOUNT_TOKEN="$(cat /etc/op/provision-token)"
      op item list --vault "{{ op_vault }}" >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  tags: [docker_services]
