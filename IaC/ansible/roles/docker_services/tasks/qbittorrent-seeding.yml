---
# qbittorrent-seeding.yml — the HD-1086 seeding goal (ratio 2 → pause), set over qBittorrent's own API.
# Included ONCE from docker_services/main.yml, AFTER qbittorrent-seed.yml, gated on the same deploy
# scope + `not ansible_check_mode` (it drives the live container).
#
# WHY IT IS ITS OWN FILE AND ITS OWN MECHANISM: qbittorrent-seed.yml edits `qBittorrent.conf` with the
# container STOPPED, because qbit rewrites the file on a clean exit. A preference this ordinary does not
# deserve a downloader stop/start, and the credential that made the API unreachable on a from-zero build
# is the very thing the seed above just wrote. So: conf for identity + paths (stopped), API for this
# (running). Order in main.yml is the contract, not a nicety — run this before the seed and login fails
# against an empty `WebUI\Password_PBKDF2`, i.e. qbit's freshly minted random password.
#
# WHAT IT IS NOT: a fix for the hardlink problem. An import MOVES the file (EXDEV across the arr's two
# binds, Radarr 6.3 has no Link Type), so an imported torrent stops seeding at the import; the goal
# bounds the seeds that keep their files. docs/services-downloads.md §Hardlink import is impossible.

- name: "qbittorrent-seeding: assert the goal is coherent before touching a live client"
  ansible.builtin.assert:
    that:
      - qbit_seed_goal_action | int != 2            # 2 = remove torrent AND delete its files
      - not (qbit_seed_ratio_goal_enabled | bool) or (qbit_seed_ratio_goal | int) > 0
      - not (qbit_seed_time_goal_enabled | bool)    # ratio is the only limit the owner ruled
      - not (qbit_seed_inactive_goal_enabled | bool)
    fail_msg: >-
      The seeding goal in role defaults is not the ruled shape: action 2 deletes files, a ratio goal
      needs a value > 0, and a TIME goal would stop seeding before the ratio is reached. The 2026-10-07
      ruling is ratio {{ qbit_seed_ratio_goal }} then pause — change the ruling in
      docs/services-downloads.md first, not the guard here.
  tags: [docker_services, qbittorrent_seed]

- name: "qbittorrent-seeding: render the reconcile helper"
  # Rendered then run — the qbittorrent-conf.py / sabnzbd-folders.py precedent: `script:` needs a real
  # file on the target, and the wanted values come from the role defaults. 0700 root: the file carries
  # no secret (the credential arrives on stdin), but it does change a live downloader's behaviour.
  ansible.builtin.template:
    src: qbittorrent-seeding.py.j2
    dest: "{{ qbit_seeding_helper }}"
    mode: '0700'
  changed_when: false
  tags: [docker_services, qbittorrent_seed]

- name: "qbittorrent-seeding: discover the WebUI origin (the netns owner, not the host publish)"
  # qbit is `network_mode: service:gluetun`; the host publish 401s everything because qbit rejects a
  # Host header whose port is not its own socket port. This is the origin the arrs dial and the one
  # qbittorrent-seed.yml verifies at — the same origin or nothing here is comparable.
  ansible.builtin.shell:
    cmd: >-
      docker inspect {{ qbit_netns_owner }}
      --format '{{ '{{' }}range $k, $v := .NetworkSettings.Networks{{ '}}' }}{{ '{{' }}$v.IPAddress{{ '}}' }} {{ '{{' }}end{{ '}}' }}'
      | tr ' ' '\n' | awk 'NF{print $1; exit}'
    executable: /bin/bash
  register: _qbit_seed_netns_ip
  changed_when: false
  tags: [docker_services, qbittorrent_seed]

- name: "qbittorrent-seeding: check the drift (no write)"
  # stdin, not argv (CONVENTIONS §6); no_log keeps the credential out of the run log. --check first for
  # the same reason the conf seed does: never write to a live app on a hunch.
  ansible.builtin.command:
    cmd: "{{ qbit_seeding_helper }} http://{{ _qbit_seed_netns_ip.stdout | trim }}:{{ qbit_webui_port }} --check"
    stdin: "{{ vault[svc.secret_item].credential }}"   # INSIDE the module: at task level Ansible dies with
    # "conflicting action statements: ansible.builtin.command, stdin" — measured, this file aborted a live
    # converge at exactly this line on 2026-10-07 (nothing was deployed; the failure is parse-time).
  no_log: true
  changed_when: false
  register: _qbit_seed_check
  until: _qbit_seed_check.rc == 0          # the seed above has just `docker start`ed it; the API needs a moment
  retries: 8
  delay: 5
  tags: [docker_services, qbittorrent_seed]

- name: "qbittorrent-seeding: apply the goal if it drifted"
  # The helper exits 4 when the API accepted the write but the read-back disagrees — that is the class
  # this whole file exists to close (a value that sits in a preference map doing nothing, the SABnzbd
  # `dir`/`complete_dir` shape). rc 0 with "CHANGED applied and read back" is the only green allowed.
  # ⚠ Two legibility traps, both measured here 2026-10-07:
  #   * `no_log` censors the result, so a bare failing command leaves only
  #     `FAILED! => {"censored": ...}` — the block/always pair below prints the helper's own verdict even
  #     when the task goes red. The task STILL goes red (a `rescue:` would mute the class).
  #   * `when:` on a BLOCK does not do what it looks like: the main tasks were skipped silently (no_log
  #     suppresses even the `skipping` line) while `always` ran anyway, so the run reported green with
  #     the goal unapplied. The condition lives on the TASK, where it was proven to work.
  block:
    - name: "qbittorrent-seeding: POST the goal"
      ansible.builtin.command:
        cmd: "{{ qbit_seeding_helper }} http://{{ _qbit_seed_netns_ip.stdout | trim }}:{{ qbit_webui_port }}"
        stdin: "{{ vault[svc.secret_item].credential }}"   # INSIDE the module — see the note above
      when: "'CHANGED' in _qbit_seed_check.stdout | default('')"
      no_log: true
      changed_when: true
      register: _qbit_seed_apply

  always:
    - name: "qbittorrent-seeding: record the verdict (runs on failure and on no-drift too)"
      ansible.builtin.debug:
        msg: >-
          seeding goal @ http://{{ _qbit_seed_netns_ip.stdout | trim }}:{{ qbit_webui_port }} →
          {{ _qbit_seed_apply.stdout | default(_qbit_seed_apply.msg | default(_qbit_seed_check.stdout | default('(no output)'))) }}
          · note: an *arr import MOVES the file (EXDEV across the binds), so an imported torrent stops
            seeding at the import regardless of this goal
      tags: [docker_services, qbittorrent_seed]
