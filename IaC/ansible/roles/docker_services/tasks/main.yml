---
# docker_services role — generic Docker Compose service deployer
#
# Loops over docker_services from group_vars, creates external networks,
# copies templates, renders .j2 files with 1Password lookups, and runs
# docker compose up -d for each enabled service.
#
# Input: docker_services list (group_vars/home_servers.yml, group_vars/raspberry_pi.yml)
# Depends on: community.docker collection (requirements.yml)
# See docs/deployment-ansible.md §docker_services for spec.

- name: Assert safe execution context
  ansible.builtin.assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      docker_services role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).

# Fail-closed on secret resolution: every compose template resolves 1Password secrets inline, so if the op
# CLI or the vault is unavailable the run aborts with a clear message BEFORE any render — never deploy secrets
# that silently failed. A template lookup with an explicit `default('')` is fail-OPEN and is not allowed here.
- name: Assert 1Password secret backend is available
  ansible.builtin.assert:
    that:
      - op_vault is defined
      - op_vault | length > 0
    fail_msg: >-
      op_vault is not set (group_vars/all/ defines `op_vault: Homelab-ansible`).
      Compose render resolves secrets from 1Password at template time; without a
      vault the render must abort loudly rather than deploy with missing secrets.
      Fix the 1Password backend before re-running.

- ansible.builtin.shell:
    cmd: command -v op || true
  register: op_bin
  changed_when: false
  check_mode: false
  become: false            # no escalation locally — play-level become:true would break the tmp-dir perms
  delegate_to: localhost   # lookups resolve on the CONTROL node — never probe the target for op
  run_once: true
  tags: [docker_services]

- name: Fail if 1Password CLI (op) is not on this host
  ansible.builtin.assert:
    that:
      - op_bin.stdout | trim | length > 0
    fail_msg: >-
      The 1Password CLI (op) was not found on PATH. The docker_services role
      resolves every secret via `community.general.onepassword` lookups and must
      fail closed if the CLI is missing — install 1Password CLI on the control
      host and re-run.
  tags: [docker_services]

# ---- Bulk 1Password pre-pass (static items) ----
# The host's NEEDED item set is DERIVED (`op-vault-export.py --derive`) from its ENABLED services'
# template_dir -> items map (_template_vault_items), minus the glue-seeded items (_bulk_op_glue) and the
# litellm scoped keys, both fetched later by their own pre-passes. They land in one `vault` dict from one
# concurrent `op` call per item instead of each template field spawning `op` in the render loop.
# Must run BEFORE the authentik lane: the authentik compose renders from the dict.
# Contract: fail-closed — the exporter aborts loudly on a needed item that does not resolve (no default(''));
# delegate localhost, run_once, no_log.
- name: "Bulk 1Password pre-pass (static) — export enabled-services' items into `vault`"
  # Scope-gated: a full converge (scope=all) exports every enabled template_dir's items; a deploy-scoped run
  # (`docker_services_scope=<svc>`) exports ONLY that service's, instead of paying for all services.
  ansible.builtin.include_tasks:
    file: fetch-vault-pass.yml
  vars:
    op_mode: "derive"
    # The enabled set must MATCH the main deploy loop (default-enabled when `enabled:` is absent: a list entry
    # runs, `enabled: false` opts out). `selectattr('enabled','truthy')` CRASHES on entries without the key
    # (Jinja raises "dict has no attribute 'enabled'"), so build it as defined+truthy UNION missing-key.
    # Some Pi entries omit `enabled:` entirely.
    _pi_enabled_dirs: >-
      {{ (docker_services | selectattr('enabled','defined') | selectattr('enabled') | map(attribute='template_dir') | list)
         + (docker_services | rejectattr('enabled','defined') | map(attribute='template_dir') | list) }}
    op_derive_services: >-
      {{ scope_is_all | ternary(
           _pi_enabled_dirs,
           (docker_services | selectattr('enabled','defined') | selectattr('enabled') | selectattr('name','in',scope_list) | map(attribute='template_dir') | list)
           + (docker_services | rejectattr('enabled','defined') | selectattr('name','in',scope_list) | map(attribute='template_dir') | list)) }}
    # On a FULL converge the litellm-scoped keys (dsh_api, pi-harness_openai_api, …) are
    # deliberately EXCLUDED here — they're minted by the litellm bootstrap glue later in the
    # loop and fetched via the post-glue list pre-pass (they don't exist before it on a fresh
    # host). On a DEPLOYED run the target service may be a CONSUMER of those very keys
    # (e.g. pi-dev/dsh reference a litellm-scoped key), and litellm is NOT in the loop — so
    # we fetch the scoped service's FULL item set directly. On an already-provisioned host
    # those keys exist; fail-closed still aborts if a genuinely-missing key is referenced.
    op_derive_glue: >-
      {{ scope_is_all | ternary(litellm_scoped_keys | default([]) | map(attribute='vault_item') | list, []) }}
    op_derive_spec: >-
      {{ {'services': op_derive_services, 'map': _template_vault_items, 'glue': op_derive_glue} }}
  tags: [docker_services, secrets]

- name: Create systemd template unit for Docker Compose services
  ansible.builtin.template:
    src: docker-compose@.service.j2
    dest: /etc/systemd/system/docker-compose@.service
    mode: '0644'
  notify: reload systemd

- name: Create external Docker networks
  community.docker.docker_network:
    name: "{{ item.name }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ item.cidr }}"
  loop: "{{ network_ranges | selectattr('name', 'in', ['traefik-public', 'services-internal', 'db-internal', 'llm-backend', 'tailnet-apps', 'dns-servers']) | list }}"
  when: scope_is_all
  tags: [docker_services, networks]

# Authentik OIDC pre-pass — on hosts where `authentik` is in docker_services (the VPS public edge). The
# glue needs a RUNNING authentik API, which does not exist before the first deploy, so the order is
# (authentik still precedes every OIDC consumer):
#   1. render glue + deploy provision token      (prepass-authentik.yml)
#   2. deploy authentik (+ bundled pg/redis)     (deploy-service.yml, authentik only)
#   3. run the glue → seeds 1Password OIDC items (run-authentik-glue.yml)
#   4. deploy ALL other services                 (deploy-service.yml, authentik excluded)
# so consumers in step 4 always render with real client creds. Home hosts skip this pre-pass, so the token leg
# has its own opt-in path below: a host that writes to the vault without running Authentik still needs a
# token it can refresh.
- name: Authentik OIDC secret-egress pre-pass (render + token)
  ansible.builtin.include_tasks:
    file: prepass-authentik.yml
  when:
    - "'authentik' in (docker_services | map(attribute='name') | list)"
    - scope_is_all
  # ⚠ The include tag must name every tag its children carry: prepass-authentik.yml's four tasks are
  # tagged `authentik, secret-egress`, and a tag the include lacks never opens the file, so those
  # tasks were unreachable by any filter while the recap stayed green (rule 2/3).
  tags: [docker_services, authentik, secret-egress]

# Token-only pre-pass for a host that must WRITE to the vault but does not run Authentik. Mutually exclusive
# with the Authentik pre-pass above, which already deploys the same file — running both is a redundant write,
# and on the VPS the Authentik pre-pass is the authoritative order.
- name: Deploy the op write-scoped token (non-Authentik hosts, opt-in)
  ansible.builtin.include_tasks:
    file: op-provision-token.yml
  when:
    - docker_services_op_provision_token | default(false) | bool
    - scope_is_all
    - "'authentik' not in (docker_services | map(attribute='name') | list)"
  tags: docker_services

- name: Deploy authentik FIRST (its API must be live before the glue can harvest)
  # Scope-gate this: a deploy-scoped run (scope!=all AND scope!=authentik) must NOT deploy authentik — its
  # items are intentionally excluded from the scoped pre-pass, so rendering it would fail-closed on a missing
  # secret. Only scope=all or an explicit scope=authentik deploys it.
  ansible.builtin.include_tasks:
    file: deploy-service.yml
  vars:
    # Dedicated loop_var: a lazy "{{ item }}" would be re-resolved by any INNER loop in
    # deploy-service.yml (e.g. the extra .j2 templates) and shadow into a str.
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services | selectattr('name', 'equalto', 'authentik') | list }}"
  loop_control:
    loop_var: svc_entry
  when:
    - scope_is_all or 'authentik' in scope_list
    - svc_entry.enabled | default(true)
  tags: docker_services

- name: Apply custom Authentik blueprints one-shot — now EXTERNALIZED
  # Blueprints change rarely (integration wiring only) and a one-shot `docker exec ak apply_blueprint`
  # costs ~45s on every converge, so they are applied by the dedicated playbook
  # `playbooks/authentik-blueprints.yml` — run it when a blueprint file changes. The secret-egress glue
  # below is idempotent-fast once the blueprints are applied, so it stays in the routine lane.
  ansible.builtin.debug:
    msg: >-
      Blueprints are applied via the dedicated playbook
      `playbooks/authentik-blueprints.yml` (externalized from the deploy lane)
      — not run during routine docker_services converges.

- name: Run the secret-egress glue (after authentik is up)
  ansible.builtin.include_tasks:
    file: run-authentik-glue.yml
  when:
    - "'authentik' in (docker_services | map(attribute='name') | list)"
    - scope_is_all
  # ⚠ Same rule as the pre-pass include above: the glue task inside carries `authentik,
  # secret-egress`, so with only `docker_services` here it never loaded under those tags.
  tags: [docker_services, authentik, secret-egress]

# Second pre-pass: fetch the glue-seeded OIDC items AFTER the glue persisted them — they do not exist
# before it on a fresh host, and on a provisioned host this is a no-op refresh. They merge into the same
# `vault` dict as the static pre-pass above.
- name: "Bulk 1Password pre-pass (glue OIDC) — export {{ _bulk_op_glue | length }} items into `vault`"
  ansible.builtin.include_tasks:
    file: fetch-vault-pass.yml
  vars:
    op_mode: "list"
    op_item_list: "{{ _bulk_op_glue }}"
  when:
    - "'authentik' in (docker_services | map(attribute='name') | list)"
    - scope_is_all
  tags: [docker_services, secrets]

- name: Deploy each enabled service
  ansible.builtin.include_tasks:
    file: deploy-service.yml
  vars:
    # Dedicated loop_var: see the authentik-first include above.
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.name != 'authentik'
    # Surgical scope: a full converge (scope=all) deploys every enabled service; a named scope deploys ONLY
    # the listed ones. The per-service tags narrow the task list; this collapses the loop so nothing else
    # even iterates.
    - scope_is_all or svc_entry.name in scope_list
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: docker_services

# kopia-server TLS trust-anchor sync (VPS only): after kopia-server's first start wrote tls.crt/tls.key +
# tls-sha256 into its config bind, the 1Password `kopia-server_fingerprint` item must stay in sync — the
# oldsrv agent and the server compose read it through the shared `vault` dict. No-op when already in sync.
- name: Sync kopia-server TLS fingerprint to 1Password
  ansible.builtin.include_tasks:
    file: kopia-fingerprint-sync.yml
  tags: [docker_services, kopia_server, kopia_fingerprint]

# Technitium seed: once the container is up, bootstrap the admin (first login on the
# now-persistent /etc/dns) and ensure the kogler.si zone + split-horizon A records. Runs for
# every technitium instance that was in the deploy loop (VPS primary, oldsrv secondary, Pi tertiary).
- name: Seed Technitium instances (admin bootstrap + split-horizon records)
  ansible.builtin.include_tasks:
    file: technitium-seed.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') == 'technitium'
    - scope_is_all or svc_entry.name in scope_list
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, technitium_seed]

# Immich's OAuth (Authentik) settings are NOT compose env — Immich v3 has no OAuth env vars at all; they
# live in the DB-backed system config the Admin UI writes. Seed them idempotently via
# PUT /api/admin/config once the stack is up. Why a seed task exists at all:
# templates/docker_services/immich-app/docker-compose.yml.j2 + tasks/immich-seed.yml.
# Gated `not ansible_check_mode`: every task drives the live API (deployment-ansible.md §Dry-run).
- name: "Seed Immich OAuth system config"
  ansible.builtin.include_tasks:
    file: immich-seed.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') == 'immich-app'
    - scope_is_all or svc_entry.name in scope_list
    - not ansible_check_mode
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, immich_seed]

# The *arr root folders Seerr needs are APP state (each app's own database), not compose env, so a rebuild
# leaves them empty and Seerr's form fails with an EMPTY root-folder dropdown and a disabled Add button.
# Reconcile them and assert the profile Seerr pins still exists; the profile itself stays
# Profilarr/Recyclarr-owned. Autopsy + the Lidarr /api/v1 trap: tasks/arr-seed.yml.
- name: "Seed *arr root folders + assert the Seerr-pinned quality profile"
  ansible.builtin.include_tasks:
    file: arr-seed.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') in arr_seed_apps
    - scope_is_all or svc_entry.name in scope_list
    - not ansible_check_mode
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, arr_seed]

# SABnzbd's DNS-rebinding guard refuses every Host this stack uses (the shipped whitelist holds only the
# container id), so the UI shows "Hostname verification failed" and a client pointed at sabnzbd:8080 can
# never be saved. No env translation in the image and no config API make the ini the only automatable
# door. Restart only on drift; autopsy in tasks/sabnzbd-seed.yml.
- name: "Seed the SABnzbd host whitelist"
  ansible.builtin.include_tasks:
    file: sabnzbd-seed.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') == 'sabnzbd'
    - scope_is_all or svc_entry.name in scope_list
    - not ansible_check_mode
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, sabnzbd_seed]

# The torrent leg: an EMPTY stored WebUI password makes qBittorrent mint a fresh random one at every
# start, so no download client survives a recreate. The image translates no credential env and has no
# usable write API, so the conf is seeded while the container is stopped. The same pass owns the save path
# and the per-category paths, which are what stop a grab landing flat in /downloads where no root folder
# points. Autopsy: tasks/qbittorrent-seed.yml.
- name: "Seed the qBittorrent WebUI credential + save paths (torrent leg)"
  ansible.builtin.include_tasks:
    file: qbittorrent-seed.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') == 'qbittorrent'
    - scope_is_all or svc_entry.name in scope_list
    - not ansible_check_mode
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, qbittorrent_seed]

# The seeding goal: ratio 2.0, then pause. Set over the API against the RUNNING client (no stop for a
# preference), which is only possible because the seed above wrote the credential this logs in with.
- name: "Reconcile the qBittorrent seeding goal"
  ansible.builtin.include_tasks:
    file: qbittorrent-seeding.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') == 'qbittorrent'
    - scope_is_all or svc_entry.name in scope_list
    - not ansible_check_mode
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, qbittorrent_seed]

# The torrent half of the acquisition lane: the arrs carried a Usenet client and ZERO torrent clients, so
# every torrent indexer Prowlarr synced resolved releases nobody could receive. Registered IN EACH APP —
# Prowlarr included, because its own search UI has the same zero-client shape; that client governs only
# Prowlarr-originated grabs, since Prowlarr syncs indexers and never download clients. Runs AFTER the
# qBittorrent seed above.
- name: "Register the qBittorrent download client in each app that asks for one (torrent leg)"
  ansible.builtin.include_tasks:
    file: arr-client-torrent.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') in arr_torrent_client
    - scope_is_all or svc_entry.name in scope_list
    - not ansible_check_mode
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, arr_client_seed]

# DNS self-heal: the seed tail above only runs when a converge's deploy loop includes a technitium
# instance, so a deploy-SCOPED converge (`docker_services_scope=<svc>`) silently skips it and a zone can
# drift to ERR_NAME_NOT_RESOLVED. Deploy a systemd timer per DNS host that reconciles the local container
# with a no-op-if-synced `docker compose up -d`, closing the drift window without a full converge. Timer
# name and container derive from svc, so group_vars stay the SSOT for instance naming. See
# playbooks/dns-seed.yml for the on-demand re-seed of all three.

- name: Deploy Technitium seed self-heal timer (per DNS host)
  ansible.builtin.include_tasks:
    file: dns-seed.yml
  vars:
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.template_dir | default('') == 'technitium'
    - scope_is_all or svc_entry.name in scope_list
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: [docker_services, technitium_seed]

# Disabled services get TORN DOWN, not just skipped: a flipped-to-false entry would otherwise leave its
# containers running outside IaC control, restart-looping forever. `compose down` on the project dir is
# idempotent — absent project dir (rc 14/1) is tolerated, a running stack is removed, rendered files stay.
- name: Tear down DISABLED services (enabled=false)
  ansible.builtin.shell:
    cmd: "docker compose -p {{ item.name }} -f {{ docker_compose_dir }}/{{ item.name }}/docker-compose.yml down --remove-orphans || true"
    executable: /bin/bash
  changed_when: "'Removed' in teardown.stdout or 'Stopping' in teardown.stdout"
  register: teardown
  # All services; `when` picks the disabled ones (skip-only semantics elsewhere
  # would otherwise leave flipped-to-false stacks running outside IaC control).
  loop: "{{ docker_services }}"
  when:
    - scope_is_all
    - item.enabled is defined
    - not item.enabled
    - item.name != 'authentik'
  loop_control:
    label: "{{ item.name }}"
  tags: docker_services

# Disabled services must ALSO lose their boot auto-start unit: the enabled oneshot
# `docker-compose@<svc>` re-runs `compose up -d` at the next reboot and resurrects a stack that was
# deliberately torn down — the teardown above stops containers, it does not disable the unit.
- name: Disable boot auto-start for DISABLED services (enabled=false)
  ansible.builtin.systemd:
    name: "docker-compose@{{ item.name }}"
    enabled: false
    state: stopped
  loop: "{{ docker_services }}"
  when:
    - scope_is_all
    - item.enabled is defined
    - not item.enabled
    - item.name != 'authentik'
    - ansible_facts['service_mgr'] == 'systemd'
  loop_control:
    label: "{{ item.name }}"
  tags: docker_services

# Traefik cert-pull consumer wiring: a non-issuer traefik host is a cert CONSUMER — it pulls
# /opt/traefik/certs from the VPS issuer on a timer (every consumer pulls from the VPS directly,
# no relay) and serves TLS from the DEFAULT store (dynamic/tls.yml.j2). The issuer
# (`traefik_acme_issuer: true`, group_vars/vps.yml) issues locally and skips this entirely. Each
# consumer edge owns its certs dir at {{ docker_compose_dir }}/<edge>/certs, pulled by the SAME
# script/timer/keys; the Pi's `traefik-ha` keeps its own equivalent puller (home_assistant role,
# ha-cert-sync). Key authorization on the VPS is a LIVE step: append the consumer's
# /root/.ssh/traefik-cert-sync.pub to the VPS ansible-admin authorized_keys (restricted options
# recommended, cf. the Pi ha-sync wrapper precedent).
# The home-LAN edge must bind the VIP + LAN IP before/without keepalived holding it — the same
# requirement as the Pi's traefik-ha (the home_assistant role sets it there; this covers oldsrv,
# where keepalived runs as the standby VIP holder).
- name: Enable net.ipv4.ip_nonlocal_bind (traefik-internal VIP/LAN binding)
  ansible.builtin.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    sysctl_file: /etc/sysctl.d/60-ha-edge.conf
    reload: true
  when:
    - "'traefik-internal' in (docker_services | map(attribute='name') | list)"
  tags: [docker_services, hd17]

# Tube Archivist's Elasticsearch REQUIRES vm.max_map_count=262144 — ES startup fails with
# `max virtual memory areas vm.max_map_count [65530] is too low` otherwise. Set on the host where
# tube-archivist runs (same sysctl.d file as above).
- name: Enable vm.max_map_count (ES for Tube Archivist)
  ansible.builtin.sysctl:
    name: vm.max_map_count
    value: '262144'
    sysctl_file: /etc/sysctl.d/60-ha-edge.conf
    reload: true
  when:
    - "'tube-archivist' in (docker_services | map(attribute='name') | list)"
  tags: [docker_services, hd362]

- name: Traefik cert-pull consumer wiring (non-issuer hosts)
  # These tasks must carry a tag: `roles/*` here get no implicit role tag (see the role list in
  # home_servers.yml), so an untagged block is silently filtered out of a `--tags docker_services`
  # run that still reports clean — a drifted pull script then survives every scoped converge.
  tags: docker_services
  when:
    - scope_is_all
    - "('traefik' in (docker_services | map(attribute='name') | list)) or ('traefik-internal' in (docker_services | map(attribute='name') | list)) or ('spark-dashboard' in (docker_services | map(attribute='name') | list))"
    - not (traefik_acme_issuer | default(false))
  vars:
    # The issuer address in ONE named place, so the assert below and the rendered script cannot
    # disagree about which host is the issuer.
    cert_issuer_addr: "{{ hostvars['vps.kogler.si'].ansible_host }}"
    # Which edge the cert pull targets: the shared `traefik` dir (old default), the home-LAN edge,
    # or the spark-dashboard name edge. Defaults to the legacy shared dir.
    traefik_consumer_dir: "{{ 'traefik-internal' if 'traefik-internal' in (docker_services | map(attribute='name') | list) else ('spark-dashboard' if 'spark-dashboard' in (docker_services | map(attribute='name') | list) else 'traefik') }}"
  block:
    - name: Assert the cert issuer is a remote host (self-pull guard)
      # A consumer that pulls from itself is always a fault, never a configuration: the pull rsyncs
      # the box from itself, reports success, and lets the wildcard pair age past expiry.
      ansible.builtin.assert:
        that:
          - cert_issuer_addr | length > 0
          - cert_issuer_addr != (ansible_host | default('', true))
          - cert_issuer_addr not in [home_ip | default(''), mgmt_ip | default('')]
        fail_msg: >-
          Cert issuer resolves to {{ cert_issuer_addr }}, which is THIS host ({{ inventory_hostname }}).
          The single ACME issuer is the VPS Traefik — a consumer must never pull from itself.
        quiet: true

    - name: Generate traefik-cert-sync SSH keypair (consumer → VPS issuer pull)
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N '' -C traefik-cert-sync@{{ inventory_hostname }} -f /root/.ssh/traefik-cert-sync
        creates: /root/.ssh/traefik-cert-sync

    - name: Deploy traefik-cert-pull script
      ansible.builtin.template:
        src: traefik-cert-pull.sh.j2
        dest: /usr/local/sbin/traefik-cert-pull.sh
        mode: '0755'

    - name: Install traefik-cert-pull systemd units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop:
        - traefik-cert-pull.service
        - traefik-cert-pull.timer
      notify: reload systemd

    - name: Enable + start traefik-cert-pull timer
      ansible.builtin.systemd:
        name: traefik-cert-pull.timer
        enabled: true
        state: started

- name: VPS state push to the Storage Box (the VPS's own state has one copy on one disk)
  # Present only where db-backup runs (the VPS). The script's own guard exits 90 when the box mount is
  # down, so a dead mount is a LOUD failed unit rather than a silent copy onto the same disk.
  tags: docker_services
  when:
    - scope_is_all
    - vps_state_push_enabled | default(true) | bool
    - "'db-backup' in (docker_services | map(attribute='name') | list)"
  block:
    - name: Assert the Storage Box mount path is a real path and the dump source is named
      # Check-mode safe, plain `assert`, and NO default(): a default() lets a missing var pass the guard.
      ansible.builtin.assert:
        that:
          - vps_state_push_mount | length > 0
          - vps_state_push_dumps_src | length > 0
          - vps_state_push_mount != '/srv' and vps_state_push_mount != '/'
        fail_msg: "vps_state_push_mount = {{ vps_state_push_mount }} is unusable — the push target must be the Storage Box mountpoint, never a path on the host disk."
        quiet: true

    - name: Deploy vps-state-push script
      ansible.builtin.template:
        src: vps-state-push.sh.j2
        dest: /usr/local/sbin/vps-state-push.sh
        mode: '0755'

    - name: Install vps-state-push systemd units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop:
        - vps-state-push.service
        - vps-state-push.timer
      notify: reload systemd

    - name: Enable + start vps-state-push timer
      ansible.builtin.systemd:
        name: vps-state-push.timer
        enabled: true
        state: started

- name: Render Homepage config (post-deploy, after all services up)
  when:
    - scope_is_all
    - "'homepage' in (docker_services | map(attribute='name') | list)"
  block:
    - name: Ensure homepage config directory exists
      ansible.builtin.file:
        path: "{{ docker_compose_dir }}/homepage/config"
        state: directory
        mode: '0755'

    - name: Template homepage services.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/homepage_services.yaml.j2"
        dest: "{{ docker_compose_dir }}/homepage/config/services.yaml"
        mode: '0644'
      register: homepage_services_yaml

    - name: Template homepage widgets.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/homepage_widgets.yaml.j2"
        dest: "{{ docker_compose_dir }}/homepage/config/widgets.yaml"
        mode: '0644'
      register: homepage_widgets_yaml

    - name: Restart Homepage to pick up new config
      # This restart must be GATED: ungated with `changed_when: true` it bounces the
      # dashboard on every docker_services converge and makes the `changed` count unreadable.
      # The two templates below are the only thing a restart can pick up.
      ansible.builtin.shell:
        cmd: "docker compose -f {{ docker_compose_dir }}/homepage/docker-compose.yml restart"
      when: >-
        (homepage_services_yaml.changed | default(false))
        or (homepage_widgets_yaml.changed | default(false))
      changed_when: true
  tags: [homepage, docker_services]

