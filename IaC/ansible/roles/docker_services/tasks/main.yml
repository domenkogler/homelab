---
# docker_services role — generic Docker Compose service deployer
#
# Loops over docker_services from group_vars, creates external networks,
# copies templates, renders .j2 files with 1Password lookups, and runs
# docker compose up -d for each enabled service.
#
# Input: docker_services list (group_vars/home_servers.yml, group_vars/raspberry_pi.yml)
# Depends on: community.docker collection (requirements.yml)
# See docs/deployment-ansible.md §docker_services for spec.

- name: Assert safe execution context
  ansible.builtin.assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      docker_services role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).

# Fail-closed on secret resolution (HD-91): every compose template resolves 1Password
# secrets inline. If the op CLI or the vault is unavailable/unset, abort with a clear
# message BEFORE any render — never proceed to deploy secrets that silently failed.
# (Template lookups with an explicit `default('')` are the exception and are removed
# by HD-65/HD-91 policy — see templates/docker_services for the fail-open audit trail.)
- name: Assert 1Password secret backend is available
  ansible.builtin.assert:
    that:
      - op_vault is defined
      - op_vault | length > 0
    fail_msg: >-
      op_vault is not set (group_vars/all.yml defines `op_vault: Homelab-ansible`).
      Compose render resolves secrets from 1Password at template time; without a
      vault the render must abort loudly rather than deploy with missing secrets.
      Fix the 1Password backend before re-running.

- ansible.builtin.shell:
    cmd: command -v op || true
  register: op_bin
  changed_when: false
  check_mode: false
  become: false            # no escalation locally — play-level become:true would break the tmp-dir perms
  delegate_to: localhost   # lookups resolve on the CONTROL node — never probe the target for op (found live Phase 1, 2026-08-22)
  run_once: true

- name: Fail if 1Password CLI (op) is not on this host
  ansible.builtin.assert:
    that:
      - op_bin.stdout | trim | length > 0
    fail_msg: >-
      The 1Password CLI (op) was not found on PATH. The docker_services role
      resolves every secret via `community.general.onepassword` lookups and must
      fail closed if the CLI is missing — install 1Password CLI on the control
      host and re-run.
  tags: [docker_services]

- name: Create systemd template unit for Docker Compose services
  ansible.builtin.template:
    src: docker-compose@.service.j2
    dest: /etc/systemd/system/docker-compose@.service
    mode: '0644'
  notify: reload systemd

- name: Create external Docker networks
  community.docker.docker_network:
    name: "{{ item.name }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ item.cidr }}"
  loop: "{{ network_ranges | selectattr('name', 'in', ['traefik-public', 'services-internal', 'db-internal', 'llm-backend']) | list }}"
  tags: [docker_services, networks]

# Authentik OIDC pre-pass (HD-162) — on hosts where `authentik` is in docker_services
# (the VPS public edge). First live deploy (2026-08-22) proved the original "glue before
# the loop" order impossible: the glue needs a RUNNING authentik API, which does not
# exist before the first deploy. Correct order (HD-146 intent preserved — authentik
# still precedes every OIDC consumer):
#   1. render glue + deploy provision token      (prepass-authentik.yml)
#   2. deploy authentik (+ bundled pg/redis)     (deploy-service.yml, authentik only)
#   3. run the glue → seeds 1Password OIDC items (run-authentik-glue.yml)
#   4. deploy ALL other services                 (deploy-service.yml, authentik excluded)
# so consumers in step 4 always render with real client creds. Home hosts skip it.
- name: Authentik OIDC secret-egress pre-pass (render + token)
  ansible.builtin.include_tasks:
    file: prepass-authentik.yml
  when: "'authentik' in (docker_services | map(attribute='name') | list)"

- name: Deploy authentik FIRST (its API must be live before the glue can harvest)
  ansible.builtin.include_tasks:
    file: deploy-service.yml
  vars:
    # Dedicated loop_var (HD-185 pattern): lazy "{{ item }}" would be re-resolved by any
    # INNER loop in deploy-service.yml (e.g. extra .j2 templates) and shadow into a str.
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services | selectattr('name', 'equalto', 'authentik') | list }}"
  loop_control:
    loop_var: svc_entry
  when: svc_entry.enabled | default(true)
  tags: docker_services

- name: Apply custom blueprints one-shot (discovery never registers /blueprints/custom — HD-230)
  ansible.builtin.include_tasks:
    file: apply-authentik-blueprints.yml
  when: "'authentik' in (docker_services | map(attribute='name') | list)"

- name: Run the secret-egress glue (after authentik is up)
  ansible.builtin.include_tasks:
    file: run-authentik-glue.yml
  when: "'authentik' in (docker_services | map(attribute='name') | list)"

- name: Deploy each enabled service
  ansible.builtin.include_tasks:
    file: deploy-service.yml
  vars:
    # Dedicated loop_var (HD-185 pattern): see the authentik-first include above.
    svc: "{{ svc_entry }}"
  loop: "{{ docker_services }}"
  when:
    - svc_entry.enabled | default(true)
    - svc_entry.name != 'authentik'
  loop_control:
    label: "{{ svc_entry.name }}"
    loop_var: svc_entry
  tags: docker_services

# Disabled services get TORN DOWN (not just skipped) — otherwise a flipped-to-false
# entry leaves its containers running outside IaC control (2026-08-23: renovate was
# disabled for the missing-Forgejo-repo crash-loop and would have kept restart-looping
# forever). `compose down` on the service's project dir is idempotent: absent project
# dir -> rc 14/1 tolerated, running stack -> removed. Rendered files stay on disk.
- name: Tear down DISABLED services (enabled=false)
  ansible.builtin.shell:
    cmd: "docker compose -p {{ item.name }} -f {{ docker_compose_dir }}/{{ item.name }}/docker-compose.yml down --remove-orphans || true"
    executable: /bin/bash
  changed_when: "'Removed' in teardown.stdout or 'Stopping' in teardown.stdout"
  register: teardown
  # All services; `when` picks the disabled ones (skip-only semantics elsewhere
  # would otherwise leave flipped-to-false stacks running outside IaC control).
  loop: "{{ docker_services }}"
  when:
    - item.enabled is defined
    - not item.enabled
    - item.name != 'authentik'
  loop_control:
    label: "{{ item.name }}"
  tags: docker_services

# Traefik cert-pull consumer wiring (HD-181): non-issuer traefik hosts are cert
# CONSUMERS — they pull /opt/traefik/certs from the VPS issuer on a timer (decided
# HD-204: every consumer pulls from the VPS directly, no relay) and serve TLS from
# the DEFAULT store (dynamic/tls.yml.j2). The issuer (`traefik_acme_issuer: true`,
# group_vars/vps.yml) issues locally and skips this entirely. Today the only
# consumer host rendering the shared `traefik` template_dir is oldsrv (internal
# edge); the Pi's `traefik-ha` keeps its own equivalent puller (home_assistant role,
# ha-cert-sync). Key authorization on the VPS is a LIVE step: append the consumer's
# /root/.ssh/traefik-cert-sync.pub to the VPS ansible-admin authorized_keys
# (restricted options recommended, cf. the Pi ha-sync wrapper precedent).
- name: Traefik cert-pull consumer wiring (non-issuer hosts)
  when:
    - "'traefik' in (docker_services | map(attribute='name') | list)"
    - not (traefik_acme_issuer | default(false))
  block:
    - name: Generate traefik-cert-sync SSH keypair (consumer → VPS issuer pull)
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N '' -C traefik-cert-sync@{{ inventory_hostname }} -f /root/.ssh/traefik-cert-sync
        creates: /root/.ssh/traefik-cert-sync

    - name: Deploy traefik-cert-pull script
      ansible.builtin.template:
        src: traefik-cert-pull.sh.j2
        dest: /usr/local/sbin/traefik-cert-pull.sh
        mode: '0755'

    - name: Install traefik-cert-pull systemd units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop:
        - traefik-cert-pull.service
        - traefik-cert-pull.timer
      notify: reload systemd

    - name: Enable + start traefik-cert-pull timer
      ansible.builtin.systemd:
        name: traefik-cert-pull.timer
        enabled: true
        state: started

- name: Render Homepage config (post-deploy, after all services up)
  when: "'homepage' in (docker_services | map(attribute='name') | list)"
  block:
    - name: Ensure homepage config directory exists
      ansible.builtin.file:
        path: "{{ docker_compose_dir }}/homepage/config"
        state: directory
        mode: '0755'

    - name: Template homepage services.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/homepage_services.yaml.j2"
        dest: "{{ docker_compose_dir }}/homepage/config/services.yaml"
        mode: '0644'

    - name: Template homepage widgets.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/homepage_widgets.yaml.j2"
        dest: "{{ docker_compose_dir }}/homepage/config/widgets.yaml"
        mode: '0644'

    - name: Restart Homepage to pick up new config
      ansible.builtin.shell:
        cmd: "docker compose -f {{ docker_compose_dir }}/homepage/docker-compose.yml restart"
      changed_when: true
  tags: [homepage, docker_services]

# NOTE (Wave-3 triage 2026-08-22): the former post-deploy render of
# docs/services-inventory-generated.md lived here and NEVER ran successfully (its
# inventory.md.j2 needs all_hostvars, which only render-docs.yml builds by recording
# _docker_services across ALL docker hosts). A single-host run would have clobbered the
# multi-host doc with partial data. Canonical renderers: scripts/render_all.py (primary)
# and playbooks/render-docs.yml (site.yml final step). Do not re-add a host-local copy.