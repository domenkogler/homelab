---
# deploy-service.yml — per-service deployment tasks
# Called from main.yml in a loop over docker_services.
# Variables: svc (the current docker_services entry)

- name: "Create directory {{ docker_compose_dir }}/{{ svc.name }}"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: directory
    mode: '0755'

# Class-A fix (Wave-2 triage 2026-08-22): Docker auto-creates host bind-mount sources as
# root:root; non-root images (grafana 472, node-user images 1000, storage_uid apps) then die
# with EACCES on first boot. Services opt in via bind_owner_uid + bind_dirs on their
# docker_services entry (group_vars/vps.yml). Idempotent; no-op for services without it.
- name: "Pre-create bind dirs with image uid for {{ svc.name }} (Class-A fix)"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  ansible.builtin.file:
    path: "/srv/docker/{{ svc.name }}/{{ bind_dir }}"
    state: directory
    owner: "{{ svc.bind_owner_uid }}"
    group: "{{ svc.bind_owner_uid }}"
    mode: '0755'
  loop: "{{ svc.bind_dirs | default([], true) }}"
  loop_control:
    loop_var: bind_dir
  when: svc.bind_owner_uid is defined

- name: "Copy template files for {{ svc.name }}"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/"
    mode: '0644'
  # .j2 files are copied as-is (unrendered); overwritten with rendered versions below

- name: "Template docker-compose.yml for {{ svc.name }}"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/docker-compose.yml.j2"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/docker-compose.yml"
    mode: '0644'

- name: "Template extra .j2 files for {{ svc.name }}"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/{{ extra }}"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/{{ extra | replace('.j2', '') }}"
    mode: '0644'
  loop: "{{ _extra_templates[svc.template_dir] | default([]) }}"
  loop_control:
    label: "{{ extra | replace('.j2', '') }}"
    loop_var: extra
  # Registered for the post-up restart-on-config-change guard below. Sufficient by
  # itself: every _extra_templates entry today is a .j2 render that OVERWRITES the raw
  # copy step's unrendered file, so this task is the only place an extras change can
  # surface. If a static (non-.j2) extra is ever added, extend the guard to also watch
  # the copy step's result.
  register: extra_templates_result

# ---- First-boot guard (HD-185): home-assistant-primary bind-mount sources ----
# Render-first order (HD-204: home_assistant BEFORE docker_services on the Pi) means
# ./config/configuration.yaml, ./keepalived.conf and ./secrets.yaml must already be
# regular files when `docker compose up` first runs. If any is missing, Docker
# auto-creates it as an empty DIRECTORY at bind-mount time and HA starts mis-configured
# with no error (the exact bug HD-185 fixes) — so fail LOUD here instead, before up,
# with the remediation path. Belt-and-braces against any future role reorder.
- name: "First-boot guard: {{ svc.name }} bind-mount sources are regular files (HD-185)"
  when: svc.name == 'home-assistant-primary'
  block:
    - name: "Stat {{ svc.name }} bind-mount sources"
      ansible.builtin.stat:
        path: "{{ docker_compose_dir }}/{{ svc.name }}/{{ item }}"
      loop:
        - config/configuration.yaml   # rendered by home_assistant (render-first order)
        - keepalived.conf             # rendered by home_assistant (first-deploy copy)
        - secrets.yaml                # 1Password-rendered (renderer still pending)
      loop_control:
        loop_var: ha_src_file         # NOT `item` — shadows the outer include's lazy
                                      # `svc: "{{ item }}"` and turns svc into a string
      register: ha_primary_sources

    - name: "Assert {{ svc.name }} bind-mount sources pre-exist as regular files"
      ansible.builtin.assert:
        that:
          - ha_src_file.stat.exists
          - ha_src_file.stat.isreg
        fail_msg: >-
          {{ ha_src_file.item }} under {{ docker_compose_dir }}/{{ svc.name }}/ is missing or not a
          regular file. An empty DIRECTORY here means an earlier deploy ran `docker compose up`
          for home-assistant-primary BEFORE the home_assistant role rendered its configs —
          Docker auto-created the bind-mount source as a directory. Remediation: stop the stack
          (`docker compose down`), delete the auto-created path(s), then re-run so that
          home_assistant renders BEFORE docker_services (HD-204 render-first order). Note:
          secrets.yaml additionally requires its pending 1Password render task to land first.
  tags: ["{{ svc.name }}", home_assistant, hd185]
- name: "Validate rendered compose file for {{ svc.name }} (HD-162)"
  ansible.builtin.shell:
    cmd: "docker compose -f {{ docker_compose_dir }}/{{ svc.name }}/docker-compose.yml config --quiet"   # `compose validate` does not exist (found live Phase 1)
  when: ansible_service_mgr == 'systemd'   # docker available; catch a bad render before compose up
  tags: "{{ svc.name }}"

- name: "Docker compose up -d for {{ svc.name }}"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: present

# ---- Restart-on-config-change guard (extras are bind-mounted) ----
# `docker compose up -d` recreates containers ONLY when their SPEC changes; a changed
# bind-mounted file's CONTENT is invisible to it. Without this guard a rendered extra
# (opencloud csp.yaml HD-144, matrix tuwunel.toml, litellm config.yaml, element-web
# config.json, loki loki.yaml, prometheus scrape config + web-config basic auth) would
# sit unapplied on disk after converge until an unrelated restart picked it up.
# Exclusions:
#   * .env.j2 extras (kopia-server/agent): compose ${} INTERPOLATION source — a value
#     change alters container specs, so `up -d` above already recreated; restarting
#     again would be a pointless double bounce.
#   * traefik / traefik-ha: dynamic/*.yml land in the file-provider watch dir and
#     hot-reload in-process; a restart would only add downtime (and drop edge traffic).
# Prometheus restart is accepted deliberately: scrape-target churn costs one short gap,
# while prometheus-web-config.yml (basic auth, HD-59) is read at startup ONLY.
# First-boot safe: `up` just created the containers, so a restart finds them running;
# idempotent converges never fire it (no render change -> no restart).
- name: "Restart {{ svc.name }} stack to apply changed extra config"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  when:
    - svc.name not in ['traefik', 'traefik-ha']
    # any CHANGED non-.env extra (loop results carry .item = template filename)
    - >-
      extra_templates_result.results
      | selectattr('changed')
      | map(attribute='item') | list
      | reject('search', '\.env\.j2$') | list | length > 0
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: restarted

- name: "Enable systemd service docker-compose@{{ svc.name }} (boot auto-start)"
  # per-service tag: enables surgical runs (--tags docker_services,<service>; HD-220)
  tags: "{{ svc.name }}"
  ansible.builtin.systemd:
    name: "docker-compose@{{ svc.name }}"
    enabled: true
    state: started
  when: ansible_service_mgr == 'systemd'

# ---- Postgres role-password drift guard (2026-08-23 incident) ----
# The official postgres image applies POSTGRES_PASSWORD ONLY at first cluster init;
# rotating the 1Password db item re-renders compose envs, but the persisted cluster
# keeps the OLD role password -> app crash-loops with SASL auth failures (forgejo +
# renovate precedent, 1007/455 restarts overnight). Services opting in via db_role_sync/
# db_item/db_pg_container (group_vars/vps.yml) get their ROLE password re-synced from the SAME vault item after the stack is up. Runs every converge;
# ALTER to the identical value is a cheap server-side no-op. IaC-only by design:
# no hand-run SQL against managed DBs.
- name: "Sync postgres role password with vault ({{ svc.name }})"
  when: svc.db_role_sync | default(false)
  vars:
    _db_user: "{{ lookup('community.general.onepassword', svc.db_item, field='username', vault=op_vault) }}"
    _db_pass: "{{ lookup('community.general.onepassword', svc.db_item, field='password', vault=op_vault) }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "PGSYNC_USER={{ _db_user }}"
      - -e
      - "PGSYNC_PASS={{ _db_pass }}"
      - "{{ svc.db_pg_container }}"
      - sh
      - -c
      # NOTE: psql performs NO :var interpolation in -c mode — SQL goes via STDIN (-f -).
      # Identifier needs :"var", literal needs :'var'. ON_ERROR_STOP is MANDATORY here:
      # without it psql exits 0 even after SQL errors and the drift would persist silently
      # (live-proven 2026-08-23).
      - >-
        psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        -v syncuser="$PGSYNC_USER" -v syncpass="$PGSYNC_PASS" -f -
    stdin: 'ALTER ROLE :"syncuser" WITH PASSWORD :''syncpass'';'
  register: db_role_sync_result
  no_log: true
  changed_when: "'ALTER ROLE' in db_role_sync_result.stdout"
  failed_when: db_role_sync_result.rc != 0
  tags: "{{ svc.name }}"

# ---- Read-only analytics role ensure (HD-242) ----
# Services consuming ANOTHER stack's Postgres read-only (Metabase -> forgejo-db; zipline-db
# post-HD-112) opt in on their OWN svc entry via db_ro_sync/db_ro_item/db_pg_container. The
# target stack deploys earlier in the registry order, so its container is already up here.
# Idempotent: CREATE-if-absent, then password + SELECT-only grants re-applied EVERY converge —
# vault rotations propagate automatically (same contract as the drift guard above; IaC-only:
# no hand-run SQL against managed DBs). Grants are schema-scoped to `public` only.
- name: "Ensure read-only analytics role ({{ svc.name }})"
  when: svc.db_ro_sync | default(false)
  vars:
    _ro_user: "{{ lookup('community.general.onepassword', svc.db_ro_item, field='username', vault=op_vault) }}"
    _ro_pass: "{{ lookup('community.general.onepassword', svc.db_ro_item, field='password', vault=op_vault) }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "ROSYNC_USER={{ _ro_user }}"
      - -e
      - "ROSYNC_PASS={{ _ro_pass }}"
      - "{{ svc.db_pg_container }}"
      - sh
      - -c
      # NOTE: psql performs NO :var interpolation in -c mode — SQL goes via STDIN (-f -).
      # Identifier needs :"var", literal needs :'var'. ON_ERROR_STOP is MANDATORY here
      # (same live-proven reason as the drift guard above).
      - >-
        psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        -v rouser="$ROSYNC_USER" -v ropass="$ROSYNC_PASS" -f -
    # stdin is a MODULE argument and must live INSIDE the action block — placed beside it,
    # the task parser reads two conflicting action statements (live-found HD-240 ride-along).
    stdin: |
      SELECT format('CREATE ROLE %I LOGIN', :'rouser')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'rouser')\gexec
      ALTER ROLE :"rouser" WITH LOGIN PASSWORD :'ropass';
      GRANT USAGE ON SCHEMA public TO :"rouser";
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO :"rouser";
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO :"rouser";
  register: db_ro_sync_result
  no_log: true
  changed_when: "'ALTER ROLE' in db_ro_sync_result.stdout or 'CREATE ROLE' in db_ro_sync_result.stdout"
  failed_when: db_ro_sync_result.rc != 0
  tags: "{{ svc.name }}"

# ---- Forgejo app.ini DB-password drift guard (HD-220) ----
# The one-time wizard (deployment-manual §1.7) bakes the DB password into
# /data/gitea/conf/app.ini, and gitea/forgejo gives ini values precedence over
# FORGEJO__* envs — so vault rotations never reached the running app (live-proven
# 2026-08-23: env + cluster role both carried the NEW value while the app kept
# SASL-failing on the STALE ini password for hours). Re-sync [database] PASSWD from
# the SAME vault item post-up and restart on change.
- name: "Sync forgejo app.ini DB password with vault"
  when: svc.name == 'forgejo'
  vars:
    _ini_db_pass: "{{ lookup('community.general.onepassword', svc.db_item, field='password', vault=op_vault) }}"
  # Section-scoped ini_file is the CORRECT writer here (2026-08-23 lesson: an interim
  # lineinfile attempt with a bare ^PASSWD regexp failed to match and APPENDED a second
  # PASSWD at EOF - gitea reads the first occurrence under [database], so the stale original
  # kept winning. ini_file itself was never wrong; the earlier 'false-negative' was a bad
  # comparison against a stale container env.)
  community.general.ini_file:
    path: /srv/docker/forgejo/data/gitea/conf/app.ini
    section: database
    option: PASSWD
    value: "{{ _ini_db_pass }}"
    mode: '0600'
    backup: true
  no_log: true
  register: forgejo_ini_sync
  tags: "{{ svc.name }}"

- name: "Restart forgejo after app.ini password sync"
  when:
    - svc.name == 'forgejo'
    - forgejo_ini_sync is defined and forgejo_ini_sync.changed
  ansible.builtin.command:
    cmd: docker restart forgejo
  changed_when: true
  tags: "{{ svc.name }}"

# ---- Forgejo native-OIDC source registration (HD-230; design HD-148) ----
# The Authentik side (provider_forgejo + app_forgejo in ks-oidc.yml, client creds
# seeded to vault item forgejo_oidc by the glue) has existed since HD-148. This task
# registers the CONSUMER side — the OAuth2 authentication source inside Forgejo —
# idempotently via the admin CLI (NOT env-injectable). Authentication Name MUST stay
# `authentik`: ks-oidc.yml accepts any callback under /user/oauth2/.* but docs and
# owner runbook reference this name.
- name: "Register Authentik OIDC source in Forgejo (HD-230)"
  when: svc.name == 'forgejo'
  vars:
    _oidc_id: "{{ lookup('community.general.onepassword', 'forgejo_oidc', field='username', vault=op_vault) }}"
    _oidc_secret: "{{ lookup('community.general.onepassword', 'forgejo_oidc', field='credential', vault=op_vault) }}"
  ansible.builtin.shell:
    cmd: |
      # Verified live against this Forgejo build (HD-230): provider key is
      # `openidConnect` (NOT `oidc`), no --active/--use-auto-discovery-url flags exist,
      # deletion is `admin auth delete --id N`. Scopes repeated (--scopes is a slice).
      if docker exec -u git forgejo gitea admin auth list 2>/dev/null | grep -qw authentik; then
        echo "PRESENT"
      else
        docker exec -u git forgejo gitea admin auth add-oauth \
          --name authentik \
          --provider openidConnect \
          --key "$OIDC_ID" \
          --secret "$OIDC_SECRET" \
          --auto-discover-url https://sso.kogler.si/application/o/forgejo/.well-known/openid-configuration \
          --scopes openid --scopes profile --scopes email && echo "ADDED"
      fi
    executable: /bin/bash
  environment:
    OIDC_ID: "{{ _oidc_id }}"
    OIDC_SECRET: "{{ _oidc_secret }}"
  no_log: true
  changed_when: "(forgejo_oauth_src.stdout | default('')) is search('ADDED')"
  register: forgejo_oauth_src
  tags: "{{ svc.name }}"

# ---- Authentik secret-egress glue (HD-143) moved to prepass-authentik.yml (HD-162) ----
# The glue is no longer a per-loop side-iteration on the `authentik` entry. It now runs
# once in the explicit pre-pass (tasks/prepass-authentik.yml) BEFORE the deploy loop,
# seeding 1Password ahead of the OIDC-consumer renders — see deployment-compose.md ordering.
# ---- LiteLLM virtual-key bootstrap glue (HD-247) ----
# Renders + runs litellm-bootstrap-keys.sh DURING the litellm service pass: the registry
# order in vps.yml guarantees litellm deploys BEFORE its key consumers (open-webui,
# openclaw), so their compose renders find seeded vault items — same ordering contract as
# prepass-authentik.yml for OIDC items (authentik precedes consumers, HD-146).
# The script is idempotent VAULT-FIRST: empty item -> mint POST /key/generate and store
# the sk; non-empty -> live-probe the stored sk and ABORT loudly on 401 (stale secret —
# sks are hashed at rest server-side and can never be re-read). Values never echoed;
# everything runs no_log. Requires the host-side write-scoped op SA token deployed by
# prepass-authentik.yml (/etc/op/provision-token) for the 1Password writes.
- name: "Render LiteLLM bootstrap-keys glue ({{ svc.name }})"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.template:
    src: litellm-bootstrap-keys.sh.j2   # role templates/ dir
    dest: /usr/local/sbin/litellm-bootstrap-keys.sh
    mode: '0755'
  tags: "{{ svc.name }}"

- name: "Run LiteLLM bootstrap-keys glue ({{ svc.name }})"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.shell:
    cmd: |
      if [ -r /etc/op/provision-token ]; then
        export OP_SERVICE_ACCOUNT_TOKEN="$(cat /etc/op/provision-token)"
      fi
      exec /usr/local/sbin/litellm-bootstrap-keys.sh
    executable: /bin/bash
  register: lk_glue
  until: lk_glue.rc == 0            # rc 3 = stack not ready / transient upstream
  retries: 12
  delay: 10
  changed_when: "'created' in (lk_glue.stdout | default(''))"
  failed_when: lk_glue.rc != 0      # rc 2 stale-secret / rc 4 alias conflict abort loudly
  no_log: true
  tags: "{{ svc.name }}"
