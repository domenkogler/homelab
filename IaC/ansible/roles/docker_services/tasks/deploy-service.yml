---
# deploy-service.yml — per-service deployment tasks
# Called from main.yml in a loop over docker_services.
# Variables: svc (the current docker_services entry)

- name: "Create directory {{ docker_compose_dir }}/{{ svc.name }}"
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: directory
    mode: '0755'

- name: "Copy template files for {{ svc.name }}"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/"
    mode: '0644'
  # .j2 files are copied as-is (unrendered); overwritten with rendered versions below

- name: "Template docker-compose.yml for {{ svc.name }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/docker-compose.yml.j2"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/docker-compose.yml"
    mode: '0644'

- name: "Template extra .j2 files for {{ svc.name }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/{{ extra }}"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/{{ extra | replace('.j2', '') }}"
    mode: '0644'
  loop: "{{ _extra_templates[svc.template_dir] | default([]) }}"
  loop_control:
    label: "{{ extra | replace('.j2', '') }}"
    loop_var: extra

# ---- First-boot guard (HD-185): home-assistant-primary bind-mount sources ----
# Render-first order (HD-204: home_assistant BEFORE docker_services on the Pi) means
# ./config/configuration.yaml, ./keepalived.conf and ./secrets.yaml must already be
# regular files when `docker compose up` first runs. If any is missing, Docker
# auto-creates it as an empty DIRECTORY at bind-mount time and HA starts mis-configured
# with no error (the exact bug HD-185 fixes) — so fail LOUD here instead, before up,
# with the remediation path. Belt-and-braces against any future role reorder.
- name: "First-boot guard: {{ svc.name }} bind-mount sources are regular files (HD-185)"
  when: svc.name == 'home-assistant-primary'
  block:
    - name: "Stat {{ svc.name }} bind-mount sources"
      ansible.builtin.stat:
        path: "{{ docker_compose_dir }}/{{ svc.name }}/{{ item }}"
      loop:
        - config/configuration.yaml   # rendered by home_assistant (render-first order)
        - keepalived.conf             # rendered by home_assistant (first-deploy copy)
        - secrets.yaml                # 1Password-rendered (renderer still pending)
      loop_control:
        loop_var: ha_src_file         # NOT `item` — shadows the outer include's lazy
                                      # `svc: "{{ item }}"` and turns svc into a string
      register: ha_primary_sources

    - name: "Assert {{ svc.name }} bind-mount sources pre-exist as regular files"
      ansible.builtin.assert:
        that:
          - ha_src_file.stat.exists
          - ha_src_file.stat.isreg
        fail_msg: >-
          {{ ha_src_file.item }} under {{ docker_compose_dir }}/{{ svc.name }}/ is missing or not a
          regular file. An empty DIRECTORY here means an earlier deploy ran `docker compose up`
          for home-assistant-primary BEFORE the home_assistant role rendered its configs —
          Docker auto-created the bind-mount source as a directory. Remediation: stop the stack
          (`docker compose down`), delete the auto-created path(s), then re-run so that
          home_assistant renders BEFORE docker_services (HD-204 render-first order). Note:
          secrets.yaml additionally requires its pending 1Password render task to land first.
  tags: [home_assistant, hd185]
- name: "Validate rendered compose file for {{ svc.name }} (HD-162)"
  ansible.builtin.shell:
    cmd: "docker compose -f {{ docker_compose_dir }}/{{ svc.name }}/docker-compose.yml config --quiet"   # `compose validate` does not exist (found live Phase 1)
  when: ansible_service_mgr == 'systemd'   # docker available; catch a bad render before compose up
  tags: "{{ svc.name }}"

- name: "Docker compose up -d for {{ svc.name }}"
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: present


- name: "Enable systemd service docker-compose@{{ svc.name }} (boot auto-start)"
  ansible.builtin.systemd:
    name: "docker-compose@{{ svc.name }}"
    enabled: true
    state: started
  when: ansible_service_mgr == 'systemd'

# ---- Authentik secret-egress glue (HD-143) moved to prepass-authentik.yml (HD-162) ----
# The glue is no longer a per-loop side-iteration on the `authentik` entry. It now runs
# once in the explicit pre-pass (tasks/prepass-authentik.yml) BEFORE the deploy loop,
# seeding 1Password ahead of the OIDC-consumer renders — see deployment-compose.md ordering.