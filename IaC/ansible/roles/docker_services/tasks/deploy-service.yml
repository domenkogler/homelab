---
# deploy-service.yml — per-service deployment tasks
# Called from main.yml in a loop over docker_services.
# Variables: svc (the current docker_services entry)
# Tag semantics: the include lines in tasks/main.yml carry `tags: docker_services`, which every task here
# inherits, so `--tags docker_services,<svc>` selects the UNION of both tags and is NOT surgical. The
# per-service tag narrows the task list; `docker_services_scope` (role defaults) restricts the run.

- name: "Create directory {{ docker_compose_dir }}/{{ svc.name }}"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: directory
    mode: '0755'

# Docker auto-creates host bind-mount sources as root:root, so non-root images (grafana 472, node-user
# images 1000, storage_uid apps) die with EACCES on first boot. Services opt in via bind_owner_uid +
# bind_dirs on their docker_services entry (group_vars/vps.yml). No-op for services without it.
- name: "Pre-create bind dirs with image uid for {{ svc.name }} (Class-A fix)"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.file:
    path: "/srv/docker/{{ svc.name }}/{{ bind_dir }}"
    state: directory
    owner: "{{ svc.bind_owner_uid }}"
    group: "{{ svc.bind_owner_uid }}"
    mode: '0755'
  loop: "{{ svc.bind_dirs | default([], true) }}"
  loop_control:
    loop_var: bind_dir
  when: svc.bind_owner_uid is defined

- name: "Create model dir for {{ svc.name }}"
  # Parent dir for the model fetch below - get_url does not create parents.
  tags: "{{ svc.name }}"
  ansible.builtin.file:
    path: "{{ svc.model_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: svc.model_url is defined

- name: "Fetch + verify model for {{ svc.name }}"
  # Model-fetch hook (opt-in): the pinned-AI legs mount their weights :ro, so the container must find them
  # on FIRST boot. `get_url` + `checksum` is idempotent BY CONTENT: a matching digest is an ok-not-changed
  # no-op, a missing/truncated file is re-fetched, a DIGEST MISMATCH FAILS THE CONVERGE instead of booting
  # an engine on a half-written model. Weights are public artifacts: never in git, never in the vault. Root
  # 0755 dirs / 0644 files because the mount is read-only — containers read weights, never write them.
  # Deliberately NO default() on the digest (fail-loud): an entry that sets model_url without model_sha256
  # aborts the render rather than fetching unverifiable bytes.
  # Opt-in shape: { model_url, model_dir, model_file, model_sha256 } on the registry entry.
  tags: "{{ svc.name }}"
  ansible.builtin.get_url:
    url: "{{ svc.model_url }}"
    dest: "{{ svc.model_dir }}/{{ svc.model_file }}"
    checksum: "sha256:{{ svc.model_sha256 }}"
    owner: root
    group: root
    mode: '0644'
    timeout: 120
  when: svc.model_url is defined

- name: "Copy template files for {{ svc.name }}"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/"
    mode: '0644'
  # .j2 files are copied unrendered; the template tasks below overwrite them

- name: "Template docker-compose.yml for {{ svc.name }}"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/docker-compose.yml.j2"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/docker-compose.yml"
    mode: '0644'

- name: "Stat extra-template dest paths for {{ svc.name }}"
  # The removal below must be a TYPE TEST, not a guess. `state: absent` does not care whether the path is a
  # directory or the regular file the previous converge rendered, so an untyped removal deletes the rendered
  # extra on EVERY converge, the template task recreates it (`changed`), and the restart-on-config-change
  # guard at the bottom of this file bounces a healthy service forever with `failed=0`. Stat first; only a
  # DIRECTORY is a stub.
  tags: "{{ svc.name }}"
  ansible.builtin.stat:
    path: "{{ docker_compose_dir }}/{{ svc.name }}/{{ extra | replace('.j2', '') }}"
  loop: "{{ _extra_templates[svc.template_dir] | default([]) }}"
  loop_control:
    label: "{{ extra | replace('.j2', '') }}"
    loop_var: extra
  register: extra_dest_stat
  changed_when: false

- name: "Remove stub DIRS at extra-template dest paths for {{ svc.name }}"
  # When a service bind-mounts a source file from the template dir (e.g. ./serve.json:/config/serve.json:ro)
  # and that file does not exist yet, `docker compose up` auto-creates the source as an EMPTY DIRECTORY, and
  # the template task then refuses to overwrite a directory at dest. Pre-remove the stub so the render lands
  # as a regular file — and ONLY a directory stub: a regular file is the previous render, and deleting it is
  # what makes every converge non-idempotent.
  tags: "{{ svc.name }}"
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ extra_dest_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default(item) | replace('.j2', '') }}"
  when: item.stat.isdir | default(false)

- name: "Template extra .j2 files for {{ svc.name }}"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/docker_services/{{ svc.template_dir }}/{{ extra }}"
    dest: "{{ docker_compose_dir }}/{{ svc.name }}/{{ extra | replace('.j2', '') }}"
    # Default is a plain world-readable config. An extra that renders secret VALUES opts out with
    # `extra_config_mode`, and then the OWNER must move with the mode: a 0600 root-owned file is unreadable
    # by a container that dropped its privileges, so mode without owner is a crash loop and not a hardening.
    # `extra_config_owner_uid` is the uid that container runs as and, like `bind_owner_uid`, sets owner and
    # group together. The app-owned-ini precedent is sabnzbd's 0600 media:media ini.
    mode: "{{ svc.extra_config_mode | default('0644') }}"
    owner: "{{ svc.extra_config_owner_uid | default(omit) }}"
    group: "{{ svc.extra_config_owner_uid | default(omit) }}"
  loop: "{{ _extra_templates[svc.template_dir] | default([]) }}"
  loop_control:
    label: "{{ extra | replace('.j2', '') }}"
    loop_var: extra
  # Registered for the post-up restart-on-config-change guard below. Sufficient by itself: every
  # _extra_templates entry is a .j2 render that OVERWRITES the raw copy step's unrendered file, so this is
  # the only place an extras change can surface. If a static (non-.j2) extra is ever added, extend the guard
  # to also watch the copy step's result.
  register: extra_templates_result

# ---- Retired deploy artifacts (opt-in: `retired_artifacts` on the registry entry) ----
# "Copy template files" copies the template DIR and never deletes, so a file this service stopped
# rendering survives every converge beside the one that IS bind-mounted — an artifact that reads like
# live config and is not. Removal belongs here rather than on the host, and `state: absent` on an
# already-gone path is `ok`, so it costs one skipped loop and never makes a later converge `changed`.
- name: "Remove retired deploy artifacts for {{ svc.name }}"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/{{ svc.name }}/{{ retired_artifact }}"
    state: absent
  loop: "{{ svc.retired_artifacts | default([], true) }}"
  loop_control:
    label: "{{ retired_artifact }}"
  when: svc.retired_artifacts is defined

# ---- First-boot guard: home-assistant-primary bind-mount sources ----
# Render-first order (home_assistant BEFORE docker_services on the Pi) means ./config/configuration.yaml,
# keepalived.conf and secrets.yaml must already be regular files when `docker compose up` first runs. If one
# is missing, Docker auto-creates it as an empty DIRECTORY at bind-mount time and HA starts mis-configured
# with no error — so fail LOUD here, before up, with the remediation path. Belt-and-braces against any
# future role reorder.
- name: "First-boot guard: {{ svc.name }} bind-mount sources are regular files"
  when: svc.name == 'home-assistant-primary'
  block:
    - name: "Stat {{ svc.name }} bind-mount sources"
      ansible.builtin.stat:
        path: "{{ docker_compose_dir }}/{{ svc.name }}/{{ ha_src_file }}"
      loop:
        - config/configuration.yaml   # rendered by home_assistant (render-first order)
        - keepalived.conf             # rendered by home_assistant (first-deploy copy)
        - secrets.yaml                # 1Password-rendered (home_assistant role)
      loop_control:
        loop_var: ha_src_file         # NOT `item` — it would shadow the outer include's lazy
                                      # `svc: "{{ item }}"` and turn svc into a string
      register: ha_primary_sources

    - name: "Assert {{ svc.name }} bind-mount sources pre-exist as regular files"
      ansible.builtin.assert:
        that:
          - ha_primary_sources.results | selectattr('stat.exists', 'equalto', true) | list | length == 3
        fail_msg: >-
          {{ ha_primary_sources.results | map(attribute='ha_src_file') | join(', ') }} bind-mount source(s) under
          {{ docker_compose_dir }}/{{ svc.name }}/ are missing or not regular files. An empty DIRECTORY
          here means an earlier deploy ran `docker compose up`
          for home-assistant-primary BEFORE the home_assistant role rendered its configs —
          Docker auto-created the bind-mount source as a directory. Remediation: stop the stack
          (`docker compose down`), delete the auto-created path(s), then re-run so that
          home_assistant renders BEFORE docker_services (render-first order).
  tags: ["{{ svc.name }}", home_assistant, hd185]
- name: "Validate rendered compose file for {{ svc.name }}"
  ansible.builtin.shell:
    cmd: "docker compose -f {{ docker_compose_dir }}/{{ svc.name }}/docker-compose.yml config --quiet"   # there is no `compose validate` subcommand
  # `docker compose config --quiet` only PARSES the render and mutates nothing, but a bare shell task reports
  # `changed` unconditionally, so every service showed a phantom change on an otherwise clean converge. Keep
  # the assertion (rc != 0 still fails the run) and stop the lie.
  changed_when: false
  when: ansible_facts['service_mgr'] == 'systemd'   # docker present; catch a bad render before compose up
  tags: "{{ svc.name }}"

- name: "Docker compose up -d for {{ svc.name }}"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: present

# ---- Restart-on-config-change guard (extras are bind-mounted) ----
# `docker compose up -d` recreates containers only when their SPEC changes — a changed bind-mounted file's
# CONTENT is invisible to it, so a rendered extra (opencloud csp.yaml, matrix tuwunel.toml, litellm
# config.yaml, element-web config.json) would sit unapplied until an unrelated restart picked it up. First
# boot is safe (`up` just created the containers); an idempotent converge never fires this task.
- name: "Restart {{ svc.name }} stack to apply changed extra config"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  when:
    - svc.name not in ['traefik', 'traefik-ha', 'traefik-tailnet', 'spark-dashboard', 'traefik-internal']
      # EXCLUDED because a restart there applies nothing and buys only downtime: every file-provider Traefik
      # edge hot-reloads its dynamic/*.yml in-process (`--providers.file.watch=true`), spark-dashboard is
      # also spark's `llm.kogler.si` name edge so a bounce is a 502 window on the inference path, and
      # traefik-tailnet's `tailscale-sidecar` sibling makes `docker compose restart` flaky ('cannot join
      # network namespace of a non running container'). A file-provider edge added to the registry WITHOUT
      # adding it here restarts a healthy stack on every converge.
      # → docs/deployment-compose.md §Extra Config Templates — render + restart-on-change
    # The extra .j2 loop uses `loop_var: extra`, so the registered loop results carry the key `extra` (the
    # template filename) — NOT `item`; `map(attribute='item')` raises "object of type 'dict' has no attribute
    # 'item'" and the restart silently never runs. `default([])` covers a skipped task / no extras. .env.j2 is
    # excluded because compose interpolates it into the container spec, so `up -d` above already recreated.
    - >-
      (extra_templates_result.results | default([]))
      | selectattr('changed')
      | map(attribute='extra') | list
      | reject('search', '\.env\.j2$') | list | length > 0
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/{{ svc.name }}"
    state: restarted

# ---- Reachability verdict (what `up -d` cannot tell you) ----
# `docker compose up -d` exits 0 on a stack whose containers are uncreated (a netns-sharing
# sibling of a failed dependency), unbound (published host address not on the host yet) or
# `running` with no network endpoint at all — in the last shape `docker ps` even says
# `Up (healthy)` while every consumer fails on `lookup <svc>: no such host`. The same wrapper
# the boot unit runs re-reads the verdict here, so neither path can report green on a service
# nobody can reach. ⚠ A crash-looping container reads BAD for the same reason — by design.
# → docs/deployment-compose.md §Boot auto-start (docker-compose@)
- name: "Verify {{ svc.name }} containers are attached to their networks"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.command:
    cmd: /usr/local/sbin/docker-compose-ensure --verify-only {{ docker_compose_dir }}/{{ svc.name }}
  changed_when: false
  when: ansible_facts['service_mgr'] == 'systemd'

- name: "Enable systemd service docker-compose@{{ svc.name }} (boot auto-start)"
  # per-service tag: lets --tags select this service's tasks (tag semantics at the top of this file)
  tags: "{{ svc.name }}"
  ansible.builtin.systemd:
    name: "docker-compose@{{ svc.name }}"
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] == 'systemd'

# ---- Postgres role-password drift guard ----
# POSTGRES_PASSWORD is applied only at first cluster init, so a vault rotation leaves the persisted cluster on
# the OLD role password and the app crash-loops on SASL. Decide drift from the role's own `COMMENT ON ROLE`
# marker: a login probe cannot fail here (these clusters answer 127.0.0.1/32 with `trust`, initdb's default
# line, and the bridge IP has no pg_hba entry), and an unconditional ALTER reports `changed` on every host.
# ⚠ A hand-run `ALTER ROLE` is out of band and is NOT repaired — rotate in vault, or clear the marker.
# IaC-only: no hand-run SQL against managed DBs. → docs/deployment-ansible.md §docker_services entry fields
- name: "Read the postgres role sync marker ({{ svc.name }})"
  when: svc.db_role_sync | default(false)
  vars:
    _probe_user: "{{ vault[svc.db_item].username }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "PGSYNC_USER={{ _probe_user }}"
      - "{{ svc.db_pg_container }}"
      - sh
      - -c
      # -tA (tuples-only, unaligned) is NOT cosmetic: psql's aligned output begins with the column header
      # ` coalesce `, and comparing the header instead of the marker re-runs the ALTER on every converge.
      - >-
        psql -v ON_ERROR_STOP=1 -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        -v syncuser="$PGSYNC_USER" -f -
    stdin: >-
      SELECT coalesce(shobj_description(oid, 'pg_authid'), '')
      FROM pg_roles WHERE rolname = :'syncuser';
  register: db_role_marker_state
  changed_when: false
  check_mode: false        # a probe, not a mutation — --check must still be able to judge
  failed_when: db_role_marker_state.rc != 0
  no_log: true
  tags: "{{ svc.name }}"

- name: "Decide whether the postgres role password actually needs re-syncing ({{ svc.name }})"
  when: svc.db_role_sync | default(false)
  vars:
    _db_pass_now: "{{ vault[svc.db_item].password }}"
  ansible.builtin.set_fact:
    db_role_marker_desired: "pgsync:{{ _db_pass_now | hash('sha256') }}"
    db_role_needs_sync: >-
      {{ (db_role_marker_state.stdout | trim)
         != 'pgsync:' ~ (_db_pass_now | hash('sha256')) }}
  no_log: true
  tags: "{{ svc.name }}"

- name: "Sync postgres role password with vault ({{ svc.name }})"
  when:
    - svc.db_role_sync | default(false)
    - db_role_needs_sync | default(true) | bool
  vars:
    # Read the bulk `vault` dict (built ONCE per converge by fetch-vault-pass.yml), NOT a per-task
    # onepassword lookup: each lookup is an `op` spawn (~2.6s per db_role_sync service). Same fail-closed
    # contract — the item is in the derive set via its owning template_dir in _template_vault_items.
    _db_user: "{{ vault[svc.db_item].username }}"
    _db_pass: "{{ vault[svc.db_item].password }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "PGSYNC_USER={{ _db_user }}"
      - -e
      - "PGSYNC_PASS={{ _db_pass }}"
      - -e
      # The fingerprint the probe compares against, written in the SAME transaction as the ALTER.
      # A hash of the secret, never the secret (CONVENTIONS §6).
      - "PGSYNC_MARKER={{ db_role_marker_desired }}"
      - "{{ svc.db_pg_container }}"
      - sh
      - -c
      # psql performs NO :var interpolation in -c mode — SQL goes via STDIN (-f -). Identifier needs
      # :"var", literal needs :'var'. ON_ERROR_STOP is MANDATORY: without it psql exits 0 after SQL errors
      # and the drift persists silently.
      # `-1` (single transaction) is load-bearing: without it psql autocommits the ALTER, so a failing
      # COMMENT leaves the password written and the marker stale — the same correct password then
      # re-syncs forever, which is the noise this shape exists to kill.
      - >-
        psql -v ON_ERROR_STOP=1 -1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        -v syncuser="$PGSYNC_USER" -v syncpass="$PGSYNC_PASS"
        -v syncmarker="$PGSYNC_MARKER" -f -
    stdin: |-
      ALTER ROLE :"syncuser" WITH PASSWORD :'syncpass';
      COMMENT ON ROLE :"syncuser" IS :'syncmarker';
  register: db_role_sync_result
  no_log: true
  changed_when: "'ALTER ROLE' in db_role_sync_result.stdout"
  failed_when: db_role_sync_result.rc != 0
  tags: "{{ svc.name }}"

# ---- Read-only analytics role ensure ----
# Consumers of ANOTHER stack's Postgres read-only opt in via db_ro_sync/db_ro_item/db_pg_container on their
# own svc entry; the target stack deploys earlier in registry order so its container is already up. Grants are
# re-applied EVERY converge, so vault rotations propagate automatically (same contract as the guard above;
# IaC-only), and they are schema-scoped to `public` only.
- name: "Ensure read-only analytics role ({{ svc.name }})"
  when: svc.db_ro_sync | default(false)
  vars:
    # Read the bulk `vault` dict (single fetch per converge), not a per-task lookup.
    _ro_user: "{{ vault[svc.db_ro_item].username }}"
    _ro_pass: "{{ vault[svc.db_ro_item].password }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - "ROSYNC_USER={{ _ro_user }}"
      - -e
      - "ROSYNC_PASS={{ _ro_pass }}"
      - "{{ svc.db_pg_container }}"
      - sh
      - -c
      # psql performs NO :var interpolation in -c mode — SQL goes via STDIN (-f -). Identifier needs
      # :"var", literal needs :'var'. ON_ERROR_STOP is MANDATORY (same reason as the guard above).
      - >-
        psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        -v rouser="$ROSYNC_USER" -v ropass="$ROSYNC_PASS" -f -
    # stdin is a MODULE argument and must live INSIDE the action block — beside it, the task parser reads
    # two conflicting action statements.
    stdin: |
      SELECT format('CREATE ROLE %I LOGIN', :'rouser')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'rouser')\gexec
      ALTER ROLE :"rouser" WITH LOGIN PASSWORD :'ropass';
      GRANT USAGE ON SCHEMA public TO :"rouser";
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO :"rouser";
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO :"rouser";
  register: db_ro_sync_result
  no_log: true
  changed_when: "'ALTER ROLE' in db_ro_sync_result.stdout or 'CREATE ROLE' in db_ro_sync_result.stdout"
  failed_when: db_ro_sync_result.rc != 0
  tags: "{{ svc.name }}"

# ---- Forgejo app.ini DB-password drift guard ----
# The one-time wizard (deployment-manual §1.7) bakes the DB password into /data/gitea/conf/app.ini and
# gitea/forgejo give ini values precedence over FORGEJO__* envs, so vault rotations never reach the running
# app. Re-sync [database] PASSWD from the SAME vault item post-up and restart on change.
- name: "Sync forgejo app.ini DB password with vault"
  when: svc.name == 'forgejo'
  vars:
    # Read the bulk `vault` dict (single fetch per converge), not a per-task lookup.
    _ini_db_pass: "{{ vault[svc.db_item].password }}"
  # Section-scoped ini_file is the CORRECT writer: a lineinfile with a bare ^PASSWD regexp fails to match and
  # APPENDS a second PASSWD at EOF, and gitea reads the FIRST occurrence under [database] — so the stale
  # original keeps winning while every check looks green.
  community.general.ini_file:
    path: /srv/docker/forgejo/data/gitea/conf/app.ini
    section: database
    option: PASSWD
    value: "{{ _ini_db_pass }}"
    mode: '0600'
    backup: true
  no_log: true
  register: forgejo_ini_sync
  tags: "{{ svc.name }}"

- name: "Restart forgejo after app.ini password sync"
  when:
    - svc.name == 'forgejo'
    - forgejo_ini_sync is defined and forgejo_ini_sync.changed
  ansible.builtin.command:
    cmd: docker restart forgejo
  changed_when: true
  tags: "{{ svc.name }}"

# ---- Forgejo native-OIDC source registration ----
# Registers the CONSUMER side — the OAuth2 authentication source inside Forgejo — idempotently via the admin
# CLI (it is not env-injectable). The Authentik side lives in ks-oidc.yml with creds in the `forgejo_oidc`
# item. Authentication Name MUST stay `authentik`: ks-oidc.yml accepts any callback under /user/oauth2/.* but
# the docs and the owner runbook reference this name.
- name: "Register Authentik OIDC source in Forgejo"
  when: svc.name == 'forgejo'
  vars:
    _oidc_id: "{{ lookup('community.general.onepassword', 'forgejo_oidc', field='username', vault=op_vault) }}"
    _oidc_secret: "{{ lookup('community.general.onepassword', 'forgejo_oidc', field='credential', vault=op_vault) }}"
  ansible.builtin.shell:
    cmd: |
      # Provider key is
      # `openidConnect` (NOT `oidc`), no --active/--use-auto-discovery-url flags exist,
      # deletion is `admin auth delete --id N`. Scopes repeated (--scopes is a slice).
      if docker exec -u git forgejo gitea admin auth list 2>/dev/null | grep -qw authentik; then
        echo "PRESENT"
      else
        docker exec -u git forgejo gitea admin auth add-oauth \
          --name authentik \
          --provider openidConnect \
          --key "$OIDC_ID" \
          --secret "$OIDC_SECRET" \
          --auto-discover-url https://sso.kogler.si/application/o/forgejo/.well-known/openid-configuration \
          --scopes openid --scopes profile --scopes email && echo "ADDED"
      fi
    executable: /bin/bash
  environment:
    OIDC_ID: "{{ _oidc_id }}"
    OIDC_SECRET: "{{ _oidc_secret }}"
  no_log: true
  changed_when: "(forgejo_oauth_src.stdout | default('')) is search('ADDED')"
  register: forgejo_oauth_src
  tags: "{{ svc.name }}"

# ---- Authentik secret-egress glue ----
# Lives in tasks/prepass-authentik.yml, not here: it runs ONCE in the explicit pre-pass BEFORE the deploy
# loop, seeding 1Password ahead of the OIDC-consumer renders — see deployment-compose.md ordering.
# ---- LiteLLM virtual-key bootstrap glue ----
# Renders + runs litellm-bootstrap-keys.sh DURING the litellm service pass. The registry order in vps.yml
# guarantees litellm deploys BEFORE its key consumers (open-webui, openclaw), so their compose renders find
# seeded vault items — the same ordering contract as prepass-authentik.yml (authentik precedes consumers).
# The script is idempotent VAULT-FIRST: an empty item mints via POST /key/generate and stores the sk; a
# non-empty item is live-probed and ABORTS loudly on 401 (sks are hashed at rest and can never be re-read).
# Nothing is echoed and everything runs no_log. It needs the host-side write-scoped op token at
# /etc/op/provision-token for the 1Password writes.
# ---- Host-side op prerequisites for the glue ----
# The glue does its 1Password writes ON THE HOST (op CLI + a write-scoped token must live there). The VPS gets
# both from the authentik pre-pass; home hosts NEVER run that pre-pass, so a bootstrap_keys host would render
# the glue and then fail "op: command not found". Deploy the op CLI (apt repo, bootstrap-runner.sh precedent)
# and the write-scoped token (item `op-write_api`, never in Git) on the service pass, idempotent.
- name: "Ensure host-side op CLI ({{ svc.name }} bootstrap_keys)"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.shell: |
    set -e
    curl -sS https://downloads.1password.com/linux/keys/1password.asc \
      | gpg --yes --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/$(dpkg --print-architecture) stable main" \
      > /etc/apt/sources.list.d/1password.list
    mkdir -p /etc/debsig/policies/AC2D62742012EA22
    curl -sS https://downloads.1password.com/linux/debian/debsig/1password.pol \
      > /etc/debsig/policies/AC2D62742012EA22/1password.pol
    apt-get update -qq
    DEBIAN_FRONTEND=noninteractive apt-get install -y -qq 1password-cli
    command -v op
  args:
    creates: /usr/bin/op
  tags: "{{ svc.name }}"

- name: "Ensure /etc/op exists ({{ svc.name }} bootstrap_keys — VPS-only from post_install)"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.file:
    path: /etc/op
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags: "{{ svc.name }}"

- name: "Deploy provision token for host-side op ({{ svc.name }} bootstrap_keys)"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.copy:
    content: "{{ lookup('community.general.onepassword', 'op-write_api', field='credential', vault=op_vault) }}\n"
    dest: /etc/op/provision-token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  tags: "{{ svc.name }}"

# The twin at op-provision-token.yml probes VALIDITY after writing; a leg that only writes the file lets a
# revoked token read as a healthy host-side provisioner. Existence is not validity — one read-only list call
# is the difference between a failed task and eight green converges that wrote nothing.
- name: "Probe the bootstrap-keys provision token is accepted ({{ svc.name }})"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.shell:
    cmd: |
      set -eu
      export OP_SERVICE_ACCOUNT_TOKEN="$(cat /etc/op/provision-token)"
      op item list --vault "{{ op_vault }}" >/dev/null
    executable: /bin/bash
  changed_when: false
  tags: "{{ svc.name }}"

- name: "Render LiteLLM bootstrap-keys glue ({{ svc.name }})"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.template:
    src: litellm-bootstrap-keys.sh.j2   # role templates/ dir
    dest: /usr/local/sbin/litellm-bootstrap-keys.sh
    mode: '0755'
  tags: "{{ svc.name }}"

- name: "Run LiteLLM bootstrap-keys glue ({{ svc.name }})"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.shell:
    cmd: |
      if [ -r /etc/op/provision-token ]; then
        export OP_SERVICE_ACCOUNT_TOKEN="$(cat /etc/op/provision-token)"
      fi
      exec /usr/local/sbin/litellm-bootstrap-keys.sh
    executable: /bin/bash
  register: lk_glue
  until: lk_glue.rc == 0            # rc 3 = stack not ready / transient upstream
  retries: 12
  delay: 10
  changed_when: "'created' in (lk_glue.stdout | default(''))"
  failed_when: lk_glue.rc != 0      # rc 2 stale-secret / rc 4 alias conflict abort loudly
  no_log: true
  tags: "{{ svc.name }}"

# After litellm's bootstrap glue mints the scoped virtual keys into 1Password, refresh the `vault` dict with
# those items so the open-webui/compat consumers that follow litellm in the loop render against the real keys:
# they are glue-created mid-deploy and are deliberately EXCLUDED from the static and authentik-glue pre-passes,
# which run before they exist. Fail-closed — a scoped key that was not minted aborts loudly here.
- name: "Refresh vault dict with litellm scoped keys ({{ svc.name }})"
  when: svc.bootstrap_keys | default(false)
  ansible.builtin.include_tasks:
    file: fetch-vault-pass.yml
  vars:
    op_mode: "list"
    op_item_list: >-
      {{ litellm_scoped_keys | default([]) | map(attribute='vault_item') | list }}
  tags: "{{ svc.name }}"
