---
# fetch-vault-pass.yml — bulk 1Password pre-pass (one `op` fetch per item)
#-----------------------------------------------------------------------------
# Builds the `vault: {<item>: {username,password,credential,bcrypt_hash}}` dict that every
# docker_services compose/config template reads instead of calling
# `community.general.onepassword` per template field. scripts/op-vault-export.py runs ONE
# `op item get --reveal` per item, concurrently; --derive mode derives the needed set from the
# host's ENABLED services' template_dir -> items map.
#
# Invocation (from main.yml / deploy-service.yml, after the op-CLI assert):
#   - include_tasks: fetch-vault-pass.yml
#     vars:
#       (op_export_script is a ROLE DEFAULT — do not re-pass it)
#       op_vault: "<1Password vault>"   # from group_vars
#       op_derive_spec: >-              # derive mode
#         {{ {'services': <enabled template_dirs>, 'map': _template_vault_items,
#             'glue': <items to exclude, e.g. litellm scoped keys>} }}
#       op_item_list: "[name1, name2, …]"   # OR explicit list mode
# The spec carries ONLY item names and the map — never secret values.
#
# Contract: FAIL-CLOSED. Every needed item must resolve; a missing item or a down backend makes
# the exporter exit non-zero so the task fails loudly (NO default('')). delegate_to localhost,
# run_once, no_log — the pipe carries secret VALUES. become: false because the exporter and jq
# read the service-account token on the control node.
#
# Result: the `vault` dict fact on the control host, visible to every template render.
- name: "HD-258 bulk 1Password pre-pass — export secrets into `vault`"
  delegate_to: localhost
  run_once: true
  no_log: true
  vars:
    # Mode is passed EXPLICITLY by the caller ("derive" | "list") — do NOT infer it from
    # `op_derive_spec is defined`: include_tasks vars leak across sibling includes of this file and a
    # shell-level `if` cannot stop Jinja from rendering BOTH branches.
    _mode: "{{ op_mode | default('list') }}"
  block:
    - name: "Run op-vault-export ({{ _mode }} mode)"
      ansible.builtin.shell:
        cmd: |
          {% if _mode == 'derive' %}
          printf '%s\n' '{{ op_derive_spec | to_json }}' \
            | python3 {{ op_export_script }} --vault="{{ op_vault }}" --derive --workers={{ op_vault_workers | default(6) }}
          {% else %}
          printf '%s\n' {{ (op_item_list | default([])) | join(' ') }} \
            | python3 {{ op_export_script }} --vault="{{ op_vault }}" --workers={{ op_vault_workers | default(6) }}
          {% endif %}
        executable: /bin/bash
      become: false
      register: op_vault_out
      no_log: true
      changed_when: false
      failed_when: op_vault_out.rc != 0
      # A --check run evaluates this block's `when` on the include-sanity context and SKIPS, leaving
      # stdout empty -> the set_fact below dies on from_json('') with a misleading 'pre-pass failure'.
      # Run in check mode too: the exporter only READS 1P, so it is check-safe; the derive/list gates
      # still apply via the block-level `when`.
      check_mode: false

    - name: "Set vault dict fact from the export (merge)"
      ansible.builtin.set_fact:
        vault: "{{ (vault | default({})) | combine(op_vault_out.stdout | from_json) }}"
      become: false
      no_log: true
      changed_when: false
      # In --check mode a skipped/empty export yields an EMPTY vault dict rather than a fatal
      # from_json; the renders then see an empty dict with check-mode semantics.
      check_mode: false
      # cacheable: true broadcasts the localhost-set vault fact into hostvars so TARGET-side tasks
      # (e.g. the technitium-seed uri calls) can read it via hostvars['localhost']['vault'] — a
      # non-cacheable set_fact on localhost never reaches target hostvars.
  tags: [docker_services, secrets]
  when: >
    (op_mode == 'derive' and op_derive_spec is defined and (op_derive_spec | length) > 0)
    or (op_mode != 'derive' and op_item_list is defined and (op_item_list | length) > 0)