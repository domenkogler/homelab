---
# arr-seed.yml — seed the *arr root folders + assert the quality profile Seerr pins.
# Included ONCE PER *arr SERVICE from docker_services/main.yml, gated on
# `svc.template_dir in arr_seed_apps` + the deploy scope + `not ansible_check_mode` (every task here
# drives a live API — the same dry-run rule as immich-seed.yml).
#
# WHY A SEED TASK AT ALL: root folders are APP state — they live in the app's own database, not in
# compose env — so a from-zero converge brings the container up with NO root folder. Seerr builds its
# Radarr/Sonarr/Lidarr "Root folder" dropdown straight from GET <app>/rootfolder; with `[]` the
# dropdown is empty and the Add server button stays DISABLED, with no error anywhere. The same is true
# of Jellyfin's library folders (see docs/services-media.md).
#
# THE API BASE IS NOT SHARED ACROSS THE THREE APPS:
#   radarr → /api/v3, sonarr → /api/v3, lidarr 3.1 → /api/v1. Lidarr answers /api/v3 with a 404 and
#   an EMPTY BODY, which reads from the shell as "no root folders" rather than as a wrong URL. Pin it
#   per app in `arr_seed_apps[].api_base`; never build one URL for "the *arr API".
#
# WHY THE KEY COMES FROM THE INSTANCE AND NOT FROM 1Password:
#   `sonarr_api`/`radarr_api`/`lidarr_api` are CONSUMER-side copies (recyclarr, lidarr-ydl) and they
#   demonstrably drift — a placeholder once sat in one of them while the app was healthy. Seeding
#   against a consumer-side copy therefore fails an app that has nothing wrong with it. Read the
#   instance's own `config.xml` ApiKey; the drift itself is tracked in docs/deployment-secrets.md.
#
# What this task does NOT do: it never creates or edits a quality profile. That is Profilarr/
# Recyclarr's job (docs/services-media.md §Catalog); here a missing pinned profile is a LOUD
# FAILURE, because Seerr would otherwise keep importing against a profile id that no longer
# exists. Opt out only with `arr_seed_assert_profiles=false`, and say why in the commit.
#
# Idempotence: GET rootfolder, POST only the paths that are absent. Re-running is a no-op.
#
# WHY THE SEED ALSO REPORTS WHAT IT DID NOT DECLARE: the POST loop is driven by the DECLARED list, so a
# root folder that exists in the app and is absent from `arr_seed_apps` is never removed, never listed and
# never mentioned — the seed says `ok` over it. That asymmetry is not untidiness: the app offers every
# live path in its Root Folder dropdown, so a request can be pinned to a path IaC has never heard of, and
# for Lidarr one of those paths is the Soulseek completion tree that soularr clears on timeout
# (docs/services-media.md §Music Pillar). So the live set is read back against the declared set and a live
# path that is not declared FAILS here, naming itself. Declaring a path (IaC can add, and — there is no
# DELETE for `rootfolder` anywhere in `IaC/` — can never remove) and deleting a live root are the owner's
# calls, made on this report; keeping the drift quiet is not an option the seed gets to take.

- name: "arr-seed: assert the seed facts for {{ svc.name }} are defined"
  ansible.builtin.assert:
    that:
      # `is match` not `regex_search`: the latter returns the matched STRING, and Ansible
      # rejects a non-boolean conditional ("derived from value of type 'str'") the moment
      # this task is reached by a scoped docker_services run rather than --tags arr_seed.
      - arr_seed_apps[svc.template_dir].api_base is match('^/api/v[0-9]+$')
      - arr_seed_apps[svc.template_dir].root_folders | length > 0
      - arr_seed_apps[svc.template_dir].port | int > 0
    fail_msg: >-
      arr_seed_apps.{{ svc.template_dir }} is incomplete
      (roles/docker_services/defaults/main.yml). The api_base is deliberately an explicit
      per-app value: Lidarr 3.x answers /api/v1 and 404s on /api/v3, so a shared default
      would seed the wrong endpoint silently.
  tags: [docker_services, arr_seed]

- name: "arr-seed: read the instance API key from its own config.xml"
  ansible.builtin.slurp:
    src: "{{ arr_seed_config_dir }}/{{ svc.name }}/config/config.xml"
  register: _arr_cfg
  no_log: true
  failed_when: _arr_cfg.content is not defined
  tags: [docker_services, arr_seed]

# The capture group in the pattern below is load-bearing: regex_search(value, pattern, '\1')
# raises "no such group" when the pattern has no parentheses, which aborted the whole converge
# (a `#` note cannot live inside the `>-` scalar — block scalars are literal text).
- name: "arr-seed: extract the key + discover the container IP"
  ansible.builtin.set_fact:
    _arr_key: >-
      {{ (_arr_cfg.content | b64decode) | regex_search('<ApiKey>([^<]*)</ApiKey>', '\1') | first | default('') | trim }}
  no_log: true
  tags: [docker_services, arr_seed]

# Same discovery shape as immich-seed.yml: docker emits a literal '\n' inside the Go template, so
# space-delimit the addresses and take the first non-empty field. Host→container routing works on
# oldsrv since the docker orphan-bridge cleanup.
- name: "arr-seed: discover the {{ svc.name }} container IP"
  ansible.builtin.shell:
    cmd: >-
      docker inspect {{ svc.name }}
      --format '{{ '{{' }}range $k, $v := .NetworkSettings.Networks{{ '}}' }}{{ '{{' }}$v.IPAddress{{ '}}' }} {{ '{{' }}end{{ '}}' }}'
      | tr ' ' '\n' | awk 'NF{print $1; exit}'
    executable: /bin/bash
  register: _arr_ip
  changed_when: false
  tags: [docker_services, arr_seed]

- name: "arr-seed: fail when the instance is not reachable"
  ansible.builtin.assert:
    that:
      - _arr_key | length >= 16
      - _arr_ip.stdout | trim | length > 0
    fail_msg: >-
      Cannot seed {{ svc.name }}: {{ 'no ApiKey in ' ~ arr_seed_config_dir ~ '/' ~ svc.name ~ '/config/config.xml'
      if _arr_key | length < 16 else 'docker inspect returned no container IP' }}.
      The container must be Up before the seed runs — fix the stack, do not seed blindly.
  tags: [docker_services, arr_seed]

- name: "arr-seed: read the live root folders"
  ansible.builtin.uri:
    url: "http://{{ _arr_ip.stdout | trim }}:{{ arr_seed_apps[svc.template_dir].port }}{{ arr_seed_apps[svc.template_dir].api_base }}/rootfolder"
    method: GET
    headers:
      X-Api-Key: "{{ _arr_key }}"
    status_code: 200
  register: _arr_roots
  no_log: true
  failed_when: _arr_roots.json is not defined
  tags: [docker_services, arr_seed]

- name: "arr-seed: name every live root folder the declared set does not cover"
  # `subitems` walks section -> params; `difference` keeps the message honest about WHICH path drifted
  # rather than printing the whole set and asking the reader to diff it.
  ansible.builtin.assert:
    that:
      - (_arr_roots.json | default([]) | map(attribute='path') | list)
        | difference(arr_seed_apps[svc.template_dir].root_folders) | length == 0
    fail_msg: >-
      {{ svc.name }} has live root folder(s) that IaC does not declare:
      {{ (_arr_roots.json | default([]) | map(attribute='path') | list)
         | difference(arr_seed_apps[svc.template_dir].root_folders) | join(', ') }}.
      Declared in arr_seed_apps.{{ svc.template_dir }}.root_folders:
      {{ arr_seed_apps[svc.template_dir].root_folders | join(', ') }}. Nothing below this line will add or
      remove anything about them: IaC can POST a root folder and has no DELETE for one, so the fix is a
      human call made on this report — declare the path in roles/docker_services/defaults/main.yml, or
      DELETE rootfolder/<id> in the app after moving the artists/movies/series pinned to it. Read who is
      pinned with GET {{ arr_seed_apps[svc.template_dir].api_base }}/artist (Lidarr names the field
      `rootFolderPath`, there is no `rootFolderId` in the artist list). Skip in an emergency only with
      `arr_seed_report_root_drift=false`.
  when: arr_seed_report_root_drift | bool
  tags: [docker_services, arr_seed]

- name: "arr-seed: create the missing root folders"
  ansible.builtin.uri:
    url: "http://{{ _arr_ip.stdout | trim }}:{{ arr_seed_apps[svc.template_dir].port }}{{ arr_seed_apps[svc.template_dir].api_base }}/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ _arr_key }}"
    body_format: json
    # `path` is the whole body for Sonarr/Radarr; Lidarr's RootFolderResource also wants a
    # display name + the default metadata profile, carried in post_extra:
    # /media/music, name "Music", defaultMetadataProfileId 1 = "Standard".
    body: "{{ {'path': item} | combine(arr_seed_apps[svc.template_dir].post_extra | default({}, true)) }}"
    status_code: [200, 201]
  loop: "{{ arr_seed_apps[svc.template_dir].root_folders }}"
  loop_control:
    label: "{{ svc.name }}:{{ item }}"
  when: item not in (_arr_roots.json | default([]) | map(attribute='path') | list)
  no_log: true
  tags: [docker_services, arr_seed]

- name: "arr-seed: read the live quality profiles"
  ansible.builtin.uri:
    url: "http://{{ _arr_ip.stdout | trim }}:{{ arr_seed_apps[svc.template_dir].port }}{{ arr_seed_apps[svc.template_dir].api_base }}/qualityprofile"
    method: GET
    headers:
      X-Api-Key: "{{ _arr_key }}"
    status_code: 200
  register: _arr_profiles
  no_log: true
  failed_when: _arr_profiles.json is not defined
  when: arr_seed_assert_profiles | bool
  tags: [docker_services, arr_seed]

- name: "arr-seed: assert the profile Seerr pins still exists"
  ansible.builtin.assert:
    that:
      - arr_seed_apps[svc.template_dir].seerr_profile in (_arr_profiles.json | default([]) | map(attribute='name') | list)
    fail_msg: >-
      Profile '{{ arr_seed_apps[svc.template_dir].seerr_profile }}' is gone from {{ svc.name }}.
      Seerr/SeerrNG pin it by name, so requests would import against a stale id. Profiles are
      Profilarr/Recyclarr-owned state (docs/services-media.md) — restore it there; do not create
      one here. `arr_seed_assert_profiles=false` skips this gate, in an emergency only.
  when: arr_seed_assert_profiles | bool
  tags: [docker_services, arr_seed]
