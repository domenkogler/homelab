---
# sabnzbd-seed.yml — keep SABnzbd's `host_whitelist` big enough to be reached (HD-496)
# Included ONCE from docker_services/main.yml, gated on `template_dir == 'sabnzbd'` + the deploy
# scope + `not ansible_check_mode` (it drives the live container; deployment-ansible.md §Dry-run).
#
# WHY THIS EXISTS (measured on oldsrv 2026-10-06, it was blocking the whole indexer lane):
#   SABnzbd runs its own DNS-rebinding guard: it compares the incoming `Host:` header against
#   `host_whitelist` and answers **403 "Access denied - Hostname verification failed"** to anything
#   it does not recognise. The shipped value carries ONE entry — the container's own short id — so
#   every name this stack actually uses is refused. Probed from the host against the container, all
#   four without an API key so the failure is unambiguous:
#
#     Host: 127.0.0.1:8080   → {"version":"5.1.1"}        (passes — SAB's own loopback default)
#     Host: <container-ip>   → {"version":"5.1.1"}        (passes)
#     Host: sab.kogler.si    → hostname-check FAIL        (Traefik preserves the original Host)
#     Host: sabnzbd          → hostname-check FAIL        (Prowlarr's overlay call → 403 forever)
#
#   Consequences that read as somebody else's bug: the UI at `sab.kogler.si` shows the hostname-check
#   page no matter what Authentik does, and a Prowlarr download client pointed at `sabnzbd:8080`
#   cannot be saved no matter how many times the API key is re-pasted. Both walls are this one value.
#
# WHY A FILE SEED AND NOT COMPOSE ENV: the linuxserver image ships no `SABNZBD__*` translation
# (no `/etc/cont-init.d`, and `grep -rl 'SABNZBD__' /app /usr/bin /etc/cont-init.d` → nothing), so
# env is not a lever here. And SABnzbd exposes NO config-write API — `GET /api?mode=config&name=…`
# answers `{"status":false,"error":"not implemented"}` — so the UI (which is itself behind the very
# wall this seeds) is the only other door. Editing the ini is therefore the only automatable path,
# per CONVENTIONS/README "if the AI can do it, it belongs in IaC".
#
# Safety: the write is the UNION of what is there and what we need — the container-id entry the
# image wrote is never dropped, and neither is anything an owner added by hand. SABnzbd rewrites
# sabnzbd.ini on a clean exit, so the edit happens between stop and start, and a run that needs no
# change restarts nothing.

- name: "sabnzbd-seed: assert the inputs"
  ansible.builtin.assert:
    that:
      - sabnzbd_host_whitelist | length > 0
      - sabnzbd_container_name | trim | length > 0
    fail_msg: >-
      sabnzbd_host_whitelist / sabnzbd_container_name are empty
      (roles/docker_services/defaults/main.yml). An empty list would leave SAB answering
      403 to the edge and to Prowlarr, which is the bug this file seeds.
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: read the current host_whitelist"
  # The ini is 0600 media:media and the container has no DAC_OVERRIDE, so even `-u root` gets
  # Permission denied — read it AS ITS OWNER (storage_uid), which is the only working uid here.
  ansible.builtin.shell:
    cmd: >-
      docker exec -u {{ storage_uid }} {{ sabnzbd_container_name }}
      sh -c 'grep -m1 "^host_whitelist" /config/sabnzbd.ini | cut -d= -f2-'
    executable: /bin/bash
  register: _sab_wl
  changed_when: false
  failed_when:
    - _sab_wl.rc != 0
    - "'no such container' not in _sab_wl.stderr | default('')"
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: fail when the container is not up"
  ansible.builtin.assert:
    that:
      - _sab_wl.rc == 0
    fail_msg: >-
      `docker exec {{ sabnzbd_container_name }}` failed ({{ _sab_wl.stderr | default('') | trim }}).
      The container must exist before its whitelist can be seeded — fix the stack first.
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: compute current vs wanted (union — never drop an existing entry)"
  ansible.builtin.set_fact:
    _sab_wl_have: "{{ _sab_wl.stdout | default('') | split(',') | map('trim') | select() | list }}"
    _sab_wl_want: "{{ sabnzbd_host_whitelist | map('trim') | select() | list }}"
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: read the current locality ranges (the OTHER 403 — see the defaults note)"
  # Absent/empty is a LEGITIMATE state (a fresh SAB ships `local_ranges = ,`), hence `|| true`: grep's rc
  # would otherwise read as "container not up", which is a different failure with a different remedy.
  # The container-down case is already caught by the host_whitelist read above.
  ansible.builtin.shell:
    cmd: >-
      docker exec -u {{ storage_uid }} {{ sabnzbd_container_name }}
      sh -c 'grep -m1 "^local_ranges" /config/sabnzbd.ini | cut -d= -f2- || true'
    executable: /bin/bash
  register: _sab_local
  changed_when: false
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: assert every named locality range resolved from the SSOT"
  # A range renamed out of network_ranges must not silently shrink the set: local_ranges is REPLACE-all,
  # so a quietly-missing entry is a network that stops being local (HD-1089's own trap).
  ansible.builtin.assert:
    that:
      - sabnzbd_local_ranges | length == sabnzbd_local_ranges_names | length
    fail_msg: >-
      sabnzbd_local_ranges_names asks for {{ sabnzbd_local_ranges_names | length }} range(s) but
      network_ranges resolves only {{ sabnzbd_local_ranges | length }}: {{ sabnzbd_local_ranges }}.
      Deriving the set is the whole point — an unresolved name would narrow who counts as local.
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: compute the wanted locality ranges (union — never drop an existing entry)"
  ansible.builtin.set_fact:
    _sab_local_have: "{{ _sab_local.stdout | default('') | split(',') | map('trim') | select() | list }}"
    _sab_local_want: "{{ sabnzbd_local_ranges }}"
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: is a change needed?"
  ansible.builtin.set_fact:
    _sab_wl_missing: "{{ _sab_wl_want | difference(_sab_wl_have) }}"
    _sab_local_missing: "{{ _sab_local_want | difference(_sab_local_have) }}"
  tags: [docker_services, sabnzbd_seed]

# --check first: reading drift does not need SAB stopped, and stopping a working downloader on a
# hunch is not how this file behaves. The script prints CHANGED / "OK already" for both options.
# Rendered then run — the same shape as the LiteLLM bootstrap glue (deploy-service.yml), because
# `script:` needs a real file on the controller and this helper is templated with the wanted paths.
- name: "sabnzbd-seed: render the folder helper"
  ansible.builtin.template:
    src: sabnzbd-folders.py.j2      # role templates/ dir
    dest: /usr/local/sbin/sabnzbd-folders.py
    mode: '0700'
  changed_when: false
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: check the completed/temporary folder drift (no write, no restart)"
  ansible.builtin.command:
    cmd: /usr/local/sbin/sabnzbd-folders.py {{ sabnzbd_ini_host_path }} --check
  register: _sab_folders_check
  changed_when: false
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: is a folder change needed?"
  ansible.builtin.set_fact:
    _sab_folders_drift: "{{ 'CHANGED' in _sab_folders_check.stdout | default('') }}"
    _sab_folders_need: "{{ _sab_folders_check.stdout | default('') }}"
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: does any of this need SAB stopped?"
  # ONE expression, because three `when:` conditions that have to agree (the block, the restart, the
  # summary) are three chances to leave the downloader stopped.
  ansible.builtin.set_fact:
    _sab_restart_needed: >-
      {{ (_sab_wl_missing | length > 0) or (_sab_local_missing | length > 0) or (_sab_folders_drift | bool) }}
  tags: [docker_services, sabnzbd_seed]

# SAB rewrites sabnzbd.ini when it exits cleanly, so an edit made while it runs is silently undone at
# the next stop → stop, edit, start. And the edit MUST go through the HOST PATH, not `docker exec`:
# exec needs a RUNNING container, so a stop-then-exec seed fails at the edit task and leaves the
# downloader stopped — exactly what the first run of this file did (2026-10-06: SAB sat at
# Exited (137) for ~2 min and sab.kogler.si served Bad Gateway while the play aborted mid-block).
# The play runs become:true and lineinfile preserves the file's uid/gid + 0600, so root edits it in
# place without taking ownership away from the `media` owner the container writes as.
# `always:` restarts even if the edit blows up, so a failed seed cannot strand the downloader.
- name: "sabnzbd-seed: apply the ini drift (stop → edit on the host path → start)"
  when: _sab_restart_needed | bool
  block:
    - name: "sabnzbd-seed: stop SABnzbd"
      ansible.builtin.command:
        cmd: docker stop {{ sabnzbd_container_name }}
      changed_when: true

    - name: "sabnzbd-seed: write the union into host_whitelist (host path — the container is stopped)"
      ansible.builtin.lineinfile:
        path: "{{ sabnzbd_ini_host_path }}"
        regexp: '^host_whitelist\s*='
        line: "host_whitelist = {{ (_sab_wl_have + _sab_wl_missing) | unique | join(', ') }}"
      when: _sab_wl_missing | length > 0

    # Same union discipline, opposite consequence: an entry dropped HERE is a network that STOPS being
    # local, so the LAN and the bridges belong in the line, not just the new tailnet range.
    - name: "sabnzbd-seed: write the union into local_ranges"
      ansible.builtin.lineinfile:
        path: "{{ sabnzbd_ini_host_path }}"
        regexp: '^local_ranges\s*='
        line: "local_ranges = {{ (_sab_local_have + _sab_local_missing) | unique | join(', ') }}"
      when: _sab_local_missing | length > 0

    # Section-safe on purpose: a lineinfile on '^dir *=' would also match every CATEGORY's `dir = ""`
    # line and point five categories at the same folder. The helper only edits [misc].
    - name: "sabnzbd-seed: set the completed + temporary folders in [misc]"
      ansible.builtin.command:
        cmd: /usr/local/sbin/sabnzbd-folders.py {{ sabnzbd_ini_host_path }}
      register: _sab_folders_apply
      changed_when: "'CHANGED' in _sab_folders_apply.stdout | default('')"
      when: _sab_folders_drift | bool
  always:
    - name: "sabnzbd-seed: start SABnzbd (always — a failed edit must not strand the downloader)"
      ansible.builtin.command:
        cmd: docker start {{ sabnzbd_container_name }}
      changed_when: false
      failed_when: false
      when: _sab_restart_needed | bool
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: prove the edge name is now accepted (Host probe, no credentials)"
  # 403 that still says "Hostname verification failed" = the seed did not take. Anything else
  # (401 / an API error / a login page) means the guard is satisfied and the next wall is auth,
  # which is a different problem with a different owner.
  ansible.builtin.shell:
    cmd: >-
      docker exec {{ sabnzbd_container_name }} sh -c
      'curl -s -m 6 -H "Host: sab.{{ domain_public }}" http://127.0.0.1:8080/ 2>&1 | head -c 120'
    executable: /bin/bash
  register: _sab_probe
  changed_when: false
  failed_when: "'Hostname verification failed' in _sab_probe.stdout | default('')"
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: discover SAB's own overlay address"
  ansible.builtin.shell:
    cmd: >-
      docker inspect {{ sabnzbd_container_name }}
      --format '{{ '{{' }}range $k, $v := .NetworkSettings.Networks{{ '}}' }}{{ '{{' }}$v.IPAddress{{ '}}' }} {{ '{{' }}end{{ '}}' }}'
      | tr ' ' '\n' | awk 'NF{print $1; exit}'
    executable: /bin/bash
  register: _sab_overlay
  changed_when: false
  failed_when: _sab_overlay.stdout | trim | length == 0
  tags: [docker_services, sabnzbd_seed]
- name: "sabnzbd-seed: prove a tailnet client counts as local (HD-1089)"
  # This is what Traefik actually sends: the peer is a private bridge address (leg 1 passes) and the
  # client's tailnet address arrives in X-Forwarded-For (leg 2 — the one that 403'd). Three things make
  # this test worth having: it runs INSIDE the container against SAB's own overlay address, so the peer is
  # a private non-loopback address — dialing 127.0.0.1 would be allowed by is_loopback_addr() and pass
  # even with local_ranges EMPTY, i.e. a test that cannot fail; it sends the XFF a real `.ts` request
  # carries, which is the only way to reach the check that failed; and it is graded on the STATUS CODE,
  # because a 403 with `api_warnings` off has an EMPTY body, which a string match would call a pass.
  # (The host cannot dial the overlay address here — measured rc 7 — hence docker exec.)
  ansible.builtin.shell:
    cmd: >-
      docker exec {{ sabnzbd_container_name }} curl -s -m 8 -o /dev/null -w '%{http_code}'
      -H "Host: sab.{{ tailnet_base_domain }}"
      -H "X-Forwarded-For: {{ tailnet_oldsrv_ip }}"
      "http://{{ _sab_overlay.stdout | trim }}:8080/"
    executable: /bin/bash
  register: _sab_local_probe
  changed_when: false
  failed_when: >-
    _sab_local_probe.rc != 0
    or not (_sab_local_probe.stdout | trim is match('^(200|30[0-9])$'))
  tags: [docker_services, sabnzbd_seed]

- name: "sabnzbd-seed: record what it took"
  ansible.builtin.debug:
    msg: >-
      host_whitelist {{ 'unchanged (all of ' ~ _sab_wl_want | join(', ') ~ ' already present)'
                       if _sab_wl_missing | length == 0
                       else 'extended with ' ~ _sab_wl_missing | join(', ') }}
      · local_ranges {{ 'unchanged (every internal range already listed)' if _sab_local_missing | length == 0
                        else 'extended with ' ~ _sab_local_missing | join(', ') }}
      · folders {{ 'unchanged' if not ( _sab_folders_drift | bool ) else ( _sab_folders_apply.stdout | default('') ) }}
      · tailnet leg HTTP {{ _sab_local_probe.stdout | trim | default('?') }} (XFF {{ tailnet_oldsrv_ip }})
      · {{ 'no restart needed' if not ( _sab_restart_needed | bool ) else 'SABnzbd restarted once' }}
  tags: [docker_services, sabnzbd_seed]
