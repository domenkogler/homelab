---
# docker_services role defaults
# SSOT for variables: all IPs/CIDRs come from group_vars/all/ -> network_ranges.
# This file holds only role-internal knobs and data.

# Base directory for all Docker Compose projects.
docker_compose_dir: /opt

# Technitium seed self-heal reconcile interval (docker_services role, DNS hosts only).
# See templates/dns-seed.{service,timer}.j2 + docs/network-dns.md §Convergence & drift.
dns_seed_interval: 5m

# Bulk 1Password pre-pass exporter path — define it once here so every caller of
# fetch-vault-pass.yml (static, authentik-glue, litellm-bootstrap) resolves it. Re-passing it per
# caller leaves the glue branch failing 'op_export_script is undefined' once mode is explicit.
op_export_script: "{{ role_path }}/../../../../scripts/secrets/op-vault-export.py"
# Concurrency for the bulk `op item get` pre-pass. Keep it low: 15+ bursts many op calls at once and
# trips hosted-1P rate limits during repeated/debug converges (a block lasts 15min+). Overridable via
# `-e op_vault_workers=N` or a group_var.
op_vault_workers: 6

# Surgical-deploy scope: `all` (default) = full converge. One service name or a comma-separated
# (space-tolerant) list restricts a `--tags docker_services` run to those services + their hard
# companions, because the direct-role platform tasks in tasks/main.yml otherwise run on every run
# (their include lines carry `tags: docker_services`, which selects them by union):
#   ansible-run.sh playbooks/vps.yml --tags docker_services -e docker_services_scope="forgejo,traefik"
_scope_raw: "{{ docker_services_scope | default('all') }}"
# `true` iff a full converge (scope=all). Every platform/glue gate tests this.
scope_is_all: "{{ _scope_raw == 'all' }}"
# The scoped service-name list (`all` or a comma-list split); empty iff scope=all
# is the semantic — scoped branches use `svc_entry.name in scope_list`.
scope_list: >-
  {{ (_scope_raw == 'all') | ternary(
       [],
       (_scope_raw | split(',') | map('trim') | list)) }}

# Extra .j2 template files (beyond docker-compose.yml.j2) per service, keyed by template_dir (must
# match docker_services[].template_dir). The copy step copies the whole template dir first; these are
# then rendered over that raw copy, .j2 suffix stripped.
_extra_templates:
  homelable:
    - nginx.conf.j2          # host-net frontend: proxy /api → loopback backend, listen only on the Home-VLAN IP
  kopia-server:
    - .env.j2               # compose ${KOPIA_SERVER_*} interpolation (1Password render)
  kopia-agent:
    - .env.j2               # same mechanism
  element-web:
    - config.json.j2
  matrix:
    - tuwunel.toml.j2
  opencloud:
    - csp.yaml.j2        # Authentik SSO domain in connect-src/frame-src
  litellm:
    - config.yaml.j2   # LLM gateway model_list/config
  lan-litellm:
    - config.yaml.j2   # LAN-instance clone; model_list stays DB/Admin-UI-managed
  signal-cli-rest-api:
    - config.yaml.j2   # secured-signal-api gateway config (tokens + endpoint allow-list)
  headscale:
    - headplane-config.yaml.j2       # admin UI (Headplane) config, rendered next to compose
    - config.yaml.j2
    - policy.hujson.j2
    - extra_records.json.j2          # the MagicDNS record set headscale reads when
                                     # `headscale_extra_records_path` is set; rendered (and mounted)
                                     # in both render shapes so the key flip never meets a missing file.
                                     # `.json`, not `.yaml`: the consumer unmarshals the rendered file
                                     # as JSON, so the extension states the format that decides whether
                                     # the control plane starts
  traefik:
    - dynamic/routes.yml.j2
    - dynamic/middlewares.yml.j2
    - dynamic/tls.yml.j2        # consumer default-store TLS (renders empty on the issuer)
    - certs-rename.sh.j2        # wildcard pair rename (entrypoint + post-hook)
  spark-dashboard:
    - dynamic/routes.yml.j2     # DGX dashboard/jupyter LAN bridge (file-provider routes; compose renders docker-compose.yml.j2 separately)
    - dynamic/tls.yml.j2        # consumer default-store TLS — a raw-copy-only edge serves TRAEFIK DEFAULT CERT
  # crowdsec: no extra templates. The RouterOS acquisition lands in the config mount via the
  # monitoring role (acquis-routeros.yml.j2 -> /srv/docker/crowdsec/config/acquis.d/). Do NOT re-add one
  # here: CrowdSec reads /etc/crowdsec/acquis.d/ only, and an empty entry breaks the stub-dir loops.
  traefik-tailnet:
    - dynamic/routes.yml.j2     # tailnet subdomain → backend routers (file provider)
    - dynamic/middlewares.yml.j2
    - dynamic/tls.yml.j2        # consumer default-store TLS (wildcard pair from the main issuer)
    - serve.json.j2             # tailscale ipn.ServeConfig — TCP 443 -> 127.0.0.1:443 (persistent serve)
  traefik-ha:
    - dynamic/routes.yml.j2
  # home-LAN internal all-app edge (oldsrv): file-provider routes only (traefik-ha pattern). The wildcard
  # pair is pulled into ./certs by the SAME traefik-cert-pull timer (parametrized via traefik_consumer_dir)
  # and served per-route with `tls: true` from routes.yml (certFile/keyFile, no store block); certResolver
  # is absent on a consumer edge — the cert comes from defaultCerts only.
  traefik-internal:
    - dynamic/routes.yml.j2
  recyclarr:
    - recyclarr.yml.j2
  # soularr has no env-based config surface at all: every setting, including both API keys and both
  # download-dir path views, lives in config.ini. Rendering it is the only way to keep it in git. The
  # `config/` prefix keeps the render under the compose dir, where the compose bind mounts it read-only at
  # /data/config.ini — the loop preserves sub-paths, and a bare name would land the file at the compose
  # root where the container never sees it.
  soularr:
    - config/config.ini.j2

# Single cert issuer: the VPS Traefik is THE only ACME (DNS-01) issuer for *.kogler.si and runs
# certs-dumper. Every other host's Traefik is a cert CONSUMER (synced wildcard pair via its pull timer,
# TLS from the default store via dynamic/tls.yml.j2). Override to true ONLY in group_vars/vps.yml.
traefik_acme_issuer: false

# ---- Immich OAuth — the values tasks/immich-seed.yml PUTs into Immich's DB-backed system config ----
# They live HERE because Immich v3 reads NO OAuth env var (autopsy in
# templates/docker_services/immich-app/docker-compose.yml.j2): compose cannot carry them, so the role
# defaults + 1Password are their IaC home. Client creds are NOT here: `immich_oidc` (Blueprint + glue).
immich_oauth_enabled: true                       # false = seed asserts the flag is OFF, not that it skips
immich_oauth_container_name: immich-server       # mirrors the compose container_name
immich_oauth_port: 2283                          # the in-network API port (no published port on the VPS)
immich_oauth_issuer_url: "https://sso.{{ domain_public }}/application/o/immich/"
immich_oauth_scope: "openid email profile"
immich_oauth_button_text: "Prijava z SSO"        # family-facing button label (docs/manual is Slovenian)
immich_oauth_storage_label_claim: preferred_username
immich_oauth_role_claim: immich_role             # creation-ONLY claims — never re-synced (deployment-oidc.md)
immich_oauth_storage_quota_claim: immich_quota
immich_oauth_auto_register: true
immich_oauth_auto_launch: false                  # keep the native login page reachable (admin fallback)
immich_oauth_mobile_override_enabled: false      # Authentik accepts app.immich:///oauth-callback
immich_oauth_mobile_redirect_uri: ""

# ---- *arr seed — what tasks/arr-seed.yml reconciles in each app's OWN database ----
# Root folders are app state, not compose env: a from-zero converge leaves them EMPTY, so Seerr's
# "Root folder" dropdown (GET <app>/rootfolder) is blank and Add-server is disabled with no error
# anywhere. Paths are the CONTAINER-side view: /mnt/nas/media/media binds at /media in this family.
arr_seed_config_dir: /srv/docker              # <dir>/<service>/config/config.xml holds the instance ApiKey
arr_seed_assert_profiles: true                # false = skip the profile gate (emergency only; say why)
# The read-and-REPORT half: fail when the app holds a live root folder this file does not declare. IaC
# can add a root and cannot remove one (no DELETE for `rootfolder` exists here), so an undeclared live
# path is otherwise invisible in both directions while the app keeps offering it in its dropdown.
# false = skip the report, in an emergency only, and say why in the commit (tasks/arr-seed.yml).
arr_seed_report_root_drift: true
arr_seed_apps:
  sonarr:
    port: 8989
    api_base: /api/v3
    root_folders: ['/media/tv']
    seerr_profile: HD-1080p                   # what Seerr + SeerrNG pin
  radarr:
    port: 7878
    api_base: /api/v3
    root_folders: ['/media/movies']
    seerr_profile: HD-1080p
  lidarr:
    port: 8686
    api_base: /api/v1                         # ⚠ NOT /api/v3 — Lidarr 3.1 serves /api/v1 and 404s on /api/v3
    root_folders: ['/media/music']
    seerr_profile: Lossless
    post_extra:                               # Lidarr's RootFolderResource wants these on POST
      name: Music
      defaultMetadataProfileId: 1             # "Standard" — the live value, not an invention

# ---- Bazarr seed — what tasks/bazarr-seed.yml reconciles in the app's OWN SQLite ----
# Subtitle wiring is app state: compose owns the container and the DB owns the behaviour, so a rebuild
# brings back an app that answers 200 and fetches nothing (docs/services-media.md §Subtitles).
bazarr_seed_port: 6767                      # the container's own port; the seed dials the overlay IP
# The two PVRs Bazarr syncs from. `ip` is the OVERLAY container name, never a `*.kogler.si` host — the
# edge would put its own Forward-Auth in front of the API Bazarr polls. The API key is NOT here: it is
# read from each app's own `config.xml` at seed time (the arr-seed.yml rule, and the reason a rotated arr
# key still reaches Bazarr). The key names are the field names this seed writes, so they are load-bearing.
bazarr_seed_pvr:
  radarr: {ip: radarr, port: 7878}
  sonarr: {ip: sonarr, port: 8989}
# ⚠ REPLACE-all fields: what is declared here is the COMPLETE set, not an addition. `sh` is in the
# language list because it is enabled live (and is what the `cro/srb` profile asks for); dropping it from
# here would silently stop hunting Serbo-Croatian subtitles. `enabled_providers` is replace-all the same
# way — one entry per provider this stack actually credentials.
bazarr_seed_languages: [sl, en, hr, sh, sr]
bazarr_seed_providers: [opensubtitlescom]
bazarr_seed_provider_item: opensubtitles_login   # username + password; an external account, never rotated by IaC
# No `bazarr_seed_jellyfin_*` defaults: Bazarr has no Jellyfin integration in this stack — the two PVRs
# above are its only upstreams and the item that carried the leg (`jellyfin-bazarr_api`) is deleted
# (tasks/bazarr-seed.yml; the ruling and its date are in docs/services-media.md §Credential rotation).

# ---- SABnzbd host_whitelist — what tasks/sabnzbd-seed.yml reconciles ----# SABnzbd rejects any `Host:` it does not recognise with 403 "Hostname verification failed". The shipped
# value holds only the container's short id, so BOTH doors are closed: the UI behind Traefik (which
# forwards `sab.<domain>`) and container-side consumers (which send `sabnzbd`).
# The seed writes the UNION of what is in the ini and this list, so the image's own entry survives.
sabnzbd_container_name: sabnzbd
# Completed/temporary folders inside the container. SAB's own UI cannot set these (its "Default Base
# Folder" is `/config`, derived from `--config-file /config`, and the picker browses only inside it),
# so the ini is the door — see templates/sabnzbd-folders.py.j2. Keys are ini option names in [misc]:
# `dir` = completed, `temp_dir` = incomplete. Both live on the NAS share so the *arrs can import them
# and TRaSH hardlinking stays possible.
# SABnzbd 5.x names these `complete_dir` (completed) and `download_dir` (temporary); the 3.x names
# `dir`/`temp_dir` are inert in 5.x — writing them silently does nothing and the completed data lands on
# the local NVMe. Paths are absolute because the picker can only express paths under `/config`.
sabnzbd_folder_ini:
  complete_dir: /downloads/complete
  download_dir: /downloads/incomplete
# Wrong-section or wrong-generation keys to strip from [misc] so a stale value cannot shadow a real
# one. Removal is scoped to [misc] — `dir` also appears per CATEGORY (`[[movies]]` etc.) and those
# must survive untouched.
sabnzbd_folder_ini_drop: [dir, temp_dir]
# The ini on the HOST path (the compose binds it at /config). The seed edits it there while the
# container is stopped — `docker exec` needs a running container, so the host path is the only door.
sabnzbd_ini_host_path: /srv/docker/{{ sabnzbd_container_name }}/config/sabnzbd.ini
sabnzbd_host_whitelist:
  - sabnzbd                      # the overlay name Prowlarr / any container-side consumer sends
  - "sab.{{ domain_public }}"    # the edge name Traefik passes through as Host
  # The `.ts` twin has its own router and Traefik preserves the original Host on BOTH legs, so the tailnet
  # name must be listed too: a refused name is a 403 from this guard, a missing router is a 404. Written as
  # the UNION with the ini, like everything else in tasks/sabnzbd-seed.yml, so a hand-added entry survives.
  - "sab.{{ tailnet_base_domain }}"   # the MagicDNS twin's Host on the tailnet leg

# ---- SABnzbd locality ranges — the OTHER 403 (`External internet access denied`), a different guard ----
# The shipped `local_ranges` is `,` (two empty entries), which SABnzbd reads as unset and replaces with
# Python's private-address list — that covers the LAN and the Docker bridges but NOT 100.64.0.0/10, and
# X-Forwarded-For is checked against the same list, so a tailnet client through the edge is denied.
# ⚠ REPLACE-all, not additive: once non-empty the private list stops being consulted, so seeding ONLY the
# tailnet cuts the LAN and every container-side consumer. List every internal range this app is reached
# through, derived from `network_ranges`; wireguard (10.255/16) and `modem-lan` stay OUT on purpose.
# → docs/services-downloads.md §SABnzbd's other door
sabnzbd_local_ranges_names:
  - site
  - headscale
  - traefik-public
  - services-internal
  - db-internal
  - llm-backend
  - tailnet-apps
  - dns-servers
sabnzbd_local_ranges: "{{ network_ranges | selectattr('name', 'in', sabnzbd_local_ranges_names) | map(attribute='cidr') | list }}"

# ---- qBittorrent WebUI seed (the torrent leg) — what tasks/qbittorrent-seed.yml reconciles ----
# A seed, not compose env: the linuxserver image translates exactly TWO env vars (`WEBUI_PORT`,
# `TORRENTING_PORT`), so the WebUI credential, save path and categories have no env lever. An empty
# `WebUI\Password_PBKDF2` makes qbit mint a NEW random password at every start, so a client pointed at it
# 401s after the next recreate — and a converge recreates. There is no config-WRITE API (`app/setPassword`
# needs the current, random one), so the conf is the only door: write it with the container STOPPED,
# because qbit rewrites the conf on a clean exit. → docs/deployment-secrets.md §Master Secret List
qbit_container_name: qbittorrent
# The netns OWNER: qBittorrent is `network_mode: service:gluetun`, so it has no address of its own —
# `qbittorrent:8080` reads as code=000 from every consumer while `gluetun:8080` answers. Everything
# that must reach the WebUI from OUTSIDE the pair (this seed's verification) dials THIS container.
qbit_netns_owner: gluetun
# Where the rendered reconcile helper lives on the target.
qbit_conf_helper: /usr/local/sbin/qbittorrent-conf.py
# The WebUI port INSIDE the shared netns (the app's own socket port). The host publish
# (qbittorrent_host_port) is a different number on purpose, and qBittorrent rejects a Host header whose
# port differs from this one — so this, not qbittorrent_host_port, is what verification uses.
qbit_webui_port: 8080
# The conf + categories file on the HOST path (compose binds config → /config).
qbit_conf_host_path: /srv/docker/qbittorrent/config/qBittorrent/qBittorrent.conf
qbit_categories_host_path: /srv/docker/qbittorrent/config/qBittorrent/categories.json
# Login the *arr download clients use. `admin` is what the image logs as the username; the password
# is the vault item (`qbittorrent_api`, field `credential`), never rendered into compose.
qbit_webui_username: admin
# Save paths INSIDE the container (the compose binds /mnt/nas/media/downloads → /downloads).
# ⚠ DefaultSavePath must be the COMPLETED dir, not `/downloads/`: qBittorrent does not append the category
# to the default path, so a flat `/downloads/` writes completed files where no *arr root folder points —
# the same "Import failed, path does not exist" SAB's `[misc] complete_dir` produces. TempPath = incomplete.
qbit_save_path_completed: /downloads/complete
qbit_save_path_incomplete: /downloads/incomplete
# Categories with their OWN save path, so a grab lands in complete/<category> whatever the arr sends.
# Pre-created rather than left to the arrs: an arr creates a missing category with an EMPTY save path, and
# an empty save path means "use the default" — the flat-`complete/` shape again. `prowlarr` is the one
# Prowlarr's OWN download client sends (a job started in its search UI; an arr-originated grab sends its
# per-app category), and it follows the same rule: its own folder, not flat next to the media.
qbit_categories:
  movies: /downloads/complete/movies
  tv: /downloads/complete/tv
  music: /downloads/complete/music
  prowlarr: /downloads/complete/prowlarr

# ---- Seeding goal ----
# An arr CANNOT hardlink from /downloads to /media (`ln` across the two binds returns EXDEV, and Radarr 6.3
# removed Import Mode / Link Type entirely), so an import MOVES the file and the torrent stops seeding at
# import whatever the ratio is. Seeding is therefore bounded by a goal: ratio 2.0 → PAUSE (files and torrent
# stay). It caps seeds that keep their files; it does NOT resurrect a torrent whose files an arr has moved.
# Set over the WebUI API, not the conf (tasks/qbittorrent-seeding.yml) — no container stop, and the key names
# are the live `/api/v2/app/preferences` contract. → docs/services-downloads.md §Hardlink import is impossible
qbit_seed_ratio_goal: 2                    # → API `max_ratio`
qbit_seed_ratio_goal_enabled: true         # → API `max_ratio_enabled`; the goal is inert without it
qbit_seed_goal_action: 0                   # → API `max_ratio_act`; 0 = pause torrent (1 = remove,
                                           #   2 = remove AND delete files — never that one here)
# Ratio is the ONLY limit: a time limit would stop seeding BEFORE 2.00 and quietly contradict the intent,
# so both time limits stay disabled with their unlimited sentinel.
qbit_seed_time_goal_enabled: false
qbit_seed_time_goal: -1                    # → API `max_seeding_time`
qbit_seed_inactive_goal_enabled: false
qbit_seed_inactive_goal: -1                # → API `max_inactive_seeding_time`
# Where the rendered reconcile helper lives on the target (0700 root; it carries no secret — the
# credential arrives on stdin, and it is the SAME origin qbittorrent-seed.yml verifies at).
qbit_seeding_helper: /usr/local/sbin/qbittorrent-seeding.py

# ---- The torrent download client in each *arr — reconciled by tasks/arr-client-torrent.yml ----
# ONE qBittorrent client per arr, over that arr's own API, for the same reason arr-seed.yml owns root
# folders: a download client is APP state (each app's own SQLite), so a from-zero converge leaves indexers,
# a working downloader and nothing connecting them — "every UI is green, nothing downloads". This is the
# torrent half; the Usenet client was wired first.
# HOST IS `gluetun`, NOT `qbittorrent`: qBittorrent is `network_mode: service:gluetun` and owns no network
# namespace, so `qbittorrent:8080` reaches nothing while `gluetun:8080` answers. 8080 is the port INSIDE that
# namespace; the host publish is only for the browser edge.
# The field names below are the apps' OWN settings properties, i.e. the `name` half of the API `fields`
# array. They differ per app and nothing validates a wrong one: an *arr silently drops an unknown field, the
# client grabs with NO category, and the file lands flat in complete/. The task therefore READS THE CLIENT
# BACK and asserts the value actually landed instead of trusting the POST's 2xx.
# → docs/services-downloads.md §Registering a torrent client in an app
#
# PROWLARR IS HERE FOR A DIFFERENT REASON. Its download client is never synced to the apps — Prowlarr syncs
# INDEXERS — so this entry governs only a job started from Prowlarr's own search UI, which otherwise had
# nowhere to go. Registering it does NOT give the arrs a second torrent client; see
# docs/services-downloads.md §Which half of Prowlarr to trust.
arr_torrent_client:
  sonarr:
    port: 8989
    api_base: /api/v3
    category_field: tvCategory
    category: tv
  radarr:
    port: 7878
    api_base: /api/v3
    category_field: movieCategory
    category: movies
  lidarr:
    port: 8686
    api_base: /api/v1          # Lidarr 3.1 is /api/v1; /api/v3 404s with an empty body (arr_seed note)
    category_field: musicCategory
    category: music
  prowlarr:
    port: 9696                 # the app's own socket inside its network, NOT the host publish
    api_base: /api/v1          # Prowlarr 2.5.2 serves /api/v1
    category_field: category   # ⚠ NOT a per-app field: Prowlarr's QBittorrentSettings has ONE `category`
                               # ("Default Category", schema default `prowlarr`) — read it out of
                               # GET /api/v1/downloadclient/schema, do not remember it
    category: prowlarr         # must exist in qbit_categories above, or the path does not steer
arr_torrent_client_name: qBittorrent      # the client name shown in each app
# POST needs BOTH names and instantiates the first: `configContract` is a SETTINGS class
# (`QBittorrentSettings`), `implementation` is the PROVIDER class (`QBittorrent`). Swapping them fails with
# 500 "No parameterless constructor defined". Same pair in all three apps; the create path takes them from
# the app's own schema anyway.
arr_torrent_client_contract: QBittorrentSettings   # the SETTINGS class POST instantiates
arr_torrent_client_implementation: QBittorrent       # the PROVIDER class it implements — NOT the same string
arr_torrent_client_host: gluetun          # the netns owner — see the note above
arr_torrent_client_port: "{{ qbit_webui_port }}"   # the app's socket port in the shared netns, NOT the host publish
arr_torrent_client_user: "{{ qbit_webui_username }}"
arr_torrent_client_item: qbittorrent_api  # vault item holding the WebUI credential (field credential)
# The non-secret fields the seed writes. `apiKey` is part of the settings class but unused by qBittorrent
# (it takes basic auth) — it is sent empty so a stale placeholder from an older build cannot shadow it.
arr_torrent_client_fields:
  host: "{{ arr_torrent_client_host }}"
  port: "{{ arr_torrent_client_port }}"
  useSsl: false
  urlBase: ""
  apiKey: ""
# Owned fields a build may legitimately not expose: Sonarr 4.0.19, Radarr and Prowlarr 2.5.2 report `apiKey`,
# Lidarr 3.1 does not — its QBittorrentSettings has no such property. Without this list the seed compares
# None to "" forever and PUTs Lidarr's client on EVERY converge. Naming a field here is a claim about a
# build; anything owned, unreported and NOT listed fails loud in arr-torrent-client.py.j2.
arr_torrent_client_optional_fields: [apiKey]
# `type` per field, exactly as the app reports it (textbox / checkbox / password). This is UI metadata about
# the settings FIELDS — the values come from group_vars and from 1Password, never from here. Keys carry a
# `_type` suffix so the secrets linter (which flags any `password:`/`apiKey:` key with a literal value) does
# not read a type NAME as a credential; arr-torrent-client.py strips the suffix before use.
arr_torrent_client_field_types:
  host_type: textbox
  port_type: textbox
  useSsl_type: checkbox
  urlBase_type: textbox
  apiKey_type: textbox
  username_type: textbox
  password_type: password
  tvCategory_type: textbox
  movieCategory_type: textbox
  musicCategory_type: textbox
  category_type: textbox       # Prowlarr's single "Default Category" field

# ---- Bulk 1Password pre-pass item sets (per-template map) ----
# The compose/config templates reference `vault: {name: {field}}` items, which fetch-vault-pass.yml +
# scripts/secrets/op-vault-export.py fetch ONCE per item (one op spawn) instead of ~160 per-template lookups. The
# per-host set is DERIVED from the host's ENABLED docker_services plus the shared glue set, so a host that
# doesn't run a service never fetches (nor fails on) its items. When a template gains/loses a secret, update
# its line here (mirrors docs/deployment-secrets.md).
_template_vault_items:
  authentik: {'authentik_password', 'authentik_login', 'authentik_db'}
  db-backup: {'forgejo_db', 'immich_db', 'authentik_db', 'litellm_db'}
  crowdsec-web-ui: {'crowdsec-webui_lapi_api'}   # LAPI watcher password (vault-dict read at render)
  forgejo: {'forgejo_db'}
  grafana: {'smtp_login', 'grafana_login'}
  headscale: {'headplane_password', 'headscale_api', 'headplane_api'}
  homelable: {'homelable_login', 'homelable_secret', 'homelable_mcp'}   # the mcp item is catalog-created unconditionally (unused while homelable_mcp_enabled=false) so flipping the flag never needs a derive-map edit; the compose only references it in the mcp if-block
  home-assistant-standby: {'ha-vrrp_password'}
  immich-app: {'immich_oidc', 'immich-ml-internal_api', 'immich_db', 'immich-admin_login'}   # neither is a compose reference: the OIDC SEED task (tasks/immich-seed.yml) needs them — Immich v3 reads no OAuth env var — and the derive set is where a missing item fails loudly
  immich-ml: {'immich-ml-internal_api'}
  kopia-agent: {'kopia_password', 'kopia-server-internal_api', 'kopia-server_fingerprint'}
  kopia-server: {'kopia_password', 'kopia-server-internal_api'}   # NB: kopia-server_fingerprint NOT fetched here — it cannot exist before kopia-server first start seeds it; only the AGENT (oldsrv, later play) consumes it
  litellm: {'litellm_api', 'litellm_db', 'openrouter_api', 'spark-llm_api'}   # spark-llm_api → the container's OPENAI_API_KEY env, so the DB model entry carries NO key (v1.83.10 does not expand `os.environ/` in DB params; never put the literal into the Kopia-backed DB). Embed/rerank are local on oldsrv, so no cohere item
  lan-litellm: {'litellm_api', 'litellm_db', 'openrouter_api', 'spark-llm_api'}   # LAN instance — same items as the VPS spine; a missing row here means the static pre-pass never fetches them and the compose render fails fail-closed on vault['litellm_api']. spark-llm_api for the same OPENAI_API_KEY reason
  mcp-victoriametrics: {'victoria-metrics_api'}   # MCP→VM basic auth (username/password)
  mcp-victorialogs: {'victoria-logs_api'}         # MCP→VL basic auth (username/password)
  matrix: {'matrix_api', 'matrix_password'}
  metabase: {'smtp_login'}   # the compose's only reference: the SMTP2Go relay creds. The admin account is NOT here — it is created in the first-run wizard, so `metabase_login` is an owner-reference item with no compose consumer
  n8n: {'n8n-webhook_api', 'n8n_password', 'signal-internal_api', 'signal_api', 'matrix-alerts_api'}   # SIGNAL_* env (signal-cli leg) — signal-internal_api (API token) + signal_api (number); matrix-alerts_api → the Matrix alert bot's token
  onlyoffice-docs: {'onlyoffice_db', 'onlyoffice-rabbitmq_login', 'opencloud-collab_password'}
  open-webui: {'openwebui_api', 'openwebui_secret', 'owui-public-chat_api'}
  openclaw: {'openclaw_gateway_token', 'openclaw-opencloud_api'}
  pi-dev: {'pi-harness_openai_api', 'pi-harness_forgejo_api', 'tailscale_pi_dev_api'}   # Pattern-A tailnet sidecar auth key (preauth-key, owner-seeded)
  dsh: {'dsh_api', 'dsh_forgejo_api', 'tailscale_dsh_api'}   # Pattern-A tailnet sidecar auth key (preauth-key, owner-seeded). ⚠ All THREE items are absent from the vault, so re-enabling this parked service fails closed on the vault lookup until they are re-seeded — the intended loud answer, not a bug in this map.
  opencloud: {'opencloud_login', 'opencloud-collab_password'}
  qdrant: {'qdrant_db'}
  pihole: {'pihole_password'}   # service parked — the row stays so a future re-enable resolves cleanly
  victoria-metrics: {'victoria-metrics_api'}   # Victoria* basic auth, HYPHENATED <service>_<type>
  victoria-logs: {'victoria-logs_api'}         # Victoria* basic auth, HYPHENATED <service>_<type>
  qbittorrent: {'privado-vpn_api', 'qbittorrent_api'}   # qbittorrent_api is NOT a compose reference: the WebUI credential is written into qBittorrent.conf by tasks/qbittorrent-seed.yml, which reads it from the bulk vault dict — the derive set is where a missing item fails loudly
  # The three arrs take no compose secret, but tasks/arr-client-torrent.yml writes a qBittorrent client into
  # each app and that client authenticates with `qbittorrent_api` — the item registered ABOVE under the
  # qbittorrent service. Derive mode fetches per enabled service IN SCOPE, so with no rows here an arr-only
  # converge (`-e docker_services_scope=sonarr,…`) seeds the client against an empty `vault` and the include's
  # own assert fails it closed. Listed per consuming app rather than fetched ad hoc, so check-vault-items.sh
  # keeps answering "does the vault have it" for the lane that reads it.
  sonarr: {'qbittorrent_api'}
  radarr: {'qbittorrent_api'}
  lidarr: {'qbittorrent_api'}
  prowlarr: {'qbittorrent_api'}   # same reason and same item as the three arrs — tasks/arr-client-torrent.yml
                                  # writes this client too, and derive mode fetches per service IN SCOPE
  # Bazarr takes no compose secret, but tasks/bazarr-seed.yml writes one app-state leg from the vault: the
  # OpenSubtitles account. The Jellyfin key it also wrote is gone with the leg — see the `bazarr_seed_*`
  # defaults above. Derive mode fetches per enabled service IN SCOPE, so with no row here a
  # `docker_services_scope=bazarr` converge would seed against an empty `vault` and the include's own assert
  # would fail it closed.
  bazarr: {'opensubtitles_login'}
  aurral: []   # config is all IN-UI (Lidarr API, Last.fm, ListenBrainz in first-run setup); no 1P items for the compose. lastfm_login/metabrainz_login stay as owner-reference items + docs rows. An empty set is `[]`: a bare `set()` is a Python literal YAML parses as the STRING "set()", which pollutes the derive item set with per-char fake items and op-vault-export fails on '('.
  lidarr-ydl: {'lidarr_api'}   # Lidarr API key (compose). Its Web-UI login has NO vault item — first-run setup, not fetched/required by compose.
  slskd: {'slskd_login', 'soulseek_api', 'soulseek-internal_api', 'privado-vpn_api'}   # Soulseek login + slskd UI password (JWT) + the slskd HTTP API key (x-api-key, read by soularr) + VPN client key (gluetun sidecar)
  # The poller bridge spans BOTH arr APIs, so it needs both items. `[Slskd] api_key` is the slskd HTTP API
  # key (`soulseek-internal_api`), NOT the slskd UI password: soularr authenticates with `x-api-key`, which
  # slskd honours only for a configured API key. `soulseek_api` is therefore absent here by design — the
  # human login and the machine credential are different items and rotate separately (docs/deployment-secrets.md).
  soularr: {'lidarr_api', 'soulseek-internal_api'}
  tube-archivist: {'tube-archivist_login', 'tube-archivist_ui', 'tube-archivist-es'}   # login + UI/API token + ES 'elastic' bootstrap password (ELASTIC_PASSWORD env on app + ES); `tube_archivist_api` stays DOCS-ONLY for the future Jellyfin plugin (not fetched)
  recyclarr: {'sonarr_api', 'radarr_api'}
  renovate: {'forgejo_api'}
  rustdesk-server: {'rustdesk_login'}   # the hbbs/hbbr keypair (username=public, password=secret); NOT catalog-generated (rustdesk-utils mints it, manual-value class) and NOT auto-rotatable (rotating orphans every enrolled client)
  signal-cli-rest-api: {'signal-internal_api', 'signal_api'}
  spark-ai: {'spark-llm_api', 'litellm-engine_api'}   # spark's only vault items: the engine accepts the harness key AND the gateway's own credential, which is what ends spark-llm_api's triple use
  technitium: {'technitium_login', 'technitium_api'}
  traefik: {'cloudflare_api', 'crowdsec-bouncer_api'}
  traefik-tailnet: {'crowdsec-bouncer_api', 'tailscale-sidecar_api'}   # middlewares LAPI key + sidecar auth key
  zipline: {'zipline_password', 'zipline_oidc', 'zipline_db'}

# Glue-seeded items (fetched AFTER the authentik secret-egress / litellm
# bootstrap glue — they don't exist before the glue on a fresh host).
_bulk_op_glue:
  - headscale_api
  - matrix_api
  - openwebui_api
  - immich_oidc
  - forgejo_oidc
  - zipline_oidc

# === VPS state push to the Hetzner Storage Box ===============================
# The payload below has ONE copy on ONE disk (/dev/vda3) on the VPS; this is the only host-side backup act
# that runs there — docs/backup.md owns the coverage table. The transport is the CIFS mount the `cifs` role
# already keeps mounted: no new mechanism, no new credential, and the unit REFUSES to run if that mount is
# not CIFS, because a dead mount would silently write the "off-box" copy onto the same disk.
vps_state_push_enabled: true
vps_state_push_mount: /mnt/storagebox
# Path on the box, under the mounted share; the host name is appended by the script.
vps_state_push_dir: vps-state
# db-backup's dump volume (the volume name is project-prefixed — derive it, do not assume a bare name).
vps_state_push_dumps_src: /var/lib/docker/volumes/db-backup_db-backups/_data
# n8n runs DB_TYPE: sqlite, so it has no dump path; its sqlite trio is copied as a pair-set.
vps_state_push_n8n_src: /srv/docker/n8n/data
