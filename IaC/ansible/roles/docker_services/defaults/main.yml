---
# docker_services role defaults
# SSOT for variables: all IPs/CIDRs come from group_vars/all.yml -> network_ranges.
# This file holds only role-internal knobs and data.

# Base directory for all Docker Compose projects.
docker_compose_dir: /opt

# Surgical-deploy scope (HD-255/HD-260). `all` (default) = full converge and is
# UNCHANGED from the pre-scope behavior. Setting it to a single service name makes
# a `--tags docker_services` run deploy ONLY that service:
#   ansible-run.sh playbooks/vps.yml --tags docker_services -e docker_services_scope=headscale
# The per-service inner tags in deploy-service.yml still narrow the task list, but
# the direct-role platform tasks in main.yml (networks, teardown, homepage,
# cert-pull, authentik-lane) otherwise run on every docker_services run because the
# include lines carry `tags: docker_services` (union selection) — the scope gate
# below keeps a surgical run to genuinely one service + its hard companions.

# Extra .j2 template files (beyond docker-compose.yml.j2) per service.
# Keyed by template_dir (must match docker_services[].template_dir).
# The copy step copies the entire template dir first; these are then rendered
# (overwriting the raw .j2 copy with the rendered version, stripping .j2 suffix).
_extra_templates:
  kopia-server:
    - .env.j2               # compose ${KOPIA_SERVER_*} interpolation (1Password render)
  kopia-agent:
    - .env.j2               # same mechanism — Phase 3 host, fixed while live here
  element-web:
    - config.json.j2
  loki:
    - loki.yaml.j2
  matrix:
    - tuwunel.toml.j2
  opencloud:
    - csp.yaml.j2        # HD-144 — Authentik SSO domain in connect-src/frame-src
  litellm:
    - config.yaml.j2   # HD-100 LLM gateway model_list/config
  prometheus:
    - prometheus.yml.j2
    - prometheus-web-config.yml.j2   # HD-59 Basic Auth for the scrape endpoint
  headscale:
    - headplane-config.yaml.j2       # HD-233 admin UI (Headplane) config, rendered next to compose
    - config.yaml.j2
    - policy.hujson.j2
  traefik:
    - dynamic/routes.yml.j2
    - dynamic/middlewares.yml.j2
    - dynamic/tls.yml.j2        # HD-181 — consumer default-store TLS (renders empty on the issuer)
    - certs-rename.sh.j2        # Wave-2 triage 2026-08-22 — wildcard pair rename (entrypoint + post-hook)
  traefik-ha:
    - dynamic/routes.yml.j2
  recyclarr:
    - recyclarr.yml.j2

# Single cert issuer (HD-178/HD-181): the VPS Traefik is THE only ACME (DNS-01) issuer
# for *.kogler.si and runs certs-dumper. Every other host's Traefik is a cert CONSUMER
# (synced wildcard pair via its pull timer; serves TLS from the default store,
# dynamic/tls.yml.j2). Override to true ONLY in group_vars/vps.yml.
traefik_acme_issuer: false