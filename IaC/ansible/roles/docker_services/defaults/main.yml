---
# docker_services role defaults
# SSOT for variables: all IPs/CIDRs come from group_vars/all/ -> network_ranges.
# This file holds only role-internal knobs and data.

# Base directory for all Docker Compose projects.
docker_compose_dir: /opt

# Technitium seed self-heal reconcile interval (docker_services role, DNS hosts only).
# See templates/dns-seed.{service,timer}.j2 + docs/network-dns.md §Convergence & drift.
dns_seed_interval: 5m

# HD-258 bulk 1Password pre-pass exporter path — always defined here so every caller of
# fetch-vault-pass.yml (static, authentik-glue, litellm-bootstrap) resolves it; do NOT
# re-pass per caller (the list-mode/glue branch failed with 'op_export_script is
# undefined' once the Jinja {% if %} made mode explicit).
op_export_script: "{{ role_path }}/../../../../scripts/op-vault-export.py"
# HD-258/HD-268: concurrency for the bulk `op item get` pre-pass. Kept conservative (6) —
# a higher number (15+) bursts many op calls at once and can trip hosted-1P rate limits during
# repeated/debug converges (rate-limit block can last 15min+). Settle low. Overridable via
# `-e op_vault_workers=N` or a group_var.
op_vault_workers: 6

# Surgical-deploy scope (HD-255/HD-260). `all` (default) = full converge and is
# UNCHANGED from the pre-scope behavior. Setting it to one or more service names
# makes a `--tags docker_services` run deploy ONLY those services:
#   ansible-run.sh playbooks/vps.yml --tags docker_services -e docker_services_scope=headscale
#   ansible-run.sh playbooks/vps.yml --tags docker_services -e docker_services_scope="forgejo,traefik"
# The per-service list tags in deploy-service.yml still narrow the task list, but
# the direct-role platform tasks in main.yml (networks, teardown, homepage,
# cert-pull, authentik-lane) otherwise run on every docker_services run because the
# include lines carry `tags: docker_services` (union selection) — the scope gate
# below keeps a surgical run to genuinely the scoped services + their hard companions.
#
# HD-269: docker_services_scope may be a single service name OR a comma-separated
# list (space tolerant). Computed once here into a repeatable form for every consumer.
_scope_raw: "{{ docker_services_scope | default('all') }}"
# `true` iff a full converge (scope=all). Every platform/glue gate tests this.
scope_is_all: "{{ _scope_raw == 'all' }}"
# The scoped service-name list (`all` or a comma-list split); empty iff scope=all
# is the semantic — scoped branches use `svc_entry.name in scope_list`.
scope_list: >-
  {{ (_scope_raw == 'all') | ternary(
       [],
       (_scope_raw | split(',') | map('trim') | list)) }}

# Extra .j2 template files (beyond docker-compose.yml.j2) per service.
# Keyed by template_dir (must match docker_services[].template_dir).
# The copy step copies the entire template dir first; these are then rendered
# (overwriting the raw .j2 copy with the rendered version, stripping .j2 suffix).
_extra_templates:
  homelable:
    - nginx.conf.j2          # HD-45 host-net frontend: proxy /api → loopback backend, listen only on the Home-VLAN IP
  kopia-server:
    - .env.j2               # compose ${KOPIA_SERVER_*} interpolation (1Password render)
  kopia-agent:
    - .env.j2               # same mechanism — Phase 3 host, fixed while live here
  element-web:
    - config.json.j2
  matrix:
    - tuwunel.toml.j2
  opencloud:
    - csp.yaml.j2        # HD-144 — Authentik SSO domain in connect-src/frame-src
  litellm:
    - config.yaml.j2   # HD-100 LLM gateway model_list/config
  lan-litellm:
    - config.yaml.j2   # HD-356 LAN-instance clone (HD-370: model_list stays DB/Admin-UI-managed)
  signal-cli-rest-api:
    - config.yaml.j2   # HD-353 secured-signal-api gateway config (tokens + endpoint allow-list)
  headscale:
    - headplane-config.yaml.j2       # HD-233 admin UI (Headplane) config, rendered next to compose
    - config.yaml.j2
    - policy.hujson.j2
  traefik:
    - dynamic/routes.yml.j2
    - dynamic/middlewares.yml.j2
    - dynamic/tls.yml.j2        # HD-181 — consumer default-store TLS (renders empty on the issuer)
    - certs-rename.sh.j2        # Wave-2 triage 2026-08-22 — wildcard pair rename (entrypoint + post-hook)
  spark-dashboard:
    - dynamic/routes.yml.j2     # HD-364 rework — DGX dashboard/jupyter LAN bridge (file-provider routes; compose renders docker-compose.yml.j2 separately)
    - dynamic/tls.yml.j2        # HD-370 fix 2026-09-15 — consumer default-store TLS (raw-copy-only left the edge on TRAEFIK DEFAULT CERT; live-found)
  # crowdsec: HD-313 (2026-09-04) — no extra templates. The RouterOS acquisition
  # now lands in the config mount via the monitoring role
  # (acquis-routeros.yml.j2 -> /srv/docker/crowdsec/config/acquis.d/). Do NOT
  # re-add an extra-template here: a compose-dir copy is dead — CrowdSec reads
  # acquisitions from /etc/crowdsec/acquis.d/ only. (An empty-string entry would
  # break the extra-template copy/remove-stub loops.)
  traefik-tailnet:
    - dynamic/routes.yml.j2     # tailnet subdomain → backend routers (file provider)
    - dynamic/middlewares.yml.j2
    - dynamic/tls.yml.j2        # consumer default-store TLS (wildcard pair from the main issuer)
    - serve.json.j2             # tailscale ipn.ServeConfig — TCP 443 -> 127.0.0.1:443 (persistent serve)
  traefik-ha:
    - dynamic/routes.yml.j2
  # HD-350: home-LAN internal all-app edge (oldsrv). File-provider routes only
  # (same pattern as traefik-ha/traefik-tailnet); the wildcard pair is pulled into
  # ./certs by the SAME traefik-cert-pull timer (parametrized via traefik_consumer_dir)
  # and served with `tls: true` per-route from the certificate declared in routes.yml
  # (traefik-ha schema — certFile/keyFile, no store block; certResolver is absent on
  # consumer edges, the cert is defaultCerts-file only).
  traefik-internal:
    - dynamic/routes.yml.j2
  recyclarr:
    - recyclarr.yml.j2

# Single cert issuer (HD-178/HD-181): the VPS Traefik is THE only ACME (DNS-01) issuer
# for *.kogler.si and runs certs-dumper. Every other host's Traefik is a cert CONSUMER
# (synced wildcard pair via its pull timer; serves TLS from the default store,
# dynamic/tls.yml.j2). Override to true ONLY in group_vars/vps.yml.
traefik_acme_issuer: false

# ---- Immich OAuth (HD-147 foto leg / HD-148) — the values tasks/immich-seed.yml PUTs into
# Immich's DB-backed system config. They live HERE because Immich v3 reads NO OAuth env var
# (see the autopsy in templates/docker_services/immich-app/docker-compose.yml.j2): compose
# cannot carry them, so the role defaults + 1Password are their IaC home.
# Client creds are NOT here: they come from `immich_oidc` (Blueprint + glue-seeded).
immich_oauth_enabled: true                       # false = seed asserts the flag is OFF, not that it skips
immich_oauth_container_name: immich-server       # mirrors the compose container_name
immich_oauth_port: 2283                          # the in-network API port (no published port on the VPS)
immich_oauth_issuer_url: "https://sso.{{ domain_public }}/application/o/immich/"
immich_oauth_scope: "openid email profile"
immich_oauth_button_text: "Prijava z SSO"        # family-facing button label (docs/manual is Slovenian)
immich_oauth_storage_label_claim: preferred_username
immich_oauth_role_claim: immich_role             # creation-ONLY claims — never re-synced (deployment-oidc.md)
immich_oauth_storage_quota_claim: immich_quota
immich_oauth_auto_register: true
immich_oauth_auto_launch: false                  # keep the native login page reachable (admin fallback)
immich_oauth_mobile_override_enabled: false      # Authentik accepts app.immich:///oauth-callback (verified 2026-09-25)
immich_oauth_mobile_redirect_uri: ""

# ---- *arr seed (HD-358) — what tasks/arr-seed.yml reconciles in each app's OWN database ----
# Root folders are app state, not compose env: a from-zero converge leaves them EMPTY, and Seerr
# builds its "Root folder" dropdown from GET <app>/rootfolder — with `[]` the dropdown is blank
# and the Add-server button is disabled with no error anywhere (measured 2026-10-06). The paths
# below are the CONTAINER-side view (`/mnt/nas/media/media` is bound at /media by every compose
# in this family — deployment-compose.md §Storage), which is also what Jellyfin's libraries use.
# `api_base` is per-app ON PURPOSE: Lidarr 3.1 serves /api/v1 and 404s on /api/v3.
arr_seed_config_dir: /srv/docker              # <dir>/<service>/config/config.xml holds the instance ApiKey
arr_seed_assert_profiles: true                # false = skip the profile gate (emergency only; say why)
arr_seed_apps:
  sonarr:
    port: 8989
    api_base: /api/v3
    root_folders: ['/media/tv']
    seerr_profile: HD-1080p                   # what Seerr + SeerrNG pin (measured in settings.json)
  radarr:
    port: 7878
    api_base: /api/v3
    root_folders: ['/media/movies']
    seerr_profile: HD-1080p
  lidarr:
    port: 8686
    api_base: /api/v1                         # ⚠ NOT /api/v3 — 404 on Lidarr 3.1 (measured 2026-10-06)
    root_folders: ['/media/music']
    seerr_profile: Lossless
    post_extra:                               # Lidarr's RootFolderResource wants these on POST
      name: Music
      defaultMetadataProfileId: 1             # "Standard" — the live value, not an invention

# ---- SABnzbd hostname whitelist (HD-496) — what tasks/sabnzbd-seed.yml reconciles ----
# SABnzbd rejects any `Host:` it does not recognise with 403 "Access denied - Hostname verification
# failed". The shipped value holds only the container's short id, so BOTH doors into it were closed:
# the UI behind Traefik (which forwards `sab.kogler.si`) and Prowlarr's client (which sends
# `sabnzbd`) — measured 2026-10-06, the blocker behind "SAB answers 403 to everything".
# The seed writes the UNION of what is in the ini and this list, so the image's own entry survives.
sabnzbd_container_name: sabnzbd
# Completed/temporary folders inside the container. SAB's own UI cannot set these (its "Default Base
# Folder" is `/config`, derived from `--config-file /config`, and the picker browses only inside it),
# so the ini is the door — see templates/sabnzbd-folders.py.j2. Keys are ini option names in [misc]:
# `dir` = completed, `temp_dir` = incomplete. Both live on the NAS share so the *arrs can import them
# and TRaSH hardlinking stays possible.
# SABnzbd 5.x names these `complete_dir` (completed) and `download_dir` (temporary). NOT `dir`/
# `temp_dir` — those were the SAB 3.x names; writing them silently does nothing (the first version of
# this seed did exactly that and the completed 24 GB landed on the local NVMe). Paths are absolute,
# because the picker UI can only express paths under the base folder `/config`.
sabnzbd_folder_ini:
  complete_dir: /downloads/complete
  download_dir: /downloads/incomplete
# Wrong-section or wrong-generation keys to strip from [misc] so a stale value cannot shadow a real
# one. Removal is scoped to [misc] — `dir` also appears per CATEGORY (`[[movies]]` etc.) and those
# must survive untouched.
sabnzbd_folder_ini_drop: [dir, temp_dir]
# The ini on the HOST path (the compose binds it at /config). The seed edits it there while the
# container is stopped — `docker exec` needs a running container, so the host path is the only door.
sabnzbd_ini_host_path: /srv/docker/{{ sabnzbd_container_name }}/config/sabnzbd.ini
sabnzbd_host_whitelist:
  - sabnzbd                      # the overlay name Prowlarr / any container-side consumer sends
  - "sab.{{ domain_public }}"    # the edge name Traefik passes through as Host

# ---- qBittorrent WebUI seed (the torrent leg) — what tasks/qbittorrent-seed.yml reconciles ----
# WHY THIS IS A SEED AND NOT COMPOSE ENV (measured 2026-10-06, same class as sabnzbd-seed.yml):
#   1. qBittorrent stores its settings in `qBittorrent.conf` (a Qt .ini), and the linuxserver image
#      translates exactly TWO env vars — `WEBUI_PORT` and `TORRENTING_PORT`. There is no env for the
#      WebUI username/password, the save path or the categories, so env is not a lever.
#   2. Leaving the credential alone is not a neutral default. `WebUI\Password_PBKDF2` empty makes
#      qbit mint a NEW random 9-character password on EVERY start
#      (qBittorrent src/app/application.cpp: `getWebUIPassword().isEmpty() ? Password::generate(9)`),
#      printed to the container log. An *arr download client pointed at it therefore works until the
#      next recreate and then 401s forever — and a converge recreates. Live proof 2026-10-06: the
#      conf carried no credential keys at all (mtime = the day the container was first created) and
#      every WebUI call answered 401.
#   3. qBittorrent has no config-WRITE API for these values (`app/setPassword` needs the CURRENT
#      password, which is the random one), so the conf is the only automatable door — write it while
#      the container is stopped, because qbit rewrites the conf on a clean exit (the sabnzbd ini rule).
qbit_container_name: qbittorrent
# The conf + categories file on the HOST path (compose binds config → /config).
qbit_conf_host_path: /srv/docker/qbittorrent/config/qBittorrent/qBittorrent.conf
qbit_categories_host_path: /srv/docker/qbittorrent/config/qBittorrent/categories.json
# Login the *arr download clients use. `admin` is what the image logs as the username; the password
# is the vault item (`qbittorrent_api`, field `credential`), never rendered into compose.
qbit_webui_username: admin
# Save paths INSIDE the container (the compose binds /mnt/nas/media/downloads → /downloads).
# ⚠ DefaultSavePath must be the COMPLETED dir, not `/downloads/`: qBittorrent does not append the
# category to the default path, so a flat `/downloads/` writes completed files where no *arr root
# folder points — the same "Import failed, path does not exist" the Usenet leg hit with SAB's
# `[misc] complete_dir`. TempPath is the incomplete dir.
qbit_save_path_completed: /downloads/complete
qbit_save_path_incomplete: /downloads/incomplete
# Categories with their OWN save path, so a grab lands in complete/<category> whatever the arr sends.
# Pre-created here rather than left to the arrs: an arr creates a missing category with an EMPTY
# save path, and an empty save path means "use the default" — i.e. the flat-`complete/` shape again.
# Keys are the categories the arrs are configured to send (Radarr movies / Sonarr tv / Lidarr music).
qbit_categories:
  movies: /downloads/complete/movies
  tv: /downloads/complete/tv
  music: /downloads/complete/music

# ---- The torrent download client in each *arr (HD-496 Gate 3b) ----
# tasks/arr-client-torrent.yml reconciles ONE qBittorrent client per arr, over that arr's own API,
# for the same reason arr-seed.yml owns root folders: a download client is APP state (each app's own
# SQLite), so a from-zero converge would leave three arrs with indexers, a working downloader and
# nothing connecting the two — the exact "every UI is green, nothing downloads" state HD-496 was
# opened for. The Usenet client was wired by hand in that lane; this is the torrent half.
#
# HOST IS `gluetun`, NOT `qbittorrent` — qBittorrent is `network_mode: service:gluetun` and owns no
# network namespace, so `qbittorrent:8080` does not resolve/reach anything from the overlay while
# `gluetun:8080` answers (measured 2026-10-06: code=000 vs 200). Port 8080 is the port INSIDE that
# namespace; the host publish (qbittorrent_host_port) is only for the browser edge.
#
# The field names below are the apps' OWN settings properties (`QBittorrentSettings.cs` in each repo,
# read 2026-10-07), i.e. the `name` half of the API `fields` array. They differ per app and nothing
# validates a wrong one: *arr silently drops an unknown field, so `category` on an app that wants
# `movieCategory` stores nothing, the client grabs with NO category, and the file lands flat in
# complete/ — SAB's `dir` vs `complete_dir` failure shape. The task therefore READS THE CLIENT BACK
# and asserts the wanted value actually landed, instead of trusting the POST's 2xx.
arr_torrent_client:
  sonarr:
    port: 8989
    api_base: /api/v3
    category_field: tvCategory
    category: tv
  radarr:
    port: 7878
    api_base: /api/v3
    category_field: movieCategory
    category: movies
  lidarr:
    port: 8686
    api_base: /api/v1          # Lidarr 3.1 is /api/v1; /api/v3 404s with an empty body (arr_seed note)
    category_field: musicCategory
    category: music
arr_torrent_client_name: qBittorrent      # the client name shown in each arr
arr_torrent_client_host: gluetun          # the netns owner — see the note above
arr_torrent_client_port: 8080
arr_torrent_client_user: "{{ qbit_webui_username }}"
arr_torrent_client_item: qbittorrent_api  # vault item holding the WebUI credential (field credential)
# The non-secret fields the seed writes. `apiKey` is part of the settings class but unused by qBittorrent
# (it takes basic auth) — it is sent empty so a stale placeholder from an older build cannot shadow it.
arr_torrent_client_fields:
  host: "{{ arr_torrent_client_host }}"
  port: "{{ arr_torrent_client_port }}"
  useSsl: false
  urlBase: ""
  apiKey: ""
# `type` per field, exactly as the app reports it (measured out of a live GET /downloadclient on Sonarr
# 4.0.19: textbox / checkbox / password). This is UI metadata about the settings FIELDS — the values
# come from group_vars and from 1Password, never from here. Keys carry a `_type` suffix so the secrets
# linter (which flags any `password:`/`apiKey:` key with a literal value) does not read a type NAME as
# a credential; arr-torrent-client.py strips the suffix before use.
arr_torrent_client_field_types:
  host_type: textbox
  port_type: textbox
  useSsl_type: checkbox
  urlBase_type: textbox
  apiKey_type: textbox
  username_type: textbox
  password_type: password
  tvCategory_type: textbox
  movieCategory_type: textbox
  musicCategory_type: textbox

# ---- HD-258: bulk 1Password pre-pass item sets (per-template map) ----
# The compose/config templates reference `vault: {name: {field}}` items which
# fetch-vault-pass.yml + scripts/op-vault-export.py fetch ONCE per item (one op
# spawn), replacing ~160 per-template lookups. Per-host needed set is DERIVED
# from the host's ENABLED docker_services (each contributes its template_dir's
# item names below) plus the shared glue set — a host that doesn't run a
# service never fetches (nor fails on) that service's items (e.g. pihole isn't
# on the VPS; owui-public-chat_api is a litellm glue-minted key). When a
# template gains/loses a secret, update its line here (mirrors
# docs/deployment-secrets.md).
_template_vault_items:
  authentik: {'authentik_password', 'authentik_login', 'authentik-ldap_bind', 'authentik_db'}
  db-backup: {'forgejo_db', 'immich_db', 'authentik_db', 'litellm_db'}
  crowdsec-web-ui: {'crowdsec-webui_lapi_api'}   # HD-272 LAPI watcher password (vault-dict read at render)
  forgejo: {'forgejo_db'}
  grafana: {'smtp_login', 'grafana_login'}
  headscale: {'headplane_password', 'headscale_api', 'headplane_api'}
  homelable: {'homelable_login', 'homelable_secret', 'homelable_mcp'}   # HD-45 — mcp item is catalog-created unconditionally (unused while homelable_mcp_enabled=false) so flipping the flag never needs a derive-map edit; the compose only references it in the mcp if-block
  home-assistant-standby: {'ha-vrrp_password'}
  immich-app: {'immich_oidc', 'immich-ml-internal_api', 'immich_db', 'immich-admin_login'}   # immich-admin_login is NOT a compose reference: the OIDC SEED task (tasks/immich-seed.yml) needs it and the derive set is where a missing item fails loudly (HD-147); immich_oidc likewise moved out of the compose — Immich v3 reads no OAuth env var, so the seed consumes it via lookup()
  immich-ml: {'immich-ml-internal_api'}
  kopia-agent: {'kopia_password', 'kopia-server-internal_api', 'kopia-server_fingerprint'}
  kopia-server: {'kopia_password', 'kopia-server-internal_api'}   # NB: kopia-server_fingerprint NOT fetched here — cannot exist before kopia-server first start seeds it (HD-318a); only the AGENT (oldsrv, later play) consumes it
  litellm: {'litellm_api', 'litellm_db', 'openrouter_api', 'spark-llm_api'}   # cohere_api retired 2026-09-06 (decision #23) — embed/rerank local on oldsrv RX 7600 (decision #24). HD-382: spark-llm_api → the container's OPENAI_API_KEY env, so the DB model entry carries NO key (v1.83.10 does not expand `os.environ/` in DB params; never put the literal into the Kopia-backed DB)
  lan-litellm: {'litellm_api', 'litellm_db', 'openrouter_api', 'spark-llm_api'}   # HD-356 LAN instance — same items as the VPS spine (live-found 2026-09-15: the entry was missing from this map, so the static pre-pass never fetched the items and the compose render failed fail-closed on vault['litellm_api']). HD-382: spark-llm_api for the same OPENAI_API_KEY reason
  mcp-victoriametrics: {'victoria-metrics_api'}   # HD-344 — MCP→VM basic auth (username/password)
  mcp-victorialogs: {'victoria-logs_api'}         # HD-344 — MCP→VL basic auth (username/password)
  matrix: {'matrix_api', 'matrix_password'}
  metabase: {'smtp_login'}   # RETIRED 2026-09-14 — metabase-forgejo_ro no longer consumed (db_ro keys commented out in vps.yml; source dropped).
  n8n: {'n8n-webhook_api', 'n8n_password', 'signal-internal_api', 'signal_api'}   # HD-347: SIGNAL_* env (signal-cli leg) — signal-internal_api (API token) + signal_api (number)
  onlyoffice-docs: {'onlyoffice_db', 'onlyoffice-rabbitmq_login', 'opencloud-collab_password'}
  open-webui: {'openwebui_api', 'openwebui_secret', 'owui-public-chat_api'}
  openclaw: {'openclaw_gateway_token', 'openclaw-opencloud_api'}
  pi-dev: {'pi-harness_openai_api', 'pi-harness_forgejo_api', 'tailscale_pi_dev_api'}   # HD-268 Pattern-A tailnet sidecar auth key (preauth-key, owner-seeded)
  dsh: {'dsh_api', 'dsh_forgejo_api', 'tailscale_dsh_api'}   # HD-268 Pattern-A tailnet sidecar auth key (preauth-key, owner-seeded). ⚠ All THREE items were DELETED from the vault 2026-09-27 (HD-383), so re-enabling this parked service fails closed on the vault lookup until they are re-seeded — which is the intended loud answer, not a bug in this map.
  opencloud: {'opencloud_login', 'opencloud-collab_password'}
  qdrant: {'qdrant_db'}
  pihole: {'pihole_password'}   # RETIRED 2026-09-10 — kept so a future re-enable resolves cleanly
  victoria-metrics: {'victoria-metrics_api'}   # Victoria* basic auth (HD-341/342), HYPHENATED <service>_<type>
  victoria-logs: {'victoria-logs_api'}         # Victoria* basic auth (HD-341/342)
  qbittorrent: {'privado-vpn_api', 'qbittorrent_api'}   # qbittorrent_api is NOT a compose reference: the WebUI credential is written into qBittorrent.conf by tasks/qbittorrent-seed.yml, which reads it from the bulk vault dict (the immich-seed precedent) — the derive set is where a missing item fails loudly
  aurral: []   # HD-362 — Aurral config is all IN-UI (Lidarr API, Last.fm, ListenBrainz entered in its first-run setup); no 1P items needed for the compose. lastfm_login/metabrainz_login stay as owner-reference items + docs rows. (NB: was `set()` — a Python set literal that YAML parses as the STRING "set()", polluting the derive item set with per-char fake items → op-vault-export failed on '('.)
  lidarr-ydl: {'lidarr_api'}   # HD-362 — Lidarr API key (compose). Its Web-UI login has NO vault item (measured 2026-10-07: no matching title in the 131-item vault) —
  #   first-run setup, not fetched/required by compose.
  slskd: {'slskd_login', 'soulseek_api', 'privado-vpn_api'}   # HD-362 — Soulseek login + slskd UI token + VPN client key (gluetun sidecar)
  tube-archivist: {'tube-archivist_login', 'tube-archivist_ui', 'tube-archivist-es'}   # HD-362 — login + UI/API token + ES 'elastic' bootstrap password (ELASTIC_PASSWORD env on app + ES; live-required 2026-09-14); `tube_archivist_api` stays DOCS-ONLY for the future Jellyfin plugin (not fetched)
  recyclarr: {'sonarr_api', 'radarr_api'}
  renovate: {'forgejo_api'}
  rustdesk-server: {'rustdesk_login'}   # HD-412 — the hbbs/hbbr keypair (username=public, password=secret); NOT catalog-generated (rustdesk-utils mints it, manual-value class) and NOT auto-rotatable (rotating orphans every enrolled client)
  signal-cli-rest-api: {'signal-internal_api', 'signal_api'}
  spark-ai: {'spark-llm_api'}   # HD-370: first vault item for spark (was intentionally vault-free: engine --api-key bearer auth on llm.kogler.si)
  technitium: {'technitium_login', 'technitium_api'}
  traefik: {'cloudflare_api', 'crowdsec-bouncer_api'}
  traefik-tailnet: {'crowdsec-bouncer_api', 'tailscale-sidecar_api'}   # middlewares LAPI key + sidecar auth key (HD-258)
