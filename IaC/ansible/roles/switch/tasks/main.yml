---
# switch role — CRS328-24P-4S+ configuration via REST API
# Implements: VLAN filtering, trunk port, access ports, PoE, management
#
# Connection: Uses community.routeros modules with local connection
# Auth: admin password from 1Password (mikrotik-admin_login)

- name: Refuse switch runs as ai-debug or unknown users
  assert:
    that:
      - ansible_connection == 'local' or ansible_user in ansible_admin_users
      - ansible_user is not defined or ansible_user not in ['ai-debug']
    fail_msg: >-
      switch role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}). The ai-debug user must never run Ansible.
  tags: always

# -------------------------------------------------------------------------
# Get admin password from 1Password for API authentication
# -------------------------------------------------------------------------
- name: Fetch MikroTik admin password from 1Password
  set_fact:
    routeros_api_password: "{{ lookup('community.general.onepassword', 'mikrotik-admin_login', field='password', vault=op_vault) }}"
  no_log: true

# -------------------------------------------------------------------------
# Assert-before-mutate (HD-161): read device identity once and refuse to apply
# any api_modify if the target is not the CRS328 switch we expect. Guards against
# a wrong-target or swapped-host applying switch config to the wrong gear.
# Runs once per role run, before the first api_modify below.
# -------------------------------------------------------------------------
- name: Assert device identity before any mutate (HD-161)
  community.routeros.api_facts:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    port: "{{ routeros_api_port }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    path: system identity
  register: switch_identity_facts
  tags: always

- name: Assert the API target is {{ routeros_expected_identity }}
  assert:
    that:
      - routeros_expected_identity | length > 0
      - (switch_identity_facts.data | map(attribute='name') | list | first) == routeros_expected_identity
    fail_msg: >-
      Target at {{ routeros_api_host }} reports identity
      '{{ switch_identity_facts.data | map(attribute='name') | list | first }}' —
      expected '{{ routeros_expected_identity }}'. Refusing to mutate the wrong device.
  tags: always

# -------------------------------------------------------------------------
# Ensure bridge exists with VLAN filtering
# -------------------------------------------------------------------------
- name: Ensure bridge-lan exists with VLAN filtering
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge
    handle_absent_entries: ignore
    data:
      - name: bridge-lan
        vlan-filtering: yes
        protocol-mode: none
        disabled: no
        comment: "CRS328 bridge with VLAN filtering"


# -------------------------------------------------------------------------
# Configure VLANs on bridge (tagged for trunk)
# -------------------------------------------------------------------------
- name: Configure VLAN IDs on bridge for trunk port
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge vlan
    handle_absent_entries: ignore
    data:
      - bridge: bridge-lan
        vlan-ids: "{{ item.id }}"
        tagged: "bridge-lan,{{ switch_trunk_port }}"
        comment: "{{ item.name }} VLAN"
  loop: "{{ switch_vlans }}"


# -------------------------------------------------------------------------
# Configure trunk port to router
# -------------------------------------------------------------------------
- name: Configure trunk port to router
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - interface: "{{ switch_trunk_port }}"
        bridge: bridge-lan
        pvid: 1
        comment: "Uplink to RB4011 - trunk (all VLANs tagged)"


# -------------------------------------------------------------------------
# Configure access ports with VLAN assignment from port map
# dict2items transforms dict to list of {key, value} pairs
# -------------------------------------------------------------------------
- name: Configure access port for Management VLAN (99)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - interface: "{{ item.value.port }}"
        bridge: bridge-lan
        pvid: "{{ item.value.vlan }}"
        comment: "Management port for {{ item.key }}"
  loop: "{{ switch_port_map | dict2items | list }}"
  when: item.value.vlan == 99


- name: Configure access port for Home VLAN (10)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - interface: "{{ item.value.port }}"
        bridge: bridge-lan
        pvid: "{{ item.value.vlan }}"
        comment: "Home VLAN port for {{ item.key }}"
  loop: "{{ switch_port_map | dict2items | list }}"
  when: item.value.vlan == 10


- name: Configure access port for Media VLAN (50)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - interface: "{{ item.value.port }}"
        bridge: bridge-lan
        pvid: "{{ item.value.vlan }}"
        comment: "Media VLAN port for {{ item.key }}"
  loop: "{{ switch_port_map | dict2items | list }}"
  when: item.value.vlan == 50


# -------------------------------------------------------------------------
# Configure SFP+ ports as management (VLAN 99 native)
# -------------------------------------------------------------------------
- name: Configure SFP+ ports 2-4 for management
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - interface: "sfp-sfpplus{{ item }}"
        bridge: bridge-lan
        pvid: 99
        comment: "Management (VLAN 99) - SFP+ port {{ item }}"
  loop:
    - 2
    - 3
    - 4


# -------------------------------------------------------------------------
# Configure PoE on AP ports
# -------------------------------------------------------------------------
- name: Enable PoE on AP ports
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface ethernet
    handle_absent_entries: ignore
    data:
      - default-name: "{{ item.value.port }}"
        poe-out: at-45v-fixed
        poe-priority: high
        comment: "PoE for AP: {{ item.key }}"
  loop: "{{ switch_port_map | dict2items | list }}"
  when: item.value.poe | bool


# -------------------------------------------------------------------------
# VLAN 99 interface for management
# -------------------------------------------------------------------------
- name: Ensure VLAN 99 interface exists for management
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface vlan
    handle_absent_entries: ignore
    data:
      - name: vlan99-mgmt
        vlan-id: 99
        interface: bridge-lan
        disabled: no
        comment: "Management VLAN 99"


- name: Configure management IP address
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip address
    handle_absent_entries: ignore
    data:
      - address: "{{ switch_mgmt_ip }}/24"
        interface: vlan99-mgmt
        disabled: no
        comment: "CRS328 management IP"


# -------------------------------------------------------------------------
# Management services
# -------------------------------------------------------------------------
- name: Enable REST API service
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip service
    data:
      - name: api
        disabled: no


- name: Enable WinBox/Web service
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip service
    data:
      - name: www-ssl
        disabled: no


# -------------------------------------------------------------------------
# Default route via router
# -------------------------------------------------------------------------
- name: Ensure default route via router gateway
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip route
    handle_absent_entries: ignore
    data:
      - dst-address: 0.0.0.0/0
        gateway: "{{ router_mgmt_ip }}"
        comment: "Default route via RB4011"


# -------------------------------------------------------------------------
# DNS configuration
# -------------------------------------------------------------------------
- name: Configure DNS to router
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dns
    data:
      - servers: "{{ router_mgmt_ip }}"


# -------------------------------------------------------------------------
# Configure unconfigured ports as management (default)
# -------------------------------------------------------------------------
- name: Get list of configured port names
  set_fact:
    configured_port_names: "{{ switch_port_map | dict2items | map('extract', 'value', 'port') | list }}"

- name: Set unconfigured ports to management VLAN (default)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - interface: "ether{{ item }}"
        bridge: bridge-lan
        pvid: 99
  loop: "{{ range(1, 25) | list }}"
  when: "'ether' + item|string not in configured_port_names"

# -------------------------------------------------------------------------
# Port map verification (record only — map is confirmed, see group_vars/switch.yml)
# -------------------------------------------------------------------------
- name: Document port map verification
  debug:
    msg: |
      Port map from Rack.canvas confirmed by human (group_vars/switch.yml).
      Full CRS328 access-port mapping is recorded in switch_port_map (APs, UPS,
      NAS, printer, console, media, KNX) — applied by the tasks above; any port
      not listed defaults to Management VLAN 99.