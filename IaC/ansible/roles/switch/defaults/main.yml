---
# switch role defaults

# RouterOS API connection for community.routeros modules.
# We talk to the RouterOS API over the Management VLAN (host = mgmt IP),
# authenticating as `admin` with the 1Password secret (mikrotik-admin_login).
# The old schematic modules used api_user/api_password; the community.routeros
# api_* modules instead take hostname/username/password/port.
routeros_api_port: 8728
routeros_api_host: "{{ ansible_host | default(switch_mgmt_ip) }}"
routeros_api_user: admin
routeros_tls: false

# FAIL-LOUD guard (HD-161): the real value lives in group_vars/switch.yml. If unset,
# the assert task fails rather than silently comparing against a blank identity.
routeros_expected_identity: ""

# Trunk port configuration
switch_trunk_port: sfp-sfpplus1  # Uplink to router

# Management settings (derived from SSOT network_static_hosts)
switch_mgmt_vlan: 99
# CRS328 management IP — derived from network_static_hosts (name=switch, vlan=99)
switch_mgmt_ip: "{{ (network_static_hosts | selectattr('name', '==', 'switch') | selectattr('vlan', '==', 99) | map(attribute='ip') | list | first) }}"
# Router (RB4011) management IP — derived from network_static_hosts (name=router, vlan=99)
router_mgmt_ip: "{{ (network_static_hosts | selectattr('name', '==', 'router') | selectattr('vlan', '==', 99) | map(attribute='ip') | list | first) }}"

# VLANs — derived view of the SSOT network_vlans (group_vars/all.yml), HD-200.
# Role-default fallback only; group_vars/switch.yml carries the same derivation,
# so a VLAN edit touches all.yml alone (audit H2 / iac-changes §2).
switch_vlans: "{{ network_vlans }}"

# SSOT-derived subnet lookup keyed by VLAN id (from group_vars/all.yml network_vlans) —
# same derivation as the router role defaults; used by the service lockdown
# (available-from=) + INPUT-chain mgmt rules (HD-304).
vlan_subnets: "{{ dict(network_vlans | map(attribute='id') | zip(network_vlans | map(attribute='subnet'))) }}"

# Port map - see group_vars/switch.yml for detailed configuration
# Ports without explicit configuration default to VLAN 99 (Management)
switch_port_map: {}