---
# storage role defaults — ZFS layout, properties, snapshots, NFS, push jobs.
# Single source of truth for the DATA model: docs/storage.md.
# This role runs on BOTH nas (tank/bulk, NFS server) and oldsrv (nvme,
# NFS client, push timers). It never runs on the Pi (no ZFS) — the Pi
# layout is produced by the home_assistant + docker_services roles.

# ---------------------------------------------------------------------
# Safety / bootstrap
# ---------------------------------------------------------------------
# Pools are IMPORTED, never auto-created. storage_allow_pool_create must be
# set to true explicitly and ONLY on a verified-fresh disk (no data on it).
# On reinstall-with-data, import must win — this role never destroys a pool.
storage_allow_pool_create: false

# ---------------------------------------------------------------------
# zfs_exporter — host binary on nas (no Docker), mirrors roles/nut nut_exporter.
# Metrics: zfs_pool_allocated / zfs_pool_size / zfs_pool_health per pool.
# Scrape job + port in alloy.river.j2 / group_vars/all/ (zfs_exporter_port).
# ---------------------------------------------------------------------
zfs_exporter: true
zfs_exporter_release: "v2.4.1"    # pinned — verified linux-amd64 asset; bump deliberately
zfs_exporter_platform: linux
zfs_exporter_arch: amd64
zfs_exporter_listen: ":9198"
zfs_exporter_pools:
  - tank
  - bulk

# NFS topology.
storage_nfs_server: nas.kogler.si   # resolved via /etc/hosts (network role)
# NFS export client — single SSOT source: group_vars/all/ → network_ranges
# (`nfs-clients`, rendered to docs/network-addresses-generated.md). Least privilege:
# only oldsrv's Home-VLAN IP may mount the exports.
storage_nfs_clients: "{{ (network_ranges | selectattr('name', 'equalto', 'nfs-clients') | map(attribute='cidr') | first) }}"

# uid/gid for the exported trees — the NEUTRAL shared-data owner `media` (HD-51/HD-131),
# NOT domen (1000), NOT an interactive family user. Containers running the filesystem/SMB
# shared stack (Samba shares, *arr, OpenCloud-local) run as this owner (KOPS-060 / HD-94).
# The `media` system user at this uid/gid is provisioned on nas + oldsrv (storage role).
storage_uid: "1005"
storage_gid: "1005"

# The NAMES of that same neutral account/group (created by tasks/zfs_common.yml). Samba is not
# NSS: `force user`, `force group` and the `@group` form of `valid users` are resolved by NAME,
# so a numeric id there matches NOTHING and the share fails at TREE CONNECT time, after a
# perfectly good authentication — indistinguishable from a wrong password from the client side.
# Measured 2026-10-07 on `force user = 1005` / `valid users = @1005`: every media/music mount has
# been failing this way since the shares existed, which nothing noticed because until that date no
# Samba account existed to authenticate with either. samba.yml asserts name↔id agreement.
storage_user: media
storage_group: media

# Samba (D4 / HD-131): per-user private shares + a shared media share on the NAS.
# Each family member = one LOCAL Samba account (tdbsam) with a private drive
# (`valid users = <account>`); plus a `media` shared share (any family account).
# ⚠ The Authentik-as-LDAP passdb this used to offer (D7/HD-132) is RETIRED 2026-10-07:
#   it made every LAN drive mount depend on the VPS + the WG S2S tunnel, and Authentik's
#   LDAP provider cannot answer an NTLM challenge at all (it stores PBKDF2 and serves
#   `userPassword`, never `sambaNTPassword`). Decision: docs/storage-rejected.md.
# SSOT for the family list = `storage_samba_users` in host_vars (a repo edit, not a
# directory sync), so a from-scratch rebuild converges the drives with no external pull.
# Format (name + vault_item are required; uid/shell optional):
#   [{ name: <account>, vault_item: smb-<name>_login, uid: <unixuid>, shell: <login shell> }]
#   * vault_item — 1Password item holding `username` + `password`; the converge writes the
#     password into the local passdb. Declared as a `*_item:` registry key on purpose so
#     scripts/check-vault-items.sh sees it (CONVENTIONS §2 item-reference coverage).
#   * uid        — pin only when the uid must be exact; omit = let the host allocate.
#   * shell      — omit to leave an EXISTING account's shell untouched (an interactive
#     account keeps its login shell); set /usr/sbin/nologin for a service account.
storage_samba_users: []
# Accounts whose Samba password is RE-APPLIED from 1Password on the next converge.
# Rotation path (CONVENTIONS §2 rotation propagation): a rotate alone reaches nothing,
# because writing a passdb entry is a target-side act, so rotate the item, then run the
# storage role with `-e storage_samba_password_force=<name>`. Empty = create-only, which
# is what keeps a routine converge from resetting a member's password every run.
storage_samba_password_force: []
# `valid users` of the music share. Defaults to the whole storage group in the template;
# the NAS pins it to the one shared service account (host_vars) — see docs/storage.md.
# storage_samba_music_valid_users: <account>
# Shared media share name + dataset (map to bulk/media NFS mount on the NAS).
storage_samba_media:
  share: media
  path: /tank/data/shared  # shared family tree; per-user stores live under /tank/data/users
# The arr MUSIC library, exported so a laptop can drop finished albums straight into the
# folder Lidarr actually scans (Lidarr rootFolder /media/music == this path; HD-362).
# Why a share at all: `bulk/media` is NFS-exported to oldsrv only (/bulk/media 10.10.1.30/32),
# so before this the `media` share (a DIFFERENT tree, /tank/data/shared) was the only
# Windows-visible path and every manual add needed a privileged mv on oldsrv. smb.conf gives
# it force user/group = storage_uid, so a dropped file stays media-owned and Lidarr (PUID
# 1005) can still rename/move/hardlink-import it. Layout the arr expects: <Artist>/<Album>/files.
storage_samba_music:
  share: music
  path: /bulk/media/media/music
# Root of per-user private Samba stores (SSOT for smb.conf per-user share paths).
storage_samba_users_root: /tank/data/users

# PassDB backend — tdbsam is the ONLY supported value, and it is not a knob.
# The `ldapsam` alternative (D7/HD-132) was retired 2026-10-07: it made a LAN-local drive
# mount depend on the VPS, its outpost and the WG S2S tunnel, and it can never have worked
# against Authentik anyway (no Samba attribute support → no NT hash to answer NTLM with).
# Retired here, not left as a var: a var nobody can satisfy is how the LDAP path stayed
# "almost deployed" for seven weeks while every tree connect returned ACCESS_DENIED.
# The rendered smb.conf therefore always says `passdb backend = tdbsam` and carries no
# `ldap *` directives; the secret lives only in 1Password `smb-<name>_login`, never in
# smb.conf — which is also why that file is world-readable again (0644, see samba.yml).

# ---------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------
# allow_create: false = import-only (pools live on their disks).
# true = fresh build only (oldssrv nvme pool on the 970 EVO).
storage_pools:
  - name: tank
    hosts: [nas]
    allow_create: false
    vdevs: []
  - name: bulk
    hosts: [nas]
    allow_create: false
    vdevs: []
  - name: nvme
    hosts: [oldsrv]
    allow_create: "{{ storage_allow_pool_create }}"
    # REAL device path is the SSOT var storage_nvme_data_by_id (set in host_vars/oldsrv.kogler.si.yml,
    # HD-128/KOPS-057) — never a literal here. A fail-loud guard in zfs_common.yml aborts any CREATE
    # attempt while it still points at the placeholder; import-only runs never touch it.
    vdevs: ["{{ storage_nvme_data_by_id | default('/dev/disk/by-id/UNDEFINED') }}"]
    options: { ashift: "12" }

# ---------------------------------------------------------------------
# Datasets + ZFS properties (mirrors the storage.md properties table)
# ---------------------------------------------------------------------
# Common props for every dataset (applied via community.general.zfs):
_common_zfs_props: &common
  xattr: sa
  acltype: posixacl
  atime: "off"

storage_datasets:
  # --- nas pool "tank" — user data (BACKED UP) ---
  # (immich + documents datasets trimmed HD-151: originals/user-files on the live
  #  Hetzner Box; offline copies were a retained archive — Box + Kopia is recovery.)
  - { name: tank/data,            props: { canmount: off, mountpoint: none } }
  - { name: tank/data/services,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: tank/data/db-dumps,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  # --- nas pool "bulk" — MIXED: active media (unbacked) + replicas + thumbs ---
  - { name: bulk/media,           props: { recordsize: 1M,   compression: lz4,  <<: *common } }
  - { name: bulk/data,            props: { canmount: off, mountpoint: none } }
  - { name: bulk/data/services,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: bulk/data/db-dumps,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: bulk/data/immich-thumbs, props: { recordsize: 128K, compression: lz4, mountpoint: /bulk/data/immich-thumbs, <<: *common } }  # kept (HD-151): nightly face-thumbnail push target — explicit mountpoint (parent bulk/data is mountpoint=none; NFS export target, live-found 2026-09-03)
  # --- oldsrv pool "nvme" — compute-host data (NAS-backed or regenerable) ---
  - { name: nvme/docker-layers,   props: { recordsize: 128K, compression: lz4, atime: "off", mountpoint: /var/lib/docker } }
  - { name: nvme/docker,          props: { canmount: off, mountpoint: none } }
  - { name: nvme/docker/immich,   props: { recordsize: 128K, compression: lz4, atime: "off", mountpoint: /srv/docker/immich } }  # kept (HD-151): immich-ml reads thumbs here
  - { name: nvme/docker/services, props: { recordsize: 128K, compression: zstd, atime: "off", mountpoint: /srv/docker/services } }
  - { name: nvme/models,          props: { recordsize: 128K, compression: off, atime: "off", mountpoint: /srv/models } }
  - { name: nvme/dumps,           props: { recordsize: 128K, compression: zstd, atime: "off", mountpoint: /srv/dumps } }

# Hosts allowed per pool (used to skip irrelevant datasets per host at runtime).
# Simplified: the tasks apply the full list and ignore 'dataset missing pool'
# failures on hosts that don't own the pool (see tasks/zfs_common.yml).
storage_own_pools:
  nas: [tank, bulk]
  oldsrv: [nvme]
  pi: []

# ---------------------------------------------------------------------
# Snapshots (sanoid) — cadence per dataset. sanoid.timer runs every 5 min.
# (The 5-min fine-grained `documents` tier was dropped with the dataset — HD-151.)
# ---------------------------------------------------------------------
storage_sanoid:
  templates:
    data:            { frequently: 0,  hourly: 24, daily: 7, weekly: 4, monthly: 3 }
    thumbs:          { frequently: 0,  hourly: 0,  daily: 7, weekly: 0, monthly: 0 }   # immich-thumbs (bulk)
    none:            { autosnap: "no", autoprune: "no" }
  datasets:
    tank/data/services:      data
    tank/data/db-dumps:      data
    bulk/data/services:      data          # replicas keep the same cadence
    bulk/data/db-dumps:      data
    bulk/data/immich-thumbs: thumbs
    bulk/media:              none          # unbacked — never snapshotted

# ---------------------------------------------------------------------
# Replication (syncoid) — source → target pairs on nas.
# Timers check every 15 min; a send happens only when a new snapshot exists
# (≈ hourly for services/db-dumps).
# ---------------------------------------------------------------------
storage_replication:
  - { source: tank/data/services,   target: bulk/data/services }
  - { source: tank/data/db-dumps,   target: bulk/data/db-dumps }

# ---------------------------------------------------------------------
# NFS exports (nas) and client mounts (oldsrv) — see storage.md.
# ---------------------------------------------------------------------
storage_exports:
  - { path: /tank/data, clients: "{{ storage_nfs_clients }}", options: "rw,sync,no_subtree_check,root_squash,anonuid={{ storage_uid }},anongid={{ storage_gid }}" }
  - { path: /bulk/media, clients: "{{ storage_nfs_clients }}", options: "rw,sync,no_subtree_check,root_squash,anonuid={{ storage_uid }},anongid={{ storage_gid }}" }
  - { path: /bulk/data/immich-thumbs, clients: "{{ storage_nfs_clients }}", options: "rw,sync,no_subtree_check,root_squash,anonuid={{ storage_uid }},anongid={{ storage_gid }}" }

storage_nfs_mounts:
  - { src: "{{ storage_nfs_server }}:/tank/data",        path: /mnt/nas/data,  opts: "nfsvers=4.2,hard,intr,nofail,x-systemd.automount,noatime" }
  - { src: "{{ storage_nfs_server }}:/bulk/media",       path: /mnt/nas/media, opts: "nfsvers=4.2,hard,intr,nofail,x-systemd.automount,noatime" }
  - { src: "{{ storage_nfs_server }}:/bulk/data/immich-thumbs", path: /mnt/nas/thumbs, opts: "nfsvers=4.2,hard,intr,nofail,x-systemd.automount,noatime" }

# ---------------------------------------------------------------------
# Nightly push leg (oldsrv → nas): DB dumps this host owns. Schedules are systemd
# OnCalendar specs. Two sibling legs (push-services, push-face-thumbs) were REMOVED
# 2026-09-28 (HD-468) — their payloads live on the vps, where no push path exists yet;
# see docs/backup.md rather than re-adding them here.
# ---------------------------------------------------------------------
# expected_source is asserted before the rsync: writing a backup into a directory whose
# automount silently failed is how you get a green timer and no off-host copy.
storage_push_db_dumps:
  src: /srv/dumps
  target: /mnt/nas/data/db-dumps
  oncalendar: "*-*-* 03:35:00"
  expected_source: "nas.kogler.si:/tank/data"
  keep: 14                      # local retention per container; the NAS keeps its own history
# Every Postgres this host runs. Adding a service means adding a row here — the leg fails
# loudly on an EMPTY list, because a configured-to-dump-nothing leg looks identical to a
# working one from the outside.
storage_push_db_dumps_pg:
  - { container: lan-litellm-db, db_user: litellm }

# Kopia wiring (oldsrv): sources already exist as dirs above; policies are
# configured in the kopia-agent container config — this role only guarantees
# the paths exist and comments the intended policy in storage.md.