---
# storage role defaults — ZFS layout, properties, snapshots, NFS, push jobs.
# Single source of truth for the DATA model: docs/storage-zfs.md.
# This role runs on BOTH nas (tank/bulk, NFS server) and oldsrv (nvme,
# NFS client, push timers). It never runs on the Pi (no ZFS) — the Pi
# layout is produced by the home_assistant + docker_services roles.

# ---------------------------------------------------------------------
# Safety / bootstrap
# ---------------------------------------------------------------------
# Pools are IMPORTED, never auto-created. storage_allow_pool_create must be
# set to true explicitly and ONLY on a verified-fresh disk (no data on it).
# On reinstall-with-data, import must win — this role never destroys a pool.
storage_allow_pool_create: false

# ---------------------------------------------------------------------
# zfs_exporter — host binary on nas (no Docker), mirrors roles/nut nut_exporter.
# Metrics: zfs_pool_allocated / zfs_pool_size / zfs_pool_health per pool.
# Scrape job + port in prometheus.yml.j2 / group_vars/all.yml (zfs_exporter_port).
# ---------------------------------------------------------------------
zfs_exporter: true
zfs_exporter_release: "v2.4.1"    # pinned — verified linux-amd64 asset; bump deliberately
zfs_exporter_platform: linux
zfs_exporter_arch: amd64
zfs_exporter_listen: ":9198"
zfs_exporter_pools:
  - tank
  - bulk

# NFS topology.
storage_nfs_server: nas.kogler.si   # resolved via /etc/hosts (network role)
# NFS export client — single SSOT source: group_vars/all.yml → network_ranges
# (`nfs-clients`, rendered to docs/network-addresses.md). Least privilege:
# only oldsrv's Home-VLAN IP may mount the exports.
storage_nfs_clients: "{{ (network_ranges | selectattr('name', 'equalto', 'nfs-clients') | map(attribute='cidr') | first) }}"

# uid/gid for the exported trees — the NEUTRAL shared-data owner `media` (HD-51/HD-131),
# NOT domen (1000), NOT an interactive family user. Containers running the filesystem/SMB
# shared stack (Samba shares, *arr, OpenCloud-local) run as this owner (KOPS-060 / HD-94).
# The `media` system user at this uid/gid is provisioned on nas + oldsrv (storage role).
storage_uid: "1005"
storage_gid: "1005"

# Samba (D4 / HD-131): per-user private shares + a shared media share on the NAS.
# Each family member = one Samba account with a private home share (valid users = that
# account); plus a `media` shared share (any family user). The family-user list is filled
# when the family Linux/OpenCloud accounts are defined (HD-51 desktop auth); empty now.
# Format: [{ name: <sambauser>, uid: <unixuid>, share: <dataset-shares>, home: <dataset> }]
storage_samba_users: []
# Shared media share name + dataset (map to bulk/media NFS mount on the NAS).
storage_samba_media:
  share: media
  path: /tank/data/shared  # shared family tree; per-user stores live under /tank/data/users
# Root of per-user private Samba stores (SSOT for smb.conf per-user share paths).
storage_samba_users_root: /tank/data/users

# ---- Authentik-as-LDAP passdb (D7/HD-132) — Samba pulls auth from Authentik LDAP outpost ----
# Samba is an LDAP *client* (pull): Authentik is the SSOT and does NOT push. The LDAP outpost
# runs on oldsrv (where Authentik runs) beside the main server; Samba on nas reaches it over
# the Home VLAN. host derived from the address SSOT (oldsrv). These are design constants
# (chosen when the Authentik LDAP provider is created) — see docs/deployment-compose.md HD-132.
# The bind *password* is the secret: 1Password `authentik-ldap_bind` (field=password).
storage_samba_ldap:
  host: "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"
  port: 3389                 # LAN LDAP port for the ak-outpost-ldap (non-privileged; avoids 389 clash)
  base_dn: "DC=home,DC=kogler,DC=si"
  user_suffix: "OU=Users,DC=home,DC=kogler,DC=si"
  admin_dn: "CN=svc_samba,OU=Users,DC=home,DC=kogler,DC=si"   # service bind DN (HD-132)
  ssl: "start tls"           # or "off" only if LDAP outpost is LAN-internal + restricted

# ---------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------
# allow_create: false = import-only (pools live on their disks).
# true = fresh build only (oldssrv nvme pool on the 970 EVO).
storage_pools:
  - name: tank
    hosts: [nas]
    allow_create: false
    vdevs: []
  - name: bulk
    hosts: [nas]
    allow_create: false
    vdevs: []
  - name: nvme
    hosts: [oldsrv]
    allow_create: "{{ storage_allow_pool_create }}"
    vdevs: ["/dev/disk/by-id/<970_EVO_SERIAL>"]   # TODO: fill real by-id at deployment
    options: { ashift: "12" }

# ---------------------------------------------------------------------
# Datasets + ZFS properties (mirrors the storage-zfs.md properties table)
# ---------------------------------------------------------------------
# Common props for every dataset (applied via community.general.zfs):
_common_zfs_props: &common
  xattr: sa
  acltype: posixacl
  atime: "off"

storage_datasets:
  # --- nas pool "tank" — user data (BACKED UP) ---
  - { name: tank/data,            props: { canmount: off, mountpoint: none } }
  - { name: tank/data/immich,     props: { recordsize: 1M,   compression: lz4,  <<: *common } }
  - { name: tank/data/documents,  props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: tank/data/services,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: tank/data/db-dumps,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  # --- nas pool "bulk" — MIXED: active media (unbacked) + replicas + thumbs ---
  - { name: bulk/media,           props: { recordsize: 1M,   compression: lz4,  <<: *common } }
  - { name: bulk/data,            props: { canmount: off, mountpoint: none } }
  - { name: bulk/data/immich,     props: { recordsize: 1M,   compression: lz4,  <<: *common } }
  - { name: bulk/data/documents,  props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: bulk/data/services,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: bulk/data/db-dumps,   props: { recordsize: 128K, compression: zstd, <<: *common } }
  - { name: bulk/data/immich-thumbs, props: { recordsize: 128K, compression: lz4, <<: *common } }
  # --- oldsrv pool "nvme" — compute-host data (NAS-backed or regenerable) ---
  - { name: nvme/docker-layers,   props: { recordsize: 128K, compression: lz4, atime: "off", mountpoint: /var/lib/docker } }
  - { name: nvme/docker,          props: { canmount: off, mountpoint: none } }
  - { name: nvme/docker/postgres, props: { recordsize: 8K,   compression: lz4, atime: "off", mountpoint: /srv/docker/postgres } }
  - { name: nvme/docker/immich,   props: { recordsize: 128K, compression: lz4, atime: "off", mountpoint: /srv/docker/immich } }
  - { name: nvme/docker/services, props: { recordsize: 128K, compression: zstd, atime: "off", mountpoint: /srv/docker/services } }
  - { name: nvme/tsdb,            props: { recordsize: 16K,  compression: lz4, atime: "off", mountpoint: /srv/tsdb } }
  - { name: nvme/models,          props: { recordsize: 128K, compression: off, atime: "off", mountpoint: /srv/models } }
  - { name: nvme/dumps,           props: { recordsize: 128K, compression: zstd, atime: "off", mountpoint: /srv/dumps } }

# Hosts allowed per pool (used to skip irrelevant datasets per host at runtime).
# Simplified: the tasks apply the full list and ignore 'dataset missing pool'
# failures on hosts that don't own the pool (see tasks/zfs_common.yml).
storage_own_pools:
  nas: [tank, bulk]
  oldsrv: [nvme]
  pi: []

# ---------------------------------------------------------------------
# Snapshots (sanoid) — cadence per dataset. sanoid.timer runs every 5 min
# so the `frequently` tier means 5-min snapshots (documents: 96 = 8 h).
# ---------------------------------------------------------------------
storage_sanoid:
  templates:
    data:            { frequently: 0,  hourly: 24, daily: 7, weekly: 4, monthly: 3 }
    documents:       { frequently: 96, hourly: 24, daily: 7, weekly: 4, monthly: 3 }
    thumbs:          { frequently: 0,  hourly: 0,  daily: 7, weekly: 0, monthly: 0 }
    none:            { autosnap: "no", autoprune: "no" }
  datasets:
    tank/data/immich:        data
    tank/data/documents:     documents
    tank/data/services:      data
    tank/data/db-dumps:      data
    bulk/data/immich:        data          # replicas keep the same cadence
    bulk/data/documents:     documents
    bulk/data/services:      data
    bulk/data/db-dumps:      data
    bulk/data/immich-thumbs: thumbs
    bulk/media:              none          # unbacked — never snapshotted

# ---------------------------------------------------------------------
# Replication (syncoid) — source → target pairs on nas.
# Timers check every 15 min; a send happens only when a new snapshot exists
# (≈5 min for documents, ≈hourly otherwise).
# ---------------------------------------------------------------------
storage_replication:
  - { source: tank/data/immich,     target: bulk/data/immich }
  - { source: tank/data/documents,  target: bulk/data/documents }
  - { source: tank/data/services,   target: bulk/data/services }
  - { source: tank/data/db-dumps,   target: bulk/data/db-dumps }

# ---------------------------------------------------------------------
# NFS exports (nas) and client mounts (oldsrv) — see storage-zfs.md.
# ---------------------------------------------------------------------
storage_exports:
  - { path: /tank/data, clients: "{{ storage_nfs_clients }}", options: "rw,sync,no_subtree_check,root_squash,anonuid={{ storage_uid }},anongid={{ storage_gid }}" }
  - { path: /bulk/media, clients: "{{ storage_nfs_clients }}", options: "rw,sync,no_subtree_check,root_squash,anonuid={{ storage_uid }},anongid={{ storage_gid }}" }
  - { path: /bulk/data/immich-thumbs, clients: "{{ storage_nfs_clients }}", options: "rw,sync,no_subtree_check,root_squash,anonuid={{ storage_uid }},anongid={{ storage_gid }}" }

storage_nfs_mounts:
  - { src: "{{ storage_nfs_server }}:/tank/data",        path: /mnt/nas/data,  opts: "nfsvers=4.2,hard,intr,nofail,x-systemd.automount,noatime" }
  - { src: "{{ storage_nfs_server }}:/bulk/media",       path: /mnt/nas/media, opts: "nfsvers=4.2,hard,intr,nofail,x-systemd.automount,noatime" }
  - { src: "{{ storage_nfs_server }}:/bulk/data/immich-thumbs", path: /mnt/nas/thumbs, opts: "nfsvers=4.2,hard,intr,nofail,x-systemd.automount,noatime" }

# ---------------------------------------------------------------------
# Nightly push jobs (oldsrv → nas). Schedules are systemd OnCalendar specs.
# ---------------------------------------------------------------------
# 1) DB dump scratch → tank/data/db-dumps (runs after tiredofit/db-backup).
storage_push_db_dumps: { src: /srv/dumps, target: /mnt/nas/data/db-dumps, oncalendar: "*-*-* 03:35:00" }
# 2) Service state (Forgejo dump, n8n sqlite backup) → tank/data/services.
storage_push_services: { src: /srv/docker/services, target: /mnt/nas/data/services, oncalendar: "*-*-* 04:00:00",
                         scripts: "/usr/local/sbin/storage-push-services.sh" }
# 3) Immich face thumbnails → bulk/data/immich-thumbs. Over NFS like the other
#    two jobs (third export + /mnt/nas/thumbs mount) — no ssh key, no extra secret.
storage_push_face_thumbs: { src: /srv/docker/immich/upload/thumbs, target: /mnt/nas/thumbs, oncalendar: "*-*-* 04:30:00", pattern: "face*" }

# Kopia wiring (oldsrv): sources already exist as dirs above; policies are
# configured in the kopia-agent container config — this role only guarantees
# the paths exist and comments the intended policy in storage-zfs.md.