---
# Samba (SMB/CIFS) shares on the NAS — D4 / HD-131 family-access model.
#
#   - ONE shared media share (any family user can map `\\nas\media`).
#   - ONE private share per family member (`\\nas\<user>`, valid users = that account;
#     other members cannot map it) once storage_samba_users is populated (HD-51 accounts).
#
# Per-user isolation is enforced by Samba `valid users`, NOT by POSIX uid on the NAS
# filesystem (the shared tree is owned by the neutral `media`/storage_uid account).
# Family members log in with a manual username+password at mount time (no 1Password SSO);
# 1Password only stores the passwords.
#
# Runs on nas (the storage host that owns the shared datasets). The per-user + shared
# trees live under /tank/data (a ZFS dataset owned by storage_uid/storage_gid).

- name: Install Samba
  ansible.builtin.apt:
    name: samba
    state: present
    update_cache: true

- name: Create shared-media Samba tree (owned by neutral media account)
  ansible.builtin.file:
    path: "{{ storage_samba_media.path }}"
    state: directory
    owner: "{{ storage_uid }}"
    group: "{{ storage_gid }}"
    mode: "0775"
  when: storage_samba_media.path | length > 0

# Per-user private trees (created only when the family-user list is populated, HD-51).
- name: Create per-user Samba private trees
  ansible.builtin.file:
    path: "{{ storage_samba_users_root }}/{{ item.name }}"
    state: directory
    owner: "{{ item.uid | default(storage_uid) }}"
    group: "{{ storage_gid }}"
    mode: "0700"
  loop: "{{ storage_samba_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: storage_samba_users | length > 0

- name: Render smb.conf (per-user + shared media shares)
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0600"   # contains the Authentik-LDAP bind password (D7/HD-132) — not world-readable
  notify: Restart Samba

# Create/update each family Samba user's account — IDEMPOTENT (CONVENTIONS §3): only
# provision/password when the Samba account is absent, so re-runs don't churn or error.
# Password via 1Password at deploy (mount uses username+password manually, D4).
- name: Probe which family Samba users are absent (idempotency guard)
  ansible.builtin.shell: "pdbedit -L | grep -qw '{{ item.name }}' && echo present || echo absent"
  changed_when: false
  register: _smb_exist
  loop: "{{ storage_samba_users }}"
  loop_control:
    label: "probe {{ item.name }}"
  when: storage_samba_users | length > 0
  tags: [samba, storage]

- name: Ensure each family Samba user account exists (only when absent)
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    uid: "{{ item.item.uid | default(omit) }}"
    groups: "{{ storage_gid }}"
    append: true
    shell: /usr/sbin/nologin
    create_home: false
  loop: "{{ _smb_exist.results }}"
  when:
    - storage_samba_users | length > 0
    - (item.stdout | trim) == 'absent'
  tags: [samba, storage]
# NO Samba-password task here (D7/HD-132): Samba auths family members against
# Authentik-as-LDAP (passdb = ldapsam). Authentik is the SSOT and does NOT push;
# Samba pulls, so a user changes their own password in the portal and the next
# mount picks it up. We never write a local smbpasswd password — writing one would
# shadow/overwrite the LDAP credential and break self-service.

# ---------------------------------------------------------------------------
# Authentik → NAS/OpenCloud provisioning glue (D5/HD-131). Runs on nas via a
# systemd timer: reads the Authentik 'family' group and provisions NAS user +
# dataset + Samba account (+ OpenCloud) for each new member. The `op` CLI must be
# available+authd at run time (1Password). auth token from 'authentik-nas_api'.
# ---------------------------------------------------------------------------
- name: Render Authentik→NAS sync script + units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ '/usr/local/sbin/sync-authentik-users.sh' if item == 'sync-authentik-users.sh.j2' else '/etc/systemd/system/' + item | replace('.j2','') }}"
    mode: "{{ '0755' if item == 'sync-authentik-users.sh.j2' else '0644' }}"
  loop:
    - sync-authentik-users.sh.j2
    - sync-authentik-users.service.j2
    - sync-authentik-users.timer.j2
  tags: [samba, storage, auth-glue]
  notify: Reload systemd

- name: Enable+start Authentik→NAS sync timer
  ansible.builtin.systemd:
    name: sync-authentik-users.timer
    daemon_reload: true
    enabled: true
    state: started
  tags: [samba, storage, auth-glue]