---
# Samba (SMB/CIFS) shares on the NAS — D4 / HD-131 family-access model.
#
#   - ONE shared media share (any family user can map `\\nas\media`).
#   - ONE private share per family member (`\\nas\<user>`, valid users = that account;
#     other members cannot map it) once storage_samba_users is populated (HD-51 accounts).
#
# Per-user isolation is enforced by Samba `valid users`, NOT by POSIX uid on the NAS
# filesystem (the shared tree is owned by the neutral `media`/storage_uid account).
# Family members log in with a manual username+password at mount time (no 1Password SSO);
# 1Password only stores the passwords.
#
# Runs on nas (the storage host that owns the shared datasets). The per-user + shared
# trees live under /tank/data (a ZFS dataset owned by storage_uid/storage_gid).

- name: Install Samba
  ansible.builtin.apt:
    name: samba
    state: present
    update_cache: true

- name: Create shared-media Samba tree (owned by neutral media account)
  ansible.builtin.file:
    path: "{{ storage_samba_media.path }}"
    state: directory
    owner: "{{ storage_uid }}"
    group: "{{ storage_gid }}"
    mode: "0775"
  when: storage_samba_media.path | length > 0

# Per-user private trees (created only when the family-user list is populated, HD-51).
- name: Create per-user Samba private trees
  ansible.builtin.file:
    path: "/tank/data/users/{{ item.name }}"
    state: directory
    owner: "{{ storage_uid }}"
    group: "{{ storage_gid }}"
    mode: "0770"
  loop: "{{ storage_samba_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: storage_samba_users | length > 0

- name: Render smb.conf (per-user + shared media shares)
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Samba

# Create/update each Samba user's account. Password is provided via 1Password by the
# operator at deploy time (1Password stores it; the mount uses username+password manually).
- name: Ensure each family Samba user account exists
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid | default(omit) }}"
    groups: "{{ storage_gid }}"
    append: true
    shell: /usr/sbin/nologin
    create_home: false
  loop: "{{ storage_samba_users }}"
  when: storage_samba_users | length > 0

- name: Set Samba password for each family user (from 1Password)
  ansible.builtin.shell: |
    printf '%s\n%s\n' "{{ lookup('community.general.onepassword', item.name ~ '-samba_login', field='password', vault=op_vault) }}" \
      "{{ lookup('community.general.onepassword', item.name ~ '-samba_login', field='password', vault=op_vault) }}" \
      | smbpasswd -s -a "{{ item.name }}"
  changed_when: true
  loop: "{{ storage_samba_users }}"
  loop_control:
    label: "{{ item.name }} (smbpasswd)"
  when: storage_samba_users | length > 0