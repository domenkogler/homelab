---
# nas: sanoid snapshots, syncoid replication, NFS exports.
# (ZFS datasets/properties already applied in zfs_common.yml.)

# ---------------------------------------------------------------------------
# sanoid — snapshot schedules (sanoid.conf from storage_sanoid map)
# ---------------------------------------------------------------------------
- name: Ensure /etc/sanoid exists
  ansible.builtin.file:
    path: /etc/sanoid
    state: directory
    mode: '0755'
  tags: [storage, nas]

- name: Render sanoid.conf
  ansible.builtin.template:
    src: sanoid.conf.j2
    dest: /etc/sanoid/sanoid.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart sanoid timers
  tags: [storage, nas]

- name: sanoid timer — every 5 min (so `frequently` = 5-min snapshots)
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Sanoid ZFS snapshot pruning/capture

      [Timer]
      OnCalendar=*:0/5
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/sanoid.timer
    mode: "0644"
  notify: Restart sanoid timers
  tags: [storage, nas]

# The Debian `sanoid` package ships NO unit file, so the unit below is the only thing that ever
# runs sanoid here. Its ExecStart must name `/usr/sbin/sanoid` — where the package installs the
# binary — because a wrong path fails the fire with `status=203/EXEC` BEFORE sanoid runs, which no
# idempotent converge can see: the recap stays `failed=0` while ZFS policy snapshots silently stop
# existing. A unit that runs is proved by its last-fire result plus a fresh policy snapshot, never
# by the recap (the same trap as `syncoid`'s rc 0). The package's `/etc/cron.d/sanoid` does not
# cover for the timer either: its command is guarded by `[ ! -d /run/systemd/system ]`, so it
# self-skips on any systemd boot — the timer, not cron, is the scheduler.
- name: Sanoid oneshot service (no .service shipped by distro package)
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Run sanoid (snapshot + prune)

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/sanoid --cron
    dest: /etc/systemd/system/sanoid.service
    mode: "0644"
  notify: Restart sanoid timers
  tags: [storage, nas]

# ---------------------------------------------------------------------------
# The distro zfs-share unit owns NOTHING here, and it is disabled:
#   * NFS: no dataset sets `sharenfs` (all `off`), so `zfs share -a` exports nothing — the export
#     table is /etc/exports, rendered from `storage_exports` and applied by `exportfs -ra` (the
#     Reload NFS exports handler below + nfs-server's own `exportfs -r` at boot).
#   * SMB: the shares come from the rendered smb.conf (samba.yml), not from ZFS `sharesmb`.
# The unit still exits 1 every boot because the migration-remnant datasets under `bulk/migrate`
# carry `sharesmb=on` and their share creation fails — a red `--failed` row that hides nothing but
# is not this layout's business. Disabling it is the ruled state; re-enabling it would re-arm a
# unit whose working half is a no-op and whose failing half names datasets this role does not own.
# ---------------------------------------------------------------------------
- name: Disable the distro zfs-share unit (exports belong to /etc/exports, shares to smb.conf)
  ansible.builtin.systemd:
    name: zfs-share.service
    enabled: false
    state: stopped
    daemon_reload: true
  tags: [storage, nas]

# Disabling does not empty `systemctl list-units --failed`: systemd keeps the failure result of a
# unit it is no longer running until something resets it, so a ruled-off unit stays red in the list
# forever and the one honest red signal on this host stops meaning anything. Read first, reset only
# when the marker is actually there — `reset-failed` on a unit systemd has never loaded exits 1.
- name: Read whether the disabled zfs-share unit still holds a failed marker
  ansible.builtin.command: systemctl is-failed zfs-share.service
  register: _zfs_share_failed
  changed_when: false
  failed_when: false
  tags: [storage, nas]

- name: Clear the failed marker the disabled zfs-share unit leaves in --failed
  ansible.builtin.command: systemctl reset-failed zfs-share.service
  when: _zfs_share_failed.stdout | trim == 'failed'
  changed_when: true
  tags: [storage, nas]

# ---------------------------------------------------------------------------
# syncoid — incremental replication tank/data/* → bulk/data/*
# ---------------------------------------------------------------------------
- name: Render syncoid run script
  ansible.builtin.template:
    src: syncoid-run.sh.j2
    dest: /usr/local/sbin/storage-syncoid.sh
    owner: root
    group: root
    mode: "0755"
  tags: [storage, nas]

- name: syncoid oneshot service
  ansible.builtin.template:
    src: syncoid.service.j2
    dest: /etc/systemd/system/storage-syncoid.service
    mode: "0644"
  notify: Restart syncoid timer
  tags: [storage, nas]

- name: syncoid timer — check every 15 min, send on new snapshot
  ansible.builtin.template:
    src: syncoid.timer.j2
    dest: /etc/systemd/system/storage-syncoid.timer
    mode: "0644"
  notify: Restart syncoid timer
  tags: [storage, nas]

- name: Enable+start sanoid + syncoid timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - sanoid.timer
    - storage-syncoid.timer
  tags: [storage, nas]

# ---------------------------------------------------------------------------
# NFS server — export tank/data + bulk/media
# ---------------------------------------------------------------------------
- name: Resolve NFS client CIDR (SSOT -> concrete /etc/exports value)
  ansible.builtin.set_fact:
    _nfs_clients: "{{ storage_nfs_clients }}"
  tags: [storage, nas]

- name: Render /etc/exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports
  tags: [storage, nas]

- name: Ensure nfs-kernel-server runs
  ansible.builtin.systemd:
    name: nfs-server.service
    enabled: true
    state: started
  tags: [storage, nas]

# The media library subtree under bulk/media is NOT provisioned by ZFS dataset creation: a fresh
# converge finds /bulk/media EMPTY and every *arr/jellyfin bind-mount fails with 'mkdir ...
# permission denied' (root_squash maps root to storage_uid). Canonical layout is created below.
- name: Ensure media library layout under /bulk/media
  ansible.builtin.file:
    path: "/bulk/media/{{ item }}"
    state: directory
    owner: "{{ storage_uid }}"
    group: "{{ storage_gid }}"
    mode: "0755"
  loop:
    - media
    - media/movies
    - media/tv
    - media/music
    - downloads
    - downloads/complete
    - downloads/complete/tv
    - downloads/complete/movies
    - downloads/complete/music
    - downloads/incomplete
    # ⚠ Not cosmetic, and not slskd's job: slskd VALIDATES SLSKD_INCOMPLETE_DIR at startup, refuses
    # to run if it is missing and exits 0 while doing so, so `docker ps` shows `Restarting (0)` with
    # no non-zero code to catch. Create it here, storage_uid-owned, before that service starts.
    - downloads/incomplete/music
  tags: [storage, nas]