---
# Shared ZFS tasks: import/create pools, apply datasets + properties.
# IMPORT-FIRST rule: on an existing machine pools are imported, never created.
# storage_allow_pool_create must be true for a fresh-build create (see defaults).
# Host identity uses the SHORT name (nas / oldsrv) to match defaults keys.

- name: Host short name
  ansible.builtin.set_fact:
    _host_short: "{{ inventory_hostname_short | lower }}"

# Neutral shared-data owner `media` (HD-51 / HD-131 D4): owns all shared NAS datasets,
# NFS/SMB exports (anonuid/anongid), and the filesystem/SMB-backed service containers
# (*arr, OpenCloud-local). uid/gid come from storage_uid/storage_gid (default 1005),
# matching the NFS root_squash anonuid/anongid so exported trees align.
- name: Create neutral shared-data group (media, storage_gid)
  ansible.builtin.group:
    name: media
    system: true
    gid: "{{ storage_gid }}"
  when: storage_uid is defined and storage_gid is defined

- name: Create neutral shared-data user (media, storage_uid) in the media group
  ansible.builtin.user:
    name: media
    system: true
    uid: "{{ storage_uid }}"
    group: media
    shell: /usr/sbin/nologin
    create_home: false
  when: storage_uid is defined and storage_gid is defined

# ---------------------------------------------------------------------------
# Pools — presence check
# ---------------------------------------------------------------------------
- name: Check pools present on this host
  ansible.builtin.command: zpool list -H -o name {{ item.name }}
  changed_when: false
  failed_when: false
  register: _pool_list
  loop: "{{ storage_pools }}"
  loop_control:
    label: "{{ item.name }}"

# ---------------------------------------------------------------------------
# Pools — import (no mount yet; data untouched)
# ---------------------------------------------------------------------------
- name: Import pool (no mount yet) — never touches data
  ansible.builtin.command: zpool import -N {{ item.item.name }}
  changed_when: false
  register: _pool_import
  loop: "{{ _pool_list.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.rc | default(0)) != 0
    - item.item.name in storage_own_pools[_host_short] | default([])
    - not (item.item.allow_create | default(false))   # fresh-build create: skip import — the create task owns a missing pool

# ---------------------------------------------------------------------------
# Pools — fail hard unless a fresh build explicitly allows creating the pool
# ---------------------------------------------------------------------------
- name: Refuse to create a missing pool (import failed, no explicit fresh build)
  ansible.builtin.fail:
    msg: >-
      Pool {{ item.item.name }} is missing and could not be imported.
      Refusing to create it — this must never overwrite data. On a VERIFIED
      fresh disk set storage_allow_pool_create=true and provide vdevs in
      storage_pools.
  loop: "{{ _pool_list.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.rc | default(0)) != 0
    - item.item.name in storage_own_pools[_host_short] | default([])
    - not (item.item.allow_create | default(false))

- name: Refuse CREATE when a pool vdev still carries a placeholder device (HD-128/KOPS-057)
  ansible.builtin.fail:
    msg: >-
      Pool {{ item.item.name }} is set for fresh-build creation but its vdev
      resolves to a placeholder device path -- {{ item.item.vdevs | join(', ') }}.
      Fill the REAL /dev/disk/by-id path (SSOT: storage_nvme_data_by_id in
      host_vars/oldsrv.kogler.si.yml, read from the deployed host) before creating.
      Never create a pool against an unresolved/UNDEFINED device.
  loop: "{{ _pool_list.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.rc | default(0)) != 0
    - item.item.allow_create | default(false)
    - item.item.name in storage_own_pools[_host_short] | default([])
    - (item.item.vdevs | join(' ')) is search('UNDEFINED|<|>') or (item.item.vdevs | length) == 0

- name: Create pool (fresh build — explicitly allowed)
  community.general.zpool:
    name: "{{ item.item.name }}"
    state: present
    vdevs: "{{ item.item.vdevs }}"
    force: no
  loop: "{{ _pool_list.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.rc | default(0)) != 0
    - item.item.allow_create | default(false)
    - item.item.vdevs | length > 0

# ---------------------------------------------------------------------------
# Datasets + properties — apply the storage.md table (all pools this host
# owns; community.general.zfs also re-applies missing props on existing data)
# ---------------------------------------------------------------------------
- name: Apply datasets + properties
  community.general.zfs:
    name: "{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.props }}"
  loop: "{{ storage_datasets }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name.split('/')[0] in storage_own_pools[_host_short] | default([])

# ---------------------------------------------------------------------------
# Mount everything of the imported pools (after datasets exist)
# ---------------------------------------------------------------------------
- name: Mount all datasets (zfs mount -a)
  ansible.builtin.command: zfs mount -a
  changed_when: false