---
# storage role — ZFS layout, snapshots/replication, NFS, push timers.
# Spec/data model SSOT: docs/storage.md. Style mirrors roles/nut.
#
# Hosts:
#   nas     — import tank/bulk, datasets+properties, sanoid/syncoid, NFS exports
#   oldsrv  — import/create nvme, datasets+properties, NFS client mounts,
#             nightly push timers (db dumps / service state / face thumbs)
#   pi      — no-op (layout handled by home_assistant + docker_services roles)
#
# Must run AFTER `network` (VLANs, /etc/hosts) and BEFORE `docker_services`
# (containers mount the NFS shares / bind mounts).

- name: Refuse storage runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      storage role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Install ZFS userland + supporting packages
  ansible.builtin.apt:
    name:
      - zfsutils-linux
      - sanoid        # ships syncoid (replication tool) — syncoid is NOT a separate
                      # Debian package on trixie (live-found 2026-09-03 nas provision)
      - zfs-dkms      # builds the native zfs kernel module (stock Debian kernel lacks it;
                      # modprobe zfs failed live 2026-09-03 — the module only arrives via DKMS)
      - linux-headers-amd64   # headers for the RUNNING kernel — DKMS cannot build the zfs
                      # module for /lib/modules/<running> without them (live-found 2026-09-03
                      # oldsrv provision: modprobe zfs FATAL on kernel 6.12.101 — nas had
                      # linux-headers-* present, oldsrv had none)
    state: present
    update_cache: true

- name: NFS server packages (nas is the NFS server)
  ansible.builtin.apt:
    name: [nfs-kernel-server, nfs-common]
    state: present
  when: inventory_hostname in groups['storage'] | default([])

- name: NFS client package (oldsrv mounts the shares)
  ansible.builtin.apt:
    name: nfs-common
    state: present
  when: inventory_hostname in groups['home_servers'] | default([])

- name: Load ZFS kernel module (present on native kernel images)
  community.general.modprobe:
    name: zfs
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- include_tasks: zfs_common.yml
- include_tasks: zfs_exporter.yml
  when: inventory_hostname in groups['storage'] | default([])
- include_tasks: nas.yml
  when: inventory_hostname in groups['storage'] | default([])
- include_tasks: samba.yml
  when: inventory_hostname in groups['storage'] | default([])   # Samba shares on the NAS (D4/HD-131)
- include_tasks: oldsrv.yml
  when: inventory_hostname in groups['home_servers'] | default([])
  tags: storage
  # ⚠ TWO places, both load-bearing (HD-468, measured 2026-09-28). oldsrv.yml used to be the one file
  # in this role with no tags anywhere, so `--tags storage` against oldsrv selected nothing but the
  # role's `always` guard and reported `ok=23 changed=0 failed=0` — a green, changed=0 run that
  # converged nothing. Getting scoped runs to work needed BOTH halves, and each half alone still
  # returns a deceptively green no-op:
  #   1. the include task itself must carry the tag — a DYNAMIC include that fails the tag filter is
  #      never expanded, so its children never get a chance to match;
  #   2. every task inside oldsrv.yml must carry it too — once expanded, untagged children are
  #      filtered out on their own.
  # Making the include carry the tag by inheritance is not available on this Ansible (2.21.3 rejects
  # `apply:` next to `include_tasks`: "conflicting action statements"). And the underlying trap is the
  # one the playbooks already document for `--tags cockpit`: a bare role name is not a tag.
  # nas.yml / samba.yml / zfs_exporter.yml are tagged the same way.