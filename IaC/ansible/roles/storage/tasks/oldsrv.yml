---
# oldsrv: NFS client mounts + the nightly DB-dump push leg.
#
# There used to be THREE push legs here. Two of them could never exit 0 on this host and
# were removed on 2026-09-28 (HD-468) rather than patched into a green lie:
#   * push-services  — it ran `docker exec forgejo` / `docker exec n8n`, and BOTH live on
#     the vps (measured: oldsrv's `docker ps` has neither). Its payload is vps state.
#   * push-face-thumbs — its source /srv/docker/immich/upload/thumbs does not exist on
#     oldsrv (immich-server, immich-postgres and the 1.2 MB thumbs tree live on the vps);
#     oldsrv only runs the immich-ml leg, which holds no user data.
# The removals + what still has to be built on the vps are in docs/backup.md.

# ---------------------------------------------------------------------------
# NFS client mounts (fstab + systemd automount)
# ---------------------------------------------------------------------------
- name: Mount nas shares (tank/data, bulk/media)
  ansible.builtin.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: "{{ item.opts }}"
    state: mounted
  loop: "{{ storage_nfs_mounts }}"

# ---------------------------------------------------------------------------
# Retired legs: stop, unarm and delete (HD-468). Guarded by a stat so a re-run after
# the unit files are gone stays idempotent instead of erroring on a missing unit.
# ---------------------------------------------------------------------------
- name: Check for retired push units before removing them
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - push-services.service
    - push-services.timer
    - push-face-thumbs.service
    - push-face-thumbs.timer
  register: retired_push_units

- name: Stop and unarm retired push units
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  loop: "{{ retired_push_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  failed_when: false

- name: Remove retired push units and the vps-only script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/push-services.service
    - /etc/systemd/system/push-services.timer
    - /etc/systemd/system/push-face-thumbs.service
    - /etc/systemd/system/push-face-thumbs.timer
    - /usr/local/sbin/storage-push-services.sh
  notify: Reload systemd

# ---------------------------------------------------------------------------
# Push job — DB dumps: produce them here, then push → tank/data/db-dumps
# ---------------------------------------------------------------------------
# Dedicated non-root run user (KOPS-056 / HD-127): a timer must not reach the docker
# socket as root. svc-backup is in the docker group and owns the dump staging dir.
- name: Create dedicated non-root backup user (svc-backup)
  ansible.builtin.user:
    name: svc-backup
    system: true
    shell: /usr/sbin/nologin
    groups: docker
    home: "/srv/docker"   # the old service-state staging lived under /srv/docker
    create_home: false
  register: svc_backup_user

- name: Ensure the DB-dump staging dir exists and belongs to svc-backup
  ansible.builtin.file:
    path: "{{ storage_push_db_dumps.src }}"
    state: directory
    owner: svc-backup
    group: svc-backup
    mode: "0755"

- name: Render the DB-dump push script + units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: storage-push-db-dumps.sh.j2, dest: /usr/local/sbin/storage-push-db-dumps.sh, mode: "0755" }
    - { src: push-db-dumps.service.j2,    dest: /etc/systemd/system/push-db-dumps.service, mode: "0644" }
    - { src: push-db-dumps.timer.j2,      dest: /etc/systemd/system/push-db-dumps.timer,   mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload systemd

- name: Enable+start push-db-dumps.timer
  ansible.builtin.systemd:
    name: push-db-dumps.timer
    daemon_reload: true
    enabled: true
    state: started
