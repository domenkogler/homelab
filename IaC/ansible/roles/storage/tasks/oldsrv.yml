---
# oldsrv: NFS client mounts, nightly push timers (db dumps / services / face
# thumbs). (ZFS nvme datasets/properties applied in zfs_common.yml.)

# ---------------------------------------------------------------------------
# NFS client mounts (fstab + systemd automount)
# ---------------------------------------------------------------------------
- name: Mount nas shares (tank/data, bulk/media)
  ansible.builtin.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: "{{ item.opts }}"
    state: mounted
  loop: "{{ storage_nfs_mounts }}"

# ---------------------------------------------------------------------------
# Push job 1 — DB dumps scratch → tank/data/db-dumps
# ---------------------------------------------------------------------------
- name: Render push-db-dumps unit + timer
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | replace('.j2','') }}"
    mode: "0644"
  loop:
    - push-db-dumps.service.j2
    - push-db-dumps.timer.j2
  notify: Reload systemd

- name: Enable+start push-db-dumps.timer
  ansible.builtin.systemd:
    name: push-db-dumps.timer
    daemon_reload: true
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Push job 2 — service state (Forgejo dump, n8n sqlite) → tank/data/services
# ---------------------------------------------------------------------------
# Dedicated non-root run user for the service-state push (KOPS-056 / HD-127): the
# systemd timer must not run docker root-exec backups as root. svc-backup is in the
# docker group (so it can `docker exec`/`docker cp`) and owns the staging dir;
# the service unit sets User=/Group= (see push-services.service.j2).
- name: Create dedicated non-root backup user (svc-backup)
  ansible.builtin.user:
    name: svc-backup
    system: true
    shell: /usr/sbin/nologin
    groups: docker
    home: "/srv/docker"   # staging sits under /srv/docker/services
    create_home: false
  register: svc_backup_user

- name: Ensure push-services staging dir ownership for svc-backup
  ansible.builtin.file:
    path: "{{ storage_push_services.src }}"
    state: directory
    owner: svc-backup
    group: svc-backup
    mode: "0755"

- name: Render push-services script + units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ '/usr/local/sbin/storage-push-services.sh' if item == 'push-services.sh.j2' else '/etc/systemd/system/' + item | replace('.j2','') }}"
    mode: "{{ '0755' if item == 'push-services.sh.j2' else '0644' }}"
  loop:
    - push-services.sh.j2
    - push-services.service.j2
    - push-services.timer.j2
  notify: Reload systemd

- name: Enable+start push-services.timer
  ansible.builtin.systemd:
    name: push-services.timer
    daemon_reload: true
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Push job 3 — face thumbnails → bulk/data/immich-thumbs (over NFS mount
# /mnt/nas/thumbs, third export; no ssh key needed — see storage-zfs.md)
# ---------------------------------------------------------------------------
- name: Render push-face-thumbs unit + timer
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | replace('.j2','') }}"
    mode: "0644"
  loop:
    - push-face-thumbs.service.j2
    - push-face-thumbs.timer.j2
  notify: Reload systemd

- name: Enable+start push-face-thumbs.timer
  ansible.builtin.systemd:
    name: push-face-thumbs.timer
    daemon_reload: true
    enabled: true
    state: started