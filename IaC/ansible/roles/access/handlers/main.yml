---
# roles/access handlers. `tags: always` is load-bearing: handlers are tag-filtered
# like tasks, so without it a `--tags access` run would write the gate and silently
# skip the reload.
#
# Validation happens in the template task (`validate: /usr/sbin/sshd -t -f %s`), so a
# broken gate never reaches the filesystem; `tasks/main.yml` proves the live daemon
# still admits the converge identity after the run.

- name: reload sshd
  ansible.builtin.systemd_service:
    name: "{{ access_ssh_service }}"
    state: reloaded
  tags: always
