---
# role: spark-llm-profile — read-only preflight for `spark_llm_profile` (HD-469).
# Order = cheapest failure first; every fail_msg names the exact command or file to
# fix, because the alternative is discovering it 20 minutes into an engine boot.

- name: Assert the LLM profile exists
  ansible.builtin.assert:
    that:
      - spark_llm_profile is defined
      - spark_llm_profile | length > 0
      - spark_llm_profile in spark_llm_profiles
      - not (spark_llm_profile is match('^_'))
    fail_msg: >-
      spark_llm_profile='{{ spark_llm_profile | default('<unset>', true) }}' is not a known
      profile. Valid: {{ spark_llm_profiles | dict2items | rejectattr('key', 'match', '^_') | map(attribute='key') | sort | join(' | ') }}
      (definitions: IaC/ansible/group_vars/spark.yml §LLM SERVING PROFILES;
      the dial: IaC/ansible/host_vars/spark.kogler.si.yml). A key beginning with `_` is a
      MERGE ANCHOR of shared defaults (HD-489), not a servable profile.
      (definitions: IaC/ansible/group_vars/spark.yml §LLM SERVING PROFILES;
      the dial: IaC/ansible/host_vars/spark.kogler.si.yml).
  tags: [spark, spark-llm-profile, llm]

# ---- Resolve what the profile NAMES into what it POINTS AT (HD-489) ----
# The compose template composes the same three values from the same plain scalar keys
# (`image`, `models_root`, `ple_host_base`+`ple_host_root`). The gate resolves them FIRST:
# it must refuse a bad name with a remediation rather than let a rendered path fail 20
# minutes into a boot, and the staged-artifact asserts at the foot of this file must stat
# THE PATHS THIS PROFILE NAMES — not always the XFS store, which is what made the upstream
# arms (their checkpoint lives on `/`) silently pass a check for files they never use.
- name: Resolve the profile's image pin and host roots
  ansible.builtin.set_fact:
    spark_llm_image_resolved: "{{ spark_llm_profile_images[spark_llm.image] }}"
    spark_llm_model_host_dir: >-
      {{ (spark_models_dir_os if spark_llm.models_root == 'os' else spark_models_dir)
         ~ '/' ~ spark_llm.model_subdir }}
    spark_llm_ple_host_dir: >-
      {{ spark_models_dir_os if spark_llm.ple_host_root == 'os'
         else (spark_xfs_mount if spark_llm.ple_host_base == 'mount' else spark_models_dir) }}
  tags: [spark, spark-llm-profile, llm]

- name: Assert the profile is complete and its engine is servable
  ansible.builtin.assert:
    that:
      - spark_llm.engine is defined
      - spark_llm.engine in ['vllm', 'sglang']
      - spark_llm.container | length > 0
      - spark_llm.served_name | length > 0
      - spark_llm.model_subdir | length > 0
      - spark_llm.max_model_len | int > 0
      - spark_llm.max_num_seqs | int > 0
      - (spark_llm_image_resolved | default('')) | length > 0
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' is not servable as authored:
      engine='{{ spark_llm.engine | default('<unset>') }}',
      image='{{ spark_llm.image | default('<unset>') }}' →
      '{{ spark_llm_image_resolved | default('<unresolved>') }}'.
      An EMPTY image means the engine image has no pin yet — CONVENTIONS §7 forbids a
      floating tag or a mutable alias on the serving path. For `ultrafast` (HD-489) empty is
      the DESIGNED state until roles/spark-ultrafast-build has produced the patched lineage
      and the image ID it printed is recorded in group_vars/all/versions.yml (the ID is
      immutable; the build tag is a mutable alias and is never served). For `sglang`: verify
      the arm64 manifest, take the digest, pin it, and record the verification in
      docs/hardware-spark.md §LLM serving profiles in the same change.
  tags: [spark, spark-llm-profile, llm]


- name: Assert the profile's coordinates name something this repo defines
  ansible.builtin.assert:
    that:
      - spark_llm.image in spark_llm_profile_images
      - spark_llm.models_root in ['xfs', 'os']
      - spark_llm.ple_host_root in ['xfs', 'os']
      - spark_llm.ple_host_base in ['mount', 'models']
      - (spark_llm.ple_host_root != 'os') or (spark_llm.ple_host_base == 'models')
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' names a coordinate this repo does not define:
      image={{ spark_llm.image }} (valid: {{ spark_llm_profile_images.keys() | sort | join(' | ') }}
      — each one is a PIN in group_vars/all/versions.yml, never a path and never a tag),
      models_root={{ spark_llm.models_root }} / ple_host_root={{ spark_llm.ple_host_root }}
      (xfs = {{ spark_xfs_mount }} · os = {{ spark_models_dir_os }}, the root partition:
      345 G free measured 2026-10-02, which is where the upstream arms live so that nothing
      staged on XFS has to be deleted to make room for them),
      ple_host_base={{ spark_llm.ple_host_base }} (mount = under the XFS mount root, as the
      primitive-ai tables are; models = under the models dir. On `os` only `models` means
      anything — there is no second mount root there).
  tags: [spark, spark-llm-profile, llm]

# ---- One PLE mechanism, and a complete one (HD-489) ----
# The primitive-ai sidecar works by BIND-MOUNTING ple_layer_quant.py over
# .../qwen3_8_flash_next/nvidia/ple_layer.py; the upstream mmap patch APPENDS its hook to
# that same file, and VLLM_PLE_MMAP=1 is read by that hook. Claiming both is not belt and
# braces — the behaviour is then decided by mount order. And an mmap arm that omits its
# table subdir renders VLLM_PLE_MMAP_DIR=/ple-table with NOTHING mounted there: the exact
# bug scripts/spark-llm-render-matrix.py was written to catch at render time, refused here
# at converge time, and bred as a canary in scripts/check_spark_llm_gate.py.
- name: Assert the profile uses one PLE mechanism and a complete one
  when: spark_llm.engine == 'vllm'
  ansible.builtin.assert:
    that:
      - not ((spark_llm.ple_mmap | bool) and (spark_llm.ple_overlay | bool))
      - (not (spark_llm.ple_mmap | bool)) or (spark_llm.ple_host_subdir | length > 0)
      - (not (spark_llm.ple_mmap | bool)) or (not (spark_llm.ple_offload | bool))
      - (not (spark_llm.ple_mmap | bool)) or (spark_llm.ple_container_dir == '/ple-table')
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' claims PLE mechanisms inconsistently:
      ple_mmap={{ spark_llm.ple_mmap }} ple_overlay={{ spark_llm.ple_overlay }}
      ple_offload={{ spark_llm.ple_offload }}
      ple_host_subdir='{{ spark_llm.ple_host_subdir }}'
      ple_container_dir='{{ spark_llm.ple_container_dir }}'.
      The overlay bind-mounts over the file the mmap hook is appended to, so the two are
      mutually exclusive; an mmap arm needs its table subdir (mounted at /ple-table, the
      path VLLM_PLE_MMAP_DIR points at) and must not also render the primitive-ai
      CPU-offload env.
  tags: [spark, spark-llm-profile, llm]

# ---- The never-evict prompt pin: REJECTED 2026-10-05, and both asserts below stay armed ----
# --never-evict-kv-cache-prompt-includes pins every KV block whose prompt contains the
# substring, up to --never-evict-kv-cache-max-fraction of the POOL. The mechanism was measured
# and dropped (docs/services-ai-rejected.md): it held 0 blocks across 13 h of real sessions
# while prefix caching alone served 95.1 % of prompt tokens with 0 preemptions. Every profile
# now inherits an EMPTY spark_llm_never_evict_prompt, so the template renders neither flag.
# The asserts are NOT the pin's tests — they are the two ways this flag has already cost a
# boot, and they must keep firing if anyone re-arms it:
#   · a placeholder matches nothing (invisible no-op) or everything (a pool leak);
#   · the argument exists ONLY in the patched image lineage — on any other image api_server
#     exits at parse time and the container crash-loops. Live: reasoning restarts=105,
#     overnight run 20261004-0804. scripts/check_spark_llm_gate.py canary-proves both.
- name: Assert no profile ships a placeholder into the engine argv
  ansible.builtin.assert:
    that:
      - "'CHANGEME' not in (spark_llm.never_evict_prompt | default(''))"
      - "'CHANGEME' not in (spark_llm.args_extra | default([]) | join(' '))"
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' still carries a CHANGEME placeholder
      (never_evict_prompt='{{ spark_llm.never_evict_prompt | default('') }}'). Replace it
      with a LITERAL substring of the system prompt the harness actually sends
      (scripts/pi-config/ → the pi system prompt), and record why that substring is the
      one worth pinning. This is a human-decision gate, not a bug to delete.
  tags: [spark, spark-llm-profile, llm]

# ---- A pin is only legal on an image lineage whose build carries the patch ----
# The failure this refuses happened for real: `spark_llm_profile=reasoning` renders
# image=base, whose vLLM has no --never-evict-kv-cache-* argument, so the pair landed in argv,
# api_server exited at parse time, and Docker restart-looped the engine (restarts=105 before a
# human stopped it) — ~20 min of boot per attempt, and the gate was green the whole time because
# nothing compared the flag to the image. Spark-adjacent rule: a flag the image cannot parse is
# a profile bug, not a runtime condition.
- name: Assert a prompt-pin is never armed on an image lineage that lacks the patch
  ansible.builtin.assert:
    that:
      - "not (spark_llm.never_evict_prompt | default('')) or spark_llm.image in spark_llm_never_evict_capable_images"
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' sets never_evict_prompt but its image
      '{{ spark_llm.image }}' is not in spark_llm_never_evict_capable_images
      ({{ spark_llm_never_evict_capable_images | join(', ') }}). --never-evict-kv-cache-* exists
      ONLY in the patched lineage: on any other image it aborts the engine at argument parse and
      the container crash-loops. Leave the pin empty (the REJECTED default, see
      docs/services-ai-rejected.md) or move the arm onto a capable image.
  tags: [spark, spark-llm-profile, llm]

# ---- Free space on the root the artifacts ACTUALLY live on (HD-489) ----
# One `df`, read-only, on the models root only when the profile uses the root partition.
# `/` is the mount /opt/homelab sits on (docs/hardware-spark.md §Partition layout: p2 = the
# live root), so df on `/` is the honest measure; df on a not-yet-staged path would fail.
- name: Read free space on the root partition
  ansible.builtin.command:
    argv: ["df", "-P", "-B1", "/"]
  changed_when: false
  register: spark_llm_df_os
  when:
    - spark_llm.engine == 'vllm'
    - spark_llm.models_root == 'os'
  tags: [spark, spark-llm-profile, llm]

- name: Assert the root partition still has room for this profile's artifacts
  when:
    - spark_llm.engine == 'vllm'
    - spark_llm.models_root == 'os'
  ansible.builtin.assert:
    that:
      - (spark_llm_df_os.stdout_lines | last).split()[3] | int >= (spark_llm_os_min_free_bytes | int)
    fail_msg: >-
      The root partition has {{ ((spark_llm_df_os.stdout_lines | last).split()[3] | int / 1e9) | round(1) }} GB
      free; profile '{{ spark_llm_profile }}' needs {{ (spark_llm_os_min_free_bytes | int / 1e9) | round(0) }} GB
      (spark_llm_os_min_free_bytes, group_vars/spark.yml). Free space is not a knob to turn
      until a gate passes: stage less, or free a store — but never delete a staged set
      another profile still names (spark_artifact_sets says who uses what), and never lower
      the floor to make this line green.
  tags: [spark, spark-llm-profile, llm]

# ---- KV-pool arithmetic (docs/hardware-spark.md §Unified-memory budget) ----
# max_model_len is a BOOT-GATE, not an allocation: vLLM refuses to boot when the
# pool cannot hold one full sequence, and the pool is a slice of the SAME
# 121.62 GiB unified pool the host lives in. Catch it at render time.
- name: Assert the KV pool holds max_model_len and stays under the certified ceiling
  when: spark_llm.engine == 'vllm'
  ansible.builtin.assert:
    that:
      - spark_llm.kv_cache_dtype in spark_llm_kv_bytes_per_token
      - (spark_llm.kv_cache_memory | int) // (spark_llm_kv_bytes_per_token[spark_llm.kv_cache_dtype] | int) >= (spark_llm.max_model_len | int)
      # Per-profile ceiling (HD-489 tail): a profile may declare its OWN pool_ceiling_bytes
      # to test a larger pool (e.g. fast's 20e9) WITHOUT moving the certified global 16 GiB
      # that still gates every other profile. The global remains the default + the cert.
      - (spark_llm.kv_cache_memory | int) <= (spark_llm.pool_ceiling_bytes | default(spark_llm_pool_ceiling_bytes) | int)
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' KV math does not close:
      pool={{ spark_llm.kv_cache_memory }} B at dtype={{ spark_llm.kv_cache_dtype }}
      ({{ spark_llm_kv_bytes_per_token[spark_llm.kv_cache_dtype] | default(0) }} B/token)
      = {{ (spark_llm.kv_cache_memory | int) // (spark_llm_kv_bytes_per_token[spark_llm.kv_cache_dtype] | default(1) | int) }}
      token slots, needs >= max_model_len={{ spark_llm.max_model_len }}
      and <= the certified ceiling {{ spark_llm_pool_ceiling_bytes }} B.
      Ceiling rationale + the incident it came from: docs/hardware-spark.md
      §Unified-memory budget ("16 GiB is the practical bf16 ceiling"). The next KV
      byte is --kv-cache-dtype fp8's job, not a bigger pool.
  tags: [spark, spark-llm-profile, llm]

# ---- The host floor: fixed cost + pool, not the pool alone (HD-469 run #2) ----
# On GB10 the engine's fixed cost and the KV pool are paid out of the SAME 121.62 GiB the OS
# lives in (docs/hardware-spark.md §Unified-memory budget). A profile that changes the WEIGHTS
# changes the fixed cost, and the pool ceiling cannot see that: `fast` (NVFP4, core 88.6 GB vs
# AWQ's 83.4 GB) fits the 16 GiB pool ceiling at 16.5 GB of KV and still walks this box into
# DGX OS's earlyoom threshold — which Docker reports as `OOMKilled: false` and which upstream
# describes as needing a POWER CYCLE. Every vLLM profile therefore declares fixed_cost_bytes
# (measured for the lanes that have booted, DERIVED + flagged for the ones that have not) and
# the SUM is what is gated. Fix a refusal by shrinking that profile's pool or by measuring the
# fixed cost — never by raising the ceiling, which is the certification itself.
- name: Assert the profile leaves the certified host floor (fixed cost + KV pool)
  when: spark_llm.engine == 'vllm'
  ansible.builtin.assert:
    that:
      - spark_llm.fixed_cost_bytes is defined
      - (spark_llm.fixed_cost_bytes | int) > 0
      # Per-profile host floor: a profile may declare its OWN device_hold_ceiling_bytes;
      # the certified global is the default. (HD-489 tail: each profile is independent.)
      - (spark_llm.fixed_cost_bytes | int) + (spark_llm.kv_cache_memory | int) <= (spark_llm.device_hold_ceiling_bytes | default(spark_llm_device_hold_ceiling_bytes) | int)
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' does not leave the certified host floor:
      fixed_cost={{ spark_llm.fixed_cost_bytes | default('<unset>') }} B +
      KV pool={{ spark_llm.kv_cache_memory }} B =
      {{ (spark_llm.fixed_cost_bytes | default(0) | int) + (spark_llm.kv_cache_memory | int) }} B,
      ceiling is {{ spark_llm_device_hold_ceiling_bytes }} B (= MemTotal 130,593,136,640 −
      6.9 GiB held by OS/driver at engine start − 17.78 GiB the CERTIFIED worst usable
      reading; docs/hardware-spark.md §Unified-memory budget, spark/stability-test.md §2).
      A breach is not a warning here: it is the global OOM Docker reports as
      `OOMKilled: false` (docs/spark-incidents.md). Fix it in group_vars/spark.yml by
      LOWERING this profile's kv_cache_memory, or by replacing a DERIVED
      fixed_cost_bytes with a measured one (the engine's 'Available KV cache memory' log
      line + the oom-watchdog's worst usable_gib over one boot of this profile), and put
      the measurement in spark/reports/. Do NOT raise
      spark_llm_device_hold_ceiling_bytes — a profile that needs a bigger ceiling needs a
      re-cert of the certified lane, not a bigger constant.
    success_msg: >-
      Host floor OK for '{{ spark_llm_profile }}': fixed
      {{ (spark_llm.fixed_cost_bytes | int / 1e9) | round(1) }} GB + pool
      {{ (spark_llm.kv_cache_memory | int / 1e9) | round(1) }} GB =
      {{ ((spark_llm.fixed_cost_bytes | int + spark_llm.kv_cache_memory | int) / 1e9) | round(1) }} GB
      of {{ (spark_llm_device_hold_ceiling_bytes | int / 1e9) | round(1) }} GB ceiling
      (basis: {{ spark_llm.fixed_cost_basis | default('undeclared — declare it') }}).
  tags: [spark, spark-llm-profile, llm]

# ---- SGLang lane invariants (GB10-specific, HD-469 `fast-sglang`) ----
# SGLang sizes its pool from --mem-fraction-static instead of --kv-cache-memory-bytes, so the
# asserts above do not reach it. These three are the failure modes the vendor's own DGX Spark
# documentation names (docs.sglang.io §Qwen3.8-Flash-Next / §Qwen3.8-27B DGX Spark notes),
# each of which costs either the box or the client contract:
#   * 0.85 × 128 GB leaves ~8 GB = DGX OS's earlyoom SIGTERM threshold → the scheduler dies at
#     the first long prefill with `exit code -15` and NO traceback (15 of 48 measured cells);
#     at 0.80 every cell served. Our house value is 0.80 — a floor, not a preference.
#   * `--ple-offload-embedding` WITHOUT `--ple-offload-backend file` pins the 47.7 GiB table
#     in host RAM, which ON GB10 IS the device pool — the exact reason this lane was blocked.
#   * a `--max-total-tokens` below the profile's max_model_len serves a smaller window than
#     the client contract promises: pi 400s mid-session (docs/spark-llm-profiles.md §Client
#     contract). The pool is sglang's own startup-log number; the FLAG must at least honour
#     the window we advertise.
- name: Render the SGLang arg list as a string for the invariant checks
  ansible.builtin.set_fact:
    spark_llm_args_str: "{{ spark_llm.args_extra | default([]) | join(' ') }}"
  when: spark_llm.engine == 'sglang'
  tags: [spark, spark-llm-profile, llm]

- name: Assert the SGLang lane keeps the host its memory and honours the window
  when: spark_llm.engine == 'sglang'
  ansible.builtin.assert:
    that:
      - (spark_llm_args_str | regex_findall('--mem-fraction-static[= ]+([^ ]+)') | first | default('1.0')) | float <= 0.80
      - (spark_llm_args_str | regex_findall('--max-total-tokens[= ]+([^ ]+)') | first | default(spark_llm.max_model_len)) | int >= (spark_llm.max_model_len | int)
      - ('--ple-offload-embedding' not in spark_llm_args_str) or ((spark_llm_args_str | regex_findall('--ple-offload-backend[= ]+([^ ]+)') | first | default('pinned')) == 'file')
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' passes SGLang flags this box cannot survive:
      mem-fraction={{ spark_llm_args_str | regex_findall('--mem-fraction-static[= ]+([^ ]+)') | first | default('(unset — sglang default)') }}
      (≤ 0.80 here: 0.85 leaves ~8 GB = the DGX OS earlyoom SIGTERM threshold, and the
      kill is `exit -15` with no traceback),
      max-total-tokens={{ spark_llm_args_str | regex_findall('--max-total-tokens[= ]+([^ ]+)') | first | default('(unset — sglang sizes it)') }}
      (must be ≥ max_model_len={{ spark_llm.max_model_len }}, else the served window is
      smaller than the client contract),
      ple-offload-backend={{ spark_llm_args_str | regex_findall('--ple-offload-backend[= ]+([^ ]+)') | first | default('(unset = pinned host RAM)') }}
      (on GB10 a pinned table comes out of the SAME 121.62 GiB pool as the weights — only
      the `file` backend, with a bind of the XFS NVMe store at that path, moves it off).
      Flags: spark_llm_profiles.{{ spark_llm_profile }}.args_extra in group_vars/spark.yml.
  tags: [spark, spark-llm-profile, llm]

- name: Assert the CUDA-graph capture cap cannot exceed the decode batch (HD-380)
  when: (spark_llm.max_cudagraph_capture_size | int) > 0
  ansible.builtin.assert:
    that:
      - (spark_llm.max_cudagraph_capture_size | int) <= (spark_llm.max_num_seqs | int)
    fail_msg: >-
      max_cudagraph_capture_size={{ spark_llm.max_cudagraph_capture_size }} exceeds
      max_num_seqs={{ spark_llm.max_num_seqs }} — graphs captured above the decode
      batch are unreachable AND strand memory in the single GB10 pool
      (docs/spark-incidents.md, HD-380).
  tags: [spark, spark-llm-profile, llm]

# ---- Uncertified profiles are a deliberate act ----
- name: Require an explicit override for an uncertified profile
  when: not (spark_llm.certified | bool)
  ansible.builtin.assert:
    that:
      - spark_llm_allow_uncertified | bool
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' is NOT certified on this box.
      {{ (spark_llm.uncertified_reason | default('') | trim) }}
      To run it anyway (bench/test only, never the daily driver) set
      spark_llm_allow_uncertified: true in host_vars/spark.kogler.si.yml or pass
      -e spark_llm_allow_uncertified=true, and say so in the commit message.
      Evidence bar + procedure: spark/llm-profiles/README.md.
  tags: [spark, spark-llm-profile, llm]

- name: Note the engine swap cost (orphan container + endpoint contract)
  when: spark_llm.engine != 'vllm'
  ansible.builtin.debug:
    msg: >-
      engine='{{ spark_llm.engine }}' — container name changes
      ({{ spark_llm.container }}), so the vLLM container of the previous profile is
      an ORPHAN of the compose project. Before the flip:
      `docker compose -p spark-ai -f /opt/spark-ai/docker-compose.yml down
      --remove-orphans` on the box. The endpoint, served id and bearer key must stay
      identical or every client breaks (HD-370 contract).
  tags: [spark, spark-llm-profile, llm]

# ---- Artifacts: never download implicitly, never boot without ----
- name: Stat the profile's model dir
  # Resolved path (spark_llm_model_host_dir), because the upstream arms keep their
  # checkpoint on `/` — a stat of the XFS path would approve an arm whose weights are
  # elsewhere, or refuse one whose weights are staged exactly where it points.
  ansible.builtin.stat:
    path: "{{ spark_llm_model_host_dir }}/config.json"
  register: spark_llm_model_stat
  when: not spark_llm_profile_skip_artifact_check | bool
  tags: [spark, spark-llm-profile, llm]

- name: Stat the profile's PLE table dir
  ansible.builtin.stat:
    # Marker comes from the profile: the primitive-ai tables ship META.json, the
    # repo-root-downloaded FP8 table is marked by roles/spark-artifacts with .hf-staged
    # (which also records the revision, so the next assert can compare it to the pin).
    path: "{{ spark_llm_ple_host_dir }}/{{ spark_llm.ple_host_subdir }}/{{ spark_llm.ple_staged_marker | default('META.json') }}"
  register: spark_llm_ple_stat
  when:
    - not spark_llm_profile_skip_artifact_check | bool
    - spark_llm.ple_host_subdir | default('') | length > 0
  tags: [spark, spark-llm-profile, llm]

- name: Stat the profile's PLE overlay files
  ansible.builtin.stat:
    path: "{{ spark_overlays_dir }}/{{ item.host }}"
  loop: "{{ spark_llm_overlays }}"
  loop_control:
    label: "{{ item.host }}"
  register: spark_llm_overlay_stat
  when:
    - not spark_llm_profile_skip_artifact_check | bool
    - spark_llm.ple_overlay | bool
  tags: [spark, spark-llm-profile, llm]

- name: Read the staged PLE table's provenance marker
  ansible.builtin.slurp:
    src: "{{ spark_llm_ple_host_dir }}/{{ spark_llm.ple_host_subdir }}/{{ spark_llm.ple_staged_marker }}"
  register: spark_llm_ple_marker
  when:
    - not spark_llm_profile_skip_artifact_check | bool
    - spark_llm.ple_mmap | bool
    - spark_llm_ple_stat.stat.exists | default(false)
  failed_when: false
  tags: [spark, spark-llm-profile, llm]

- name: Compare the staged PLE revision with the pin in versions.yml
  ansible.builtin.set_fact:
    spark_llm_ple_revision_ok: >-
      {{ (spark_ple_fp8_revision in (spark_llm_ple_marker.content | b64decode))
         if (spark_llm_ple_marker.content is defined) else false }}
  when:
    - not spark_llm_profile_skip_artifact_check | bool
    - spark_llm.ple_mmap | bool
  tags: [spark, spark-llm-profile, llm]

- name: Fail when the profile's artifacts are not staged yet
  when: not spark_llm_profile_skip_artifact_check | bool
  ansible.builtin.assert:
    that:
      - spark_llm_model_stat.stat.exists
      - (spark_llm.ple_host_subdir | default('') | length == 0) or (spark_llm_ple_stat.stat.exists | default(false))
      - (not (spark_llm.ple_mmap | bool)) or (spark_llm_ple_revision_ok | default(true) | bool)
      - (not (spark_llm.ple_overlay | bool)) or (((spark_llm_overlay_stat.results | default([])) | selectattr('stat.exists', 'equalto', true) | list | length) == (spark_llm_overlays | length))
    fail_msg: >-
      Profile '{{ spark_llm_profile }}' expects artifacts that are not staged:
      model='{{ spark_llm_model_host_dir }}' (config.json
      {{ 'present' if spark_llm_model_stat.stat.exists else 'MISSING' }}),
      PLE='{{ spark_llm_ple_host_dir }}/{{ spark_llm.ple_host_subdir | default('(none)') }}'
      (marker {{ spark_llm.ple_staged_marker | default('META.json') }}),
      overlays={{ spark_llm.ple_overlay | bool }},
      pinned-revision-match={{ spark_llm_ple_revision_ok | default('n/a') }}.
      Downloads are EXPLICIT by design (84 GB + 1 G link). Stage them first:
      ansible-playbook -i inventory.ini playbooks/spark.yml --limit spark
      --tags spark-artifacts -e spark_artifacts_fetch='["b1-awq","ple-int4","nvfp4-mixed","ple-nvfp4"]'
      (sets: spark_artifact_sets in group_vars/spark.yml).
  tags: [spark, spark-llm-profile, llm]

# ---- Converge-log summary (no secrets; the values are all in group_vars) ----
- name: Show the active LLM profile
  ansible.builtin.debug:
    msg:
      - "profile          : {{ spark_llm_profile }} — {{ spark_llm.label }}"
      - "engine / image   : {{ spark_llm.engine }} / {{ spark_llm.image }} → {{ spark_llm_image_resolved }}"
      - "model            : {{ spark_llm_model_host_dir }}"
      - "PLE              : {{ spark_llm.ple_container_dir or '(none)' }} (host {{ spark_llm_ple_host_dir }}/{{ spark_llm.ple_host_subdir or '(none)' }}, overlay={{ spark_llm.ple_overlay | bool }}, mmap={{ spark_llm.ple_mmap | bool }})"
      - "spec / pin       : {{ spark_llm.spec_config | default('spec_tokens=' ~ spark_llm.spec_tokens) }} / never-evict='{{ spark_llm.never_evict_prompt or '(off)' }}'"
      - "ctx / seqs       : {{ spark_llm.max_model_len }} / {{ spark_llm.max_num_seqs }}"
      - "KV               : {{ spark_llm.kv_cache_dtype }}, {{ spark_llm.kv_cache_memory }} B = {{ (spark_llm.kv_cache_memory | int) // (spark_llm_kv_bytes_per_token[spark_llm.kv_cache_dtype] | default(1) | int) if spark_llm.kv_cache_dtype in spark_llm_kv_bytes_per_token else '?' }} slots"
      - "device hold     : fixed {{ spark_llm.fixed_cost_bytes | default('(undeclared — sglang sizes by mem-fraction)') }} + pool {{ spark_llm.kv_cache_memory }} ≤ ceiling {{ spark_llm_device_hold_ceiling_bytes }}"
      - "fp8 note        : the pool gain from --kv-cache-dtype fp8 is 1.70–1.89×, NOT 2× (main K/V only); read the engine's own 'GPU KV cache size' line, never a projection"
      - "certified        : {{ spark_llm.certified | bool }}{{ '' if spark_llm.certified | bool else '  ← UNCERTIFIED (override: spark_llm_allow_uncertified)' }}"
      - "client ctx owed  : scripts/pi-config/models-spec.yml contextWindow = {{ spark_llm.client_context_window }}"
      - "reasoning surface: {{ spark_llm.reasoning_surface }}"
  tags: [spark, spark-llm-profile, llm]
