---
# role: spark-ultrafast-build — build the patched lineage + the T80 drafter directory.
# Order = cheapest failure first; every fail_msg names the file or var to change.
# Heavy steps run ASYNC with polling: a killed build (tool timeout, dropped SSH) is worse
# than no build, and a full converge already has to be launched detached (README §4.6).
#
# This role is the LIVE lineage: the patch stack on the day-0 parent image, which is what the `fast`
# profile boots. Both halves of the work are shared task files driven by vars — tasks/checkout_pinned
# (provenance) and tasks/build_lineage.yml (the build) — so a second lineage can run the SAME proofs
# with its own (pin, tag, commit, patch set); see roles/spark-profile-fast8. The values for this
# lineage are the `spark_ultrafast_lineage` dict in defaults/main.yml. Keeping the two lineage dicts
# apart is the point: they are different artifacts, and one shared pin or tag is exactly how a
# lineage would skip, or be asserted against, another lineage's image.

- name: Assert the provenance pins exist
  ansible.builtin.assert:
    that:
      - spark_ultrafast_upstream_repo | length > 0
      - (spark_ultrafast_upstream_commit | length) == 40
      - spark_vllm_ultrafast_tag | length > 0
      - spark_ultrafast_src_dir | length > 0
    fail_msg: >-
      The provenance pins are not usable:
      commit='{{ spark_ultrafast_upstream_commit }}' (must be a full 40-char sha — a branch
      or a short sha would rebuild "whatever upstream means now", which is the mutable-alias
      failure CONVENTIONS §7 exists to prevent),
      tag='{{ spark_vllm_ultrafast_tag }}'. Pins: group_vars/all/versions.yml.
  tags: [spark, spark-ultrafast-build, llm]

- name: Prove the recipe checkout is the pinned commit and nothing else
  ansible.builtin.include_tasks: checkout_pinned.yml
  vars:
    bc_repo: "{{ spark_ultrafast_upstream_repo }}"
    bc_commit: "{{ spark_ultrafast_upstream_commit }}"
    bc_src_dir: "{{ spark_ultrafast_src_dir }}"
  tags: [spark, spark-ultrafast-build, llm]

- name: Build the live lineage (the patch stack on the day-0 parent image)
  ansible.builtin.include_tasks: build_lineage.yml
  vars:
    bl_key: "{{ spark_ultrafast_lineage.key }}"
    bl_pin: "{{ spark_ultrafast_lineage.pin }}"
    bl_pin_var: "{{ spark_ultrafast_lineage.pin_var }}"
    bl_tag: "{{ spark_ultrafast_lineage.tag }}"
    bl_reserved_tags: "{{ spark_ultrafast_lineage.reserved_tags }}"
    bl_commit: "{{ spark_ultrafast_lineage.commit }}"
    bl_src_dir: "{{ spark_ultrafast_lineage.src_dir }}"
    bl_chdir: "{{ spark_ultrafast_lineage.chdir }}"
    bl_plan_cmd: "{{ spark_ultrafast_lineage.plan_cmd }}"
    bl_build_cmd: "{{ spark_ultrafast_lineage.build_cmd }}"
    bl_build_drafter: "{{ spark_ultrafast_lineage.build_drafter }}"
    bl_head: "{{ bc_head.stdout }}"
  tags: [spark, spark-ultrafast-build, llm]
