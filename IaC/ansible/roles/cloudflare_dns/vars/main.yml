---
# Public DNS records managed by Ansible (playbooks/dns.yml).
# SSOT for the internet-facing subset published at Cloudflare (DNS-only).
#
# `cloudflare_dns_records` is a list of dicts:
#   - name:    record name (relative label, e.g. "vps", "foto"); "" = root (@)
#   - type:    A | AAAA | TXT | CNAME | SRV | MX
#   - value:   record value (IP for A/AAAA, target/string for others)
#   - ttl:     TTL seconds (default 300)
#   - proxied: only for A/AAAA/CNAME (we use DNS-only, so false vs. Cloudflare proxy)
#
# Only the internet-facing subset belongs here: internal-only hosts get NO public record
# (the WAN firewall blocks them). Reference set: docs/network-dns.md.
#
# ── SCOPE & BEHAVIOR (read before editing) ────────────────────────────────
# The playbook applies ONLY the records listed below, each with `state: present`
# (incremental — it CREATES/UPDATES what's listed and NEVER touches/deletes any
# other Cloudflare records). Scope is driven by THIS list, not by an inventory
# group: whatever is here gets ensured. It is currently VPS-only by design.
#
# Migration to full SSOT: add a record here as its app lands on the VPS. Until every
# public *.kogler.si record lives here, the live Cloudflare zone and this file are two
# sources of truth — keep them in sync by hand.
# ───────────────────────────────────────────────────────────────────────────
# NOTE: the token (cloudflare_api) is IP-filtered to 193.77.156.222, so this
# playbook must run from a machine behind that egress IP (home control plane),
# NOT from the VPS or CI runners.

cloudflare_dns_records:
  # --- netcup VPS (host vps.kogler.si) — public edge ---
  # A record for resolving the VPS host itself.
  - name: vps
    type: A
    value: 159.195.111.66
    ttl: 300
    proxied: false   # DNS-only (real client IP -> Traefik on VPS)

  # AAAA record for the VPS (as provided by netcup).
  - name: vps
    type: AAAA
    value: 2a0a:4cc0:60:fcc:d820:9dff:fe4f:95f5
    ttl: 300
    proxied: false

# --- SMTP2Go sender setup (SMTP relay) — verification / DKIM / tracking ---
  # CNAMEs required by the SMTP2Go domain-setup wizard for kogler.si (return-path
  # verification, DKIM signing, open-tracking). Applied to Cloudflare (DNS-only).
  # Consumed by SMTP2Go; not by our Traefik edge. Do not proxied (CNAME to
  # external SMTP2Go targets must stay DNS-only / orange-cloud-off).
  - name: em918249
    type: CNAME
    value: return.smtp2go.net
    ttl: 300
    proxied: false

  - name: s918249._domainkey
    type: CNAME
    value: dkim.smtp2go.net
    ttl: 300
    proxied: false

  - name: link
    type: CNAME
    value: track.smtp2go.net
    ttl: 300
    proxied: false

# ---------------------------------------------------------------------------
# Public service records — ADD one as each public app moves onto the VPS: the public edge
# terminates there and the URLs stay the same. Every CNAME flattens to the vps host record,
# so there is a single IP source; a name belongs here only once the VPS edge answers it.
# Reference the internet-facing set in docs/network-dns.md. `ha` stays unpublished: it is
# internal-only, and a record the edge does not answer is a dead pointer.
# the Phase-4 HA cutover. Revisit: tighten this list if an app is pulled.
  - { name: kogler.si, type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }   # apex - CF flattens
  - { name: sso,       type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: git,       type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: chat,      type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: matrix,    type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: file,      type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: office,    type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: foto,      type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: ai,        type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: pdf,       type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: vpn,       type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: dns,       type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }   # HD-317: Technitium web UI (bootstrap path to the VPS DNS admin; the user added the CNAME live 2026-09-03 — now under IaC per HD-198 incremental)
  - { name: drop,      type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }
  - { name: pairdrop,  type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }   # KEPT + IaC-tracked (HD-230): pairdrop.kogler.si stays live alongside drop
  - { name: bin,       type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }   # HD-112: Zipline public bin/shortener
  - { name: home,      type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }   # HD-230: was missing from CF entirely (route 000 since HD-219 wave)
  # The VPS edge serves this name (routes.yml.j2 → home edge over the WG S2S link), so the
  # record is a true answer rather than a dead pointer.
  - { name: media,     type: CNAME, value: vps.kogler.si, ttl: 300, proxied: false }   # HD-1095: Jellyfin public, own login + crowdsec-only
#
# OBSERVABILITY IS TAILNET-ONLY: stats / sec / traefik / auto get no public record — the
# dashboards (Grafana/Metabase/Traefik-dash/n8n) are admin-only, reached over the tailnet.
# This file manages state:present only: it never deletes a live record, so dropping a name
# from the list is NOT a deletion — the Cloudflare zone must be cleaned up by hand.
# Example (once foto.kogler.si is served by VPS Traefik):
#   - name: foto
#     type: A
#     value: 159.195.111.66
#     ttl: 300
#     proxied: false
# ---------------------------------------------------------------------------
