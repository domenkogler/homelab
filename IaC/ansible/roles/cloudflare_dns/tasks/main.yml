---
# cloudflare_dns — maintain public DNS records at Cloudflare (control plane).
#
# RUNS ON localhost (control node), NOT on managed hosts — it creates records
# on the Cloudflare API, so there is nothing to do on a target node.
#
# Used by: playbooks/dns.yml
# Requires: community.general collection (requirements.yml) + cloudflare_api in 1Password.
#
# IMPORTANT: the cloudflare_api token is IP-filtered to 193.77.156.222 — run this
# from the home control plane (management laptop/workstation), not the VPS/CI.
#
# The record set is not authored here: `vars/main.yml` points at the public view of
# `zone_kogler_si` (group_vars/all/main.yml), so a name is published by declaring it in the zone
# list. `item.0` is that entry, `item.1` the record it publishes.

- name: Resolve Cloudflare API token from 1Password (Homelab-ansible)
  ansible.builtin.set_fact:
    cf_api_token: "{{ lookup('community.general.onepassword', 'cloudflare_api', field='credential', vault=op_vault) }}"

- name: Ensure public DNS records are present (idempotent)
  # Cloudflare's `record` argument is zone-relative, so the FQDN is spelled down to a label here.
  # The pattern is anchored on a DOT on purpose: the apex entry IS the zone name, has no dot to
  # strip, and stays `kogler.si` — an empty `record` would be a different answer, not the same apex.
  community.general.cloudflare_dns:
    zone: "{{ domain_public }}"
    record: "{{ item.0.name | regex_replace('\\.' ~ domain_public ~ '$', '') }}"
    type: "{{ item.1.type }}"
    value: "{{ item.1.value }}"
    ttl: 300                 # the consumer's answer, never a per-record field (see vars/main.yml)
    proxied: false           # DNS-only: Cloudflare's proxy would hide the client IP from the edge
    api_token: "{{ cf_api_token }}"
    state: present
  loop: "{{ cloudflare_dns_records }}"
  register: dns_result
