---
# office role — family office suite on oldsrv (docs/services-office.md,
# docs/hardware-oldsrv.md). Condition: applied when homelab_mode == 'desktop'.
#
# Scope:
#   1. ONLYOFFICE Desktop Editors (official ONLYOFFICE apt repo) — native Linux
#      office suite, full .docx/.xlsx/.pptx, no Wine/VM.
#   2. ttf-mscorefonts-installer — Calibri/Cambria etc. for document fidelity
#      (EULA accepted via debconf; package downloads fonts at install time).
#   3. OpenCloud sync client dependency — the official client
#      (opencloud-eu/desktop) ships AppImage only (no apt repo/.deb); it is
#      installed MANUALLY on clients (HD-52). Ansible only preps the runtime
#      dependency: `libfuse2t64` (FUSE, AppImage mount/run). Clients are
#      Debian 13 (trixie) only.
#
# Secrets: none.

- name: Refuse runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      office role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Create keyring directory if it does not exist
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [office]

- name: Download official ONLYOFFICE signing key (Ascensio, HD-318 fix)
  # HD-318 (2026-09-07): the published `onlyoffice.key` file is STALE — it only
  # contains the 2014 keys (C9E5…/629E…) and does NOT sign the repo's `squeeze`
  # suite. The key that ACTUALLY signs squeeze/Release is Ascensio rsa4096
  # E09C A29F 6E17 8040 EF22 B409 8320 CA65 CB2D E8E5 (Good signature verified
  # 2026-09-07 over download.onlyoffice.com/repo/debian/dists/squeeze/InRelease).
  # Fetch it from a keyserver instead of the stale key file. Only the fingerprint
  # owner is trusted — fail closed if a different key arrives. NO `creates:` guard:
  # a stale key file from an earlier partial Phase-3 attempt must be refreshed, so
  # the shell re-verifies the fingerprint every converge (cheap, idempotent).
  ansible.builtin.shell:
    cmd: >-
      tmp=$(mktemp -d)
      if ! gpg --no-default-keyring --keyring "$tmp/oo.kg"
          --batch --quiet --with-colons --import-options show-only
          --import /etc/apt/keyrings/onlyoffice.asc 2>/dev/null |
          grep -q '^fpr:::::::::E09CA29F6E178040EF22B4098320CA65CB2DE8E5:'
      then
        gpg --no-default-keyring --keyring "$tmp/oo.kg"
            --keyserver keyserver.ubuntu.com
            --recv-keys E09CA29F6E178040EF22B4098320CA65CB2DE8E5 &&
        gpg --no-default-keyring --keyring "$tmp/oo.kg"
            --export E09CA29F6E178040EF22B4098320CA65CB2DE8E5 >
            /etc/apt/keyrings/onlyoffice.asc
      fi
      chmod 0644 /etc/apt/keyrings/onlyoffice.asc
      rm -rf "$tmp"
  tags: [office]

- name: Add official ONLYOFFICE repository
  ansible.builtin.deb822_repository:
    name: onlyoffice
    types: [deb]
    uris: ["https://download.onlyoffice.com/repo/debian"]
    suites: [squeeze]        # ONLYOFFICE uses 'squeeze' as the codename for all Debian
    components: [main]
    signed_by: /etc/apt/keyrings/onlyoffice.asc
    state: present
  tags: [office]

- name: Install ONLYOFFICE Desktop Editors
  ansible.builtin.apt:
    name: onlyoffice-desktopeditors
    state: present
    update_cache: true
  tags: [office]

# MS core fonts — Calibri/Cambria for .docx fidelity (ttf-mscorefonts-installer
# downloads the fonts at install time; EULA must be pre-accepted via debconf).
- name: Accept Microsoft core-fonts EULA (debconf)
  ansible.builtin.debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    vtype: boolean
    value: 'true'
  tags: [office]

- name: Install Microsoft core fonts
  ansible.builtin.apt:
    name: ttf-mscorefonts-installer
    state: present
    update_cache: true
  tags: [office]

# OpenCloud sync client runtime dependency (HD-52).
# The OpenCloud desktop client (opencloud-eu/desktop) ships as an AppImage only
# (no apt repo/.deb) and is installed MANUALLY on each Debian 13 client.
# Ansible preps what AppImage needs to run: FUSE. On Debian 13 (trixie) this is
# the `libfuse2t64` package (renamed from `libfuse2` on bookworm).
- name: Install FUSE runtime for AppImage (OpenCloud client, Debian 13 trixie)
  ansible.builtin.apt:
    name: libfuse2t64
    state: present
    update_cache: true
  tags: [office]

# NOTE (HD-52): the OpenCloud AppImage itself is installed manually per client
# (download from opencloud-eu/desktop releases, chmod +x, /opt or ~/, .desktop
# entry). Ansible intentionally does NOT manage the binary (no apt repo; avoids
# fighting an unmanaged artifact).

# Verify after deploy: onlyoffice-desktopeditors launches · fc-list | grep -i calibri · `opencloud --version` (AppImage)