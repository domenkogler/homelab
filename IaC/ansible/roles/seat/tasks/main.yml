---
# =====================================================================
# roles/seat — the pi CODING SEAT plane on this host.
# This file is the apply of record for the seat's host side: the pi-web user unit, its
# two drop-ins, the token env file and linger. A host that is only hand-kept here loses
# the cockpit on rebuild and is invisible to `--check`.
#
# THE TWO DROP-INS ARE NOT OPTIONAL, AND THEY ARE NOT REDUNDANT:
#   * loopback-bind.conf — re-declares ExecStart with -host/-p so the cockpit
#     binds loopback only and is reachable exclusively through the Traefik
#     router (tailnet-only by construction).
#   * pi-on-path.conf — pi-web shells out to `pi` for the model list, every chat
#     turn and its own self-update, and a systemd USER unit gets no login shell,
#     so it never sees ~/.profile. Without the pi dirs on the unit's PATH every
#     send dies with `exec: "pi": executable file not found in $PATH`. `pi`'s
#     shebang is `#!/usr/bin/env node`, so a lone `pi` symlink is not enough.
#     BOTH pi layouts get a dir on PATH (seat_pi_bin + seat_pi_node_bin): `pi update`
#     moves a seat to pi's OWN managed launcher (~/.pi/agent/bin), where a
#     node-dir-only PATH goes blind. Rendering ONE drop-in and not the other
#     reproduces exactly that failure.
#
# THE PASEO LEG AT THE BOTTOM IS THE SAME SHAPE, NOT A COPY: a user unit, a bind drop-in,
# a PATH drop-in, a 0600 credential file, linger. Two differences are load-bearing:
#   * the credential is a PASSWORD the daemon hashes itself (`PASEO_PASSWORD`), not a bearer the
#     proxy validates — it is the only identity behind the `paseo-oldsrv-ts` door, so a converge
#     that cannot read the vault item must fail rather than start an open daemon.
#   * ~/.paseo/config.json is NEVER templated here. It carries seat state this role does not own
#     (cors, features, app.baseUrl), so the two keys the door needs (daemon.hostnames,
#     daemon.trustedProxies) are set THROUGH the CLI, which merges. The `paseo` seat plane owns the
#     rest of that file (listen, relay, auth) on the seats that carry no unit at all.
#
# What stays OUT of this file, deliberately:
#   * the pi harness itself (pinned Node tarball, the pi npm package, the pi-web
#     package, ~/.pi/agent/skills, the rendered model contract) — that is
#     scripts/harness/install-pi-debian.sh, and the assert below refuses to
#     enable a unit whose binary is missing instead of inventing one;
#   * settings.json — harness-pi-seats.md §5 is its source and there is no renderer by
#     design ([`docs/harness-pi-seats.md`](../../../../../docs/harness-pi-seats.md) §1), so no template here may write it;
#   * the Traefik route — roles/cockpit/templates/cockpit-routes.yml.j2 (the cockpit role
#     owns the route; this role owns the host side of the seat).
# =====================================================================

- name: seat | Assert the seat user exists (roles/access owns the account)
  ansible.builtin.getent:
    database: passwd
    key: "{{ seat_user }}"
  register: seat_getent
  failed_when: seat_getent.ansible_facts.getent_passwd[seat_user] is not defined

- name: seat | Carry the seat uid for the user-scoped systemctl calls
  ansible.builtin.set_fact:
    # getent_passwd[user] is [/etc/passwd field 2..7] minus the name:
    # [passwd, uid, gid, gecos, home, shell] — home is index 4. Index 3 is the GECOS
    # field, which on this fleet is a real name ("Domen Kogler,,,") and produced a
    # path like /home/domen/Domen Kogler,,,/.pi/... on the first try. Prove the shape
    # rather than counting separators.
    seat_uid: "{{ seat_getent.ansible_facts.getent_passwd[seat_user][1] }}"
    seat_home: "{{ seat_getent.ansible_facts.getent_passwd[seat_user][4] }}"

- name: seat | Check the cockpit binary the unit will exec
  # `pi install npm:@ygncode/pi-web` writes ~/.pi/agent/bin/pi-web; a unit pointing
  # at a missing binary would restart-loop under Restart=on-failure and the failure
  # would look like a Traefik problem from outside.
  ansible.builtin.stat:
    path: "{{ seat_home }}/{{ seat_pi_web_bin }}"
  register: seat_bin

- name: seat | Refuse to render a unit whose binary is absent
  ansible.builtin.assert:
    that: seat_bin.stat.exists
    fail_msg: >-
      {{ seat_home }}/{{ seat_pi_web_bin }} does not exist — the cockpit
      package is not installed for {{ seat_user }}. Run
      `bash scripts/harness/install-pi-debian.sh --cockpit` as {{ seat_user }}
      and re-converge; do NOT create the file by hand.

- name: seat | Ensure the seat package set
  # tmux belongs here as a package DECISION (the row's point: not a hand
  # `apt install` on a production host that nothing re-asserts).
  ansible.builtin.apt:
    name: "{{ seat_packages }}"
    state: present

- name: seat | Render the pi-web user unit
  ansible.builtin.template:
    src: pi-web.service.j2
    dest: "{{ seat_unit_dir }}/pi-web.service"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0644"
  notify: seat | reload and restart pi-web

- name: seat | Render BOTH drop-ins — the loopback bind
  ansible.builtin.template:
    src: pi-web-loopback-bind.conf.j2
    dest: "{{ seat_unit_dir }}/pi-web.service.d/loopback-bind.conf"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0644"
  notify: seat | reload and restart pi-web

- name: seat | Render BOTH drop-ins — the unit PATH that finds `pi`
  ansible.builtin.template:
    src: pi-web-on-path.conf.j2
    dest: "{{ seat_unit_dir }}/pi-web.service.d/pi-on-path.conf"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0644"
  notify: seat | reload and restart pi-web

- name: seat | Render the token env file
  # The token is the cockpit-pi-web_api credential — the same bearer the Traefik
  # middleware chain uses. 0600 + never a literal (§6).
  ansible.builtin.template:
    src: pi-web-env.j2
    dest: "{{ seat_home }}/.config/pi-web/env"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0600"
    lstrip_blocks: true
  no_log: true
  notify: seat | reload and restart pi-web

# ---------------------------------------------------------------------------
# THE PASEO LEG — the seat's own daemon, the surface the cockpit above is being
# compared against and eventually replaced. Same three-part shape on purpose: a unit, a bind
# drop-in, a PATH drop-in, plus the credential file. What differs is the credential KIND (a
# password the daemon hashes itself, not a bearer the proxy validates) and one extra arm: the
# daemon's OWN Host allowlist, because behind Traefik the request still arrives carrying the
# public Host and the default allowlist is loopback-only.
# ---------------------------------------------------------------------------

- name: seat | Check the Paseo binary the unit will exec
  # The launcher lands in the pinned Node dir's bin (`npm -g @getpaseo/cli` against that Node).
  # ⛔ `npm i -g paseo` is a name-squat and would put an unrelated binary on this path.
  # The register is NOT named `seat_paseo_bin`: a registered variable shadows the group var of
  # that name for every later task on the host, and the next task would then exec a result dict.
  ansible.builtin.stat:
    path: "{{ seat_paseo_bin }}"
  register: seat_paseo_bin_stat

- name: seat | Refuse to render the Paseo unit whose binary is absent
  ansible.builtin.assert:
    that: seat_paseo_bin_stat.stat.exists
    fail_msg: >-
      {{ seat_paseo_bin }} does not exist — @getpaseo/cli is not installed for
      {{ seat_user }}. Install it against the pinned Node (`npm i -g @getpaseo/cli`, NEVER the
      squatted `paseo` package) and re-converge; do NOT create the file by hand.

- name: seat | Ensure the daemon home exists
  # 0700 is the mode the CLI gives it on its own first start, so the converge adds the directory
  # without teaching the seat a permission the tool would not have chosen.
  ansible.builtin.file:
    path: "{{ seat_home }}/.paseo"
    state: directory
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0700"

- name: seat | Ensure the Paseo unit's drop-in directory exists
  # template() creates a file, never its parents, and a first-time seat has no paseo.service.d —
  # the pi-web drop-ins above only land because that directory already had an owner.
  ansible.builtin.file:
    path: "{{ seat_unit_dir }}/paseo.service.d"
    state: directory
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0755"

- name: seat | Render the Paseo user unit
  ansible.builtin.template:
    src: paseo.service.j2
    dest: "{{ seat_unit_dir }}/paseo.service"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0644"
  notify: seat | reload and restart paseo

- name: seat | Render BOTH Paseo drop-ins — the loopback bind
  ansible.builtin.template:
    src: paseo-loopback-bind.conf.j2
    dest: "{{ seat_unit_dir }}/paseo.service.d/loopback-bind.conf"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0644"
  notify: seat | reload and restart paseo

- name: seat | Render BOTH Paseo drop-ins — the unit PATH the providers need
  ansible.builtin.template:
    src: paseo-on-path.conf.j2
    dest: "{{ seat_unit_dir }}/paseo.service.d/on-path.conf"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0644"
  notify: seat | reload and restart paseo

- name: seat | Ensure the directory that holds the Paseo credential
  # 0700 before the 0600: template() will not create the parent, and a no_log task that fails for
  # a missing directory reports nothing a reader can act on.
  ansible.builtin.file:
    path: "{{ seat_paseo_env_file | dirname }}"
    state: directory
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0700"

- name: seat | Render the Paseo password env file
  # The daemon's only identity gate: the `.ts` router carries no forward-auth, so without this
  # file the tailnet ACL would be the whole door. 0600 + no_log (§6).
  ansible.builtin.template:
    src: paseo-env.j2
    dest: "{{ seat_paseo_env_file }}"
    owner: "{{ seat_user }}"
    group: "{{ seat_user }}"
    mode: "0600"
    lstrip_blocks: true
  no_log: true
  notify: seat | reload and restart paseo

# The two config.json arms the door needs, written THROUGH THE CLI and never by templating the
# file: ~/.paseo/config.json also carries seat state this role does not own (cors, features,
# app.baseUrl), so the only correct writer of ONE key is the tool that merges it. Each arm is
# read first, so a re-converge reports no change. The `paseo` seat plane owns listen/relay/auth;
# these two are what the `paseo-oldsrv-ts` router cannot work without.

- name: seat | Read the daemon's Host allowlist
  ansible.builtin.command:
    argv:
      - "{{ seat_paseo_bin }}"
      - "--home"
      - "{{ seat_home }}/.paseo"
      - daemon
      - config
      - get
      - daemon.hostnames
  become: true
  become_user: "{{ seat_user }}"
  environment:
    HOME: "{{ seat_home }}"
    # The launcher is `#!/usr/bin/env node`, so this leg needs the same PATH the unit gets — without
    # it the CLI exits 127 with `env: node: not found` and the read looks like a broken daemon.
    PATH: "{{ seat_path }}"
  register: seat_paseo_hostnames_live
  changed_when: false
  # A read: it must answer in check mode too, or the `when` below evaluates from_json on an empty
  # stdout and a --check run fails on a filter, not on a defect (the linger task's lesson).
  check_mode: false

- name: seat | Set the daemon's Host allowlist for the .ts door
  # Without it the daemon answers 403 to `Host: paseo-oldsrv.ts.kogler.si`: the ACL allows the
  # peer, the router matches the name, and the daemon itself refuses it.
  ansible.builtin.command:
    argv:
      - "{{ seat_paseo_bin }}"
      - "--home"
      - "{{ seat_home }}/.paseo"
      - daemon
      - config
      - set
      - daemon.hostnames
      - "{{ seat_paseo_hostnames | to_json }}"
  become: true
  become_user: "{{ seat_user }}"
  environment:
    HOME: "{{ seat_home }}"
    # The launcher is `#!/usr/bin/env node`, so this leg needs the same PATH the unit gets — without
    # it the CLI exits 127 with `env: node: not found` and the read looks like a broken daemon.
    PATH: "{{ seat_path }}"
  when: (seat_paseo_hostnames_live.stdout | from_json).get('value', none) != seat_paseo_hostnames
  notify: seat | reload and restart paseo

- name: seat | Read the daemon's trusted-proxy list
  ansible.builtin.command:
    argv:
      - "{{ seat_paseo_bin }}"
      - "--home"
      - "{{ seat_home }}/.paseo"
      - daemon
      - config
      - get
      - daemon.trustedProxies
  become: true
  become_user: "{{ seat_user }}"
  environment:
    HOME: "{{ seat_home }}"
    # The launcher is `#!/usr/bin/env node`, so this leg needs the same PATH the unit gets — without
    # it the CLI exits 127 with `env: node: not found` and the read looks like a broken daemon.
    PATH: "{{ seat_path }}"
  register: seat_paseo_proxies_live
  changed_when: false
  # A read: it must answer in check mode too, or the `when` below evaluates from_json on an empty
  # stdout and a --check run fails on a filter, not on a defect (the linger task's lesson).
  check_mode: false

- name: seat | Set the daemon's trusted-proxy list
  # The home edge runs `network_mode: host`, so every proxied request arrives from loopback. Naming
  # it is what lets the daemon read the real peer from the forwarded header instead of the proxy.
  ansible.builtin.command:
    argv:
      - "{{ seat_paseo_bin }}"
      - "--home"
      - "{{ seat_home }}/.paseo"
      - daemon
      - config
      - set
      - daemon.trustedProxies
      - "{{ seat_paseo_trusted_proxies | to_json }}"
  become: true
  become_user: "{{ seat_user }}"
  environment:
    HOME: "{{ seat_home }}"
    # The launcher is `#!/usr/bin/env node`, so this leg needs the same PATH the unit gets — without
    # it the CLI exits 127 with `env: node: not found` and the read looks like a broken daemon.
    PATH: "{{ seat_path }}"
  when: (seat_paseo_proxies_live.stdout | from_json).get('value', none) != seat_paseo_trusted_proxies
  notify: seat | reload and restart paseo

- name: seat | Read the linger state
  # check_mode: false — a read that reports "not changed" in check mode is fine;
  # the point is that check mode must not claim linger is already on.
  ansible.builtin.command: loginctl show-user {{ seat_user }} -p Linger
  register: seat_linger
  changed_when: false
  check_mode: false

- name: seat | Enable linger (the seat survives logout, so it survives a reboot)
  # A user unit without linger does not run before the first login — the cockpit
  # would be down after every reboot until a human signed in at the console.
  ansible.builtin.command: loginctl enable-linger {{ seat_user }}
  when: "'Linger=yes' not in seat_linger.stdout"

# Handlers run at the END of a play, so without this the proof below would read the
# PRE-reload unit — the exact "the file is right, the daemon never reloaded" state.
- name: seat | Apply the unit handlers before proving
  meta: flush_handlers

- name: seat | Prove the running unit carries the PATH that finds `pi`
  # Read-after-write proof of the ONE property that breaks the phone path, taken from
  # the LIVE unit rather than the file: a drop-in that exists but was never reloaded
  # proves nothing (`enable --now` does not restart a running unit; only `restart`
  # does). BOTH dirs are asserted — a node-dir-only PATH passes until `pi update`
  # moves the seat to pi's managed launcher, then finds no `pi` at all, so one dir is
  # not the property.
  ansible.builtin.command: systemctl --user cat pi-web.service
  become: true
  become_user: "{{ seat_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ seat_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ seat_uid }}/bus"
  changed_when: false
  when: not ansible_check_mode
  register: seat_unit_live
  failed_when: >-
    (seat_unit_live.rc | default(1)) != 0
    or seat_pi_node_bin not in (seat_unit_live.stdout | default(''))
    or seat_pi_bin not in (seat_unit_live.stdout | default(''))

- name: seat | Prove the Paseo unit carries its bind and its PATH
  # `show -p Environment`, not `bash -lc which paseo`: the question is what the UNIT was handed,
  # and a login shell reads two startup files that this unit never will — the reading that passes
  # under `bash -lc` is the one that proves nothing. BOTH pi dirs plus the account's own bin, and
  # the PASEO_LISTEN the bind drop-in renders, because a drop-in that exists but was never reloaded
  # is the state where the file is right and the daemon answers somewhere else.
  ansible.builtin.command: systemctl --user show -p Environment paseo.service
  become: true
  become_user: "{{ seat_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ seat_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ seat_uid }}/bus"
  changed_when: false
  when: not ansible_check_mode
  register: seat_paseo_unit_live
  failed_when: >-
    (seat_paseo_unit_live.rc | default(1)) != 0
    or seat_pi_node_bin not in (seat_paseo_unit_live.stdout | default(''))
    or seat_pi_bin not in (seat_paseo_unit_live.stdout | default(''))
    or seat_local_bin not in (seat_paseo_unit_live.stdout | default(''))
    or ('PASEO_LISTEN=' ~ seat_bind ~ ':' ~ seat_paseo_port) not in (seat_paseo_unit_live.stdout | default(''))
