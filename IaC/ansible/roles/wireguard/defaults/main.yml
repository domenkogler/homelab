---
# wireguard role — VPS side of the site-to-site tunnel to the home router (wg-s2s)
#
# HD-03 / network-vpn.md: a single WireGuard S2S tunnel carries the home↔VPS path.
#   - Home RB4011: `wg-s2s` peer .1 (RouterOS — configured by the router role via
#     community.routeros.api_modify; wireguard_s2s_vps in group_vars/router.yml)
#   - VPS: `wg-s2s` peer .2 (this role — systemd-networkd WireGuard interface)
#   - VPS routes home `site` (10.10.0.0/16) via the home S2S peer → VPS Prometheus
#     reaches nut/zfs/ha_vip/ICMP and old-srv over the router-routed home VLANs.
#
# The private key is the shared `wg_password` (1Password → password field) per the
# repo secrets convention (docs/deployment-secrets.md: WireGuard private key).
# The router's public key must be provisioned as `wg_s2s_router_public_key` in vars
# (derived from the router's wireguard key) before deploy — fail-closed if missing.

# systemd-networkd interface + unit basename.
wg_interface: wg-s2s
wg_netdev_dir: /etc/systemd/network

# HD-306: systemd 257 networkd creates wg-s2s but never applies the [WireGuardPeer] to
# the kernel (interface up, no peer). The proven reliable workaround is `wg setconf` from
# a rendered conf file — the conf MUST omit PrivateKey (live-verified 2026-09-01: a
# setconf conf with a PrivateKey line silently drops the peer on this kernel; the key is
# already on the interface from the .netdev). The conf is therefore secret-free (0644).
wg_ensure_dir: /usr/local/libexec/wireguard
wg_conf_dir: /etc/wireguard

# PersistentKeepalive for the wg-s2s peer (HD-285): the home router WAN is behind
# stateful NAT/CGNAT — without a keepalive WireGuard never initiates the handshake
# unless app traffic flows, so the tunnel sits down silently. 25 s is the standard
# NAT-traversal interval. Applied both in the .netdev (boot) and wg-s2s.conf (oneshot).
wg_persistent_keepalive: 25