---
# amd_rocm role — host ROCm userspace + GPU access rules (docs/hardware-gpu.md)
#
# HD-318 (2026-09-07): Ubuntu-noble AMD ROCm repo is INCOMPATIBLE with Debian trixie
# (rocm-cmake/hipcc dep resolution conflicts). The ONLY host-side ROCm consumers left
# on oldsrv are GPU containers (immich-ml; ollama removed 2026-09-07) that BUNDLE their
# own ROCm runtime and only need /dev/dri + /dev/kfd + udev/group access. So this role
# now installs Debian-triXIE-NATIVE ROCm userspace (rocm-opencl-icd, rocminfo — no
# external AMD repo at all) purely for host-side tooling/inspection (rocminfo, OpenCL
# query), and keeps exactly the GPU plumbing containers need.
#
# Decisions (recorded):
#   - Repo: NONE (external AMD repo removed HD-318). Debian trixie ships
#     rocm-opencl-icd 5.7.1 / hipcc 5.7.1 / rocminfo 6.1.2 / rocm-smi-lib in main.
#   - Kernel: in-tree amdgpu driver + firmware-amd-graphics (RX 7600 / gfx1102).
#     NO amdgpu-dkms — the Debian kernel already supports the card.
#   - Ollama removed from oldsrv (owner decision 2026-09-07, docs/services-ai.md);
#     this role no longer serves it. immich-ml (container-bundled ROCm) remains.
#   - GPU containers map /dev/dri + /dev/kfd and bundle their own ROCm runtime;
#     the role installs host userland for tooling/inspection + device access.
#
# Secrets: none — public packages, no credentials.
# Condition: applied from playbooks/home_servers.yml when gpu_vendor == "amd".

- name: Refuse runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      amd_rocm role must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

- name: Create keyring directory if it does not exist
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [amd_rocm]

- name: Install AMD GPU firmware + Debian-native ROCm host userspace (HD-318)
  # HD-318: external AMD noble repo removed — Debian trixie packages only. Keep
  # pre-existing amd_rocm_repo/amd_rocm_suite vars unused (legacy, flagged for removal).
  ansible.builtin.apt:
    name: "{{ ['firmware-amd-graphics'] + amd_rocm_packages }}"
    state: present
    update_cache: true
  tags: [amd_rocm]

- name: Add admin user to video + render groups (GPU device access)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: [video, render]
    append: true
  when: ansible_user in ansible_admin_users
  tags: [amd_rocm]

- name: Udev rules — world-accessible /dev/kfd + /dev/dri/renderD* for containers
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-rocm.rules
    content: |
      # AMD ROCm (roles/amd_rocm) — container/GPU device access (docs/hardware-gpu.md)
      KERNEL=="kfd", MODE="0666"
      SUBSYSTEM=="drm", KERNEL=="renderD*", MODE="0666"
    mode: '0644'
  notify: [reload udev, trigger udev]
  tags: [amd_rocm]

# HD-404 (4): this host-level env write is REMOVED, not repointed. The ollama CONTAINER already
# gets OLLAMA_KEEP_ALIVE from its own compose template (`docker_services/ollama`, same
# `ollama_keep_alive` var), so the /etc/environment copy changed nothing except the impression
# that this box runs a chat model worth keeping warm — decision #27 demoted its only Ollama to
# the embed fallback rung. lineinfile with state: absent so an already-installed stale line is
# actually taken off the box; the var itself stays (the compose template is its real consumer).
- name: Remove the obsolete host-level OLLAMA_KEEP_ALIVE (HD-404; the container env owns it)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^OLLAMA_KEEP_ALIVE='
    state: absent
  tags: [amd_rocm]

# Verify after deploy:  getent group video render
#                        rocminfo | head          (or rocm-smi)
#                        ls -l /dev/kfd /dev/dri/renderD*