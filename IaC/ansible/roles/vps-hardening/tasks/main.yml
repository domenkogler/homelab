---
# vps-hardening role — mandatory VPS pre-deploy hardening checklist (HD-154)
# Enforces security.md §8 as executable, idempotent, fail-loud IaC.

- name: Refuse vps-hardening runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      vps-hardening must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

# ── 1. fail2ban — SSH + HTTP jails (brute-force throttle) ────────────────
- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Configure fail2ban jails (SSH + nginx/Traefik http-auth)
  copy:
    dest: /etc/fail2ban/jail.local
    mode: '0644'
    content: |
      [DEFAULT]
      bantime = 10m
      findtime = 10m
      maxretry = 5
      ignoreip = 127.0.0.1/8 ::1

      [sshd]
      enabled = true
      backend = systemd
      maxretry = 3

      [http-auth]
      enabled = true
      port = http,https
      filter = nginx-http-auth
      logpath = /var/log/traefik/access.log
      maxretry = 5
  notify: restart fail2ban

- name: Ensure fail2ban is running + enabled
  systemd:
    name: fail2ban
    state: started
    enabled: true

# ── 2. nftables default-deny inbound (allow :443 + :51820 WG only) ────────
- name: Install nftables
  apt:
    name: nftables
    state: present

- name: Deploy nftables ruleset (default-deny inbound)
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
  notify: reload nftables

- name: Enable + start nftables
  systemd:
    name: nftables
    state: started
    enabled: true

# HD-230 (2026-08-23, found live): Debian's stock nftables.service ships
# ExecStop=/usr/sbin/nft flush ruleset — every stop/restart WIPED docker-programmed
# nat/filter tables even with the scoped ruleset file below (the wipe came from the
# STOP half of restart, not the load). Emptying ExecStop makes restart a pure
# scoped re-load; docker chains survive.
- name: Ensure nftables.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: '0755'

- name: Override nftables.service ExecStop (drop the stop-flush)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/override.conf
    content: |
      # Managed by vps-hardening (HD-230). Stock ExecStop='nft flush ruleset'
      # wipes docker iptables-nft tables on every restart. Start/reload paths are
      # already table-scoped via /etc/nftables.conf; an empty ExecStop makes
      # restart equally safe.
      [Service]
      ExecStop=
    mode: '0644'
  notify: daemon reload

# HD-223 residual CLOSED (2026-08-23): the ruleset now replaces ONLY its own
# `table inet filter` (declare+delete+recreate idiom in nftables.conf.j2) instead of
# 'flush ruleset', so docker's iptables-nft chains survive every apply/restart and
# NO docker restart is needed here anymore. History: loading a 'flush ruleset'
# ruleset deleted docker's tables — later network creation failed with "No chain/
# target/match by that name" (found live Phase 1, 2026-08-22) and a nftables restart
# briefly wiped docker NAT fleet-wide (Incident C recovery, 2026-08-23).

# ── 3. Docker daemon hardening ────────────────────────────────────────────
- name: Harden Docker daemon (iptables explicit, no host bindings by default)
  copy:
    dest: /etc/docker/daemon.json
    mode: '0644'
    content: |
      {
        "iptables": true,
        "ip6tables": true,
        "userland-proxy": false,
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: restart docker

# ── 4. Assert sshd hardening landed (post_install.sh + this role) ─────────
- name: Assert sshd hardening is present
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^{{ item.key }}\s'
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - { key: "PasswordAuthentication", value: "no" }
    - { key: "PermitRootLogin",        value: "no" }
    - { key: "MaxAuthTries",           value: "3" }
  check_mode: false
