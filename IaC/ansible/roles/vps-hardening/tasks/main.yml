---
# vps-hardening role — mandatory VPS pre-deploy hardening checklist (HD-154)
# Enforces security.md §8 as executable, idempotent, fail-loud IaC.

- name: Refuse vps-hardening runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      vps-hardening must only run as an allowed admin user
      ({{ ansible_admin_users | join(', ') }}).
  tags: always

# ── 1. fail2ban — SSH + HTTP jails (brute-force throttle) ────────────────
- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Configure fail2ban jails (SSH + nginx/Traefik http-auth)
  copy:
    dest: /etc/fail2ban/jail.local
    mode: '0644'
    content: |
      [DEFAULT]
      bantime = 10m
      findtime = 10m
      maxretry = 5
      ignoreip = 127.0.0.1/8 ::1

      [sshd]
      enabled = true
      backend = systemd
      maxretry = 3

      [http-auth]
      enabled = true
      port = http,https
      filter = nginx-http-auth
      logpath = /var/log/traefik/access.log
      maxretry = 5
  notify: restart fail2ban

- name: Ensure fail2ban is running + enabled
  systemd:
    name: fail2ban
    state: started
    enabled: true

# ── 2. nftables default-deny inbound (allow :443 + :51820 WG only) ────────
- name: Install nftables
  apt:
    name: nftables
    state: present

- name: Deploy nftables ruleset (default-deny inbound)
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
  notify: reload nftables

- name: Enable + start nftables
  systemd:
    name: nftables
    state: started
    enabled: true

# HD-299 (Option A): the DNS primary resolver for LAN/tailnet is the VPS public IP.
# The nftables input allow for home-WAN DNS uses a `dns-allow-home` set populated
# from the home DDNS record (s.kogler.si, the router's WAN IP). A small timer
# re-resolves it every 5 minutes so a DDNS change doesn't strand home DNS queries.
- name: Deploy DNS-allow home-DDNS refresh systemd unit + timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/dns-allow-refresh.service
    mode: '0644'
    content: |
      [Unit]
      Description=Refresh home-WAN source IP in nftables dns-allow-home set (HD-299)

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/dns-allow-refresh.sh
- name: Deploy dns-allow-refresh timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/dns-allow-refresh.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Refresh home-WAN source IP in nftables dns-allow-home set (5 min)

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=5min
      Unit=dns-allow-refresh.service

      [Install]
      WantedBy=timers.target
- name: Deploy dns-allow-refresh script
  ansible.builtin.copy:
    dest: /usr/local/sbin/dns-allow-refresh.sh
    mode: '0755'
    content: |
      #!/bin/sh
      # Re-resolve the home WAN DDNS record and refresh the nftables dns-allow-home
      # set (HD-299 Option A). Fails silently if the record is unreachable (keeps
      # the previous address; the timer retries).
      set -eu
      ip=$(getent ahostsv4 s.kogler.si | awk 'NR==1{print $1}')
      [ -n "$ip" ] || exit 0
      # HD-317 live fix (2026-09-03): use the ABSOLUTE nft path — systemd services
      # run with a minimal PATH that lacks /usr/sbin, so the timer was failing
      # with 'nft: not found' and the dns-allow-home set was never populated
      # (home WAN could not query the VPS DNS primary).
      /usr/sbin/nft flush set inet filter dns-allow-home
      /usr/sbin/nft add element inet filter dns-allow-home { "$ip" }
- name: Enable + start dns-allow-refresh timer
  ansible.builtin.systemd:
    name: dns-allow-refresh.timer
    state: started
    enabled: true

# HD-230 (2026-08-23, found live): Debian's stock nftables.service ships
# ExecStop=/usr/sbin/nft flush ruleset — every stop/restart WIPED docker-programmed
# nat/filter tables even with the scoped ruleset file below (the wipe came from the
# STOP half of restart, not the load). Emptying ExecStop makes restart a pure
# scoped re-load; docker chains survive.
- name: Ensure nftables.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: '0755'

- name: Override nftables.service ExecStop (drop the stop-flush)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/override.conf
    content: |
      # Managed by vps-hardening (HD-230). Stock ExecStop='nft flush ruleset'
      # wipes docker iptables-nft tables on every restart. Start/reload paths are
      # already table-scoped via /etc/nftables.conf; an empty ExecStop makes
      # restart equally safe.
      [Service]
      ExecStop=
    mode: '0644'
  notify: daemon reload

# HD-223 residual CLOSED (2026-08-23): the ruleset now replaces ONLY its own
# `table inet filter` (declare+delete+recreate idiom in nftables.conf.j2) instead of
# 'flush ruleset', so docker's iptables-nft chains survive every apply/restart and
# NO docker restart is needed here anymore. History: loading a 'flush ruleset'
# ruleset deleted docker's tables — later network creation failed with "No chain/
# target/match by that name" (found live Phase 1, 2026-08-22) and a nftables restart
# briefly wiped docker NAT fleet-wide (Incident C recovery, 2026-08-23).

# ── 3. Docker daemon hardening ────────────────────────────────────────────
- name: Harden Docker daemon (iptables explicit, no host bindings by default)
  copy:
    dest: /etc/docker/daemon.json
    mode: '0644'
    content: |
      {
        "iptables": true,
        "ip6tables": true,
        "userland-proxy": false,
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: restart docker

# ── 4. Assert sshd hardening landed (post_install.sh + this role) ─────────
- name: Assert sshd hardening is present
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^{{ item.key }}\s'
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - { key: "PasswordAuthentication", value: "no" }
    - { key: "PermitRootLogin",        value: "no" }
    - { key: "MaxAuthTries",           value: "3" }
  check_mode: false
