---
# Network-clients exporter — host binary on oldsrv, Mgmt-plane collector.
# Listen is loopback-only (the local Alloy scrapes it; nothing publishes it).
network_clients_listen: 9097
network_clients_scrape_interval: 45

# Alert rule definitions — consumed by grafana-rules.yml.j2 (monitoring step 3).
# !unsafe: summaries carrying Go-template vars ({{ $labels.* }} / {{ $values.* }}) must NOT be
# re-templated by Ansible at render. Tiers + thresholds per docs/observability.md. Exprs are PromQL
# over metrics that exist today (nut_* from DRuggeri/nut_exporter, node_* from Alloy,
# probe_success from blackbox, up from the self-scrape jobs in alloy.river.j2).
# The self-monitoring rules key off up{job="victoria-metrics"}/up{job="victoria-logs"} — the VM/VL
# self-scrape job names; a rule keyed to a job name that no longer exists is silently dead.
# noDataState/execErrState: Alerting only on self-monitoring rules (a dead data
# source must still page).
grafana_alert_rules:
  critical:
    # ---- The two silent-failure classes this stack cannot see ----
    # Series come from /usr/local/sbin/homelab-hygiene.py → the Alloy textfile collector on each
    # monitoring host (roles/monitoring/tasks/main.yml). A failing timer must change a series,
    # otherwise it can fail every 15 min for days with nothing else moving.
    - uid: cert-pair-missing
      title: Consumer edge holds no cert pair
      for: 5m
      expr: "homelab_cert_pair_present == 0"
      summary: !unsafe "Cert pair absent on consumer {{ $labels.consumer }} ({{ $labels.instance }}) — the pull never landed"
      # The absent-file case gets its OWN series rather than a NaN days-left value: NaN parses fine and
      # `NaN < 14` is false, so a vanished pair would have read as "not expiring".
      noDataState: OK
      execErrState: Error
      eval_type: lt
      eval_params: [1]
    - uid: cert-age-critical
      title: Consumer cert pair nearly expired
      for: 10m
      expr: "homelab_cert_days_left < 7"
      summary: !unsafe "Cert on {{ $labels.consumer }} ({{ $labels.instance }}) expires in under 7 days"
      # ⚠ 7 here, and the warning twin is 14 — NOT 30/14. The wildcard pair is a 90-day cert and the
      # issuer renews late in that window, so a HEALTHY consumer's days-left bottoms out around three
      # weeks. A 30-day warning would fire for days before every scheduled renewal — which is how an
      # alert class gets muted. RE-DERIVE both if the pair lifetime or the renewal window changes.
      noDataState: OK
      execErrState: Error
    - uid: hygiene-collector-stale
      title: Silent-failure collector stopped reporting
      # for: 5m — the staleness threshold lives in the expression, so `for` is only the anti-jitter
      # hold; the page lands ~20 min after the last successful collection (900 s + 5 m).
      for: 5m
      # ⚠ UNFILTERED on purpose. A FILTERED-EMPTY result is the same NoData state as no-series, so with
      # noData=Alerting the rule fires exactly WHEN EVERYTHING IS FRESH. The comparison therefore lives
      # in the threshold expression (`eval_type`/`eval_params` below) — the shape
      # spark-host-mem-oom-critical further down already uses, which reads Normal.
      #  ⚠ A plain selector also cannot age: the 5-min scrape horizon drops the last heartbeat TEN
      #      MINUTES BEFORE a 900 s threshold is reachable, so a dead collector could only ever reach
      #      this rule as NoData — paging without ever naming which host went blind. `max_over_time[6h]`
      #      keeps a silent host visible for 6 h, so the page carries `instance=`.
      # noData=Alerting stays: every leg reports healthy → the expression has a value → Normal; it is
      # empty only when NO host has collected in 6 h, which IS the blind-coverage case.
      expr: "time() - max_over_time(homelab_hygiene_scrape_ok[6h])"
      summary: !unsafe "homelab-hygiene collector stale on {{ $labels.instance }} (no collection for >15 min) — unit-result and cert-age coverage is blind there"
      noDataState: Alerting
      execErrState: Error
      eval_type: gt
      eval_params: [900]
    - uid: ups-battery-low
      title: UPS battery low
      for: 1m
      expr: "network_ups_tools_battery_charge < 20"
      summary: "UPS battery below 20% — impending shutdown"
      # noData=OK: battery_charge has a live series (nut_exporter, nas) — when it is
      # absent that is a collection gap, not a low battery; no-data must not page.
      noDataState: OK
      execErrState: Error
    - uid: ups-runtime-low
      title: UPS runtime low
      for: 1m
      expr: "network_ups_tools_battery_runtime < 300"
      summary: "UPS runtime below 5 min — impending shutdown"
      # noData=OK: same as ups-battery-low — collection gap ≠ low runtime.
      noDataState: OK
      execErrState: Error
    - uid: public-service-down
      title: Public service unreachable
      for: 2m
      expr: 'probe_success{job="blackbox_http_probes"} == 0'
      summary: "Unreachable public service (probe_success = 0)"
      # noData=OK: if blackbox_http_probes produces no series (config/job gap), that is
      # NOT every public service being down — only fire when a series exists and is 0.
      noDataState: OK
      execErrState: Error
      # `== 0` returns 0 — evaluator must be `lt 1`, not the `gt 0` default.
      eval_type: lt
      eval_params: [1]
    - uid: host-unreachable
      title: Host unreachable
      for: 2m
      expr: 'probe_success{job="blackbox_icmp"} == 0'
      summary: "Host unreachable (ICMP probe failed)"
      # noData=OK: when blackbox_icmp produces NO series at all (e.g. config
      # issue), that is NOT a host-down — only fire when a series exists and is 0;
      # no-data must not leave the rule stuck in an alerting state.
      noDataState: OK
      execErrState: Error
      # `== 0` returns 0 — evaluator must be `lt 1`, not the `gt 0` default.
      eval_type: lt
      eval_params: [1]
    - uid: host-disk-full
      title: Host disk nearly full
      for: 5m
      expr: >-
        (node_filesystem_avail_bytes{mountpoint=~"/|/srv|/var/lib/docker"}
        / node_filesystem_size_bytes{mountpoint=~"/|/srv|/var/lib/docker"}) < 0.10
      summary: "Host disk ≥ 90% used"
      # noData=OK: if the host-metrics (Alloy) series aren't present, that is
      # NOT a disk-full condition — it means the data source is missing, which is
      # the self-monitoring rules' job (victoria-metrics-down), not a disk alert; and
      # no-data must not leave the rule stuck in a pending/alerting state.
      noDataState: OK
      execErrState: Error
    - uid: victoria-metrics-down
      title: VictoriaMetrics is down
      for: 2m
      expr: 'up{job="victoria-metrics"} == 0'
      summary: "VictoriaMetrics self-scrape failed — alerting data source is dead"
      # up{job=victoria-metrics} is a real series (VM self-scrape /metrics on 8428), so it goes 0 only
      # when VM is genuinely down — noData=OK keeps a transient scrape gap from falsely firing an
      # Alerting state. `== 0` needs the `lt 1` evaluator (see grafana-rules.yml.j2): a `gt 0`
      # evaluator makes this rule dead.
      noDataState: OK
      execErrState: Alerting
      eval_type: lt
      eval_params: [1]
    - uid: zfs-pool-full
      title: ZFS pool nearly full
      for: 5m
      expr: "(zfs_pool_allocated / zfs_pool_size) * 100 >= 80"
      summary: !unsafe "ZFS pool {{ $labels.pool }} at {{ $values.A }}% — ≥80% used (Critical)"
      # noData=OK: an absent pool series is not a pool-full condition (and must not
      # leave the rule stuck in a pending/alerting state).
      noDataState: OK
      execErrState: Error
    - uid: zfs-pool-degraded
      title: ZFS pool degraded
      for: 5m
      expr: "zfs_pool_health == 1"
      summary: !unsafe "ZFS pool {{ $labels.pool }} is DEGRADED"
      # health=0 means OK; ==1 is degraded. No series = no pool, not degraded.
      noDataState: OK
      execErrState: Error
    - uid: wg-s2s-down
      title: Home<->VPS WireGuard tunnel down
      for: 2m
      expr: 'probe_success{job="wg_icmp"} == 0'
      summary: "wg-s2s tunnel down — home reachable only if the WG link is up"
      # probe_success{wg_icmp} is a real series (blackbox relabel); it goes 0 only when the tunnel
      # probe genuinely fails — noData=OK stops a transient no-data gap from falsely firing or sticking
      # in Alerting. `== 0` needs `lt 1` evaluator.
      noDataState: OK
      execErrState: Alerting
      eval_type: lt
      eval_params: [1]
    # ---- spark GB10 unified-memory OOM ----------
    # spark's vLLM engine dies via the kernel GLOBAL OOM killer; the container cage never
    # fires (OOMKilled=false is the normal reading), so a host-memory rule is the ONLY
    # early warning. GAUGE: MemAvailable - CmaFree. Raw MemAvailable overstates headroom
    # by up to ~9 GiB on GB10 because CmaFree counts as available and GROWS as the GPU
    # carve is squeezed — i.e. that metric inflates exactly when pressure rises.
    # THRESHOLDS ARE MEASURED, NOT PICKED (VM, 2-minute steps, from observed kill windows):
    #   healthy idle .................. 26-30 GiB
    #   the minutes before a kill ..... 5-11 GiB
    #   the kill instant (meminfo) .... ~1.6 GiB
    # The kill instant is not observable by a scrape-based rule — the lowest value a 60 s scrape
    # recorded was 5.01. So CRIT is 8, not 1.6: a threshold below the scrape floor would be a rule
    # that can never fire.
    # `for: 1m` on purpose: a fall from ~14 to ~9 GiB takes 2-4 min; a 5m window burns the entire lead
    # time before the rule arms.
    # NOTE the evaluator convention: the expr carries NO comparison — it yields
    # the usable-GiB value and the THRESHOLD lives in eval_params. Putting `< 8` in the
    # expr instead would hand the raw value to a `gt 0` evaluator, which fails at exactly
    # usable = 0 — the worst possible moment. `lt` on the value is unambiguous.
    - uid: spark-host-mem-oom-critical
      title: spark host memory near OOM (unified pool)
      for: 1m
      expr: "(node_memory_MemAvailable_bytes{job=\"alloy\",instance=~\"spark.*\"} - node_memory_CmaFree_bytes{job=\"alloy\",instance=~\"spark.*\"}) / 1073741824"
      summary: "spark usable host memory < 8 GiB (MemAvailable-CmaFree) — kernel global OOM imminent; the watchdog may restart the engine"
      # noData=Alerting: this is the one rule where silence is NOT golden — a disappearing
      # series means being blind to the kernel OOM kill, the one failure mode that wedges
      # the box.
      noDataState: Alerting
      execErrState: Alerting
      eval_type: lt
      eval_params: [8]
  warning:
    # ---- Warning twins of the silent-failure rules (thresholds + source series above) ----
    - uid: unit-last-result-failed
      title: Systemd unit's last run failed
      for: 5m
      expr: "homelab_unit_last_success == 0"
      summary: !unsafe "{{ $labels.unit }} on {{ $labels.instance }}: last run did not succeed (result={{ $labels.result }})"
      # `is-active` answers "inactive" for a healthy oneshot, so only the RESULT distinguishes
      # "ran fine" from "failed and will be retried" — an `is-active`-based leg reads healthy while the
      # unit is actually failing. result="missing" means the unit is not installed on that host —
      # listed-but-absent alerts on purpose, so a wrong list is a visible alert and never a silent pass.
      noDataState: OK
      execErrState: Error
      eval_type: lt
      eval_params: [1]
    - uid: unit-last-success-stale
      title: A watched timer has not succeeded recently
      # 90 min = six missed fires of the 15-min cert pulls this fleet actually watches, so one dropped
      # tick or one reboot-then-run cannot page. The threshold lives in eval_params, never in the expr.
      for: 30m
      # UNFILTERED, and `max_over_time[6h]` for the reason hygiene-collector-stale above documents: the
      # value here is a TIMESTAMP, so the series stays fresh while the age it implies grows, and the
      # window is what keeps `unit=`/`instance=` on the page instead of collapsing to NoData.
      expr: "time() - max_over_time(homelab_unit_last_success_timestamp_seconds[6h])"
      summary: !unsafe "No successful run of {{ $labels.unit }} on {{ $labels.instance }} for >90 min — the timer stopped firing, the unit is masked, or a run never returns"
      # The twin that `unit-last-result-failed` cannot be: a timer that stops firing produces no attempt,
      # so no result, and `last_success` keeps the value of some earlier success forever. Age-of-success is
      # also the only eye on a pull whose bytes never move — a cert pair that simply ages is invisible to
      # cert-age-warning for the whole 90-day window.
      # noDataState: OK because absence is not a fault here: the exporter emits this series ONLY for a
      # timer-driven unit whose last run succeeded, so a host whose watched units have not yet run since a
      # reboot legitimately carries no value, and paging on that would be paging on a boot.
      noDataState: OK
      execErrState: Error
      eval_type: gt
      eval_params: [5400]
    - uid: cert-age-warning
      title: Consumer cert pair aging
      for: 30m
      expr: "homelab_cert_days_left < 14"
      summary: !unsafe "Cert on {{ $labels.consumer }} ({{ $labels.instance }}) expires in under 14 days"
      # Below the measured renewal floor (~3 weeks on a 90-day pair), so it says "a renewal was MISSED",
      # not "a renewal is due". See cert-age-critical for the numbers.
      noDataState: OK
      execErrState: Error
    - uid: nut-master-unreachable
      title: NUT client cannot reach its master
      for: 5m
      expr: "homelab_nut_master_reachable == 0"
      summary: !unsafe "NUT client on {{ $labels.instance }} cannot read its master {{ $labels.master }} — UPS state and shutdown coordination are blind there"
      # The unit legs cannot carry this: `upsmon` keeps a dead upstream and its unit stays `active`, so
      # this is the only series that answers "can THIS client reach the master". `result=` lives on the
      # twin series, not on this gauge, so the page names host + master and the WHY (`unreachable` vs
      # `unknown`) is read from `homelab_nut_master_result`. noData=OK because a host that runs no NUT client legitimately emits
      # nothing — absence there is topology, not an outage; the collector itself going silent is the
      # hygiene-collector-stale rule's job. `== 0` returns 0, so the evaluator is `lt 1`, not `gt 0`.
      noDataState: OK
      execErrState: Error
      eval_type: lt
      eval_params: [1]
    # ---- running version vs the versions.yml pin (docs/observability.md §Pin-lag report) ----------
    # The rule half of the pin-lag leg. It ships AFTER the series, not with them: a rule aimed at a
    # series the backend has never held sits green forever (docs/observability.md §Operational gotchas:
    # "alert rules must match the live backend"). The pin legs went live on all five monitoring hosts
    # first, and were read back out of VictoriaMetrics before this line was written.
    - uid: pkg-pin-drift
      title: A host runs a package that is not its pin
      for: 30m
      expr: "count by (instance) (homelab_pkg_pin_result{result=\"differ\"})"
      summary: !unsafe "{{ $labels.instance }} runs {{ $values.A }} pinned package(s) off their versions.yml pin — read homelab_pkg_pin_result for pin= vs running="
      # ⚠ Keyed on result="differ" and NEVER on homelab_pkg_pin_ok. The ok gauge is 0 for TWO different
      # statements: "off its pin" and "this host does not carry the package" (result="missing" — `nas`
      # runs no Docker at all, and the pin map is fleet-wide). A rule on the gauge pages on a host that
      # legitimately has nothing to be in sync with, forever.
      # result="unknown" (dpkg answered no version with no error — the state of a package the database
      # knows and holds and has NEVER installed) is deliberately absent too: it is a read the
      # collector could not explain, printed to its own journal, not a version that moved.
      # noDataState: OK, reasoned rather than copied. This expression is EMPTY when every host matches,
      # because a count over a filtered selector with no matches returns no series — the same NoData
      # state docs/observability.md §Operational gotchas warns about, and the exact defect the corrected
      # hygiene-collector-stale was written to stop. `Alerting` here would page every evaluation on a
      # fleet that is entirely in sync. Blindness is not this rule's job either: a collector that stops
      # reporting is hygiene-collector-stale (CRIT), which already names the host.
      # for: 30m — pin drift is a queue item, not an outage: the fix is a reviewed Renovate PR plus a
      # deliberate converge, never a midnight action. The hold also covers the one legitimate transient,
      # a pinned suite install caught mid-flight with some members moved and others not.
      noDataState: OK
      execErrState: Error
    # Pre-stage of the critical rule above, same gauge, same source of truth. Gives the
    # owner room to route agent sessions off spark before the governor has to act.
    - uid: spark-host-mem-oom-warning
      title: spark host memory trending low (unified pool)
      for: 2m
      expr: "(node_memory_MemAvailable_bytes{job=\"alloy\",instance=~\"spark.*\"} - node_memory_CmaFree_bytes{job=\"alloy\",instance=~\"spark.*\"}) / 1073741824"
      # ⚠ threshold is 12 (eval_params below), NOT the 8 of the CRIT twin — copying the CRIT
      # value here mis-labels every notification this tier sends.
      summary: "spark usable host memory < 12 GiB (MemAvailable-CmaFree) — engine peak trending toward the reserve"
      # noData=OK here (unlike the CRIT twin): a collection gap is not a memory trend,
      # and this tier is the one that would cry wolf.
      noDataState: OK
      execErrState: Error
      eval_type: lt
      eval_params: [12]
    - uid: ups-on-battery
      title: UPS on battery
      for: 1m
      # DRuggeri/nut_exporter v3: status is per-flag labels — {flag="OB"}=1 on battery.
      # (The old modulo-bitmask expr was for a different exporter's nut_ups_status int.)
      expr: "network_ups_tools_ups_status{flag=\"OB\"} == 1"
      summary: "UPS is on battery — mains lost (auto-clears on return)"
      # noData=OK: the status flag series exists (15 flag labels) — absent series = no
      # status, not on-battery; only fire when OB=1 explicitly.
      noDataState: OK
      execErrState: Error
    - uid: ups-battery-replace
      title: UPS battery needs replacement
      for: 10m
      expr: "network_ups_tools_ups_status{flag=\"RB\"} == 1"
      summary: "UPS reports Replace-Battery flag"
      # noData=OK: absent series = no status, not a replace-battery condition.
      noDataState: OK
      execErrState: Error
    - uid: ha-unreachable
      title: Home Assistant unreachable
      for: 1m
      expr: 'probe_success{job="blackbox_http_probes", instance="https://ha.kogler.si"} == 0'
      summary: "ha.kogler.si HTTP probe failed"
      # noData=OK: absent probe_success series ≠ HA down; only fire when the probe runs
      # and reports 0 (same class as host-unreachable). `== 0` needs `lt 1` evaluator.
      noDataState: OK
      execErrState: Error
      eval_type: lt
      eval_params: [1]
    - uid: ssl-cert-expiring
      title: TLS certificate expiring soon
      for: 5m
      expr: '(probe_ssl_earliest_cert_expiry{job="blackbox_http_probes"} - time()) < 86400*14'
      summary: !unsafe "TLS cert on {{ $labels.instance }} expires in under 14 days"
      # Pi traefik-ha serves a pulled wildcard cert (ACME disabled): alert before expiry so the
      # VPS (single ACME issuer) renews it while up. noData=OK because blackbox emits no
      # SSL-expiry series for these probes — no-data must not fire "cert expiring".
      noDataState: OK
      execErrState: Error
    - uid: host-load-high
      title: Host load high
      for: 5m
      expr: "(node_load1 / count(node_cpu_seconds_total)) > 0.85"
      summary: "Host load average above 85% of CPU count"
      # noData=OK: absent node_* series (Alloy not reporting) isn't a load spike.
      noDataState: OK
      execErrState: Error
    - uid: victoria-logs-down
      title: VictoriaLogs is down
      for: 2m
      expr: 'up{job="victoria-logs"} == 0'
      summary: "VictoriaLogs self-scrape failed — log store is dead"
      # up{job=victoria-logs} is a real series (VL self-scrape /metrics on 9428) — only fire when the
      # series explicitly goes 0. `== 0` needs `lt 1` evaluator; per docs the log store must alert when
      # dead.
      noDataState: OK
      execErrState: Error
      eval_type: lt
      eval_params: [1]
    - uid: n8n-down
      title: n8n is down
      for: 2m
      expr: 'up{job="n8n"} == 0'
      summary: "n8n self-scrape failed — alert router is dead (SMTP failsafe still active)"
      # n8n is on db-internal so up{job=n8n} is real (N8N_METRICS); noData=OK prevents a
      # permanently-missing series from paging. `== 0` needs `lt 1` evaluator.
      noDataState: OK
      execErrState: Error
      eval_type: lt
      eval_params: [1]
    - uid: zfs-pool-warn
      title: ZFS pool usage high
      for: 5m
      expr: "(zfs_pool_allocated / zfs_pool_size) * 100 >= 70"
      summary: !unsafe "ZFS pool {{ $labels.pool }} at {{ $values.A }}% — ≥70% used"
      noDataState: OK
      execErrState: Error
