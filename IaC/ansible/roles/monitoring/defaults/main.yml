# ---- silent-failure hygiene collector -----------------------------------------------------------
# What `homelab-hygiene.py` reports, and therefore what the two alert rules can see: a systemd
# unit's result is not scraped at all, and the cert pair a *consumer* holds is not exported either
# (the only cert rule reads `probe_ssl_earliest_cert_expiry`, which has zero series because blackbox
# emits no SSL expiry). The exporter, the fail-loud rules and the metric names live in
# templates/homelab-hygiene.py.j2; the rules live in vars/main.yml.

# The shape is a loopback HTTP exporter scraped by this host's Alloy — NOT a textfile file: this
# Alloy build accepts a `textfile {}` block but rejects every attribute name that would point it at a
# directory, so a textfile variant could not name a directory anyone could scrape. Loopback + one
# scrape job is the shape the same role already runs for the network-clients exporter.
monitoring_hygiene_listen: 127.0.0.1
# 9098: the next free loopback exporter port in this inventory (9097 is network-clients).
monitoring_hygiene_port: 9098

# Units whose LAST RESULT matters, per host — set in host_vars, empty by default on purpose: a unit
# listed on a host that does not run it reports last_success=0 (`result="missing"`), which alerts.
# Being wrong about the list therefore costs a visible alert, never silence — see the script's header.
monitoring_hygiene_units: []

# The cert pair each consumer edge actually loads. Declared per host (see host_vars) rather than
# derived: the destination lives in TWO templates that do not agree —
# `docker_services/templates/traefik-cert-pull.sh.j2` renders
# `{{ docker_compose_dir }}/{{ traefik_consumer_dir }}/certs/` (and `traefik_consumer_dir` is a
# task-scoped var set inside the docker_services role, so it is not even defined for a role that runs
# earlier), while `home_assistant/templates/ha-cert-sync.sh.j2` hardcodes `/opt/traefik-ha/certs/`.
# Reading it from either would be a third copy of the fact, and a DST that drifts from its own SSOT
# is exactly what this catches. So each entry is an absolute path confirmed on the host, and the
# cert-pull script's DST is what a drift between the two would break — the row in
# docs/services-traefik.md §Certification owns that contract.
# Empty on a host that holds no consumer pair: nothing to report, nothing to alert on.
monitoring_hygiene_certs: []

# The pinned HOST packages the collector measures — the read-only pin-lag leg. An entry names the package
# and the versions.yml VAR that pins it; the value is resolved at render, so this file can never disagree
# with `group_vars/all/versions.yml` and a pin var that disappears reddens the converge instead of
# reporting "no pin" about a healthy box. → docs/observability.md §Silent-failure hygiene
#
# A package a host does not carry reports `result="missing"`, which is what a fleet-wide list read on one
# host means — so a rule keys on `result="differ"` (the actual drift), not on the ok gauge alone.
#
# The `docker-ce` suite is deliberately ABSENT: it is held but carries no `*_version` pin at all, so
# there is no pin to compare its running version against. Its cross-host skew is a standing fact, not a
# lag, and reporting it here would read as "the pin moved" when no pin exists.
# A host that carries a different set overrides this list in its own host_vars, like the two lists above.
monitoring_hygiene_pins:
  - package: alloy
    pin_var: alloy_version
  - package: tailscale
    pin_var: tailscale_host_version
