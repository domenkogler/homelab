---
# monitoring role — Observability stack agent + provisioning
#
# Targets: the `monitoring` inventory group (oldsrv collector + vps backend host).
#
# Architecture (docs/observability.md, HD-135 split):
#   Alloy (host agent: metrics + logs + SNMP) ──remote_write──▶ Prometheus (on VPS)
#   Alloy (container logs via docker.sock) ────push──────────▶ Loki (on VPS)
#   HA exporter /api/prometheus ────────────────scrape────────▶ Prometheus  (bearer token)
#   blackbox_exporter (services-internal) ──────scrape────────▶ Prometheus
#   nut_exporter (nas, host binary) ────────────scrape────────▶ Prometheus
#   SNMP (MikroTik router + switch) ────────────Alloy────────▶ Prometheus
#
# Backend moves: Prometheus/Loki/Grafana now run on the VPS (reliable tier). old-srv
# keeps a thin Alloy collector that forwards home telemetry over the wg-s2s tunnel
# (alloy_backend_host); the VPS runs its own Alloy + the Grafana provisioning.
#
# This role handles:
#   1. HA Prometheus API bearer token (from 1Password ha_api)
#   2. Alloy installation + config (host metrics, container logs, SNMP, remote_write)
#   3. Grafana provisioning (datasources, dashboards, alert rules)
#
# Secrets (1Password vault 'Homelab-ansible'):
#   ha_api (credential) — HA long-lived API token for Prometheus scraping
#
# Ordering: after docker_services (needs Grafana, Prometheus, Loki containers up)

- name: Refuse Ansible runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      ansible_user '{{ ansible_user }}' is not an allowed admin user
      ({{ ansible_admin_users | join(', ') }}). The ai-debug user must never
      run Ansible — it would gain passwordless root via this role.
  tags: always

- name: Create HA Prometheus API bearer token for Prometheus scraping
  ansible.builtin.copy:
    dest: /etc/prometheus/ha_token
    content: "{{ lookup('community.general.onepassword', 'ha_api', field='credential', vault=op_vault) }}"
    mode: '0600'
  # GATED until Phase 4 (prometheus_ha_exporter, Wave-3 triage 2026-08-22): no HA behind
  # ha_vip and no ha_api vault item before the HD-04 cutover - flip the var, seed the item,
  # add the compose mount and re-enable the scrape job together.
  when: inventory_hostname in groups['monitoring'] and prometheus_ha_exporter | default(false)
  tags: [monitoring, ha_token]

# ---- Alloy installation (Grafana APT repo) ----
# deb822_repository (Wave-3 triage 2026-08-22): Debian 13 removed apt-key entirely; the
# module fetches the armored key to /etc/apt/keyrings and writes the signed-by source.
- name: Add Grafana APT repo (deb822, for Alloy)
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key
    state: present
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Update APT cache after repo add (for Alloy)
  ansible.builtin.apt:
    update_cache: true
  when: inventory_hostname in groups['monitoring']
  changed_when: false
  tags: [monitoring, alloy]

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Create Alloy config directory
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Template Alloy River config
  ansible.builtin.template:
    src: alloy.river.j2
    dest: /etc/alloy/config.alloy
    mode: '0644'
  notify: restart alloy
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Template Alloy SNMP config (MikroTik module)
  ansible.builtin.template:
    src: snmp.yml.j2
    dest: /etc/alloy/snmp.yml
    mode: '0644'
  notify: restart alloy
  # Same scope as alloy.river.j2's SNMP exporter block: only the OLDSRV collector has
  # Mgmt-VLAN reach. Rendering on the VPS was dead weight AND failed on an undefined
  # var inside a template comment (Wave-3 triage 2026-08-22).
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, alloy]

- name: Ensure Alloy service is running
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

# ---- Grafana provisioning (step 3: datasources, dashboards, alerting) ----
# Grafana compose mounts /srv/docker/grafana/provisioning → /etc/grafana/provisioning:ro
# (templates/docker_services/grafana/docker-compose.yml.j2). Files are read at
# container start; we write them then restart grafana so provisioning loads.

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "/srv/docker/grafana/provisioning/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - datasources
    - dashboards
    - alerting
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, grafana]

- name: Provision Grafana datasources file (Loki only — see HD-240)
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: /srv/docker/grafana/provisioning/datasources/datasources.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, grafana]

# HD-240 (2026-08-24): the Prometheus datasource is seeded via the Grafana HTTP API,
# NOT the provisioning file — grafana 13.2.0 file-provisioning stores a secureJsonData
# blob it cannot resolve at query time (wire-capture proof: queries left WITHOUT the
# Authorization header / "Authentication to data source failed"), while API-created
# secrets are proven correct. Idempotent: created only when absent. ROTATION of
# prometheus-internal_api = delete the datasource (API/UI) then re-run this role.
- name: Read grafana admin password from container env
  ansible.builtin.command:
    cmd: docker exec grafana printenv GF_SECURITY_ADMIN_PASSWORD
  register: gf_admin_password
  changed_when: false
  no_log: true
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Resolve grafana container IPs for API calls
  ansible.builtin.command:
    cmd: docker exec grafana hostname -i
  register: gf_api_ip
  changed_when: false
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Check whether the prometheus datasource already exists
  ansible.builtin.uri:
    url: "http://{{ gf_api_ip.stdout.split() | select('match', '^172\\.20\\.') | first }}:3000/api/datasources/uid/prometheus"
    url_username: admin
    url_password: "{{ gf_admin_password.stdout }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: gf_ds_state
  changed_when: false
  no_log: true
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Seed prometheus datasource via API (create-only)
  ansible.builtin.uri:
    url: "http://{{ gf_api_ip.stdout.split(' ') | first }}:3000/api/datasources"
    method: POST
    url_username: admin
    url_password: "{{ gf_admin_password.stdout }}"
    force_basic_auth: true
    body_format: json
    body:
      name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      basicAuth: true
      basicAuthUser: "{{ lookup('community.general.onepassword', 'prometheus-internal_api', field='username', vault=op_vault) }}"
      secureJsonData:
        basicAuthPassword: "{{ lookup('community.general.onepassword', 'prometheus-internal_api', field='password', vault=op_vault) }}"
    status_code: [200]
  register: gf_ds_seed
  no_log: true
  when:
    - inventory_hostname in groups['vps']
    - gf_ds_state.status is defined and gf_ds_state.status == 404
  tags: [monitoring, grafana]

- name: Verify prometheus datasource health through grafana
  ansible.builtin.uri:
    url: "http://{{ gf_api_ip.stdout.split(' ') | first }}:3000/api/datasources/uid/prometheus/health"
    method: POST
    url_username: admin
    url_password: "{{ gf_admin_password.stdout }}"
    force_basic_auth: true
  register: gf_ds_health
  retries: 3
  delay: 5
  until: gf_ds_health.json.status is defined and gf_ds_health.json.status == 'OK'
  changed_when: false
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /srv/docker/grafana/provisioning/dashboards/dashboards.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, grafana]

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: /srv/docker/grafana/provisioning/dashboards/
    mode: '0644'
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, grafana]

- name: Provision Grafana alert contact points
  ansible.builtin.template:
    src: grafana-contactpoints.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/contactpoints.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, grafana]

- name: Provision Grafana alert notification policy
  ansible.builtin.template:
    src: grafana-policies.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/policies.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, grafana]

- name: Provision Grafana alert rules
  ansible.builtin.template:
    src: grafana-rules.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/rules.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, grafana]