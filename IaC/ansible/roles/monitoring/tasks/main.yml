---
# monitoring role — Observability stack agent + provisioning
#
# Targets: all hosts (raspberry_pi, home_servers, storage, router)
#
# Architecture (docs/observability.md):
#   Alloy (host agent: metrics + logs + SNMP) ──remote_write──▶ Prometheus
#   Alloy (container logs via docker.sock) ────push──────────▶ Loki
#   HA exporter /api/prometheus ────────────────scrape────────▶ Prometheus  (bearer token)
#   blackbox_exporter (services-internal) ──────scrape────────▶ Prometheus
#   nut_exporter (nas, host binary) ────────────scrape────────▶ Prometheus
#   SNMP (MikroTik router + switch) ────────────Alloy────────▶ Prometheus
#
# This role handles:
#   1. HA Prometheus API bearer token (from 1Password ha_api)
#   2. Alloy installation + config (host metrics, container logs, SNMP, remote_write)
#   3. Grafana provisioning (datasources, dashboards, alert rules)
#
# Secrets (1Password vault 'Homelab'):
#   ha_api (credential) — HA long-lived API token for Prometheus scraping
#
# Ordering: after docker_services (needs Grafana, Prometheus, Loki containers up)

- name: Refuse Ansible runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      ansible_user '{{ ansible_user }}' is not an allowed admin user
      ({{ ansible_admin_users | join(', ') }}). The ai-debug user must never
      run Ansible — it would gain passwordless root via this role.
  tags: always

- name: Create HA Prometheus API bearer token for Prometheus scraping
  ansible.builtin.copy:
    dest: /etc/prometheus/ha_token
    content: "{{ lookup('community.general.onepassword', 'ha_api', field='credential', vault=op_vault) }}"
    mode: '0600'
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, ha_token]

# ---- Alloy installation (Grafana APT repo) ----
- name: Add Grafana GPG key (for Alloy)
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, alloy]

- name: Add Grafana APT repository (for Alloy)
  ansible.builtin.apt_repository:
    repo: deb https://apt.grafana.com stable main
    state: present
    update_cache: true
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, alloy]

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, alloy]

- name: Create Alloy config directory
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, alloy]

- name: Template Alloy River config
  ansible.builtin.template:
    src: alloy.river.j2
    dest: /etc/alloy/config.alloy
    mode: '0644'
  notify: restart alloy
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, alloy]

- name: Template Alloy SNMP config (MikroTik module)
  ansible.builtin.template:
    src: snmp.yml.j2
    dest: /etc/alloy/snmp.yml
    mode: '0644'
  notify: restart alloy
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, alloy]

- name: Ensure Alloy service is running
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, alloy]

# ---- Grafana provisioning (step 3: datasources, dashboards, alerting) ----
# Grafana compose mounts /srv/docker/grafana/provisioning → /etc/grafana/provisioning:ro
# (templates/docker_services/grafana/docker-compose.yml.j2). Files are read at
# container start; we write them then restart grafana so provisioning loads.

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "/srv/docker/grafana/provisioning/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - datasources
    - dashboards
    - alerting
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, grafana]

- name: Provision Grafana datasources (Prometheus + Loki)
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: /srv/docker/grafana/provisioning/datasources/datasources.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, grafana]

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /srv/docker/grafana/provisioning/dashboards/dashboards.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, grafana]

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: /srv/docker/grafana/provisioning/dashboards/
    mode: '0644'
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, grafana]

- name: Provision Grafana alert contact points
  ansible.builtin.template:
    src: grafana-contactpoints.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/contactpoints.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, grafana]

- name: Provision Grafana alert notification policy
  ansible.builtin.template:
    src: grafana-policies.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/policies.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, grafana]

- name: Provision Grafana alert rules
  ansible.builtin.template:
    src: grafana-rules.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/rules.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['home_servers']
  tags: [monitoring, grafana]