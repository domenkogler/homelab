---
# monitoring role — Observability stack agent + provisioning
#
# Targets: the `monitoring` inventory group (oldsrv collector + vps backend host).
#
# Architecture (docs/observability.md):
#   Alloy (host agent: metrics + logs + SNMP) ──remote_write──▶ VictoriaMetrics (on VPS)
#   Alloy (container logs via docker.sock) ────push──────────▶ VictoriaLogs (on VPS)
#   Alloy scrapes EVERYTHING (topology B): HA exporter, blackbox, nut/zfs exporters,
#   SNMP, VPS-container loopback metrics, VM/VL self — VM is pure storage/query.
#
# Backend: VictoriaMetrics + VictoriaLogs + Grafana run on the VPS (reliable tier).
# old-srv keeps a thin Alloy collector that forwards home telemetry over the wg-s2s
# tunnel (alloy_backend_host); the VPS runs its own Alloy + the Grafana provisioning.
# The VPS Alloy self-observes on loopback (alloy_backend_host defaults to 127.0.0.1):
# VPS container logs/metrics stay local, no tunnel. The WG tunnel dependency applies only
# to HOME telemetry (oldsrv/Pi collectors). Dozzle (log viewer) lives on the VPS
# (group_vars/vps.yml).
#
# This role handles:
#   1. HA API bearer token (from 1Password ha_api)
#   2. Alloy installation + config (host metrics, container logs, SNMP, remote_write)
#   3. Grafana provisioning (datasources, dashboards, alert rules)
#
# Secrets (1Password vault 'Homelab-ansible'):
#   ha_api (credential) — HA long-lived API token
#   victoria-metrics_api / victoria-logs_api — Victoria backend basic auth
#
# Ordering: after docker_services (needs Grafana, VictoriaMetrics, VictoriaLogs containers up)

- name: Refuse Ansible runs as ai-debug or unknown users
  assert:
    that:
      - ansible_user in ansible_admin_users
    fail_msg: >-
      ansible_user '{{ ansible_user }}' is not an allowed admin user
      ({{ ansible_admin_users | join(', ') }}). The ai-debug user must never
      run Ansible — it would gain passwordless root via this role.
  tags: always

- name: Create HA Prometheus API bearer token for Prometheus scraping
  ansible.builtin.copy:
    dest: /etc/prometheus/ha_token
    content: "{{ lookup('community.general.onepassword', 'ha_api', field='credential', vault=op_vault) }}"
    mode: '0600'
  # GATED until alloy_ha_exporter is real: no HA behind ha_vip and no ha_api vault item.
  # Flipping the var, seeding the item, adding the compose mount and re-enabling the scrape
  # job is together-or-nothing work. Renaming the var here and in group_vars/vps.yml is
  # ATOMIC: both readers end `| default(false)`, so renaming one side and not the other
  # leaves the gate silently off forever rather than failing loudly.
  when: inventory_hostname in groups['monitoring'] and alloy_ha_exporter | default(false)
  tags: [monitoring, ha_token]

# ---- Alloy installation (Grafana APT repo) ----
# deb822_repository: Debian 13 removed apt-key entirely; the module fetches the armored key
# to /etc/apt/keyrings and writes the signed-by source.
- name: Add Grafana APT repo (deb822, for Alloy)
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key
    state: present
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Update APT cache after repo add (for Alloy)
  ansible.builtin.apt:
    update_cache: true
  when: inventory_hostname in groups['monitoring']
  changed_when: false
  tags: [monitoring, alloy]

# ── the hold, and the one moment a converge is allowed to lift it ────────────────────────────
# `roles/common` holds every package in `host_apt_pin_vars` — `alloy` included — so `apt upgrade`
# cannot move it, and that fence also blocks a PIN BUMP: the `apt` module ALWAYS passes `-y`, and apt
# refuses to move a held package under `-y`
# (`E: Held packages were changed and -y was used without --allow-change-held-packages`, rc 100)
# while the same request WITHOUT `-y` resolves the upgrade. So the exception is explicit and narrow:
# lift the ONE name this run moves, install it at its pin, put the hold back in `always`. ⛔ Never
# `allow_change_held_packages` (the hold is the invariant), never `apt-mark unhold $(apt-mark
# showhold)` (that hands alloy and tailscale to any `apt upgrade` racing the converge). A host
# already at its pin lifts nothing, so a routine converge never opens the window. Same block
# `roles/docker` ships for its suite — one shape per held package, documented in
# docs/deployment-ansible.md.
# Both `tags:` are required: `playbooks/home_servers.yml`, `storage.yml` and
# `raspberry_pi.yml` list this role as a BARE entry, so a role-level tag never cascades here and a
# `--tags monitoring` run would silently drop the lift and die at apt's `-y` refusal.
- name: Read which packages this host holds
  ansible.builtin.command:
    cmd: apt-mark showhold
  register: _alloy_holds_before
  changed_when: false
  check_mode: false        # a probe, not a mutation — --check must still be able to judge
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Read the Alloy version before this run moves anything
  # The same `showhold`/`dpkg-query` pair the `roles/docker` leg takes: one read decides which names
  # the hold is standing in the way of, the read-back at the end of the block decides whether the
  # hold came back. A name this host's dpkg database does not know exits 1 with empty stdout and
  # lands in the set too — it is held, it has to be installed, so apt would refuse that as well.
  ansible.builtin.command:
    cmd: "dpkg-query -W -f='${package}=${version}\\n' alloy"
  register: _alloy_before
  changed_when: false
  failed_when: false       # not-installed is a valid answer here, stdout is the signal
  check_mode: false
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Decide whether held Alloy has to move
  # Held AND off its pin — the exact set apt refuses under `-y`. The comparison is the fleet's
  # `matches_pin()` rule (templates/homelab-hygiene.py.j2, shared with the pin-lag gauge): a pin that
  # carries a dpkg revision — `alloy_version` = `1.20.1-1` — is a deb pin and compares EXACTLY, one
  # that carries none compares on the dpkg upstream part. Equality, never `>=`: a box ahead of its
  # pin is the same drift as a box behind it.
  ansible.builtin.set_fact:
    # `default('', true)` is load-bearing: a Jinja block that emits NOTHING comes back as Python None,
    # not an empty string, and `None.split()` yields ['None'] — without the cast a host that needs no
    # lift would run `apt-mark unhold None`.
    _alloy_to_lift: "{{ (_alloy_lift_candidate | default('', true) | trim).split() }}"
  vars:
    _alloy_lift_candidate: |-
      {%- set _held = _alloy_holds_before.stdout_lines | map('trim') | list %}
      {%- set _carried = dict(_alloy_before.stdout_lines | reject('equalto', '') | map('split', '=')) %}
      {%- set _dpkg = _carried['alloy'] | default('') %}
      {%- set _upstream = _dpkg.rsplit('-', 1)[0] if '-' in _dpkg else _dpkg %}
      {%- set _at_pin = (_dpkg == alloy_version) if ('-' in alloy_version) else (_upstream == alloy_version) %}
      {%- if 'alloy' in _held and not _at_pin %}alloy{% endif %}
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Move pinned Alloy past its hold
  # The re-hold sits in `always`, so a failed install leaves the PRE-state — held, old version — and
  # never an Alloy nobody on this box is holding.
  block:
    - name: Say what the dry run cannot simulate on a held package
      # Under `--check` nothing is mutated, so the unhold below never lands and apt's own `--simulate`
      # refuses a plan the real run will not have. Reporting that as a failure would teach everyone to
      # reach for the forbidden flag, so the dry run says what it cannot see instead, and names the
      # package it would move. A host already at its pin needs no lift and says nothing here.
      ansible.builtin.debug:
        msg: >-
          --check leaves alloy held, so the apt task below is skipped rather than run against a hold
          the real apply lifts first. The plan itself is readable any time with
          `apt-get -s install alloy={{ alloy_version }}` on {{ inventory_hostname }} — no -y, no hold
          refusal, nothing executed.
      when: ansible_check_mode and (_alloy_to_lift | length > 0)

    - name: Lift the hold on Alloy for the pin bump
      ansible.builtin.command:
        cmd: apt-mark unhold alloy
      when: _alloy_to_lift | length > 0
      changed_when: true

    - name: Install Alloy (pinned, host-APT — deliberate exception, see group_vars/all/versions.yml)
      ansible.builtin.apt:
        name: "alloy={{ alloy_version }}"
        state: present
      # ⛔ no `--allow-downgrades` equivalent here either: a pin that lags a box must fail, not
      # downgrade it. Skipped on a held-and-off-pin `--check` run — see the voice above.
      when: not (ansible_check_mode and (_alloy_to_lift | length > 0))

    - name: Report what this run lifted
      # Never under `--check`, where nothing was lifted: the voice above is what a dry run says.
      ansible.builtin.debug:
        msg: >-
          hold lifted for the pin bump on alloy — re-held below, whether the install worked or not
      when: _alloy_to_lift | length > 0 and not ansible_check_mode

  always:
    - name: Put the hold back on Alloy
      ansible.builtin.command:
        cmd: apt-mark hold alloy
      when: _alloy_to_lift | length > 0
      changed_when: true

    - name: Read the holds this leg leaves behind
      # `check_mode: false` because this is the re-READ, not the mutation: under `--check` it still
      # reports what the host actually holds, which is what the assert below needs (a skipped register
      # would read as "nothing is held" and accuse a healthy host of losing its holds).
      ansible.builtin.command:
        cmd: apt-mark showhold
      register: _alloy_holds_after
      changed_when: false
      check_mode: false
      when: _alloy_to_lift | length > 0

    - name: Assert Alloy is held again
      # `apt-mark hold` exiting 0 is not the state. An Alloy left unheld converges green and moves on
      # the next `apt upgrade`, which is the running-vs-pinned class the hold exists to close — and
      # the pin-lag gauge would then report a healthy-looking host as drifted for as long as it stands.
      ansible.builtin.assert:
        that:
          - (_alloy_to_lift | difference(_alloy_holds_after.stdout_lines | default([], true) | map('trim') | list)) | length == 0
        fail_msg: >-
          alloy was unheld by this run on {{ inventory_hostname }} and is NOT held again. Every
          converge from here would leave it to `apt upgrade`. Re-hold it with `apt-mark hold alloy`
          and find out why the leg above did not land — do not drop the package from
          `host_apt_pin_vars`.
        quiet: true
      when: _alloy_to_lift | length > 0
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Create Alloy config directory
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Template Alloy River config
  ansible.builtin.template:
    src: alloy.river.j2
    dest: /etc/alloy/config.alloy
    mode: '0644'
  notify: restart alloy
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Template Alloy SNMP config (MikroTik module)
  ansible.builtin.template:
    src: snmp.yml.j2
    dest: /etc/alloy/snmp.yml
    mode: '0644'
  notify: restart alloy
  # Same scope as alloy.river.j2's SNMP exporter block: only the OLDSRV collector has
  # Mgmt-VLAN reach. Rendering on the VPS is dead weight AND fails on an undefined
  # var inside a template comment.
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, alloy]

- name: Ensure Alloy service is running
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

# ---- `active` is not `serving`: reconcile the listener, not the unit state ----------------
# Measured on the storage collector host: `alloy` read `active (running)` for 19 h while
# ONE runtime thread burned 19 h 31 min of CPU (100 % of a core) and `curl 127.0.0.1:12345/metrics`
# hung until its timeout — the kernel completed the TCP connect, the process never answered. The
# backend held ZERO series for that host (`up{job="alloy"}`, `node_uname_info`, the hygiene
# heartbeat), while its nut/zfs exporters stayed green in the same store because a THIRD host
# scrapes those, which is what made the host look healthy from the dashboard.
# Before it wedged, the unit had restarted 4,847 times in one boot, each exit
# `status=2/INVALIDARGUMENT` — that is how a Go runtime fatal leaves a process, not how a bad config
# leaves one: the same rendered file answers `alloy validate` with rc 0, so NOTHING in this role was
# wrong about the host. What was wrong is the claim: `state: started` asks systemd whether a process
# exists, systemd says yes, Ansible reports `ok`, and a converge "fixes" a blind host by changing
# nothing. The assert at the END of this file already reads the listener — after the restart handlers,
# so on a wedged host it fails the run instead of repairing it. Probe BEFORE reconciling, and restart
# exactly the host whose own listener refused to answer.
- name: Probe this host's Alloy HTTP server
  # `/metrics`, not `/-/ready`: the claim is "this process serves", and `/-/ready` also answers 503
  # whenever ANY component is degraded (a flapping remote_write peer), which would turn a bound
  # repair into a restart on a host that is merely unhealthy. Same read the closing assert makes.
  ansible.builtin.command:
    cmd: curl -sf -m 10 -o /dev/null http://127.0.0.1:{{ alloy_metrics_port | default(12345) }}/metrics
  register: _alloy_serve
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, alloy]

- name: Restart Alloy on a host whose listener is not serving
  # Only this host, only when its own probe refused. On the backend host an Alloy restart drops one
  # scrape cycle for everything that host scrapes, so this is not a cheap leg — but the alternative
  # on the table is a monitoring host that publishes nothing while every unit reads active.
  ansible.builtin.systemd:
    name: alloy
    state: restarted
  when:
    - inventory_hostname in groups['monitoring']
    - _alloy_serve.rc is defined
    - _alloy_serve.rc != 0
  tags: [monitoring, alloy]

# -------------------------------------------------------------------------
# Host rsyslog remote-syslog receiver
#   The RB4011 forwards RFC5424 syslog over wg-s2s to the VPS. rsyslog on the
#   VPS is the UDP/514 listener writing /var/log/remote-syslog/routeros.log,
#   which CrowdSec tails (acquis.d) and Loki/Alloy ingest. Only the VPS
#   (monitoring group) runs this receiver. Install rsyslog here rather than
#   trusting the base image: the netcup minimal boot image ships without it.
#   Idempotent: apt + config + dir idempotent; restart only on change.
# -------------------------------------------------------------------------
- name: Install rsyslog (UDP/514 receiver for RouterOS logs)
  ansible.builtin.apt:
    name: rsyslog
    state: present
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, routeros-syslog]

- name: Create remote-syslog directory
  ansible.builtin.file:
    path: /var/log/remote-syslog
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, routeros-syslog]

- name: Install rsyslog receiver config (RouterOS RFC5424)
  ansible.builtin.template:
    src: rsyslog-routeros.conf.j2
    dest: /etc/rsyslog.d/30-routeros.conf
    mode: '0644'
  notify: restart rsyslog
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, routeros-syslog]

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd:
    name: rsyslog
    state: started
    enabled: true
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, routeros-syslog]

# ---- CrowdSec RouterOS acquisition ----
# The acquisition file must live in the CrowdSec config mount's acquis.d/:
# /srv/docker/crowdsec/config -> /etc/crowdsec in-container, and CrowdSec reads
# acquisitions from /etc/crowdsec/acquis.d/. A compose-dir extra-template copy
# (/opt/crowdsec/) is dead — CrowdSec never reads it. This role owns the single
# live copy.
# VPS-only (the CrowdSec host) — the `monitoring` group spans BOTH the oldsrv
# collector and the VPS backend, but the CrowdSec container + its config mount
# live on the VPS only; on oldsrv `/opt/crowdsec` does not exist and the restart
# fails. Gate explicitly to groups['vps'].
# Idempotent: template + docker-compose restart only when the file changes.
- name: Create CrowdSec acquis.d directory in the config mount
  ansible.builtin.file:
    path: /srv/docker/crowdsec/config/acquis.d
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['vps']
  tags: [monitoring, routeros-syslog]

- name: Install CrowdSec RouterOS acquisition into the config mount
  ansible.builtin.template:
    src: "{{ role_path }}/templates/acquis-routeros.yml.j2"
    dest: /srv/docker/crowdsec/config/acquis.d/acquis-routeros.yml
    mode: '0644'
  register: acquis_result
  when: inventory_hostname in groups['vps']
  tags: [monitoring, routeros-syslog]

- name: Restart CrowdSec when the RouterOS acquisition changed
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/crowdsec"
    state: restarted
  when:
    - inventory_hostname in groups['monitoring']
    - acquis_result is changed
  tags: [monitoring, routeros-syslog]

# -------------------------------------------------------------------------
# Network-clients exporter — RouterOS-API collector on oldsrv
#   Host binary (like nut_exporter) reusing the read-only `logpipe` API user.
#   Polls DHCP/ARP/FDB/wifi registration, emits mikrotik_client +
#   mikrotik_static_host; the oldsrv Alloy scrapes it and remote_writes to the
#   VPS Prometheus (same channel as SNMP). oldsrv-only (Mgmt-plane reach).
#   Design SSOT: docs/observability.md §Network Clients Dashboard.
# -------------------------------------------------------------------------
- name: Install python3-venv (exporter venv prerequisite)
  ansible.builtin.apt:
    name: python3-venv
    state: present
    update_cache: true
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, network-clients]

- name: Create network-clients exporter venv dir
  ansible.builtin.file:
    path: /opt/network-clients-exporter
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, network-clients]

- name: Create network-clients exporter venv (routeros-api from PyPI)
  # Debian trixie has NO `python3-routeros-api` package: trixie ships
  # `python3-librouteros`, whose `librouteros` module API differs from what the exporter
  # script imports. The script imports `routeros_api` (PyPI `routeros-api`), so pin that
  # into a dedicated root-owned venv — reproducible, matches nut_exporter's
  # pinned-release pattern. Version pin lives in group_vars/all/versions.yml.
  ansible.builtin.command:
    cmd: "/usr/bin/python3 -m venv /opt/network-clients-exporter/venv"
    creates: /opt/network-clients-exporter/venv/pyvenv.cfg
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, network-clients]

- name: Install pinned routeros-api into the exporter venv
  # Use the venv's own pip via command (the ansible pip module's virtualenv option
  # requires the separate `virtualenv` CLI package — the venv pip needs nothing extra).
  ansible.builtin.command:
    cmd: "/opt/network-clients-exporter/venv/bin/pip install --quiet 'routeros-api=={{ routeros_api_version }}'"
    creates: /opt/network-clients-exporter/venv/lib/python*/site-packages/routeros_api
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, network-clients]

- name: Create network-clients exporter user (no shell)
  ansible.builtin.user:
    name: networkclients
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, network-clients]

- name: Deploy network-clients exporter script (root-owned 0750 networkclients — carries the logpipe credential)
  # The exporter runs as the unprivileged `networkclients` user (systemd unit), so a
  # root-0700 file gives "Permission denied" opening it and the unit crash-loops.
  # Group-read lets the service user read it while the logpipe credential stays
  # protected from everyone else (mode 0750 root:networkclients).
  ansible.builtin.template:
    src: network-clients-exporter.py.j2
    dest: /usr/local/bin/network-clients-exporter
    owner: root
    group: networkclients
    mode: '0750'
  when: inventory_hostname == 'oldsrv.kogler.si'
  notify: restart network-clients exporter
  tags: [monitoring, network-clients]

- name: Deploy network-clients exporter systemd unit
  ansible.builtin.template:
    src: network-clients-exporter.service.j2
    dest: /etc/systemd/system/network-clients-exporter.service
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname == 'oldsrv.kogler.si'
  notify: restart network-clients exporter
  tags: [monitoring, network-clients]

- name: Enable network-clients exporter
  ansible.builtin.systemd:
    name: network-clients-exporter
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == 'oldsrv.kogler.si'
  tags: [monitoring, network-clients]

# ---- Grafana provisioning (step 3: datasources, dashboards, alerting) ----
# Grafana compose mounts /srv/docker/grafana/provisioning → /etc/grafana/provisioning:ro
# (templates/docker_services/grafana/docker-compose.yml.j2). Files are read at
# container start; we write them then restart grafana so provisioning loads.
# VPS-only gate: the `monitoring` group spans BOTH oldsrv (collector) and the VPS
# (backend), but Grafana runs ONLY on the VPS — on oldsrv these tasks would write
# /srv/docker/grafana and `notify: restart grafana` would fire
# `docker restart grafana` → "No such container". The handler stays unconditional
# because only VPS tasks notify it.

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "/srv/docker/grafana/provisioning/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - datasources
    - dashboards
    - alerting
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Provision Grafana datasources file (Loki only)
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: /srv/docker/grafana/provisioning/datasources/datasources.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

# The Prometheus/Victoria datasource is seeded via the Grafana HTTP API, NOT the
# provisioning file — grafana 13.2.0 file-provisioning stores a secureJsonData blob it
# cannot resolve at query time (queries leave WITHOUT the Authorization header →
# "Authentication to data source failed"), while API-created secrets are proven correct.
# Idempotent: created only when absent. ROTATION of victoria-metrics_api = delete the
# datasource (API/UI) then re-run this role.
- name: Read grafana admin password from container env
  ansible.builtin.command:
    cmd: docker exec grafana printenv GF_SECURITY_ADMIN_PASSWORD
  register: gf_admin_password
  changed_when: false
  no_log: true
  when:
    - inventory_hostname in groups['vps']
    - not ansible_check_mode
  tags: [monitoring, grafana]

# ⚠ --check guard: `command` never executes in check mode, so
# gf_admin_password/gf_api_ip register EMPTY stdout → the uri tasks below die on
# "Error while resolving value for 'url': No first item, sequence was empty", aborting
# every `--check --diff` monitoring run BEFORE the dashboard-copy task. The whole Grafana
# API block is read-or-seed against the LIVE app, so skipping it in check mode is correct.
- name: Resolve grafana container IPs for API calls
  ansible.builtin.command:
    cmd: docker exec grafana hostname -i
  register: gf_api_ip
  changed_when: false
  when:
    - inventory_hostname in groups['vps']
    - not ansible_check_mode
  tags: [monitoring, grafana]

# BOTH Victoria* datasources carry basic-auth secrets, so they are API-seeded
# (file-provisioning stores a secureJsonData blob it cannot resolve at query time).
# Two datasources, each API-seeded create-only:
#   uid prometheus (type prometheus) -> VictoriaMetrics http://victoria-metrics:8428
#   uid loki        (type victoriametrics-logs-datasource) -> VictoriaLogs http://victoria-logs:9428
# ROTATION of victoria-metrics_api/victoria-logs_api = delete the datasource (API/UI) then
# re-run this role.
- name: Check whether the observability datasource already exists
  ansible.builtin.uri:
    url: "http://{{ gf_api_ip.stdout.split() | select('match', '^172\\.20\\.') | first }}:3000/api/datasources/uid/{{ item.uid }}"
    url_username: admin
    url_password: "{{ gf_admin_password.stdout }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: gf_ds_state
  changed_when: false
  no_log: true
  loop:
    - { uid: prometheus }
    - { uid: loki }
  when:
    - inventory_hostname in groups['vps']
    - not ansible_check_mode
  tags: [monitoring, grafana]

- name: Seed observability datasource via API (create-only)
  ansible.builtin.uri:
    url: "http://{{ gf_api_ip.stdout.split(' ') | first }}:3000/api/datasources"
    method: POST
    url_username: admin
    url_password: "{{ gf_admin_password.stdout }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ item.name }}"
      uid: "{{ item.uid }}"
      type: "{{ item.type }}"
      access: proxy
      url: "{{ item.url }}"
      isDefault: "{{ item.isDefault }}"
      editable: false
      basicAuth: true
      basicAuthUser: "{{ lookup('community.general.onepassword', item.vault_item, field='username', vault=op_vault) }}"
      secureJsonData:
        basicAuthPassword: "{{ lookup('community.general.onepassword', item.vault_item, field='password', vault=op_vault) }}"
    status_code: [200]
  register: gf_ds_seed
  no_log: true
  when:
    - inventory_hostname in groups['vps']
    - not ansible_check_mode
    - (gf_ds_state.results | selectattr('item.uid', 'equalto', item.uid) | first).status == 404
  loop:
    - name: VictoriaMetrics
      uid: prometheus
      type: prometheus
      url: http://victoria-metrics:8428
      isDefault: true
      vault_item: victoria-metrics_api
    - name: VictoriaLogs
      uid: loki
      type: victoriametrics-logs-datasource
      url: http://victoria-logs:9428
      isDefault: false
      vault_item: victoria-logs_api
  tags: [monitoring, grafana]

# The interval floor the seed never set. `jsonData.timeInterval` is what floors
# Grafana's `$__interval` / `$__rate_interval`; without it Grafana floors them at its own
# 15 s default, so a 5 s scrape is still AVERAGED into 15 s buckets at query time and the
# hot panels stay steppy with perfect data in VM. The seed above is create-only
# (`status == 404`), so the live datasource needs a PUT — read the CURRENT value from the
# GET that is already registered (gf_ds_state) and PUT only when it differs, which is what
# makes this idempotent instead of changed-on-every-run.
# The body re-sends the vault secret because PUT replaces the datasource record: a body
# without secureJsonData leaves an un-authed datasource ("Authentication to data source
# failed"), the failure the whole API-seeding design exists to avoid. Re-reading the same
# 1Password item is not a rotation; nothing is generated here.
# Check-mode safe by the --check guard above: gf_api_ip/gf_admin_password register empty in
# --check, and `not ansible_check_mode` is on the task.
- name: Ensure the VictoriaMetrics datasource carries its 5s interval floor
  ansible.builtin.uri:
    url: "http://{{ gf_api_ip.stdout.split(' ') | first }}:3000/api/datasources/uid/prometheus"
    method: PUT
    url_username: admin
    url_password: "{{ gf_admin_password.stdout }}"
    force_basic_auth: true
    body_format: json
    body:
      name: VictoriaMetrics
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://victoria-metrics:8428
      isDefault: true
      editable: false
      basicAuth: true
      basicAuthUser: "{{ lookup('community.general.onepassword', 'victoria-metrics_api', field='username', vault=op_vault) }}"
      secureJsonData:
        basicAuthPassword: "{{ lookup('community.general.onepassword', 'victoria-metrics_api', field='password', vault=op_vault) }}"
      jsonData:
        timeInterval: "5s"
    status_code: [200]
  no_log: true
  when:
    - inventory_hostname in groups['vps']
    - not ansible_check_mode
    - (((gf_ds_state.results | selectattr('item.uid', 'equalto', 'prometheus') | first).json.jsonData
        | default({}, true)).timeInterval | default('')) != '5s'
  tags: [monitoring, grafana]

- name: Verify observability datasource health through grafana
  ansible.builtin.uri:
    url: "http://{{ gf_api_ip.stdout.split(' ') | first }}:3000/api/datasources/uid/{{ item.uid }}/health"
    method: POST
    url_username: admin
    url_password: "{{ gf_admin_password.stdout }}"
    force_basic_auth: true
  register: gf_ds_health
  retries: 3
  delay: 5
  until: gf_ds_health.json.status is defined and gf_ds_health.json.status == 'OK'
  changed_when: false
  loop:
    - { uid: prometheus }
    - { uid: loki }
  when:
    - inventory_hostname in groups['vps']
    - not ansible_check_mode
  tags: [monitoring, grafana]

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /srv/docker/grafana/provisioning/dashboards/dashboards.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: /srv/docker/grafana/provisioning/dashboards/
    mode: '0644'
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Provision Grafana alert contact points
  ansible.builtin.template:
    src: grafana-contactpoints.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/contactpoints.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Provision Grafana alert notification policy
  ansible.builtin.template:
    src: grafana-policies.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/policies.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

- name: Provision Grafana alert rules
  # The tag is the task's only teeth: `tags: [monitoring]` on the role in playbooks/vps.yml is
  # inherited by every task here, so an UNTAGGED task is still selected by `--tags monitoring` and
  # silently DROPPED by `--tags grafana` — a surgical grafana run then re-provisions the contact
  # points, the policy and the dashboards, reports failed=0, and never re-renders the rules. A rule
  # added to vars/main.yml stays loaded-on-no-backend through that run, and nothing in the RECAP
  # says so. Same silent-failure class as a duplicate YAML key stripping a tag (CONVENTIONS §6).
  ansible.builtin.template:
    src: grafana-rules.yml.j2
    dest: /srv/docker/grafana/provisioning/alerting/rules.yml
    mode: '0644'
  notify: restart grafana
  when: inventory_hostname in groups['vps']
  tags: [monitoring, grafana]

# -------------------------------------------------------------------------
# The silent-failure hygiene collector (unit results + consumer cert age)
# -------------------------------------------------------------------------
# Two structural gaps this closes: a systemd unit's RESULT is not scraped at all (Alloy's
# host exporter runs an explicit collector set with no `systemd` and no `textfile`), and the
# cert pair a CONSUMER holds is not exported either — `ssl-cert-expiring` reads
# `probe_ssl_earliest_cert_expiry`, which blackbox emits no series for, so that rule is
# structurally dead.
# A textfile file written by a 5-min timer, not a long-running exporter: it costs nothing to
# watch and its OWN staleness becomes a series (`homelab_hygiene_scrape_ok`) — the class of
# failure being hunted, pointed at itself.

- name: Install the hygiene exporter
  # 0750 root:root — it carries no secret (the lists and the loopback port are the only rendered
  # content), but it is the thing the alert rules trust, so it is not world-writable by construction.
  ansible.builtin.template:
    src: homelab-hygiene.py.j2
    dest: /usr/local/sbin/homelab-hygiene.py
    mode: '0750'
  notify: restart hygiene exporter
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, hygiene]

- name: Install the hygiene exporter unit
  ansible.builtin.copy:
    src: homelab-hygiene.service
    dest: /etc/systemd/system/homelab-hygiene.service
    mode: '0644'
  notify: restart hygiene exporter
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, hygiene]

- name: Ensure the hygiene exporter is running
  ansible.builtin.systemd:
    name: homelab-hygiene
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, hygiene]

- name: Prove the exporter answers and this host's Alloy is alive
  # Two legs, because "the exporter works" and "the exporter is being scraped" are different claims and
  # only the second one is worth anything: the first curl is the exporter's own /metrics (the series must
  # exist at all), the second is Alloy's listener (:12345, its default — proof the process this file just
  # reconfigured is up after the restart). What is NOT proven here is that the series reached
  # VictoriaMetrics; that read is taken by hand after the converge, and it is the leg that must be green
  # before an alert rule can be trusted to have anything to evaluate.
  ansible.builtin.shell:
    cmd: >-
      curl -s -m 8 http://{{ monitoring_hygiene_listen }}:{{ monitoring_hygiene_port }}/metrics |
      grep -E '^homelab_' ; echo '--- alloy ---' ;
      curl -s -m 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:12345/metrics
    executable: /bin/bash
  register: _hygiene_probe
  changed_when: false
  failed_when: >-
    'homelab_hygiene_scrape_ok' not in _hygiene_probe.stdout | default('')
    or not (_hygiene_probe.stdout | default('')).split('--- alloy ---')[-1].strip().startswith('200')
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, hygiene]

- name: Record what the hygiene exporter publishes
  # The row is about failures being READABLE, so the converge prints the numbers the alert rules
  # threshold on instead of a bare "ok" — including cert days-left, which is the value an owner needs
  # to sanity-check the WARN/CRIT thresholds against the real renewal cycle.
  ansible.builtin.debug:
    msg: "{{ (_hygiene_probe.stdout | default('')).split('--- alloy ---')[0].splitlines() }}"
  when: inventory_hostname in groups['monitoring']
  tags: [monitoring, hygiene]