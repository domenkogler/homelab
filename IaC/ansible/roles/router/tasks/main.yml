---
# router role — MikroTik RouterOS configuration via REST API
# VLAN interfaces, DHCP, firewall, CAPsMAN, WireGuard, AP DHCP reservations.
#
# ⚠️ APPLY-MODEL BOUNDARY: the converge .rsc import is the APPLY OF RECORD for RouterOS
#   multi-step state (bridges, VLANs, trunk/port memberships, firewall chains). This role
#   exists for (a) idempotent single-object state (DHCP leases/reservations, firewall
#   address-lists), (b) the fail-loud identity assert, (c) verification via api_facts/api.
#   Do NOT add day-to-day apply logic here as api_modify tasks — edit the converge
#   template (rb4011_converge.rsc.j2) and import it.
#   → docs/network-ops.md §Router Config Lifecycle
#
#   PARITY: any api_modify task in this role that mirrors converge state MUST stay
#   byte-identical to the template — a drift here regresses the live device on the next
#   converge. Edit BOTH or NEITHER.
#
# Connection/auth: the bootstrap creates `ansible` (SSH-key only, empty password) and
# `admin` (password + key). community.routeros uses the RouterOS API, authenticated as
# `admin` with mikrotik-admin_login from 1Password. The community.routeros collection is
# required (requirements.yml).

- name: Refuse router runs as ai-debug or unknown users (local connection allowed via 1Password auth)
  assert:
    that:
      - ansible_connection == 'local' or ansible_user in ansible_admin_users
      - ansible_user is not defined or ansible_user not in ['ai-debug']
    fail_msg: >-
      router role must run as an allowed admin user (or local connection with 1Password auth).
      The ai-debug user must never run Ansible.
  tags: always

# -------------------------------------------------------------------------
# Get admin password from 1Password for API authentication
# -------------------------------------------------------------------------
- name: Fetch MikroTik admin password from 1Password
  set_fact:
    routeros_api_password: "{{ lookup('community.general.onepassword', 'mikrotik-admin_login', field='password', vault=op_vault) }}"
  no_log: true
  # `tags: always` is load-bearing: every api_facts/api_modify in this role references
  # routeros_api_password and the identity assert is `tags: always`, so an untagged
  # set_fact is skipped by a `--tags network,router-logging` run and the assert then
  # fails on an undefined password.
  tags: always

# -------------------------------------------------------------------------
# VLAN interface naming: community.routeros api_modify matches interface-vlan
# entries by the primary key `name`, so a desired name that differs from the
# device's is treated as a NEW entry and re-created -> `already have such vlan`.
# The mgmt VLAN interface is therefore the bootstrap's `vlan<mgmt_vlan_id>-mgmt`
# (NOT `vlan99-management`); every other VLAN is `vlan<id>-<name|lower>`.

# -------------------------------------------------------------------------
# Assert-before-mutate: read the device identity once and refuse every api_modify
# below if the target is not the expected router — a wrong-target or swapped host
# must never receive this config. Runs once per role run, before the first mutate.
# -------------------------------------------------------------------------
- name: Assert device identity before any mutate (HD-161)
  community.routeros.api_facts:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    port: "{{ routeros_api_port }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    gather_subset: all
  register: router_identity_facts
  tags: always

- name: Assert the API target is {{ routeros_expected_identity }}
  assert:
    that:
      - routeros_expected_identity | length > 0
      - router_identity_facts.ansible_facts.ansible_net_hostname == routeros_expected_identity
    fail_msg: >-
      Target at {{ routeros_api_host }} reports identity
      '{{ router_identity_facts.ansible_facts.ansible_net_hostname }}' —
      expected '{{ routeros_expected_identity }}'. Refusing to mutate the wrong device.
  tags: always

# -------------------------------------------------------------------------
# Bridge + VLAN Interfaces
# -------------------------------------------------------------------------
# Ensure bridge-lan exists BEFORE creating VLAN interfaces on it (self-contained;
# a non-bootstrap run may not have a bridge yet). vlan_filtering is deliberately
# left off here and enabled LAST (see below) so the mgmt plane, VLAN DB and trunk
# are in place first — no window where filtering is on but VLANs aren't defined.
- name: Ensure bridge-lan bridge exists
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge
    handle_absent_entries: ignore
    data:
      - name: bridge-lan
        disabled: no
        protocol-mode: none
        comment: "LAN bridge (VLAN filtering enabled later)"

- name: Ensure VLAN interfaces exist
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface vlan
    handle_absent_entries: ignore
    data:
      - name: "vlan{{ item.id }}-{{ (item.name | lower) if item.id != mgmt_vlan_id else 'mgmt' }}"
        vlan-id: "{{ item.id }}"
        interface: bridge-lan
        # NOTE: `disabled` is deliberately omitted — the module's entry-match compares
        # EVERY provided field, so adding `disabled: no` makes the desired mgmt vlan
        # never match the device's existing row and the task re-creates it.
  loop: "{{ vlans | selectattr('unused', 'undefined') | list }}"  # skip VLAN 1 Blackhole (unused: true)
  loop_control:
    label: "VLAN{{ item.id }}"

# -------------------------------------------------------------------------
# VLAN IP Addresses
# -------------------------------------------------------------------------
- name: Configure VLAN gateway IP addresses
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip address
    handle_absent_entries: ignore
    data:
      - address: "{{ (network_static_hosts | selectattr('vlan', '==', item.id) | selectattr('name', '==', 'router') | map(attribute='ip') | list | first) }}/{{ item.subnet.split('/')[1] }}"
        interface: "vlan{{ item.id }}-{{ (item.name | lower) if item.id != mgmt_vlan_id else 'mgmt' }}"
        disabled: no
  loop: "{{ network_vlans | selectattr('id', 'in', [10, 20, 30, 40, 50, 99]) | list }}"
  loop_control:
    label: "VLAN{{ item.id }} gateway"

# -------------------------------------------------------------------------
# Comtrend modem mgmt address on ether1
# -------------------------------------------------------------------------
# A management address on the Comtrend's own LAN (192.168.1.0/24) so the modem's web UI
# at 192.168.1.1 stays reachable from the homelab for the twice-yearly PPPoE-redial
# dance — no physical cable swap. The address must carry the SUBNET prefix
# (comtrend_modem.router_on_modem, a /24): a /32 leaves no connected route and the
# modem is unreachable via forward. Opt-out per host via comtrend_modem.enabled.
- name: Configure Comtrend modem mgmt IP on ether1
  when: comtrend_modem.enabled | bool
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip address
    handle_absent_entries: ignore
    data:
      - address: "{{ comtrend_modem.router_on_modem }}"
        interface: "{{ comtrend_modem.iface }}"
        comment: "HD-302: Comtrend modem mgmt subnet (single-LAN admin path)"
        disabled: no

# -------------------------------------------------------------------------
# DHCP Pools and Servers
# -------------------------------------------------------------------------
- name: Configure DHCP pools for each VLAN
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip pool
    handle_absent_entries: ignore
    data:
      - name: "pool-vlan{{ item.id }}"
        ranges: "{{ item.pool }}"
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]

- name: Configure DHCP server networks for each VLAN
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server network
    handle_absent_entries: ignore
    data:
      - address: "{{ item.subnet }}"
        gateway: >-
          {{ (network_static_hosts | selectattr('vlan', '==', item.id) | selectattr('name', '==', 'router') | list | first).ip }}
        # Resolver chain (docs/network-dns.md §DNS Flow): Technitium PRIMARY (VPS) ->
        # SECONDARY (oldsrv) -> TERTIARY (Pi) by default. HOME-FIRST (TERTIARY ->
        # PRIMARY -> SECONDARY) is a per-VLAN SWITCH from `lan_first_dns` on the
        # `network_vlans` row (SSOT, group_vars/all), never a hardcoded VLAN id, so the
        # role and rb4011_converge.rsc.j2 cannot half-flip. It buys that VLAN independence
        # when the WAN or the VPS resolver is down.
        # RouterOS caps dns-server at 3 values — a 4th is silently dropped — so the router's
        # own /ip dns is NOT in the DHCP list; it is the implicit final fallback via its own
        # upstream (see the /ip dns task). Direct-to-Technitium is REQUIRED so per-subnet
        # filtering sees the source VLAN, not the router. All three are SSOT-derived.
        dns-server: >-
          {{ ([dns_tertiary_ip, dns_primary_ip, dns_secondary_ip]
              if (item.lan_first_dns | default(false))
              else [dns_primary_ip, dns_secondary_ip, dns_tertiary_ip])
             | select('string') | unique | join(',') }}
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]

- name: Configure DHCP servers for each VLAN
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server
    handle_absent_entries: ignore
    data:
      - name: "dhcp-{{ item.id }}"
        interface: "vlan{{ item.id }}-{{ item.name | lower }}"
        address-pool: "pool-vlan{{ item.id }}"
        # DHCP option 15 (the search suffix) is NOT set here: RouterOS 7 has no `domain=`
        # property (`set … domain=` aborts with `Script Error: bad parameter domain`), so
        # option 15 rides an `/ip dhcp-server option` row referenced by `dhcp-option`, and
        # rb4011_converge.rsc.j2 owns both halves — api_modify cannot express a `[find]`
        # reference, and a second writer of that reference is how it drifts. Consequence:
        # a role-only run neither sets nor clears it — read `dhcp-option` back with get.
        disabled: no
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]


# -------------------------------------------------------------------------
# DHCP Static Reservations
# -------------------------------------------------------------------------
# The mgmt plane's DHCP server is `dhcp-mgmt` — named in the BOOTSTRAP and not recreated
# here — while this role creates `dhcp-<vlan>` for 10/20/30/40/50. Every VLAN-99
# reservation below therefore targets `dhcp-mgmt`: a `dhcp-99` server matches nothing and
# the APs silently fall back to dynamic mgmt-pool addresses.

- name: Configure DHCP static reservations for APs (unchanged legacy behavior)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server lease
    handle_absent_entries: ignore
    data:
      - server: "{{ 'dhcp-mgmt' if item.vlan == 99 else 'dhcp-' ~ item.vlan }}"
        address: "{{ item.ip }}"
        mac-address: "{{ item.mac }}"
        comment: "AP {{ item.name }} static reservation"
  loop: "{{ network_static_hosts | selectattr('name', 'match', '^ap-') | selectattr('mac', 'defined') | selectattr('vlan', '==', 99) | list }}"
  when: item.vlan == 99

# Static mgmt-99 reservations for non-AP hosts that carry a MAC (e.g. pi).
# The AP block above only handles `ap-*`. The non-mgmt block below rejects vlan 99.
# Without this, a mgmt-99 host with a MAC (pi -> 10.10.99.20 per SSOT) falls to the
# dynamic pool-mgmt range (e.g. .97) instead of its reserved address.
- name: Configure DHCP static reservations for mgmt hosts with MAC (non-AP, R-2)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server lease
    handle_absent_entries: ignore
    data:
      - server: "dhcp-mgmt"
        address: "{{ item.ip }}"
        mac-address: "{{ item.mac }}"
        comment: "{{ item.name }} static reservation (mgmt, R-2)"
  loop: "{{ network_static_hosts \
         | selectattr('mac', 'defined') \
         | selectattr('vlan', '==', 99) \
         | rejectattr('name', 'match', '^ap-') \
         | rejectattr('name', 'in', ['router', 'switch']) \
         | list }}"
  when: item.mac is defined and item.vlan == 99

- name: Configure DHCP static reservations for non-mgmt reserved devices (R-2)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server lease
    handle_absent_entries: ignore
    data:
      - server: "dhcp-{{ item.vlan }}"
        address: "{{ item.ip }}"
        mac-address: "{{ item.mac }}"
        comment: "{{ item.name }} static reservation (R-2)"
  loop: "{{ network_static_hosts \
         | selectattr('mac', 'defined') \
         | rejectattr('vlan', 'in', [99]) \
         | rejectattr('name', 'in', ['router']) \
         | rejectattr('name', 'search', 'ap-') \
         | list }}"
  when: item.mac is defined and item.vlan != 99


# -------------------------------------------------------------------------
# Firewall - Address Lists
# -------------------------------------------------------------------------
- name: Create firewall address list for trusted-admin hosts
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ item.ip }}"
        list: trusted-admin
        comment: "Trusted admin host: {{ item.name }}"
  loop: "{{ network_static_hosts | selectattr('name', 'in', ['oldsrv', 'nas', 'ha-vip', 'laptop-domen']) | list }}"
  loop_control:
    label: "{{ item.name }}"


- name: Create firewall address list for trusted-ha hosts
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ item.ip }}"
        list: trusted-ha
        comment: "Trusted HA host: {{ item.name }}"
  loop: "{{ network_static_hosts | selectattr('name', 'in', ['oldsrv', 'ha-vip']) | list }}"
  loop_control:
    label: "{{ item.name }}"


- name: Create firewall address list for internal LAN subnets
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ item.subnet }}"
        list: internal_lan
        comment: "Internal LAN {{ item.name }} VLAN"
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]


- name: Set UPS management IP in address list (RETIRED — UPS moved to IoT VLAN 20, no mgmt web UI; list kept empty for backward compat)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data: []

- name: Create firewall address list for the VPS S2S peer (HD-155 least-access)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ wireguard_s2s_vps.remote_ip.split('/')[0] }}"
        list: vps_s2s_peer
        comment: "VPS S2S peer (HD-155) - least-access source"

# --- Per-MAC WAN egress for cloud-IoT devices (rendered from SSOT) ---
# iot-wan-allow = the cloud-IoT devices (LG/Bosch/HAP) that may reach WAN from
# VLAN 20 (IOT); they carry MACs in network_static_hosts. Permanent membership =
# SSOT rows with wan_allow: true; a temporary firmware window is driven through the
# router API user — never hand-edit it.
#
# RouterOS /ip firewall address-list accepts IP/CIDR only — a MAC is rejected
# ('not a valid dns name'). Per-MAC matching is therefore a src-mac-address rule: the
# forward accepts here and the kids dst-nat/drop below, never an address-list entry.

- name: Create firewall address list for the scoped home targets the VPS may reach (HD-155)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: nas (nut/zfs exporters)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'ha-vip') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: HA VIP (exporter)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: oldsrv (backends when wired)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: pi (probe)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 99) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: router (probe)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'switch') | selectattr('vlan', 'equalto', 99) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: switch (probe)"



# -------------------------------------------------------------------------
# Firewall - NAT Masquerade
# -------------------------------------------------------------------------
- name: Configure NAT masquerade for outbound traffic
  # RECONCILE, not `ignore`: the converge .rsc and this task both own these NAT rows,
  # and with `handle_absent_entries: ignore` a converge import stacks its rows on top of
  # the role's and neither side removes them — a live duplex NAT (two masquerades).
  # Reconciling makes the table converge to exactly these rows from any prior state.
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall nat
    handle_absent_entries: remove
    handle_entries_content: remove_as_much_as_possible
    ensure_order: true
    restrict:
      - field: chain
        values: [srcnat, dstnat]
    data:
      - chain: srcnat
        out-interface: pppoe-telekom
        action: masquerade
        comment: "NAT masquerade -> WAN"
      # --- Kids VLAN 40 forced filtered DNS ---
      # Hijack every DNS query (53 udp/tcp) leaving the Kids VLAN — hardcoded-resolver
      # devices included — to the Technitium primary, which enforces the Kids-Group
      # policy (Cloudflare Families, network-dns.md). NAT runs BEFORE the forward chain,
      # so the rewritten packets match the LAN→resolver accept above; the DoT (853)
      # bypass is dropped in the filter chain.
      - chain: dstnat
        src-address: "{{ vlan_subnets[40] }}"
        protocol: udp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_primary_ip }}"
        to-ports: 53
        comment: "Kids forced filtered DNS - UDP 53 -> Technitium (HD-182)"
      - chain: dstnat
        src-address: "{{ vlan_subnets[40] }}"
        protocol: tcp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_primary_ip }}"
        to-ports: 53
        comment: "Kids forced filtered DNS - TCP 53 -> Technitium (HD-182)"
      # --- IoT VLAN 20 per-device DNS visibility ---
      # Hijack plain :53 from VLAN 20 to the Pi tertiary (dns_tertiary_ip = the Pi
      # Technitium, read via dns-pi.kogler.si) so each IoT device's queries are logged
      # per source IP instead of collapsing at the VPS primary / WAN egress. The DoT(853)
      # bypass is dropped in the filter chain below.
      - chain: dstnat
        src-address: "{{ vlan_subnets[20] }}"
        protocol: udp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_tertiary_ip }}"
        to-ports: 53
        comment: "IoT forced DNS - UDP 53 -> Pi (HD-342 DNS visibility)"
      - chain: dstnat
        src-address: "{{ vlan_subnets[20] }}"
        protocol: tcp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_tertiary_ip }}"
        to-ports: 53
        comment: "IoT forced DNS - TCP 53 -> Pi (HD-342 DNS visibility)"

# Per-MAC kids filtered DNS on Home VLAN 10 (the kids join the Kogler SSID, so the
# VLAN-40 hijack above does NOT cover them): redirect each kids tablet's DNS (53) to the
# Technitium primary, which enforces the Kids-Group policy (Cloudflare Families,
# network-dns.md). Selection is the `kids: true` marker in SSOT, matched per device by
# src-mac-address.
- name: Ensure per-MAC kids filtered DNS dst-nat (HD-326)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall nat
    handle_absent_entries: remove
    handle_entries_content: remove_as_much_as_possible
    ensure_order: true
    restrict:
      - field: chain
        values: [dstnat]
    data:
      - chain: dstnat
        src-address: "{{ vlan_subnets[10] }}"
        src-mac-address: "{{ item.mac }}"
        protocol: udp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_primary_ip }}"
        to-ports: 53
        comment: "HD-326 kids filtered DNS - UDP 53 -> Technitium: {{ item.name }}"
      - chain: dstnat
        src-address: "{{ vlan_subnets[10] }}"
        src-mac-address: "{{ item.mac }}"
        protocol: tcp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_primary_ip }}"
        to-ports: 53
        comment: "HD-326 kids filtered DNS - TCP 53 -> Technitium: {{ item.name }}"
  loop: "{{ network_static_hosts | selectattr('kids', 'defined') | selectattr('kids', 'equalto', true) | list }}"
  loop_control:
    label: "HD-326 kids DNS dst-nat for {{ item.name }}"
  tags: [network]

# -------------------------------------------------------------------------
# Firewall - Inter-VLAN Rules
# -------------------------------------------------------------------------
# Order matters in RouterOS: rules are evaluated top-down, first match wins.
# The established/related accept MUST come first so replies to already-allowed
# connections (inter-VLAN and WAN return) are permitted before the default-deny.

- name: Ensure inter-VLAN forward firewall rules (idempotent, ordered)
  # GATED OFF deliberately: the forward chain is OWNED BY rb4011_converge.rsc.j2 (the
  # apply of record is the rsc import). A live reconcile here would DELETE the per-MAC
  # rows that exist ONLY in the converge template (the iot-wan-allow accepts and the
  # kids tablet drops) — they are not in this task's data, so
  # `handle_absent_entries: remove` would drop them from the live chain. The API path is
  # for idempotent, order-independent state only; keep this task byte-synced with the
  # template OR gated, never half-running.
  when: false   # OWNED BY rb4011_converge.rsc.j2 (apply-of-record) — do NOT run
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall filter
    handle_absent_entries: remove
    handle_entries_content: remove_as_much_as_possible
    ensure_order: true
    restrict:
      - field: chain
        values: [forward]
    data:
      # --- allowed flows (top-down, first match wins) ---
      - chain: forward
        connection-state: established,related
        action: accept
        comment: "Allow established/related return traffic"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        dst-address-list: trusted-ha
        protocol: udp
        dst-port: 5683
        action: accept
        comment: "IoT Shelly Gen1 CoAP push -> HA (HD-229) - narrow reverse exception"
      - chain: forward
        src-address-list: trusted-ha
        dst-address: "{{ vlan_subnets[20] }}"
        action: accept
        comment: "Trusted HA hosts (oldsrv/ha-vip) -> IoT (new, MQTT/HA) - HD-03 owner decision 2026-09-04: narrowed to trusted-ha (excludes nas)"
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        dst-address: "{{ vlan_subnets[20] }}"
        protocol: tcp
        connection-state: established,related
        action: accept
        comment: "Home -> IoT (established/related)"
      # KNXnet/IP tunneling (HA on the Pi -> GIRA IP router on IoT): the Pi is NOT in
      # trusted-admin (a node, not an admin host), so HA's KNX tunnel needs its own
      # narrow new-UDP exception. Same pattern as the CoAP 5683 reverse exception above.
      # dst = knx_router_ip (SSOT, VLAN 20).
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        dst-address: "{{ knx_router_ip }}"
        protocol: udp
        dst-port: 3671
        action: accept
        comment: "Home -> KNX router (KNXnet/IP tunnel, HA) - new UDP"
      # Shelly Gen1 RGBW2 REST (HA on the Pi -> the Shelly fleet on IoT): the Pi is a
      # node, not an admin host, so HA's outbound new-TCP to the Shelly HTTP API needs its
      # own narrow exception. dst-port 80 only (Gen1 REST); the CoAP 5683 push path is the
      # reverse direction and is covered by trusted-ha above.
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        dst-address: "{{ vlan_subnets[20] }}"
        protocol: tcp
        dst-port: 80
        action: accept
        comment: "Home Pi (HA) -> Shelly RGBW2 REST (new TCP)"
      # Cloud-IoT devices live on IoT VLAN 20 and reach WAN only through the per-MAC
      # iot-wan-allow accepts; they are cloud-bound by design and never reachable from
      # Home, so no inter-VLAN accept for them belongs here.
      # The UPS sits on IoT VLAN 20 with no WAN and no web-UI consumer — NUT/USB is the
      # monitoring path (docs/hardware-ups.md), so no forward rule targets it.
      - chain: forward
      - chain: forward
        src-address-list: internal_lan
        dst-address: "{{ dns_primary_ip }}"
        protocol: udp
        dst-port: 53,853
        action: accept
        comment: "LAN -> DNS resolver (Technitium) udp"
      - chain: forward
        src-address-list: internal_lan
        dst-address: "{{ dns_primary_ip }}"
        protocol: tcp
        dst-port: 53,853
        action: accept
        comment: "LAN -> DNS resolver (Technitium) tcp"
      # Secondary-resolver parity (network-dns.md): the Pi resolver must be reachable
      # from every VLAN exactly like the primary — without this rule the default-deny
      # below blocks it once the Pi takes over.
      - chain: forward
        src-address-list: internal_lan
        dst-address: "{{ dns_secondary_ip }}"
        protocol: udp
        dst-port: 53,853
        action: accept
        comment: "LAN -> DNS secondary Pi (HD-182) udp"
      - chain: forward
        src-address-list: internal_lan
        dst-address: "{{ dns_secondary_ip }}"
        protocol: tcp
        dst-port: 53,853
        action: accept
        comment: "LAN -> DNS secondary Pi (HD-182) tcp"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        dst-address: "{{ dns_primary_ip }}"
        protocol: udp
        dst-port: 53,853
        action: accept
        comment: "IoT -> DNS resolver udp"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        dst-address: "{{ dns_primary_ip }}"
        protocol: tcp
        dst-port: 53,853
        action: accept
        comment: "IoT -> DNS resolver tcp"
      # --- WAN egress: every VLAN except IoT, masqueraded — docs/network-vlans.md
      # §Inter-VLAN Firewall Rules ---
      # RouterOS default-accepts whatever no rule matches, so these accepts make the
      # documented egress policy explicit rather than accidental. IoT(20) stays dropped;
      # Kids(40) accepts only BELOW its bedtime time= drop, so the in-window block wins.
      # Mgmt(99) egress is fine — the INPUT chain still gates the router's own services.
      # The per-MAC kids drops sit ABOVE the Home->WAN accept (looped task below) — a
      # drop placed below it is shadowed by first-match-wins.
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        out-interface: pppoe-telekom
        action: accept
        comment: "Home -> WAN allowed (HD-309 row 73)"
      - chain: forward
        src-address: "{{ vlan_subnets[50] }}"
        out-interface: pppoe-telekom
        action: accept
        comment: "Media -> WAN allowed (HD-309)"
      - chain: forward
        src-address: "{{ vlan_subnets[30] }}"
        out-interface: pppoe-telekom
        action: accept
        comment: "Guest -> WAN allowed (HD-309 row 73)"
      - chain: forward
        src-address: "{{ vlan_subnets[99] }}"
        out-interface: pppoe-telekom
        action: accept
        comment: "Mgmt -> WAN allowed (HD-309 row 73)"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        out-interface: pppoe-telekom
        action: drop
        comment: "IoT -> WAN drop (disable manually for firmware updates)"


      - chain: forward
        src-address-list: vps_s2s_peer
        dst-address-list: vps_scoped_home
        action: accept
        comment: "VPS S2S -> scoped home targets (HD-155)"

      - chain: forward
        src-address-list: vps_s2s_peer
        action: drop
        comment: "VPS S2S -> anything else DROP (HD-155 least-access)"
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        dst-address: "{{ vlan_subnets[50] }}"
        action: accept
        comment: "Home -> Media (new allowed)"
      - chain: forward
        src-address: "{{ vlan_subnets[50] }}"
        dst-address: "{{ vlan_subnets[10] }}"
        action: accept
        comment: "Media -> Home (media server)"
      # Mgmt VLAN (99) -> Home VLAN (10) — admin/laptop access to the Pi and the other
      # Home hosts, scoped to the whole Mgmt VLAN, not per-host. Without it the
      # default-deny below blocks every cross-VLAN path to Home, including Pi discovery
      # and provisioning. Placed above the default-deny.
      - chain: forward
        src-address: "{{ vlan_subnets[99] }}"
        dst-address: "{{ vlan_subnets[10] }}"
        action: accept
        comment: "Mgmt -> Home (laptop/Pi discovery, HD-307)"
      - chain: forward
        src-address: "{{ vlan_subnets[30] }}"
        dst-address-list: internal_lan
        action: drop
        comment: "Guest -> LAN drop"
      # --- IoT VLAN 20 DoT (853) bypass drop ---
      # Same pattern as the Kids DoT drop below: encrypted DNS to anything but the Pi
      # resolver (accepted above) is dropped, so IoT devices cannot bypass the forced-DNS
      # path (their plain :53 is dst-nat'ed to the Pi). Residual bypass: DoH/443 stays
      # accepted — arbitrary HTTPS cannot be filtered without TLS interception.
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        protocol: tcp
        dst-port: 853
        action: drop
        comment: "IoT -> DoT bypass drop - forced DNS to Pi (HD-342) tcp"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        protocol: udp
        dst-port: 853
        action: drop
        comment: "IoT -> DoT bypass drop - forced DNS to Pi (HD-342) udp"
      # --- Kids VLAN 40 controls ---
      # Forced filtered DNS: plain :53 from Kids is dst-nat'ed to the Technitium primary
      # (ip firewall nat above), which enforces the Kids-Group policy (Cloudflare
      # Families, network-dns.md); DoT (853) to anything but the resolver is dropped here
      # so DNS cannot bypass the filter. Residual bypass: DoH/443 — accepted, upstream
      # filtering still applies on the resolver.
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        protocol: tcp
        dst-port: 853
        action: drop
        comment: "Kids -> DoT bypass drop - DNS forced through filter (HD-182) tcp"
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        protocol: udp
        dst-port: 853
        action: drop
        comment: "Kids -> DoT bypass drop - DNS forced through filter (HD-182) udp"
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        dst-address: "{{ vlan_subnets[10] }}"
        action: drop
        comment: "Kids -> Home drop (HD-182)"
      # Bedtime hard block (docs/network-vlans.md §Inter-VLAN Firewall Rules), with the
      # RouterOS NATIVE time-based filter parameter — deliberately NOT a /system
      # scheduler enable/disable toggle: under declarative api_modify a toggled rule's
      # `disabled` flag is reset on every re-run and the block would not survive a reboot
      # mid-window, while `time=` is stateless and reboot-safe.
      # RouterOS 7 validates the value strictly: the weekday list must be present — a bare
      # `22:00:00-07:00:00` is rejected with `invalid value for argument time`. The
      # cross-midnight span (22:00-07:00) renders and works.
      # A time= rule that is currently OUTSIDE its window reads `invalid=true` /
      # `inactive time` — normal RouterOS display for a time-window rule (an active one
      # reads `invalid=false`), not a syntax error.
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        out-interface: pppoe-telekom
        time: "22:00:00-07:00:00,mon,tue,wed,thu,fri,sat,sun"
        action: drop
        comment: "Kids bedtime WAN block 22:00-07:00 (HD-182)"
      # Kids -> WAN allowed OUT of window. Placed BELOW the bedtime drop so the time=
      # block always wins in-window; this accept only enables egress 07:00-22:00. The
      # DoT/DoH bypass drops sit above and still win.
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        out-interface: pppoe-telekom
        action: accept
        comment: "Kids -> WAN allowed out-of-window (HD-309 row 73)"
      # Default deny LAST within this ordered block. A second `chain: forward`
      # api_modify with `handle_absent_entries: remove` would delete every rule above
      # it on each run.
      - chain: forward
        src-address-list: internal_lan
        dst-address-list: internal_lan
        action: drop
        comment: "Default deny inter-VLAN"
      # --- Comtrend modem mgmt (WAN-side single-LAN admin path) ---
      # The Comtrend (192.168.1.1) sits on the modem's own LAN, not on any homelab VLAN.
      # The FORWARD default is `accept`, so a rule is needed to RESTRICT it: only
      # trusted-admin hosts reach the modem's web UI, everything else is dropped. The
      # Comtrend is a consumer device with a default-password admin UI.
      - chain: forward
        src-address-list: trusted-admin
        dst-address: "{{ comtrend_modem.modem_mgmt_ip }}"
        protocol: tcp
        dst-port: 80,443
        action: accept
        comment: "HD-302: trusted-admin -> Comtrend modem web UI (PPPoE redial admin path)"
      - chain: forward
        dst-address: "{{ comtrend_modem.modem_subnet }}"
        action: drop
        comment: "HD-302: default-deny all other homelab hosts -> Comtrend subnet"

# -------------------------------------------------------------------------
# Cloud-IoT per-MAC WAN egress (iot-wan-allow), rendered from SSOT.
# The cloud devices ride VLAN 20 (Kogler IOT), where the IoT drop above cuts their
# WAN; this accept restores internet for exactly the SSOT rows with wan_allow: true,
# and a temporary firmware window is driven through the router API user.
#
# ⚠️ APPLY-MODEL: the FORWARD-chain accept rows are owned by the CONVERGE template
# (rb4011_converge.rsc.j2) — the apply of record. A role api_modify APPENDS AT THE END,
# which places the rule below the IoT->WAN drop, where first-match-wins makes it inert.
# This task is GATED OFF: verification + the converge import are the only paths. When in
# doubt, drop the role task and rely on the import.
# → docs/network-ops.md §Ordering pitfall — a new FORWARD accept must sit ABOVE the
#   default-deny
- name: Ensure per-MAC IoT cloud-device WAN egress accepts (HD-312 phase 3 / HD-325 wan_allow)
  when: false   # OWNED BY rb4011_converge.rsc.j2 (apply-of-record) — do NOT run
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall filter
    handle_absent_entries: ignore
    restrict:
      - field: chain
        values: [forward]
    data:
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        src-mac-address: "{{ item.mac }}"
        out-interface: pppoe-telekom
        action: accept
        comment: "IoT cloud device -> WAN allowed via iot-wan-allow (HD-312/325): {{ item.name }}"
  loop: "{{ network_static_hosts | selectattr('mac', 'defined') | selectattr('vlan', 'equalto', 20) | selectattr('wan_allow', 'defined') | selectattr('wan_allow', 'equalto', true) | list }}"
  loop_control:
    label: "HD-312/325 iot-wan-allow accept for {{ item.name }}"
  tags: [network]

# Per-MAC kids controls on Home VLAN 10 — bedtime WAN hard-block (22:00-07:00) +
# DoT (853) bypass drop, one pair per SSOT row with `kids: true`.
#
# ⚠️ APPLY-MODEL: the FORWARD-chain drops are owned by the CONVERGE template
# (rb4011_converge.rsc.j2, which places them ABOVE the Home->WAN accept) — the apply of
# record. A role api_modify appends at the end, where the accept shadows the drop. This
# task is GATED OFF: verification + the converge import are the only paths.
- name: Ensure per-MAC kids bedtime WAN drop + DoT-bypass (HD-326)
  when: false   # OWNED BY rb4011_converge.rsc.j2 (apply-of-record) — do NOT run
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall filter
    handle_absent_entries: ignore
    restrict:
      - field: chain
        values: [forward]
    data:
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        src-mac-address: "{{ item.mac }}"
        out-interface: pppoe-telekom
        protocol: tcp
        dst-port: 853
        action: drop
        comment: "HD-326 kids DoT-bypass drop (853): {{ item.name }}"
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        src-mac-address: "{{ item.mac }}"
        out-interface: pppoe-telekom
        action: drop
        time: "22:00-07:00,sun,mon,tue,wed,thu,fri,sat"
        comment: "HD-326 kids bedtime WAN drop (22:00-07:00): {{ item.name }}"
  loop: "{{ network_static_hosts | selectattr('kids', 'defined') | selectattr('kids', 'equalto', true) | list }}"
  loop_control:
    label: "HD-326 kids controls for {{ item.name }}"
  tags: [network]

# -------------------------------------------------------------------------
# Firewall - INPUT Chain (router management planes)
# -------------------------------------------------------------------------
# The default RouterOS input policy is `accept`: without explicit input rules the
# router's own management services (API 8728, WinBox 8291, SSH 22, www/www-ssl
# 80/443) listen on ALL interfaces, including WAN and every VLAN. This section
# restricts those services to the Management VLAN (99) plus `trusted-admin`
# hosts (nas/oldsrv/ha-vip — the Home servers that manage the router per
# network-vlans.md), and drops them from every other source. Essential control-
# plane input (DHCP, VRRP, WireGuard) is left at the RouterOS default so nothing
# else breaks; only the sensitive management ports are gated here.
# Order matters: top-down, first match wins — established/related first.

- name: Ensure router INPUT-chain firewall rules (idempotent, ordered) (HD-78/KOPS-003)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall filter
    handle_absent_entries: remove
    handle_entries_content: remove_as_much_as_possible
    ensure_order: true
    restrict:
      - field: chain
        values: [input]
    data:
      - chain: input
        connection-state: established,related
        action: accept
        comment: "Allow established/related input"
      - chain: input
        src-address-list: internal_lan
        protocol: udp
        dst-port: 67,68
        action: accept
        comment: "Allow DHCP input from LAN"
      - chain: input
        src-address: "{{ vlan_subnets[99] }}"
        protocol: tcp
        dst-port: 22,8728,8729,8291,80,443
        action: accept
        comment: "Allow mgmt services from Management VLAN"
      - chain: input
        src-address-list: trusted-admin
        protocol: tcp
        dst-port: 22,8728,8729,8291,80,443
        action: accept
        comment: "Allow mgmt services from trusted-admin"
      - chain: input
        protocol: tcp
        dst-port: 22,8728,8729,8291,80,443
        action: drop
        comment: "Drop mgmt services from non-mgmt sources (HD-78)"
      # --- SNMP: RO poller from the Mgmt VLAN only ---
      - chain: input
        src-address: "{{ vlan_subnets[99] }}"
        protocol: udp
        dst-port: 161
        action: accept
        comment: "Allow SNMP from Management VLAN (HD-53)"
      - chain: input
        protocol: udp
        dst-port: 161
        action: drop
        comment: "Drop SNMP from non-mgmt sources (HD-53)"
      # --- Router resolver as DNS tertiary (network-dns.md) ---
      # DHCP hands out primary → secondary → router; this input rule lets LAN sources
      # query the router's own /ip dns when both resolvers are down (unfiltered last
      # resort — an accepted tradeoff documented in network-dns.md).
      - chain: input
        src-address-list: internal_lan
        protocol: tcp
        dst-port: 53
        action: accept
        comment: "Allow DNS input from LAN - router resolver tertiary (HD-182) tcp"
      - chain: input
        src-address-list: internal_lan
        protocol: udp
        dst-port: 53
        action: accept
        comment: "Allow DNS input from LAN - router resolver tertiary (HD-182) udp"
      # --- WireGuard S2S: accept the handshake/input on the wg listen port ---
      # MUST stay above any full default-deny input: the converge template's PPPoE
      # brute-force floor drops new-WAN traffic, and without this the VPS-initiated
      # handshake never completes. Port = wg_s2s_vps.listen_port (SSOT).
      - chain: input
        protocol: udp
        dst-port: "{{ wg_s2s_vps.listen_port }}"
        action: accept
        comment: "Allow WireGuard S2S handshake/input (HD-285)"

# The router resolver answers LAN queries only with allow-remote-requests=yes (the
# RouterOS default is no) — required for the tertiary above, and it needs `/ip dns
# servers` populated or every query SERVFAILs. Cloudflare here is the last resort behind
# the Technitium chain. → docs/network-dns.md §Resolver upstream (forwarders)
# Requires community.routeros >= 2.17 (settings-path support in api_modify); an older
# collection fails loud at deploy rather than silently skipping.
- name: Allow the router resolver to answer LAN queries (DNS tertiary, HD-182)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dns
    data:
      - allow-remote-requests: yes
        servers: 1.1.1.1,1.0.0.1


# Note: WireGuard S2S and VRRP keepalived advertise input are left at the RouterOS
# default (accept) so the deferred tunnel / HA links keep working. If a full
# default-deny input policy is ever wanted, add the control-plane accepts first, then a
# final `chain: input` drop-all rule.

# -------------------------------------------------------------------------
# CAPsMAN Configuration
# -------------------------------------------------------------------------
# TODO: CAPsMAN SSIDs require WPA2 passphrases from 1Password.
# Required secret items: wifi_login or per-SSID password items.

- name: Document CAPsMAN pending secrets
  debug:
    msg: |
      CAPsMAN SSIDs require WPA2 passphrases from 1Password.
      Required secret items: wifi_login (or per-SSID password items).
      Once available, uncomment and configure CAPsMAN in this role.

# -------------------------------------------------------------------------
# WireGuard S2S Configuration (wg-s2s — home router ↔ VPS)
# -------------------------------------------------------------------------
# The VPS side is configured by the `wireguard` role (systemd-networkd); this is the
# RB4011 side, applied via api_modify because the declarative
# `community.routeros_interface_wireguard*` modules do not exist. The private key is the
# router's OWN `wg_password` — WireGuard needs distinct keys per side (the VPS uses
# `wg_password_vps`).

- name: Assert the VPS WG public key is available (fail-closed, HD-65/HD-91)
  assert:
    that:
      - "(wireguard_s2s_vps.vps_public_key | default('')) | length > 0"
    fail_msg: >-
      `wireguard_s2s_vps.vps_public_key` must be set (derived from the VPS wireguard
      private key) before the router can peer with the VPS — never deploy with a blank peer.
  tags: router_wireguard

- name: Create WireGuard interface (wg-s2s)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface wireguard
    handle_absent_entries: ignore
    data:
      - name: wg-s2s
        private-key: "{{ lookup('community.general.onepassword', 'wg_password', field='password', vault=op_vault) }}"
        listen-port: "{{ wireguard_s2s_vps.port }}"
  tags: router_wireguard

- name: Assign WireGuard /ip address to the wg-s2s interface
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip address
    handle_absent_entries: ignore
    data:
      - address: "{{ wireguard_s2s_vps.local_ip }}"
        interface: wg-s2s
        disabled: no
  tags: router_wireguard

- name: Configure WireGuard peer (VPS) on wg-s2s
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface wireguard peers
    handle_absent_entries: ignore
    data:
      - interface: wg-s2s
        public-key: "{{ wireguard_s2s_vps.vps_public_key }}"
        allowed-address: "{{ wireguard_s2s_vps.remote_ip }},{{ wireguard_s2s_vps.allowed_ips | join(',') }}"
        endpoint-address: "{{ wireguard_s2s_vps.remote_endpoint }}"
        endpoint-port: "{{ wireguard_s2s_vps.port }}"
        comment: vps-s2s
        disabled: no
  tags: router_wireguard

- name: Route wg-vps-services (VPS-resident services) via the VPS S2S peer
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip route
    handle_absent_entries: ignore
    data:
      - dst-address: "{{ (network_ranges | selectattr('name', 'equalto', 'wg-vps-services') | first).cidr }}"
        gateway: "{{ wireguard_s2s_vps.remote_ip.split('/')[0] }}"
        comment: wg-vps-services-via-vps
        disabled: no
  tags: router_wireguard
# -------------------------------------------------------------------------
# Management Services — lockdown state (parity with rb4011_initial.rsc.j2)
# -------------------------------------------------------------------------
# The bootstrap template owns the `available-from` CIDR binding on every service
# (community.routeros api_modify 3.x does NOT support the `available-from` field
# for path ip service — module schema only exposes address/certificate/disabled/
# name/port/tls-version). This role block re-declares the steady-state DISABLED
# state + port + certificate for each service so a converge can never silently
# drift a dangerous service back on (telnet/ftp/www/api-ssl/reverse-proxy stay
# disabled; api/www-ssl/ssh/winbox stay enabled on their well-known ports). The
# mgmt-subnet-only reachability is enforced by the INPUT-chain rules below + the
# bootstrap binding — belt and braces.
- name: Configure management services (lockdown — HD-301 parity)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip service
    # ip service is a SETTINGS-like path (no add/remove of arbitrary rows) —
    # handle_absent_entries defaults to ignore, matching the per-row data below.
    data:
      - name: telnet
        disabled: yes
        port: 23
      - name: ftp
        disabled: yes
        port: 21
      - name: www
        disabled: yes
        port: 80
      - name: api-ssl
        disabled: yes
        port: 8729
        certificate: none
      - name: reverse-proxy
        disabled: yes
        port: 443
        certificate: none
      - name: api
        disabled: no
        port: 8728
      - name: www-ssl
        disabled: no
        port: 443
        certificate: none
      - name: ssh
        disabled: no
        port: 22
      - name: winbox
        disabled: no
        port: 8291



# -------------------------------------------------------------------------
# Per-VLAN trunk ports to switch
# -------------------------------------------------------------------------
# ⚠️ PARITY: this task mirrors rb4011_converge.rsc.j2 §Bridge+trunk. The converge .rsc
# import is the apply of record; this api_modify must stay BYTE-IDENTICAL to the
# template's tagged/untagged sets or the next converge regresses the device.
# Edit BOTH or NEITHER.
# Every VLAN is tagged on sfp-sfpplus1 (the CRS328 uplink) so each per-VLAN gateway is
# reachable across the switch — the mirror of crs328_converge.rsc.j2. A VLAN missing
# here dies at the trunk: empty ARP on its gateway, no WAN for its devices.
- name: Configure VLANs on trunk port to switch
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge vlan
    handle_absent_entries: ignore
    data:
      - bridge: bridge-lan
        vlan-ids: "{{ item.id }}"
        tagged: "bridge-lan,sfp-sfpplus1"
        # VLAN 10: untagged ether10 (Pi) + ether8 (spark) access members alongside the
        # trunk tag. VLAN 99: untagged ether7 (iLO), the only mgmt-only access port, plus
        # ether8's tagged Mgmt leg (same NIC as Home — router_port_map) and the
        # bootstrap's pvid-99 ports. Without these, vlan-filtering drops the VLAN between
        # the local access ports and the trunk -> empty ARP, switch (sfp) unreachable.
        # VLAN 20 (IoT): untagged ether9 (HMIP-HAP access).
        untagged: "{{ (['ether10','ether8'] if item.id == 10 else ['ether7'] if item.id == 99 else ['ether9'] if item.id == 20 else []) | join(',') }}"
        comment: "{{ item.name }} VLAN on trunk"
  loop: "{{ vlans | selectattr('unused', 'undefined') | list }}"  # skip VLAN 1 Blackhole (unused: true)
  loop_control:
    label: "VLAN{{ item.id }} on trunk"



# -------------------------------------------------------------------------
# Bridge PORT membership: enforce pvid + tagged VLANs per port from
# router_port_map (SSOT — group_vars/router.yml). The converge .rsc applies this; the
# role ALSO enforces it so neither can drift from the SSOT.
# Port model: untagged = the primary/access VLAN (Home 10 for admin/PC/Pi), tagged = the
# secondary/admin backplane (Management 99). A single untagged port carries ONE VLAN
# (pvid). Both consumers read router_port_map — the role and the .rsc must never
# disagree.
# -------------------------------------------------------------------------
- name: Enforce bridge port pvid + tagged memberships (HD-311 a, router_port_map)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge port
    handle_absent_entries: ignore
    data:
      - bridge: bridge-lan
        interface: "{{ item.value.port }}"
        pvid: "{{ item.value.pvid }}"
  loop: "{{ router_port_map | dict2items | selectattr('value.port', 'defined') | selectattr('value.pvid', 'defined') | list }}"
  tags: [network, router-port-model]


# -------------------------------------------------------------------------
# Enable VLAN filtering on bridge
# -------------------------------------------------------------------------
- name: Enable VLAN filtering on bridge
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge
    handle_absent_entries: ignore
    data:
      - name: bridge-lan
        vlan-filtering: yes
        protocol-mode: none
        comment: "Bridge with VLAN filtering enabled"

# -------------------------------------------------------------------------
# Central syslog / log shipping — RouterOS logs -> the VPS log collector
# -------------------------------------------------------------------------
# RouterOS 7 remote logging action (RFC5424, UDP/514). The target is the VPS side of the
# wg-s2s /30 (wireguard_s2s_vps.remote_ip); `src-address` ties the source to wg-s2s so
# the traffic stays on the mgmt plane and never leaves over WAN. Fail-loud: a missing
# SSOT value aborts the render. The 'error' topic is what carries login failures.
- name: Ensure central syslog logging action exists (HD-313)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: system logging action
    handle_absent_entries: ignore
    data:
      - name: centralsyslog
        target: remote
        remote: "{{ wireguard_s2s_vps.remote_ip.split('/')[0] }}"
        remote-port: 514
        src-address: "{{ wireguard_s2s_vps.local_ip.split('/')[0] }}"
        syslog-severity: auto
        syslog-facility: local0
        comment: "HD-313: RFC5424 syslog -> VPS CrowdSec/Loki (wg-s2s)"
  tags: [network, router-logging]

- name: Ensure logging rules forward security topics to centralsyslog (HD-313)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: system logging
    handle_absent_entries: ignore
    data:
      - topics: error
        action: centralsyslog
        comment: "HD-313: login/API failures (a1ad parser needs 'error')"
      - topics: firewall
        action: centralsyslog
        comment: "HD-313: firewall drops (port-scan scenario)"
      # RouterOS 7 action-name rule: letters+numbers only. The action is
      # 'centralsyslog' (created above); 'central-syslog' is rejected by the API
      # ('action may not contain -'), so these rules would fail to create on converge.
      - topics: critical
        action: centralsyslog
        comment: "HD-313: critical system events"
      - topics: warning
        action: centralsyslog
        comment: "HD-313: warnings"
  tags: [network, router-logging]

# -------------------------------------------------------------------------
# Scoped logpipe API user — read-only, Mgmt-plane only.
# Follows the read-only API user pattern; the n8n firmware automation uses its own
# `n8n` scoped read-only user (same pattern, separate credential) defined below.
# -------------------------------------------------------------------------
- name: Ensure scoped logpipe API user exists (HD-313)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: user
    handle_absent_entries: ignore
    data:
      - name: logpipe
        group: read
        password: "{{ lookup('community.general.onepassword', 'mikrotik-logpipe_api', field='password', vault=op_vault) }}"
        disabled: "no"
        comment: "HD-313: read-only log/API access (remote syslog + n8n)"
  tags: [network, router-logging]

# -------------------------------------------------------------------------
# Scoped n8n API user — read-only, Mgmt-plane only, same pattern as logpipe.
# The n8n firmware-workflow automation polls router state through this user;
# temporary iot-wan-allow membership toggles stay OWNER-GATED in the n8n flow
# authoring — never hand-edit them.
# -------------------------------------------------------------------------
- name: Ensure scoped n8n API user exists (HD-312(4))
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: user
    handle_absent_entries: ignore
    data:
      - name: n8n
        group: read
        password: "{{ lookup('community.general.onepassword', 'mikrotik-n8n_api', field='password', vault=op_vault) }}"
        disabled: "no"
        comment: "HD-312(4): read-only API for n8n firmware automation"
  tags: [network, router-logging]

