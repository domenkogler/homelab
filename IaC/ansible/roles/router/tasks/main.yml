---
# router role — MikroTik RouterOS configuration via REST API
# Implements: VLAN interfaces, DHCP, firewall, CAPsMAN, WireGuard, AP DHCP reservations
#
# Connection/auth decision:
# The bootstrap creates `ansible` (SSH-key only, empty password) and `admin` (password + key).
# For community.routeros modules, we use the RouterOS API (username+password).
# We authenticate as `admin` using mikrotik-admin_login from 1Password.
#
# Note: community.routeros collection is required. Added to requirements.yml.

- name: Refuse router runs as ai-debug or unknown users (local connection allowed via 1Password auth)
  assert:
    that:
      - ansible_connection == 'local' or ansible_user in ansible_admin_users
      - ansible_user is not defined or ansible_user not in ['ai-debug']
    fail_msg: >-
      router role must run as an allowed admin user (or local connection with 1Password auth).
      The ai-debug user must never run Ansible.
  tags: always

# -------------------------------------------------------------------------
# Get admin password from 1Password for API authentication
# -------------------------------------------------------------------------
- name: Fetch MikroTik admin password from 1Password
  set_fact:
    routeros_api_password: "{{ lookup('community.general.onepassword', 'mikrotik-admin_login', field='password', vault=op_vault) }}"
  no_log: true

# -------------------------------------------------------------------------
# Assert-before-mutate (HD-161): read device identity once and refuse to apply
# any api_modify if the target is not the RB4011 we expect. Guards against a
# wrong-target or swapped-host applying router config to the wrong gear.
# Runs once per role run, before the first api_modify below.
# -------------------------------------------------------------------------
- name: Assert device identity before any mutate (HD-161)
  community.routeros.api_facts:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    port: "{{ routeros_api_port }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    path: system identity
  register: router_identity_facts
  tags: always

- name: Assert the API target is {{ routeros_expected_identity }}
  assert:
    that:
      - routeros_expected_identity | length > 0
      - (router_identity_facts.data | map(attribute='name') | list | first) == routeros_expected_identity
    fail_msg: >-
      Target at {{ routeros_api_host }} reports identity
      '{{ router_identity_facts.data | map(attribute='name') | list | first }}' —
      expected '{{ routeros_expected_identity }}'. Refusing to mutate the wrong device.
  tags: always

# -------------------------------------------------------------------------
# Bridge + VLAN Interfaces
# -------------------------------------------------------------------------
# Ensure bridge-lan exists BEFORE creating VLAN interfaces on it (self-contained;
# a non-bootstrap run may not have a bridge yet). vlan_filtering is deliberately
# left off here and enabled LAST (see below) so the mgmt plane, VLAN DB and trunk
# are in place first — no window where filtering is on but VLANs aren't defined.
- name: Ensure bridge-lan bridge exists
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge
    handle_absent_entries: ignore
    data:
      - name: bridge-lan
        disabled: no
        protocol-mode: none
        comment: "LAN bridge (VLAN filtering enabled later)"

- name: Ensure VLAN interfaces exist
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface vlan
    handle_absent_entries: ignore
    data:
      - name: "vlan{{ item.id }}-{{ item.name | lower }}"
        vlan-id: "{{ item.id }}"
        interface: bridge-lan
        disabled: no
  loop: "{{ vlans | selectattr('unused', 'undefined') | list }}"  # skip VLAN 1 Blackhole (unused: true)
  loop_control:
    label: "VLAN{{ item.id }}"

# -------------------------------------------------------------------------
# VLAN IP Addresses
# -------------------------------------------------------------------------
- name: Configure VLAN gateway IP addresses
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip address
    handle_absent_entries: ignore
    data:
      - address: "{{ (network_static_hosts | selectattr('vlan', '==', item.id) | selectattr('name', '==', 'router') | map(attribute='ip') | list | first) }}/{{ item.subnet.split('/')[1] }}"
        interface: "vlan{{ item.id }}-{{ item.name | lower }}"
        disabled: no
  loop: "{{ network_vlans | selectattr('id', 'in', [10, 20, 21, 30, 40, 50, 99]) | list }}"
  loop_control:
    label: "VLAN{{ item.id }} gateway"

# -------------------------------------------------------------------------
# Comtrend modem mgmt address on ether1 (HD-302)
# -------------------------------------------------------------------------
# Gives the RB4011 a /32 management address on the Comtrend's own LAN
# (192.168.1.0/24) so the modem's web UI at 192.168.1.1 stays reachable from
# the homelab for the twice-yearly PPPoE-redial dance — no physical cable swap.
# Gated by comtrend_modem.enabled (opt-out per host). Idempotent.
- name: Configure Comtrend modem mgmt IP on ether1
  when: comtrend_modem.enabled | bool
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip address
    handle_absent_entries: ignore
    data:
      - address: "{{ comtrend_modem.router_on_modem }}"
        interface: "{{ comtrend_modem.iface }}"
        comment: "HD-302: Comtrend modem mgmt subnet (single-LAN admin path)"
        disabled: no

# -------------------------------------------------------------------------
# DHCP Pools and Servers
# -------------------------------------------------------------------------
- name: Configure DHCP pools for each VLAN
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip pool
    handle_absent_entries: ignore
    data:
      - name: "pool-vlan{{ item.id }}"
        ranges: "{{ item.pool }}"
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]

- name: Configure DHCP server networks for each VLAN
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server network
    handle_absent_entries: ignore
    data:
      - address: "{{ item.subnet }}"
        gateway: >-
          {{ (network_static_hosts | selectattr('vlan', '==', item.id) | selectattr('name', '==', 'router') | list | first).ip }}
        # Resolver chain per network-dns.md (HD-182 parity): Technitium primary,
        # Technitium secondary (Pi), then the router /ip dns as tertiary fallback.
        dns-server: >-
          {{ [dns_primary_ip,
              dns_secondary_ip | default(''),
              (network_static_hosts | selectattr('vlan', '==', item.id) | selectattr('name', '==', 'router') | list | first).ip]
             | select('string') | unique | join(',') }}
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]

- name: Configure DHCP servers for each VLAN
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server
    handle_absent_entries: ignore
    data:
      - name: "dhcp-{{ item.id }}"
        interface: "vlan{{ item.id }}-{{ item.name | lower }}"
        address-pool: "pool-vlan{{ item.id }}"
        disabled: no
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]


# -------------------------------------------------------------------------
# DHCP Static Reservations
# -------------------------------------------------------------------------
# NOTE (R-2 live-finding): the steady-state role creates DHCP servers named `dhcp-<vlan>`
# for VLANs 10/20/21/30/40/50 (loop below excludes 1 and 99), but the management plane's
# DHCP server is `dhcp-mgmt` (named in the BOOTSTRAP, not recreated here) — so the original
# AP reservation block below (server: `dhcp-99`) could never match a real server and APs fell
# back to dynamic mgmt-pool IPs. Flagged for the cutover-prep session; NOT silent-reworked here.

- name: Configure DHCP static reservations for APs (unchanged legacy behavior)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server lease
    handle_absent_entries: ignore
    data:
      - server: "dhcp-{{ item.vlan }}"
        address: "{{ item.ip }}"
        mac-address: "{{ item.mac }}"
        comment: "AP {{ item.name }} static reservation"
  loop: "{{ network_static_hosts | selectattr('name', 'startswith', 'ap-') | selectattr('mac', 'defined') | selectattr('vlan', '==', 99) | list }}"
  when: item.vlan == 99

- name: Configure DHCP static reservations for non-mgmt reserved devices (R-2)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dhcp-server lease
    handle_absent_entries: ignore
    data:
      - server: "dhcp-{{ item.vlan }}"
        address: "{{ item.ip }}"
        mac-address: "{{ item.mac }}"
        comment: "{{ item.name }} static reservation (R-2)"
  loop: "{{ network_static_hosts \
         | selectattr('mac', 'defined') \
         | selectattr('vlan', 'not in', [99]) \
         | selectattr('name', 'not in', ['router']) \
         | rejectattr('name', 'search', 'ap-') \
         | list }}"
  when: item.mac is defined and item.vlan != 99


# -------------------------------------------------------------------------
# Firewall - Address Lists
# -------------------------------------------------------------------------
- name: Create firewall address list for trusted-admin hosts
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ item.ip }}"
        list: trusted-admin
        comment: "Trusted admin host: {{ item.name }}"
  loop: "{{ network_static_hosts | selectattr('name', 'in', ['oldsrv', 'nas', 'ha-vip']) | list }}"
  loop_control:
    label: "{{ item.name }}"


- name: Create firewall address list for trusted-ha hosts
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ item.ip }}"
        list: trusted-ha
        comment: "Trusted HA host: {{ item.name }}"
  loop: "{{ network_static_hosts | selectattr('name', 'in', ['oldsrv', 'ha-vip']) | list }}"
  loop_control:
    label: "{{ item.name }}"


- name: Create firewall address list for internal LAN subnets
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ item.subnet }}"
        list: internal_lan
        comment: "Internal LAN {{ item.name }} VLAN"
  loop: "{{ network_vlans }}"
  when: item.id not in [1, 99]


- name: Set UPS management IP in address list
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ (network_static_hosts | selectattr('name', '==', 'ups') | list | first).ip }}"
        list: ups_management
        comment: "UPS management host"

- name: Create firewall address list for the VPS S2S peer (HD-155 least-access)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ wireguard_s2s_vps.remote_ip.split('/')[0] }}"
        list: vps_s2s_peer
        comment: "VPS S2S peer (HD-155) — least-access source"

- name: Create firewall address list for the scoped home targets the VPS may reach (HD-155)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall address-list
    handle_absent_entries: ignore
    data:
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'nas') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: nas (nut/zfs exporters)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'ha-vip') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: HA VIP (exporter)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'oldsrv') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: oldsrv (backends when wired)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'pi') | selectattr('vlan', 'equalto', 10) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: pi (probe)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'router') | selectattr('vlan', 'equalto', 99) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: router (probe)"
      - address: "{{ (network_static_hosts | selectattr('name', 'equalto', 'switch') | selectattr('vlan', 'equalto', 99) | first).ip }}"
        list: vps_scoped_home
        comment: "HD-155: switch (probe)"



# -------------------------------------------------------------------------
# Firewall - NAT Masquerade
# -------------------------------------------------------------------------
- name: Configure NAT masquerade for outbound traffic
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall nat
    handle_absent_entries: ignore
    data:
      - chain: srcnat
        out-interface: pppoe-telekom
        action: masquerade
        comment: "NAT masquerade → WAN"
      # --- Kids VLAN 40 forced filtered DNS (HD-182) ---
      # Hijack any DNS (53 udp/tcp) leaving the Kids VLAN — hardcoded-resolver
      # devices included — to the Technitium primary, which enforces the
      # Kids-Group policy (Cloudflare Families, network-dns.md). NAT runs before
      # the forward chain, so the rewritten packets match the LAN→resolver accept
      # rule above. DoT (853) bypass is dropped in the filter chain.
      - chain: dstnat
        src-address: "{{ vlan_subnets[40] }}"
        protocol: udp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_primary_ip }}"
        to-ports: 53
        comment: "Kids forced filtered DNS — UDP 53 → Technitium (HD-182)"
      - chain: dstnat
        src-address: "{{ vlan_subnets[40] }}"
        protocol: tcp
        dst-port: 53
        action: dst-nat
        to-addresses: "{{ dns_primary_ip }}"
        to-ports: 53
        comment: "Kids forced filtered DNS — TCP 53 → Technitium (HD-182)"


# -------------------------------------------------------------------------
# Firewall - Inter-VLAN Rules
# -------------------------------------------------------------------------
# Order matters in RouterOS: rules are evaluated top-down, first match wins.
# The established/related accept MUST come first so replies to already-allowed
# connections (inter-VLAN and WAN return) are permitted before the default-deny.

- name: Ensure inter-VLAN forward firewall rules (idempotent, ordered)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall filter
    handle_absent_entries: remove
    handle_entries_content: remove_as_much_as_possible
    ensure_order: true
    restrict:
      - field: chain
        values: [forward]
    data:
      # --- allowed flows (top-down, first match wins) ---
      - chain: forward
        connection-state: established,related
        action: accept
        comment: "Allow established/related return traffic"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        dst-address-list: trusted-ha
        protocol: udp
        dst-port: 5683
        action: accept
        comment: "IoT Shelly Gen1 CoAP push -> HA (HD-229) — narrow reverse exception"
      - chain: forward
        src-address-list: trusted-admin
        dst-address: "{{ vlan_subnets[20] }}"
        action: accept
        comment: "Trusted admin → IoT (new, MQTT/HA)"
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        dst-address: "{{ vlan_subnets[20] }}"
        protocol: tcp
        connection-state: established,related
        action: accept
        comment: "Home → IoT (established/related)"
      - chain: forward
        src-address-list: trusted-admin
        dst-address: "{{ vlan_subnets[21] }}"
        action: accept
        comment: "Trusted admin → IoT-Internet (new)"
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        dst-address: "{{ vlan_subnets[21] }}"
        protocol: tcp
        connection-state: established,related
        action: accept
        comment: "Home → IoT-Internet (established/related)"
      - chain: forward
        src-address-list: trusted-admin
        dst-address-list: ups_management
        protocol: tcp
        dst-port: 80,443
        action: accept
        comment: "Trusted admin → UPS web UI (Mgmt)"
      - chain: forward
        src-address-list: internal_lan
        dst-address: "{{ dns_primary_ip }}"
        protocol: udp,tcp
        dst-port: 53,853
        action: accept
        comment: "LAN → DNS resolver (Technitium)"
      # Secondary-resolver parity (HD-182, network-dns.md): the Pi resolver must be
      # reachable from every VLAN exactly like the primary — without this rule the
      # default-deny below blocks it once the Pi secondary takes over.
      - chain: forward
        src-address-list: internal_lan
        dst-address: "{{ dns_secondary_ip }}"
        protocol: udp,tcp
        dst-port: 53,853
        action: accept
        comment: "LAN → DNS secondary Pi (HD-182)"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        dst-address: "{{ dns_primary_ip }}"
        protocol: udp,tcp
        dst-port: 53,853
        action: accept
        comment: "IoT → DNS resolver"
      - chain: forward
        src-address: "{{ vlan_subnets[21] }}"
        action: accept
        comment: "IoT-Internet → Internet allowed"
      - chain: forward
        src-address: "{{ vlan_subnets[20] }}"
        out-interface: pppoe-telekom
        action: drop
        comment: "IoT → WAN drop (disable manually for firmware updates)"
      - chain: forward
        src-address-list: vps_s2s_peer
        dst-address-list: vps_scoped_home
        action: accept
        comment: "VPS S2S → scoped home targets (HD-155)"
      - chain: forward
        src-address-list: vps_s2s_peer
        action: drop
        comment: "VPS S2S → anything else DROP (HD-155 least-access)"
      - chain: forward
        src-address: "{{ vlan_subnets[10] }}"
        dst-address: "{{ vlan_subnets[50] }}"
        action: accept
        comment: "Home → Media (new allowed)"
      - chain: forward
        src-address: "{{ vlan_subnets[50] }}"
        dst-address: "{{ vlan_subnets[10] }}"
        action: accept
        comment: "Media → Home (media server)"
      - chain: forward
        src-address: "{{ vlan_subnets[30] }}"
        dst-address-list: internal_lan
        action: drop
        comment: "Guest → LAN drop"
      # --- Kids VLAN 40 controls (HD-182; decision HD-179 — implement at Phase 1.5) ---
      # Forced filtered DNS: plain :53 from Kids is dst-nat'ed to the Technitium
      # primary (ip firewall nat below) which enforces the Kids-Group policy
      # (Cloudflare Families upstream, network-dns.md); encrypted DoT (853) to
      # anything but the resolver (allowed above) is dropped here so DNS cannot
      # bypass the filter. Residual bypass: DoH/443 — accepted (kids' browsers can
      # reach arbitrary HTTPS; upstream filtering still applies on the resolver).
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        protocol: tcp,udp
        dst-port: 853
        action: drop
        comment: "Kids → DoT bypass drop — DNS forced through filter (HD-182)"
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        dst-address: "{{ vlan_subnets[10] }}"
        action: drop
        comment: "Kids → Home drop (HD-182)"
      # Bedtime hard block (network-vlans.md matrix row). Implemented with the
      # RouterOS NATIVE time-based filter parameter, deliberately NOT a
      # /system scheduler enable/disable toggle: under declarative api_modify a
      # toggled rule's disabled flag gets reset on every re-run (a 23:00 run would
      # silently lift the block until 07:00) and the state would not survive a
      # reboot mid-window. The time= param is stateless, reboot-safe and idempotent.
      # ⏳ Deploy-gated: confirm the overnight span renders correctly on RouterOS 7.
      - chain: forward
        src-address: "{{ vlan_subnets[40] }}"
        out-interface: pppoe-telekom
        time: 22:00:00-07:00:00
        action: drop
        comment: "Kids bedtime WAN block 22:00-07:00 (HD-182)"
      # Default deny LAST — merged into this ordered block (was a second
      # chain=forward api_modify whose handle_absent_entries: remove would have
      # deleted every rule above on each run; HD-182).
      - chain: forward
        src-address-list: internal_lan
        dst-address-list: internal_lan
        action: drop
        comment: "Default deny inter-VLAN"
      # --- HD-302: Comtrend modem mgmt (WAN-side single-LAN admin path) ---
      # The Comtrend (192.168.1.1) lives on the modem's own LAN, not on any
      # homelab VLAN. The FORWARD default is `accept` so a rule is required
      # to *restrict* access — only trusted-admin hosts (the laptop) reach
      # the modem's web UI; every other homelab host is dropped. The Comtrend
      # is a consumer device with a default-password admin UI; default-deny
      # to anything but the admin laptop.
      - chain: forward
        src-address-list: trusted-admin
        dst-address: "{{ comtrend_modem.modem_mgmt_ip }}"
        protocol: tcp
        dst-port: 80,443
        action: accept
        comment: "HD-302: trusted-admin -> Comtrend modem web UI (PPPoE redial admin path)"
      - chain: forward
        dst-address: "{{ comtrend_modem.modem_subnet }}"
        action: drop
        comment: "HD-302: default-deny all other homelab hosts -> Comtrend subnet"


# -------------------------------------------------------------------------
# Firewall - INPUT Chain (router management planes)  (HD-78 / KOPS-003/009)
# -------------------------------------------------------------------------
# The default RouterOS input policy is `accept`: without explicit input rules the
# router's own management services (API 8728, WinBox 8291, SSH 22, www/www-ssl
# 80/443) listen on ALL interfaces, including WAN and every VLAN. This section
# restricts those services to the Management VLAN (99) plus `trusted-admin`
# hosts (nas/oldsrv/ha-vip — the Home servers that manage the router per
# network-vlans.md), and drops them from every other source. Essential control-
# plane input (DHCP, VRRP, WireGuard) is left at the RouterOS default so nothing
# else breaks; only the sensitive management ports are gated here.
# Order matters: top-down, first match wins — established/related first.

- name: Ensure router INPUT-chain firewall rules (idempotent, ordered) (HD-78/KOPS-003)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip firewall filter
    handle_absent_entries: remove
    handle_entries_content: remove_as_much_as_possible
    ensure_order: true
    restrict:
      - field: chain
        values: [input]
    data:
      - chain: input
        connection-state: established,related
        action: accept
        comment: "Allow established/related input"
      - chain: input
        src-address-list: internal_lan
        protocol: udp
        dst-port: 67,68
        action: accept
        comment: "Allow DHCP input from LAN"
      - chain: input
        src-address: "{{ vlan_subnets[99] }}"
        dst-port: 22,8728,8729,8291,80,443
        action: accept
        comment: "Allow mgmt services from Management VLAN"
      - chain: input
        src-address-list: trusted-admin
        dst-port: 22,8728,8729,8291,80,443
        action: accept
        comment: "Allow mgmt services from trusted-admin"
      - chain: input
        dst-port: 22,8728,8729,8291,80,443
        action: drop
        comment: "Drop mgmt services from non-mgmt sources (HD-78)"
      # --- SNMP (HD-53): RO poller from Mgmt VLAN only ---
      - chain: input
        src-address: "{{ vlan_subnets[99] }}"
        protocol: udp
        dst-port: 161
        action: accept
        comment: "Allow SNMP from Management VLAN (HD-53)"
      - chain: input
        protocol: udp
        dst-port: 161
        action: drop
        comment: "Drop SNMP from non-mgmt sources (HD-53)"
      # --- Router resolver as DNS tertiary (HD-182, network-dns.md) ---
      # DHCP hands out primary → secondary → router; the input rule lets LAN
      # sources query the router's own /ip dns when both resolvers are down
      # (unfiltered last resort — accepted tradeoff documented in network-dns.md).
      - chain: input
        src-address-list: internal_lan
        protocol: udp,tcp
        dst-port: 53
        action: accept
        comment: "Allow DNS input from LAN — router resolver tertiary (HD-182)"

# The router /ip dns only answers queries with allow-remote-requests=yes
# (RouterOS default: no) — required for the tertiary above to work.
# Requires community.routeros >= 2.17 (settings-path support in api_modify);
# fails loud at deploy on older collections rather than silently skipping.
- name: Allow the router resolver to answer LAN queries (DNS tertiary, HD-182)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip dns
    data:
      - allow-remote-requests: yes


# Note: WireGuard S2S (Phase 10) and VRRP keepalived advertise input are left at
# the RouterOS default (accept) so the deferred tunnel / HA links keep working.
# If a full default-deny input policy is ever wanted, add accept rules for the
# control plane first, then a final `chain: input` drop-all rule.

# -------------------------------------------------------------------------
# CAPsMAN Configuration
# -------------------------------------------------------------------------
# TODO: CAPsMAN SSIDs require WPA2 passphrases from 1Password.
# Required secret items: wifi_login or per-SSID password items.

- name: Document CAPsMAN pending secrets
  debug:
    msg: |
      CAPsMAN SSIDs require WPA2 passphrases from 1Password.
      Required secret items: wifi_login (or per-SSID password items).
      Once available, uncomment and configure CAPsMAN in this role.

# -------------------------------------------------------------------------
# WireGuard S2S Configuration (wg-s2s — home router ↔ VPS, HD-03 / HD-135)
# -------------------------------------------------------------------------
# The VPS side is configured by the `wireguard` role (systemd-networkd). This role
# configures the home RB4011 side via api_modify (per HD-137: the declarative
# `community.routeros_interface_wireguard*` modules do not exist, so use api_modify
# path-based calls). Private key = shared `wg_password` (1Password) for the S2S family.

- name: Assert the VPS WG public key is available (fail-closed, HD-65/HD-91)
  assert:
    that:
      - "(wireguard_s2s_vps.vps_public_key | default('')) | length > 0"
    fail_msg: >-
      `wireguard_s2s_vps.vps_public_key` must be set (derived from the VPS wireguard
      private key) before the router can peer with the VPS — never deploy with a blank peer.
  tags: router_wireguard

- name: Create WireGuard interface (wg-s2s)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface wireguard
    handle_absent_entries: ignore
    data:
      - name: wg-s2s
        private-key: "{{ lookup('community.general.onepassword', 'wg_password', field='password', vault=op_vault) }}"
        listen-port: "{{ wireguard_s2s_vps.port }}"
  tags: router_wireguard

- name: Assign WireGuard /ip address to the wg-s2s interface
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip address
    handle_absent_entries: ignore
    data:
      - address: "{{ wireguard_s2s_vps.local_ip }}"
        interface: wg-s2s
        disabled: no
  tags: router_wireguard

- name: Configure WireGuard peer (VPS) on wg-s2s
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface wireguard peers
    handle_absent_entries: ignore
    data:
      - interface: wg-s2s
        public-key: "{{ wireguard_s2s_vps.vps_public_key }}"
        allowed-address: "{{ wireguard_s2s_vps.remote_ip }},{{ wireguard_s2s_vps.allowed_ips | join(',') }}"
        endpoint-address: "{{ wireguard_s2s_vps.remote_endpoint }}"
        endpoint-port: "{{ wireguard_s2s_vps.port }}"
        comment: vps-s2s
        disabled: no
  tags: router_wireguard

- name: Route wg-vps-services (VPS-resident services) via the VPS S2S peer
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip route
    handle_absent_entries: ignore
    data:
      - dst-address: "{{ (network_ranges | selectattr('name', 'equalto', 'wg-vps-services') | first).cidr }}"
        gateway: "{{ wireguard_s2s_vps.remote_ip.split('/')[0] }}"
        comment: wg-vps-services-via-vps
        disabled: no
  tags: router_wireguard
# -------------------------------------------------------------------------
# Management Services — LOCKDOWN (HD-301 parity with rb4011_initial.rsc.j2)
# -------------------------------------------------------------------------
# The bootstrap template already scopes EVERY service to {{ mgmt.subnet }} via
# `available-from=` and disables telnet/ftp/www/api-ssl/reverse-proxy (HD-301).
# This role block re-declares the same state in the steady state so a converge
# can never silently drift a service open (published api_modify data below is the
# FULL expected set, matching the template's belt-and-braces rows):
#    api / www-ssl / ssh / winbox    = enabled, bound to the mgmt subnet
#    telnet / ftp / www / api-ssl / reverse-proxy = disabled, still bound
# `available-from=` is a CIDR (RouterOS 7); `interface=` is the ROS6 form and is
# rejected with "bad parameter interface" (live-validated 2026-08-31, HD-301).
- name: Configure management services (lockdown — HD-301 parity)
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: ip service
    # ip service is a SETTINGS-like path (no add/remove of arbitrary rows) —
    # handle_absent_entries defaults to ignore, matching the per-row data below.
    data:
      - name: telnet
        disabled: yes
        port: 23
        available-from: "{{ vlan_subnets[99] }}"
      - name: ftp
        disabled: yes
        port: 21
        available-from: "{{ vlan_subnets[99] }}"
      - name: www
        disabled: yes
        port: 80
        available-from: "{{ vlan_subnets[99] }}"
      - name: api-ssl
        disabled: yes
        port: 8729
        available-from: "{{ vlan_subnets[99] }}"
        certificate: none
      - name: reverse-proxy
        disabled: yes
        port: 443
        available-from: "{{ vlan_subnets[99] }}"
        certificate: none
      - name: api
        disabled: no
        port: 8728
        available-from: "{{ vlan_subnets[99] }}"
      - name: www-ssl
        disabled: no
        port: 443
        available-from: "{{ vlan_subnets[99] }}"
        certificate: none
      - name: ssh
        disabled: no
        port: 22
        available-from: "{{ vlan_subnets[99] }}"
      - name: winbox
        disabled: no
        port: 8291
        available-from: "{{ vlan_subnets[99] }}"



# -------------------------------------------------------------------------
# VLAN 99 on trunk port to switch
# -------------------------------------------------------------------------
- name: Configure VLAN 99 on trunk port
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge vlan
    handle_absent_entries: ignore
    data:
      - bridge: bridge-lan
        vlan-ids: 99
        tagged: bridge-lan,sfp-sfpplus1
        comment: "Management VLAN on trunk"


# -------------------------------------------------------------------------
# Enable VLAN filtering on bridge
# -------------------------------------------------------------------------
- name: Enable VLAN filtering on bridge
  community.routeros.api_modify:
    hostname: "{{ routeros_api_host }}"
    username: "{{ routeros_api_user }}"
    password: "{{ routeros_api_password }}"
    tls: "{{ routeros_tls }}"
    validate_certs: false
    port: "{{ routeros_api_port }}"
    path: interface bridge
    handle_absent_entries: ignore
    data:
      - name: bridge-lan
        vlan-filtering: yes
        protocol-mode: none
        comment: "Bridge with VLAN filtering enabled"

# -------------------------------------------------------------------------
# CAPsMAN steady-state WiFi (guarded scaffold — HD-228/HD-03/HD-229)
# -------------------------------------------------------------------------
# Included ONLY when routeros_capsman_enabled: true (group_vars/router.yml).
# Flip AFTER the five wifi-kogler* 1Password items exist AND during the live
# cutover-prep session (implementation steps in capsman.yml header).
- name: Include CAPsMAN WiFi management (guarded)
  ansible.builtin.include_tasks: capsman.yml
  when: routeros_capsman_enabled | default(false) | bool
