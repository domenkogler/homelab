# -------------------------------------------------------------------------
# Management Services
# -------------------------------------------------------------------------
- name: Enable REST API service
  community.routeros_ip_service:
    name: api
    disabled: no
    api_user: admin
    api_password: "{{ routeros_api_password }}"

- name: Enable WinBox/Web service
  community.routeros_ip_service:
    name: www-ssl
    disabled: no
    api_user: admin
    api_password: "{{ routeros_api_password }}"

# -------------------------------------------------------------------------
# VLAN 99 on trunk port to switch
# -------------------------------------------------------------------------
- name: Configure VLAN 99 on trunk port
  community.routeros_interface_bridge_vlan:
    bridge: bridge-lan
    vlan_ids: 99
    tagged: bridge-lan,sfp-sfpplus1
    comment: "Management VLAN on trunk"
    api_user: admin
    api_password: "{{ routeros_api_password }}"

# -------------------------------------------------------------------------
# Enable VLAN filtering on bridge
# -------------------------------------------------------------------------
- name: Enable VLAN filtering on bridge
  community.routeros_interface_bridge:
    name: bridge-lan
    vlan_filtering: yes
    protocol_mode: none
    comment: "Bridge with VLAN filtering enabled"
    api_user: admin
    api_password: "{{ routeros_api_password }}"