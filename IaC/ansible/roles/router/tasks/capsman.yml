---
# CAPsMAN steady-state WiFi — scaffold + include guard.
#
# Steady-state WiFi ships as a rendered .rsc (IaC/router/templates/
# capsman_steady-state.rsc.j2), not as api_modify: the rsc replaces that path
# entirely, so do not add api_modify CAPsMAN tasks here.
# → docs/network-ops.md §CAPsMAN steady-state contract (`wifi-qcom-ac`)
#
# Flavor: MODERN `wifi-qcom-ac` fleet-wide. Flavors cannot mix across one managed
# fleet, so no MIPSBE device (hAP ac classic, wAP ac T-variant) may stay in the
# fleet and replacement AP hardware must be wifi-qcom-ac-capable.
#
# Manager = RB4011 (`wifi-qcom-ac`; radios not required), APs join as CAPs via
# `/interface wifi cap` (ap_initial.rsc.j2). Per-SSID VLAN tagging lives in the
# wifi datapath/config objects, not in legacy `/interface/wireless` lists.
#
# GATE: included only when routeros_capsman_enabled is true (group_vars/router.yml).
# The lookup()s fail loud if a wifi-kogler* 1Password item is missing — create the
# five items (docs/deployment-secrets.md) first, then flip the flag.

- name: CAPsMAN tasks are implemented against the live manager before enabling
  ansible.builtin.assert:
    that:
      - routeros_capsman_implemented | bool
    fail_msg: >-
      routeros_capsman_enabled=true but the CAPsMAN api_modify tasks are not
      implemented yet — see the header of roles/router/tasks/capsman.yml and
      implement them during the cutover-prep live session (HD-229).
