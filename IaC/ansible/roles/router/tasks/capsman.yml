---
# CAPsMAN steady-state WiFi — IMPLEMENTATION PLAN + GUARD (HD-228 / HD-03 tail).
#
# FLAVOR RE-DECIDED 2026-08-24 (HD-232): MODERN `wifi-qcom-ac` CAPsMAN for the
# whole fleet — SUPERSEDES the 2026-08-23 LEGACY pin below (kept for history).
# Trigger: garage wAP ac declared DEAD 2026-08-24 (hardware fault; diagnosis in
# docs/network-migration-inventory.md) — resolves the legacy pin's condition ②.
# Conditions attached to this flavor:
#   ① dnevna swap executes per owner plan 2026-08-23 (spare hAP ac² takes the
#     dnevna slot, classic MIPSBE unit retires) — NO MIPSBE device may remain
#     in the managed fleet;
#   ② garage replacement hardware must be wifi-qcom-ac-capable.
#
# --- HISTORY: FLAVOR DECIDED 2026-08-23: LEGACY `wireless` CAPsMAN for the whole fleet.
# Reason: flavors cannot mix across a managed fleet, and two of four APs are
# permanently incompatible with the new wifi-qcom-ac package per MikroTik's
# official compatibility table (manual.mikrotik.com/docs/wireless/wifi):
# hAP ac classic (RB962…, MIPSBE CPU) and wAP ac T-variant fall under "all other
# devices with a MIPSBE CPU"; only hAP ac² units would qualify. Live-probed
# 2026-08-23: AP-dnevna carries no wifi-qcom-ac package at all.
# OWNER PLAN same day: retire the hAP ac classic (spare hAP ac² takes the
# dnevna slot). New flavor becomes revisitable when additionally the garage
# wAP ac confirms RBwAPG-5HacD2HnD (or gets replaced).
#
# STATUS: SCAFFOLD ONLY + DELIVERY RE-DECIDED 2026-08-24 (task 8): steady-state WiFi is NOT
# ansible api_modify — it ships as a RENDERED .rsc uploaded at the cutover
# (IaC/router/templates/capsman_steady-state.rsc.j2, modern wifi-qcom-ac), same pattern as the
# bootstrap scripts (render-routeros.yml). This file's api_modify blocks are NOT to be
# implemented; the include-gate below stays only as a documented assert until the flag flips
# (the rsc replaces the api_modify path entirely).
#
# DESIGN (agreed HD-228 session, DELIVERY RE-DECIDED task 8):
#   - Manager = RB4011 (HD-232: runs `wifi-qcom-ac` pkg as manager — radios not
#     required); APs join as CAPs via `/interface wifi cap` — ap_initial.rsc.j2
#     ships MODERN `/interface wifi cap` syntax; validate-live noted at cutover.
#   - Steady-state SSIDs ship as `capsman_steady-state.rsc.j2` (secrets from the
#     five wifi-kogler* 1Password items at render; datapath VLAN tagging under
#     the modern wifi config objects per HD-232). The legacy per-SSID plans below
#     (security-profiles/configuration/access-list/provisioning) are KEPT as
#     history + the field-set reference the rsc mirrors.
#   - Per-SSID objects, all IaC-owned via api_modify (paths under /interface/wireless):
#       1. security-profiles   — one per SSID; mode=dynamic-keys,
#                                authentication-types=wpa2-psk,
#                                wpa2-pre-shared-key=lookup(1Password item).
#                                Items: wifi-kogler*_password (see
#                                docs/deployment-secrets.md Master Secret List).
#       2. configuration       — cfg-* names per the network-vlans.md mapping
#                                table (cfg-kogler, cfg-kogler-iot,
#                                cfg-kogler-iot-wan, cfg-kogler-guest,
#                                cfg-kogler-kids); ssid + security-profile;
#                                2.4 GHz-friendly bands for IoT configs
#                                (QCA4002 + Gen1 Shelly chips, HD-228).
#       3. access-list         — PER-SSID VLAN TAGGING: entries matching each
#                                cfg's SSID with vlan-mode=use-tag +
#                                vlan-id from group_vars map (this is the
#                                legacy-CAPsMAN mechanism when
#                                local-forwarding=no tunnels traffic to the
#                                manager). Ordered; keep default-deny tail.
#                                HD-232 DELTA: under modern wifi-qcom-ac VLAN
#                                tagging moves into the configuration object
#                                (datapath VLAN tagging) instead of access-list
#                                — exact field set validated LIVE at
#                                implementation, nothing shipped speculatively.
#       4. provisioning        — minimal rule(s): action=create-dynamic-enabled,
#                                master-configuration=cfg-kogler,
#                                slave-configurations=<the other four>; refine
#                                per-radio rules only if band steering needs it.
#   - SSID/VLAN/item SSOT = group_vars/router.yml → routeros_capsman_ssids.
#
# GATE: included from main.yml ONLY when routeros_capsman_enabled is true
# (group_vars/router.yml). The lookup()s fail loud if any 1Password item is
# missing — create the five items FIRST (host-side `op item create`, values
# owner-chosen), then flip the flag.

- name: CAPsMAN tasks are implemented against the live manager before enabling
  ansible.builtin.assert:
    that:
      - routeros_capsman_implemented | bool
    fail_msg: >-
      routeros_capsman_enabled=true but the CAPsMAN api_modify tasks are not
      implemented yet — see the header of roles/router/tasks/capsman.yml and
      implement them during the cutover-prep live session (HD-229).
