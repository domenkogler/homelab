---
# router role defaults

# Connection settings
routeros_api_port: 8728
routeros_connection_method: api  # api or ssh

# API host + credentials for community.routeros: the RouterOS API over the
# Management VLAN (host = mgmt IP), as `admin` with the mikrotik-admin_login
# 1Password secret. The api_* modules take hostname/username/password/port.
routeros_api_host: "{{ ansible_host | default(router99_ip) }}"
routeros_api_user: admin
routeros_tls: false

# FAIL-LOUD guard: the real value lives in group_vars/router.yml. Unset here makes
# the identity assert task fail rather than compare against a blank identity.
routeros_expected_identity: ""

# VLAN IDs from SSOT
mgmt_vlan_id: 99

# Helper variables computed from group_vars
router99_ip: "{{ (network_static_hosts | selectattr('vlan', '==', 99) | selectattr('name', '==', 'router') | list | first).ip }}"
router99_cidr: 24

# SSOT-derived subnet lookup keyed by VLAN id (from group_vars/all/ network_vlans)
# Used by firewall rules to avoid hardcoding IP/subnet literals.
vlan_subnets: "{{ dict(network_vlans | map(attribute='id') | zip(network_vlans | map(attribute='subnet'))) }}"