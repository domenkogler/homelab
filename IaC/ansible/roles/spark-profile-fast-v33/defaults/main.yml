---
# role: spark-profile-fast-v33 — `fast`'s checkpoint on the v0.33 engine build.
#
# WHY A ROLE AND NOT A FLAG ON ANOTHER LINEAGE (the spark-profile-fast8 argument, and it applies
# verbatim): this is a THIRD artifact with its own (pin, tag, commit) triple. A lineage that shares
# another lineage's pin is inspected against, skipped by, and asserted against the wrong image — all
# three of which report success. The shared machinery lives in
# roles/spark-ultrafast-build/tasks/{checkout_pinned,build_lineage}.yml; this role supplies the data
# and the patch plan that are specific to the v0.33 layout.
#
# WHAT IT BUILDS: the AR AutoRound W4A16 hybrid checkpoint + FP8 PLE mmap table that the CERTIFIED
# `fast` serves, on a vLLM built FROM spark_vllm_v33_base_image, carrying (a) the day-0 UltraFast
# patch stack re-anchored, (b) the blazux recipe's PLE-mmap install hook, which already targets the
# qwen4_exp class layout the day-0 overlay cannot hook, and (c) blazux's loader patchers, the MTP
# prefilter among them. It changes no weights and no client contract
# (fast_v33_draft.md R1), so the two arms that name it are a control and a capacity arm, not a new
# model.
#
# WHAT IS OPT-IN HERE: everything that touches the box. playbooks/spark.yml pulls this role only when
# `spark_profile_fast_v33_build` is true (group_vars/spark.yml, default false).

# The lineage as data. Every field is this lineage's own — deliberately not a copy of another
# lineage's dict.
spark_profile_fast_v33_lineage:
  key: spark-profile-fast-v33
  pin: "{{ spark_vllm_fast_v33_image }}"          # "" is legal and IS the gate (CONVENTIONS §7)
  pin_var: spark_vllm_fast_v33_image
  tag: "{{ spark_vllm_fast_v33_tag }}"            # its own repository; never one of the reserved names below
  # Every other lineage's names. Writing one would untag an image another arm — or the `fast`
  # rollback — still needs, and an untagged image is a pruneable image.
  reserved_tags: "{{ spark_vllm_ultrafast_live_tags + [spark_vllm_ultrafast_v32_tag, spark_vllm_blazux_v33_tag] }}"
  # The day-0 recipe supplies the patch SOURCES (its patchers, its md5 gates); the PORT onto the v33
  # base is this repository's own patch plan, which is why the checkout stays byte-for-byte upstream.
  commit: "{{ spark_ultrafast_upstream_commit }}"
  src_dir: "{{ spark_ultrafast_src_dir }}"
  chdir: "{{ spark_profile_fast_v33_build_dir }}"
  plan_cmd: ""
  # `--pull=false` and `--network none`: the base is already on the box (the role asserts that fact
  # before building) and nothing in a re-anchor of pinned sources may reach the network mid-build.
  build_cmd: >-
    docker build --network none --pull=false -f Dockerfile.v33
    --build-arg BASE={{ spark_vllm_v33_base_image }}
    -t {{ spark_vllm_fast_v33_tag }} .
  build_drafter: false    # the drafter directory is the checkpoint's own artifact; converting it here
                          # would rewrite what the live `fast` boots, for no image-level gain

# ---- The patch plan — filled from the census against the base at its pin digest ----
# Every `expect` is a read against spark_vllm_v33_base_image at its pin digest — the
# anchor census (/tmp/fastv33-census-v33base.md, tool: spark/reports/hd1206-v32-port-20261026/
# anchor_census.py) plus a throwaway-container dry-run of THIS plan (port_v33.py apply,
# writable layer discarded): 23/23 anchors match the base, 23/23 edits leave their
# marker, and every touched or installed module byte-compiles. Nobody widened a count.
#
# The census's 12 countable day-0 patchers, by disposition:
#   LAND verbatim (4)      patch_step_profile, patch_measure_draft_mass,
#                          patch_in_proj_ba_gemv (+ patch_r7_logger, by order), and the
#                          short-conv post-state — three apply, one is guard-only.
#   RE-ANCHORED here (5)   patch_never_evict, patch_hit_debug, patch_mamba_align_split,
#                          patch_verify_topk_pivot, patch_block_drop — each pair carries
#                          the v32 re-anchoring (roles/spark-profile-fast8/files/port_v32.py,
#                          the shape this plan copies) plus the v0.33 delta, site by site.
#   PARKED (2), in the census's own words, NOT entries — no honest (pattern, expect) exists:
#     patch_ple_rendezvous  its target is the day-0 hook's ids-D2H line; this lineage
#                           carries the blazux hook instead, whose graph-aware custom-op
#                           form has no counterpart to re-anchor (census: blind spot,
#                           not a verdict). Re-anchoring it would PATCH a module this
#                           build no longer installs.
#     patch_moe_name_index  native upstream since v0.31; the blazux Dockerfile does not
#                           run it at this pin either (census blazux row).
#   Not a census patcher: the v32 mamba-guard porter runs verbatim (entry mamba_guard —
#   dry-run: 13/13 anchors at the v33 base), and the two fla seds, the fp8-hybrid append,
#   lm_head, draft-vocab and the hook rows mirror Dockerfile.v32's steps 1–6 and 11.
#
# Carried per R14 (see ple_graph_hostfunc): the AutoRound host func, pinned as
# spark_autoround_recipe_commit. Per §4 NO load_format flip is expressed anywhere in this
# plan, and nothing here pins the 48.67 GiB table — the wiring's only pin_memory use is
# the ~44 MB id/row staging, not the table.
spark_profile_fast_v33_patch_plan:
  # spark_fla_shmem — day-0 verbatim (census: sed source still present at this base).
  - name: "spark_fla_shmem"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/third_party/flash_linear_attention/ops/utils.py"
    pattern: "DEFAULT = 102400"
    expect: 1
    marker: "spark-fla-shmem"
    evidence: |-
      Dockerfile.v32 step 2; third_party/flash_linear_attention/ops/utils.py:183 at v0.33.0 (census: sed source still present)

    cmd: |-
      set -e
      SP="$(dirname "$VLLM_ROOT")"
      V="$VLLM_ROOT"
      F="$V/third_party/flash_linear_attention/ops/utils.py"
      test "$(grep -c '^    DEFAULT = 102400' "$F")" -eq 1
      sed -i 's|^    DEFAULT = 102400.*$|    DEFAULT = 101376  # spark-fla-shmem: GB10 99KiB = ADA, big GDN tiles fit|' "$F"
      grep -q spark-fla-shmem "$F"
      ! grep -q 'DEFAULT = 102400' "$F"

  # spark_fla_warps — day-0 verbatim (census: sed source still present at this base).
  - name: "spark_fla_warps"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/third_party/flash_linear_attention/ops/chunk_delta_h.py"
    pattern: "for num_warps in [2, 4]"
    expect: 1
    marker: "spark-fla-warps"
    evidence: |-
      Dockerfile.v32 step 3; chunk_delta_h.py:37 at v0.33.0 (census: sed source still present)

    cmd: |-
      set -e
      SP="$(dirname "$VLLM_ROOT")"
      V="$VLLM_ROOT"
      F="$V/third_party/flash_linear_attention/ops/chunk_delta_h.py"
      test "$(grep -cF 'for num_warps in [2, 4]' "$F")" -eq 1
      sed -i 's|for num_warps in \[2, 4\]|for num_warps in [2]  # spark-fla-warps: fla#953 Blackwell tl.dot race|' "$F"
      grep -q spark-fla-warps "$F"
      ! grep -qF 'for num_warps in [2, 4]' "$F"

  # fp8_hybrid_dispatch — day-0 verbatim; constitutive on the AR-hybrid checkpoint (Dockerfile.v32 step 4 shape).
  - name: "fp8_hybrid_dispatch"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/quantization/auto_gptq.py"
    pattern: "class AutoGPTQLinearMethod"
    expect: 1
    marker: "_fp8_hybrid_apply()"
    evidence: |-
      Dockerfile.v32 step 4; class AutoGPTQLinearMethod present at v0.33.0 (constitutive on the AR-hybrid checkpoint)

    cmd: |-
      set -e
      SP="$(dirname "$VLLM_ROOT")"
      V="$VLLM_ROOT"
      G="$V/model_executor/layers/quantization/auto_gptq.py"
      test -f "$G"
      cp /port/day0/recipe/build/image/src/vllm_fp8_hybrid.py "$SP/vllm_fp8_hybrid.py"
      printf '\n\n# --- qwen38-flash-dgx: int4+fp8 hybrid dispatch (VLLM_FP8_HYBRID=1) ---\nfrom vllm_fp8_hybrid import apply as _fp8_hybrid_apply\n_fp8_hybrid_apply()\n' >> "$G"
      grep -qF '_fp8_hybrid_apply()' "$G"
      python3 -c 'import ast,os; ast.parse(open(os.environ["VLLM_FILE"]).read())' </dev/null

  # fp8_hybrid_drafter_online — the vendored hook's DRAFTER branch, re-anchored onto v0.33's online
  # MoE API. It must sit AFTER fp8_hybrid_dispatch: it rewrites the file that entry installs, and
  # its anchor is read in the base's own auto_gptq.py (the vendored file is not in the base, so it
  # cannot carry an `expect`). The H-side marker is the proof the branch was rewritten, the
  # auto_gptq.py marker the proof this entry ran at all.
  - name: "fp8_hybrid_drafter_online"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/quantization/auto_gptq.py"
    pattern: "def get_moe_quant_method("
    expect: 1
    marker: "spark-v33: the drafter arm delegates"
    evidence: |-
      The rc2 bf16 boot got past the QSA/indexer failures and died in the MTP drafter:
      `TypeError: Fp8PerTensorOnlineMoEMethod.__init__() got an unexpected keyword argument
      'layer'` at vllm_fp8_hybrid.py:234 (`_maybe_drafter_moe_fp8`, named from :161). Read against
      the base at its pin digest: `Fp8PerTensorOnlineMoEMethod(*, moe: FusedMoEConfig)` and
      `Fp8PerBlockOnlineMoEMethod(*, moe: FusedMoEConfig)`; `_Fp8OnlineMoEBase.__init__` is
      `(*, weight_block_size, moe, weight_key=None, activation_key=None, allow_vllm_cutlass=False)`,
      and vLLM builds these itself as `quant_method_cls(moe=layer.moe_config)
      (quantization/online/base.py:402)`, the class coming from `_ONLINE_MOE_METHODS` by the
      QuantSpec's weight QuantKey (`resolve_quant_method_cls`, same file :266). `layer.moe_config`
      is the attribute the call wants: fused_moe/routed_experts.py:117 assigns it and :164 is where
      `_get_quant_method` runs with the same partially-built layer.
      DECISION: delegate the drafter branch to `OnlineQuantizationConfig.get_quant_method` with a
      `QuantizationConfigArgs(moe="fp8_per_tensor" | "fp8_per_block")` shorthand, rather than
      patching the two `layer=` call sites. Reason, read from the code: that method IS the native
      call (resolve from vLLM's own table, then construct with `moe=layer.moe_config`), so the class
      choice and the constructor call both stay vLLM's and the next move of that private constructor
      cannot reach our file — whereas `layer=` → `moe=layer.moe_config` would re-pin both. The
      model-level `resolve_quant_method` (quantization/base_config.py:295) is NOT the seam: its
      online config is a model/CLI arg that matches every layer of the kind, and this checkpoint's
      target experts ARE quantized, so it would take the `checkpoint_is_quantized` ->
      `set_requantization_source` route over the target's int4 weights — a weighed numerics change
      on the control arm (fast_v33_draft.md R1). Nothing here touches the target's experts: the
      prefix regex and the `UnquantizedFusedMoEMethod` guard still gate the branch.

    cmd: |-
      set -e
      SP="$(dirname "$VLLM_ROOT")"
      V="$VLLM_ROOT"
      G="$V/model_executor/layers/quantization/auto_gptq.py"
      H="$SP/vllm_fp8_hybrid.py"
      test -f "$G"
      test -f "$H"
      test "$(grep -c -F 'def _maybe_drafter_moe_fp8(' "$H")" -eq 1
      test "$(grep -c -F 'Fp8PerTensorOnlineMoEMethod(layer=layer)' "$H")" -eq 1
      test "$(grep -c -F 'Fp8PerBlockOnlineMoEMethod(layer=layer)' "$H")" -eq 1
      python3 - <<'PY'
      import os
      h = os.path.join(os.path.dirname(os.environ["VLLM_ROOT"]), "vllm_fp8_hybrid.py")
      src = open(h).read()
      old = "\n".join([
          '    if mode in ("block", "blockwise"):',
          '        from vllm.model_executor.layers.quantization.online.fp8 import (',
          '            Fp8PerBlockOnlineMoEMethod,',
          '        )',
          '',
          '        method = Fp8PerBlockOnlineMoEMethod(layer=layer)',
          '    else:',
          '        from vllm.model_executor.layers.quantization.online.fp8 import (',
          '            Fp8PerTensorOnlineMoEMethod,',
          '        )',
          '',
          '        method = Fp8PerTensorOnlineMoEMethod(layer=layer)',
      ])
      new = "\n".join([
          "    # spark-v33: the drafter arm delegates to vLLM's own online-quantization path",
          "    # instead of naming a method class. v0.33 moved these constructors from",
          "    # `(*, layer: torch.nn.Module)` to `(*, moe: FusedMoEConfig)` and builds them",
          "    # itself as `quant_method_cls(moe=layer.moe_config)`, the class chosen from its",
          "    # own _ONLINE_MOE_METHODS table (model_executor/layers/quantization/online/",
          "    # base.py:402). Asking OnlineQuantizationConfig for the method keeps the class",
          "    # choice AND the constructor call on vLLM's side, so the next move of that",
          "    # private constructor cannot reach this file; the day-0 spelling pinned both,",
          "    # and died `TypeError: Fp8PerTensorOnlineMoEMethod.__init__() got an unexpected",
          "    # keyword argument 'layer'` in the MTP drafter of the rc2 boot.",
          '    from vllm.config.quantization import QuantizationConfigArgs',
          '    from vllm.model_executor.layers.quantization.online.base import (',
          '        OnlineQuantizationConfig,',
          '    )',
          '',
          '    _moe_shorthand = (',
          '        "fp8_per_block" if mode in ("block", "blockwise") else "fp8_per_tensor"',
          '    )',
          '    online_cfg = OnlineQuantizationConfig(QuantizationConfigArgs(moe=_moe_shorthand))',
          '    method = online_cfg.get_quant_method(layer, prefix)',
          '    assert method is not None, (',
          '        "spark-v33: vLLM\'s online quantization declined the drafter experts at "',
          '        f"{prefix} while {_DRAFTER_ENV}={mode}; the arm cannot do what it says"',
          '    )',
      ])
      assert src.count(old) == 1, src.count(old)
      src = src.replace(old, new)
      open(h, "w").write(src)
      import ast; ast.parse(src)
      PY
      grep -qF 'spark-v33: the drafter arm delegates' "$H"
      printf '\n# spark-v33: the drafter arm delegates to vLLM online quantization -- v0.33 takes\n# `moe: FusedMoEConfig`, so vllm_fp8_hybrid.py asks OnlineQuantizationConfig for the\n# method class instead of naming it.\n' >> "$G"
      python3 -c 'import ast,os; ast.parse(open(os.environ["VLLM_FILE"]).read())' </dev/null

  # qsa_indexer_reachability — the QSA layer must receive the config that knows about the fp8 hybrid.
  # Two facts make this a correction rather than a preference: `without_modelopt_fp4()` only unwraps
  # ModelOpt, and this checkpoint is AutoGPTQ, so the call is a pass-through; but passing the object it
  # returns would hand the layer a config whose `_is_fp8_layer` the fp8-hybrid hook never installed,
  # i.e. the one question __init__ asks about this checkpoint could not be answered. Naming the
  # checkpoint's own quant_config is the same object for every other family, and for AutoGPTQ it is the
  # hooked class. Sits AFTER fp8_hybrid_dispatch because the marker of that entry is what makes the
  # predicate meaningful.
  - name: "qsa_indexer_reachability"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/nvidia/qsa.py"
    pattern: "self.qkv_proj = QKVParallelLinear("
    expect: 1
    marker: "spark-v33: this family resolves to AutoGPTQ"
    evidence: |-
      The first fast-v33-bf16 boot died in resolve_quant_method before any weight was
      read; the layer had been constructed with the pass-through object. Read against the base at its
      pin digest: one `self.qkv_proj = QKVParallelLinear(` and one
      `quant_config=model.without_modelopt_fp4(quant_config),` in the whole file, so this is the only
      site that could carry it. The `quant_config=quant_config,` it writes already answers 3 times in
      the base, which is why the marker is the comment and not the code.

    cmd: |-
      set -e
      V="$VLLM_ROOT"
      Q="$V/models/qwen4_exp/nvidia/qsa.py"
      test -f "$Q"
      test "$(grep -cF 'self.qkv_proj = QKVParallelLinear(' "$Q")" -eq 1
      test "$(grep -cF 'quant_config=model.without_modelopt_fp4(quant_config),' "$Q")" -eq 1
      python3 - <<'PY'
      import os
      p = os.path.join(os.environ["VLLM_ROOT"], "models/qwen4_exp/nvidia/qsa.py")
      src = open(p).read()
      old = "            quant_config=model.without_modelopt_fp4(quant_config),"
      new = (
          "            # spark-v33: this family resolves to AutoGPTQ, not ModelOpt, so\n"
          "            # without_modelopt_fp4() only returns its argument; naming the checkpoint's own\n"
          "            # quant_config keeps the fp8-hybrid hook reachable from this layer, which is the\n"
          "            # object __init__ asks for the fusion decision below.\n"
          "            quant_config=quant_config,"
      )
      assert src.count(old) == 1, src.count(old)
      src = src.replace(old, new)
      open(p, "w").write(src)
      import ast; ast.parse(src)
      PY
      grep -qF 'spark-v33: this family resolves to AutoGPTQ' "$Q"
      python3 -c 'import ast,os; ast.parse(open(os.environ["VLLM_FILE"]).read())' </dev/null

  # qsa_no_indexer_fusion — the boot fix. v0.33 fuses `indexer.index_qk_proj` into `qkv_proj`, whose
  # packed mapping then declares four shards; the checkpoint stores q/k/v as blockwise FP8 and the
  # indexer in BF16, so the config's all-shards-are-FP8 test answers False for all 12 QSA layers and
  # AutoGPTQConfig refuses the layer outright (ValueError, `gptq_utils.py:160`). qsa.py's own forward()
  # keeps an unfused branch, so declining the fusion is a supported shape and costs no weight: q/k/v
  # stay FP8, the indexer keeps its checkpoint precision in its own linear. This is the no-numerics
  # route (the alternative, quantising the indexer to FP8 at load, would put a lossy change on the arm
  # whose whole job is to be `fast`'s control — fast_v33_draft.md R1).
  - name: "qsa_no_indexer_fusion"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/nvidia/qsa.py"
    pattern: "self.fuse_indexer_projection = vllm_config.lora_config is None"
    expect: 1
    marker: "spark-v33: an fp8-hybrid checkpoint must NOT fuse the indexer"
    evidence: |-
      The predicate is the config's own `_is_fp8_layer`, which the region's or-chain above this line
      cannot see, so the guard is a getattr on quant_config (False for every non-hybrid config, i.e.
      today's behaviour is preserved where the hook is absent). Anchors read against the base at its
      pin digest: the fused mapping is `["q_proj", "k_proj", "v_proj", "indexer.index_qk_proj"]`
      and every one of the 12 QSA layers is FP8 for q/k/v and BF16 for the indexer.

    cmd: |-
      set -e
      V="$VLLM_ROOT"
      Q="$V/models/qwen4_exp/nvidia/qsa.py"
      test -f "$Q"
      test "$(grep -cF 'self.fuse_indexer_projection = vllm_config.lora_config is None' "$Q")" -eq 1
      python3 - <<'PY'
      import os
      p = os.path.join(os.environ["VLLM_ROOT"], "models/qwen4_exp/nvidia/qsa.py")
      src = open(p).read()
      old = "        self.fuse_indexer_projection = vllm_config.lora_config is None"
      new = (
          "        # spark-v33: an fp8-hybrid checkpoint must NOT fuse the indexer here. The fused\n"
          "        # wrapper's packed mapping then names indexer.index_qk_proj as a fourth shard of\n"
          "        # qkv_proj, but the checkpoint stores q/k/v as blockwise FP8 and the indexer in\n"
          "        # BF16, so the config's all-shards-FP8 test answers False for every QSA layer and\n"
          "        # AutoGPTQConfig refuses it outright:\n"
          "        #   \"Detected some but not all shards of ...layers.3.self_attn.qkv_proj are\n"
          "        #    quantized\"                              (the first fast-v33-bf16 boot)\n"
          "        # forward() keeps the unfused branch below, so q/k/v stay FP8 and the indexer\n"
          "        # keeps its checkpoint precision in its own linear. No weight is touched.\n"
          "        # The predicate takes the QKV prefix, not this layer's: _is_fp8_layer maps a\n"
          "        # fused name to its shards, and this layer ends in .self_attn.\n"
          "        self.fuse_indexer_projection = (\n"
          "            vllm_config.lora_config is None\n"
          "            and not getattr(quant_config, \"_is_fp8_layer\", lambda p: False)(\n"
          "                f\"{prefix}.qkv_proj\"\n"
          "            )\n"
          "        )"
      )
      assert src.count(old) == 1, src.count(old)
      src = src.replace(old, new)
      open(p, "w").write(src)
      import ast; ast.parse(src)
      PY
      grep -qF 'spark-v33: an fp8-hybrid checkpoint must NOT fuse the indexer' "$Q"
      python3 -c 'import ast,os; ast.parse(open(os.environ["VLLM_FILE"]).read())' </dev/null

  # qkv_packed_map_three_shards — the third half of the same decision, and it must move with the other
  # two: the packed map is what AutoGPTQConfig iterates when it asks "are all of this fused layer's
  # shards quantized". Narrowing it here is what makes the unfused QSA layer one precision class again.
  # The map is read live from the class, so no import order is implied.
  - name: "qkv_packed_map_three_shards"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/nvidia/model.py"
    pattern: '"qkv_proj": ["q_proj", "k_proj", "v_proj", "indexer.index_qk_proj"],'
    expect: 1
    marker: "spark-v33: the indexer is NOT a shard of qkv_proj"
    evidence: |-
      Base at its pin digest: exactly one four-shard `qkv_proj` listing in model.py (Qwen4ExpForCausalLM;
      Qwen4ExpForConditionalGeneration copies that same list by name, so one edit covers both), and zero
      in mtp.py — the MTP drafter already declares the three-shard form at :405, which is the
      independent witness that three shards is the correct shape rather than a shard dropped for
      convenience.

    cmd: |-
      set -e
      V="$VLLM_ROOT"
      M="$V/models/qwen4_exp/nvidia/model.py"
      test -f "$M"
      test "$(grep -cF '"qkv_proj": ["q_proj", "k_proj", "v_proj", "indexer.index_qk_proj"],' "$M")" -eq 1
      python3 - <<'PY'
      import os
      p = os.path.join(os.environ["VLLM_ROOT"], "models/qwen4_exp/nvidia/model.py")
      src = open(p).read()
      old = '        "qkv_proj": ["q_proj", "k_proj", "v_proj", "indexer.index_qk_proj"],'
      new = (
          '        # spark-v33: the indexer is NOT a shard of qkv_proj. Qwen4ExpQSAAttention keeps it\n'
          '        # separate whenever the checkpoint resolves to fp8-hybrid (qsa.py\'s\n'
          '        # fuse_indexer_projection); listing it here makes every QSA layer mixed-precision to\n'
          '        # AutoGPTQConfig and refuses the boot.\n'
          '        "qkv_proj": ["q_proj", "k_proj", "v_proj"],'
      )
      assert src.count(old) == 1, src.count(old)
      src = src.replace(old, new)
      open(p, "w").write(src)
      import ast; ast.parse(src)
      PY
      grep -qF 'spark-v33: the indexer is NOT a shard of qkv_proj' "$M"
      python3 -c 'import ast,os; ast.parse(open(os.environ["VLLM_FILE"]).read())' </dev/null

  # ple_hook_blazux — the §1 hook row: blazux's vllm_ple_mmap.py (graph-aware mmap + custom-op form), NOT the day-0 overlay (wrong class layout). The append names the class; Qwen4ExpPLEPinnedHostEmbedding stays untouched (fast_v33_draft.md §4).
  - name: "ple_hook_blazux"
    path: "/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/nvidia/ngram_embedding.py"
    pattern: "class Qwen4ExpNGramEmbedding"
