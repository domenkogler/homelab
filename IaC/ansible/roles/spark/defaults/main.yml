---
# role: spark — plan the NVMe layout for the DGX Spark GB10 (partition p2 → XFS for PLE/KV).
# Reference parent: spark/ansible/roles/spark-base/tasks/main.yml (standalone template —
# folded into IaC here, hardened per review 2026-09-14).

# ---- 1TB NVMe layout (HD-359, 2026-09-14) ----
# spark ships a 1TB self-encrypting NVMe. p1 EXT4 = OS/Docker/images; p2 XFS = the ENTIRE
# remainder — holds PLE tables + KV + compile caches AND the weights + overlay artifacts
# (spark_models_dir points at XFS so we never split or re-download across two filesystems).
spark_nvme_capacity_gb: 1024

# NVMe used for the AI data partition (the GB10 ships a single system NVMe; DGX OS normally
# owns /dev/nvme0n1p1 = EXT4 root; the AI data partition is p2 on the same disk = REMAINDER).
spark_nvme_data_disk: /dev/nvme0n1
spark_nvme_data_partition: /dev/nvme0n1p2
spark_xfs_mount: /mnt/spark_nvme

# Where the WEIGHTS + PLE overlays live (on the XFS data partition, NOT the OS EXT4) — so
# weights + tables + KV + compile caches all share the fast NVMe zone and the OS disk never
# bloat. Fallback dirs are created by the spark role under /mnt/spark_nvme.
spark_models_dir: "{{ spark_xfs_mount }}/models"
spark_overlays_dir: "{{ spark_xfs_mount }}/overlays"

# Headroom target for the full bench set (AWQ+PLE + NVFP4 + both PLE sidecars ≈ 331 GB).
# The spark role asserts p2 has ≥ this much FREE before download/deploy (re-download
# avoidance contract, HD-359).
spark_disk_headroom_gb: 180

# Guard: only partition/mkfs the data partition when EXPLICITLY allowed. DGX OS ships the disk
# formatted; a fresh-install safe default is to SKIP destructive partitioning unless operator
# sets this true (docs: deployment-ansible.md). Once marked, the role idempotently formats p2
# without further prompting (partition already exists → mount-only).
spark_partition_enable: false

xfs:
  device: "{{ spark_nvme_data_partition }}"
  mount_point: "{{ spark_xfs_mount }}"
  fstype: xfs
  mkfs_options: "-f -d agcount=16"
  mount_options: "noatime,nodiratime,logbufs=8,logbsize=256k,nobarrier"
  directories:
    - kv_cache
    - ples_int4
    - vllm_cache
    - triton_cache
    - models        # weights (AWQ/PLE/…) — on XFS, never EXT4 (1TB layout, HD-359)
    - overlays      # worker_image_quant.py / ple_layer_quant.py / connector_mrv2.py
  permissions: "0777"