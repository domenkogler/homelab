---
# roles/spark — DGX Spark (GB10) node prep.
# Hardened vs the standalone spark-base role (folded 2026-09-14):
#  * explicit spark_partition_enable gate (never auto-partition a fresh DGX OS disk)
#  * device-sanity guard before any parted/mkfs (never destroy the OS partition)
#  * HARD REFUSE when the target partition is the LIVE ROOT `/` (HD-363 live hit:
#    DGX OS put root on nvme0n1p2, which the old role thought was the XFS data partition)
#  * on-disk check uses the full data-partition device (not "p1 exists?"), and requires
#    the data partition to be the REMAINDER starting after the OS partition.

- name: Assert the data disk is a real NVMe device
  ansible.builtin.fail:
    msg: "spark_nvme_data_disk '{{ spark_nvme_data_disk }}' does not exist or is not a disk"
  when: spark_nvme_data_disk is not match('^/dev/nvme[0-9]+(n[0-9]+)?$')
  tags: [spark, disk]

- name: Gather lsblk for the data disk (JSON)
  ansible.builtin.command: "lsblk -J {{ spark_nvme_data_disk }}"
  register: lsblk_out
  changed_when: false
  # check-mode safe: command returns no stdout in --check; the assert below tolerates it
  tags: [spark, disk]

- name: Assert the data disk exists and is a disk (not a partition)
  block:
    - name: Assert the data disk exists and is a disk (not a partition)
      ansible.builtin.assert:
        that:
          - lsblk_out.rc == 0
          - (lsblk_out.stdout | from_json).blockdevices | length == 1
          - (lsblk_out.stdout | from_json).blockdevices[0].type == "disk"
        fail_msg: "{{ spark_nvme_data_disk }} is not a plain disk — refusing to partition"
  when: not ansible_check_mode
  tags: [spark, disk]

- name: HARD REFUSE — data partition must NOT be the live root /
  when: spark_partition_enable | bool
  block:
    - name: Check the data partition's current mountpoint
      ansible.builtin.command: "findmnt -no TARGET {{ spark_nvme_data_partition }}"
      register: data_part_mount
      failed_when: false
      changed_when: false
      tags: [spark, disk]

    - name: Fail if the data partition is mounted as /
      ansible.builtin.fail:
        msg: >-
          {{ spark_nvme_data_partition }} is mounted as the LIVE ROOT — refusing to partition/
          mkfs. On DGX OS, nvme0n1p2 = ext4 / (HD-363); the XFS data partition must be a
          DEDICATED p3 carved by the operator (offline shrink of p2). Set
          spark_nvme_data_partition to the real data partition, never the root FS.
      when: (data_part_mount.stdout | trim) == "/"
  tags: [spark, disk]

- name: Check whether the data partition (p3) already exists
  ansible.builtin.command: "blkid {{ spark_nvme_data_partition }}"
  register: p2_blkid
  changed_when: false
  failed_when: false
  tags: [spark, disk]

- name: Partition the data disk (create p3 as REMAINDER) — only when enabled
  when:
    - spark_partition_enable | bool
    - p2_blkid.rc != 0
  block:
    - name: Extract existing partition boundaries (sector-based, no float math)
      ansible.builtin.command: "parted -sm {{ spark_nvme_data_disk }} unit s print"
      register: parted_unit
      changed_when: false
      tags: [spark, disk]

    - name: Fail if the data partition already present/printed (defensive — blkid said absent)
      ansible.builtin.assert:
        that: >
          parted_unit.stdout_lines
          | reject('match', '^[0-9]+:.*$')
          | select('search', 'nvme[0-9]+n[0-9]+p3')
          | list | length == 0
        fail_msg: "p3 already exists but blkid missed it — refuse, manual check needed"
      tags: [spark, disk]

    - name: Compute p3 start = end of the LAST existing partition + 1 (sector row N:START:END:SIZE:...)
      ansible.builtin.set_fact:
        # parted -sm unit s print rows: "2:1050624s:944769023s:943718400s:ext4..." → END is field 3 (idx 2)
        spark_p3_start_s: "{{ ((parted_unit.stdout_lines | select('match', '^[0-9]+:.*$') | last | split(':'))[2] | replace('s','') | int) + 1 }}"
      changed_when: false
      tags: [spark, disk]
      when: spark_nvme_os_partition_end|default('') == ''

    - name: Create partition p3 = remainder (start = end of last partition + 1, to 100%)
      ansible.builtin.command: >
        parted -s -- {{ spark_nvme_data_disk }} mkpart primary xfs
        {{ spark_nvme_os_partition_end|default(spark_p3_start_s|string) }} 100%
      register: mkpart
      changed_when: true
      failed_when: false       # parted exits non-zero on some disks when the FS probe is inconclusive
      tags: [spark, disk]

    - name: Wait for p3 device node
      ansible.builtin.wait_for:
        path: "{{ spark_nvme_data_partition }}"
        timeout: 30
      tags: [spark, disk]

    - name: re-read partition table
      ansible.builtin.command: "partprobe {{ spark_nvme_data_disk }}"
      changed_when: false
      tags: [spark, disk]
  tags: [spark, disk]

- name: Format p3 as XFS (idempotent — only when it exists and has no FS)
  when:
    - p2_blkid.rc != 0
  ansible.builtin.filesystem:
    fstype: "{{ xfs.fstype }}"
    dev: "{{ spark_nvme_data_partition }}"
    opts: "{{ xfs.mkfs_options }}"
  become: true
  tags: [spark, disk]

- name: Create XFS mount point
  ansible.builtin.file:
    path: "{{ xfs.mount_point }}"
    state: directory
    mode: "0755"
  become: true
  tags: [spark, disk]

- name: Configure /etc/fstab for the XFS partition
  ansible.builtin.mount:
    path: "{{ xfs.mount_point }}"
    src: "{{ spark_nvme_data_partition }}"
    fstype: "{{ xfs.fstype }}"
    opts: "{{ xfs.mount_options }}"
    state: mounted
    dump: "0"
    passno: "2"
  become: true
  tags: [spark, disk]

- name: Create XFS subdirectories + permissions
  ansible.builtin.file:
    path: "{{ xfs.mount_point }}/{{ item }}"
    state: directory
    mode: "{{ xfs.permissions }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop: "{{ xfs.directories }}"
  become: true
  tags: [spark, disk]

# ---- 1TB layout + headroom contract (HD-359) ----
- name: Assert the data partition has ≥ spark_disk_headroom_gb free (re-download avoidance)
  ansible.builtin.command: "df -B1G --output=avail {{ xfs.mount_point }}"
  register: df_free
  changed_when: false
  failed_when: false   # not fatal on first pass (partition may not exist yet)
  tags: [spark, disk]

- name: Fail early if free space is under the headroom target
  ansible.builtin.assert:
    that:
      - df_free.stdout_lines | length > 0
      - (df_free.stdout_lines[-1] | trim | int) >= spark_disk_headroom_gb
    fail_msg: >-
      {{ xfs.mount_point }} free space ({{ df_free.stdout_lines[-1] | trim if df_free.stdout_lines else 'n/a' }} GiB) < required
      {{ spark_disk_headroom_gb }} GiB — the full bench set (AWQ+PLE + NVFP4 + sidecars ≈ 331 GB)
      won't fit without re-download. Check the NVMe is the expected 1 TB and p3 is the entire
      remainder.
  when: not ansible_check_mode and df_free.rc == 0
  tags: [spark, disk]

# ---- Headless operating contract (HD-364) ----
# DGX OS ships graphical.target + UNMASKED sleep targets; a headless box that idles
# WILL suspend and vanish at L2 (live hit 2026-09-14, deployment-manual.md §5.2).
# Enforcement is now idempotent IO here, toggle-able per host via `spark_headless`.
# (systemd module has no masked state — use systemctl mask/unmask directly.)
- name: Mask system sleep targets (headless contract — L2 blackout prevention)
  ansible.builtin.command: systemctl mask --now {{ item }}
  register: _mask
  changed_when: "'masked' in _mask.stdout + _mask.stderr"
  failed_when: _mask.rc != 0 and 'already masked' not in _mask.stderr
  loop: "{{ spark_headless_sleep_targets }}"
  become: true
  tags: [spark, headless]

- name: Set default boot target to multi-user (no graphical login — headless)
  ansible.builtin.command: systemctl set-default multi-user.target
  changed_when: false
  become: true
  when: spark_headless | bool
  tags: [spark, headless]

# LAN service binding at boot (HD-364 dashboard edge, live fix 2026-09-15): the
# spark-dashboard Traefik sidecar binds {{ spark_home_ip }}:11000/11002; at container
# start the interface/route may not be up yet, and an address that exists locally but
# not-yet-assigned fails with EADDRNOTAVAIL (``bind: cannot assign requested address``
# in the Traefik logs). oldsrv/Pi home edges set net.ipv4.ip_nonlocal_bind=1 for the
# same reason (traefik-internal binds the VIP). Make the dashboard bind deterministic.
- name: Allow binding local-but-not-yet-assigned IPs (ip_nonlocal_bind for LAN edges)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/dgx-lan-bind.conf
  become: true
  when: spark_headless | bool
  tags: [spark, headless]

- name: Unmask system sleep targets (non-headless reversal)
  ansible.builtin.command: systemctl unmask {{ item }}
  register: _unmask
  changed_when: "'unmasked' in _unmask.stdout + _unmask.stderr or 'Unmasked' in _unmask.stdout"
  failed_when: _unmask.rc != 0
  loop: "{{ spark_headless_sleep_targets }}"
  become: true
  when: not (spark_headless | bool)
  tags: [spark, headless]

# NOTE on the ANSIBLE USER: unlike preseed hosts, spark has no post_install.sh — the
# automation user + authorized_keys + sudoers are provisioned by the `common` role
# (roles/common/tasks/system.yml: user/key/sudoers), exactly like the VPS/Pi/nas/oldsrv.
# roles/spark therefore does NOT create users/keys — it only owns the DISK + XFS layout.
# (The standalone spark/ansible/roles/spark-bootstrap role + playbook are kept as the
#  template for first-contact ONLY; IaC's common role is the canonical path — see README.)