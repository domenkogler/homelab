---
# HP MicroServer Gen8 — ZFS storage server
ansible_host: 10.10.1.10           # VLAN 10 (Home) — static (Cockpit/NFS/NUT master)
# Physical uplink NIC for the network role netd units (systemd-networkd):
# eno1 = HP MicroServer Gen8 onboard NIC #1 -> CRS328 ether10 (SSOT switch_port_map nas-eno1).
# Port model (HD-310): Home (10) untagged + Mgmt (99) tagged on this NIC.
netd_phys_name: eno1
mgmt_ip: 10.10.99.10               # VLAN 99 (Management) — native
ilo_ip: 10.10.99.11                # iLO4 remote mgmt
ansible_user: ansible-admin        # created by preseed post_install.sh
# NUT: UPS MASTER — only host physically USB-wired to the PowerWalker
nut_mode: master
nut_driver: usbhid-ups
nut_serial: auto                    # USB HID auto-detect (no serial/RS-485)
shutdown_delay_seconds: 0           # power down immediately on critical
# SMTP relay (HD-54/Option B): SMTP2Go — dedicated transactional relay for NUT
# power-loss email. Credentials: smtp_login (Login) in 1Password. Only the
# master (nas) renders upssched-cmd that sends mail; clients keep the role default.
# Host/port derive from the SMTP2Go connection SSOT in group_vars/all.yml (smtp2go_*).
nut_smtp_server: "{{ smtp2go_host }}:{{ smtp2go_port }}"
# SSH identity: 1Password SSH agent + ~/.ssh/config (no key files on disk)
