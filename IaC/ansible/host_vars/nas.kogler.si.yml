---
# HP MicroServer Gen8 — ZFS storage server
ansible_host: 10.10.1.10           # VLAN 10 (Home) — static (Cockpit/NFS/NUT master)
# ==== Which config-manager owns this box ====
# MEASURED (`scripts/ansible/probe-net-manager.sh nas`, then the confirming reads): the uplink is
# owned by NEITHER NetworkManager NOR systemd-networkd. NetworkManager is installed and running but
# reports eno1 `unmanaged`; systemd-networkd is disabled+inactive while reading four unit files that
# name eno1; the address and the default route come from classic ifupdown — /etc/network/interfaces
# (`allow-hotplug eno1`, a dhcp iface) with dhcpcd running as its client and `eno1` listed in
# /run/network/ifstate. This is the fleet's THIRD state: a box managed by a path that is not one of
# the two config-managers (docs/network.md §Config-manager truth). It is managed — by ifupdown.
# While network_manager_target differs from network_manager, roles/network freezes every address and
# resolver leg here: an edit today writes files nothing reads.
# ⛔ Adopting NetworkManager here is an owner-present, lockout-class change (eno1 carries NFS, NUT
# and the Cockpit leg); the keyfile, the adoption order and the rescue path are the row's, not this
# file's.
network_manager: ifupdown
network_manager_target: NetworkManager     # owed: one manager fleet-wide, adopted in a window
mgmt_ip: 10.10.99.10               # VLAN 99 (Management) — native; RESERVED on the router side,
                                    # not configured on this host: the eno1.99 leg has no manager
                                    # that would apply it while network_manager is ifupdown
ilo_ip: 10.10.99.11                # iLO4 remote mgmt
ansible_user: ansible-admin        # created by preseed post_install.sh
# NUT: UPS MASTER — only host physically USB-wired to the PowerWalker
nut_mode: master
nut_driver: usbhid-ups
nut_serial: auto                    # USB HID auto-detect (no serial/RS-485)
shutdown_delay_seconds: 0           # power down immediately on critical
# SMTP relay: SMTP2Go — dedicated transactional relay for NUT
# power-loss email. Credentials: smtp_login (Login) in 1Password. Only the
# master (nas) renders upssched-cmd that sends mail; clients keep the role default.
# Host/port derive from the SMTP2Go connection SSOT in group_vars/all/ (smtp2go_*).
nut_smtp_server: "{{ smtp2go_host }}:{{ smtp2go_port }}"
# Wake-after-recharge (WoL, master-only): when mains returns and battery recharges to
# >= 90%, nas sends a WoL magic packet to oldsrv so it comes back automatically. oldsrv
# NIC enp0s31f6 supports WoL (wake-on g); BIOS S5 WoL setting is the remaining unknown.
nut_wake_enabled: true
nut_wake_charge: 80
nut_wake_macs:
  oldsrv: "70:85:c2:2d:6f:04"
# SSH identity: 1Password SSH agent + ~/.ssh/config (no key files on disk)

# Which vault item holds THIS host's Cockpit console password (roles/cockpit).
# Per-host on purpose: one shared item would give two management consoles the same password.
# Value lives only in 1Password; the host gets a sha512 crypt hash in /etc/shadow.
cockpit_maint_vault_item: nas-cockpit_login

# ---------------------------------------------------------------------------
# Samba family shares (roles/storage/tasks/samba.yml) — LOCAL tdbsam accounts.
# SSOT for "who can mount the NAS" is THIS list: a repo edit + one `--tags samba` converge,
# no directory sync and no VPS in the auth path — docs/storage-rejected.md, storage.md §Samba.
#   * vault_item is a `*_item:` registry key on purpose, so scripts/gate/check-vault-items.sh
#     sees the dependency (CONVENTIONS §2 item-reference coverage).
#   * `shell` is pinned only for the service account; `domen` keeps whatever login shell
#     the box already gives it, because that account also SSHes here (an interactive leg
#     an ansible.builtin.user task must not silently take away).
#   * `drive: false` = no `\\nas\<name>` private share — it is a share-login account, not
#     a person. Its share is `music` (storage_samba_music_valid_users below).
# Rotation: rotate the item in 1Password, then re-run with
#   -e storage_samba_password_force=domen   (a rotate alone reaches nothing — §2 rotation).
storage_samba_users:
  - { name: domen,  vault_item: smb-domen_login }
  - { name: shared, vault_item: smb-shared_login, shell: /usr/sbin/nologin, drive: false }
# The music share (the Lidarr root) is mounted with the shared service account, so
# no personal credential is typed on a family laptop / relative's machine.
storage_samba_music_valid_users: shared

