---
# Phase 1 home server: bare-metal Debian desktop
ansible_host: 10.10.99.30           # VLAN 99 (Management) — static
home_ip: 10.10.1.30                 # VLAN 10 (Home) — node IP (VRRP anchor)
dns_primary_ip: 10.10.1.30          # Technitium primary binds the node IP
ansible_user: ansible-admin        # created by preseed post_install.sh
homelab_mode: desktop
# NUT: UPS CLIENT (slave to nas) — delayed so alerts flush before powerdown
nut_mode: client
nut_host: nas.kogler.si             # NUT master endpoint
shutdown_delay_seconds: 60          # flush Grafana→n8n→Signal before critical shutdown
# HA failover (docs/smart-home-failover.md): Home-VLAN subinterface on the trunk —
# must match the network role's trunk interface (eth0.10) once static-IP/trunk lands.
ha_keepalived_interface: eth0.10
# Desktop GPU (roles/desktop): Intel HD 630 iGPU PCI BusID (Z270 board = 00:02.0).
desktop_igpu_busid: "PCI:0:2:0"
# SSH identity: 1Password SSH agent + ~/.ssh/config (no key files on disk)
# Homematic HmIP-RFUSB stick (standby RMat on this host, failover) — stable /dev/serial/by-id/
# path, filled at deployment with the actual symlink (KOPS-040 / HD-79).
homematic_usb_by_id: /dev/serial/by-id/usb-eQ-3__HmIP-RFUSB_##PLACEHOLDER##
