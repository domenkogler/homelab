---
# Home server: bare-metal Debian desktop
ansible_host: "{{ home_ip }}"      # VLAN 10 (Home) — the admin leg for EVERY runner
# The MANAGEMENT plane (VLAN 99) is sealed from the VPS site-to-site tunnel ON PURPOSE: the
# wg_s2s_vps.allowed_ips name no mgmt address for this host (least-access) and the router scopes
# its own SSH to the VLAN-99 subnet only — so a mgmt-anchored ansible_host is reachable only from
# a station physically on the Mgmt VLAN. Off-LAN admin is the HOME leg, as on pi/spark.
# Rule: docs/network-vpn.md §Reaching LAN nodes when away.
# ⚠ Do NOT "fix" reachability by widening AllowedIPs — the seal is the decision.
# ==== Which config-manager owns this box ====
# MEASURED, not assumed: `scripts/ansible/probe-net-manager.sh oldsrv` answers it from the live box
# (NetworkManager enabled+active holding the default route; systemd-networkd disabled+inactive).
# roles/network refuses a host where this declaration and the box disagree — and declares nothing
# on this host's behalf, because a role-level default is what made every render guard here read as
# satisfied while writing units nothing read. The three states a host may be in, and what each one
# commits the role to: docs/network.md §Config-manager truth.
# ⛔ This is not a NIC name and not a unit name: the Home parent is the interface
# ha_keepalived_interface names, and the profile that carries the addressing is nm_oldsrv_profile.
network_manager: NetworkManager
# Equal to network_manager = settled, nothing owed. A different value = an owner-present migration
# is owed and roles/network freezes every address/resolver leg here.
network_manager_target: NetworkManager
mgmt_ip: 10.10.99.30               # VLAN 99 (Management) — tagged leg
home_ip: "{{ oldsrv_home_ip }}"     # VLAN 10 (Home) node IP (VRRP anchor) — SSOT-derived
                                    # from the network_static_hosts lookup in all.yml;
                                    # no literal here to drift from the address SSOT
# DNS tier: resolver addresses are a SINGLE SSOT in group_vars/all/main.yml
# (dns_primary_ip = VPS public, dns_secondary_ip = oldsrv, dns_tertiary_ip = Pi).
# Never re-add a host-level dns_primary_ip: host_vars shadow the group var on this host and
# reintroduce the stale oldsrv-primary value.

# ==== This box's OWN resolver (what lands in /etc/resolv.conf) ====
# Own instance first (no hop, it is authoritative for this zone), the Pi tertiary as the rung that
# keeps this box naming things while its own container is down or still booting. The VPS primary is
# absent because it answers the LAN-only names not at all — docs/network-dns.md §Per-Instance Split-Horizon.
# ⛔ A resolver that floats with the VIP replaces the FIRST target, it does not add one — the two
# rows must agree, not race.
# Rendered as ONE comma-joined string on purpose: nmcli wants that form, and a single template that
# references two scalars cannot leave an unrendered `{{ … }}` in a live profile.
host_resolver_dns: "{{ [dns_secondary_ip, dns_tertiary_ip] | join(',') }}"

# The NetworkManager profile that ACTUALLY owns this box's uplink (installer-created; IaC modifies
# it, it does not render it).
# ⛔ This is the ONLY profile on this box that carries its addressing: systemd-networkd here is
# disabled + inactive, so a netd unit written for this host is inert by construction, whatever it
# is named. Pointing an address leg at a unit name instead of at this profile fixes nothing.
nm_oldsrv_profile: "Wired connection 1"
# ⚠ The keyfile on disk is the BARE profile name — the installer wrote it WITHOUT the `.nmconnection`
# suffix the Pi/spark keyfiles carry, so this path cannot be built by suffixing the profile name.
# A wrong path fails loud at the slurp (file not found), never silently.
nm_oldsrv_profile_path: "{{ nm_keyfile_dir }}/{{ nm_oldsrv_profile }}"
ansible_user: ansible-admin        # created by preseed post_install.sh
homelab_mode: desktop
# NUT: UPS CLIENT (slave to nas) — delayed so alerts flush before powerdown
nut_mode: client
nut_host: nas.kogler.si             # NUT master endpoint
shutdown_delay_seconds: 60          # flush Grafana→n8n→Signal before critical shutdown
# oldsrv is the biggest UPS load — halt at 75% charge to preserve battery for
# nas/pi (which ride to critical 20%). Policy: docs/hardware-ups.md.
nut_shutdown_charge_threshold: 75
# HA failover (docs/smart-home-failover.md): the Home-VLAN (10) interface keepalived
# VRRP runs on. oldsrv's Home IP 10.10.1.30/24 sits on the PARENT NIC enp0s31f6
# (untagged Home); only Mgmt is a VLAN child (enp0s31f6.99). There is no eth0.10 —
# keepalived must bind the real Home device.
ha_keepalived_interface: enp0s31f6
# Desktop GPU (roles/desktop): Intel HD 630 iGPU PCI BusID (Z270 board = 00:02.0).
desktop_igpu_busid: "PCI:0:2:0"
# SSH identity: 1Password SSH agent + ~/.ssh/config (no key files on disk)
# Homematic: LOCAL RF (HmIP-RFUSB + RaspberryMatic) is PARKED; the HmIP-HAP stays in cloud mode
# until an HmIP-RFUSB is bought. No `homematic_usb_by_id` here: raspberrymatic-standby is not in
# the oldsrv failover path (group_vars/home_servers.yml). If an RFUSB is added, set it to the
# stable /dev/serial/by-id path (NOT /dev/ttyACM0) and re-add the standby service.
# oldsrv ZFS pool `nvme` (Samsung 970 EVO 1 TB) — the by-id device the storage role uses to CREATE
# the pool on a fresh build; SSOT for the literal. Dataset layout is governed by roles/storage.
# The preseed leaves this disk raw (deployment-preseed.md) and the pool is created only on an
# explicitly fresh machine; the fail-loud guard blocks pool-create while this is unset or is still
# a placeholder.
storage_nvme_data_by_id: /dev/disk/by-id/nvme-eui.0025385b0143f12e   # Samsung 970 EVO 1 TB data disk

# ==== oldsrv joins headscale as a tailnet HOST node (docs/network-vpn.md) ====
# One host, P2P-first over the static public home IPv4, so remote dev survives a VPS outage.
# The join itself is scoped in roles/tailscale-node (no routes / no exit node / no TS SSH /
# no DNS takeover); WHO may reach it is the ACL's `tag:dev:443` rule, not anything here.
tailscale_node_enabled: true
tailscale_node_hostname: "{{ tailnet_oldsrv_node_name }}"
# headscale preauth key (API Credential, `credential` field), reusable + tag:dev.
# Manual-value creation path — the value is MINTED by headscale, never generated here:
#   docker exec headscale headscale preauthkeys create --user 2 --tags tag:dev \
#     --reusable --expiration 8760h -o json
# Lazy lookup: costs an `op` read only when roles/tailscale-node actually runs.
tailscale_node_authkey: "{{ lookup('community.general.onepassword', 'tailscale-oldsrv_api', field='credential', vault=op_vault) }}"
# The join guard compares the assigned address against this; per-host so the Pi's join cannot
# be compared against oldsrv's address by accident.
tailscale_node_expected_ip: "{{ tailnet_oldsrv_ip }}"

# Which vault item holds THIS host's Cockpit console password (roles/cockpit).
# Per-host on purpose: one shared item would give two management consoles the same password.
# Value lives only in 1Password; the host gets a sha512 crypt hash in /etc/shadow.
cockpit_maint_vault_item: oldsrv-cockpit_login


# ==== pi CODING SEAT (roles/seat) ====
# oldsrv IS the seat (services-ai.md §9b-1: the placement decision). Declare everything the
# cockpit needs here — pi-web user unit, its two drop-ins, the token env file, linger, tmux —
# or a rebuild loses it silently and `--check` cannot see it.
seat_enable: true


# ==== What this host's silent-failure collector watches (roles/monitoring) ====
# Watch unit RESULTS, not is-active: on a oneshot, is-active answers "inactive" whether the unit
# ran fine or failed and waits to retry, so a failure changes no series. A listed unit that is NOT
# installed reports result="missing" and alerts, so this list holds only units this host really
# runs. NUT units belong here for the same reason. → docs/observability.md §Silent-failure hygiene
monitoring_hygiene_units:
  - traefik-cert-pull.service
  - nut-monitor.service
  - nut-client.service

# The pair THIS host's edge loads: the path must be the destination directory of the pull script
# this host actually deploys. A 90-day pair sets the alert thresholds.
monitoring_hygiene_certs:
  - consumer: traefik-internal
    path: "/opt/traefik-internal/certs/{{ wildcard_cert_file }}"

# This host is a NUT CLIENT, and a unit result is not the claim "this client can reach the master":
# `upsmon` holds a dead upstream with its unit still `active`, so the two NUT units above say nothing
# about the client→master path. The collector runs the client's own read against the master named by
# the `nut` role's `nut_host`, so the question a converge's fail-loud client leg asks gets answered on
# every scrape. → docs/observability.md §Silent-failure hygiene
monitoring_hygiene_nut_masters:
  - "{{ nut_host }}"

# The RX 7600's counters reach VictoriaMetrics through this collector: the host ships no `rocm-smi` and
# no `amd_smi`, so sysfs is the only GPU telemetry source here (docs/observability.md §LLM token
# accounting rule 6; the same read the RX 7600 bench used, docs/services-ai-bench.md). Addressed by
# RENDER NODE, not card index — `card1` is probe order and can rename, `renderD129` is the node the
# Vulkan legs mount (`gpu_vulkan_render_node`), and /sys/class/drm/renderD129/device is the same PCI
# device the bench read. This is the GPU-counter half of the oldsrv serving-tier telemetry row; the
# engine-counter half is gated on `ai_tier_metrics_publish` and deploy-parked in that row.
monitoring_hygiene_gpus:
  - name: rx7600
    device: "/sys/class/drm/{{ gpu_vulkan_render_node | basename }}/device"

# No host-level alloy pin here. host_vars outrank group_vars, so even a null override would win
# and render `apt: name=alloy=` in roles/monitoring. The pin lives in group_vars/all/versions.yml;
# a host may deviate from it only with a real version value, never with an empty one.
