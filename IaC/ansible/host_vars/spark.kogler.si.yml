---
# Spark (DGX GB10) — NVIDIA ThinkStation PGX node.
# Headless AI inference tier (LLM serving + embeddings/rerank/STT/TTS plan). See
# docs/hardware-spark.md (role + bench plan) + spark/ (standalone reference stack).

ansible_host: "{{ spark_home_ip }}"     # VLAN 10 (Home) — SSH + inference endpoint (SSOT-derived)
mgmt_ip: "{{ spark_mgmt_ip }}"          # VLAN 99 (Management) — SSOT-derived; static reservation
ansible_user: ansible-admin         # provisioned on first touch (no preseed — DGX OS; see deployment-manual spark section)
homelab_mode: headless
# ==== Which config-manager owns this box ====
# MEASURED (`scripts/ansible/probe-net-manager.sh spark`): NetworkManager owns enP7s7 (Home, DHCP)
# and enP7s7.99 (tagged Mgmt) — the two keyfiles roles/network renders — AND systemd-networkd is
# still running alongside it. Two managers on one box is the refused shape (docs/network.md
# §Config-manager truth): networkd here reads unit files that name a NIC this box does not have, so
# it configures nothing while still being able to rewrite the box. roles/network removes those units
# and, when the measurement proves networkd holds no addressed or routed interface, disables and
# stops it — the drift is repaired by the converge that removes the dead renders, not remembered in
# a runbook.
network_manager: NetworkManager
network_manager_target: NetworkManager   # equal to the owner = settled; the second manager is the drift
# ==== This box's OWN resolver (what lands in /etc/resolv.conf) ====
# The oldsrv Technitium SECONDARY first, the Pi TERTIARY second. spark hosts no DNS instance, so
# there is no own-instance-first rung; the VPS PRIMARY is absent because it answers the LAN-only
# names not at all — docs/network-dns.md §Per-Instance Split-Horizon.
# Rendered as ONE comma-joined string on purpose: the keyfile `dns=` leg wants that form.
host_resolver_dns: "{{ [dns_secondary_ip, dns_tertiary_ip] | join(',') }}"
# Headless contract is enforced at converge: sleep masks + multi-user default.target.
# Group-var default is true; set false explicitly to keep the DGX graphical desktop.
spark_headless: true

# ==== This box joins headscale as the THIRD permitted home node (docs/network-vpn.md) ====
# WHY: the tailnet answer for this box's inference names is carried by the VPS edge node, so a
# control-plane outage there removes the names from every tailnet client while the engine behind
# them answers fine on the LAN. A node of the box's own keeps the endpoint reachable node-direct,
# with the VPS on the control plane only.
# WHAT THIS DOES NOT DO (enforced in roles/tailscale-node, not by a comment): no advertised
# routes, no exit node, no Tailscale SSH, no DNS takeover.
# WHO may reach it is the ACL's tcp/443 rule written on THIS node's address
# (templates/docker_services/headscale/policy.hujson.j2) — deliberately NOT a shared tag:
# `tag:dev` is the dev seat's surface and `tag:home-edge` is the Pi's, and an ACL grants by TAG,
# so borrowing either one would widen a rule written for another box. The key below therefore
# carries spark's OWN tag, and the tag that actually landed is READ BACK with
# `headscale nodes list` rather than trusted from the mint command — the tag decides whether the
# node sits in the `tagged-devices` user where `domen@kogler.si:*` cannot reach it.
# DEPLOY PREREQUISITE (the value is MINTED by headscale, never generated here):
#   docker exec headscale headscale preauthkeys create --user <id> --tags tag:spark \
#     --reusable --expiration 8760h -o json
# → store as 1Password `tailscale-spark_api` (API Credential, `credential` field) in
# Homelab-ansible, then join, read `headscale nodes list`, set `tailnet_spark_ip`
# (group_vars/all/main.yml) to the assigned address, re-converge. `tailnet_spark_ip` empty =
# spark-dashboard renders no tailnet listener and the ACL renders no grant, so a half-done join
# cannot leave a half-configured edge or an un-asked-for door behind.
tailscale_node_enabled: true
tailscale_node_hostname: "{{ tailnet_spark_node_name }}"
tailscale_node_authkey: "{{ lookup('community.general.onepassword', 'tailscale-spark_api', field='credential', vault=op_vault) }}"
# The join guard compares the assigned address against this; per-host so one node's join is
# never asserted against another box's address. Empty (the pre-join state) reads as
# "not yet asserted", not as "wrong".
tailscale_node_expected_ip: "{{ tailnet_spark_ip }}"

# ══ THE LLM CONFIG DIAL ══════════════════════════════════════════════════
# One var + one converge = a different engine config behind the SAME endpoint
# (llm.kogler.si), the SAME served id (spark/qwen3.8-flash-next) and the SAME
# bearer key. Valid names + every value each one renders: group_vars/spark.yml
# §LLM SERVING PROFILES; gate + evidence: docs/hardware-spark.md §LLM serving
# profiles; test loop: spark/llm-profiles/README.md.
#   reasoning     = certified B1 (AWQ W4A16 + PLE INT4 + MTP3)
#   graded        = same weights, fp8 KV (~1.7× slots) — needs an engine image pin and a
#                   re-cert before it is servable, NOT a flip of this var
#   fast          = NVFP4 weights, bf16 KV (1.35 × 262k) — UNCERTIFIED, no bench result here
#   fast-sglang   = second engine (SGLang) — unusable here: no image pin AND a single-Spark
#                   pool cannot hold the 262,144 window we serve
# Uncertified profiles need `spark_llm_allow_uncertified: true` alongside this.
# Flipping is NOT free: ~20 min boot (converge DETACHED), and the CLIENT window in
# scripts/harness/pi/models-spec.yml must be set to the profile's client_context_window.
spark_llm_profile: fast
spark_llm_allow_uncertified: false
# Big artifact downloads stay explicit: --tags spark-artifacts with
# -e spark_artifacts_fetch='["b1-awq","ple-int4","nvfp4-mixed","ple-nvfp4"]'
# ════════════════════════════════════════════════════════════════════════
# AI stack is NOT enabled: benches + winner-engine promotion are deploy-gated.
# spark.enabled flips to true in group_vars/home_servers.yml after bench certification.
# spark_partition_enable — operator-set true AFTER first-boot inspection.
# p2 is the live root: the role's HARD REFUSE guard protects it, so XFS data goes on p3
# (p3 start is auto-computed as end-of-p2 + 1; do not hardcode it).
spark_partition_enable: true