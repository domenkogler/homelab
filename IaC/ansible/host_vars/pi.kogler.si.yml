---
# Raspberry Pi 4 — Home Assistant (PRIMARY node), Technitium secondary DNS.
# Node FQDN: pi.kogler.si (ha.kogler.si = the VIP).
# Deployed via preseed like nas/oldsrv (preseed.cfg deferred — see
# deployment-preseed.md); managed by Ansible as ansible-admin. No Cockpit.
ansible_host: 10.10.1.20           # VLAN 10 (Home) — node IP (VRRP anchor, SSH)
mgmt_ip: 10.10.99.20              # VLAN 99 (Management) — static reg on the mgmt plane (Option A dual-homed)
# DNS tier: resolver addresses are a SINGLE SSOT in group_vars/all/main.yml
# (dns_primary_ip = VPS public, dns_secondary_ip = oldsrv, dns_tertiary_ip = Pi).
# Do not set a dns_secondary_ip host var here: it shadows the group var on this host.
# Host-side resolver: OWN instance first (the Pi is the tertiary), then oldsrv. The VPS primary
# is absent on purpose — authoritative for the public view only, so as a home resolver it answers
# NXDOMAIN for exactly the internal names this host exists to resolve.
# → docs/network-dns.md §Host-side resolver — what a box asks its OWN `/etc/resolv.conf`
# ⛔ Floating the resolver with the VIP REPLACES the first entry, it does not add one.
host_resolver_dns: "{{ [dns_tertiary_ip, dns_secondary_ip] | join(',') }}"
# ==== Which config-manager owns this box ====
# MEASURED (`scripts/ansible/probe-net-manager.sh pi`): NetworkManager enabled+active, holding eth0
# and the default route; systemd-networkd disabled+inactive. The two keyfiles below ARE this box's
# addressing, so the manager and the renderer are the same party — no dead-file class here, and the
# reason this host needs no nmcli leg. States + what each commits roles/network to:
# docs/network.md §Config-manager truth.
network_manager: NetworkManager
network_manager_target: NetworkManager   # equal to the owner = settled, nothing owed
ansible_user: ansible-admin        # created by preseed post_install.sh (like nas/oldsrv)
# NUT: UPS CLIENT (slave to nas) — power down immediately on critical
nut_mode: client
nut_host: nas.kogler.si             # NUT master endpoint
shutdown_delay_seconds: 0
# HA failover (docs/smart-home-failover.md): Home-VLAN access-port interface —
# the Pi is an access port on VLAN 10 (plain eth0, unlike oldsrv's trunk).
ha_keepalived_interface: eth0
# ==== The Pi joins headscale as the SECOND permitted home node (docs/network-vpn.md) ====
# With oldsrv's node alone, HA is unreachable from away whenever the box carrying the node is
# down. The Pi is the second node because it already runs `traefik-ha`, the HA standby edge.
# WHAT THIS DOES NOT DO (enforced in roles/tailscale-node, not by a comment): no advertised
# routes, no exit node, no Tailscale SSH, no LAN bridge, and NO DNS takeover — the last one
# is load-bearing here, not inherited caution: this box RUNS the Technitium TERTIARY that the
# IoT VLAN's DNS is dst-nat'd to (network-dns.md §The answer-plane model), so letting
# tailscaled rewrite /etc/resolv.conf would put a resolver in front of the service it serves.
# WHO may reach it is the ACL's `tag:home-edge:443` rule (policy.hujson.j2) — its OWN tag,
# never `tag:dev`. The tag is the reach surface, so the key below must carry tag:home-edge.
# DEPLOY PREREQUISITE (the value is MINTED by headscale, never generated here):
#   docker exec headscale headscale preauthkeys create --user <id> --tags tag:home-edge \
#     --reusable --expiration 8760h -o json
# → store as 1Password `tailscale-pi_api` (API Credential, `credential` field) in Homelab-ansible,
# then join, read `headscale nodes list`, set `tailnet_pi_ip` (group_vars/all/main.yml) to the
# assigned address, re-converge. `tailnet_pi_ip` empty = traefik-ha renders no tailnet listener,
# so a half-done join cannot leave a half-configured edge behind.
tailscale_node_enabled: true
tailscale_node_hostname: "{{ tailnet_pi_node_name }}"
tailscale_node_authkey: "{{ lookup('community.general.onepassword', 'tailscale-pi_api', field='credential', vault=op_vault) }}"
tailscale_node_expected_ip: "{{ tailnet_pi_ip }}"

# SSH identity: 1Password SSH agent + ~/.ssh/config (no key files on disk)
# Homematic: LOCAL RF (HmIP-RFUSB + RaspberryMatic) is PARKED — the HmIP-HAP stays in cloud mode.
# No `homematic_usb_by_id` here: `raspberrymatic` is not in the Pi deploy loop
# (group_vars/raspberry_pi.yml). If the stick is added, use a stable /dev/serial/by-id path — not
# /dev/ttyACM0, which renumbers — and re-add the service.
# ==== SSH access (roles/access) ====
# `admin` stays admitted while it is still used. Removal trigger = zero `admin` acceptances in
# `journalctl -u ssh`, then drop this line AND the account (docs/deployment-secrets.md §Who is
# authorized where, reversible-sequence steps 3-5). IaC never managed `admin`, so a converge
# cannot silently re-add it.
access_admit_extra: ['admin']


# ==== What this host's silent-failure collector watches (roles/monitoring) ====
# The result of the last run is the only signal that separates a healthy oneshot from a failing
# one, and NUT's units can read "active" while the client leg is broken. `traefik-cert-pull` is
# absent because this host pulls with ha-cert-sync: a unit that is not installed alerts on purpose.
monitoring_hygiene_units:
  - ha-cert-sync.service
  - nut-monitor.service
  - nut-client.service

# The ha-cert-sync.sh DST here is `/opt/traefik-ha/certs/` (hardcoded in that template, unlike
# oldsrv's var-derived one) and the pair carries the same 90-day wildcard.
monitoring_hygiene_certs:
  - consumer: traefik-ha
    path: "/opt/traefik-ha/certs/{{ wildcard_cert_file }}"

# This host is a NUT CLIENT: `nut-monitor`/`nut-client` stay `active` while the master is unreachable,
# so the unit results above do not answer "can this client read the master". The collector runs the
# client's own `upsc` against the master named by the `nut` role's `nut_host` — the same read a
# converge's fail-loud client leg makes, on every scrape. → docs/observability.md §Silent-failure hygiene
monitoring_hygiene_nut_masters:
  - "{{ nut_host }}"
