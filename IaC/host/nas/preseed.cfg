# =====================================================================
# DEBIAN PRESEED FOR HP MICROSERVER NAS (host nas.kogler.si)
# Headless NAS (HP MicroServer Gen8, HP iLO 4 environment, SLO)
# SSD boot + USB GRUB
#
# Lessons from the 2026-08-23 oldsrv install attempt are applied here:
#   - runtime by-id resolver in early_command (immune to serial typos and
#     to installer-env udev gaps)
#   - iwlwifi blacklist (no-op on the Gen8 — it has no WLAN NIC — but
#     keeps every homelab media identical)
#   - by-id paths stay in model_serial (ata-*) form; NEVER switch to
#     nvme-eui.* style ids (d-i minimal udev lacks them — found live
#     2026-08-23, journal §Phase 1a)
# =====================================================================

# ---------------------------------------------------------------------
# 1. Localization & Keyboard
# ---------------------------------------------------------------------
d-i debian-installer/locale string sl_SI.UTF-8
d-i keyboard-configuration/xkb-keymap select si

# ---------------------------------------------------------------------
# 2. Network Configuration (DHCP for Debian OS)
# ---------------------------------------------------------------------
# iLO 4 handles its own DHCP independently on its dedicated hardware port.
# This configures the Debian operating system interface to also use DHCP.
# The Gen8 has no WLAN NIC, so choose_interface auto cannot loop on a
# wireless dialog (the oldsrv failure class); the early_command blacklist
# below additionally guarantees a wired-only netcfg on any homelab media.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string nas
d-i netcfg/get_domain string kogler.si

# ---------------------------------------------------------------------
# 3. Mirror Settings
# ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ---------------------------------------------------------------------
# 3b. Runtime hardening: Wi-Fi off + OS-disk by-id auto-resolver
#
# module_blacklist on the kernel cmdline only helps if remembered at boot;
# this makes every future preseeded run wifi-free regardless:
d-i preseed/early_command string \
    echo blacklist iwlwifi > /etc/modprobe.d/blacklist-homelab.conf; \
    D=$(ls /dev/disk/by-id | grep '^ata-Crucial_CT525MX300SSD4' | grep -v part | head -n1); \
    if [ -n "$D" ]; then \
        echo "d-i partman-auto/disk string /dev/disk/by-id/$D" | debconf-set-selections; \
    fi; \
    U=$(ls /dev/disk/by-id | grep '^usb-' | grep -v part | head -n1); \
    if [ -n "$U" ]; then \
        echo "d-i grub-installer/bootdev string /dev/disk/by-id/$U" | debconf-set-selections; \
    fi
# NOTE: the early_command resolves the REAL model_serial by-id at load time
# and overrides the static line below — immune to serial typos AND to
# installer-env udev gaps. It also resolves the USB stick by-id for GRUB:
# under single-stick discipline the ONLY usb-* entry at install time IS the
# install medium, so GRUB lands on whichever stick booted the installer —
# and THAT stick then stays permanently as the Gen8 boot device (SSD SATA
# port is not boot-capable). The static values remain as fallback defaults.

# ---------------------------------------------------------------------
# 4. Partitioning (SSD for OS drive)
#    OS disk ONLY — the HDDs (tank/bulk ZFS pools) are intentionally never
#    shown to the installer; they arrive PRE-CREATED and EXPORTED from the
#    Pool-Creation Runbook (executed 2026-08-23, journal §Phase 1a) and are
#    imported post-boot (zpool import / Ansible storage role, import-only).
# ---------------------------------------------------------------------
# Model-serial by-id, LIVE-VERIFIED 2026-08-23 on the running system
# (SMART inventory over SSH — reports/smart-report-nas-20260823T105831.txt).
# ⚠ Do NOT switch to wwn-/eui-style ids: debian-installer's minimal udev
# does NOT create them all (found live 2026-08-23 on oldsrv → "no root
# filesystem" loop). ata-* model_serial links exist in every environment.
d-i partman-auto/disk string /dev/disk/by-id/ata-Crucial_CT525MX300SSD4_173818D02FF0
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true

# ---------------------------------------------------------------------
# 5. Account Security Configuration
# ---------------------------------------------------------------------
# Root login DISABLED (KOPS-044 / HD-80): `ansible-admin` has key-only SSH + NOPASSWD sudo,
# so no emergency root password is needed. Disabling root login removes the identical-
# placeholder-hash risk AND the extra attack surface vs a password-based root account.
# (If console recovery is needed: boot single-user / reset via ansible-admin sudo.)
d-i passwd/root-login boolean false

# ---------------------------------------------------------------------
# 6. Generic Ansible Admin user (no password)
# ---------------------------------------------------------------------
d-i passwd/user-fullname string Ansible Automation Account
d-i passwd/username string ansible-admin
d-i passwd/user-password-crypted password !

# ---------------------------------------------------------------------
# 7. Package Selection (Base System & OpenSSH — headless, no desktop)
# ---------------------------------------------------------------------
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl
d-i pkgsel/upgrade select safe-upgrade

# ---------------------------------------------------------------------
# 8. GRUB on the USB stick (static FALLBACK — early_command resolves the
#    actual booting stick's usb-* by-id at runtime)
# ---------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/disk/by-id/usb-Generic_Flash_Disk_C3EB7FE7-0:0

# ---------------------------------------------------------------------
# 9. Late Commands
# ---------------------------------------------------------------------
d-i preseed/late_command string \
    cp /cdrom/preseed/post_install.sh /target/tmp/post_install.sh; \
    chmod 755 /target/tmp/post_install.sh; \
    in-target /bin/bash /tmp/post_install.sh

d-i finish-installer/reboot_in_progress note
