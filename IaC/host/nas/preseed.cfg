# =====================================================================
# DEBIAN PRESEED FOR HP MICROSERVER GEN8 (PORT 5 SSD + USB BOOT + SLO)
# DEBIAN PRESEED CONFIGURATION FOR HEADLESS NAS (HP iLO 4 ENVIROMENT) 
# =====================================================================

# ---------------------------------------------------------------------
# 1. Localization & Keyboard
# ---------------------------------------------------------------------
d-i debian-installer/locale string sl_SI.UTF-8
d-i keyboard-configuration/xkb-keymap select si

# ---------------------------------------------------------------------
# 2. Network Configuration (DHCP for Debian OS)
# ---------------------------------------------------------------------
# iLO 4 handles its own DHCP independently on its dedicated hardware port.
# This configures the Debian operating system interface to also use DHCP.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string gen8
d-i netcfg/get_domain string kogler.si

# ---------------------------------------------------------------------
# 3. Mirror Settings
# ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ---------------------------------------------------------------------
# 4. Partitioning (SSD for OS drive)
# ---------------------------------------------------------------------
d-i partman-auto/disk string /dev/disk/by-id/ata-VNESI_MODEL_IN_SERIJSKO_SSD_STEVILKO
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true

# ---------------------------------------------------------------------
# 5. Account Security Configuration
# ---------------------------------------------------------------------
# Enable the root account. This password is ONLY for local/iLO console use.
d-i passwd/root-login boolean true

# ROOT PASSWORD: Change this hash! 
# (Generated via: mkpasswd -m sha-512 "YourSuperSecureEmergencyPassword")
d-i passwd/root-password-crypted password $6$rounds=40000$randomsaltstring$7F9eX8pZqK3vM1oN6bYmWxDcVuRtSgHjKlOiUyTrEwQqAaZsXdCfVbGnHjMkLlOiUyTrEwQqAaZsXdCfVbGnHjMkLlOiUyTrEwQ==

# ---------------------------------------------------------------------
# 6. Generic Ansible Admin user (no password)
# ---------------------------------------------------------------------
d-i passwd/user-fullname string Ansible Automation Account
d-i passwd/username string ansible-admin
d-i passwd/user-password-crypted password !

# ---------------------------------------------------------------------
# 7. Package Selection (Base System & OpenSSH)
# ---------------------------------------------------------------------
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl
d-i pkgsel/upgrade select safe-upgrade

# ---------------------------------------------------------------------
# 8. GRUB on USB key
# ---------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/disk/by-id/usb-VNESI_SERIJSKO_USB_KLJUCA

# ---------------------------------------------------------------------
# 9. Late Commands
# ---------------------------------------------------------------------
d-i preseed/late_command string \
    cp /cdrom/preseed/post_install.sh /target/tmp/post_install.sh; \
    chmod 755 /target/tmp/post_install.sh; \
    in-target /bin/bash /tmp/post_install.sh

d-i finish-installer/reboot_in_progress note