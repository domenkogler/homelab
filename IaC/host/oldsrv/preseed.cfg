# =====================================================================
# DEBIAN PRESEED FOR OLDSRV (host oldsrv.kogler.si)
# Bare-metal i7-7700K Docker host + family desktop (XFCE)
# NVMe 960 EVO 500 GB boot + ext4 root (light writes, 200 TBW)
# NVMe 970 EVO 1 TB is NOT offered to the installer — left raw for ZFS
# =====================================================================

# ---------------------------------------------------------------------
# 1. Localization & Keyboard
# ---------------------------------------------------------------------
d-i debian-installer/locale string sl_SI.UTF-8
d-i keyboard-configuration/xkb-keymap select si

# ---------------------------------------------------------------------
# 2. Network Configuration (DHCP for Debian OS — static via Ansible after)
# ---------------------------------------------------------------------
# Phase 1: trunk port on CRS328 = VLAN 99 (Management) native + VLAN 10/20/50 tagged.
# The Intel i350-T2 NIC gets DHCP from the router (VLAN 99 pool) during install;
# Ansible's network role assigns the static IP later.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string oldsrv
d-i netcfg/get_domain string kogler.si

# ---------------------------------------------------------------------
# 3. Mirror Settings
# ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ---------------------------------------------------------------------
# 4. Partitioning (OS disk only: 960 EVO 500 GB)
#
# ⚠️ CRITICAL: The Samsung SSD 970 EVO 1 TB (data disk) MUST NOT appear
# in partman-auto/disk. It is left completely raw for the ZFS pool "nvme"
# (imported post-boot, never auto-created by the installer).
# Only the 960 EVO 500 GB (light writes, ext4 root) is partitioned here.
#
# Replace <SERIAL> with the actual device serial (find via:
#   ls /dev/disk/by-id/ | grep nvme.*960.*EVO | head -1
# on the machine or from the BIOS).
# ---------------------------------------------------------------------
d-i partman-auto/disk string /dev/disk/by-id/nvme-Samsung_SSD_960_EVO_500GB_<SERIAL>
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true

# ---------------------------------------------------------------------
# 5. Account Security Configuration
# ---------------------------------------------------------------------
# Root login DISABLED (KOPS-044 / HD-80): `ansible-admin` has key-only SSH + NOPASSWD sudo,
# so no emergency root password is needed. Disabling root login removes the identical-
# placeholder-hash risk AND the extra attack surface vs a password-based root account.
# (If console recovery is needed: boot single-user / reset via ansible-admin sudo.)
d-i passwd/root-login boolean false

# ---------------------------------------------------------------------
# 6. Generic Ansible Admin user (no password — SSH key only)
# ---------------------------------------------------------------------
d-i passwd/user-fullname string Ansible Automation Account
d-i passwd/username string ansible-admin
d-i passwd/user-password-crypted password !

# ---------------------------------------------------------------------
# 7. Package Selection (Base System + OpenSSH + Desktop)
#    XFCE desktop (iGPU on Intel HD 630, dGPU RX 7600 reserved for Docker).
# ---------------------------------------------------------------------
tasksel tasksel/first multiselect standard, ssh-server, xfce-desktop
d-i pkgsel/include string sudo curl xorg lightdm
d-i pkgsel/upgrade select safe-upgrade

# ---------------------------------------------------------------------
# 8. GRUB on NVMe (960 EVO OS disk)
# ---------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/disk/by-id/nvme-Samsung_SSD_960_EVO_500GB_<SERIAL>

# ---------------------------------------------------------------------
# 9. Late Commands
# ---------------------------------------------------------------------
d-i preseed/late_command string \
    cp /cdrom/preseed/post_install.sh /target/tmp/post_install.sh; \
    chmod 755 /target/tmp/post_install.sh; \
    in-target /bin/bash /tmp/post_install.sh

d-i finish-installer/reboot_in_progress note