# =====================================================================
# DEBIAN PRESEED FOR NETCUP VPS (host vps.kogler.si)
# netcup RS 2000 G12 — AMD EPYC 9645 · 8 cores · 16 GB DDR5 ECC ·
# 512 GB NVMe SSD root · 2,5 GBit/s iface (flatrate)
# Headless public-edge box — Debian + Docker CE (NO Proxmox, NO ZFS)
# Remote provisioned via netcup SCP (custom ISO / netboot) — no iLO/USB.
# =====================================================================
#
# >>> BOOT METHOD (netcup) <<<
# netcup boots the Debian netinst ISO via SCP "Custom ISO / PXE".
# Point the installer at THIS file with the kernel cmdline:
#     preseed/url=<HTTPS_URL_TO_THIS_file>  (e.g. served from a Storage Box / GitHub raw)
# OR bake it into the ISO. The late_command below depends on the shared
# post_install.sh being reachable alongside this preseed — see Media layout note.
# =====================================================================

# ---------------------------------------------------------------------
# 1. Localization & Keyboard
# ---------------------------------------------------------------------
d-i debian-installer/locale string sl_SI.UTF-8
d-i keyboard-configuration/xkb-keymap select si

# ---------------------------------------------------------------------
# 2. Network Configuration
#    VPS uses DHCP by default at boot; Ansible's network role later pins
#    the static public IP. (netcup hands out the assigned IP via DHCP MAC.)
# ---------------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string vps
d-i netcfg/get_domain string kogler.si

# ---------------------------------------------------------------------
# 3. Mirror Settings
# ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ---------------------------------------------------------------------
# 4. Partitioning — SINGLE 512 GB NVMe root (ext4). No ZFS on the VPS.
#    (Data lives on Hetzner Storage Boxes; DBs/thumbs on VPS NVMe.)
# ---------------------------------------------------------------------
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true

# ---------------------------------------------------------------------
# 5. Account Security Configuration
#    Root login DISABLED (repo policy KOPS-044 / HD-80). `ansible-admin`
#    has key-only SSH + NOPASSWD sudo.
#    >>> CRITICAL: the SCP root password (set in the netcup panel before/at
#        install) is NOT carried into the installed system — the installer
#        boot trusts the answer below. Ensure the built-in SSH keys are
#        injected BEFORE this preseed is used, or you will be locked out.
# ---------------------------------------------------------------------
d-i passwd/root-login boolean false

# ---------------------------------------------------------------------
# 6. Generic Ansible Admin user (passwordless — SSH key only)
# ---------------------------------------------------------------------
d-i passwd/user-fullname string Ansible Automation Account
d-i passwd/username string ansible-admin
d-i passwd/user-password-crypted password !

# ---------------------------------------------------------------------
# 7. Package Selection (Base System & OpenSSH)
# ---------------------------------------------------------------------
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates
d-i pkgsel/upgrade select safe-upgrade

# ---------------------------------------------------------------------
# 8. GRUB on the NVMe (single disk)
# ---------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/nvme0n1

# ---------------------------------------------------------------------
# 9. Late Command — run the VPS-specific post_install.sh
#    NOTE: uses a VPS-specific script (no ai-debug, AllowUsers ansible-admin
#    only) because this box is PUBLIC. Do NOT use the shared post_install.sh,
#    which authorizes the LAN-only AI key. See IaC/host/vps/post_install.sh.
# ---------------------------------------------------------------------
d-i preseed/late_command string \
    cp /cdrom/preseed/post_install.sh /target/tmp/post_install.sh; \
    chmod 755 /target/tmp/post_install.sh; \
    in-target /bin/bash /tmp/post_install.sh

d-i finish-installer/reboot_in_progress note