# =====================================================================
# DEBIAN PRESEED FOR PI (host pi.kogler.si)
# Raspberry Pi 4 — Home Assistant PRIMARY node (Debian + HA Container)
# + RaspberryMatic/HmIP-RFUSB + Technitium secondary DNS
# + traefik-ha edge VIP
#
# Headless — NO desktop, NO Cockpit. Boots from microSD (no ZFS).
# All data is either in Git, regenerable, or re-syncs from the standby
# (oldsrv) — microSD has zero backup surface (see storage-zfs.md).
# =====================================================================

# ---------------------------------------------------------------------
# 1. Localization & Keyboard
# ---------------------------------------------------------------------
d-i debian-installer/locale string sl_SI.UTF-8
d-i keyboard-configuration/xkb-keymap select si

# ---------------------------------------------------------------------
# 2. Network Configuration (DHCP for Debian OS — static via Ansible after)
# ---------------------------------------------------------------------
# Pi is on VLAN 10 (Home) access port. DHCP from the router during install;
# Ansible's network role assigns static IP 10.10.1.20 later.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string pi
d-i netcfg/get_domain string kogler.si

# ---------------------------------------------------------------------
# 3. Mirror Settings
# ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ---------------------------------------------------------------------
# 4. Partitioning (microSD — whole disk, single partition)
#
# Raspberry Pi 4 boots from microSD (32–64 GB, recommended ≥ 32 GB).
# Device path depends on the SD card reader; typical on arm64 UEFI:
#   /dev/disk/by-id/mmc-<MMC_IDENT>_<PART>
# or /dev/mmcblk0 as fallback.
#
# Replace <MMC_IDENT> with the actual ID (find via:
#   ls /dev/disk/by-id/ | grep mmc | head -1
# after booting the installer).
# ---------------------------------------------------------------------
d-i partman-auto/disk string /dev/disk/by-id/mmc-<MMC_IDENT>
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true

# ---------------------------------------------------------------------
# 5. Account Security Configuration
# ---------------------------------------------------------------------
# Enable the root account. This password is ONLY for local console use.
d-i passwd/root-login boolean true

# ROOT PASSWORD: Change this hash!
# (Generated via: mkpasswd -m sha-512 "YourSuperSecureEmergencyPassword")
d-i passwd/root-password-crypted password $6$rounds=40000$randomsaltstring$7F9eX8pZqK3vM1oN6bYmWxDcVuRtSgHjKlOiUyTrEwQqAaZsXdCfVbGnHjMkLlOiUyTrEwQqAaZsXdCfVbGnHjMkLlOiUyTrEwQ==

# ---------------------------------------------------------------------
# 6. Generic Ansible Admin user (no password — SSH key only)
# ---------------------------------------------------------------------
d-i passwd/user-fullname string Ansible Automation Account
d-i passwd/username string ansible-admin
d-i passwd/user-password-crypted password !

# ---------------------------------------------------------------------
# 7. Package Selection (Base System + OpenSSH only)
#    HEADLESS — no desktop, no Cockpit.
#    HA Container + Technitium + RaspberryMatic run in Docker,
#    deployed by Ansible after install.
# ---------------------------------------------------------------------
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl
d-i pkgsel/upgrade select safe-upgrade

# ---------------------------------------------------------------------
# 8. GRUB on microSD
#    Raspberry Pi 4 uses UEFI firmware (edk2 / Raspberry Pi UEFI);
#    GRUB boots from the microSD.
# ---------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/disk/by-id/mmc-<MMC_IDENT>

# ---------------------------------------------------------------------
# 9. Late Commands
# ---------------------------------------------------------------------
d-i preseed/late_command string \
    cp /cdrom/preseed/post_install.sh /target/tmp/post_install.sh; \
    chmod 755 /target/tmp/post_install.sh; \
    in-target /bin/bash /tmp/post_install.sh

d-i finish-installer/reboot_in_progress note